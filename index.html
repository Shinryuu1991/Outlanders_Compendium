d uses its stat block from the\n<em>Bestiary of Morrowind<\/em>. It's friendly to you and your allies,\nobeys your commands and acts immediately after you on your turn. It\nvanishes after 1 minute, or when it drops to 0 Hit Points.<\/p>\n<\/li>\n<\/ul>\n<h3 id=\"items-magic-items--enchanted-weapons\">Enchanted Weapons<\/h3>\n<p>Enchanted weapons on Vvardenfell are named for their element and\ntheir shape: a Steel Flameblade is a steel dagger or shortsword that\nbursts into fire, and a Silver Sparkaxe is a silver war axe that\ncrackles with lightning.<\/p>\n<div class=\"tw\"><table><thead><tr><th>Element<\/th><th>Damage<\/th><\/tr><\/thead><tbody><tr><td>Flame<\/td><td>Fire<\/td><\/tr><tr><td>Shard<\/td><td>Cold<\/td><\/tr><tr><td>Spark<\/td><td>Lightning<\/td><\/tr><tr><td>Viper<\/td><td>Poison<\/td><\/tr><\/tbody><\/table><\/div>\n<p>The second half of the name gives the weapon's shape: -blade for\ndaggers and shortswords, -sword for longswords and broadswords, -axe,\n-mace, -mauler for warhammers, -slayer for claymores, -cleaver for\nbattle axes, -skewer for spears, -scythe for halberds and -star for\nthrowing stars.<\/p>\n<p>Each charge in one of these weapons holds one die of damage of its\nelement: a d6, or a d8 for a cruel weapon and a d10 for a dire one. When\nyou hit with it, you can spend charges, up to the most per hit shown\nbelow, deciding after the attack roll; the target takes one extra die of\nthe weapon's element for each, like a smite. A weapon holds twice as\nmany charges as it can spend at once, so a dire weapon's 10 charges are\ntwo hits of 5d10, or more smaller ones. The weapon never regains charges\non its own: only a filled soul gem can recharge it (see <a class=\"xref\" href=\"#guide-house-rules--soul-gems\">Soul Gems<\/a> in the <em>Player's\nGuide<\/em>).<\/p>\n<div class=\"tw\"><table><thead><tr><th>Grade<\/th><th>Soul<\/th><th>Example<\/th><th>Charges<\/th><th>Most per hit<\/th><th>Rarity<\/th><th>Price<\/th><\/tr><\/thead><tbody><tr><td class=\"first\">-bite<\/td><td>Petty<\/td><td>Firebite Dagger<\/td><td>2<\/td><td>1d6<\/td><td>Common<\/td><td>100 gp<\/td><\/tr><tr><td class=\"first\">-fang<\/td><td>Lesser<\/td><td>Shockfang War Axe<\/td><td>4<\/td><td>2d6<\/td><td>Common<\/td><td>250 gp<\/td><\/tr><tr><td class=\"first\">Plain<\/td><td>Common<\/td><td>Steel Viperblade<\/td><td>6<\/td><td>3d6<\/td><td>Uncommon<\/td><td>500 gp<\/td><\/tr><tr><td class=\"first\">Wild<\/td><td>Common<\/td><td>Wild Sparkblade<\/td><td>6<\/td><td>3d6, wild<\/td><td>Uncommon<\/td><td>400 gp<\/td><\/tr><tr><td class=\"first\">Cruel<\/td><td>Greater<\/td><td>Cruel Flameblade<\/td><td>8<\/td><td>4d8<\/td><td>Rare<\/td><td>5,000 gp<\/td><\/tr><tr><td class=\"first\">Dire<\/td><td>Grand<\/td><td>Dire Shardblade<\/td><td>10<\/td><td>5d10<\/td><td>Very Rare<\/td><td>Not sold<\/td><\/tr><\/tbody><\/table><\/div>\n<ul>\n<li>\n<p><strong>Price.<\/strong> Add the enchantment's price to the price of\nthe weapon and its material.<\/p>\n<\/li>\n<li>\n<p><strong>-bite and -fang weapons.<\/strong> A fang is the stronger\nbite. Firebite and Firefang weapons deal Fire damage, Shockbite and\nShockfang weapons Lightning, and Spiderbite and Spiderfang weapons\nPoison.<\/p>\n<\/li>\n<li>\n<p><strong>Wild.<\/strong> A wild weapon is a near miss, bound by an\nenchanter who almost failed (see <a class=\"xref\" href=\"#guide-house-rules--enchanting\">Enchanting<\/a> in the <em>Player's\nGuide<\/em>), and any grade can come out wild. It's cheaper because it's\nunreliable: when you spend charges, roll a d6. On a 1, they're wasted.\nOn a 6, the extra damage is doubled.<\/p>\n<\/li>\n<li>\n<p><strong>Arrows, bolts and stars.<\/strong> Flamearrows, Shardbolts,\nSparkstars and the rest hold 2 charges, which both go off when they hit:\n2d6 extra damage of their element. They're Uncommon and cost 50 gp each,\nand they're destroyed when they hit, like other ammunition.<\/p>\n<\/li>\n<\/ul>\n<h3 id=\"items-magic-items--scrolls\">Scrolls<\/h3>\n<p>On Vvardenfell, scrolls aren't written by spellcasters for\nspellcasters. They're inscribed so that anyone who can read can use one\n(see <a class=\"xref\" href=\"#guide-house-rules--inscribing-scrolls\">Inscribing Scrolls<\/a> in\nthe <em>Player's Guide<\/em>). The named scrolls below can't be\ninscribed, only found or bought.<\/p>\n<ul>\n<li>\n<p><strong>Reading a scroll<\/strong> takes a Magic action, and the\nscroll crumbles to dust afterwards.<\/p>\n<\/li>\n<li>\n<p><strong>Saving throws and attacks<\/strong> use DC 13 and +5 for\nCommon and Uncommon scrolls, DC 15 and +7 for Rare ones and DC 17 and +9\nfor Very Rare ones.<\/p>\n<\/li>\n<li>\n<p><strong>Concentration.<\/strong> If the effect needs Concentration,\nthe reader must concentrate on it, as for a spell.<\/p>\n<\/li>\n<li>\n<p><strong>Prices<\/strong> match the cost of having the same spell cast\n(see Chapter Four).<\/p>\n<\/li>\n<\/ul>\n<h4 id=\"items-magic-items--healing-and-protection\">Healing and Protection<\/h4>\n<div class=\"tw\"><table><thead><tr><th>Scroll<\/th><th>Effect<\/th><th>Rarity<\/th><th>Price<\/th><\/tr><\/thead><tbody><tr><td class=\"first\">Daydene's Panacea<\/td><td>Cures one common disease<\/td><td>Common<\/td><td>25 gp<\/td><\/tr><tr><td class=\"first\">The First or Second Barrier<\/td><td>+1 bonus to your AC for 1 minute<\/td><td>Common<\/td><td>25 gp<\/td><\/tr><tr><td class=\"first\">Daerir's Miracle<\/td><td>Cures one Blight disease<\/td><td>Common<\/td><td>50 gp<\/td><\/tr><tr><td class=\"first\">Healing<\/td><td>As Cure Wounds, on yourself<\/td><td>Common<\/td><td>50 gp<\/td><\/tr><tr><td class=\"first\">The Third to Sixth Barrier<\/td><td>+2 bonus to your AC for 1 minute<\/td><td>Uncommon<\/td><td>150 gp<\/td><\/tr><tr><td class=\"first\">Salen's Vivication<\/td><td>As Lesser Restoration, on yourself<\/td><td>Uncommon<\/td><td>150 gp<\/td><\/tr><tr><td class=\"first\">Tranasa's Spellmire<\/td><td>Advantage on saving throws against spells for 1 minute<\/td><td>Uncommon<\/td><td>150 gp<\/td><\/tr><tr><td class=\"first\">Warrior's Blessing<\/td><td>Regain 2d8 Hit Points, and add 1d4 to your attack rolls for 1 minute<\/td><td>Uncommon<\/td><td>150 gp<\/td><\/tr><tr><td class=\"first\">Corrupt Arcanix<\/td><td>As Dispel Magic<\/td><td>Uncommon<\/td><td>300 gp<\/td><\/tr><tr><td class=\"first\">Purity of Body<\/td><td>Cures every disease, Blight included, and you regain 4d8 Hit Points<\/td><td>Uncommon<\/td><td>300 gp<\/td><\/tr><tr><td class=\"first\">The Ninth Barrier<\/td><td>+3 bonus to your AC, and Resistance to Fire, Cold and Lightning damage, for 1 minute<\/td><td>Rare<\/td><td>1,000 gp<\/td><\/tr><\/tbody><\/table><\/div>\n<h4 id=\"items-magic-items--movement-senses-and-stealth\">Movement, Senses and Stealth<\/h4>\n<div class=\"tw\"><table><thead><tr><th>Scroll<\/th><th>Effect<\/th><th>Rarity<\/th><th>Price<\/th><\/tr><\/thead><tbody><tr><td class=\"first\">Ulm Juiceda's Feather<\/td><td>Doubles your carrying capacity for 1 hour<\/td><td>Common<\/td><td>25 gp<\/td><\/tr><tr><td class=\"first\">Celerity<\/td><td>As Longstrider, on yourself<\/td><td>Common<\/td><td>50 gp<\/td><\/tr><tr><td class=\"first\">Icarian Flight<\/td><td>See below<\/td><td>Common<\/td><td>50 gp<\/td><\/tr><tr><td class=\"first\">The Gambler's Prayer<\/td><td>Once in the next hour, reroll a d20 Test you've just made<\/td><td>Common<\/td><td>50 gp<\/td><\/tr><tr><td class=\"first\">The Mage's Eye<\/td><td>As Detect Magic<\/td><td>Common<\/td><td>50 gp<\/td><\/tr><tr><td class=\"first\">Tinur's Hoptoad<\/td><td>As Jump and Feather Fall, on yourself<\/td><td>Common<\/td><td>50 gp<\/td><\/tr><tr><td class=\"first\">Breva's Averted Eyes<\/td><td>As Invisibility, on yourself<\/td><td>Uncommon<\/td><td>150 gp<\/td><\/tr><tr><td class=\"first\">Golnara's Eye-Maze<\/td><td>As Pass without Trace, on yourself only<\/td><td>Uncommon<\/td><td>150 gp<\/td><\/tr><tr><td class=\"first\">Lliros' Glowing Eye<\/td><td>As Darkvision, on yourself<\/td><td>Uncommon<\/td><td>150 gp<\/td><\/tr><tr><td class=\"first\">Ondusi's Unhinging<\/td><td>As Knock<\/td><td>Uncommon<\/td><td>150 gp<\/td><\/tr><tr><td class=\"first\">Savage Might, The Dawn Sprite, Insight, The Oathfast or Heartwise<\/td><td>As Enhance Ability, on yourself, for Strength, Dexterity, Intelligence, Wisdom or Charisma<\/td><td>Uncommon<\/td><td>150 gp<\/td><\/tr><tr><td class=\"first\">Uth's Hand of Heaven<\/td><td>As Levitate, on yourself<\/td><td>Uncommon<\/td><td>150 gp<\/td><\/tr><tr><td class=\"first\">Daynar's Airy Bubble<\/td><td>As Water Breathing<\/td><td>Uncommon<\/td><td>300 gp<\/td><\/tr><tr><td class=\"first\">Selyn's Mist Slippers<\/td><td>As Water Walk<\/td><td>Uncommon<\/td><td>300 gp<\/td><\/tr><tr><td class=\"first\">Windform<\/td><td>As Invisibility and Levitate, on yourself<\/td><td>Uncommon<\/td><td>300 gp<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Icarian Flight.<\/strong> For 1 round, you can leap up to\n1,000 feet in any direction as part of your move. You land at the end of\nyour turn and take falling damage for the height you fell from, unless\nsomething slows your fall. The scroll's inventor, the Bosmer wizard\nTarhiel, tested it over Seyda Neen. He didn't use a second spell.<\/p>\n<h4 id=\"items-magic-items--attack-and-control\">Attack and Control<\/h4>\n<div class=\"tw\"><table><thead><tr><th>Scroll<\/th><th>Effect<\/th><th>Rarity<\/th><th>Price<\/th><\/tr><\/thead><tbody><tr><td class=\"first\">Didala's Knack<\/td><td>As Charm Person<\/td><td>Common<\/td><td>50 gp<\/td><\/tr><tr><td class=\"first\">Fphyggi's Gem-Feeder<\/td><td>Soul Trap one creature (see the Player's Guide)<\/td><td>Common<\/td><td>50 gp<\/td><\/tr><tr><td class=\"first\">Taldam's Scorcher, Drathis' Winter Guest or Inas' Chastening<\/td><td>A burst of Fire, Cold or Lightning, as the rings above<\/td><td>Common<\/td><td>50 gp<\/td><\/tr><tr><td class=\"first\">Sertises' Porphyry<\/td><td>As Hold Person<\/td><td>Uncommon<\/td><td>150 gp<\/td><\/tr><tr><td class=\"first\">Tevil's Peace<\/td><td>As Calm Emotions<\/td><td>Uncommon<\/td><td>150 gp<\/td><\/tr><tr><td class=\"first\">Elemental Burst: Fire, Frost or Shock<\/td><td>See below<\/td><td>Uncommon<\/td><td>300 gp<\/td><\/tr><tr><td class=\"first\">Psychic Prison<\/td><td>As Hold Person, and Soul Trap the target<\/td><td>Uncommon<\/td><td>300 gp<\/td><\/tr><tr><td class=\"first\">Lord Mhas' Vengeance<\/td><td>See below<\/td><td>Rare<\/td><td>1,000 gp<\/td><\/tr><tr><td class=\"first\">Greater Domination<\/td><td>As Dominate Person<\/td><td>Rare<\/td><td>2,000 gp<\/td><\/tr><\/tbody><\/table><\/div>\n<ul>\n<li>\n<p><strong>Elemental Burst.<\/strong> A sphere of fire, frost or\nlightning explodes at a point you choose within 150 feet. Each creature\nin a 15-foot radius makes a DC 13 Dexterity saving throw, taking 8d6\nFire, Cold or Lightning damage on a failure or half as much on a\nsuccess.<\/p>\n<\/li>\n<li>\n<p><strong>Lord Mhas' Vengeance.<\/strong> For 1 minute, you're clad in\nbound Daedric armour, which gives you AC 20, and you hold a bound battle\naxe with a +1 bonus. You don't need proficiency with either, and both\nvanish when the minute ends.<\/p>\n<\/li>\n<\/ul>\n<h4 id=\"items-magic-items--summoning-and-travel\">Summoning and Travel<\/h4>\n<div class=\"tw\"><table><thead><tr><th>Scroll<\/th><th>Effect<\/th><th>Rarity<\/th><th>Price<\/th><\/tr><\/thead><tbody><tr><td class=\"first\">Mark<\/td><td>See below<\/td><td>Common<\/td><td>50 gp<\/td><\/tr><tr><td class=\"first\">Summon Skeleton<\/td><td>Summon a skeleton<\/td><td>Common<\/td><td>50 gp<\/td><\/tr><tr><td class=\"first\">Almsivi Intervention<\/td><td>See below<\/td><td>Uncommon<\/td><td>150 gp<\/td><\/tr><tr><td class=\"first\">Divine Intervention<\/td><td>See below<\/td><td>Uncommon<\/td><td>150 gp<\/td><\/tr><tr><td class=\"first\">Messenger Scroll<\/td><td>Summon a scamp<\/td><td>Uncommon<\/td><td>150 gp<\/td><\/tr><tr><td class=\"first\">Leaguestep<\/td><td>See below<\/td><td>Rare<\/td><td>1,000 gp<\/td><\/tr><tr><td class=\"first\">Summon Flame or Frost Atronach<\/td><td>Summon a flame or frost atronach<\/td><td>Rare<\/td><td>2,000 gp<\/td><\/tr><tr><td class=\"first\">Milyn Faram's Scroll<\/td><td>Summon a daedroth<\/td><td>Very Rare<\/td><td>Not sold<\/td><\/tr><tr><td class=\"first\">Summon Golden Saint<\/td><td>Summon a golden saint<\/td><td>Very Rare<\/td><td>Not sold<\/td><\/tr><\/tbody><\/table><\/div>\n<ul>\n<li>\n<p><strong>Almsivi and Divine Intervention.<\/strong> You vanish and\nreappear at the nearest Tribunal Temple (Almsivi) or Imperial Cult\nshrine (Divine), as listed in Chapter Four. Willing creatures touching\nyou don't come with you. Neither works in the depths of Red Mountain or\nanywhere the gods' sight doesn't reach.<\/p>\n<\/li>\n<li>\n<p><strong>Mark and Leaguestep.<\/strong> A scroll of Mark sets your mark\nwhere you stand, replacing any mark you had. A scroll of Leaguestep\nteleports you, and only you, to your mark, as long as it's on the same\nplane.<\/p>\n<\/li>\n<li>\n<p><strong>Summons.<\/strong> Summoned creatures work as described for\nsummoning items, and stay for 1 minute.<\/p>\n<\/li>\n<\/ul>\n<h3 id=\"items-magic-items--magic-items-from-elsewhere\">Magic Items from Elsewhere<\/h3>\n<p>Every magic item in the <em>Dungeon Master's Guide<\/em> can turn up\non Vvardenfell, in an old tomb, a Dwemer ruin or an Imperial officer's\nbaggage. Most fit the island better with a local name: a <em>Ring of\nFree Action<\/em> might be a Ring of Salen's Vivication, and a <em>Cloak\nof Elvenkind<\/em> a Golnara's Eye-Maze cloak. The <em>Dungeon Master's\nGuide<\/em>'s spell scrolls work as normal too, though only the Mages\nGuild sells them.<\/p>\n"},{"id":"items-potions","t":"Potions","s":[{"id":"items-potions--potions-of-morrowind","t":"Potions of Morrowind","l":2},{"id":"items-potions--potion-grades","t":"Potion Grades","l":2},{"id":"items-potions--helpful-effects","t":"Helpful Effects","l":2},{"id":"items-potions--restoring-and-fortifying","t":"Restoring and Fortifying","l":3},{"id":"items-potions--resistances-and-cures","t":"Resistances and Cures","l":3},{"id":"items-potions--movement-and-senses","t":"Movement and Senses","l":3},{"id":"items-potions--harmful-effects","t":"Harmful Effects","l":2},{"id":"items-potions--special-brews","t":"Special Brews","l":2},{"id":"items-potions--contraband","t":"Contraband","l":3},{"id":"items-potions--brewing","t":"Brewing","l":2}],"h":"\n\n<div class=\"epigraph\">\n<p><em>“Every potion is a guess until somebody drinks it.”<\/em><\/p>\n<\/div>\n<div class=\"attribution\">\n<p>— An alchemist in Ald'ruhn<\/p>\n<\/div>\n<h3 id=\"items-potions--potions-of-morrowind\">Potions of Morrowind<\/h3>\n<p class=\"dropcap\">Every town on Vvardenfell has an alchemist, and most\nadventurers carry more potions than food. In the games, potions come in\ngrades, from a spoiled brew that does as much harm as good to an\nexclusive potion worth a month's wages. This chapter uses the same\ngrades.<\/p>\n<ul>\n<li>\n<p><strong>Drinking.<\/strong> Drinking a potion, or giving one to\nanother creature, takes a Bonus Action, as in the 2024 rules.<\/p>\n<\/li>\n<li>\n<p><strong>Grades.<\/strong> A potion's grade sets how strong it is, how\nlong it lasts and what it costs.<\/p>\n<\/li>\n<li>\n<p><strong>Effects.<\/strong> Every potion has one alchemical effect,\ndescribed in this chapter. Chapter Eight lists the two effects of each\ningredient, and which ingredients make each potion.<\/p>\n<\/li>\n<li>\n<p><strong>One at a time.<\/strong> Drinking a second potion with the\nsame effect while the first still lasts doesn't add to it. Use the\nbetter of the two.<\/p>\n<\/li>\n<\/ul>\n<h3 id=\"items-potions--potion-grades\">Potion Grades<\/h3>\n<div class=\"tw\"><table><thead><tr><th>Grade<\/th><th>Rarity<\/th><th>Price<\/th><th>Dice<\/th><th>Lasts<\/th><th>Save DC<\/th><\/tr><\/thead><tbody><tr><td class=\"first\">Spoiled<\/td><td>Common<\/td><td>5 gp<\/td><td>1d4 + 1<\/td><td>1 minute<\/td><td>10<\/td><\/tr><tr><td class=\"first\">Cheap<\/td><td>Common<\/td><td>20 gp<\/td><td>1d4 + 1<\/td><td>1 minute<\/td><td>11<\/td><\/tr><tr><td class=\"first\">Bargain<\/td><td>Common<\/td><td>50 gp<\/td><td>2d4 + 2<\/td><td>10 minutes<\/td><td>12<\/td><\/tr><tr><td class=\"first\">Standard<\/td><td>Uncommon<\/td><td>150 gp<\/td><td>4d4 + 4<\/td><td>1 hour<\/td><td>13<\/td><\/tr><tr><td class=\"first\">Quality<\/td><td>Rare<\/td><td>500 gp<\/td><td>8d4 + 8<\/td><td>4 hours<\/td><td>15<\/td><\/tr><tr><td class=\"first\">Exclusive<\/td><td>Very Rare<\/td><td>2,000 gp<\/td><td>10d4 + 20<\/td><td>8 hours<\/td><td>17<\/td><\/tr><\/tbody><\/table><\/div>\n<ul>\n<li>\n<p><strong>Dice<\/strong> are for effects that heal, harm or grant\nTemporary Hit Points. A Bargain Restore Health potion is the\n<em>Player's Handbook<\/em>'s Potion of Healing, and the higher grades\nmatch its greater, superior and supreme potions.<\/p>\n<\/li>\n<li>\n<p><strong>Lasts<\/strong> is how long an effect with a duration lasts.\nPotions never need Concentration.<\/p>\n<\/li>\n<li>\n<p><strong>Save DC<\/strong> is for harmful effects.<\/p>\n<\/li>\n<li>\n<p><strong>Spoiled<\/strong> potions work as Cheap ones, but each has a\nharmful side effect too, which the DM chooses from the harmful effects\ntable.<\/p>\n<\/li>\n<\/ul>\n<h3 id=\"items-potions--helpful-effects\">Helpful Effects<\/h3>\n<p>Any helpful effect can be bought as a potion at an alchemist, at the\nprice for its grade, unless the table says otherwise. Potions of Cheap\nto Standard grade are sold in most towns. Quality and Exclusive potions\nare found only in the great towns, at the Mages Guild and in the\nTelvanni towers.<\/p>\n<ul>\n<li>\n<p><strong>One of several.<\/strong> Fortify Body, Fortify Mind and\nResistance each cover several abilities or damage types. The alchemist\nchooses one when brewing, and the bottle carries Morrowind's name for\nit: a Fortify Body potion brewed for Strength is a Fortify Strength\npotion, and a Resistance potion brewed against fire is Resist Fire.<\/p>\n<\/li>\n<li>\n<p><strong>Ability names.<\/strong> Morrowind's attributes become D&amp;D\nabilities: Strength is Strength, Agility is Dexterity, Endurance is\nConstitution, Intelligence is Intelligence, Willpower is Wisdom and\nPersonality is Charisma.<\/p>\n<\/li>\n<\/ul>\n<h4 id=\"items-potions--restoring-and-fortifying\">Restoring and Fortifying<\/h4>\n<div class=\"tw\"><table><thead><tr><th>Effect<\/th><th>In a potion<\/th><\/tr><\/thead><tbody><tr><td>Restore Health<\/td><td>Regain Hit Points equal to the grade's dice<\/td><\/tr><tr><td>Restore Fatigue<\/td><td>Gain Temporary Hit Points equal to the grade's dice. While the potion lasts, you can't gain Exhaustion levels from travel, heat, cold or going without sleep. A Quality or Exclusive potion also removes 1 Exhaustion level<\/td><\/tr><tr><td>Restore Magicka<\/td><td>Regain one expended spell slot: level 1 for Cheap and Bargain, level 2 for Standard, level 3 for Quality, level 5 for Exclusive. Costs twice the usual price<\/td><\/tr><tr><td>Fortify Magicka<\/td><td>+1 bonus to your spell save DC and spell attack rolls, or +2 for Quality and Exclusive<\/td><\/tr><tr><td>Fortify Body<\/td><td>Advantage on ability checks with Strength, Dexterity or Constitution (Fortify Strength, Agility or Endurance). At Standard grade or better, also on that ability's saving throws<\/td><\/tr><tr><td>Fortify Mind<\/td><td>Advantage on ability checks with Intelligence, Wisdom or Charisma (Fortify Intelligence, Willpower or Personality). At Standard grade or better, also on that ability's saving throws<\/td><\/tr><tr><td>Fortify Speed<\/td><td>Your Speed increases by 10 feet, or 20 feet for Quality and Exclusive<\/td><\/tr><tr><td>Fortify Luck<\/td><td>Once while it lasts, you can reroll a d20 Test you've just made<\/td><\/tr><\/tbody><\/table><\/div>\n<h4 id=\"items-potions--resistances-and-cures\">Resistances and Cures<\/h4>\n<ul>\n<li>\n<p><strong>Resistance.<\/strong> Resistance to Fire, Cold, Lightning or\nPoison damage (Resist Fire, Frost, Shock or Poison).<\/p>\n<\/li>\n<li>\n<p><strong>Resist Magic.<\/strong> Advantage on saving throws against\nspells.<\/p>\n<\/li>\n<li>\n<p><strong>Resist Disease.<\/strong> Advantage on saving throws against\ncommon and Blight diseases.<\/p>\n<\/li>\n<li>\n<p><strong>Cure.<\/strong> Ends one common disease, the Poisoned and\nParalyzed conditions, and any Drain effect on you. Costs 25 gp.<\/p>\n<\/li>\n<li>\n<p><strong>Cure Blight Disease.<\/strong> Ends one Blight disease. Costs\n75 gp.<\/p>\n<\/li>\n<li>\n<p><strong>Dispel.<\/strong> As <em>Dispel Magic<\/em>, on yourself.<\/p>\n<\/li>\n<\/ul>\n<h4 id=\"items-potions--movement-and-senses\">Movement and Senses<\/h4>\n<div class=\"tw\"><table><thead><tr><th>Effect<\/th><th>In a potion<\/th><\/tr><\/thead><tbody><tr><td>Feather<\/td><td>Your carrying capacity doubles, your jump distances triple and you take no damage from falling<\/td><\/tr><tr><td>Levitate<\/td><td>As Levitate, on yourself<\/td><\/tr><tr><td>Water Breathing<\/td><td>You can breathe water, and you have a Swim Speed equal to your Speed<\/td><\/tr><tr><td>Water Walking<\/td><td>You can walk on liquid as if it were solid ground<\/td><\/tr><tr><td>Night Eye<\/td><td>Darkvision out to 60 feet<\/td><\/tr><tr><td>Invisibility<\/td><td>You have the Invisible condition until you attack, cast a spell or the potion ends<\/td><\/tr><tr><td>Detect<\/td><td>You sense Beasts, magic items and keys within 60 feet, and know where they are<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Sold, not brewed.<\/strong> Alchemists also sell two potions\nthat no ingredient on the island can make: Chameleon, which gives\nAdvantage on Dexterity (Stealth) checks, and Sanctuary, which gives\nAdvantage on Dexterity saving throws.<\/p>\n<h3 id=\"items-potions--harmful-effects\">Harmful Effects<\/h3>\n<p>Harmful effects turn up in poisons and as the side effects of spoiled\npotions. A creature subjected to one makes a Constitution saving throw\nagainst the potion's save DC. On a success, it takes half damage from a\ndamaging effect and ignores any other. Harmful effects last 1 minute,\nwhatever the grade, unless the table says otherwise.<\/p>\n<div class=\"tw\"><table><thead><tr><th>Effect<\/th><th>In a poison<\/th><\/tr><\/thead><tbody><tr><td>Poison<\/td><td>Poison damage equal to the grade's dice<\/td><\/tr><tr><td>Frost Damage<\/td><td>Cold damage equal to the grade's dice<\/td><\/tr><tr><td>Paralyze<\/td><td>The Paralyzed condition. Repeat the save at the end of each of your turns, ending the effect on a success<\/td><\/tr><tr><td>Drain Fatigue<\/td><td>Gain 1 Exhaustion level<\/td><\/tr><tr><td>Drain Magicka<\/td><td>Lose one unexpended spell slot, of the level Restore Magicka would restore<\/td><\/tr><tr><td>Drain Body<\/td><td>Disadvantage on ability checks and saving throws with Strength, Dexterity or Constitution, chosen when it's brewed<\/td><\/tr><tr><td>Drain Mind<\/td><td>Disadvantage on ability checks and saving throws with Intelligence, Wisdom or Charisma, chosen when it's brewed<\/td><\/tr><tr><td>Burden<\/td><td>Your Speed decreases by 10 feet<\/td><\/tr><\/tbody><\/table><\/div>\n<h3 id=\"items-potions--special-brews\">Special Brews<\/h3>\n<div class=\"tw\"><table><thead><tr><th>Brew<\/th><th>Effect<\/th><th>Price<\/th><\/tr><\/thead><tbody><tr><td class=\"first\">Potion of Fool's Luck<\/td><td>Almsivi Intervention, as the scroll in Chapter Five<\/td><td>150 gp<\/td><\/tr><tr><td class=\"first\">Mark potion<\/td><td>Sets your mark, as the scroll of Mark in Chapter Five<\/td><td>50 gp<\/td><\/tr><tr><td class=\"first\">Recall potion<\/td><td>Teleports you to your mark, as the scroll of Leaguestep in Chapter Five<\/td><td>1,000 gp<\/td><\/tr><tr><td class=\"first\">Telvanni Bug Musk<\/td><td>A perfume. Advantage on Charisma (Persuasion) checks for 1 hour<\/td><td>50 gp<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Drinks such as mazte, sujamma and flin are in Chapter Four.<\/p>\n<h4 id=\"items-potions--contraband\">Contraband<\/h4>\n<p>Moon sugar and skooma are banned on Vvardenfell, and carrying either\ncounts as carrying restricted goods (see Chapter Four). Moon sugar is a\ncrystal smuggled in from Elsweyr, where the Khajiit treat it as sacred.\nSkooma is moon sugar refined into a drug.<\/p>\n<p><strong>Skooma.<\/strong> For 1 hour after taking skooma, your Speed\nincreases by 10 feet and you have Advantage on Dexterity checks, but\nDisadvantage on Intelligence and Wisdom checks. When it wears off, you\ngain 1 Exhaustion level. Each time you take it, make a DC 12 Wisdom\nsaving throw. On a failure, you crave more, and you have Disadvantage on\nWisdom checks until you take more or finish three Long Rests without\nany. Smugglers sell it for about 100 gp a dose.<\/p>\n<h3 id=\"items-potions--brewing\">Brewing<\/h3>\n<p>Anyone with alchemy apparatus and the right ingredients can brew\ntheir own potions and poisons. The rules are in the <em>Player's\nGuide<\/em>: see <a class=\"xref\" href=\"#guide-house-rules--brewing-potions\">Brewing\nPotions<\/a>.<\/p>\n<p><strong>Selling your potions.<\/strong> Alchemists buy potions at half\nprice, like any other goods, but few will take more than three of the\nsame potion at a time.<\/p>\n"},{"id":"items-ingredients","t":"Ingredients","s":[{"id":"items-ingredients--alchemys-raw-materials","t":"Alchemy's Raw Materials","l":2},{"id":"items-ingredients--gathering-plants","t":"Gathering Plants","l":2},{"id":"items-ingredients--creature-parts","t":"Creature Parts","l":2},{"id":"items-ingredients--beasts-and-kwama","t":"Beasts and Kwama","l":3},{"id":"items-ingredients--daedra-undead-and-constructs","t":"Daedra, Undead and Constructs","l":3},{"id":"items-ingredients--plants","t":"Plants","l":2},{"id":"items-ingredients--ampoule-pod-to-heather","t":"Ampoule Pod to Heather","l":3},{"id":"items-ingredients--hypha-facia-to-willow-anther","t":"Hypha Facia to Willow Anther","l":3},{"id":"items-ingredients--minerals-food-and-other-goods","t":"Minerals, Food and Other Goods","l":2},{"id":"items-ingredients--minerals-and-gems","t":"Minerals and Gems","l":3},{"id":"items-ingredients--food-and-other-goods","t":"Food and Other Goods","l":3},{"id":"items-ingredients--mournhold-and-solstheim","t":"Mournhold and Solstheim","l":2},{"id":"items-ingredients--mournhold","t":"Mournhold","l":3},{"id":"items-ingredients--solstheim","t":"Solstheim","l":3},{"id":"items-ingredients--brewing-by-effect","t":"Brewing by Effect","l":2},{"id":"items-ingredients--potions","t":"Potions","l":3},{"id":"items-ingredients--poisons","t":"Poisons","l":3}],"h":"\n\n<div class=\"epigraph\">\n<p><em>“If it grows, crawls or bleeds on Vvardenfell, somebody has tried\nto brew it.”<\/em><\/p>\n<\/div>\n<div class=\"attribution\">\n<p>— A Mages Guild apprentice in Ald'ruhn<\/p>\n<\/div>\n<h3 id=\"items-ingredients--alchemys-raw-materials\">Alchemy's Raw Materials<\/h3>\n<p class=\"dropcap\">Everything on Vvardenfell goes into a potion sooner\nor later: flowers from the Ascadian Isles, fungus from the Bitter Coast,\nsalts from slain atronachs and the hearts of Daedra. This chapter lists\nevery ingredient in the games, with its price and its two effects.<\/p>\n<ul>\n<li>\n<p><strong>Two effects.<\/strong> Every ingredient has two alchemical\neffects, except bread and small kwama eggs, which have one. Everyone on\nthe island knows what an ingredient does. Chapter Seven explains each\neffect, and <a class=\"xref\" href=\"#guide-house-rules--brewing-potions\">Brewing Potions<\/a> in\nthe <em>Player's Guide<\/em> explains how to brew with them.<\/p>\n<\/li>\n<li>\n<p><strong>Brewing by Effect.<\/strong> Any two ingredients that share an\neffect make a potion, or a poison, with that effect. The <a class=\"xref\" href=\"#items-ingredients--brewing-by-effect\">table at the end of this chapter<\/a>\nlists the ingredients for each effect, cheapest first.<\/p>\n<\/li>\n<li>\n<p><strong>Eating them raw.<\/strong> As a Bonus Action, you can eat an\ningredient for its first effect, at Cheap grade. That's how most people\non the island take their hackle-lo.<\/p>\n<\/li>\n<li>\n<p><strong>Prices<\/strong> are what an alchemist charges, and they match\nthe drops in the <em>Bestiary of Morrowind<\/em>. Alchemists buy at half\nprice.<\/p>\n<\/li>\n<li>\n<p><strong>Harvesting<\/strong> creatures is described in the Player's\nGuide (see <a class=\"xref\" href=\"#guide-house-rules--harvesting\">Harvesting<\/a>). Gathering\nplants is described below.<\/p>\n<\/li>\n<\/ul>\n<h3 id=\"items-ingredients--gathering-plants\">Gathering Plants<\/h3>\n<p>A character can spend an hour foraging in one region. They make a DC\n10 Wisdom (Survival) check, with Advantage if they're proficient with an\nHerbalism Kit. On a success, they gather 1d4 portions of one plant that\ngrows there, plus 1d4 more for every 5 points by which they beat the DC.\nThe DM picks the plant, or the forager can choose one they're looking\nfor and accept a DC of 15.<\/p>\n<div class=\"tw\"><table><thead><tr><th>Region<\/th><th>Plants<\/th><\/tr><\/thead><tbody><tr><td>Bitter Coast<\/td><td>Ampoule pod, bungler's bane, coda flower, hypha facia, luminous russula, marshmerrow, muck, spore pod, violet coprinus<\/td><\/tr><tr><td>Ascadian Isles<\/td><td>Ash yam, black anther, comberry, heather, marshmerrow, saltrice, stoneflower petals, willow anther<\/td><\/tr><tr><td>West Gash<\/td><td>Chokeweed, comberry, corkbulb root, heather, roobrush, stoneflower petals<\/td><\/tr><tr><td>Grazelands<\/td><td>Gold kanet, heather, wickwheat<\/td><\/tr><tr><td>Ashlands and Molag Amur<\/td><td>Bittergreen petals, chokeweed, fire petal, red lichen, scathecraw, trama root<\/td><\/tr><tr><td>Azura's Coast and Sheogorad<\/td><td>Bittergreen petals, hackle-lo leaf, kresh fiber<\/td><\/tr><tr><td>Red Mountain<\/td><td>Fire petal<\/td><\/tr><tr><td>Caves<\/td><td>Black lichen, green lichen, luminous russula, violet coprinus<\/td><\/tr><tr><td>Solstheim<\/td><td>Belladonna berries, holly berries, wolfsbane petals<\/td><\/tr><tr><td>Mournhold<\/td><td>The planters of Mournhold's gardens hold golden sedge, horn lily, lloramor spines, meadow rye, nirthfly stalks, noble sedge, scrib cabbage, sweetpulp and timsa-come-by. Picking them is theft<\/td><\/tr><\/tbody><\/table><\/div>\n<h3 id=\"items-ingredients--creature-parts\">Creature Parts<\/h3>\n<h4 id=\"items-ingredients--beasts-and-kwama\">Beasts and Kwama<\/h4>\n<div class=\"tw\"><table><thead><tr><th>Ingredient<\/th><th>Price<\/th><th>Effects<\/th><th>From<\/th><\/tr><\/thead><tbody><tr><td class=\"first\">Alit hide<\/td><td>5 gp<\/td><td>Resistance; Detect<\/td><td>Alits<\/td><\/tr><tr><td class=\"first\">Crab meat<\/td><td>1 gp<\/td><td>Restore Fatigue; Fortify Luck<\/td><td>Mudcrabs<\/td><\/tr><tr><td class=\"first\">Dreugh wax<\/td><td>100 gp<\/td><td>Fortify Body; Drain Mind<\/td><td>Dreugh<\/td><\/tr><tr><td class=\"first\">Guar hide<\/td><td>5 gp<\/td><td>Drain Fatigue; Fortify Luck<\/td><td>Guar<\/td><\/tr><tr><td class=\"first\">Hound meat<\/td><td>2 gp<\/td><td>Restore Fatigue; Resist Magic<\/td><td>Nix-hounds<\/td><\/tr><tr><td class=\"first\">Kagouti hide<\/td><td>2 gp<\/td><td>Fortify Speed; Resist Disease<\/td><td>Kagouti<\/td><\/tr><tr><td class=\"first\">Kwama cuttle<\/td><td>2 gp<\/td><td>Resistance; Water Breathing<\/td><td>Kwama<\/td><\/tr><tr><td class=\"first\">Netch leather<\/td><td>1 gp<\/td><td>Fortify Body; Fortify Mind<\/td><td>Netch<\/td><\/tr><tr><td class=\"first\">Racer plumes<\/td><td>20 gp<\/td><td>Drain Mind; Levitate<\/td><td>Cliff racers<\/td><\/tr><tr><td class=\"first\">Rat meat<\/td><td>1 gp<\/td><td>Drain Magicka; Paralyze<\/td><td>Rats<\/td><\/tr><tr><td class=\"first\">Scales<\/td><td>2 gp<\/td><td>Water Walking; Water Breathing<\/td><td>Slaughterfish<\/td><\/tr><tr><td class=\"first\">Scrib jelly<\/td><td>10 gp<\/td><td>Cure; Cure Blight Disease<\/td><td>Scribs<\/td><\/tr><tr><td class=\"first\">Shalk resin<\/td><td>50 gp<\/td><td>Fortify Speed; Restore Fatigue<\/td><td>Shalks<\/td><\/tr><\/tbody><\/table><\/div>\n<h4 id=\"items-ingredients--daedra-undead-and-constructs\">Daedra, Undead and Constructs<\/h4>\n<div class=\"tw\"><table><thead><tr><th>Ingredient<\/th><th>Price<\/th><th>Effects<\/th><th>From<\/th><\/tr><\/thead><tbody><tr><td class=\"first\">Ash salts<\/td><td>25 gp<\/td><td>Drain Body; Cure Blight Disease<\/td><td>Ash creatures<\/td><\/tr><tr><td class=\"first\">Bonemeal<\/td><td>2 gp<\/td><td>Fortify Body; Drain Fatigue<\/td><td>Skeletons and tomb urns<\/td><\/tr><tr><td class=\"first\">Corprus weepings<\/td><td>50 gp<\/td><td>Restore Health; Fortify Luck<\/td><td>Corprus creatures<\/td><\/tr><tr><td class=\"first\">Daedra skin<\/td><td>200 gp<\/td><td>Fortify Body; Paralyze<\/td><td>Some Daedra; rarely sold<\/td><\/tr><tr><td class=\"first\">Daedra's heart<\/td><td>200 gp<\/td><td>Restore Magicka; Night Eye<\/td><td>Most Daedra<\/td><\/tr><tr><td class=\"first\">Ectoplasm<\/td><td>10 gp<\/td><td>Detect; Poison<\/td><td>Ghosts and spectres<\/td><\/tr><tr><td class=\"first\">Fire salts<\/td><td>100 gp<\/td><td>Poison; Resistance<\/td><td>Flame atronachs<\/td><\/tr><tr><td class=\"first\">Frost salts<\/td><td>75 gp<\/td><td>Restore Magicka; Resistance<\/td><td>Frost atronachs<\/td><\/tr><tr><td class=\"first\">Ghoul heart<\/td><td>150 gp<\/td><td>Paralyze; Cure<\/td><td>Ash ghouls<\/td><\/tr><tr><td class=\"first\">Scamp skin<\/td><td>10 gp<\/td><td>Drain Magicka; Cure<\/td><td>Scamps<\/td><\/tr><tr><td class=\"first\">Scrap metal<\/td><td>20 gp<\/td><td>Resistance; Fortify Mind<\/td><td>Dwemer constructs and ruins<\/td><\/tr><tr><td class=\"first\">Vampire dust<\/td><td>500 gp<\/td><td>Fortify Body; Resist Magic<\/td><td>Vampires<\/td><\/tr><tr><td class=\"first\">Void salts<\/td><td>100 gp<\/td><td>Restore Magicka; Resist Magic<\/td><td>Storm atronachs and winged twilights<\/td><\/tr><\/tbody><\/table><\/div>\n<h3 id=\"items-ingredients--plants\">Plants<\/h3>\n<h4 id=\"items-ingredients--ampoule-pod-to-heather\">Ampoule Pod to Heather<\/h4>\n<div class=\"tw\"><table><thead><tr><th>Ingredient<\/th><th>Price<\/th><th>Effects<\/th><\/tr><\/thead><tbody><tr><td class=\"first\">Ampoule pod<\/td><td>2 gp<\/td><td>Water Walking; Paralyze<\/td><\/tr><tr><td class=\"first\">Ash yam<\/td><td>1 gp<\/td><td>Fortify Body; Resist Disease<\/td><\/tr><tr><td class=\"first\">Bittergreen petals<\/td><td>5 gp<\/td><td>Fortify Mind; Invisibility<\/td><\/tr><tr><td class=\"first\">Black anther<\/td><td>2 gp<\/td><td>Resistance; Night Eye<\/td><\/tr><tr><td class=\"first\">Black lichen<\/td><td>2 gp<\/td><td>Drain Body; Resistance<\/td><\/tr><tr><td class=\"first\">Bungler's bane<\/td><td>1 gp<\/td><td>Burden; Dispel<\/td><\/tr><tr><td class=\"first\">Chokeweed<\/td><td>1 gp<\/td><td>Restore Fatigue; Cure<\/td><\/tr><tr><td class=\"first\">Coda flower<\/td><td>23 gp<\/td><td>Levitate; Poison<\/td><\/tr><tr><td class=\"first\">Comberry<\/td><td>2 gp<\/td><td>Drain Fatigue; Restore Magicka<\/td><\/tr><tr><td class=\"first\">Corkbulb root<\/td><td>5 gp<\/td><td>Cure; Restore Health<\/td><\/tr><tr><td class=\"first\">Fire petal<\/td><td>2 gp<\/td><td>Resistance; Resist Magic<\/td><\/tr><tr><td class=\"first\">Gold kanet<\/td><td>5 gp<\/td><td>Poison; Burden<\/td><\/tr><tr><td class=\"first\">Green lichen<\/td><td>1 gp<\/td><td>Fortify Mind; Cure<\/td><\/tr><tr><td class=\"first\">Hackle-lo leaf<\/td><td>30 gp<\/td><td>Restore Fatigue; Water Breathing<\/td><\/tr><tr><td class=\"first\">Heather<\/td><td>1 gp<\/td><td>Fortify Mind; Feather<\/td><\/tr><\/tbody><\/table><\/div>\n<h4 id=\"items-ingredients--hypha-facia-to-willow-anther\">Hypha Facia to Willow Anther<\/h4>\n<div class=\"tw\"><table><thead><tr><th>Ingredient<\/th><th>Price<\/th><th>Effects<\/th><\/tr><\/thead><tbody><tr><td class=\"first\">Hypha facia<\/td><td>1 gp<\/td><td>Drain Body; Detect<\/td><\/tr><tr><td class=\"first\">Kresh fiber<\/td><td>1 gp<\/td><td>Fortify Luck; Fortify Mind<\/td><\/tr><tr><td class=\"first\">Luminous russula<\/td><td>1 gp<\/td><td>Water Breathing; Poison<\/td><\/tr><tr><td class=\"first\">Marshmerrow<\/td><td>1 gp<\/td><td>Restore Health; Detect<\/td><\/tr><tr><td class=\"first\">Muck<\/td><td>1 gp<\/td><td>Drain Mind; Detect<\/td><\/tr><tr><td class=\"first\">Red lichen<\/td><td>25 gp<\/td><td>Night Eye; Cure<\/td><\/tr><tr><td class=\"first\">Roobrush<\/td><td>1 gp<\/td><td>Fortify Body; Cure<\/td><\/tr><tr><td class=\"first\">Saltrice<\/td><td>1 gp<\/td><td>Restore Fatigue; Restore Health<\/td><\/tr><tr><td class=\"first\">Scathecraw<\/td><td>2 gp<\/td><td>Drain Body; Cure<\/td><\/tr><tr><td class=\"first\">Spore pod<\/td><td>1 gp<\/td><td>Drain Fatigue; Paralyze<\/td><\/tr><tr><td class=\"first\">Stoneflower petals<\/td><td>1 gp<\/td><td>Fortify Body; Fortify Magicka<\/td><\/tr><tr><td class=\"first\">Trama root<\/td><td>10 gp<\/td><td>Fortify Mind; Levitate<\/td><\/tr><tr><td class=\"first\">Violet coprinus<\/td><td>1 gp<\/td><td>Water Walking; Poison<\/td><\/tr><tr><td class=\"first\">Wickwheat<\/td><td>1 gp<\/td><td>Restore Health; Fortify Mind<\/td><\/tr><tr><td class=\"first\">Willow anther<\/td><td>10 gp<\/td><td>Resistance; Cure<\/td><\/tr><\/tbody><\/table><\/div>\n<h3 id=\"items-ingredients--minerals-food-and-other-goods\">Minerals, Food and Other\nGoods<\/h3>\n<h4 id=\"items-ingredients--minerals-and-gems\">Minerals and Gems<\/h4>\n<div class=\"tw\"><table><thead><tr><th>Ingredient<\/th><th>Price<\/th><th>Effects<\/th><th>Found<\/th><\/tr><\/thead><tbody><tr><td class=\"first\">Diamond<\/td><td>250 gp<\/td><td>Invisibility; Resist Magic<\/td><td>Dwemer ruins and caves<\/td><\/tr><tr><td class=\"first\">Emerald<\/td><td>150 gp<\/td><td>Fortify Magicka; Restore Health<\/td><td>Dwemer ruins<\/td><\/tr><tr><td class=\"first\">Moon sugar<\/td><td>50 gp<\/td><td>Fortify Speed; Dispel<\/td><td>Smugglers' caves; contraband<\/td><\/tr><tr><td class=\"first\">Pearl<\/td><td>100 gp<\/td><td>Water Breathing; Resist Disease<\/td><td>Kollops on the sea floor<\/td><\/tr><tr><td class=\"first\">Raw adamantium<\/td><td>25 gp<\/td><td>Burden; Restore Magicka<\/td><td>Mines beneath Mournhold; see Chapter Three<\/td><\/tr><tr><td class=\"first\">Raw ebony<\/td><td>50 gp<\/td><td>Resistance; Fortify Speed<\/td><td>Ebony mines; see Chapter Three<\/td><\/tr><tr><td class=\"first\">Raw glass<\/td><td>50 gp<\/td><td>Drain Mind; Resistance<\/td><td>Glass mines; see Chapter Three<\/td><\/tr><tr><td class=\"first\">Raw stalhrim<\/td><td>300 gp<\/td><td>Frost Damage; Paralyze<\/td><td>Solstheim's barrows; needs a stalhrim pick<\/td><\/tr><tr><td class=\"first\">Ruby<\/td><td>200 gp<\/td><td>Poison; Feather<\/td><td>Dwemer ruins<\/td><\/tr><\/tbody><\/table><\/div>\n<h4 id=\"items-ingredients--food-and-other-goods\">Food and Other Goods<\/h4>\n<div class=\"tw\"><table><thead><tr><th>Ingredient<\/th><th>Price<\/th><th>Effects<\/th><th>Found<\/th><\/tr><\/thead><tbody><tr><td class=\"first\">Bloat<\/td><td>5 gp<\/td><td>Drain Magicka; Fortify Mind<\/td><td>Alchemists<\/td><\/tr><tr><td class=\"first\">Bread<\/td><td>1 gp<\/td><td>Restore Fatigue<\/td><td>Everywhere<\/td><\/tr><tr><td class=\"first\">Gravedust<\/td><td>1 gp<\/td><td>Drain Mind; Cure<\/td><td>Tombs and alchemists<\/td><\/tr><tr><td class=\"first\">Kwama egg, large<\/td><td>2 gp<\/td><td>Restore Fatigue; Paralyze<\/td><td>Egg mines<\/td><\/tr><tr><td class=\"first\">Kwama egg, small<\/td><td>1 gp<\/td><td>Restore Fatigue<\/td><td>Egg mines<\/td><\/tr><tr><td class=\"first\">Resin<\/td><td>10 gp<\/td><td>Restore Health; Resist Disease<\/td><td>Alchemists<\/td><\/tr><tr><td class=\"first\">Scrib jerky<\/td><td>5 gp<\/td><td>Restore Fatigue; Burden<\/td><td>Houses and traders<\/td><\/tr><tr><td class=\"first\">Scuttle<\/td><td>10 gp<\/td><td>Restore Fatigue; Feather<\/td><td>Houses and traders<\/td><\/tr><tr><td class=\"first\">Sload soap<\/td><td>50 gp<\/td><td>Fortify Body; Resistance<\/td><td>Alchemists<\/td><\/tr><\/tbody><\/table><\/div>\n<h3 id=\"items-ingredients--mournhold-and-solstheim\">Mournhold and Solstheim<\/h3>\n<h4 id=\"items-ingredients--mournhold\">Mournhold<\/h4>\n<div class=\"tw\"><table><thead><tr><th>Ingredient<\/th><th>Price<\/th><th>Effects<\/th><th>From<\/th><\/tr><\/thead><tbody><tr><td class=\"first\">Durzog meat<\/td><td>7 gp<\/td><td>Fortify Body; Drain Magicka<\/td><td>Durzogs<\/td><\/tr><tr><td class=\"first\">Golden sedge flowers<\/td><td>1 gp<\/td><td>Fortify Body; Water Breathing<\/td><td>Planters<\/td><\/tr><tr><td class=\"first\">Horn lily bulb<\/td><td>1 gp<\/td><td>Poison; Fortify Body<\/td><td>Planters<\/td><\/tr><tr><td class=\"first\">Lloramor spines<\/td><td>1 gp<\/td><td>Invisibility; Poison<\/td><td>Planters<\/td><\/tr><tr><td class=\"first\">Meadow rye<\/td><td>1 gp<\/td><td>Fortify Speed; Poison<\/td><td>Planters<\/td><\/tr><tr><td class=\"first\">Nirthfly stalks<\/td><td>1 gp<\/td><td>Fortify Speed; Burden<\/td><td>Planters<\/td><\/tr><tr><td class=\"first\">Noble sedge flowers<\/td><td>1 gp<\/td><td>Poison; Drain Body<\/td><td>Planters<\/td><\/tr><tr><td class=\"first\">Scrib cabbage<\/td><td>1 gp<\/td><td>Drain Mind; Poison<\/td><td>Planters<\/td><\/tr><tr><td class=\"first\">Sweetpulp<\/td><td>1 gp<\/td><td>Levitate; Restore Health<\/td><td>Planters<\/td><\/tr><tr><td class=\"first\">Timsa-come-by flowers<\/td><td>1 gp<\/td><td>Dispel; Drain Magicka<\/td><td>Planters<\/td><\/tr><\/tbody><\/table><\/div>\n<h4 id=\"items-ingredients--solstheim\">Solstheim<\/h4>\n<div class=\"tw\"><table><thead><tr><th>Ingredient<\/th><th>Price<\/th><th>Effects<\/th><th>From<\/th><\/tr><\/thead><tbody><tr><td class=\"first\">Bear pelt<\/td><td>2 gp<\/td><td>Drain Fatigue; Resist Disease<\/td><td>Bears<\/td><\/tr><tr><td class=\"first\">Belladonna berries<\/td><td>5 gp<\/td><td>Resist Magic; Fortify Magicka<\/td><td>Bushes, especially near barrows<\/td><\/tr><tr><td class=\"first\">Bristleback leather<\/td><td>2 gp<\/td><td>Drain Body; Frost Damage<\/td><td>Tusked bristlebacks<\/td><\/tr><tr><td class=\"first\">Grahl eyeball<\/td><td>15 gp<\/td><td>Night Eye; Fortify Body<\/td><td>Grahls<\/td><\/tr><tr><td class=\"first\">Gravetar<\/td><td>5 gp<\/td><td>Resistance; Restore Fatigue<\/td><td>Draugr<\/td><\/tr><tr><td class=\"first\">Heartwood<\/td><td>200 gp<\/td><td>Restore Magicka; Fortify Body<\/td><td>Spriggans, now and then<\/td><\/tr><tr><td class=\"first\">Holly berries<\/td><td>5 gp<\/td><td>Resistance; Frost Damage<\/td><td>Bushes<\/td><\/tr><tr><td class=\"first\">Horker tusk<\/td><td>5 gp<\/td><td>Fortify Magicka; Detect<\/td><td>Horkers<\/td><\/tr><tr><td class=\"first\">Wolf, snow wolf or snow bear pelt<\/td><td>2 gp<\/td><td>Fortify Speed; Night Eye<\/td><td>Wolves and snow bears<\/td><\/tr><tr><td class=\"first\">Wolfsbane petals<\/td><td>5 gp<\/td><td>Invisibility; Drain Magicka<\/td><td>Hvitkald Peak<\/td><\/tr><\/tbody><\/table><\/div>\n<h3 id=\"items-ingredients--brewing-by-effect\">Brewing by Effect<\/h3>\n<p>Any two ingredients in the same row make a potion, or a poison, with\nthat effect: see <a class=\"xref\" href=\"#guide-house-rules--brewing-potions\">Brewing Potions<\/a>\nin the <em>Player's Guide<\/em>. No two ingredients share both their\neffects, so every pair makes exactly one brew. Ingredients are listed\ncheapest first.<\/p>\n<h4 id=\"items-ingredients--potions\">Potions<\/h4>\n<div class=\"tw\"><table><thead><tr><th>Effect<\/th><th>Ingredients<\/th><\/tr><\/thead><tbody><tr><td>Restore Health<\/td><td>marshmerrow, saltrice, sweetpulp, wickwheat, corkbulb root, resin, corprus weepings, emerald<\/td><\/tr><tr><td>Restore Fatigue<\/td><td>bread, chokeweed, crab meat, saltrice, small kwama egg, hound meat, large kwama egg, gravetar, scrib jerky, scuttle, hackle-lo leaf, shalk resin<\/td><\/tr><tr><td>Restore Magicka<\/td><td>comberry, raw adamantium, frost salts, void salts, daedra's heart, heartwood<\/td><\/tr><tr><td>Fortify Magicka<\/td><td>stoneflower petals, belladonna berries, horker tusk, emerald<\/td><\/tr><tr><td>Fortify Body<\/td><td>ash yam, golden sedge flowers, horn lily bulb, netch leather, roobrush, stoneflower petals, bonemeal, durzog meat, grahl eyeball, sload soap, dreugh wax, daedra skin, heartwood, vampire dust<\/td><\/tr><tr><td>Fortify Mind<\/td><td>green lichen, heather, kresh fiber, netch leather, wickwheat, bittergreen petals, bloat, trama root, scrap metal<\/td><\/tr><tr><td>Fortify Speed<\/td><td>meadow rye, nirthfly stalks, kagouti hide, wolf or snow bear pelt, moon sugar, raw ebony, shalk resin<\/td><\/tr><tr><td>Fortify Luck<\/td><td>crab meat, kresh fiber, guar hide, corprus weepings<\/td><\/tr><tr><td>Resistance<\/td><td>black anther, black lichen, fire petal, kwama cuttle, alit hide, gravetar, holly berries, willow anther, scrap metal, raw ebony, raw glass, sload soap, frost salts, fire salts<\/td><\/tr><tr><td>Resist Magic<\/td><td>fire petal, hound meat, belladonna berries, void salts, diamond, vampire dust<\/td><\/tr><tr><td>Resist Disease<\/td><td>ash yam, bear pelt, kagouti hide, resin, pearl<\/td><\/tr><tr><td>Cure<\/td><td>chokeweed, gravedust, green lichen, roobrush, scathecraw, corkbulb root, scamp skin, scrib jelly, willow anther, red lichen, ghoul heart<\/td><\/tr><tr><td>Cure Blight Disease<\/td><td>scrib jelly, ash salts<\/td><\/tr><tr><td>Water Breathing<\/td><td>golden sedge flowers, luminous russula, kwama cuttle, scales, hackle-lo leaf, pearl<\/td><\/tr><tr><td>Water Walking<\/td><td>violet coprinus, ampoule pod, scales<\/td><\/tr><tr><td>Levitate<\/td><td>sweetpulp, trama root, racer plumes, coda flower<\/td><\/tr><tr><td>Feather<\/td><td>heather, scuttle, ruby<\/td><\/tr><tr><td>Night Eye<\/td><td>black anther, wolf or snow bear pelt, grahl eyeball, red lichen, daedra's heart<\/td><\/tr><tr><td>Invisibility<\/td><td>lloramor spines, bittergreen petals, wolfsbane petals, diamond<\/td><\/tr><tr><td>Detect<\/td><td>hypha facia, marshmerrow, muck, alit hide, horker tusk, ectoplasm<\/td><\/tr><tr><td>Dispel<\/td><td>bungler's bane, timsa-come-by flowers, moon sugar<\/td><\/tr><\/tbody><\/table><\/div>\n\n\n<h4 id=\"items-ingredients--poisons\">Poisons<\/h4>\n<div class=\"tw\"><table><thead><tr><th>Effect<\/th><th>Ingredients<\/th><\/tr><\/thead><tbody><tr><td>Poison<\/td><td>horn lily bulb, lloramor spines, luminous russula, meadow rye, noble sedge flowers, scrib cabbage, violet coprinus, gold kanet, ectoplasm, coda flower, fire salts, ruby<\/td><\/tr><tr><td>Frost Damage<\/td><td>bristleback leather, holly berries, raw stalhrim<\/td><\/tr><tr><td>Paralyze<\/td><td>rat meat, spore pod, ampoule pod, large kwama egg, ghoul heart, daedra skin, raw stalhrim<\/td><\/tr><tr><td>Drain Fatigue<\/td><td>spore pod, bear pelt, bonemeal, comberry, guar hide<\/td><\/tr><tr><td>Drain Magicka<\/td><td>rat meat, timsa-come-by flowers, bloat, wolfsbane petals, durzog meat, scamp skin<\/td><\/tr><tr><td>Drain Body<\/td><td>hypha facia, noble sedge flowers, black lichen, bristleback leather, scathecraw, ash salts<\/td><\/tr><tr><td>Drain Mind<\/td><td>gravedust, muck, scrib cabbage, racer plumes, raw glass, dreugh wax<\/td><\/tr><tr><td>Burden<\/td><td>bungler's bane, nirthfly stalks, gold kanet, scrib jerky, raw adamantium<\/td><\/tr><\/tbody><\/table><\/div>\n"}]},{"key":"materials","title":"Materials of Morrowind","short":"Materials","sub":"Quick reference for weapons, armour and shields","chapters":[{"id":"materials-weapon-materials","t":"Weapon Materials","s":[],"h":"\n<p>A material never changes a weapon's damage or properties. The better\nones add a bonus to attack and damage rolls, like a +1, +2 or +3\nweapon.<\/p>\n<div class=\"tw\"><table>\n\n<thead>\n<tr>\n<th>Material<\/th>\n<th>Bonus<\/th>\n<th>Rarity<\/th>\n<th>Price<\/th>\n<th>Silver<\/th>\n<th>What it does<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Chitin<\/strong><\/td>\n<td>—<\/td>\n<td>Common<\/td>\n<td>Half<\/td>\n<td>—<\/td>\n<td>Half weight. Wears out fast<\/td>\n<\/tr>\n<tr>\n<td><strong>Iron<\/strong><\/td>\n<td>—<\/td>\n<td>Common<\/td>\n<td>Half<\/td>\n<td>—<\/td>\n<td>Wears out fast. Includes riekling weapons<\/td>\n<\/tr>\n<tr>\n<td><strong>Steel<\/strong><\/td>\n<td>—<\/td>\n<td>Common<\/td>\n<td>As listed<\/td>\n<td>—<\/td>\n<td>The standard: Imperial, Nordic and huntsman weapons<\/td>\n<\/tr>\n<tr>\n<td><strong>Bonemold<\/strong><\/td>\n<td>—<\/td>\n<td>Common<\/td>\n<td>×4<\/td>\n<td>—<\/td>\n<td>Bows and ammunition only<\/td>\n<\/tr>\n<tr>\n<td><strong>Silver<\/strong><\/td>\n<td>—<\/td>\n<td>Common<\/td>\n<td>+100 gp<\/td>\n<td>Yes<\/td>\n<td>Silvered steel: the cheapest way to hurt a ghost<\/td>\n<\/tr>\n<tr>\n<td><strong>Dreugh<\/strong><\/td>\n<td>+1<\/td>\n<td>Uncommon<\/td>\n<td>500 gp<\/td>\n<td>—<\/td>\n<td>Clubs and staffs only<\/td>\n<\/tr>\n<tr>\n<td><strong>Dwemer<\/strong><\/td>\n<td>+1<\/td>\n<td>Uncommon<\/td>\n<td>750 gp<\/td>\n<td>—<\/td>\n<td>Salvaged from ruins; trade is restricted<\/td>\n<\/tr>\n<tr>\n<td><strong>Orcish<\/strong><\/td>\n<td>+1<\/td>\n<td>Uncommon<\/td>\n<td>800 gp<\/td>\n<td>—<\/td>\n<td>Mostly heavy axes and hammers<\/td>\n<\/tr>\n<tr>\n<td><strong>Nordic silver<\/strong><\/td>\n<td>+1<\/td>\n<td>Uncommon<\/td>\n<td>1,000 gp<\/td>\n<td>Yes<\/td>\n<td>Made on Solstheim<\/td>\n<\/tr>\n<tr>\n<td><strong>Adamantium<\/strong><\/td>\n<td>+1<\/td>\n<td>Uncommon<\/td>\n<td>1,200 gp<\/td>\n<td>Yes<\/td>\n<td>Hits on objects are Critical Hits; no wear on a 1<\/td>\n<\/tr>\n<tr>\n<td><strong>Glass<\/strong><\/td>\n<td>+2<\/td>\n<td>Rare<\/td>\n<td>5,000 gp<\/td>\n<td>Yes<\/td>\n<td>Half weight<\/td>\n<\/tr>\n<tr>\n<td><strong>Ebony<\/strong><\/td>\n<td>+2<\/td>\n<td>Rare<\/td>\n<td>6,000 gp<\/td>\n<td>Yes<\/td>\n<td>Twice the weight<\/td>\n<\/tr>\n<tr>\n<td><strong>Stalhrim<\/strong><\/td>\n<td>+2<\/td>\n<td>Rare<\/td>\n<td>7,500 gp<\/td>\n<td>Yes<\/td>\n<td>Hits can deal Cold damage instead<\/td>\n<\/tr>\n<tr>\n<td><strong>Daedric<\/strong><\/td>\n<td>+3<\/td>\n<td>Very Rare<\/td>\n<td>40,000 gp<\/td>\n<td>Yes<\/td>\n<td>Three times the weight<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><div class=\"note\">\n<p><strong>Prices.<\/strong> Common materials change the weapon's listed\nprice. Uncommon and rarer ones cost the same whatever the weapon: a\nglass dagger costs as much as a glass claymore.<\/p>\n<\/div><\/li>\n<li><div class=\"note\">\n<p><strong>Not magical.<\/strong> <em>Detect Magic<\/em> doesn't find rare\nmaterials, but they can still be enchanted. A material's bonus doesn't\nadd to a magic weapon's bonus: use the higher one.<\/p>\n<\/div><\/li>\n<li><div class=\"note\">\n<p><strong>Silver.<\/strong> Marked Yes means it counts as silver:\nghosts, dwarven spectres and bonelords take no damage from anything\nelse, scamps take half, and silver stops a werewolf regenerating. Magic\nweapons count too.<\/p>\n<\/div><\/li>\n<\/ul>"},{"id":"materials-wear-and-repair-optional-rule","t":"Wear and Repair (Optional Rule)","s":[],"h":"\n<div class=\"tw\"><table>\n\n<thead>\n<tr>\n<th>Material<\/th>\n<th>Weapon wears on<\/th>\n<th>Armour or shield wears on<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Chitin and iron<\/strong><\/td>\n<td>An attack roll of 1 or 2<\/td>\n<td>Any Critical Hit against you<\/td>\n<\/tr>\n<tr>\n<td><strong>Other Common materials<\/strong><\/td>\n<td>An attack roll of 1<\/td>\n<td>Any Critical Hit against you<\/td>\n<\/tr>\n<tr>\n<td><strong>Uncommon, except adamantium<\/strong><\/td>\n<td>An attack roll of 1<\/td>\n<td>A Critical Hit on a 20 that beats your AC by 5+<\/td>\n<\/tr>\n<tr>\n<td><strong>Adamantium<\/strong><\/td>\n<td>Never from your own rolls<\/td>\n<td>Never (Critical Hits on it become normal hits)<\/td>\n<\/tr>\n<tr>\n<td><strong>Rare and Very Rare<\/strong><\/td>\n<td>Never from your own rolls<\/td>\n<td>A Critical Hit on a 20 that beats your AC by 5+<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li>\n<p><strong>Penalties.<\/strong> Each wear is −1: to a weapon's attack and\ndamage rolls, or to the AC armour or a shield grants. On a Critical Hit,\nyou choose whether your armour or your shield takes it. Natural armour\ndoesn't wear.<\/p>\n<\/li>\n<li>\n<p><strong>Broken and repaired.<\/strong> Armour and weapons break at −3;\na shield breaks when its bonus reaches +0. A smith repairs each point\nfor a quarter of the item's price, or you can do it yourself with an\narmourer's hammer if you're proficient with Smith's Tools.<\/p>\n<\/li>\n<\/ul>"},{"id":"materials-armour-materials","t":"Armour Materials","s":[{"id":"materials-armour-materials--light-armour","t":"Light Armour","l":2},{"id":"materials-armour-materials--medium-armour","t":"Medium Armour","l":2},{"id":"materials-armour-materials--heavy-armour","t":"Heavy Armour","l":2}],"h":"\n<p>Each entry is a full suit. Rare materials aren't magical, but they\ncan be enchanted. <strong>Cold Weather<\/strong> armour gives Advantage\non saving throws against extreme cold.<\/p>\n<h3 id=\"materials-armour-materials--light-armour\">Light Armour<\/h3>\n<p>Add your Dexterity modifier to the AC shown. No Strength requirement,\nand no Disadvantage on Stealth.<\/p>\n<div class=\"tw\"><table>\n\n<thead>\n<tr>\n<th>Armour<\/th>\n<th>AC<\/th>\n<th>Price<\/th>\n<th>Rarity<\/th>\n<th>Notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Netch leather<\/strong> [Leather Armor]<\/td>\n<td>11 + Dex<\/td>\n<td>10 gp<\/td>\n<td>Common<\/td>\n<td>The everyday armour of Dunmer travellers<\/td>\n<\/tr>\n<tr>\n<td><strong>Nordic fur<\/strong><\/td>\n<td>11 + Dex<\/td>\n<td>10 gp<\/td>\n<td>Common<\/td>\n<td>Cold Weather<\/td>\n<\/tr>\n<tr>\n<td><strong>Nordic bearskin<\/strong><\/td>\n<td>11 + Dex<\/td>\n<td>15 gp<\/td>\n<td>Common<\/td>\n<td>Cold Weather<\/td>\n<\/tr>\n<tr>\n<td><strong>Boiled netch leather<\/strong><\/td>\n<td>12 + Dex<\/td>\n<td>30 gp<\/td>\n<td>Common<\/td>\n<td>Netch leather hardened in boiling oil<\/td>\n<\/tr>\n<tr>\n<td><strong>Chitin<\/strong> [Studded Leather Armor]<\/td>\n<td>12 + Dex<\/td>\n<td>40 gp<\/td>\n<td>Common<\/td>\n<td>The lightest armour on the island<\/td>\n<\/tr>\n<tr>\n<td><strong>Imperial studded leather<\/strong> [Studded Leather\nArmor]<\/td>\n<td>12 + Dex<\/td>\n<td>45 gp<\/td>\n<td>Common<\/td>\n<td>Imperial issue<\/td>\n<\/tr>\n<tr>\n<td><strong>Imperial newtscale<\/strong><\/td>\n<td>12 + Dex<\/td>\n<td>60 gp<\/td>\n<td>Common<\/td>\n<td>Fine Imperial scale<\/td>\n<\/tr>\n<tr>\n<td><strong>Wolf<\/strong><\/td>\n<td>12 + Dex<\/td>\n<td>50 gp<\/td>\n<td>Common<\/td>\n<td>Cold Weather; made on Solstheim<\/td>\n<\/tr>\n<tr>\n<td><strong>Dark Brotherhood<\/strong><\/td>\n<td>13 + Dex<\/td>\n<td>Not sold<\/td>\n<td>Uncommon<\/td>\n<td>Advantage on Stealth checks in Dim Light or Darkness<\/td>\n<\/tr>\n<tr>\n<td><strong>Glass<\/strong><\/td>\n<td>14 + Dex<\/td>\n<td>5,000 gp<\/td>\n<td>Rare<\/td>\n<td>Green volcanic glass; light and beautiful<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3 id=\"materials-armour-materials--medium-armour\">Medium Armour<\/h3>\n<p>Add your Dexterity modifier, to a maximum of +2. No Strength\nrequirement.<\/p>\n<div class=\"tw\"><table>\n\n<thead>\n<tr>\n<th>Armour<\/th>\n<th>AC<\/th>\n<th>Stealth<\/th>\n<th>Price<\/th>\n<th>Rarity<\/th>\n<th>Notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Bear<\/strong> [Hide Armor]<\/td>\n<td>12<\/td>\n<td>—<\/td>\n<td>15 gp<\/td>\n<td>Common<\/td>\n<td>Cold Weather; made on Solstheim<\/td>\n<\/tr>\n<tr>\n<td><strong>Nordic ringmail<\/strong><\/td>\n<td>13<\/td>\n<td>Disadv.<\/td>\n<td>50 gp<\/td>\n<td>Common<\/td>\n<td>Nord mail<\/td>\n<\/tr>\n<tr>\n<td><strong>Imperial chain<\/strong> [Scale Mail]<\/td>\n<td>14<\/td>\n<td>Disadv.<\/td>\n<td>50 gp<\/td>\n<td>Common<\/td>\n<td>Imperial issue<\/td>\n<\/tr>\n<tr>\n<td><strong>Bonemold<\/strong><\/td>\n<td>14<\/td>\n<td>Disadv.<\/td>\n<td>400 gp<\/td>\n<td>Common<\/td>\n<td>Worn by Great House guards<\/td>\n<\/tr>\n<tr>\n<td><strong>Bonemold, ornate<\/strong><\/td>\n<td>14<\/td>\n<td>Disadv.<\/td>\n<td>450 gp<\/td>\n<td>Common<\/td>\n<td>The Armun-An and Gah-Julan styles<\/td>\n<\/tr>\n<tr>\n<td><strong>Imperial dragonscale<\/strong> [Half Plate Armor]<\/td>\n<td>15<\/td>\n<td>Disadv.<\/td>\n<td>750 gp<\/td>\n<td>Common<\/td>\n<td>Imperial scale<\/td>\n<\/tr>\n<tr>\n<td><strong>Dreugh<\/strong><\/td>\n<td>15<\/td>\n<td>—<\/td>\n<td>1,000 gp<\/td>\n<td>Uncommon<\/td>\n<td>Sea-monster shell; quiet enough to sneak in<\/td>\n<\/tr>\n<tr>\n<td><strong>Orcish<\/strong><\/td>\n<td>16<\/td>\n<td>Disadv.<\/td>\n<td>800 gp<\/td>\n<td>Uncommon<\/td>\n<td>Forged by Orc smiths<\/td>\n<\/tr>\n<tr>\n<td><strong>Adamantium<\/strong><\/td>\n<td>16<\/td>\n<td>Disadv.<\/td>\n<td>1,200 gp<\/td>\n<td>Uncommon<\/td>\n<td>Critical Hits against you become normal hits<\/td>\n<\/tr>\n<tr>\n<td><strong>Indoril<\/strong><\/td>\n<td>16<\/td>\n<td>Disadv.<\/td>\n<td>Not sold<\/td>\n<td>Uncommon<\/td>\n<td>Ordinators attack anyone else seen wearing it<\/td>\n<\/tr>\n<tr>\n<td><strong>Ice<\/strong> (stalhrim)<\/td>\n<td>16<\/td>\n<td>Disadv.<\/td>\n<td>5,000 gp<\/td>\n<td>Rare<\/td>\n<td>Resistance to Cold damage; Cold Weather<\/td>\n<\/tr>\n<tr>\n<td><strong>Royal Guard<\/strong><\/td>\n<td>16<\/td>\n<td>Disadv.<\/td>\n<td>Not sold<\/td>\n<td>Rare<\/td>\n<td>Mournhold's Royal Guard<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3 id=\"materials-armour-materials--heavy-armour\">Heavy Armour<\/h3>\n<p>No Dexterity bonus. Always Disadvantage on Stealth. If your Strength\nis below the requirement, your Speed drops by 10 feet.<\/p>\n<div class=\"tw\"><table>\n\n<thead>\n<tr>\n<th>Armour<\/th>\n<th>AC<\/th>\n<th>Strength<\/th>\n<th>Price<\/th>\n<th>Rarity<\/th>\n<th>Notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Iron<\/strong> [Chain Mail]<\/td>\n<td>16<\/td>\n<td>13<\/td>\n<td>75 gp<\/td>\n<td>Common<\/td>\n<td>Cheap and common<\/td>\n<\/tr>\n<tr>\n<td><strong>Steel<\/strong> [Splint Armor]<\/td>\n<td>17<\/td>\n<td>15<\/td>\n<td>200 gp<\/td>\n<td>Common<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Nordic iron<\/strong><\/td>\n<td>17<\/td>\n<td>15<\/td>\n<td>200 gp<\/td>\n<td>Common<\/td>\n<td>Cold Weather<\/td>\n<\/tr>\n<tr>\n<td><strong>Imperial steel<\/strong><\/td>\n<td>17<\/td>\n<td>15<\/td>\n<td>250 gp<\/td>\n<td>Common<\/td>\n<td>Imperial Legion issue<\/td>\n<\/tr>\n<tr>\n<td><strong>Nordic trollbone<\/strong><\/td>\n<td>17<\/td>\n<td>15<\/td>\n<td>250 gp<\/td>\n<td>Common<\/td>\n<td>Cold Weather<\/td>\n<\/tr>\n<tr>\n<td><strong>Imperial Templar<\/strong> [Plate Armor]<\/td>\n<td>18<\/td>\n<td>15<\/td>\n<td>1,500 gp<\/td>\n<td>Common<\/td>\n<td>Imperial templar knights<\/td>\n<\/tr>\n<tr>\n<td><strong>Imperial silver<\/strong><\/td>\n<td>18<\/td>\n<td>15<\/td>\n<td>1,600 gp<\/td>\n<td>Common<\/td>\n<td>Silver-plated steel<\/td>\n<\/tr>\n<tr>\n<td><strong>Duke's Guard silver<\/strong><\/td>\n<td>18<\/td>\n<td>15<\/td>\n<td>Not sold<\/td>\n<td>Common<\/td>\n<td>The Duke's guards in Ebonheart<\/td>\n<\/tr>\n<tr>\n<td><strong>Dwemer<\/strong><\/td>\n<td>18<\/td>\n<td>15<\/td>\n<td>1,500 gp<\/td>\n<td>Common<\/td>\n<td>Salvaged from ruins; trade is restricted<\/td>\n<\/tr>\n<tr>\n<td><strong>Ebony<\/strong><\/td>\n<td>19<\/td>\n<td>15<\/td>\n<td>6,000 gp<\/td>\n<td>Rare<\/td>\n<td>Black volcanic glass; near-unbreakable<\/td>\n<\/tr>\n<tr>\n<td><strong>Nordic mail<\/strong><\/td>\n<td>19<\/td>\n<td>15<\/td>\n<td>6,000 gp<\/td>\n<td>Rare<\/td>\n<td>Cold Weather; made on Solstheim<\/td>\n<\/tr>\n<tr>\n<td><strong>Daedric<\/strong><\/td>\n<td>20<\/td>\n<td>17<\/td>\n<td>40,000 gp<\/td>\n<td>Very Rare<\/td>\n<td>Ebony bound with a Daedra's spirit<\/td>\n<\/tr>\n<tr>\n<td><strong>Her Hand's<\/strong><\/td>\n<td>20<\/td>\n<td>17<\/td>\n<td>Not sold<\/td>\n<td>Very Rare<\/td>\n<td>Almalexia's Hands, in Mournhold<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"},{"id":"materials-shields","t":"Shields","s":[],"h":"\n<div class=\"tw\"><table>\n\n<thead>\n<tr>\n<th>Shield<\/th>\n<th>AC<\/th>\n<th>Price<\/th>\n<th>Rarity<\/th>\n<th>Notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Netch leather or chitin<\/strong> [Shield]<\/td>\n<td>+2<\/td>\n<td>10 gp<\/td>\n<td>Common<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Iron, steel or Nordic<\/strong> [Shield]<\/td>\n<td>+2<\/td>\n<td>15 gp<\/td>\n<td>Common<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Bonemold<\/strong><\/td>\n<td>+2<\/td>\n<td>30 gp<\/td>\n<td>Common<\/td>\n<td>Great House guards carry their house's colours<\/td>\n<\/tr>\n<tr>\n<td><strong>Dwemer<\/strong><\/td>\n<td>+2<\/td>\n<td>50 gp<\/td>\n<td>Common<\/td>\n<td>Trade is restricted<\/td>\n<\/tr>\n<tr>\n<td><strong>Orcish tower<\/strong><\/td>\n<td>+3<\/td>\n<td>800 gp<\/td>\n<td>Uncommon<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Dreugh<\/strong><\/td>\n<td>+3<\/td>\n<td>800 gp<\/td>\n<td>Uncommon<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Glass<\/strong><\/td>\n<td>+3<\/td>\n<td>1,000 gp<\/td>\n<td>Uncommon<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Ebony<\/strong><\/td>\n<td>+3<\/td>\n<td>1,200 gp<\/td>\n<td>Uncommon<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Daedric<\/strong><\/td>\n<td>+3<\/td>\n<td>1,500 gp<\/td>\n<td>Uncommon<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Daedric tower<\/strong><\/td>\n<td>+4<\/td>\n<td>6,000 gp<\/td>\n<td>Rare<\/td>\n<td>Taken only from golden saints<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"},{"id":"materials-whats-made-from-what","t":"What's Made from What","s":[],"h":"\n<p>Not every weapon comes in every material. Anything else needs a smith\nwilling to try, and the DM's permission.<\/p>\n<div class=\"tw\"><table>\n\n<thead>\n<tr>\n<th>Material<\/th>\n<th>Found as<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Chitin<\/strong><\/td>\n<td>Daggers, shortswords, clubs, war axes, spears, tridents, whips,\nshort bows, arrows and throwing stars<\/td>\n<\/tr>\n<tr>\n<td><strong>Iron<\/strong><\/td>\n<td>Most blades, axes, clubs, maces, warhammers, spears, glaives and\ntridents, plus whips, arrows, bolts and throwing knives<\/td>\n<\/tr>\n<tr>\n<td><strong>Steel<\/strong><\/td>\n<td>Almost every weapon<\/td>\n<\/tr>\n<tr>\n<td><strong>Silver<\/strong><\/td>\n<td>Daggers, shortswords, longswords, rapiers, claymores, staffs, war\naxes, spears, glaives, tridents, whips, arrows, bolts, darts and\nthrowing stars<\/td>\n<\/tr>\n<tr>\n<td><strong>Bonemold<\/strong><\/td>\n<td>Long bows, arrows and bolts<\/td>\n<\/tr>\n<tr>\n<td><strong>Dreugh<\/strong><\/td>\n<td>Clubs and staffs<\/td>\n<\/tr>\n<tr>\n<td><strong>Dwemer<\/strong><\/td>\n<td>Shortswords, claymores, maces, warhammers, war axes, battle axes,\nspears, tridents, glaives, halberds and crossbows<\/td>\n<\/tr>\n<tr>\n<td><strong>Orcish<\/strong><\/td>\n<td>Battle axes, warhammers and bolts<\/td>\n<\/tr>\n<tr>\n<td><strong>Nordic silver<\/strong><\/td>\n<td>Daggers, shortswords, longswords, claymores, maces, axes and battle\naxes<\/td>\n<\/tr>\n<tr>\n<td><strong>Adamantium<\/strong><\/td>\n<td>Shortswords, claymores, maces, axes, spears, tridents and\nglaives<\/td>\n<\/tr>\n<tr>\n<td><strong>Glass<\/strong><\/td>\n<td>Daggers, longswords, rapiers, claymores, staffs, war axes, glaives,\nhalberds, arrows, throwing knives and throwing stars<\/td>\n<\/tr>\n<tr>\n<td><strong>Ebony<\/strong><\/td>\n<td>Shortswords, broadswords, longswords, rapiers, maces, staffs, war\naxes, spears, tridents, glaives, arrows, darts and throwing stars<\/td>\n<\/tr>\n<tr>\n<td><strong>Stalhrim<\/strong><\/td>\n<td>Daggers, longswords, maces and war axes<\/td>\n<\/tr>\n<tr>\n<td><strong>Daedric<\/strong><\/td>\n<td>Almost every weapon, including all four Akaviri blades, glaives,\ntridents, rapiers, long bows, arrows and darts<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n"}]},{"key":"reckoning","title":"The Reckoning of Days","short":"Reckoning","sub":"The calendar, festivals and weather of 3E 417","chapters":[{"id":"reckoning-the-calendar","t":"The Calendar","s":[],"h":"\n<p>Tamriel's months match ours, and its seasons follow the northern\nhemisphere.<\/p>\n<div class=\"tw\"><table>\n\n<thead>\n<tr>\n<th>Month<\/th>\n<th>Like<\/th>\n<th>Days<\/th>\n<th>Month<\/th>\n<th>Like<\/th>\n<th>Days<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Morning Star<\/strong><\/td>\n<td>January, winter<\/td>\n<td>31<\/td>\n<td><strong>Sun's Height<\/strong><\/td>\n<td>July, summer<\/td>\n<td>31<\/td>\n<\/tr>\n<tr>\n<td><strong>Sun's Dawn<\/strong><\/td>\n<td>February, winter<\/td>\n<td>28<\/td>\n<td><strong>Last Seed<\/strong><\/td>\n<td>August, summer<\/td>\n<td>31<\/td>\n<\/tr>\n<tr>\n<td><strong>First Seed<\/strong><\/td>\n<td>March, spring<\/td>\n<td>31<\/td>\n<td><strong>Hearthfire<\/strong><\/td>\n<td>September, autumn<\/td>\n<td>30<\/td>\n<\/tr>\n<tr>\n<td><strong>Rain's Hand<\/strong><\/td>\n<td>April, spring<\/td>\n<td>30<\/td>\n<td><strong>Frostfall<\/strong><\/td>\n<td>October, autumn<\/td>\n<td>31<\/td>\n<\/tr>\n<tr>\n<td><strong>Second Seed<\/strong><\/td>\n<td>May, spring<\/td>\n<td>31<\/td>\n<td><strong>Sun's Dusk<\/strong><\/td>\n<td>November, autumn<\/td>\n<td>30<\/td>\n<\/tr>\n<tr>\n<td><strong>Midyear<\/strong><\/td>\n<td>June, summer<\/td>\n<td>30<\/td>\n<td><strong>Evening Star<\/strong><\/td>\n<td>December, winter<\/td>\n<td>31<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li>\n<p><strong>Weekdays.<\/strong> Sundas, Morndas, Tirdas, Middas, Turdas,\nFredas and Loredas, like Sunday to Saturday. No source fixes them for 3E\n417, so this tracker starts the year on a Sundas.<\/p>\n<\/li>\n<\/ul>"},{"id":"reckoning-festivals-and-holy-days","t":"Festivals and Holy Days","s":[{"id":"reckoning-festivals-and-holy-days--daedric-summoning-days","t":"Daedric Summoning Days","l":2},{"id":"reckoning-festivals-and-holy-days--the-year-ahead","t":"The Year Ahead","l":2}],"h":"\n<p>These holidays are kept across Tamriel, and outlanders have brought\nthem to Vvardenfell. Prices are from <em>Treasures of\nMorrowind<\/em>.<\/p>\n<div class=\"tw\"><table>\n\n<thead>\n<tr>\n<th>Date<\/th>\n<th>Festival<\/th>\n<th>What happens<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>27 Last Seed<\/td>\n<td><strong>Harvest's End<\/strong><\/td>\n<td>Taverns pour free drinks, and visitors are welcome to join in.<\/td>\n<\/tr>\n<tr>\n<td>3 Hearthfire<\/td>\n<td><strong>Tales and Tallows<\/strong><\/td>\n<td>The dead are said to walk. The Mages Guild sells magic items at half\nprice.<\/td>\n<\/tr>\n<tr>\n<td>13 Frostfall<\/td>\n<td><strong>Witches Festival<\/strong><\/td>\n<td>Costumes and mockery of ghosts and spirits. The Mages Guild does a\nbrisk trade.<\/td>\n<\/tr>\n<tr>\n<td>30 Frostfall<\/td>\n<td><strong>Emperor's Day<\/strong><\/td>\n<td>Once a great carnival, now largely neglected.<\/td>\n<\/tr>\n<tr>\n<td>20 Sun's Dusk<\/td>\n<td><strong>Warriors Festival<\/strong><\/td>\n<td>Weapons sell at half price, and amateur fighters flock to the\ntowns.<\/td>\n<\/tr>\n<tr>\n<td>15 Evening Star<\/td>\n<td><strong>North Winds Prayer<\/strong><\/td>\n<td>Thanks for the harvest and a mild winter. Temple services are half\nprice.<\/td>\n<\/tr>\n<tr>\n<td>25 Evening Star<\/td>\n<td><strong>Saturalia<\/strong><\/td>\n<td>A Breton festival of gifts, parties and parades.<\/td>\n<\/tr>\n<tr>\n<td>30 Evening Star<\/td>\n<td><strong>Old Life Festival<\/strong><\/td>\n<td>The last day of the year, for remembering the dead. The ale\nflows.<\/td>\n<\/tr>\n<tr>\n<td>1 Morning Star<\/td>\n<td><strong>New Life Festival<\/strong><\/td>\n<td>The new year. Free ale in the taverns, and new taxes announced.<\/td>\n<\/tr>\n<tr>\n<td>15 Morning Star<\/td>\n<td><strong>South Winds Prayer<\/strong><\/td>\n<td>Prayers for the planting. Temples heal a worthy few for free.<\/td>\n<\/tr>\n<tr>\n<td>16 Sun's Dawn<\/td>\n<td><strong>Heart's Day<\/strong><\/td>\n<td>A day for lovers. Inns give visitors a free room.<\/td>\n<\/tr>\n<tr>\n<td>7 First Seed<\/td>\n<td><strong>First Planting<\/strong><\/td>\n<td>A day of fresh starts. Temples run free clinics.<\/td>\n<\/tr>\n<tr>\n<td>28 Rain's Hand<\/td>\n<td><strong>Jester's Day<\/strong><\/td>\n<td>Pranks everywhere, and the Thieves Guild watches for\npickpockets.<\/td>\n<\/tr>\n<tr>\n<td>7 Second Seed<\/td>\n<td><strong>Second Planting<\/strong><\/td>\n<td>As First Planting, and the year's last free clinics.<\/td>\n<\/tr>\n<tr>\n<td>16 Midyear<\/td>\n<td><strong>Mid Year Celebration<\/strong><\/td>\n<td>Temple blessings at half price.<\/td>\n<\/tr>\n<tr>\n<td>10 Sun's Height<\/td>\n<td><strong>Merchants Festival<\/strong><\/td>\n<td>Shops sell at half price, except the Mages Guild.<\/td>\n<\/tr>\n<tr>\n<td>20 Sun's Height<\/td>\n<td><strong>Sun's Rest<\/strong><\/td>\n<td>Every shop closes. Temples and taverns stay open.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>The Festival of Forbearance.<\/strong> The Temple and House\nIndoril keep a festival of several days in honour of Almalexia. No\nsource gives its date, so pick one.<\/p>\n<h3 id=\"reckoning-festivals-and-holy-days--daedric-summoning-days\">Daedric Summoning Days<\/h3>\n<p>On these days, a Daedric Prince is said to answer those who call, and\nits shrines and cultists are at their busiest. The dates come from the\nIliac Bay, so the Dunmer may keep them differently.<\/p>\n<div class=\"tw\"><table>\n\n<thead>\n<tr>\n<th>Prince<\/th>\n<th>Day<\/th>\n<th>Notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Azura<\/strong><\/td>\n<td>21 First Seed<\/td>\n<td>One of the Dunmer's three Good Daedra<\/td>\n<\/tr>\n<tr>\n<td><strong>Boethiah<\/strong><\/td>\n<td>2 Sun's Dusk<\/td>\n<td>One of the Good Daedra<\/td>\n<\/tr>\n<tr>\n<td><strong>Mephala<\/strong><\/td>\n<td>13 Frostfall<\/td>\n<td>One of the Good Daedra. Also the Witches Festival<\/td>\n<\/tr>\n<tr>\n<td><strong>Malacath<\/strong><\/td>\n<td>8 Frostfall<\/td>\n<td>One of the House of Troubles<\/td>\n<\/tr>\n<tr>\n<td><strong>Sheogorath<\/strong><\/td>\n<td>2 Sun's Dawn<\/td>\n<td>One of the House of Troubles<\/td>\n<\/tr>\n<tr>\n<td><strong>Mehrunes Dagon<\/strong><\/td>\n<td>20 Sun's Dusk<\/td>\n<td>One of the House of Troubles. Also the Warriors Festival<\/td>\n<\/tr>\n<tr>\n<td><strong>Molag Bal<\/strong><\/td>\n<td>Unknown<\/td>\n<td>One of the House of Troubles. No date survives, so pick one.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3 id=\"reckoning-festivals-and-holy-days--the-year-ahead\">The Year Ahead<\/h3>\n<p>The campaign begins on Middas, 16 Last Seed, 3E 417: ten years to the\nday before the events of Morrowind .<\/p>\n"},{"id":"reckoning-weather","t":"Weather","s":[{"id":"reckoning-weather--what-the-weather-does","t":"What the Weather Does","l":2}],"h":"\n<p>Roll a d20 each Morning for the region the party is in. The weather\nholds for the day, unless you decide it turns. These tables follow each\nregion's character in the games, not their exact odds.<\/p>\n<div class=\"tw\"><table>\n\n<thead>\n<tr>\n<th>Region<\/th>\n<th>Clear<\/th>\n<th>Cloudy<\/th>\n<th>Fog<\/th>\n<th>Rain<\/th>\n<th>Storm<\/th>\n<th>Ash storm<\/th>\n<th>Blight storm<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Ascadian Isles<\/strong> <em>Ebonheart, Vivec,\nSuran<\/em><\/td>\n<td>1–8<\/td>\n<td>9–13<\/td>\n<td>14<\/td>\n<td>15–18<\/td>\n<td>19–20<\/td>\n<td>—<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td><strong>Bitter Coast<\/strong> <em>Seyda Neen, Hla Oad, Gnaar\nMok<\/em><\/td>\n<td>1–4<\/td>\n<td>5–8<\/td>\n<td>9–13<\/td>\n<td>14–18<\/td>\n<td>19–20<\/td>\n<td>—<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td><strong>West Gash<\/strong> <em>Balmora, Caldera, Gnisis<\/em><\/td>\n<td>1–8<\/td>\n<td>9–13<\/td>\n<td>14<\/td>\n<td>15–17<\/td>\n<td>18<\/td>\n<td>19–20<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td><strong>Grazelands<\/strong> <em>Vos, Tel Vos<\/em><\/td>\n<td>1–10<\/td>\n<td>11–15<\/td>\n<td>16<\/td>\n<td>17–19<\/td>\n<td>20<\/td>\n<td>—<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td><strong>Azura's Coast<\/strong> <em>Sadrith Mora, Tel\nBranora<\/em><\/td>\n<td>1–5<\/td>\n<td>6–10<\/td>\n<td>11<\/td>\n<td>12–16<\/td>\n<td>17–20<\/td>\n<td>—<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td><strong>Sheogorad<\/strong> <em>Dagon Fel<\/em><\/td>\n<td>1–3<\/td>\n<td>4–9<\/td>\n<td>10–11<\/td>\n<td>12–16<\/td>\n<td>17–20<\/td>\n<td>—<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td><strong>Molag Amur<\/strong> <em>Molag Mar<\/em><\/td>\n<td>1–6<\/td>\n<td>7–10<\/td>\n<td>—<\/td>\n<td>11<\/td>\n<td>—<\/td>\n<td>12–19<\/td>\n<td>20<\/td>\n<\/tr>\n<tr>\n<td><strong>Ashlands<\/strong> <em>Ald'ruhn, Maar Gan<\/em><\/td>\n<td>1–5<\/td>\n<td>6–9<\/td>\n<td>—<\/td>\n<td>10<\/td>\n<td>—<\/td>\n<td>11–19<\/td>\n<td>20<\/td>\n<\/tr>\n<tr>\n<td><strong>Red Mountain<\/strong> <em>inside the Ghostfence<\/em><\/td>\n<td>1–2<\/td>\n<td>3–5<\/td>\n<td>—<\/td>\n<td>—<\/td>\n<td>—<\/td>\n<td>6–14<\/td>\n<td>15–20<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3 id=\"reckoning-weather--what-the-weather-does\">What the Weather Does<\/h3>\n<div class=\"tw\"><table>\n\n<thead>\n<tr>\n<th>Weather<\/th>\n<th>Effect<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Clear or cloudy<\/strong><\/td>\n<td>No effect.<\/td>\n<\/tr>\n<tr>\n<td><strong>Fog<\/strong><\/td>\n<td>The area is Lightly Obscured.<\/td>\n<\/tr>\n<tr>\n<td><strong>Rain<\/strong><\/td>\n<td>The area is Lightly Obscured, and unsheltered torches and campfires\ngo out.<\/td>\n<\/tr>\n<tr>\n<td><strong>Storm<\/strong><\/td>\n<td>As rain, and the wind gives Disadvantage on ranged weapon attack\nrolls and on Wisdom (Perception) checks that rely on hearing. Boats stay\nin port.<\/td>\n<\/tr>\n<tr>\n<td><strong>Ash storm<\/strong><\/td>\n<td>The area is Lightly Obscured, and Heavily Obscured beyond 30 feet.\nTravel takes twice as long. Each hour a creature spends in it without a\ncloth over its face, it makes a DC 10 Constitution saving throw, gaining\n1 Exhaustion level on a failure.<\/td>\n<\/tr>\n<tr>\n<td><strong>Blight storm<\/strong><\/td>\n<td>The area is Heavily Obscured beyond 15 feet, and a blighted beast\noften comes with it. Travel takes twice as long. Each hour a creature\nspends in it without shelter, it makes a DC 13 Constitution saving\nthrow, contracting a Blight disease on a failure (see Disease and the\nBlight in the <em>Player's Guide<\/em>).<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n"}]}],"docs":[{"i":"guide-into-morrowind","b":"guide","ci":"guide-into-morrowind","c":"Into Morrowind","h":"Into Morrowind","t":"“Every ship to Vvardenfell carries two cargoes: what's in the hold, and who's on deck.” — A saying among East Empire Company sailors"},{"i":"guide-into-morrowind--how-to-use-this-guide","b":"guide","ci":"guide-into-morrowind","c":"Into Morrowind","h":"How to Use This Guide","t":"This guide is for players. It covers the island of Vvardenfell in 3E 417, the peoples who live there, the gods they answer to, and the house rules this campaign uses. You don't need to have played any of the Elder Scrolls games. Everything you need to make a character is here, and you'll learn the rest in play. The guide is in three parts. Part One: Arriving. Where the story starts, and the house rules this campaign plays by, including cover, hiding and harvesting. Part Two: Making Your Character. Eight steps, in order, from choosing your people to the questions to answer before the first session. Begin at Start Here . Part Three: The World. Tamriel's history, its gods, and a glossary of the words you'll hear on the island. None of it is required before play; read it when you're curious. You'll also need the 2024 Player's Handbook for classes, spells and the core rules, and Treasures of Morrowind for gear, prices and services. This guide changes only what's listed under House Rules at a Glance ."},{"i":"guide-into-morrowind--the-voyage","b":"guide","ci":"guide-into-morrowind","c":"Into Morrowind","h":"The Voyage","t":"The campaign begins aboard the Saint Alessia's Grace , an East Empire Company cargo ship that also carries passengers between the mainland and Vvardenfell. It is 3E 417, in the reign of Emperor Uriel VII, and the voyage is almost over. You have been at sea for weeks, sharing cramped quarters with sailors, merchants and other travellers. This morning the crew are in high spirits, singing and drinking, because landfall is less than an hour away. Through the haze ahead rise the walls of Ebonheart. Beyond them, across the bay, stand the great stone districts of Vivec, and far inland, under a grey smudge of ash, is Red Mountain."},{"i":"guide-into-morrowind--ebonheart","b":"guide","ci":"guide-into-morrowind","c":"Into Morrowind","h":"Ebonheart","t":"Ebonheart is where most outlanders first set foot on Vvardenfell. It is Imperial in every sense, and for many newcomers it is the last familiar place before the real Morrowind begins. Who rules it. Duke Vedam Dren governs the whole island for the Emperor from Castle Ebonheart. Who guards it. The Imperial Legion keeps a garrison here. Imperial law applies, and drawing steel in the street is taken very seriously. Who trades there. The East Empire Company runs much of the island's trade from Ebonheart's docks and warehouses. What's nearby. Vivec City, the Temple's holy city, lies a short walk along the shore. Ebonheart and Vivec sit on the island's south coast. Everywhere else is a silt strider ride, a boat trip or a long walk away. The island of Vvardenfell"},{"i":"guide-house-rules","b":"guide","ci":"guide-house-rules","c":"House Rules","h":"House Rules","t":"“The Empire's law is written down. Morrowind's is remembered. Learn both.” — A Legion sergeant, Ebonheart"},{"i":"guide-house-rules--house-rules-at-a-glance","b":"guide","ci":"guide-house-rules","c":"House Rules","h":"House Rules at a Glance","t":"These are the changes to the 2024 rules, and where each one is written out in full. Everything else works as the Player's Handbook says. Rule · In this campaign · Where. Peoples · The ten races of Tamriel replace species, each with its own traits. · Step One. Languages · Everyone speaks Tamrielic, the common tongue, and knows two more languages. · Step One. Backgrounds · The Player's Handbook backgrounds without their Origin feats, plus ten Morrowind backgrounds, each with a connection to the island. · Step Three. Birthsigns · Your birthsign replaces your background's Origin feat. Any combination of background and birthsign works. · Step Four. Ability scores · Each player chooses their method: the standard array, point buy or dice. · Step Five. Weapon Mastery · Works as written, using the weapons in Treasures of Morrowind . · Step Two. Gods and patrons · Clerics, paladins and warlocks serve a named god or patron. Some subclasses from older books are allowed. · Step Six. Losing favour · Optional rules for characters who break faith with their god. Your DM decides whether to use them. · The Gods of Tamriel. Starting equipment · Class packages as in the Player's Handbook , or Morrowind-made versions that work the same. Gold buys at Treasures prices. · Step Seven. Money · Gold pieces work as normal. On Vvardenfell, people call them drakes. · Treasures. Wear and repair · Optional: weapons, armour and shields wear out, and need repairing. · Below. Crafting · Characters with the right tools can make their own weapons, armour and shields. · Below. Enchanting · Soul gems, the Soul Trap spell, and making magic items of your own. · Below. Scrolls · Anyone who can read can use a scroll, and some characters can write them. · Below. Potions · Brewing potions and poisons from pairs of ingredients, with alchemy apparatus. · Below. Travel, training and crime · Silt striders and boats, trainers, and the fines for breaking the law. · Treasures. Weather · Fog, rain, storms, ash storms and Blight storms all affect play. · The Reckoning of Days. Cover, sight and hiding · The 2024 rules you'll need most, with crowds added. · Below. Harvesting · Taking ingredients and trophies from the creatures you kill. · Below. Disease and the Blight · How diseases are caught, how they wear you down, and how they're cured. · Below."},{"i":"guide-house-rules--cover-sight-and-hiding","b":"guide","ci":"guide-house-rules","c":"House Rules","h":"Cover, Sight and Hiding","t":"Fights on Vvardenfell happen among market stalls and crowds in town, and in the d
