\n\"Two-Weapon Fighting\",\n\"Unarmed Fighting\"\n],\n\"backgrounds\": [\n{\n\"id\": \"acolyte\",\n\"name\": \"Acolyte\",\n\"group\": \"Player's Handbook\",\n\"abilities\": [\n\"Int\",\n\"Wis\",\n\"Cha\"\n],\n\"skills\": [\n\"Insight\",\n\"Religion\"\n],\n\"tool\": \"Calligrapher's Supplies\",\n\"toolChoice\": null,\n\"desc\": \"You served a temple: a Tribunal shrine on the mainland, an Imperial Cult chapel in Cyrodiil, or something less respectable.\",\n\"equipment\": \"Calligrapher's Supplies, a book of prayers, a holy symbol, 10 sheets of parchment, a robe and 8 gp\",\n\"gold\": 8,\n\"altGold\": 50,\n\"connection\": \"The priests of your faith on Vvardenfell will shelter you for a night and carry a message for you, as they would anywhere.\"\n},\n{\n\"id\": \"artisan\",\n\"name\": \"Artisan\",\n\"group\": \"Player's Handbook\",\n\"abilities\": [\n\"Str\",\n\"Dex\",\n\"Int\"\n],\n\"skills\": [\n\"Investigation\",\n\"Persuasion\"\n],\n\"tool\": null,\n\"toolChoice\": \"artisan\",\n\"desc\": \"You learned a trade, such as bonemold armour, Hlaalu silks, netch-leather or Imperial glasswork.\",\n\"equipment\": \"The Artisan's Tools you chose, 2 pouches, Traveller's Clothes and 32 gp\",\n\"gold\": 32,\n\"altGold\": 50,\n\"connection\": \"Your old master wrote you a letter of introduction to a fellow craftsman in Vivec, Balmora or Ebonheart.\"\n},\n{\n\"id\": \"charlatan\",\n\"name\": \"Charlatan\",\n\"group\": \"Player's Handbook\",\n\"abilities\": [\n\"Dex\",\n\"Con\",\n\"Cha\"\n],\n\"skills\": [\n\"Deception\",\n\"Sleight of Hand\"\n],\n\"tool\": \"Forgery Kit\",\n\"toolChoice\": null,\n\"desc\": \"You've sold fake relics to pilgrims and painted stones to the gullible as soul gems.\",\n\"equipment\": \"A Forgery Kit, a costume, Fine Clothes and 15 gp\",\n\"gold\": 15,\n\"altGold\": 50,\n\"connection\": \"An old partner gave you the name of a forger in Vivec's Foreign Quarter, and told you to mention theirs.\"\n},\n{\n\"id\": \"criminal\",\n\"name\": \"Criminal\",\n\"group\": \"Player's Handbook\",\n\"abilities\": [\n\"Dex\",\n\"Con\",\n\"Int\"\n],\n\"skills\": [\n\"Sleight of Hand\",\n\"Stealth\"\n],\n\"tool\": \"Thieves' Tools\",\n\"toolChoice\": null,\n\"desc\": \"You've worked for a thieves' guild, the Camonna Tong on the mainland, or against both.\",\n\"equipment\": \"2 daggers, Thieves' Tools, a crowbar, 2 pouches, Traveller's Clothes and 16 gp\",\n\"gold\": 16,\n\"altGold\": 50,\n\"connection\": \"Your old crew gave you the name of a fence on Vvardenfell, and of one thief there who owes them a favour.\"\n},\n{\n\"id\": \"entertainer\",\n\"name\": \"Entertainer\",\n\"group\": \"Player's Handbook\",\n\"abilities\": [\n\"Str\",\n\"Dex\",\n\"Cha\"\n],\n\"skills\": [\n\"Acrobatics\",\n\"Performance\"\n],\n\"tool\": null,\n\"toolChoice\": \"instrument\",\n\"desc\": \"You've tumbled, sung or told stories in taverns and on street corners across the Empire.\",\n\"equipment\": \"The musical instrument you chose, 2 costumes, a mirror, perfume, Traveller's Clothes and 11 gp\",\n\"gold\": 11,\n\"altGold\": 50,\n\"connection\": \"A travelling troupe you once worked with is touring Vvardenfell, and will put you on the bill.\"\n},\n{\n\"id\": \"farmer\",\n\"name\": \"Farmer\",\n\"group\": \"Player's Handbook\",\n\"abilities\": [\n\"Str\",\n\"Con\",\n\"Wis\"\n],\n\"skills\": [\n\"Animal Handling\",\n\"Nature\"\n],\n\"tool\": \"Carpenter's Tools\",\n\"toolChoice\": null,\n\"desc\": \"You've worked saltrice paddies, herded guar or tended a kwama egg mine on the mainland.\",\n\"equipment\": \"A sickle, Carpenter's Tools, a healer's kit, an iron pot, a shovel, Traveller's Clothes and 30 gp\",\n\"gold\": 30,\n\"altGold\": 50,\n\"connection\": \"Farmers are the same everywhere: those along Vvardenfell's roads will feed someone who talks like one of them, and tell you what's been prowling at night.\"\n},\n{\n\"id\": \"guard\",\n\"name\": \"Guard\",\n\"group\": \"Player's Handbook\",\n\"abilities\": [\n\"Str\",\n\"Int\",\n\"Wis\"\n],\n\"skills\": [\n\"Athletics\",\n\"Perception\"\n],\n\"tool\": null,\n\"toolChoice\": \"gaming\",\n\"desc\": \"You've stood watch for the Legion, a Great House or a merchant's caravan.\",\n\"equipment\": \"A spear, a light crossbow, 20 bolts, the gaming set you chose, a hooded lantern, manacles, a quiver, Traveller's Clothes and 12 gp\",\n\"gold\": 12,\n\"altGold\": 50,\n\"connection\": \"You carry a letter of recommendation from your old captain to a guard captain on Vvardenfell.\"\n},\n{\n\"id\": \"guide\",\n\"name\": \"Guide\",\n\"group\": \"Player's Handbook\",\n\"abilities\": [\n\"Dex\",\n\"Con\",\n\"Wis\"\n],\n\"skills\": [\n\"Stealth\",\n\"Survival\"\n],\n\"tool\": \"Cartographer's Tools\",\n\"toolChoice\": null,\n\"desc\": \"You've led travellers through the swamps, hills and ash of mainland Morrowind, or the wilds of another province.\",\n\"equipment\": \"A shortbow, 20 arrows, Cartographer's Tools, a bedroll, a quiver, a tent, Traveller's Clothes and 3 gp\",\n\"gold\": 3,\n\"altGold\": 50,\n\"connection\": \"A guide on Vvardenfell will trade you local knowledge for news of the roads you know.\"\n},\n{\n\"id\": \"hermit\",\n\"name\": \"Hermit\",\n\"group\": \"Player's Handbook\",\n\"abilities\": [\n\"Con\",\n\"Wis\",\n\"Cha\"\n],\n\"skills\": [\n\"Medicine\",\n\"Religion\"\n],\n\"tool\": \"Herbalism Kit\",\n\"toolChoice\": null,\n\"desc\": \"You lived apart, in a hut on a lonely coast, a cave in the hills or the shadow of a wizard's tower.\",\n\"equipment\": \"A quarterstaff, an Herbalism Kit, a bedroll, a book of philosophy, a lamp, 3 flasks of oil, Traveller's Clothes and 16 gp\",\n\"gold\": 16,\n\"altGold\": 50,\n\"connection\": \"An Ashlander wise woman you met in the wilds told you to seek out her sister, who lives with a tribe on Vvardenfell.\"\n},\n{\n\"id\": \"merchant\",\n\"name\": \"Merchant\",\n\"group\": \"Player's Handbook\",\n\"abilities\": [\n\"Con\",\n\"Int\",\n\"Cha\"\n],\n\"skills\": [\n\"Animal Handling\",\n\"Persuasion\"\n],\n\"tool\": \"Navigator's Tools\",\n\"toolChoice\": null,\n\"desc\": \"You've bought and sold for a Hlaalu trading house, the East Empire Company or yourself.\",\n\"equipment\": \"Navigator's Tools, 2 pouches, Traveller's Clothes and 22 gp\",\n\"gold\": 22,\n\"altGold\": 50,\n\"connection\": \"Your house or company has a factor on Vvardenfell who'll share the gossip about prices with you, and who's been buying what.\"\n},\n{\n\"id\": \"noble\",\n\"name\": \"Noble\",\n\"group\": \"Player's Handbook\",\n\"abilities\": [\n\"Str\",\n\"Int\",\n\"Cha\"\n],\n\"skills\": [\n\"History\",\n\"Persuasion\"\n],\n\"tool\": null,\n\"toolChoice\": \"gaming\",\n\"desc\": \"You come from a minor house of Cyrodiil, a Hlaalu family on the rise or an old Redoran line from the mainland.\",\n\"equipment\": \"The gaming set you chose, Fine Clothes, perfume and 29 gp\",\n\"gold\": 29,\n\"altGold\": 50,\n\"connection\": \"One Great House councillor or Imperial official on Vvardenfell knows your family, for better or worse.\"\n},\n{\n\"id\": \"sage\",\n\"name\": \"Sage\",\n\"group\": \"Player's Handbook\",\n\"abilities\": [\n\"Con\",\n\"Int\",\n\"Wis\"\n],\n\"skills\": [\n\"Arcana\",\n\"History\"\n],\n\"tool\": \"Calligrapher's Supplies\",\n\"toolChoice\": null,\n\"desc\": \"You've studied in the Imperial Library, a Mages Guild hall or a Telvanni archive on the mainland.\",\n\"equipment\": \"A quarterstaff, Calligrapher's Supplies, a book of history, 8 sheets of parchment, a robe and 8 gp\",\n\"gold\": 8,\n\"altGold\": 50,\n\"connection\": \"A scholar in Vivec or Balmora has written to you for years, and answers your questions, slowly.\"\n},\n{\n\"id\": \"sailor\",\n\"name\": \"Sailor\",\n\"group\": \"Player's Handbook\",\n\"abilities\": [\n\"Str\",\n\"Dex\",\n\"Wis\"\n],\n\"skills\": [\n\"Acrobatics\",\n\"Perception\"\n],\n\"tool\": \"Navigator's Tools\",\n\"toolChoice\": null,\n\"desc\": \"You've crewed Company ships, fishing boats or coastal ferries around Tamriel.\",\n\"equipment\": \"A dagger, Navigator's Tools, a rope, Traveller's Clothes and 20 gp\",\n\"gold\": 20,\n\"altGold\": 50,\n\"connection\": \"The captains of the Inner Sea know your old ship by name, and you know which of them carry passengers without asking questions.\"\n},\n{\n\"id\": \"scribe\",\n\"name\": \"Scribe\",\n\"group\": \"Player's Handbook\",\n\"abilities\": [\n\"Dex\",\n\"Int\",\n\"Wis\"\n],\n\"skills\": [\n\"Investigation\",\n\"Perception\"\n],\n\"tool\": \"Calligrapher's Supplies\",\n\"toolChoice\": null,\n\"desc\": \"You've copied scripture for the Temple, records for a Great House or forms for the Empire.\",\n\"equipment\": \"Calligrapher's Supplies, Fine Clothes, a lamp, 3 flasks of oil, 12 sheets of parchment and 23 gp\",\n\"gold\": 23,\n\"altGold\": 50,\n\"connection\": \"You know how Imperial paperwork works, and the name of a clerk in Vvardenfell's Census and Excise Office who owes your old office a favour.\"\n},\n{\n\"id\": \"soldier\",\n\"name\": \"Soldier\",\n\"group\": \"Player's Handbook\",\n\"abilities\": [\n\"Str\",\n\"Dex\",\n\"Con\"\n],\n\"skills\": [\n\"Athletics\",\n\"Intimidation\"\n],\n\"tool\": null,\n\"toolChoice\": \"gaming\",\n\"desc\": \"You've served in the Imperial Legion, a Great House's army or a mercenary company.\",\n\"equipment\": \"A spear, a shortbow, 20 arrows, the gaming set you chose, a healer's kit, a quiver, Traveller's Clothes and 14 gp\",\n\"gold\": 14,\n\"altGold\": 50,\n\"connection\": \"In any Legion fort, Vvardenfell's included, you can find someone who served where you did.\"\n},\n{\n\"id\": \"wayfarer\",\n\"name\": \"Wayfarer\",\n\"group\": \"Player's Handbook\",\n\"abilities\": [\n\"Dex\",\n\"Wis\",\n\"Cha\"\n],\n\"skills\": [\n\"Insight\",\n\"Stealth\"\n],\n\"tool\": \"Thieves' Tools\",\n\"toolChoice\": null,\n\"desc\": \"You grew up on the streets of Mournhold, the Imperial City or another crowded city.\",\n\"equipment\": \"2 daggers, Thieves' Tools, a gaming set of your choice, a bedroll, 2 pouches, Traveller's Clothes and 16 gp\",\n\"gold\": 16,\n\"altGold\": 50,\n\"connection\": \"Street children are the same everywhere. On Vvardenfell, they'll tell you what they've seen for a few coins, once they see you know the game.\"\n},\n{\n\"id\": \"ashlander-exile\",\n\"name\": \"Ashlander Exile\",\n\"group\": \"Morrowind\",\n\"abilities\": [\n\"Str\",\n\"Dex\",\n\"Wis\"\n],\n\"skills\": [\n\"Animal Handling\",\n\"Survival\"\n],\n\"tool\": \"Leatherworker's Tools\",\n\"toolChoice\": null,\n\"desc\": \"You left one of the Ashlander tribes that still wander the wild country of mainland Morrowind, or they made you leave. All your life you've heard of the great tribes of Vvardenfell, who live in the shadow of Red Mountain.\",\n\"equipment\": \"Leatherworker's Tools, a spear, Traveller's Clothes, a bedroll, a tinderbox, a pouch and 40 gp\",\n\"gold\": 40,\n\"altGold\": 50,\n\"connection\": \"Ashlanders share their customs across the water. The four great tribes of Vvardenfell, the Urshilaku, the Ahemmusa, the Zainab and the Erabenimsun, will hear you out as kin, if warily.\"\n},\n{\n\"id\": \"company-clerk\",\n\"name\": \"Company Clerk\",\n\"group\": \"Morrowind\",\n\"abilities\": [\n\"Int\",\n\"Wis\",\n\"Cha\"\n],\n\"skills\": [\n\"Insight\",\n\"Investigation\"\n],\n\"tool\": \"Calligrapher's Supplies\",\n\"toolChoice\": null,\n\"desc\": \"You've kept the East Empire Company's ledgers in a mainland port, and you've seen how creative the Vvardenfell accounts get on paper.\",\n\"equipment\": \"Calligrapher's Supplies, a blank ledger (a book), Traveller's Clothes and 13 gp\",\n\"gold\": 13,\n\"altGold\": 50,\n\"connection\": \"Your name is on the Company's books, so its clerks in Ebonheart will treat you as one of their own, and show you a manifest if you ask nicely.\"\n},\n{\n\"id\": \"ebony-miner\",\n\"name\": \"Ebony Miner\",\n\"group\": \"Morrowind\",\n\"abilities\": [\n\"Str\",\n\"Con\",\n\"Wis\"\n],\n\"skills\": [\n\"Athletics\",\n\"Perception\"\n],\n\"tool\": \"Smith's Tools\",\n\"toolChoice\": null,\n\"desc\": \"You've swung a pick in the ebony mines of mainland Morrowind or Skyrim, and learned to smelt and work what you dug out. Every miner you've met talks about Vvardenfell's mines, the richest in Tamriel.\",\n\"equipment\": \"A miner's pick, an Apprentice's armourer's hammer, a hooded lantern, Traveller's Clothes and 36 gp\",\n\"gold\": 36,\n\"altGold\": 50,\n\"connection\": \"You know the trade: which mine-owners are honest, who buys raw ore without asking questions, and the names of the Vvardenfell mines every miner talks about.\"\n},\n{\n\"id\": \"fighters-guild-journeyman\",\n\"name\": \"Fighters Guild Journeyman\",\n\"group\": \"Morrowind\",\n\"abilities\": [\n\"Str\",\n\"Dex\",\n\"Con\"\n],\n\"skills\": [\n\"Athletics\",\n\"Survival\"\n],\n\"tool\": \"Smith's Tools\",\n\"toolChoice\": null,\n\"desc\": \"You've taken the Guild's contracts on the mainland: rats, bandits and the occasional thing in a cave. You've learned to keep your own gear in one piece.\",\n\"equipment\": \"A Journeyman's armourer's hammer, a healer's kit, Traveller's Clothes, a bedroll, a rope and 26 gp\",\n\"gold\": 26,\n\"altGold\": 50,\n\"connection\": \"Your Guild writ is good in any hall, Ebonheart's included. They'll give you a bunk for the night and tell you which contracts pay.\"\n},\n{\n\"id\": \"freed-slave\",\n\"name\": \"Freed Slave\",\n\"group\": \"Morrowind\",\n\"abilities\": [\n\"Str\",\n\"Dex\",\n\"Con\"\n],\n\"skills\": [\n\"Athletics\",\n\"Stealth\"\n],\n\"tool\": null,\n\"toolChoice\": \"artisan\",\n\"desc\": \"You were owned in Morrowind, perhaps bought in the slave markets of Tear, and now you aren't. You kept the trade they forced on you, and nothing else. Most freed slaves are Argonians or Khajiit, and wise ones carry papers that prove their freedom.\",\n\"equipment\": \"The Artisan's Tools you chose, Traveller's Clothes, a pouch and 32 gp\",\n\"gold\": 32,\n\"altGold\": 50,\n\"connection\": \"The Twin Lamps, the secret network that smuggles slaves to freedom, helped you once. You know one of their signs, and that they're at work on Vvardenfell too.\"\n},\n{\n\"id\": \"mages-guild-associate\",\n\"name\": \"Mages Guild Associate\",\n\"group\": \"Morrowind\",\n\"abilities\": [\n\"Int\",\n\"Wis\",\n\"Con\"\n],\n\"skills\": [\n\"Arcana\",\n\"Investigation\"\n],\n\"tool\": \"Alchemist's Supplies\",\n\"toolChoice\": null,\n\"desc\": \"You've studied at a Guild hall on the mainland or in Cyrodiil, mostly the alchemy, which pays.\",\n\"equipment\": \"An Apprentice's mortar and pestle, a robe and 24 gp\",\n\"gold\": 24,\n\"altGold\": 50,\n\"connection\": \"Your mentor wrote you a letter of introduction to the Guild on Vvardenfell, and any Guild hall will let you use its library.\"\n},\n{\n\"id\": \"nord-skald\",\n\"name\": \"Nord Skald\",\n\"group\": \"Morrowind\",\n\"abilities\": [\n\"Str\",\n\"Int\",\n\"Cha\"\n],\n\"skills\": [\n\"History\",\n\"Performance\"\n],\n\"tool\": null,\n\"toolChoice\": \"instrument\",\n\"desc\": \"You keep the sagas of your people, and you're making new ones whether anyone asked or not.\",\n\"equipment\": \"A drum, a book of sagas, Traveller's Clothes and 17 gp\",\n\"gold\": 17,\n\"altGold\": 50,\n\"connection\": \"Nords everywhere know the old sagas you sing, and any Nord on the island will buy you a mead for a new one.\"\n},\n{\n\"id\": \"pilgrim\",\n\"name\": \"Pilgrim\",\n\"group\": \"Morrowind\",\n\"abilities\": [\n\"Con\",\n\"Wis\",\n\"Cha\"\n],\n\"skills\": [\n\"Religion\",\n\"Survival\"\n],\n\"tool\": \"Herbalism Kit\",\n\"toolChoice\": null,\n\"desc\": \"You've served at Temple shrines on the mainland, and now you're making the pilgrimage you've dreamed of: the Seven Graces, whose shrines are all on Vvardenfell.\",\n\"equipment\": \"An Herbalism Kit, a Temple holy symbol, a robe, a bedroll, a map of the shrines and 37 gp\",\n\"gold\": 37,\n\"altGold\": 50,\n\"connection\": \"Temple priests and shrine-keepers will give a pilgrim a meal and a mat for the night, and remember your face.\"\n},\n{\n\"id\": \"silt-strider-caravaner\",\n\"name\": \"Silt Strider Caravaner\",\n\"group\": \"Morrowind\",\n\"abilities\": [\n\"Con\",\n\"Wis\",\n\"Cha\"\n],\n\"skills\": [\n\"Animal Handling\",\n\"Persuasion\"\n],\n\"tool\": \"Cartographer's Tools\",\n\"toolChoice\": null,\n\"desc\": \"You've steered the great silt striders between the towns of mainland Morrowind, and talked your passengers out of their nerves.\",\n\"equipment\": \"Cartographer's Tools, Traveller's Clothes, a rope, a bedroll and 31 gp\",\n\"gold\": 31,\n\"altGold\": 50,\n\"connection\": \"Caravaners are a close trade. The strider ports on Vvardenfell will treat you as one of their own, and tell you who's been travelling where.\"\n},\n{\n\"id\": \"smuggler\",\n\"name\": \"Smuggler\",\n\"group\": \"Morrowind\",\n\"abilities\": [\n\"Str\",\n\"Dex\",\n\"Cha\"\n],\n\"skills\": [\n\"Athletics\",\n\"Deception\"\n],\n\"tool\": \"Navigator's Tools\",\n\"toolChoice\": null,\n\"desc\": \"You've rowed contraband into coves on the mainland where the Legion doesn't look.\",\n\"equipment\": \"Navigator's Tools, a hooded lantern for signalling, Traveller's Clothes, a rope and 17 gp\",\n\"gold\": 17,\n\"altGold\": 50,\n\"connection\": \"You know the signals smugglers use around the Inner Sea, and the Bitter Coast's crews know your old one by reputation.\"\n}\n],\n\"signs\": [\n{\n\"id\": \"warrior\",\n\"name\": \"The Warrior\",\n\"month\": \"Last Seed (August)\",\n\"guardian\": \"Guardian\",\n\"brief\": \"Rerolls for attacks, Strength and Constitution\",\n\"flavour\": \"Those born under the Warrior are gifted with weapons of every kind. They are also known for short tempers.\",\n\"traits\": [\n{\n\"name\": \"Warrior's Precision\",\n\"text\": \"<p>When you miss with an attack roll using a weapon or an Unarmed Strike, or fail a Strength or Constitution check or saving throw, you can reroll the d20, and you must use the new roll. You can do this a number of times equal to your Proficiency Bonus, and you regain all uses when you finish a long rest.<\\/p>\"\n}\n]\n},\n{\n\"id\": \"mage\",\n\"name\": \"The Mage\",\n\"month\": \"Rain's Hand (April)\",\n\"guardian\": \"Guardian\",\n\"brief\": \"Two cantrips; rerolls for your spells\",\n\"flavour\": \"Those born under the Mage have a natural talent for spells. They are also known for arrogance and absent-mindedness.\",\n\"traits\": [\n{\n\"name\": \"Gift of the Mage\",\n\"text\": \"<p>You learn two cantrips from the Wizard spell list. Whenever you gain a level, you can replace one of them with another Wizard cantrip.<\\/p>\"\n},\n{\n\"name\": \"Mage's Mastery\",\n\"text\": \"<p>When you miss with a spell attack roll, you can reroll the d20, and you must use the new roll. When a creature succeeds on a saving throw against a spell you cast, you can force it to reroll, and it must use the new roll. You can do either a number of times equal to your Proficiency Bonus, and you regain all uses when you finish a long rest.<\\/p>\"\n}\n],\n\"cantripChoice\": {\n\"n\": 2,\n\"list\": \"Wizard\"\n}\n},\n{\n\"id\": \"thief\",\n\"name\": \"The Thief\",\n\"month\": \"Evening Star (December)\",\n\"guardian\": \"Guardian\",\n\"brief\": \"Luck points for Advantage or Disadvantage\",\n\"flavour\": \"The Thief is the darkest of the Guardians. Those born under it are rarely thieves, but they take more risks than most people and are seldom caught.\",\n\"traits\": [\n{\n\"name\": \"Thief's Luck\",\n\"text\": \"<p>You have a number of Luck Points equal to your Proficiency Bonus, and you regain all of them when you finish a long rest. You can spend one in these ways:<\\/p><ul><li>When you make a Dexterity, Intelligence, Wisdom or Charisma check or saving throw, you can give yourself advantage on the roll.<\\/li><li>When a creature makes an attack roll against you, you can spend a Luck Point to impose Disadvantage on that roll.<\\/li><\\/ul>\"\n}\n]\n},\n{\n\"id\": \"lady\",\n\"name\": \"The Lady\",\n\"month\": \"Heartfire (September)\",\n\"guardian\": \"Warrior\",\n\"brief\": \"Persuasion, extra hit points and faster recovery\",\n\"flavour\": \"Those born under the Lady are kind, tolerant and hard to wear down.\",\n\"traits\": [\n{\n\"name\": \"Lady's Favour\",\n\"text\": \"<p>You have proficiency in Persuasion. If you already have it, choose another Charisma skill instead.<\\/p>\"\n},\n{\n\"name\": \"Lady's Grace\",\n\"text\": \"<p>Your Hit Point maximum increases by 1, and it increases by 1 again each time you gain a level. Whenever you roll a Hit Die to regain Hit Points, you regain extra Hit Points equal to your Proficiency Bonus. When you finish a short rest, you remove 1 Exhaustion level.<\\/p>\"\n}\n],\n\"skills\": {\n\"fixed\": [\n\"Persuasion\"\n],\n\"dupFrom\": [\n\"Deception\",\n\"Intimidation\",\n\"Performance\",\n\"Persuasion\"\n]\n},\n\"hpPerLevel\": 1\n},\n{\n\"id\": \"steed\",\n\"name\": \"The Steed\",\n\"month\": \"Mid Year (June)\",\n\"guardian\": \"Warrior\",\n\"brief\": \"Faster movement, Athletics and quick reactions\",\n\"flavour\": \"Those born under the Steed are restless and impatient, always in a hurry to be somewhere else.\",\n\"traits\": [\n{\n\"name\": \"Fleet\",\n\"text\": \"<p>You have advantage on Initiative rolls.<\\/p>\"\n},\n{\n\"name\": \"Steed's Stride\",\n\"text\": \"<p>Your Speed increases by 10 feet.<\\/p>\"\n},\n{\n\"name\": \"Tireless\",\n\"text\": \"<p>You have proficiency in Athletics. If you already have it, choose another Strength or Dexterity skill instead. When you take the Dash action, difficult terrain doesn't slow you down.<\\/p>\"\n}\n],\n\"skills\": {\n\"fixed\": [\n\"Athletics\"\n],\n\"dupFrom\": [\n\"Acrobatics\",\n\"Athletics\",\n\"Sleight of Hand\",\n\"Stealth\"\n]\n},\n\"speed\": 10,\n\"initAdv\": true\n},\n{\n\"id\": \"lord\",\n\"name\": \"The Lord\",\n\"month\": \"First Seed (March)\",\n\"guardian\": \"Warrior\",\n\"brief\": \"Self-healing; weakness to fire\",\n\"flavour\": \"Those born under the Lord are hardier and healthier than most, and slow to stay down. The same blood makes them burn easily.\",\n\"traits\": [\n{\n\"name\": \"Blood of the North\",\n\"text\": \"<p>As a Bonus Action, you can regain Hit Points equal to your level plus a number of d10s equal to half your Proficiency Bonus (rounded up). Once you use this trait, you can't do so again until you finish a short or long rest.<\\/p>\"\n},\n{\n\"name\": \"Trollkin\",\n\"text\": \"<p>You have Disadvantage on saving throws against effects that deal Fire damage.<\\/p>\"\n}\n]\n},\n{\n\"id\": \"apprentice\",\n\"name\": \"The Apprentice\",\n\"month\": \"Sun's Height (July)\",\n\"guardian\": \"Mage\",\n\"brief\": \"An extra spell slot; weakness to magic\",\n\"flavour\": \"Those born under the Apprentice have a special affinity for magic, and an equal vulnerability to it.\",\n\"traits\": [\n{\n\"name\": \"Apprentice's Wellspring\",\n\"text\": \"<p>You have one extra spell slot, as described above. You regain it when you finish a long rest.<\\/p>\"\n},\n{\n\"name\": \"Arcane Frailty\",\n\"text\": \"<p>When a spell deals damage to you, it deals extra damage equal to your Proficiency Bonus.<\\/p>\"\n}\n],\n\"extraSlots\": 1,\n\"noncasterList\": \"Wizard\"\n},\n{\n\"id\": \"atronach\",\n\"name\": \"The Atronach\",\n\"month\": \"Sun's Dusk (November)\",\n\"guardian\": \"Mage\",\n\"brief\": \"Extra spell slots and spell absorption; slow recovery\",\n\"flavour\": \"Those born under the Atronach are born spellcasters with vast reserves of power. They can't replenish that power naturally, so they draw it from the spells cast at them.\",\n\"traits\": [\n{\n\"name\": \"Deep Reserve\",\n\"text\": \"<p>You have two extra spell slots, as described above. You regain them when you finish a long rest, subject to Stunted Magicka.<\\/p>\"\n},\n{\n\"name\": \"Spell Absorption\",\n\"text\": \"<p>When you succeed on a saving throw against a spell, or a spell attack roll against you misses, you can take a Reaction to regain one expended spell slot. The slot's level can be no higher than half your Proficiency Bonus, rounded up.<\\/p>\"\n},\n{\n\"name\": \"Stunted Magicka\",\n\"text\": \"<p>Whenever a short or long rest would restore all your expended spell slots, you instead regain only half of them, rounded up. You choose which ones.<\\/p>\"\n}\n],\n\"extraSlots\": 2,\n\"noncasterList\": \"Sorcerer\"\n},\n{\n\"id\": \"ritual\",\n\"name\": \"The Ritual\",\n\"month\": \"Morning Star (January)\",\n\"guardian\": \"Mage\",\n\"brief\": \"Healing and turning the undead\",\n\"flavour\": \"Those born under the Ritual carry a spark of divine blessing. They can heal the living and drive back the dead.\",\n\"traits\": [\n{\n\"name\": \"Mara's Gift\",\n\"text\": \"<p>You learn <i>Cure Wounds<\\/i>. When you cast it without a spell slot, you cast it at a spell level equal to half your Proficiency Bonus, rounded up. Once you use this trait, you can't do so again until you finish a long rest.<\\/p>\"\n},\n{\n\"name\": \"Blessed Word\",\n\"text\": \"<p>As a Magic action, you can call on the Divines. Each Undead within 30 feet of you that can see or hear you must make a Wisdom saving throw against your birthsign save DC. On a failure, it has the Frightened condition for 1 minute; it repeats the save at the end of each of its turns, ending the effect on a success. Once you use this trait, you can't do so again until you finish a long rest.<\\/p>\"\n}\n],\n\"spells\": [\n[\n\"Cure Wounds\",\n1\n]\n],\n\"freeAtHalfPb\": true\n},\n{\n\"id\": \"lover\",\n\"name\": \"The Lover\",\n\"month\": \"Sun's Dawn (February)\",\n\"guardian\": \"Thief\",\n\"brief\": \"A stunning touch and a graceful skill\",\n\"flavour\": \"Those born under the Lover are graceful and passionate. Their touch can stop a person in their tracks, at some cost to themselves.\",\n\"traits\": [\n{\n\"name\": \"Lover's Kiss\",\n\"text\": \"<p>As a Magic action, you can touch a creature within reach. It must make a Wisdom saving throw against your birthsign save DC. On a failure, it has the Incapacitated condition and its Speed is 0 until the end of its next turn. Afterward, you have Disadvantage on attack rolls until the end of your next turn. Once you use this trait, you can't do so again until you finish a long rest.<\\/p>\"\n},\n{\n\"name\": \"Lover's Grace\",\n\"text\": \"<p>You have proficiency in your choice of Acrobatics or Performance.<\\/p>\"\n}\n],\n\"skills\": {\n\"choose\": [\n{\n\"n\": 1,\n\"from\": [\n\"Acrobatics\",\n\"Performance\"\n],\n\"label\": \"Lover's Grace\"\n}\n]\n}\n},\n{\n\"id\": \"shadow\",\n\"name\": \"The Shadow\",\n\"month\": \"Second Seed (May)\",\n\"guardian\": \"Thief\",\n\"brief\": \"Brief invisibility\",\n\"flavour\": \"Those born under the Shadow can hide in plain sight, wrapping themselves in darkness when they need to.\",\n\"traits\": [\n{\n\"name\": \"Moonshadow\",\n\"text\": \"<p>As a Bonus Action, you can give yourself the Invisible condition until the end of your next turn. It ends early if you make an attack roll, deal damage or cast a spell. Once you use this trait, you can't do so again until you finish a short or long rest.<\\/p>\"\n}\n]\n},\n{\n\"id\": \"tower\",\n\"name\": \"The Tower\",\n\"month\": \"Frostfall (October)\",\n\"guardian\": \"Thief\",\n\"brief\": \"Opening locks and detecting magic\",\n\"flavour\": \"Those born under the Tower have a nose for gold and a way with locks. Few doors stay closed to them.\",\n\"traits\": [\n{\n\"name\": \"Tower Key\",\n\"text\": \"<p>You have proficiency with Thieves' Tools. You also learn <i>Knock<\\/i>; when you cast it using this trait, it makes no sound.<\\/p>\"\n},\n{\n\"name\": \"Beggar's Nose\",\n\"text\": \"<p>You learn <i>Detect Magic<\\/i>.<\\/p>\"\n}\n],\n\"tools\": [\n\"Thieves' Tools\"\n],\n\"spells\": [\n[\n\"Knock\",\n2\n],\n[\n\"Detect Magic\",\n1\n]\n]\n},\n{\n\"id\": \"serpent\",\n\"name\": \"The Serpent\",\n\"month\": \"None\",\n\"guardian\": \"None\",\n\"brief\": \"Poisonous touches that hurt you too; shrugging off ailments\",\n\"flavour\": \"The Serpent wanders the sky with no season and no master. Those born under it are said to be both the most blessed and the most cursed of all. Its gift is poison, and it never comes free.\",\n\"traits\": [\n{\n\"name\": \"Star-Curse\",\n\"text\": \"<p>As a Magic action, you can touch a creature within reach. It must make a Constitution saving throw against your birthsign save DC. On a failure, it takes 3d6 Poison damage and has the Poisoned condition for 1 minute; it repeats the save at the end of each of its turns, ending the condition on a success. On a success, it takes half as much damage and isn't Poisoned. This damage ignores Resistance to Poison damage. You can use this trait a number of times equal to your Proficiency Bonus, and you regain all expended uses when you finish a long rest.<\\/p><p>The damage increases by 1d6 when you reach levels 5 (4d6), 11 (5d6) and 17 (6d6).<\\/p>\"\n},\n{\n\"name\": \"Shed Skin\",\n\"text\": \"<p>As a Bonus Action, you can end the Poisoned condition on yourself, along with one of these: the Charmed condition, the Frightened condition, or one spell of level 3 or lower that's affecting you. Once you use this trait, you can't do so again until you finish a long rest.<\\/p>\"\n},\n{\n\"name\": \"Serpent's Price\",\n\"text\": \"<p>When you use Star-Curse, you take Poison damage equal to your Proficiency Bonus. This damage can't be reduced or prevented in any way.<\\/p>\"\n}\n]\n}\n],\n\"spells\": {\n\"Bard\": {\n\"cantrips\": [\n\"Blade Ward\",\n\"Dancing Lights\",\n\"Friends\",\n\"Light\",\n\"Mage Hand\",\n\"Mending\",\n\"Message\",\n\"Minor Illusion\",\n\"Prestidigitation\",\n\"Starry Wisp\",\n\"Thunderclap\",\n\"True Strike\",\n\"Vicious Mockery\"\n],\n\"1\": [\n\"Animal Friendship\",\n\"Bane\",\n\"Charm Person\",\n\"Colour Spray\",\n\"Command\",\n\"Comprehend Languages\",\n\"Cure Wounds\",\n\"Detect Magic\",\n\"Disguise Self\",\n\"Dissonant Whispers\",\n\"Faerie Fire\",\n\"Feather Fall\",\n\"Healing Word\",\n\"Heroism\",\n\"Identify\",\n\"Illusory Script\",\n\"Longstr  (arr, l) => (Array.isArray(arr) ? arr[Math.min(arr.length, l) - 1] : arr);\n  const lvData = (n) => (C.lv && C.lv[n]) || {};\n  const asiLevels = () => [4, 8, 12, 16, 19].filter((n) => n <= LV());\n  const featAt = (n) => { const d = lvData(n); return d.asi && d.asi !== \"asi\" ? D.feats.find((f) => f.name === d.asi) || null : null; };\n  const featsTaken = () => asiLevels().map((n) => ({ n, f: featAt(n), d: lvData(n) })).filter((x) => x.f);\n  const featMechs = () => featsTaken().map((x) => ({ ...x, m: D.featMech[x.f.name] || {} }));\n  const subMech = () => (LV() >= 3 && D.subclassMech[C.subclass]) || {};\n  const hasFeat = (name) => featsTaken().some((x) => x.f.name === name);\n  const alwaysNow = (cls) => [...(cls?.cast?.always || []), ...Object.entries(cls?.prog?.always || {}).filter(([l]) => +l <= LV()).flatMap(([, s]) => s)];\n  const slotRow = (cls) => { const pr = cls?.prog || {}; return pr.slots === \"pact\" ? null : (pr.slotTable ? at(pr.slotTable, LV()) : [cls?.cast?.slots || 0]); };\n  const maxSpellLevel = (cls) => { const pr = cls?.prog || {}; return pr.slots === \"pact\" ? at(pr.pact.level, LV()) : (slotRow(cls) || [1]).length; };\n  const hasStyleFeature = (cls) => !!cls && (cls.style || (cls.prog?.style && LV() >= cls.prog.style));\n\n  // ---------- rules ----------\n  function scores() {\n    const base = {};\n    if (C.method === \"pointbuy\") AB.forEach((a) => (base[a] = C.points[a] || 8));\n    else {\n      const pool = C.method === \"dice\" ? C.rolls.map(Number) : STANDARD;\n      AB.forEach((a) => { const i = C.assign[a]; base[a] = i === \"\" || i == null || pool[i] == null || isNaN(pool[i]) ? null : pool[i]; });\n    }\n    const bg = byId(D.backgrounds, C.bg), inc = {};\n    if (bg) {\n      if (C.asiMode === \"111\") bg.abilities.forEach((a) => (inc[a] = 1));\n      else { if (C.asi2) inc[C.asi2] = 2; if (C.asi1 && C.asi1 !== C.asi2) inc[C.asi1] = (inc[C.asi1] || 0) + 1; }\n    }\n    const lvInc = {};  // Ability Score Improvements and       e.preventDefault();
      const terms = lastTerms;
      if (location.hash === "#" + id) chapter(id, terms); else { pendingTerms = terms; location.hash = id; }
    } else if (location.hash === "#" + id) { e.preventDefault(); chapter(id); }
  });


  // ---- encounters (DM edition): a quick-reference page of the stat blocks in a fight ----
  // Each saved encounter lists creatures (one stat block each, with a count) and every creature's hit points.
  // Saved in this browser (localStorage), so prep on one device stays on that device.
  const ENC = DATA.books.some((b) => b.key === "bestiary");
  const encLink = $("#encLink"), encBadge = $("#encBadge");
  app.classList.toggle("enc-on", ENC);
  const EKEY = "vc-encounters";
  // 2024 DMG XP budget per character, by level: [Low, Moderate, High]
  const BUDGET = [null, [50, 75, 100], [100, 150, 200], [150, 225, 400], [250, 375, 500], [500, 750, 1100], [600, 1000, 1400], [750, 1300, 1700],
    [1000, 1700, 2100], [1300, 2000, 2600], [1600, 2300, 3100], [1900, 2900, 4100], [2200, 3700, 4700], [2600, 4200, 5400], [2900, 4900, 6200],
    [3300, 5400, 7800], [3800, 6100, 9800], [4500, 7200, 11700], [5000, 8700, 14200], [5500, 10700, 17200], [6400, 13200, 22000]];
  function sbInfo(html) {  // the numbers the Encounters page needs, read from a stat block's HTML
    const txt = html.replace(/<[^>]+>/g, " ").replace(/&nbsp;/g, " ").replace(/\s+/g, " ");  // spaces between lines, so "AC 13" and "CR 2" stand alone
    const m = (re) => (txt.match(re) || [])[1] || "";
    return { hp: +m(/\bHP (\d+)/) || 1, xp: +m(/XP ([\d,]+)/).replace(/,/g, "") || 0, cr: m(/\bCR ([\d/]+)/), ac: m(/\bAC (\d+)/), init: m(/Initiative ([+−-]\d+)/) };
  }
  let SB = null;
  function sbIndex() {  // every stat block in the books, found once, on first use
    if (SB) return SB;
    SB = { list: [], byKey: {} };
    const tpl = document.createElement("template");
    for (const c of chapters) {
      if (c.tool || !c.h || !c.h.includes('class="statblock"')) continue;
      tpl.innerHTML = c.h;
      let sec = c.id;
      for (const el of tpl.content.querySelectorAll("h1[id], h2[id], h3[id], h4[id], h5[id], .statblock")) {
        if (!el.classList.contains("statblock")) { sec = el.id; continue; }
        const nameEl = el.querySelector(".sb-name"); if (!nameEl) continue;
        const name = nameEl.textContent.trim(), key = `${c.book.key}|${name}`;
        const e = { key, name, nname: norm(name), book: c.book.short, sec, html: el.outerHTML, ...sbInfo(el.outerHTML) };
        if (!SB.byKey[key]) { SB.list.push(e); SB.byKey[key] = e; }
      }
    }
    SB.list.sort((a, b) => a.name.localeCompare(b.name));
    return SB;
  }
  function loadE() {
    try { const v = JSON.parse(store.get(EKEY) || "null"); if (v && Array.isArray(v.list)) return v; } catch (e) {}
    return { v: 1, cur: null, list: [], party: { size: 4, level: 2 } };
  }
  let E = loadE();
  if (!E.party) E.party = { size: 4, level: 2 };
  const curEnc = () => E.list.find((x) => x.id === E.cur) || null;
  const countOf = (enc) => enc ? enc.items.reduce((n, it) => n + it.hp.length, 0) : 0;
  function saveE() { store.set(EKEY, JSON.stringify(E)); updateBadge(); }
  function updateBadge() { const n = countOf(curEnc()); encBadge.textContent = n ? String(n) : ""; }
  function newEnc(name) {
    const enc = { id: "e" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), name: name || `Encounter ${E.list.length + 1}`, items: [] };
    E.list.push(enc); E.cur = enc.id; return enc;
  }
  function addCreature(key) {
    const s = sbIndex().byKey[key]; if (!s) return null;
    const enc = curEnc() || newEnc();
    let it = enc.items.find((x) => x.k === key);
    if (!it) { it = { k: key, n: s.name, snap: s.html, max: s.hp, hp: [] }; enc.items.push(it); }
    it.hp.push(it.max);
    saveE();
    return { enc, it };
  }
  function leaveEnc() { page.classList.remove("encw"); encLink.classList.remove("cur"); confirming = null; }

  // "+ Encounter" on every stat block in a chapter
  function addButtons(c) {
    page.querySelectorAll(".statblock").forEach((sb) => {
      const nameEl = sb.querySelector(".sb-name"); if (!nameEl) return;
      const name = nameEl.textContent.trim();
      const b = document.createElement("button");
      b.type = "button"; b.className = "sb-add"; b.textContent = "+ Encounter"; b.dataset.key = `${c.book.key}|${name}`;
      b.setAttribute("aria-label", `Add ${name} to the encounter`);
      sb.prepend(b);
    });
  }
  let toastTimer;
  function toast(html) {
    let t = document.getElementById("toast");
    if (!t) { t = document.createElement("div"); t.id = "toast"; t.className = "toast"; t.setAttribute("role", "status"); document.body.append(t); }
    t.innerHTML = html; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 4500);
  }
  function addFromBlock(btn) {
    const r = addCreature(btn.dataset.key); if (!r) return;
    const n = r.it.hp.length;
    btn.textContent = n > 1 ? `Added · ×${n}` : "Added ✓";
    setTimeout(() => { btn.textContent = "+ Encounter"; }, 1600);
    toast(`${esc(r.it.n)} added to ${esc(r.enc.name)}${n > 1 ? ` (×${n})` : ""}.<a href="#encounter">Open ›</a>`);
  }

  // the Encounters page
  let confirming = null;
  function encounterView() {
    page.classList.remove("wide"); page.classList.add("encw"); encLink.classList.add("cur");
    renderNav(null); document.title = "Encounters";
    drawEnc(); window.scrollTo(0, 0);
  }
  function difficulty(enc) {
    const xp = enc.items.reduce((t, it) => t + itemInfo(it).xp * it.hp.length, 0);
    const size = Math.max(1, Math.min(10, +E.party.size || 4)), level = Math.max(1, Math.min(20, +E.party.level || 1));
    const [lo, mo, hi] = BUDGET[level].map((b) => b * size);
    const label = !xp ? "" : xp <= lo ? "Low" : xp <= mo ? "Moderate" : xp <= hi ? "High" : "Beyond High";
    return `<span><b>${xp.toLocaleString("en")} XP</b>${label ? ` · <span class="diff">${label}</span>` : ""}</span>
      <label>Party <input id="encSize" type="number" min="1" max="10" value="${size}" aria-label="Number of characters"></label>
      <label>of level <input id="encLevel" type="number" min="1" max="20" value="${level}" aria-label="Character level"></label>
      <span>Budgets: Low ${lo.toLocaleString("en")} · Moderate ${mo.toLocaleString("en")} · High ${hi.toLocaleString("en")}</span>`;
  }
  function itemInfo(it) {
    const s = sbIndex().byKey[it.k], g = GREAT && GREAT[it.k];
    if (it.great && g) return { name: g.name, html: g.html, sec: s ? s.sec : "", book: s ? s.book : "", found: !!s, canGreat: true, ...sbInfo(g.html) };
    if (s) return { name: s.name, html: s.html, sec: s.sec, book: s.book, found: true, canGreat: !!g, hp: s.hp, xp: s.xp, cr: s.cr, ac: s.ac, init: s.init };
    return { name: it.n, html: it.snap, sec: "", book: "", found: false, canGreat: false, ...sbInfo(it.snap || "") };
  }
  const hpState = (h, max) => h <= 0 ? "down" : h <= max / 2 ? "bloodied" : "";
  function hpRow(it, h, j) {
    const st = hpState(h, it.max), many = it.hp.length > 1;
    return `<li class="hp ${st}"><span class="lab">${many ? j + 1 : "HP"}</span>
      <input class="cur" data-j="${j}" inputmode="text" autocomplete="off" value="${h}" aria-label="${esc(it.n)}${many ? " " + (j + 1) : ""}, hit points"
        title="Type a new total, or −7 for damage and +3 to heal, then press Enter"><span class="of">/ ${it.max}</span>
      <span class="st">${st === "down" ? "Down" : st === "bloodied" ? "Bloodied" : ""}</span></li>`;
  }
  function card(it, i) {
    const s = sbIndex().byKey[it.k];
    if (s && s.html !== it.snap) it.snap = s.html;   // follow fixes to the book; keep the saved copy if a creature is ever renamed
    const f = itemInfo(it), n = it.hp.length;
    const greatBox = f.canGreat ? `<label class="great" title="Use the Great Beast template (Bestiary, Chapter One)"><input type="checkbox" data-act="great" ${it.great ? "checked" : ""}> Great beast</label>` : "";
    return `<section class="enc-card${it.great && f.canGreat ? " is-great" : ""}" data-i="${i}">
      <div class="enc-head"><h2>${esc(f.name)}</h2>${greatBox}
        <span class="cnt"><button type="button" data-act="dec" aria-label="One fewer ${esc(it.n)}" ${n <= 1 ? "disabled" : ""}>−</button><span>×${n}</span>
        <button type="button" data-act="inc" aria-label="One more ${esc(it.n)}">+</button></span>
        <button type="button" class="btn danger" data-act="remove">Remove</button></div>
      <p class="enc-meta">${f.found ? `AC ${esc(f.ac)} · Initiative ${esc(f.init)} · CR ${esc(f.cr)} · ${(f.xp * n).toLocaleString("en")} XP · <a href="#${esc(f.sec)}">${esc(f.book)} entry ›</a>${it.great && f.canGreat ? ` · <a href="#bestiary-beasts-of-vvardenfell--great-beasts">Great Beasts ›</a>` : ""}` : "Not found in the books any more; this is the saved copy."}</p>
      <ol class="hp-list">${it.hp.map((h, j) => hpRow(it, h, j)).join("")}</ol>
      <label class="maxhp">Max HP <input type="number" min="1" data-act="max" value="${it.max}" aria-label="${esc(it.n)}, maximum hit points"></label>
      ${f.html}
    </section>`;
  }
  function drawEnc() {
    const enc = curEnc();
    const tabs = `<div class="enc-tabs">${E.list.map((x) => `<button type="button" class="enc-tab" data-enc="${x.id}" aria-pressed="${x.id === E.cur}">${esc(x.name)}<span class="n">${countOf(x)}</span></button>`).join("")}
      <button type="button" class="enc-tab new" data-act="new">+ New encounter</button></div>`;
    let body = `<p class="enc-empty">No encounters yet. Start one with “New encounter”, or use + Encounter on any stat block in the Bestiary or the DM's guide.</p>`;
    if (enc) {
      const tools = confirming === "clear" ? `<span class="q">Remove every creature from ${esc(enc.name)}?</span><button type="button" class="btn go" data-act="clear-yes">Clear</button><button type="button" class="btn" data-act="no">Cancel</button>`
        : confirming === "delete" ? `<span class="q">Delete ${esc(enc.name)}?</span><button type="button" class="btn go" data-act="delete-yes">Delete</button><button type="button" class="btn" data-act="no">Cancel</button>`
        : `<button type="button" class="btn" data-act="reset" ${enc.items.length ? "" : "disabled"}>Reset HP</button>
           <button type="button" class="btn danger" data-act="clear" ${enc.items.length ? "" : "disabled"}>Clear encounter</button>
           <button type="button" class="btn danger" data-act="delete">Delete</button>`;
      body = `<div class="enc-top"><label class="enc-name"><input id="encName" value="${esc(enc.name)}" maxlength="60" aria-label="Encounter name"></label>
          <div class="enc-tools">${tools}</div></div>
        <div class="enc-sum" id="encSum">${difficulty(enc)}</div>
        <div class="enc-add"><input id="encFind" type="search" placeholder="Add a creature: type its name…" autocomplete="off" enterkeyhint="done" aria-label="Find a creature to add">
          <ul class="enc-found" id="encFound"></ul></div>
        <p class="enc-hint">Hit points: type a new total, or −7 for damage and +3 for healing, then press Enter.</p>
        <div class="enc-grid">${enc.items.map(card).join("") || `<p class="enc-empty">No creatures yet. Search above, or use + Encounter on any stat block in the Bestiary or the DM's guide.</p>`}</div>`;
    }
    page.innerHTML = `<div class="enc"><div class="crumb"><span>Dungeon Master's tools</span></div>
      <h1 class="ch">Encounters<small>The stat blocks and hit points for the fight in front of you</small></h1>${tabs}${body}
      <p class="enc-foot">Encounters are saved in this browser, on this device.</p></div>`;
    store.set(EKEY, JSON.stringify(E)); updateBadge();
  }
  function findCreatures(raw) {
    const t = norm(raw.trim()); if (!t) return [];
    const list = sbIndex().list.filter((s) => s.nname.includes(t));
    return list.sort((a, b) => (b.nname.startsWith(t) - a.nname.startsWith(t)) || a.name.localeCompare(b.name)).slice(0, 8);
  }
  function showFound() {
    const box = $("#encFound"), inp = $("#encFind"); if (!box || !inp) return;
    box.innerHTML = findCreatures(inp.value).map((s) => `<li><button type="button" data-key="${esc(s.key)}">${esc(s.name)}<small>CR ${esc(s.cr)} · ${esc(s.book)}</small></button></li>`).join("")
      || (inp.value.trim() ? `<li class="enc-empty">No stat block by that name.</li>` : "");
  }
  function addFromSearch(key) {
    if (!addCreature(key)) return;
    drawEnc();
    const inp = $("#encFind"); if (inp) inp.focus();
  }
  function applyHp(input) {
    const card = input.closest(".enc-card"), enc = curEnc(); if (!card || !enc) return;
    const it = enc.items[+card.dataset.i], j = +input.dataset.j; if (!it) return;
    const v = input.value.trim().replace(/[−–]/g, "-"), old = it.hp[j];
    let h = old;
    if (/^[+-]\s*\d+$/.test(v)) h = old + parseInt(v.replace(/\s/g, ""), 10);
    else if (/^\d+$/.test(v)) h = parseInt(v, 10);
    h = Math.max(0, Math.min(it.max, h));
    it.hp[j] = h; saveE();
    const row = input.closest(".hp"), st = hpState(h, it.max);
    row.className = `hp ${st}`; input.value = h;
    row.querySelector(".st").textContent = st === "down" ? "Down" : st === "bloodied" ? "Bloodied" : "";
  }
  page.addEventListener("click", (e) => {
    if (!page.classList.contains("encw")) return;
    const tab = e.target.closest("[data-enc]");
    if (tab) { E.cur = tab.dataset.enc; confirming = null; drawEnc(); return; }
    const found = e.target.closest(".enc-found button[data-key]");
    if (found) { addFromSearch(found.dataset.key); return; }
    const b = e.target.closest("[data-act]"); if (!b || b.tagName === "INPUT") return;
    const enc = curEnc(), act = b.dataset.act;
    const card = b.closest(".enc-card"), it = card && enc ? enc.items[+card.dataset.i] : null;
    if (act === "new") { newEnc(); confirming = null; drawEnc(); const n = $("#encName"); if (n) { n.focus(); n.select(); } return; }
    if (!enc) return;
    if (act === "reset") enc.items.forEach((x) => { x.hp = x.hp.map(() => x.max); });
    else if (act === "clear" || act === "delete") { confirming = act; }
    else if (act === "no") confirming = null;
    else if (act === "clear-yes") { enc.items = []; confirming = null; }
    else if (act === "delete-yes") { E.list = E.list.filter((x) => x !== enc); E.cur = E.list.length ? E.list[E.list.length - 1].id : null; confirming = null; }
    else if (act === "inc" && it) it.hp.push(it.max);
    else if (act === "dec" && it && it.hp.length > 1) it.hp.pop();
    else if (act === "remove" && it) enc.items.splice(+card.dataset.i, 1);
    else return;
    saveE(); drawEnc();
  });
  page.addEventListener("input", (e) => {
    if (!page.classList.contains("encw")) return;
    const enc = curEnc();
    if (e.target.id === "encFind") showFound();
    else if (e.target.id === "encName" && enc) {
      enc.name = e.target.value.trim() || "Encounter"; saveE();
      const t = page.querySelector(`[data-enc="${enc.id}"]`); if (t) t.firstChild.textContent = enc.name;
    }
  });
  page.addEventListener("change", (e) => {
    if (!page.classList.contains("encw")) return;
    const t = e.target, enc = curEnc(); if (!enc) return;
    if (t.matches(".hp input.cur")) applyHp(t);
    else if (t.dataset.act === "great") {  // switch to or from the great beast version, keeping the damage each creature has taken
      const it = enc.items[+t.closest(".enc-card").dataset.i], oldMax = it.max;
      it.great = t.checked;
      const newMax = itemInfo(it).hp;
      it.hp = it.hp.map((h) => Math.max(0, Math.min(newMax, newMax - (oldMax - h)))); it.max = newMax; saveE(); drawEnc();
    } else if (t.dataset.act === "max") {
      const it = enc.items[+t.closest(".enc-card").dataset.i], v = Math.max(1, parseInt(t.value, 10) || it.max);
      it.hp = it.hp.map((h) => (h === it.max ? v : Math.min(h, v))); it.max = v; saveE(); drawEnc();
    } else if (t.id === "encSize" || t.id === "encLevel") {
      E.party = { size: +$("#encSize").value || 4, level: +$("#encLevel").value || 1 }; saveE();
      $("#encSum").innerHTML = difficulty(enc);
    }
  });
  page.addEventListener("keydown", (e) => {
    if (!page.classList.contains("encw") || e.key !== "Enter") return;
    const t = e.target;
    if (t.matches(".hp input.cur")) { e.preventDefault(); applyHp(t); t.select(); }
    else if (t.id === "encFind") { e.preventDefault(); const first = findCreatures(t.value)[0]; if (first) addFromSearch(first.key); }
    else if (t.id === "encName") { e.preventDefault(); t.blur(); }
  });
  page.addEventListener("focusin", (e) => { if (e.target.matches && e.target.matches(".hp input.cur")) e.target.select(); });
  updateBadge();

  // ---- routing ----
  let pendingTerms = null;
  function route() {
    const id = decodeURIComponent(location.hash.slice(1));
    // #lock (the password-protected DM copy): forget the remembered password and go back to the password page
    if (id === "lock") { store.set("vc-dm-key", ""); try { localStorage.removeItem("vc-dm-key"); } catch (e) {} location.replace(location.pathname); return; }
    if (id === "encounter" && ENC) encounterView();
    else if (id && owner[id]) chapter(id, pendingTerms); else home();
    pendingTerms = null;
    closeDrawer();
  }
  window.addEventListener("hashchange", () => { if (!pendingTerms) { q.value = ""; lastTerms = null; } route(); });
  nav.addEventListener("click", (e) => { const a = e.target.closest("a"); if (a && location.hash === a.getAttribute("href")) { e.preventDefault(); route(); } });

  // ---- drawer, text size, theme ----
  function closeDrawer() { app.classList.remove("open"); }
  $("#menuBtn").addEventListener("click", () => app.classList.add("open"));
  $("#findBtn").addEventListener("click", () => { app.classList.add("open"); setTimeout(() => q.focus(), 60); });
  $("#scrim").addEventListener("click", closeDrawer);
  document.addEventListener("keydown", (e) => {
    if (e.key === "/" && !/^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement || {}).tagName || "")) { e.preventDefault(); app.classList.add("open"); q.focus(); }
    if (e.key === "Escape") { if (q.value) { q.value = ""; lastTerms = null; route(); } closeDrawer(); }
  });
  const sizes = [15, 16, 17, 18.5, 20, 22];
  let si = sizes.indexOf(+store.get("vc-size")); if (si < 0) si = 2;
  const applySize = () => { document.documentElement.style.setProperty("--fs", sizes[si] + "px"); store.set("vc-size", sizes[si]); };
  $("#smaller").addEventListener("click", () => { si = Math.max(0, si - 1); applySize(); });
  $("#larger").addEventListener("click", () => { si = Math.min(sizes.length - 1, si + 1); applySize(); });
  applySize();
  const themeBtn = $("#theme");
  const isDark = () => document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  const syncTheme = () => { themeBtn.textContent = isDark() ? "Day" : "Night"; };
  const savedTheme = store.get("vc-theme"); if (savedTheme) document.documentElement.dataset.theme = savedTheme;
  themeBtn.addEventListener("click", () => { const t = isDark() ? "light" : "dark"; document.documentElement.dataset.theme = t; store.set("vc-theme", t); syncTheme(); });
  syncTheme();

  route();
})();
</script>

</body>
