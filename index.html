t\">Imperial newtscale<\/td><td>12 + Dex<\/td><td>12 lb<\/td><td>60 gp<\/td><td>Common<\/td><td>Fine Imperial scale<\/td><\/tr><tr><td class=\"first\">Wolf<\/td><td>12 + Dex<\/td><td>12 lb<\/td><td>50 gp<\/td><td>Common<\/td><td>Cold Weather; made on Solstheim<\/td><\/tr><tr><td class=\"first\">Dark Brotherhood<\/td><td>13 + Dex<\/td><td>8 lb<\/td><td>Not sold<\/td><td>Uncommon<\/td><td>Advantage on Stealth checks in Dim Light or Darkness<\/td><\/tr><tr><td class=\"first\">Glass<\/td><td>14 + Dex<\/td><td>12 lb<\/td><td>5,000 gp<\/td><td>Rare<\/td><td>Green volcanic glass<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Netch leather and chitin.<\/strong> Netch leather, from the\nhides of herded netch, is the cheapest armour on Vvardenfell. Chitin,\ncut from the shells of giant insects, is lighter and tougher, and it's\nfavoured by Ashlanders and Dunmer scouts.<\/p>\n<p><strong>Glass.<\/strong> Glass armour is made from malachite, a green\nvolcanic crystal, and it's light, beautiful and fabulously expensive.\nWearing it in a poor district is an invitation to be robbed.<\/p>\n<p><strong>Dark Brotherhood.<\/strong> The black leathers of the Dark\nBrotherhood's assassins are made to be invisible in the dark. Nobody\nsells them, and the Brotherhood takes an interest in anyone wearing a\nset who isn't one of its own.<\/p>\n<h3 id=\"items-armour-and-clothing--medium-armour\">Medium Armour<\/h3>\n<p>Medium armour is the choice of soldiers and guards who need\nprotection but still have to move. Add your Dexterity modifier, to a\nmaximum of +2, to the AC shown. \"Disadv.\" means the armour gives\nDisadvantage on Dexterity (Stealth) checks.<\/p>\n<div class=\"tw\"><table><thead><tr><th>Armour<\/th><th>AC<\/th><th>Stealth<\/th><th>Weight<\/th><th>Price<\/th><th>Rarity<\/th><th>Notes<\/th><\/tr><\/thead><tbody><tr><td class=\"first\">Bear<\/td><td>12<\/td><td>—<\/td><td>15 lb<\/td><td>15 gp<\/td><td>Common<\/td><td>Cold Weather; made on Solstheim<\/td><\/tr><tr><td class=\"first\">Nordic ringmail<\/td><td>13<\/td><td>Disadv.<\/td><td>20 lb<\/td><td>50 gp<\/td><td>Common<\/td><td>Nord mail<\/td><\/tr><tr><td class=\"first\">Imperial chain<\/td><td>14<\/td><td>Disadv.<\/td><td>45 lb<\/td><td>50 gp<\/td><td>Common<\/td><td>Imperial issue<\/td><\/tr><tr><td class=\"first\">Bonemold<\/td><td>14<\/td><td>Disadv.<\/td><td>20 lb<\/td><td>400 gp<\/td><td>Common<\/td><td>Worn by Great House guards<\/td><\/tr><tr><td class=\"first\">Bonemold, ornate<\/td><td>14<\/td><td>Disadv.<\/td><td>20 lb<\/td><td>450 gp<\/td><td>Common<\/td><td>The Armun-An and Gah-Julan styles<\/td><\/tr><tr><td class=\"first\">Imperial dragonscale<\/td><td>15<\/td><td>Disadv.<\/td><td>40 lb<\/td><td>750 gp<\/td><td>Common<\/td><td>Imperial scale armour<\/td><\/tr><tr><td class=\"first\">Orcish<\/td><td>16<\/td><td>Disadv.<\/td><td>25 lb<\/td><td>800 gp<\/td><td>Uncommon<\/td><td>Forged by Orc smiths<\/td><\/tr><tr><td class=\"first\">Dreugh<\/td><td>15<\/td><td>—<\/td><td>25 lb<\/td><td>1,000 gp<\/td><td>Uncommon<\/td><td>Made from dreugh shell; quiet<\/td><\/tr><tr><td class=\"first\">Adamantium<\/td><td>16<\/td><td>Disadv.<\/td><td>25 lb<\/td><td>1,200 gp<\/td><td>Uncommon<\/td><td>Critical Hits against you become normal hits<\/td><\/tr><tr><td class=\"first\">Indoril<\/td><td>16<\/td><td>Disadv.<\/td><td>25 lb<\/td><td>Not sold<\/td><td>Uncommon<\/td><td>The armour of the Ordinators<\/td><\/tr><tr><td class=\"first\">Ice (stalhrim)<\/td><td>16<\/td><td>Disadv.<\/td><td>25 lb<\/td><td>5,000 gp<\/td><td>Rare<\/td><td>Resistance to Cold damage; Cold Weather<\/td><\/tr><tr><td class=\"first\">Royal Guard<\/td><td>16<\/td><td>Disadv.<\/td><td>25 lb<\/td><td>Not sold<\/td><td>Rare<\/td><td>The armour of Mournhold's Royal Guard<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Bonemold.<\/strong> Bonemold is Morrowind's own armour: bone\nshaped and bonded with resin into smooth, hard plates. The Great Houses\noutfit their guards in it, and a suit is a sign of respectability. The\nornate Armun-An and Gah-Julan styles cost a little more.<\/p>\n<p><strong>Orcish and dreugh.<\/strong> Orc smiths are among the best in\nTamriel, and their armour is prized everywhere. Dreugh armour is cut\nfrom the shells of the sea monsters, which is why hunters risk the\nshallows for them. Apart from bear hide, it's the only medium armour\nquiet enough for sneaking.<\/p>\n<p><strong>Adamantium.<\/strong> This rare, shining ore is mined beneath\nMournhold, and armour made from it turns the worst blows.<\/p>\n<p><strong>Indoril.<\/strong> Ordinators wear this armour, with its\ndistinctive masked helm, as the uniform of the Temple's enforcers.\nOrdinators attack anyone who isn't one of their order seen wearing it,\nand they don't ask questions first.<\/p>\n<p><strong>Ice.<\/strong> Ice armour is carved from stalhrim, an\nenchanted ice found in the barrows of Solstheim, which never melts. It\nshrugs off the worst cold, giving its wearer Resistance to Cold damage,\nand only a few smiths know how to work it.<\/p>\n<h3 id=\"items-armour-and-clothing--heavy-armour\">Heavy Armour<\/h3>\n<p>Heavy armour gives the most protection, at the cost of weight and\nnoise. It doesn't add your Dexterity modifier to AC, it gives\nDisadvantage on Dexterity (Stealth) checks, and it has a Strength\nrequirement. If your Strength is lower, your Speed drops by 10 feet.<\/p>\n<div class=\"tw\"><table><thead><tr><th>Armour<\/th><th>AC<\/th><th>Strength<\/th><th>Weight<\/th><th>Price<\/th><th>Rarity<\/th><th>Notes<\/th><\/tr><\/thead><tbody><tr><td class=\"first\">Iron<\/td><td>16<\/td><td>13<\/td><td>55 lb<\/td><td>75 gp<\/td><td>Common<\/td><td>Cheap and common<\/td><\/tr><tr><td class=\"first\">Steel<\/td><td>17<\/td><td>15<\/td><td>60 lb<\/td><td>200 gp<\/td><td>Common<\/td><td><\/td><\/tr><tr><td class=\"first\">Nordic iron<\/td><td>17<\/td><td>15<\/td><td>65 lb<\/td><td>200 gp<\/td><td>Common<\/td><td>Cold Weather<\/td><\/tr><tr><td class=\"first\">Imperial steel<\/td><td>17<\/td><td>15<\/td><td>60 lb<\/td><td>250 gp<\/td><td>Common<\/td><td>Imperial Legion issue<\/td><\/tr><tr><td class=\"first\">Nordic trollbone<\/td><td>17<\/td><td>15<\/td><td>60 lb<\/td><td>250 gp<\/td><td>Common<\/td><td>Cold Weather<\/td><\/tr><tr><td class=\"first\">Imperial Templar<\/td><td>18<\/td><td>15<\/td><td>65 lb<\/td><td>1,500 gp<\/td><td>Common<\/td><td>Worn by Imperial templar knights<\/td><\/tr><tr><td class=\"first\">Imperial silver<\/td><td>18<\/td><td>15<\/td><td>65 lb<\/td><td>1,600 gp<\/td><td>Common<\/td><td>Silver-plated steel<\/td><\/tr><tr><td class=\"first\">Duke's Guard silver<\/td><td>18<\/td><td>15<\/td><td>65 lb<\/td><td>Not sold<\/td><td>Common<\/td><td>Worn by the Duke's guards in Ebonheart<\/td><\/tr><tr><td class=\"first\">Dwemer<\/td><td>18<\/td><td>15<\/td><td>65 lb<\/td><td>1,500 gp<\/td><td>Common<\/td><td>Salvaged from ruins; trade is restricted<\/td><\/tr><tr><td class=\"first\">Ebony<\/td><td>19<\/td><td>15<\/td><td>70 lb<\/td><td>6,000 gp<\/td><td>Rare<\/td><td>Black volcanic glass<\/td><\/tr><tr><td class=\"first\">Nordic mail<\/td><td>19<\/td><td>15<\/td><td>65 lb<\/td><td>6,000 gp<\/td><td>Rare<\/td><td>Cold Weather; made on Solstheim<\/td><\/tr><tr><td class=\"first\">Daedric<\/td><td>20<\/td><td>17<\/td><td>80 lb<\/td><td>40,000 gp<\/td><td>Very Rare<\/td><td>Ebony bound with the spirit of a Daedra<\/td><\/tr><tr><td class=\"first\">Her Hand's<\/td><td>20<\/td><td>17<\/td><td>75 lb<\/td><td>Not sold<\/td><td>Very Rare<\/td><td>The armour of Almalexia's Hands<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Iron and steel.<\/strong> Every smith on the island can make\niron and steel plate, and the Imperial Legion wears its own steel. Nords\nfrom Skyrim and Solstheim favour heavy iron and trollbone armour, lined\nagainst the cold.<\/p>\n<p><strong>Dwemer.<\/strong> Dwemer armour is salvaged from the ruins,\nnot made, and it's built from the Dwemer's strange bronze-coloured\nmetal. Selling it openly breaks Imperial law, so most of it changes\nhands quietly.<\/p>\n<p><strong>Ebony.<\/strong> Ebony is a black volcanic glass, rarer and\nstronger than steel, and Vvardenfell's mines are the richest in Tamriel.\nEbony armour is heavy, near-unbreakable and a mark of real wealth.<\/p>\n<p><strong>Daedric.<\/strong> Daedric armour is ebony forged with the\nbound spirit of a Daedra. It's the heaviest armour there is, and the\nstrongest, and very few smiths alive can make it. It's said a suit can\nonly be finished under the right phase of the moons.<\/p>\n<p><strong>Her Hand's.<\/strong> Almalexia's personal guards, Her Hands,\nwear this ornate armour in Mournhold. Anyone else found wearing it there\nwill have a great deal of explaining to do.<\/p>\n<h3 id=\"items-armour-and-clothing--shields\">Shields<\/h3>\n<p>A shield adds to your AC while you hold it, as normal. Most shields\non Vvardenfell are made of the same materials as armour.<\/p>\n<div class=\"tw\"><table><thead><tr><th>Shield<\/th><th>AC<\/th><th>Weight<\/th><th>Price<\/th><th>Rarity<\/th><th>Notes<\/th><\/tr><\/thead><tbody><tr><td class=\"first\">Netch leather or chitin<\/td><td>+2<\/td><td>4 lb<\/td><td>10 gp<\/td><td>Common<\/td><td><\/td><\/tr><tr><td class=\"first\">Iron, steel or Nordic<\/td><td>+2<\/td><td>8 lb<\/td><td>15 gp<\/td><td>Common<\/td><td><\/td><\/tr><tr><td class=\"first\">Bonemold<\/td><td>+2<\/td><td>6 lb<\/td><td>30 gp<\/td><td>Common<\/td><td>Great House guards carry their house's colours<\/td><\/tr><tr><td class=\"first\">Dwemer<\/td><td>+2<\/td><td>8 lb<\/td><td>50 gp<\/td><td>Common<\/td><td>Trade is restricted<\/td><\/tr><tr><td class=\"first\">Orcish tower<\/td><td>+3<\/td><td>12 lb<\/td><td>800 gp<\/td><td>Uncommon<\/td><td><\/td><\/tr><tr><td class=\"first\">Dreugh<\/td><td>+3<\/td><td>8 lb<\/td><td>800 gp<\/td><td>Uncommon<\/td><td><\/td><\/tr><tr><td class=\"first\">Glass<\/td><td>+3<\/td><td>6 lb<\/td><td>1,000 gp<\/td><td>Uncommon<\/td><td><\/td><\/tr><tr><td class=\"first\">Ebony<\/td><td>+3<\/td><td>12 lb<\/td><td>1,200 gp<\/td><td>Uncommon<\/td><td><\/td><\/tr><tr><td class=\"first\">Daedric<\/td><td>+3<\/td><td>15 lb<\/td><td>1,500 gp<\/td><td>Uncommon<\/td><td><\/td><\/tr><tr><td class=\"first\">Daedric tower<\/td><td>+4<\/td><td>18 lb<\/td><td>6,000 gp<\/td><td>Rare<\/td><td>Taken only from golden saints<\/td><\/tr><\/tbody><\/table><\/div>\n<h3 id=\"items-armour-and-clothing--wear-and-repair\">Wear and Repair<\/h3>\n<p>Gear can wear out and break under an optional rule. It's in the\n<em>Player's Guide<\/em>: see <a class=\"xref\" href=\"#guide-house-rules--wear-and-repair\">Wear\nand Repair<\/a>.<\/p>\n<h3 id=\"items-armour-and-clothing--clothing\">Clothing<\/h3>\n<p>Clothing comes in four grades, from a farmer's homespun to a Telvanni\nlord's robes. Better clothing costs more, and it can hold a stronger\nenchantment (see <a class=\"xref\" href=\"#guide-house-rules--enchanting\">Enchanting<\/a> in the\n<em>Player's Guide<\/em>). Rings and amulets come in the same four\ngrades, at the single-piece price.<\/p>\n<div class=\"tw\"><table><thead><tr><th>Grade<\/th><th>Example<\/th><th>Full outfit<\/th><th>Single piece<\/th><th>Holds enchantments up to<\/th><\/tr><\/thead><tbody><tr><td class=\"first\">Common<\/td><td>Homespun shirt, trousers and shoes<\/td><td>1 gp<\/td><td>2 sp<\/td><td>Common<\/td><\/tr><tr><td class=\"first\">Expensive<\/td><td>Dyed linen, a good belt and boots<\/td><td>15 gp<\/td><td>3 gp<\/td><td>Uncommon<\/td><\/tr><tr><td class=\"first\">Extravagant<\/td><td>Silk and embroidery<\/td><td>75 gp<\/td><td>15 gp<\/td><td>Rare<\/td><\/tr><tr><td class=\"first\">Exquisite<\/td><td>Fine silk and gold thread<\/td><td>300 gp<\/td><td>60 gp<\/td><td>Very Rare<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Dress the part.<\/strong> Under this optional rule, a\ncharacter in extravagant or exquisite clothing has Advantage on their\nfirst Charisma check to impress a noble, a councillor or a wealthy\nmerchant, but Disadvantage among Ashlanders, the poor and pilgrims.<\/p>\n"},{"id":"items-weapons","t":"Weapons","s":[{"id":"items-weapons--weapons-of-morrowind","t":"Weapons of Morrowind","l":2},{"id":"items-weapons--weapon-mastery","t":"Weapon Mastery","l":2},{"id":"items-weapons--simple-weapons","t":"Simple Weapons","l":2},{"id":"items-weapons--martial-weapons","t":"Martial Weapons","l":2},{"id":"items-weapons--exotic-weapons","t":"Exotic Weapons","l":2},{"id":"items-weapons--materials","t":"Materials","l":2},{"id":"items-weapons--silver-and-better","t":"Silver and Better","l":2},{"id":"items-weapons--whats-made-from-what","t":"What's Made from What","l":2},{"id":"items-weapons--ammunition-and-throwing-weapons","t":"Ammunition and Throwing Weapons","l":2},{"id":"items-weapons--arrows-and-bolts","t":"Arrows and Bolts","l":3},{"id":"items-weapons--throwing-weapons","t":"Throwing Weapons","l":3},{"id":"items-weapons--weapons-from-elsewhere","t":"Weapons from Elsewhere","l":2}],"h":"\n\n<div class=\"epigraph\">\n<p><em>“A Daedric blade will outlive you, your children and whoever\nkills you for it.”<\/em><\/p>\n<\/div>\n<div class=\"attribution\">\n<p>— A weaponsmith in Vivec<\/p>\n<\/div>\n<h3 id=\"items-weapons--weapons-of-morrowind\">Weapons of Morrowind<\/h3>\n<p class=\"dropcap\">Vvardenfell is armed to the teeth. Pilgrims carry\nspears against kagouti, Ashlanders hunt with chitin bows, Redoran guards\nwear their broadswords openly in the street, and every tomb on the\nisland holds something sharp. What a weapon is made of matters as much\nas its shape: a steel longsword is ordinary, a glass one is worth a\nhouse, and a Daedric one is worth killing for.<\/p>\n<p>All weapons here use the 2024 rules: Simple and Martial categories,\nproperties and Weapon Mastery.<\/p>\n<ul>\n<li>\n<p><strong>Simple, Martial and Exotic.<\/strong> Most weapons are Simple\nor Martial, as normal. Exotic weapons are the Akaviri blades, which need\nspecial training to use well.<\/p>\n<\/li>\n<li>\n<p><strong>Counts as.<\/strong> Many Morrowind weapons have different\nnames from the <em>Player's Handbook<\/em> weapons. The \"As\" column names\nthe <em>Player's Handbook<\/em> weapon each one counts as, for feats,\nclass features and spells such as <em>Shillelagh<\/em>. A dash means the\nnames are the same.<\/p>\n<\/li>\n<li>\n<p><strong>Steel prices.<\/strong> The tables give prices for weapons\nmade of steel. Other materials change the price, and the better ones\ngive a bonus to attack and damage rolls (see Materials).<\/p>\n<\/li>\n<li>\n<p><strong>Weapon skills.<\/strong> In the games, each weapon belongs to\na skill, such as Short Blade or Spear. Here, proficiency follows the\nD&amp;D categories, so a fighter is as good with a halberd as with a\nclaymore.<\/p>\n<\/li>\n<\/ul>\n<h3 id=\"items-weapons--weapon-mastery\">Weapon Mastery<\/h3>\n<p>Every weapon in this chapter has a mastery property, shown in its\nMastery column. Who can use mastery, and what each property does, is in\n<a class=\"xref\" href=\"#guide-classes-on-vvardenfell--weapon-mastery\">Step Two of the Player's Guide<\/a>,\nwith the rest of character creation.<\/p>\n<h3 id=\"items-weapons--simple-weapons\">Simple Weapons<\/h3>\n<p>Simple weapons are the tools of farmers, miners, pilgrims and anyone\nwho can't afford a sword. Every class can use them.<\/p>\n<div class=\"tw\"><table><thead><tr><th>Weapon<\/th><th>As<\/th><th>Damage<\/th><th>Properties<\/th><th>Mastery<\/th><th>Weight<\/th><th>Price<\/th><\/tr><\/thead><tbody><tr><td class=\"first\">Axe<\/td><td>Handaxe<\/td><td>1d6 Slashing<\/td><td>Light, Thrown (20/60)<\/td><td>Vex<\/td><td>2 lb<\/td><td>5 gp<\/td><\/tr><tr><td class=\"first\">Club<\/td><td>—<\/td><td>1d4 Bludgeoning<\/td><td>Light<\/td><td>Slow<\/td><td>2 lb<\/td><td>1 sp<\/td><\/tr><tr><td class=\"first\">Dagger<\/td><td>—<\/td><td>1d4 Piercing<\/td><td>Finesse, Light, Thrown (20/60)<\/td><td>Nick<\/td><td>1 lb<\/td><td>2 gp<\/td><\/tr><tr><td class=\"first\">Mace<\/td><td>—<\/td><td>1d6 Bludgeoning<\/td><td>—<\/td><td>Sap<\/td><td>4 lb<\/td><td>5 gp<\/td><\/tr><tr><td class=\"first\">Miner's pick<\/td><td>—<\/td><td>1d8 Piercing<\/td><td>Two-Handed<\/td><td>Sap<\/td><td>8 lb<\/td><td>2 gp<\/td><\/tr><tr><td class=\"first\">Spear<\/td><td>—<\/td><td>1d6 Piercing<\/td><td>Thrown (20/60), Versatile (1d8)<\/td><td>Sap<\/td><td>3 lb<\/td><td>1 gp<\/td><\/tr><tr><td class=\"first\">Staff<\/td><td>Quarterstaff<\/td><td>1d6 Bludgeoning<\/td><td>Versatile (1d8)<\/td><td>Topple<\/td><td>4 lb<\/td><td>2 sp<\/td><\/tr><tr><td class=\"first\">Light crossbow<\/td><td>—<\/td><td>1d8 Piercing<\/td><td>Ammunition (80/320; bolt), Loading, Two-Handed<\/td><td>Slow<\/td><td>5 lb<\/td><td>25 gp<\/td><\/tr><tr><td class=\"first\">Short bow<\/td><td>Shortbow<\/td><td>1d6 Piercing<\/td><td>Ammunition (80/320; arrow), Two-Handed<\/td><td>Vex<\/td><td>2 lb<\/td><td>25 gp<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Axes and miner's picks.<\/strong> The axe is a light,\none-handed axe for chopping wood as much as heads. Miner's picks are\ntools first: every egg mine and ebony mine on the island has a rack of\nthem, and miners know how to swing one.<\/p>\n<p><strong>Staffs.<\/strong> A staff is the traditional weapon of mages,\nand the Mages Guild and the Telvanni carry them as a sign of their\ncalling as much as for defence.<\/p>\n<p><strong>Light crossbows.<\/strong> The hunters of Solstheim use a\nsmall crossbow for game. On Vvardenfell, these huntsman crossbows are\nrare and found mostly in Nord hands.<\/p>\n<h3 id=\"items-weapons--martial-weapons\">Martial Weapons<\/h3>\n<p>Martial weapons need a soldier's training. They're the weapons of the\nLegion, the Great House guards and anyone who fights for a living.<\/p>\n<div class=\"tw\"><table><thead><tr><th>Weapon<\/th><th>As<\/th><th>Damage<\/th><th>Properties<\/th><th>Mastery<\/th><th>Weight<\/th><th>Price<\/th><\/tr><\/thead><tbody><tr><td class=\"first\">Battle axe<\/td><td>Greataxe<\/td><td>1d12 Slashing<\/td><td>Heavy, Two-Handed<\/td><td>Cleave<\/td><td>7 lb<\/td><td>30 gp<\/td><\/tr><tr><td class=\"first\">Broadsword<\/td><td>Longsword<\/td><td>1d8 Slashing<\/td><td>Versatile (1d10)<\/td><td>Graze<\/td><td>3 lb<\/td><td>10 gp<\/td><\/tr><tr><td class=\"first\">Claymore<\/td><td>Greatsword<\/td><td>2d6 Slashing<\/td><td>Heavy, Two-Handed<\/td><td>Graze<\/td><td>6 lb<\/td><td>50 gp<\/td><\/tr><tr><td class=\"first\">Glaive<\/td><td>—<\/td><td>1d10 Slashing<\/td><td>Heavy, Reach, Two-Handed<\/td><td>Graze<\/td><td>6 lb<\/td><td>20 gp<\/td><\/tr><tr><td class=\"first\">Halberd<\/td><td>—<\/td><td>1d10 Slashing<\/td><td>Heavy, Reach, Two-Handed<\/td><td>Cleave<\/td><td>6 lb<\/td><td>20 gp<\/td><\/tr><tr><td class=\"first\">Long spear<\/td><td>Pike<\/td><td>1d10 Piercing<\/td><td>Heavy, Reach, Two-Handed<\/td><td>Push<\/td><td>10 lb<\/td><td>10 gp<\/td><\/tr><tr><td class=\"first\">Longsword<\/td><td>—<\/td><td>1d8 Slashing<\/td><td>Versatile (1d10)<\/td><td>Sap<\/td><td>3 lb<\/td><td>15 gp<\/td><\/tr><tr><td class=\"first\">Rapier<\/td><td>—<\/td><td>1d8 Piercing<\/td><td>Finesse<\/td><td>Vex<\/td><td>2 lb<\/td><td>25 gp<\/td><\/tr><tr><td class=\"first\">Saber<\/td><td>Scimitar<\/td><td>1d6 Slashing<\/td><td>Finesse, Light<\/td><td>Nick<\/td><td>3 lb<\/td><td>25 gp<\/td><\/tr><tr><td class=\"first\">Shortsword<\/td><td>—<\/td><td>1d6 Piercing<\/td><td>Finesse, Light<\/td><td>Vex<\/td><td>2 lb<\/td><td>10 gp<\/td><\/tr><tr><td class=\"first\">Spiked club<\/td><td>Morningstar<\/td><td>1d8 Piercing<\/td><td>—<\/td><td>Sap<\/td><td>4 lb<\/td><td>15 gp<\/td><\/tr><tr><td class=\"first\">Trident<\/td><td>—<\/td><td>1d8 Piercing<\/td><td>Thrown (20/60), Versatile (1d10)<\/td><td>Topple<\/td><td>4 lb<\/td><td>5 gp<\/td><\/tr><tr><td class=\"first\">War axe<\/td><td>Battleaxe<\/td><td>1d8 Slashing<\/td><td>Versatile (1d10)<\/td><td>Topple<\/td><td>4 lb<\/td><td>10 gp<\/td><\/tr><tr><td class=\"first\">Warhammer<\/td><td>Maul<\/td><td>2d6 Bludgeoning<\/td><td>Heavy, Two-Handed<\/td><td>Topple<\/td><td>10 lb<\/td><td>10 gp<\/td><\/tr><tr><td class=\"first\">Whip<\/td><td>—<\/td><td>1d4 Slashing<\/td><td>Finesse, Reach<\/td><td>Slow<\/td><td>3 lb<\/td><td>2 gp<\/td><\/tr><tr><td class=\"first\">Crossbow<\/td><td>Heavy crossbow<\/td><td>1d10 Piercing<\/td><td>Ammunition (100/400; bolt), Heavy, Loading, Two-Handed<\/td><td>Push<\/td><td>18 lb<\/td><td>50 gp<\/td><\/tr><tr><td class=\"first\">Long bow<\/td><td>Longbow<\/td><td>1d8 Piercing<\/td><td>Ammunition (150/600; arrow), Heavy, Two-Handed<\/td><td>Slow<\/td><td>2 lb<\/td><td>50 gp<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Broadswords and longswords.<\/strong> The broadsword is a\nwide, heavy blade made for chopping, and it's the sidearm of the\nImperial Legion and the Redoran guard. The longsword is the classic\nknight's sword, as good at thrusting as cutting. They're both Versatile\nand differ only in their mastery.<\/p>\n<p><strong>Glaives and tridents.<\/strong> A glaive is a long, curved\nblade on a pole, the weapon of guards who hold gates and bridges.\nTridents are fishing spears first: the fishers of the Bitter Coast and\nAzura's Coast use them on slaughterfish, and they work as well on\nanything else. A trident can be made of any material a spear can.<\/p>\n<p><strong>Rapiers.<\/strong> Breton and Imperial fencing masters brought\nthe rapier to Vvardenfell, and it's fashionable among young Hlaalu\nnobles and Imperial officers. Its slim blade is too fine for iron, so\nrapiers come only in steel, silver, glass, ebony and Daedric metal.<\/p>\n<p><strong>Whips.<\/strong> A whip's lash is netch leather, so its\nmaterial is the barbs worked into it: chitin, iron, steel or silver. On\nVvardenfell, the whip is a slaver's tool, and carrying one openly says\nso. Argonians and Khajiit will treat its owner accordingly.<\/p>\n<p><strong>Warhammers.<\/strong> Morrowind's warhammers are huge\ntwo-handed hammers, so they use the maul's statistics, not the\nwarhammer's from the <em>Player's Handbook<\/em>. Orcs favour them.<\/p>\n<p><strong>Crossbows.<\/strong> The crossbows of Morrowind are powerful\nImperial and Dwemer weapons, slow to load but hard-hitting. They use the\nheavy crossbow's statistics. Dwemer crossbows are salvaged from the\nruins and their trade is restricted.<\/p>\n<p><strong>Long bows.<\/strong> House Redoran's archers carry bonemold\nlong bows, and Ashlander hunters prefer the short bow. A long bow is the\nbetter weapon for anyone strong enough to draw it.<\/p>\n<h3 id=\"items-weapons--exotic-weapons\">Exotic Weapons<\/h3>\n<p>Exotic weapons are the Akaviri blades: the tanto, wakizashi, katana\nand dai-katana. Their design came to Tamriel with the Akaviri warriors\nwho founded the Blades, and they're forged to a finer edge than any\nother sword in the Empire. They're rare on Vvardenfell, and made only in\niron, steel and Daedric metal.<\/p>\n<div class=\"tw\"><table><thead><tr><th>Weapon<\/th><th>Untrained<\/th><th>Damage<\/th><th>Properties<\/th><th>Mastery<\/th><th>Weight<\/th><th>Price<\/th><\/tr><\/thead><tbody><tr><td class=\"first\">Tanto<\/td><td>Dagger<\/td><td>1d6 Piercing<\/td><td>Finesse, Light, Thrown (20/60)<\/td><td>Nick<\/td><td>1 lb<\/td><td>10 gp<\/td><\/tr><tr><td class=\"first\">Wakizashi<\/td><td>Saber<\/td><td>1d8 Slashing<\/td><td>Finesse, Light<\/td><td>Nick<\/td><td>2 lb<\/td><td>30 gp<\/td><\/tr><tr><td class=\"first\">Katana<\/td><td>Longsword<\/td><td>1d8 Slashing<\/td><td>Finesse, Versatile (1d10)<\/td><td>Sap<\/td><td>3 lb<\/td><td>50 gp<\/td><\/tr><tr><td class=\"first\">Dai-katana<\/td><td>Claymore<\/td><td>2d6 Slashing<\/td><td>Finesse, Heavy, Two-Handed<\/td><td>Graze<\/td><td>6 lb<\/td><td>100 gp<\/td><\/tr><\/tbody><\/table><\/div>\n<ul>\n<li>\n<p><strong>Untrained.<\/strong> Without training, an Akaviri blade works\nexactly like the weapon in the Untrained column, and you need\nproficiency with that weapon to use it well.<\/p>\n<\/li>\n<li>\n<p><strong>Training.<\/strong> A character proficient with the Untrained\nweapon can train to use an Akaviri blade's full statistics. Training\ntakes 10 days and costs 250 gp, and it covers every Akaviri blade whose\nUntrained weapon you're proficient with. On Vvardenfell, the only\nteachers are the Blades, and they choose their students carefully.<\/p>\n<\/li>\n<li>\n<p><strong>Weapon Mastery.<\/strong> A trained character can choose an\nAkaviri blade for Weapon Mastery, like any Martial weapon.<\/p>\n<\/li>\n<li>\n<p><strong>Daisho.<\/strong> A trained character holding a katana in one\nhand and a tanto or wakizashi in the other can make the Light property's\nextra attack with the short blade after attacking with the katana, even\nthough the katana isn't Light.<\/p>\n<\/li>\n<\/ul>\n<h3 id=\"items-weapons--materials\">Materials<\/h3>\n<p>Every weapon in this chapter can be made from more than iron and\nsteel. A material doesn't change a weapon's damage or properties, but\nthe better ones give a bonus to attack and damage rolls, like a +1, +2\nor +3 weapon.<\/p>\n<div class=\"tw\"><table><thead><tr><th>Material<\/th><th>Bonus<\/th><th>Rarity<\/th><th>Price<\/th><th>Silver<\/th><th>Notes<\/th><\/tr><\/thead><tbody><tr><td class=\"first\">Chitin<\/td><td>—<\/td><td>Common<\/td><td>Half<\/td><td>—<\/td><td>Half weight<\/td><\/tr><tr><td class=\"first\">Iron<\/td><td>—<\/td><td>Common<\/td><td>Half<\/td><td>—<\/td><td>Includes riekling weapons<\/td><\/tr><tr><td class=\"first\">Steel<\/td><td>—<\/td><td>Common<\/td><td>As listed<\/td><td>—<\/td><td>Includes Imperial, Nordic and huntsman weapons<\/td><\/tr><tr><td class=\"first\">Bonemold<\/td><td>—<\/td><td>Common<\/td><td>×4<\/td><td>—<\/td><td>Bows and ammunition only<\/td><\/tr><tr><td class=\"first\">Silver<\/td><td>—<\/td><td>Common<\/td><td>+100 gp<\/td><td>Yes<\/td><td><\/td><\/tr><tr><td class=\"first\">Dreugh<\/td><td>+1<\/td><td>Uncommon<\/td><td>500 gp<\/td><td>—<\/td><td>Clubs and staffs only<\/td><\/tr><tr><td class=\"first\">Dwemer<\/td><td>+1<\/td><td>Uncommon<\/td><td>750 gp<\/td><td>—<\/td><td>Trade is restricted<\/td><\/tr><tr><td class=\"first\">Orcish<\/td><td>+1<\/td><td>Uncommon<\/td><td>800 gp<\/td><td>—<\/td><td><\/td><\/tr><tr><td class=\"first\">Nordic silver<\/td><td>+1<\/td><td>Uncommon<\/td><td>1,000 gp<\/td><td>Yes<\/td><td>Made on Solstheim<\/td><\/tr><tr><td class=\"first\">Adamantium<\/td><td>+1<\/td><td>Uncommon<\/td><td>1,200 gp<\/td><td>Yes<\/td><td>Hits against objects are Critical Hits; doesn't wear on a 1<\/td><\/tr><tr><td class=\"first\">Glass<\/td><td>+2<\/td><td>Rare<\/td><td>5,000 gp<\/td><td>Yes<\/td><td>Half weight<\/td><\/tr><tr><td class=\"first\">Ebony<\/td><td>+2<\/td><td>Rare<\/td><td>6,000 gp<\/td><td>Yes<\/td><td>Twice the weight<\/td><\/tr><tr><td class=\"first\">Stalhrim<\/td><td>+2<\/td><td>Rare<\/td><td>7,500 gp<\/td><td>Yes<\/td><td>Can deal Cold damage instead<\/td><\/tr><tr><td class=\"first\">Daedric<\/td><td>+3<\/td><td>Very Rare<\/td><td>40,000 gp<\/td><td>Yes<\/td><td>Three times the weight<\/td><\/tr><\/tbody><\/table><\/div>\n<p>The prices for Uncommon and rarer materials are the same whatever the\nweapon: a glass dagger costs as much as a glass claymore. They're not\nmagical, so <em>Detect Magic<\/em> doesn't find them, but they can still\nbe enchanted (see <a class=\"xref\" href=\"#guide-house-rules--soul-gems-and-enchanting\">Soul Gems\nand Enchanting<\/a> in the <em>Player's Guide<\/em>). A material's bonus\ndoesn't add to a magic weapon's bonus: if a weapon has both, use the\nhigher one.<\/p>\n<p><strong>Chitin and iron.<\/strong> Chitin weapons, cut and shaped from\ninsect shell, are light and cheap, and they're what most Ashlanders\ncarry. Iron is the cheapest metal. Both wear out quickly: under the Wear\nand Repair rule, they take a penalty on an attack roll of 1 or 2.<\/p>\n<p><strong>Silver.<\/strong> Silver weapons are steel with a silvered\nedge. They're no better in an ordinary fight, but they're the cheapest\nway to hurt a ghost.<\/p>\n<p><strong>Dwemer and Orcish.<\/strong> Dwemer weapons are made of the\nsame strange, bronze-coloured metal as Dwemer armour, and like it\nthey're salvaged from the ruins rather than forged. Orcish weapons,\nmostly heavy axes and hammers, are the work of Orc smiths, and they're\nprized across Tamriel.<\/p>\n<p><strong>Adamantium.<\/strong> Mined beneath Mournhold, adamantium is\nhard enough to cut stone, so any hit against an object is a Critical\nHit. It's also the only Uncommon material that doesn't wear down when\nyou roll a 1.<\/p>\n<p><strong>Glass and ebony.<\/strong> Glass weapons are light, keen and\ngreen as a beetle's shell, and they're half the weight of steel. Ebony\nweapons are black, near-unbreakable and twice as heavy.<\/p>\n<p><strong>Stalhrim.<\/strong> Carved from the enchanted ice of\nSolstheim's barrows, a stalhrim weapon is so cold it burns. Each time\nyou hit, you can choose for it to deal Cold damage instead of its normal\ndamage type.<\/p>\n<p><strong>Daedric.<\/strong> Daedric weapons are ebony forged with the\nbound spirit of a Daedra, and they're the finest weapons there are.\nThey're also three times the weight of steel.<\/p>\n<p><strong>Wear.<\/strong> If you use the Wear and Repair rule, Uncommon\nweapons wear like Common ones, taking a penalty when you roll a 1.\nAdamantium, Rare and Very Rare weapons don't: only creatures that damage\ngear, such as the hunger, can wear them down.<\/p>\n<h3 id=\"items-weapons--silver-and-better\">Silver and Better<\/h3>\n<p>Some creatures in the <em>Bestiary of Morrowind<\/em> can only be\nhurt, or only be hurt properly, by weapons that are magical or made of\nsilver:<\/p>\n<ul>\n<li>\n<p><strong>Spirit Form.<\/strong> Ancestor ghosts, dwarven spectres and\nbonelords take no damage from other weapons.<\/p>\n<\/li>\n<li>\n<p><strong>Daedric Hide.<\/strong> Scamps take half damage from other\nweapons.<\/p>\n<\/li>\n<li>\n<p><strong>Regeneration.<\/strong> Damage from silver stops a werewolf\nregenerating.<\/p>\n<\/li>\n<\/ul>\n<p>Weapons made of any material marked \"Yes\" in the Silver column count\nas silver for all of these. Magic weapons count too, whatever they're\nmade of, and so does a weapon under a spell such as <em>Magic\nWeapon<\/em>.<\/p>\n<h3 id=\"items-weapons--whats-made-from-what\">What's Made from What<\/h3>\n<p>Not every weapon comes in every material. This table lists the ones\nthat exist, but nothing stops a smith making an ebony katana if the DM\nallows it.<\/p>\n<div class=\"tw\"><table><thead><tr><th>Material<\/th><th>Found as<\/th><\/tr><\/thead><tbody><tr><td>Chitin<\/td><td>Daggers, shortswords, clubs, war axes, spears, tridents, whips, short bows, arrows and throwing stars<\/td><\/tr><tr><td>Iron<\/td><td>Most blades, axes, clubs, maces, warhammers, spears, glaives and tridents, plus whips, arrows, bolts and throwing knives<\/td><\/tr><tr><td>Steel<\/td><td>Almost every weapon in this chapter<\/td><\/tr><tr><td>Silver<\/td><td>Daggers, shortswords, longswords, rapiers, claymores, staffs, war axes, spears, glaives, tridents, whips, arrows, bolts, darts and throwing stars<\/td><\/tr><tr><td>Bonemold<\/td><td>Long bows, arrows and bolts<\/td><\/tr><tr><td>Dreugh<\/td><td>Clubs and staffs<\/td><\/tr><tr><td>Dwemer<\/td><td>Shortswords, claymores, maces, warhammers, war axes, battle axes, spears, tridents, glaives, halberds and crossbows<\/td><\/tr><tr><td>Orcish<\/td><td>Battle axes, warhammers and bolts<\/td><\/tr><tr><td>Nordic silver<\/td><td>Daggers, shortswords, longswords, claymores, maces, axes and battle axes<\/td><\/tr><tr><td>Adamantium<\/td><td>Shortswords, claymores, maces, axes, spears, tridents and glaives<\/td><\/tr><tr><td>Glass<\/td><td>Daggers, longswords, rapiers, claymores, staffs, war axes, glaives, halberds, arrows, throwing knives and throwing stars<\/td><\/tr><tr><td>Ebony<\/td><td>Shortswords, broadswords, longswords, rapiers, maces, staffs, war axes, spears, tridents, glaives, arrows, darts and throwing stars<\/td><\/tr><tr><td>Stalhrim<\/td><td>Daggers, longswords, maces and war axes<\/td><\/tr><tr><td>Daedric<\/td><td>Almost every weapon, including all four Akaviri blades, glaives, tridents, rapiers, long bows, arrows and darts<\/td><\/tr><\/tbody><\/table><\/div>\n<h3 id=\"items-weapons--ammunition-and-throwing-weapons\">Ammunition and Throwing\nWeapons<\/h3>\n<h4 id=\"items-weapons--arrows-and-bolts\">Arrows and Bolts<\/h4>\n<p>Bows fire arrows and crossbows fire bolts. Morrowind has no slings,\nand no firearms exist anywhere in Tamriel.<\/p>\n<div class=\"tw\"><table><thead><tr><th>Ammunition<\/th><th>Bonus<\/th><th>Rarity<\/th><th>Price (10)<\/th><th>Notes<\/th><\/tr><\/thead><tbody><tr><td class=\"first\">Corkbulb<\/td><td>—<\/td><td>Common<\/td><td>1 sp<\/td><td>Practice ammunition that deals only 1 Bludgeoning damage<\/td><\/tr><tr><td class=\"first\">Chitin or iron<\/td><td>—<\/td><td>Common<\/td><td>3 sp<\/td><td><\/td><\/tr><tr><td class=\"first\">Steel<\/td><td>—<\/td><td>Common<\/td><td>5 sp<\/td><td><\/td><\/tr><tr><td class=\"first\">Bonemold<\/td><td>—<\/td><td>Common<\/td><td>2 gp<\/td><td><\/td><\/tr><tr><td class=\"first\">Silver<\/td><td>—<\/td><td>Common<\/td><td>25 gp<\/td><td>Counts as silver<\/td><\/tr><tr><td class=\"first\">Orcish<\/td><td>+1<\/td><td>Uncommon<\/td><td>100 gp<\/td><td>Bolts only<\/td><\/tr><tr><td class=\"first\">Glass<\/td><td>+2<\/td><td>Rare<\/td><td>500 gp<\/td><td>Arrows only; counts as silver<\/td><\/tr><tr><td class=\"first\">Ebony<\/td><td>+2<\/td><td>Rare<\/td><td>600 gp<\/td><td>Arrows only; counts as silver<\/td><\/tr><tr><td class=\"first\">Daedric<\/td><td>+3<\/td><td>Very Rare<\/td><td>2,500 gp<\/td><td>Arrows only; counts as silver<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Ten arrows weigh half a pound, and ten bolts three-quarters of a\npound.<\/p>\n<ul>\n<li>\n<p><strong>Bow and ammunition.<\/strong> When you fire ammunition from a\nbow or crossbow that also has a bonus, use the higher bonus. They don't\nadd together, so a steel arrow fired from a Daedric long bow gets +3,\nand so does a Daedric arrow.<\/p>\n<\/li>\n<li>\n<p><strong>What counts.<\/strong> For Silver and Better, it's what hits\nthe target that matters: the arrow or bolt, not the bow.<\/p>\n<\/li>\n<li>\n<p><strong>Breaking.<\/strong> Ammunition made of Uncommon or rarer\nmaterials is destroyed when it hits. After a fight, you can recover half\nof the pieces that missed, as normal.<\/p>\n<\/li>\n<\/ul>\n<h4 id=\"items-weapons--throwing-weapons\">Throwing Weapons<\/h4>\n<p>Darts, throwing knives and throwing stars are small, balanced weapons\nmade to be thrown in quick succession. The Morag Tong and the Dark\nBrotherhood favour them, and so do the island's thieves.<\/p>\n<div class=\"tw\"><table><thead><tr><th>Weapon<\/th><th>Category<\/th><th>Damage<\/th><th>Properties<\/th><th>Mastery<\/th><th>Weight<\/th><th>Price<\/th><\/tr><\/thead><tbody><tr><td class=\"first\">Dart<\/td><td>Simple<\/td><td>1d4 Piercing<\/td><td>Finesse, Thrown (20/60)<\/td><td>Vex<\/td><td>1/4 lb<\/td><td>5 cp<\/td><\/tr><tr><td class=\"first\">Throwing knife<\/td><td>Simple<\/td><td>1d4 Piercing<\/td><td>Finesse, Light, Thrown (30/90)<\/td><td>Nick<\/td><td>1/2 lb<\/td><td>5 sp<\/td><\/tr><tr><td class=\"first\">Throwing star<\/td><td>Martial<\/td><td>1d4 Slashing<\/td><td>Finesse, Light, Thrown (20/60)<\/td><td>Vex<\/td><td>1/4 lb<\/td><td>1 gp<\/td><\/tr><\/tbody><\/table><\/div>\n<ul>\n<li>\n<p><strong>Ranged weapons.<\/strong> All three are Ranged weapons. Used\nin melee, they count as improvised weapons.<\/p>\n<\/li>\n<li>\n<p><strong>Light and Nick.<\/strong> Throwing knives and stars have the\nLight property, so after you throw one with the Attack action, you can\nthrow another as a Bonus Action. With the throwing knife's Nick mastery,\nthe second throw is part of the Attack action instead.<\/p>\n<\/li>\n<li>\n<p><strong>Materials.<\/strong> Chitin and iron throwing weapons cost\nhalf price, and silver ones cost 5 gp each. A throwing weapon made of an\nUncommon or rarer material costs as much as ten arrows of that material,\nand it's destroyed when it hits.<\/p>\n<\/li>\n<\/ul>\n<h3 id=\"items-weapons--weapons-from-elsewhere\">Weapons from Elsewhere<\/h3>\n<p>The <em>Player's Handbook<\/em>'s flail, sling and blowgun aren't made\non Vvardenfell. A traveller from elsewhere in the Empire might carry\none, and a good smith could copy it.<\/p>\n"},{"id":"items-tools-and-equipment","t":"Tools and Equipment","s":[{"id":"items-tools-and-equipment--tools-of-the-trade","t":"Tools of the Trade","l":2},{"id":"items-tools-and-equipment--lockpicks-and-probes","t":"Lockpicks and Probes","l":2},{"id":"items-tools-and-equipment--locks","t":"Locks","l":3},{"id":"items-tools-and-equipment--traps","t":"Traps","l":3},{"id":"items-tools-and-equipment--armourers-hammers","t":"Armourer's Hammers","l":2},{"id":"items-tools-and-equipment--alchemy-apparatus","t":"Alchemy Apparatus","l":2},{"id":"items-tools-and-equipment--lights","t":"Lights","l":2},{"id":"items-tools-and-equipment--adventuring-gear","t":"Adventuring Gear","l":2},{"id":"items-tools-and-equipment--books","t":"Books","l":2},{"id":"items-tools-and-equipment--trade-goods","t":"Trade Goods","l":2},{"id":"items-tools-and-equipment--crafting-gear","t":"Crafting Gear","l":2}],"h":"\n\n<div class=\"epigraph\">\n<p><em>“A good pick gets you through the door. A good probe means you\nlive to walk through it.”<\/em><\/p>\n<\/div>\n<div class=\"attribution\">\n<p>— A fence in Balmora<\/p>\n<\/div>\n<h3 id=\"items-tools-and-equipment--tools-of-the-trade\">Tools of the Trade<\/h3>\n<p class=\"dropcap\">Vvardenfell runs on tools. The Thieves Guild's picks\nopen the strongrooms of Balmora, the island's smiths keep the Legion's\narmour in fighting shape, and every alchemist from Ald'ruhn to Vivec\nkeeps a mortar and pestle on the bench. In the games, these tools come\nin grades, from cheap apprentice's sets to the work of secret masters,\nand the better the tool, the better the result.<\/p>\n<ul>\n<li>\n<p><strong>Grades.<\/strong> Lockpicks, probes, armourer's hammers and\nalchemy apparatus come in five grades. Better grades give a bonus to\nability checks made with the tool: +1 for Journeyman's, +2 for Master's,\n+3 for Grandmaster's and +4 for Secret Master's.<\/p>\n<\/li>\n<li>\n<p><strong>Proficiency.<\/strong> These tools count as the <em>Player's\nHandbook<\/em> tools they replace: lockpicks and probes are Thieves'\nTools, and alchemy apparatus is Alchemist's Supplies. If you're\nproficient with the <em>Player's Handbook<\/em> tool, you're proficient\nwith its Morrowind version. Armourer's hammers are the exception:\nthey're a tool of their own, for repairs only, and using one takes\nproficiency with Smith's Tools.<\/p>\n<\/li>\n<li>\n<p><strong>Wearing out.<\/strong> In the games, tools break after a\nnumber of uses. Here, lockpicks and probes break when a check with them\nfails badly, and armourer's hammers wear out after a set number of\nrepairs.<\/p>\n<\/li>\n<li>\n<p><strong>Everything else.<\/strong> Every other tool in the\n<em>Player's Handbook<\/em> is sold on Vvardenfell at its usual\nprice.<\/p>\n<\/li>\n<\/ul>\n<h3 id=\"items-tools-and-equipment--lockpicks-and-probes\">Lockpicks and Probes<\/h3>\n<p>Thieves on Vvardenfell carry two kinds of tool: lockpicks for locks,\nand probes for the magical traps that guard so many doors and chests.\nTogether, they count as Thieves' Tools.<\/p>\n<div class=\"tw\"><table><thead><tr><th>Grade<\/th><th>Bonus<\/th><th>Rarity<\/th><th>Lockpick<\/th><th>Probe<\/th><th>Notes<\/th><\/tr><\/thead><tbody><tr><td class=\"first\">Bent<\/td><td>−2<\/td><td>Common<\/td><td>—<\/td><td>Not sold<\/td><td>Probes only; found in ruins and on dead thieves<\/td><\/tr><tr><td class=\"first\">Apprentice's<\/td><td>+0<\/td><td>Common<\/td><td>5 gp<\/td><td>5 gp<\/td><td><\/td><\/tr><tr><td class=\"first\">Journeyman's<\/td><td>+1<\/td><td>Common<\/td><td>25 gp<\/td><td>25 gp<\/td><td><\/td><\/tr><tr><td class=\"first\">Master's<\/td><td>+2<\/td><td>Common<\/td><td>100 gp<\/td><td>100 gp<\/td><td>Sold by the Thieves Guild and a few traders<\/td><\/tr><tr><td class=\"first\">Grandmaster's<\/td><td>+3<\/td><td>Uncommon<\/td><td>500 gp<\/td><td>500 gp<\/td><td>Rarely sold<\/td><\/tr><tr><td class=\"first\">Secret Master's<\/td><td>+4<\/td><td>Rare<\/td><td>Not sold<\/td><td>Not sold<\/td><td>Found only<\/td><\/tr><\/tbody><\/table><\/div>\n<ul>\n<li>\n<p><strong>Using them.<\/strong> Picking a lock or disarming a trap takes\nthe Utilize action and a Dexterity check, adding your Proficiency Bonus\nif you're proficient with Thieves' Tools and the tool's bonus.<\/p>\n<\/li>\n<li>\n<p><strong>Right tool for the job.<\/strong> You need a lockpick to pick\na lock and a probe to disarm a trap.<\/p>\n<\/li>\n<li>\n<p><strong>Breaking.<\/strong> If you fail a check by 5 or more, the\nlockpick or probe breaks. Serious thieves carry spares.<\/p>\n<\/li>\n<li>\n<p><strong>The Skeleton Key.<\/strong> The greatest lockpick of all is a\nDaedric artefact, described in Chapter Six.<\/p>\n<\/li>\n<\/ul>\n<h4 id=\"items-tools-and-equipment--locks\">Locks<\/h4>\n<p>Locks on Vvardenfell range from a latch on a farmer's chest to the\nvaults of the Great Houses. Some doors can't be picked at all and open\nonly with their key.<\/p>\n<div class=\"tw\"><table><thead><tr><th>Lock<\/th><th>DC<\/th><th>Found on<\/th><\/tr><\/thead><tbody><tr><td class=\"first\">Simple<\/td><td>10<\/td><td>Crates, barrels and the doors of the poor<\/td><\/tr><tr><td class=\"first\">Average<\/td><td>15<\/td><td>Most chests and house doors<\/td><\/tr><tr><td class=\"first\">Good<\/td><td>20<\/td><td>Merchants' strongrooms, guild halls and old tombs<\/td><\/tr><tr><td class=\"first\">Superior<\/td><td>25<\/td><td>Great House vaults and Dwemer ruins<\/td><\/tr><tr><td class=\"first\">Masterwork<\/td><td>30<\/td><td>The vaults of the Temple and the Telvanni<\/td><\/tr><\/tbody><\/table><\/div>\n<p>The <em>Knock<\/em> spell, which the Dunmer call Open, opens any lock.\nPicking a lock in sight of a guard is a crime.<\/p>\n<h4 id=\"items-tools-and-equipment--traps\">Traps<\/h4>\n<p>Most traps on Vvardenfell are spells bound to a door or a container.\nWhen someone opens it without first disarming the trap, the spell is\nreleased on them.<\/p>\n<div class=\"tw\"><table><thead><tr><th>Trap<\/th><th>Disarm DC<\/th><th>Save DC<\/th><th>Effect<\/th><\/tr><\/thead><tbody><tr><td class=\"first\">Minor<\/td><td>12<\/td><td>12<\/td><td>11 (2d10) Fire, Cold, Lightning or Poison damage<\/td><\/tr><tr><td class=\"first\">Dangerous<\/td><td>15<\/td><td>15<\/td><td>22 (4d10) damage of one of those types, or the Paralyzed condition for 1 minute<\/td><\/tr><tr><td class=\"first\">Deadly<\/td><td>20<\/td><td>18<\/td><td>55 (10d10) damage of one of those types<\/td><\/tr><\/tbody><\/table><\/div>\n<ul>\n<li>\n<p><strong>Finding traps.<\/strong> Spotting a trap takes a Wisdom\n(Perception) or Intelligence (Investigation) check against its Disarm\nDC. <em>Detect Magic<\/em> reveals one automatically.<\/p>\n<\/li>\n<li>\n<p><strong>Disarming.<\/strong> Disarming a trap takes a probe and a\nDexterity check against its Disarm DC. Failing by 5 or more sets it\noff.<\/p>\n<\/li>\n<li>\n<p><strong>Saving throws.<\/strong> A creature caught by a trap makes a\nDexterity save against damage, taking half on a success, or a\nConstitution save against paralysis, which it repeats at the end of each\nof its turns.<\/p>\n<\/li>\n<li>\n<p><strong>Dispelling.<\/strong> <em>Dispel Magic<\/em> ends a trap. Treat\na Minor trap as a level 1 spell, a Dangerous one as level 3 and a Deadly\none as level 5.<\/p>\n<\/li>\n<\/ul>\n<h3 id=\"items-tools-and-equipment--armourers-hammers\">Armourer's Hammers<\/h3>\n<p>An armourer's hammer isn't a set of Smith's Tools: it's a field tool\nfor repairs, and can't make anything. A character proficient with\nSmith's Tools can use one to repair their own gear under the <a class=\"xref\" href=\"#guide-house-rules--wear-and-repair\">Wear and Repair<\/a> rule in the\n<em>Player's Guide<\/em>.<\/p>\n<div class=\"tw\"><table><thead><tr><th>Hammer<\/th><th>Repairs per Long Rest<\/th><th>Uses<\/th><th>Repairs<\/th><th>Price<\/th><\/tr><\/thead><tbody><tr><td class=\"first\">Apprentice's<\/td><td>1<\/td><td>1<\/td><td>Common gear<\/td><td>5 gp<\/td><\/tr><tr><td class=\"first\">Journeyman's<\/td><td>1<\/td><td>3<\/td><td>Common gear<\/td><td>15 gp<\/td><\/tr><tr><td class=\"first\">Master's<\/td><td>2<\/td><td>3<\/td><td>Common and Uncommon gear<\/td><td>50 gp<\/td><\/tr><tr><td class=\"first\">Grandmaster's<\/td><td>2<\/td><td>5<\/td><td>Any gear<\/td><td>150 gp<\/td><\/tr><tr><td class=\"first\">Sirollus Saccus's<\/td><td>3<\/td><td>10<\/td><td>Any gear<\/td><td>500 gp<\/td><\/tr><\/tbody><\/table><\/div>\n<ul>\n<li>\n<p><strong>Repairs.<\/strong> During a Long Rest, you can remove up to\nthe number of penalty points shown from your gear, spread across as many\nitems as you like. Each point uses up one use, and when they run out,\nthe hammer is worn out.<\/p>\n<\/li>\n<li>\n<p><strong>Sirollus Saccus.<\/strong> The finest hammers on the island,\nsold only at his smithy in Ebonheart.<\/p>\n<\/li>\n<\/ul>\n<h3 id=\"items-tools-and-equipment--alchemy-apparatus\">Alchemy Apparatus<\/h3>\n<p>An alchemist's apparatus has four pieces, each in five grades, and\nyou can mix grades in one set. A set of Apprentice's apparatus is the\n<em>Player's Handbook<\/em>'s Alchemist's Supplies, weighing 8 pounds.\nMaster's and better weigh half as much.<\/p>\n<div class=\"tw\"><table><thead><tr><th>Grade<\/th><th>Bonus<\/th><th>Rarity<\/th><th>Mortar and pestle<\/th><th>Alembic<\/th><th>Calcinator<\/th><th>Retort<\/th><\/tr><\/thead><tbody><tr><td class=\"first\">Apprentice's<\/td><td>+0<\/td><td>Common<\/td><td>25 gp<\/td><td>10 gp<\/td><td>5 gp<\/td><td>10 gp<\/td><\/tr><tr><td class=\"first\">Journeyman's<\/td><td>+1<\/td><td>Common<\/td><td>100 gp<\/td><td>40 gp<\/td><td>20 gp<\/td><td>40 gp<\/td><\/tr><tr><td class=\"first\">Master's<\/td><td>+2<\/td><td>Common<\/td><td>500 gp<\/td><td>200 gp<\/td><td>100 gp<\/td><td>200 gp<\/td><\/tr><tr><td class=\"first\">Grandmaster's<\/td><td>+3<\/td><td>Uncommon<\/td><td>1,000 gp<\/td><td>1,000 gp<\/td><td>1,000 gp<\/td><td>500 gp<\/td><\/tr><tr><td class=\"first\">Secret Master's<\/td><td>+4<\/td><td>Rare<\/td><td>Not sold<\/td><td>Not sold<\/td><td>Not sold<\/td><td>Not sold<\/td><\/tr><\/tbody><\/table><\/div>\n<ul>\n<li>\n<p><strong>Mortar and pestle.<\/strong> The only piece you need to brew a\npotion. Its bonus applies to the check to brew.<\/p>\n<\/li>\n<li>\n<p><strong>Retort.<\/strong> Makes a potion one grade better.<\/p>\n<\/li>\n<li>\n<p><strong>Calcinator.<\/strong> Makes a poison one grade better.<\/p>\n<\/li>\n<li>\n<p><strong>Alembic.<\/strong> Saves a brew that would have spoiled.<\/p>\n<\/li>\n<li>\n<p><strong>Grade limits.<\/strong> A piece's grade limits how good a brew\nit can make: Bargain for Apprentice's, Standard for Journeyman's,\nQuality for Master's and Exclusive for Grandmaster's or Secret\nMaster's.<\/p>\n<\/li>\n<li>\n<p><strong>Proficiency.<\/strong> A character proficient with either\nAlchemist's Supplies or an Herbalism Kit is proficient with alchemy\napparatus.<\/p>\n<\/li>\n<\/ul>\n<p><a class=\"xref\" href=\"#guide-house-rules--brewing-potions\">Brewing Potions<\/a> in the\n<em>Player's Guide<\/em> explains how to brew potions and how much each\npiece helps.<\/p>\n<h3 id=\"items-tools-and-equipment--lights\">Lights<\/h3>\n<p>Dunmer towns glow with paper lanterns, and the island's tombs and\ncaves are as dark as anywhere in Tamriel.<\/p>\n<div class=\"tw\"><table><thead><tr><th>Light<\/th><th>Bright light<\/th><th>Dim light<\/th><th>Burns for<\/th><th>Weight<\/th><th>Price<\/th><\/tr><\/thead><tbody><tr><td class=\"first\">Candle<\/td><td>5 ft<\/td><td>5 ft more<\/td><td>1 hour<\/td><td>—<\/td><td>1 cp<\/td><\/tr><tr><td class=\"first\">Torch<\/td><td>20 ft<\/td><td>20 ft more<\/td><td>1 hour<\/td><td>1 lb<\/td><td>1 cp<\/td><\/tr><tr><td class=\"first\">Paper lantern<\/td><td>15 ft<\/td><td>30 ft more<\/td><td>6 hours per flask of oil<\/td><td>1 lb<\/td><td>5 sp<\/td><\/tr><tr><td class=\"first\">Travel lantern<\/td><td>30 ft<\/td><td>30 ft more<\/td><td>6 hours per flask of oil<\/td><td>2 lb<\/td><td>5 gp<\/td><\/tr><tr><td class=\"first\">Bug lamp<\/td><td>10 ft<\/td><td>10 ft more<\/td><td>Never burns out<\/td><td>1 lb<\/td><td>25 gp<\/td><\/tr><\/tbody><\/table><\/div>\n<ul>\n<li>\n<p><strong>Paper lanterns.<\/strong> The everyday Dunmer lamp. It uses\nthe lamp's statistics from the <em>Player's Handbook<\/em>.<\/p>\n<\/li>\n<li>\n<p><strong>Travel lanterns.<\/strong> Imperial iron lanterns with a hood.\nThey use the hooded lantern's statistics, so you can lower the hood to\ncut the light to Dim Light in a 5-foot radius.<\/p>\n<\/li>\n<li>\n<p><strong>Bug lamps.<\/strong> Telvanni lamps of glass and chitin, lit\nby glowing insects that live for years. They're sold mostly in Sadrith\nMora.<\/p>\n<\/li>\n<li>\n<p><strong>Oil.<\/strong> A flask of lamp oil costs 1 sp.<\/p>\n<\/li>\n<\/ul>\n<h3 id=\"items-tools-and-equipment--adventuring-gear\">Adventuring Gear<\/h3>\n<p>Everything in the <em>Player's Handbook<\/em>'s adventuring gear is\nsold on Vvardenfell at its usual price. These are the island's own\nitems.<\/p>\n<div class=\"tw\"><table><thead><tr><th>Item<\/th><th>Weight<\/th><th>Price<\/th><th>Notes<\/th><\/tr><\/thead><tbody><tr><td class=\"first\">Bedroll<\/td><td>7 lb<\/td><td>1 gp<\/td><td>Netch leather over a straw mat<\/td><\/tr><tr><td class=\"first\">Map of Vvardenfell<\/td><td>—<\/td><td>5 gp<\/td><td>Counts as a Map for the whole island<\/td><\/tr><tr><td class=\"first\">Town guide<\/td><td>—<\/td><td>5 sp<\/td><td>A pamphlet such as Guide to Balmora; counts as a Map of that town<\/td><\/tr><tr><td class=\"first\">Pilgrim's pack<\/td><td>15 lb<\/td><td>5 gp<\/td><td>A bedroll, a waterskin, 5 days of rations and a copy of The Pilgrim's Path<\/td><\/tr><tr><td class=\"first\">Rations (1 day)<\/td><td>2 lb<\/td><td>5 sp<\/td><td>Saltrice, dried scuttle and ash yam<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Pilgrims.<\/strong> Temple pilgrims walk between the island's\nshrines, and the pilgrim's pack is what most of them carry. <em>The\nPilgrim's Path<\/em> lists the shrines and the prayers to say at each\none.<\/p>\n<h3 id=\"items-tools-and-equipment--books\">Books<\/h3>\n<p>Books are cheap on Vvardenfell, and the island is full of them:\nhistories, sermons, adventure stories and some very bad poetry. A common\nbook costs 5 gp, and a rare one can fetch 50 gp or more from a\ncollector. Jobasha's Rare Books in Vivec's Foreign Quarter has the best\nstock on the island.<\/p>\n<p><strong>Skill books.<\/strong> Some books teach as much as any\ntrainer. In the games, they're the books that raise a skill when you\nread them, such as <em>The Black Arrow<\/em>, <em>A Game at Dinner<\/em>,\n<em>The Buying Game<\/em> and <em>Chance's Folly<\/em>.<\/p>\n<ul>\n<li>\n<p><strong>Reading.<\/strong> The first time a character reads a skill\nbook, which takes about an hour, they gain Heroic Inspiration.<\/p>\n<\/li>\n<li>\n<p><strong>Limits.<\/strong> Each book works only once for each reader,\nand a character can benefit from only one skill book per Long Rest.<\/p>\n<\/li>\n<li>\n<p><strong>Price.<\/strong> A skill book costs 50 gp. A bookseller has\n1d4 of them in stock at a time.<\/p>\n<\/li>\n<\/ul>\n<h3 id=\"items-tools-and-equipment--trade-goods\">Trade Goods<\/h3>\n<p>Vvardenfell's wealth comes out of the ground, and the Empire means to\nkeep it. By Imperial charter, the East Empire Company has the sole right\nto trade raw ebony and raw glass, along with flin and Dwemer\nartefacts.<\/p>\n<div class=\"tw\"><table><thead><tr><th>Goods<\/th><th>Weight<\/th><th>Price<\/th><th>Notes<\/th><\/tr><\/thead><tbody><tr><td class=\"first\">Raw ebony<\/td><td>5 lb<\/td><td>50 gp<\/td><td>Company goods; mined around Caldera<\/td><\/tr><tr><td class=\"first\">Raw glass<\/td><td>2 lb<\/td><td>50 gp<\/td><td>Company goods; dug from caves in the Ashlands and the Molag Amur<\/td><\/tr><tr><td class=\"first\">Raw adamantium<\/td><td>5 lb<\/td><td>25 gp<\/td><td>Mined beneath Mournhold<\/td><\/tr><tr><td class=\"first\">Dwemer scrap metal<\/td><td>10 lb<\/td><td>25 gp<\/td><td>Trade is restricted<\/td><\/tr><tr><td class=\"first\">Dwemer coin<\/td><td>—<\/td><td>5 gp<\/td><td>Collectors pay well; trade is restricted<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Supplying a smith.<\/strong> A smith making glass, ebony or\nadamantium gear needs the raw material. Bring raw material worth half\nthe item's price and the smith charges only the other half, with no\nwait. Otherwise, the smith charges the full price and the work waits for\na shipment, which takes 1d4 weeks. A smith making Daedric gear also\nneeds a Daedra heart.<\/p>\n<p><strong>Company goods.<\/strong> Raw ebony and raw glass can't legally\nbe sold to just anyone. A character who finds or mines some has three\nchoices:<\/p>\n<ul>\n<li>\n<p><strong>Sell to the Company.<\/strong> The East Empire Company's\nfactors in Ebonheart buy raw ebony and glass at the usual half price, no\nquestions asked.<\/p>\n<\/li>\n<li>\n<p><strong>Get a licence.<\/strong> The Company grants trading licences\nto people it trusts, and House Hlaalu, which runs the licensed mine at\nCaldera, can vouch for its friends. A licence is earned with a favour,\nnot bought, and lets its holder sell to any trader.<\/p>\n<\/li>\n<li>\n<p><strong>Sell on the quiet.<\/strong> Smugglers, fences and the Camonna\nTong buy without a licence, but selling to anyone else without one\ncounts as trading restricted goods.<\/p>\n<\/li>\n<\/ul>\n<p>Handing your own ore to a smith to work isn't a sale, so the Company\ndoesn't object.<\/p>\n<h3 id=\"items-tools-and-equipment--crafting-gear\">Crafting Gear<\/h3>\n<p>Characters with Smith's, Leatherworker's or Woodcarver's Tools can\nmake the weapons, armour and shields in this book. The rules are in the\n<em>Player's Guide<\/em>: see <a class=\"xref\" href=\"#guide-house-rules--crafting-weapons-and-armour\">Crafting Weapons and\nArmour<\/a>.<\/p>\n"},{"id":"items-services-and-travel","t":"Services and Travel","s":[{"id":"items-services-and-travel--getting-around","t":"Getting Around","l":2},{"id":"items-services-and-travel--silt-striders-and-boats","t":"Silt Striders and Boats","l":2},{"id":"items-services-and-travel--other-ways-to-travel","t":"Other Ways to Travel","l":2},{"id":"items-services-and-travel--inns-and-taverns","t":"Inns and Taverns","l":2},{"id":"items-services-and-travel--food-and-drink","t":"Food and Drink","l":2},{"id":"items-services-and-travel--healing-and-spellcasting","t":"Healing and Spellcasting","l":2},{"id":"items-services-and-travel--buying-spells","t":"Buying Spells","l":3},{"id":"items-services-and-travel--training","t":"Training","l":2},{"id":"items-services-and-travel--crime-and-fines","t":"Crime and Fines","l":2}],"h":"\n\n<div class=\"epigraph\">\n<p><em>“The strider is slow, the boat is wet and the guild guide is\ndear. Walk, if you've a death wish.”<\/em><\/p>\n<\/div>\n<div class=\"attribution\">\n<p>— A caravaner in Seyda Neen<\/p>\n<\/div>\n<h3 id=\"items-services-and-travel--getting-around\">Getting Around<\/h3>\n<p class=\"dropcap\">Vvardenfell has no roads worth the name outside the\nAscadian Isles, and no horses. Travellers ride silt striders, giant\ninsects that carry passengers in a shell on their backs, or take boats\naround the coast. The Mages Guild teleports those who can afford it.<\/p>\n<ul>\n<li>\n<p><strong>Fares.<\/strong> Silt striders and boats charge 1 gp per hour\nof the journey for each passenger, including followers and pack animals.\nThe Ebonheart ferry charges double to Molag Mar, for the danger of the\nMolag Amur coast.<\/p>\n<\/li>\n<li>\n<p><strong>Time.<\/strong> The routes give each journey's time in hours.\nOn foot, allow three times as long.<\/p>\n<\/li>\n<\/ul>\n<h3 id=\"items-services-and-travel--silt-striders-and-boats\">Silt Striders and Boats<\/h3>\n<p>Silt striders serve the west and south of the island. Boats link the\ncoastal towns, the Telvanni east and the northern ports, where striders\ndon't go. Journey times are in hours.<\/p>\n<div class=\"tw\"><table><thead><tr><th>Port<\/th><th>By silt strider<\/th><th>By boat<\/th><\/tr><\/thead><tbody><tr><td class=\"first\">Ald'ruhn<\/td><td>Maar Gan (2), Balmora (4), Gnisis (4), Khuul (5)<\/td><td>—<\/td><\/tr><tr><td class=\"first\">Balmora<\/td><td>Seyda Neen (3), Ald'ruhn (4), Suran (4), Vivec (4)<\/td><td>—<\/td><\/tr><tr><td class=\"first\">Dagon Fel<\/td><td>—<\/td><td>Tel Mora (5), Khuul (8), Tel Aruhn (9), Sadrith Mora (10)<\/td><\/tr><tr><td class=\"first\">Ebonheart<\/td><td>—<\/td><td>Vivec (1), Hla Oad (5), Molag Mar (5), Gnaar Mok (9)<\/td><\/tr><tr><td class=\"first\">Gnaar Mok<\/td><td>—<\/td><td>Hla Oad (4), Khuul (7), Ebonheart (9)<\/td><\/tr><tr><td class=\"first\">Gnisis<\/td><td>Khuul (3), Ald'ruhn (4), Maar Gan (4), Seyda Neen (11)<\/td><td>—<\/td><\/tr><tr><td class=\"first\">Hla Oad<\/td><td>—<\/td><td>Gnaar Mok (4), Ebonheart (5), Vivec (5), Molag Mar (10)<\/td><\/tr><tr><td class=\"first\">Khuul<\/td><td>Gnisis (3), Maar Gan (3), Ald'ruhn (5)<\/td><td>Fort Frostmoth (6), Gnaar Mok (7), Dagon Fel (8)<\/td><\/tr><tr><td class=\"first\">Maar Gan<\/td><td>Ald'ruhn (2), Khuul (3), Gnisis (4)<\/td><td>—<\/td><\/tr><tr><td class=\"first\">Molag Mar<\/td><td>Suran (3), Vivec (4)<\/td><td>Tel Branora (2), Vivec (4), Ebonheart (5), Hla Oad (10)<\/td><\/tr><tr><td class=\"first\">Sadrith Mora<\/td><td>—<\/td><td>Tel Mora (5), Vos (5), Tel Branora (8), Dagon Fel (10)<\/td><\/tr><tr><td class=\"first\">Seyda Neen<\/td><td>Vivec (2), Balmora (3), Suran (4), Gnisis (11)<\/td><td>—<\/td><\/tr><tr><td class=\"first\">Suran<\/td><td>Vivec (1), Molag Mar (3), Balmora (4), Seyda Neen (4)<\/td><td>—<\/td><\/tr><tr><td class=\"first\">Tel Aruhn<\/td><td>—<\/td><td>Tel Mora (4), Vos (4), Dagon Fel (9)<\/td><\/tr><tr><td class=\"first\">Tel Branora<\/td><td>—<\/td><td>Molag Mar (2), Vivec (5), Sadrith Mora (8)<\/td><\/tr><tr><td class=\"first\">Tel Mora<\/td><td>—<\/td><td>Vos (1), Tel Aruhn (4), Dagon Fel (5), Sadrith Mora (5)<\/td><\/tr><tr><td class=\"first\">Vivec<\/td><td>Suran (1), Seyda Neen (2), Balmora (4), Molag Mar (4)<\/td><td>Ebonheart (1), Molag Mar (4), Hla Oad (5), Tel Branora (5)<\/td><\/tr><tr><td class=\"first\">Vos<\/td><td>—<\/td><td>Tel Mora (1), Tel Aruhn (4), Sadrith Mora (5)<\/td><\/tr><\/tbody><\/table><\/div>\n\n\n<p><strong>Solstheim.<\/strong> A Khajiit captain in Khuul sails to Fort\nFrostmoth, the Imperial Legion's outpost on Solstheim, the cold island\nto the north.<\/p>\n<h3 id=\"items-services-and-travel--other-ways-to-travel\">Other Ways to Travel<\/h3>\n<ul>\n<li>\n<p><strong>Guild guides.<\/strong> Each of the Mages Guild's six halls\nhas a guide who teleports travellers to any of the other five,\ninstantly, for 20 gp a person, or 10 gp for Guild members. The guides\nare Erranil in Ald'ruhn, Masalinie Merian in Balmora, Emelia Duronia in\nCaldera, Ilvari Sendas in Ebonheart, Iniel at Wolverine Hall in Sadrith\nMora and Flacassia Fauseius in Vivec's Foreign Quarter. A guide can\nrefuse a customer they dislike, and senior Telvanni often are\nrefused.<\/p>\n<\/li>\n<li>\n<p><strong>Gondolas.<\/strong> Gondoliers pole passengers along the\ncanals between Vivec's cantons for 2 cp a trip.<\/p>\n<\/li>\n<li>\n<p><strong>Propylon chambers.<\/strong> Ten ruined Dunmer strongholds\nhold propylon chambers, ancient teleporters that link each stronghold to\nits two neighbours in a ring around the island: Andasreth, Berandas,\nFalasmaryon, Falensarano, Hlormaren, Indoranyon, Marandus, Rotheran,\nTelasero and Valenvaryon. Each chamber needs the index of the stronghold\nyou're travelling to, and the indices are scattered across the island.\nFolms Mirel of the Mages Guild in Caldera studies them.<\/p>\n<\/li>\n<li>\n<p><strong>Intervention.<\/strong> Scrolls of Almsivi Intervention carry\ntheir reader to the nearest Temple, and scrolls of Divine Intervention\nto the nearest Imperial Cult shrine (see Chapter Five). The Temples\nstand in Ald'ruhn, Balmora, Gnisis, Molag Mar and Vivec. The Imperial\nCult has shrines in the Legion forts: Buckmoth near Ald'ruhn, Moonmoth\nnear Balmora, Hawkmoth in Ebonheart, Fort Darius in Gnisis, Fort\nPelagiad, Wolverine Hall in Sadrith Mora and Fort Frostmoth on\nSolstheim.<\/p>\n<\/li>\n<li>\n<p><strong>Telvanni towers.<\/strong> Telvanni towers have no stairs,\nbecause their wizards levitate. Visitors need a Levitate spell, scroll\nor potion, or someone willing to lift them.<\/p>\n<\/li>\n<li>\n<p><strong>Mournhold.<\/strong> Morrowind's capital lies on the mainland,\nand there's no regular passage from Vvardenfell. The royal court keeps a\nmage in Ebonheart who teleports the Queen's guests to the Royal Palace,\nand brings them back.<\/p>\n<\/li>\n<li>\n<p><strong>On foot.<\/strong> There are no horses on Vvardenfell.\nTravellers who walk load their gear on a pack guar, which costs 25 gp\nand 5 cp a day in feed, and uses the guar's statistics in the\n<em>Bestiary of Morrowind<\/em>.<\/p>\n<\/li>\n<\/ul>\n<h3 id=\"items-services-and-travel--inns-and-taverns\">Inns and Taverns<\/h3>\n<p>Every town has somewhere to drink, and most have somewhere to sleep.\nThe Dunmer call a tavern a cornerclub. A night's lodging costs 7 cp if\nit's squalid, 1 sp if it's poor, 5 sp if it's modest, 8 sp if it's\ncomfortable, 2 gp if it's wealthy and 4 gp if it's aristocratic.<\/p>\n<div class=\"tw\"><table><thead><tr><th>Inn<\/th><th>Town<\/th><th>Lodging<\/th><th>Notes<\/th><\/tr><\/thead><tbody><tr><td class=\"first\">Arrille's Tradehouse<\/td><td>Seyda Neen<\/td><td>Modest<\/td><td>Where new arrivals stop first<\/td><\/tr><tr><td class=\"first\">Eight Plates<\/td><td>Balmora<\/td><td>Wealthy<\/td><td>Hlaalu merchants dine here<\/td><\/tr><tr><td class=\"first\">South Wall Cornerclub<\/td><td>Balmora<\/td><td>Poor<\/td><td>A Thieves Guild haunt<\/td><\/tr><tr><td class=\"first\">Council Club<\/td><td>Balmora<\/td><td>Modest<\/td><td>The Camonna Tong's; outlanders unwelcome<\/td><\/tr><tr><td class=\"first\">Halfway Tavern<\/td><td>Pelagiad<\/td><td>Comfortable<\/td><td>On the road from Vivec to Balmora<\/td><\/tr><tr><td class=\"first\">Shenk's Shovel<\/td><td>Caldera<\/td><td>Poor<\/td><td>Where the ebony miners drink<\/td><\/tr><tr><td class=\"first\">Black Shalk Cornerclub<\/td><td>Vivec<\/td><td>Modest<\/td><td>In the Foreign Quarter<\/td><\/tr><tr><td class=\"first\">Gateway Inn<\/td><td>Sadrith Mora<\/td><td>Modest<\/td><td>Few Telvanni will house outlanders<\/td><\/tr><tr><td class=\"first\">Six Fishes<\/td><td>Ebonheart<\/td><td>Comfortable<\/td><td>Legion officers and Company clerks<\/td><\/tr><\/tbody><\/table><\/div>\n<h3 id=\"items-services-and-travel--food-and-drink\">Food and Drink<\/h3>\n<div class=\"tw\"><table><thead><tr><th>Item<\/th><th>Price<\/th><th>Notes<\/th><\/tr><\/thead><tbody><tr><td class=\"first\">Poor meal<\/td><td>2 cp<\/td><td>Saltrice porridge and scuttle<\/td><\/tr><tr><td class=\"first\">Modest meal<\/td><td>1 sp<\/td><td>A kwama egg omelette, baked ash yam and scrib jelly<\/td><\/tr><tr><td class=\"first\">Fine meal<\/td><td>5 sp<\/td><td>Grilled kagouti, crab meat stew and marshmerrow sweets<\/td><\/tr><tr><td class=\"first\">Trama root tea<\/td><td>1 cp<\/td><td>A bitter, calming tea<\/td><\/tr><tr><td class=\"first\">Mazte (mug)<\/td><td>4 cp<\/td><td>Cheap saltrice beer, the common drink of the island<\/td><\/tr><tr><td class=\"first\">Shein (bottle)<\/td><td>2 sp<\/td><td>Bitter, sour comberry wine<\/td><\/tr><tr><td class=\"first\">Greef (bottle)<\/td><td>5 sp<\/td><td>Comberry brandy<\/td><\/tr><tr><td class=\"first\">Sujamma (bottle)<\/td><td>1 gp<\/td><td>A potent, bitter liquor<\/td><\/tr><tr><td class=\"first\">Flin (bottle)<\/td><td>10 gp<\/td><td>Whiskey from Cyrodiil, imported by the East Empire Company<\/td><\/tr><tr><td class=\"first\">Cyrodiilic brandy (bottle)<\/td><td>25 gp<\/td><td>The finest imported spirit<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Sujamma.<\/strong> For an hour after a cup of sujamma, you\nhave Advantage on Strength checks and Disadvantage on Intelligence\nchecks. A second cup within the hour gives you the Poisoned condition\nuntil the hour is up.<\/p>\n<h3 id=\"items-services-and-travel--healing-and-spellcasting\">Healing and Spellcasting<\/h3>\n<p>The Temple heals the sick in every town where it has a shrine, and\nthe Imperial Cult does the same in the Legion forts. Both ask for a\ndonation, and members of either faith pay half.<\/p>\n<div class=\"tw\"><table><thead><tr><th>Service<\/th><th>Price<\/th><th>Where<\/th><\/tr><\/thead><tbody><tr><td class=\"first\">Healing (Cure Wounds)<\/td><td>10 gp<\/td><td>Temples and Imperial Cult shrines<\/td><\/tr><tr><td class=\"first\">Cure common disease<\/td><td>25 gp<\/td><td>Temples and Imperial Cult shrines<\/td><\/tr><tr><td class=\"first\">Cure poison<\/td><td>25 gp<\/td><td>Temples and Imperial Cult shrines<\/td><\/tr><tr><td class=\"first\">Cure Blight disease<\/td><td>50 gp<\/td><td>Temple shrines only<\/td><\/tr><tr><td class=\"first\">Remove Curse<\/td><td>150 gp<\/td><td>Temples and Imperial Cult shrines<\/td><\/tr><tr><td class=\"first\">Greater Restoration<\/td><td>1,000 gp<\/td><td>The High Fane in Vivec only<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Other spells.<\/strong> For any other spell, find someone who\ncan cast it, usually at the Mages Guild or the Temple. Spells of level 6\nor higher aren't for sale, though a Telvanni wizard might cast one for a\nfavour. Add the cost of any costly material component to these\nprices.<\/p>\n<div class=\"tw\"><table><thead><tr><th>Spell level<\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4<\/th><th>5<\/th><\/tr><\/thead><tbody><tr><td class=\"first\">Price<\/td><td>50 gp<\/td><td>150 gp<\/td><td>300 gp<\/td><td>1,000 gp<\/td><td>2,000 gp<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Raising the dead.<\/strong> In the games, nobody on\nVvardenfell can bring back the dead. The Temple teaches that the\nfaithful dead join their ancestors, and necromancy is a crime. Whether\nanyone can raise the dead in your campaign is the DM's decision. If\nsomeone can, they're the high priests of the Imperial Cult, they charge\n5,000 gp or more and they don't do it for strangers.<\/p>\n<h4 id=\"items-services-and-travel--buying-spells\">Buying Spells<\/h4>\n<p>In the games, spell merchants sell spells to anyone who can pay. In\nthe 2024 rules, spellcasters learn spells as they gain levels, so spell\nmerchants work a little differently.<\/p>\n<ul>\n<li>\n<p><strong>Wizards.<\/strong> Mages Guild halls keep spell libraries. A\nwizard can copy any spell of level 3 or lower from one, paying a fee of\n50 gp per spell level on top of the normal cost of copying it, or half\nthat for Guild members. Higher-level spells are kept for senior members,\nor bought from the Telvanni at whatever price they name.<\/p>\n<\/li>\n<li>\n<p><strong>Bards, rangers, sorcerers and warlocks.<\/strong> A spell\nmerchant can coach these casters to replace one spell they know with\nanother of the same level from their class's spell list. It takes a day\nand costs 50 gp per spell level.<\/p>\n<\/li>\n<li>\n<p><strong>Other casters.<\/strong> Clerics, druids and paladins already\nchoose from their full spell lists each day, and don't need a spell\nmerchant.<\/p>\n<\/li>\n<\/ul>\n<h3 id=\"items-services-and-travel--training\">Training<\/h3>\n<p>Trainers teach anything for a price. Training takes 8 hours a day,\nand you can't adventure on those days, though they needn't be in a\nrow.<\/p>\n<div class=\"tw\"><table><thead><tr><th>Training<\/th><th>Time<\/th><th>Cost<\/th><th>Teachers<\/th><\/tr><\/thead><tbody><tr><td class=\"first\">A tool proficiency<\/td><td>20 days<\/td><td>200 gp<\/td><td>The guild that uses the tool, or a master craftsman<\/td><\/tr><tr><td class=\"first\">A language<\/td><td>30 days<\/td><td>300 gp<\/td><td>Scholars of the Mages Guild and the Temple<\/td><\/tr><tr><td class=\"first\">Akaviri blades<\/td><td>10 days<\/td><td>250 gp<\/td><td>The Blades only (see Chapter Two)<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Guild members pay half for training with their own guild.<\/p>\n<h3 id=\"items-services-and-travel--crime-and-fines\">Crime and Fines<\/h3>\n<p>Guards enforce Imperial law and the law of each town's Great House.\nIn Telvanni towns, the law is mostly whatever a Telvanni wizard says it\nis. A crime nobody sees isn't a crime, but a witness puts a bounty on\nthe criminal's head.<\/p>\n<div class=\"tw\"><table><thead><tr><th>Crime<\/th><th>Bounty<\/th><\/tr><\/thead><tbody><tr><td>Trespassing<\/td><td>5 gp<\/td><\/tr><tr><td>Pickpocketing<\/td><td>25 gp<\/td><\/tr><tr><td>Theft<\/td><td>The value of the goods<\/td><\/tr><tr><td>Assault<\/td><td>40 gp<\/td><\/tr><tr><td>Carrying restricted goods<\/td><td>The value of the goods<\/td><\/tr><tr><td>Murder<\/td><td>1,000 gp<\/td><\/tr><\/tbody><\/table><\/div>\n<ul>\n<li>\n<p><strong>Arrest.<\/strong> A guard who spots a wanted criminal demands\nthe bounty or a trip to jail, and confiscates stolen and restricted\ngoods either way. Once a bounty reaches 5,000 gp, guards attack on sight\ninstead.<\/p>\n<\/li>\n<li>\n<p><strong>Jail.<\/strong> One night for each 100 gp of bounty, with a\nminimum of one. Serving it clears the bounty.<\/p>\n<\/li>\n<li>\n<p><strong>The Thieves Guild.<\/strong> Members can clear a bounty\nthrough the Guild for half its value.<\/p>\n<\/li>\n<\/ul>\n"},{"id":"items-magic-items","t":"Magic Items","s":[{"id":"items-magic-items--enchanted-goods","t":"Enchanted Goods","l":2},{"id":"items-magic-items--constant-effect-items","t":"Constant Effect Items","l":2},{"id":"items-magic-items--fortify-enchantments","t":"Fortify Enchantments","l":3},{"id":"items-magic-items--cast-when-used-items","t":"Cast When Used Items","l":2},{"id":"items-magic-items--enchanted-weapons","t":"Enchanted Weapons","l":2},{"id":"items-magic-items--scrolls","t":"Scrolls","l":2},{"id":"items-magic-items--healing-and-protection","t":"Healing and Protection","l":3},{"id":"items-magic-items--movement-senses-and-stealth","t":"Movement, Senses and Stealth","l":3},{"id":"items-magic-items--attack-and-control","t":"Attack and Control","l":3},{"id":"items-magic-items--summoning-and-travel","t":"Summoning and Travel","l":3},{"id":"items-magic-items--magic-items-from-elsewhere","t":"Magic Items from Elsewhere","l":2}],"h":"\n\n<div class=\"epigraph\">\n<p><em>“Every ring on Vvardenfell does something. The trick is finding\nout what before you put it on.”<\/em><\/p>\n<\/div>\n<div class=\"attribution\">\n<p>— An enchanter in Sadrith Mora<\/p>\n<\/div>\n<h3 id=\"items-magic-items--enchanted-goods\">Enchanted Goods<\/h3>\n<p class=\"dropcap\">Almost every magic item on Vvardenfell is made by a\nmortal enchanter, who binds a spell into an object using the power of a\ntrapped soul. Enchanters name their work after the spell they bind, so a\nring of the Hand of Heaven carries the levitation spell Uth's Hand of\nHeaven. In the games, enchantments come in four kinds, and this chapter\nuses the same four.<\/p>\n<ul>\n<li>\n<p><strong>Constant effect.<\/strong> The enchantment works whenever you\nwear or carry the item. Powerful ones need Attunement.<\/p>\n<\/li>\n<li>\n<p><strong>Cast when used.<\/strong> The item holds charges, and you\nspend them to cast its spell. It never regains them on its own: only a\nfilled soul gem can recharge it (see <a class=\"xref\" href=\"#guide-house-rules--soul-gems\">Soul\nGems<\/a> in the <em>Player's Guide<\/em>).<\/p>\n<\/li>\n<li>\n<p><strong>Cast when strikes.<\/strong> A weapon that can release its\nspell into whatever it hits, spending charges when you choose to. Like\ncast when used items, it only recharges from a soul gem.<\/p>\n<\/li>\n<li>\n<p><strong>Cast once.<\/strong> Scrolls, which anyone who can read can\nuse, once.<\/p>\n<\/li>\n<\/ul>\n<p>Most of these items cost 50 to 100 gp if they're Common, 500 to 1,000\ngp if they're Uncommon and 5,000 to 6,000 gp if they're Rare. Very Rare\nitems are almost never for sale. The Mages Guild, the Telvanni and a few\nindependent enchanters sell magic items, and they buy them at half\nprice, as long as they have the gold (see Merchants' Purses).<\/p>\n<p><strong>Named items.<\/strong> Famous one-of-a-kind items, such as the\nRing of Phynaster and the Boots of Blinding Speed, are in Chapter\nSix.<\/p>\n<h3 id=\"items-magic-items--constant-effect-items\">Constant Effect Items<\/h3>\n<p>These enchantments are found on rings, amulets, belts, boots and\nrobes, and some of them on armour and shields too.<\/p>\n<div class=\"tw\"><table><thead><tr><th>Item<\/th><th>Effect<\/th><th>Rarity<\/th><th>Attune<\/th><th>Price<\/th><\/tr><\/thead><tbody><tr><td class=\"first\">Brightball amulet<\/td><td>Sheds Bright Light in a 20-foot radius and Dim Light for 20 feet more; speak a word to turn it on or off<\/td><td>Common<\/td><td>—<\/td><td>50 gp<\/td><\/tr><tr><td class=\"first\">Feather belt<\/td><td>Doubles your carrying capacity<\/td><td>Common<\/td><td>—<\/td><td>100 gp<\/td><\/tr><tr><td class=\"first\">Glowing Eye ring<\/td><td>Darkvision out to 60 feet, or 60 feet more if you already have it<\/td><td>Uncommon<\/td><td>—<\/td><td>500 gp<\/td><\/tr><tr><td class=\"first\">Mist slippers<\/td><td>You can walk on liquid as if it were solid ground<\/td><td>Uncommon<\/td><td>—<\/td><td>500 gp<\/td><\/tr><tr><td class=\"first\">Airy Bubble amulet<\/td><td>You can breathe water<\/td><td>Uncommon<\/td><td>—<\/td><td>500 gp<\/td><\/tr><tr><td class=\"first\">Fins belt<\/td><td>A Swim Speed equal to your Speed<\/td><td>Uncommon<\/td><td>—<\/td><td>500 gp<\/td><\/tr><tr><td class=\"first\">Hoptoad boots<\/td><td>Your jump distances triple, and you take half damage from falling<\/td><td>Uncommon<\/td><td>Yes<\/td><td>800 gp<\/td><\/tr><tr><td class=\"first\">Eye-Maze amulet<\/td><td>Your outline shimmers and blurs: Advantage on Dexterity (Stealth) checks<\/td><td>Uncommon<\/td><td>Yes<\/td><td>800 gp<\/td><\/tr><tr><td class=\"first\">Barrier ring<\/td><td>+1 bonus to AC<\/td><td>Uncommon<\/td><td>Yes<\/td><td>1,000 gp<\/td><\/tr><tr><td class=\"first\">Flameguard, Frostguard, Shockguard or Poisonguard ring<\/td><td>Resistance to Fire, Cold, Lightning or Poison damage<\/td><td>Rare<\/td><td>Yes<\/td><td>5,000 gp<\/td><\/tr><tr><td class=\"first\">Fiery Ward, Icy Mask or Stormward robe<\/td><td>Resistance to Cold, Fire or Lightning damage, and a creature that hits you with a melee attack takes 1d6 Fire, Cold or Lightning damage<\/td><td>Rare<\/td><td>Yes<\/td><td>5,000 gp<\/td><\/tr><tr><td class=\"first\">Spellmire ring<\/td><td>Advantage on saving throws against spells<\/td><td>Rare<\/td><td>Yes<\/td><td>6,000 gp<\/td><\/tr><tr><td class=\"first\">Greater barrier ring<\/td><td>+2 bonus to AC<\/td><td>Rare<\/td><td>Yes<\/td><td>6,000 gp<\/td><\/tr><\/tbody><\/table><\/div>\n<h4 id=\"items-magic-items--fortify-enchantments\">Fortify Enchantments<\/h4>\n<p>Fortify enchantments make their wearer stronger, quicker or sharper.\nEach sets one ability score to 19, which does nothing if the score is\nalready 19 or higher. They all need Attunement.<\/p>\n<div class=\"tw\"><table><thead><tr><th>Item<\/th><th>Effect<\/th><th>Rarity<\/th><th>Price<\/th><\/tr><\/thead><tbody><tr><td class=\"first\">Savage Might belt<\/td><td>Strength 19<\/td><td>Uncommon<\/td><td>1,000 gp<\/td><\/tr><tr><td class=\"first\">Vigor amulet<\/td><td>Constitution 19<\/td><td>Uncommon<\/td><td>1,000 gp<\/td><\/tr><tr><td class=\"first\">Insight amulet<\/td><td>Intelligence 19<\/td><td>Uncommon<\/td><td>1,000 gp<\/td><\/tr><tr><td class=\"first\">Oathfast ring<\/td><td>Wisdom 19<\/td><td>Uncommon<\/td><td>1,000 gp<\/td><\/tr><tr><td class=\"first\">Heartwise amulet<\/td><td>Charisma 19<\/td><td>Uncommon<\/td><td>1,000 gp<\/td><\/tr><tr><td class=\"first\">Dawn Sprite ring<\/td><td>Dexterity 19<\/td><td>Rare<\/td><td>5,000 gp<\/td><\/tr><tr><td class=\"first\">Celerity boots<\/td><td>Your Speed increases by 10 feet (no score change)<\/td><td>Uncommon<\/td><td>800 gp<\/td><\/tr><\/tbody><\/table><\/div>\n<h3 id=\"items-magic-items--cast-when-used-items\">Cast When Used Items<\/h3>\n<p>Using one of these items takes a Magic action. Its spell costs 1\ncharge per spell level, like a spell slot: at least the spell's own\nlevel, and more to cast it at a higher level. A Healing ring with 3\ncharges can cast <em>Cure Wounds<\/em> three times at level 1, or once at\nlevel 3. Effects that aren't spells cost the charges shown. These items\nnever regain charges on their own; a filled soul gem recharges them (see\n<a class=\"xref\" href=\"#guide-house-rules--soul-gems\">Soul Gems<\/a> in the <em>Player's\nGuide<\/em>). Spells cast from them use a save DC of 13 and an attack\nbonus of +5, or DC 15 and +7 for Rare items.<\/p>\n<div class=\"tw\"><table><thead><tr><th>Item<\/th><th>Effect<\/th><th>Charges<\/th><th>Rarity<\/th><th>Attune<\/th><th>Price<\/th><\/tr><\/thead><tbody><tr><td class=\"first\">Healing ring<\/td><td>Cast Cure Wounds on yourself<\/td><td>3<\/td><td>Uncommon<\/td><td>—<\/td><td>500 gp<\/td><\/tr><tr><td class=\"first\">Hand of Heaven ring<\/td><td>Cast Levitate on yourself<\/td><td>3<\/td><td>Uncommon<\/td><td>—<\/td><td>600 gp<\/td><\/tr><tr><td class=\"first\">Unhinging ring<\/td><td>Cast Knock<\/td><td>3<\/td><td>Uncommon<\/td><td>—<\/td><td>600 gp<\/td><\/tr><tr><td class=\"first\">Scorcher, Winter Guest or Chastening ring<\/td><td>Release a burst of Fire, Cold or Lightning (1 charge; see below)<\/td><td>3<\/td><td>Uncommon<\/td><td>—<\/td><td>600 gp<\/td><\/tr><tr><td class=\"first\">Vivication amulet<\/td><td>Cast Lesser Restoration on yourself<\/td><td>3<\/td><td>Uncommon<\/td><td>—<\/td><td>800 gp<\/td><\/tr><tr><td class=\"first\">Bound blade ring<\/td><td>Conjure a bound weapon (1 charge; see below)<\/td><td>3<\/td><td>Uncommon<\/td><td>Yes<\/td><td>1,000 gp<\/td><\/tr><tr><td class=\"first\">Messenger ring<\/td><td>Summon a scamp (3 charges; see below)<\/td><td>3<\/td><td>Uncommon<\/td><td>Yes<\/td><td>1,000 gp<\/td><\/tr><tr><td class=\"first\">Almsivi or Divine amulet<\/td><td>Almsivi or Divine Intervention (3 charges; see Scrolls)<\/td><td>3<\/td><td>Uncommon<\/td><td>Yes<\/td><td>1,000 gp<\/td><\/tr><tr><td class=\"first\">Averted Eyes ring<\/td><td>Cast Invisibility on yourself<\/td><td>4<\/td><td>Rare<\/td><td>Yes<\/td><td>5,000 gp<\/td><\/tr><tr><td class=\"first\">Elemental Burst amulet<\/td><td>A blast of Fire, Cold or Lightning (1 charge; see Scrolls)<\/td><td>4<\/td><td>Rare<\/td><td>Yes<\/td><td>5,000 gp<\/td><\/tr><tr><td class=\"first\">Leaguestep amulet<\/td><td>Mark a place (1 charge), or return to it (4 charges; see Scrolls)<\/td><td>4<\/td><td>Rare<\/td><td>Yes<\/td><td>6,000 gp<\/td><\/tr><tr><td class=\"first\">Atronach ring<\/td><td>Summon a flame or frost atronach (4 charges; see below)<\/td><td>4<\/td><td>Rare<\/td><td>Yes<\/td><td>6,000 gp<\/td><\/tr><\/tbody><\/table><\/div>\n<ul>\n<li>\n<p><strong>Bursts.<\/strong> Scorcher rings deal Fire damage, Winter\nGuest rings Cold and Chastening rings Lightning. Each creature within 5\nfeet of you makes a Dexterity saving throw, taking 3d6 damage of the\nring's type on a failure or half as much on a success.<\/p>\n<\/li>\n<li>\n<p><strong>Bound weapons.<\/strong> A Daedric weapon of your choice, from\nany melee weapon in Chapter Two, appears in your hand for 1 minute or\nuntil you let go of it. It's only a shadow of a true Daedric weapon, so\nit has a +1 bonus to attack and damage rolls instead of +3, but it\ncounts as silver. Conjuring it takes a Bonus Action instead of a Magic\naction.<\/p>\n<\/li>\n<li>\n<p><strong>Summoning.<\/strong> The creature appears in an unoccupied\nspace within 30 feet of you an
