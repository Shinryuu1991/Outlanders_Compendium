this trait, you can't do so again until you\nfinish a long rest.<\/p>\n<p><em><strong>Higher Education.<\/strong><\/em> You have proficiency in\ntwo skills of your choice.<\/p>\n<p><em><strong>Resist Magicka.<\/strong><\/em> You have Advantage on\nsaving throws against spells and cantrips that deal damage.<\/p>\n<h3 id=\"guide-peoples-of-tamriel--dunmer-dark-elves\">Dunmer (Dark Elves)<\/h3>\n<p><figure><img alt=\"Portrait of Dunmer (Dark Elves)\" loading=\"lazy\" src=\"img/b2e77181a97a8e75cd7442fe678719f447d7fc81.webp\"/><\/figure>The Dunmer are proud, insular\nand cursed, and this is their island.<\/p>\n<p><strong>Appearance.<\/strong> Ashen grey skin and red eyes, on a lean\nelven frame. Ashlanders often wear tattoos and ash-coloured\nclothing.<\/p>\n<p><strong>History.<\/strong> The Dunmer were once golden-skinned elves\nwho left the Summerset Isles to worship the Daedra in Morrowind. After\nan ancient betrayal, the goddess Azura cursed them with grey skin and\nred eyes, and they have been the Dunmer ever since.<\/p>\n<p><strong>Culture.<\/strong> Power belongs to the Great Houses; on\nVvardenfell these are Hlaalu, Redoran and Telvanni. The Tribunal Temple\nand ancestor veneration shape daily life. The nomadic Ashlanders reject\nboth the Houses and the Temple.<\/p>\n<p>Families keep the ashes of their dead in household shrines and great\ntombs, and bind ancestral spirits to guard them; robbing a tomb is a\ncrime against an entire family line. Dunmer eat saltrice, kwama eggs and\nscrib jelly, and they build according to their House: Redoran homes from\nthe shells of giant beasts, Telvanni towers from living mushrooms, and\nHlaalu halls in an Imperial style. Insults matter. Call a Dunmer\n<em>s'wit<\/em> and expect a fight, and know that outlanders remain\n<em>n'wah<\/em> until they prove otherwise.<\/p>\n<p><strong>Attitudes.<\/strong> Proud, suspicious of outsiders, and quick\nto take offence. Duty to house and family comes before everything.<\/p>\n<p><strong>How others see them.<\/strong> Dour, arrogant and cruel,\nespecially to Argonians and Khajiit. Skilled warriors and mages who are\nhard to like. Nords and Argonians hold the oldest grudges.<\/p>\n<h4 id=\"guide-peoples-of-tamriel--dunmer-traits\">Dunmer Traits<\/h4>\n<div class=\"tw\"><table><thead><tr><th>Creature Type<\/th><th>Size<\/th><th>Speed<\/th><\/tr><\/thead><tbody><tr><td class=\"first\">Humanoid<\/td><td>Medium (about 5–6 feet tall)<\/td><td>30 feet<\/td><\/tr><\/tbody><\/table><\/div>\n<p>As a Dunmer, you have these special traits.<\/p>\n<p><em><strong>Ancestor Guardian.<\/strong><\/em> At level 5, you learn\n<em>Sanctuary<\/em>. When you cast it without a spell slot using this\ntrait, you must target yourself. The ward appears as the spirit of an\nancestor.<\/p>\n<p><em><strong>Ancestral Teachings.<\/strong><\/em> You have proficiency\nin your choice of Arcana, Athletics, Persuasion, Religion or\nSurvival.<\/p>\n<p><em><strong>Ashen Blood.<\/strong><\/em> You have Resistance to Fire\ndamage. You know the <em>Fire Bolt<\/em> cantrip, and at level 3 you\nlearn <em>Hellish Rebuke<\/em>.<\/p>\n<p><em><strong>Ashen Presence.<\/strong><\/em> You know the\n<em>Thaumaturgy<\/em> cantrip.<\/p>\n<p><em><strong>Darkvision.<\/strong><\/em> You have Darkvision with a\nrange of 60 feet.<\/p>\n<p><em><strong>Dunmer Versatility.<\/strong><\/em> You have proficiency\nwith shortswords, daggers and longbows.<\/p>\n<h3 id=\"guide-peoples-of-tamriel--imperials\">Imperials<\/h3>\n<p><figure><img alt=\"Portrait of Imperials\" loading=\"lazy\" src=\"img/3f61a975ea0ebe341d1896a991874d218d0558f0.webp\"/><\/figure>Imperials run the Empire, and they would\nlike you to fill out the correct form about it.<\/p>\n<p><strong>Appearance.<\/strong> Human, of medium build, with skin from\nfair to olive. They dress well when they can afford to.<\/p>\n<p><strong>History.<\/strong> Imperials come from Cyrodiil, the heartland\nof Tamriel. Their ancestors threw off their elven masters to found the\nfirst human empire, and today their Emperor rules all of Tamriel,\nMorrowind included.<\/p>\n<p><strong>Culture.<\/strong> Law, trade, bureaucracy and the Legion hold\nthe Empire together. Western Colovians lean martial and blunt; eastern\nNibenese lean mercantile, magical and ornate. The Imperial Cult of the\nNine Divines is the official faith.<\/p>\n<p>Colovians, from the western highlands, value plain speech, hard work\nand service in the Legion. Nibenese, from the rich eastern valley, love\nceremony, colourful dress, commerce and magic. Both share a deep\nconfidence in Imperial law, and both expect to be treated as citizens\nwherever they go.<\/p>\n<p><strong>Attitudes.<\/strong> Confident, practical and sure the Empire\nbrings order. Most see other cultures as interesting provinces rather\nthan equals.<\/p>\n<p><strong>How others see them.<\/strong> Administrators, merchants and\nsoldiers. Nords and Redguards respect the Legion; Altmer find Imperials\ntolerable for Men. Most Dunmer see them as occupiers, and say so\ncarefully.<\/p>\n<h4 id=\"guide-peoples-of-tamriel--imperial-traits\">Imperial Traits<\/h4>\n<div class=\"tw\"><table><thead><tr><th>Creature Type<\/th><th>Size<\/th><th>Speed<\/th><\/tr><\/thead><tbody><tr><td class=\"first\">Humanoid<\/td><td>Medium (about 5–6 feet tall)<\/td><td>30 feet<\/td><\/tr><\/tbody><\/table><\/div>\n<p>As an Imperial, you have these special traits.<\/p>\n<p><em><strong>Legion Discipline.<\/strong><\/em> You have Advantage on\nsaving throws to avoid or end the Frightened condition.<\/p>\n<p><em><strong>Legion Training.<\/strong><\/em> You have proficiency with\nshields, broadswords and spears.<\/p>\n<p><em><strong>Shield Wall.<\/strong><\/em> When a creature you can see\nhits you, or an ally within 5 feet of you, with an attack while you are\nholding a shield, you can take a Reaction to add your Proficiency Bonus\nto the target's AC against that attack, potentially causing a miss. You\ncan use this trait a number of times equal to your Proficiency Bonus,\nand you regain all expended uses when you finish a long rest.<\/p>\n<p><em><strong>Voice of the Emperor.<\/strong><\/em> You have proficiency\nin Persuasion.<\/p>\n<h3 id=\"guide-peoples-of-tamriel--khajiit\">Khajiit<\/h3>\n<p><figure><img alt=\"Portrait of Khajiit\" loading=\"lazy\" src=\"img/ad76723e0fbaac1aaa81278a3ac9bb89fe18b867.webp\"/><\/figure>Khajiit are agile, sharp-witted and ruled by\nthe moons. They are also blamed for most of the skooma on Vvardenfell,\nwhich is only partly fair.<\/p>\n<p><strong>Appearance.<\/strong> Feline, with fur, tails and claws. The\nphases of the moons at birth decide a Khajiit's form, which ranges from\nnearly human to great war-cats. Those seen on Vvardenfell are mostly the\nupright, human-sized kind.<\/p>\n<p><strong>History.<\/strong> Khajiit come from Elsweyr, a land of\ndeserts and jungles south of Cyrodiil. In Morrowind they are often\nenslaved, as Argonians are.<\/p>\n<p><strong>Culture.<\/strong> Faith centres on the Riddle'Thar and the\ntwo moons. Moon sugar is sacred to them, and refined into skooma it is a\ndangerous, highly profitable drug. Many Khajiit speak of themselves in\nthe third person.<\/p>\n<p>A Khajiit's form depends on the phases of the moons at birth. The\nOhmes look almost like elves, the Suthay-raht seen on Vvardenfell walk\nupright, and the Senche are war-cats big enough to ride. Names carry\ntitles: prefixes such as Ri', Ra', Do' and J' mark rank, age or deeds,\nand they change over a Khajiit's life. The Riddle'Thar teaches that the\ndance of the moons, which Khajiit call Jone and Jode, sets the order of\nthe world.<\/p>\n<p><strong>Attitudes.<\/strong> Playful, wry and loyal to clan and kin.\nThey tend to treat laws as suggestions written by other people.<\/p>\n<p><strong>How others see them.<\/strong> Thieves, smugglers and skooma\ndealers, which is unfair to most and accurate about a few. They are\nwelcome as acrobats and traders, but rarely as neighbours.<\/p>\n<h4 id=\"guide-peoples-of-tamriel--khajiit-traits\">Khajiit Traits<\/h4>\n<div class=\"tw\"><table><thead><tr><th>Creature Type<\/th><th>Size<\/th><th>Speed<\/th><\/tr><\/thead><tbody><tr><td class=\"first\">Humanoid<\/td><td>Medium (about 5–6 feet tall)<\/td><td>30 feet; Climb Speed 30 feet<\/td><\/tr><\/tbody><\/table><\/div>\n<p>As a Khajiit, you have these special traits.<\/p>\n<p><em><strong>Claws.<\/strong><\/em> Your claws are natural weapons you\ncan use for Unarmed Strikes. A hit deals Slashing damage equal to 1d6\nplus your Strength modifier, instead of the normal Bludgeoning\ndamage.<\/p>\n<p><em><strong>Eye of Night.<\/strong><\/em> You have Darkvision with a\nrange of 120 feet.<\/p>\n<p><em><strong>Feline Agility.<\/strong><\/em> When you move on your turn\nin combat, you can double your Speed until the end of that turn. Once\nyou do, you can't do so again until you spend one of your turns moving 0\nfeet.<\/p>\n<p><em><strong>Feline Talent.<\/strong><\/em> You have proficiency in\nPerception and Stealth.<\/p>\n<h3 id=\"guide-peoples-of-tamriel--nords\">Nords<\/h3>\n<p><figure><img alt=\"Portrait of Nords\" loading=\"lazy\" src=\"img/2939a39a7b26271fb6be7b8157900d25de3c6397.webp\"/><\/figure>Nords are tall, tough, loud and honest, often\nmore honest than the situation needs.<\/p>\n<p><strong>Appearance.<\/strong> Big-boned and fair, with blond, red or\nbrown hair. They shrug off cold that would kill other races.<\/p>\n<p><strong>History.<\/strong> Nords sailed to Skyrim, in Tamriel's cold\nnorth, from a frozen continent across the sea. Their early armies\ninvaded Morrowind and were driven out, and Nords and Dunmer have been\nenemies ever since.<\/p>\n<p><strong>Culture.<\/strong> Clan, courage and a good death matter most;\nthe brave expect to feast in Sovngarde. Skalds keep history in song, and\nmead keeps the skalds going. Many distrust magic, especially elven\nmagic.<\/p>\n<p>Nords honour Kyne (Kynareth to the Imperials), goddess of storms, and\nShor, who is Lorkhan by another name, alongside the other Divines, and\nmany treat Talos as one of their own heroes. Disputes are settled openly\nand often loudly. A Nord's word, once given, is expected to hold, and an\noathbreaker is despised more than an honest enemy.<\/p>\n<p><strong>Attitudes.<\/strong> Direct, warlike and fiercely loyal. They\nrespect strength and plain speech, and despise sneaks.<\/p>\n<p><strong>How others see them.<\/strong> Brave but barbaric to Altmer\nand Bretons, reliable soldiers to Imperials. The Dunmer have not\nforgotten the invasions. In some places on Vvardenfell, a Nord walks\ninto most rooms already at a disadvantage.<\/p>\n<h4 id=\"guide-peoples-of-tamriel--nord-traits\">Nord Traits<\/h4>\n<div class=\"tw\"><table><thead><tr><th>Creature Type<\/th><th>Size<\/th><th>Speed<\/th><\/tr><\/thead><tbody><tr><td class=\"first\">Humanoid<\/td><td>Medium (about 6–7 feet tall)<\/td><td>30 feet<\/td><\/tr><\/tbody><\/table><\/div>\n<p>As a Nord, you have these special traits.<\/p>\n<p><em><strong>Battle Cry.<\/strong><\/em> When you take the Attack\naction, you can replace one of your attacks with a wordless roar. Each\ncreature of your choice within 30 feet of you that can hear you must\nmake a Wisdom saving throw (DC 8 + your Constitution modifier + your\nProficiency Bonus). On a failure, a creature has the Frightened\ncondition for 1 minute. It repeats the save at the end of each of its\nturns, ending the effect on itself on a success. Once you use this\ntrait, you can't do so again until you finish a long rest.<\/p>\n<p><em><strong>Imposing.<\/strong><\/em> You gain Proficiency in\nIntimidation.<\/p>\n<p><em><strong>Nord Hardiness.<\/strong><\/em> You have Resistance to Cold\nand Lightning damage.<\/p>\n<p><em><strong>Savage Attacks.<\/strong><\/em> When you score a Critical\nHit with a melee weapon, roll one of the weapon's damage dice one more\ntime and add it to the Critical Hit's extra damage.<\/p>\n<h3 id=\"guide-peoples-of-tamriel--orsimer-orcs\">Orsimer (Orcs)<\/h3>\n<p><figure><img alt=\"Portrait of Orsimer (Orcs)\" loading=\"lazy\" src=\"img/c76383cf70c9a18e2c3a6de9265eca29d1939c00.webp\"/><\/figure>Orcs are Mer who were cast out, and\nthey have built a culture around never being cast out again.<\/p>\n<p><strong>Appearance.<\/strong> Broad, heavily muscled and green-grey,\nwith tusks and heavy brows. They are built for work and war.<\/p>\n<p><strong>History.<\/strong> Orcs were once elves, transformed along\nwith their god when he became the Daedric Prince Malacath, and other\npeoples have treated them as outcasts ever since. Their homeland is\nOrsinium, a mountain kingdom between High Rock and Hammerfell.<\/p>\n<p><strong>Culture.<\/strong> Clans live in strongholds under a chief,\nguided by the Code of Malacath. Oaths are sacred, grudges are kept, and\nsmithing is an art. Orcish armour is some of the best in Tamriel.<\/p>\n<p>A chief rules by strength and can be challenged for the title. Wise\nwomen keep each stronghold's lore and healing. Under the Code, a wrong\nis paid for in blood or in gold, and nothing is forgiven for free.\nOrcish smiths work orichalcum, and armour from a good stronghold forge\nis worth a small fortune.<\/p>\n<p><strong>Attitudes.<\/strong> Proud, blunt and deeply loyal. They\nexpect contempt from outsiders and respect from anyone who has earned\nit.<\/p>\n<p><strong>How others see them.<\/strong> Many still see them as brutes\nor beasts. The Legion and every mercenary company value them as\nfighters. Bretons, their old neighbours and enemies, trust them\nleast.<\/p>\n<h4 id=\"guide-peoples-of-tamriel--orc-traits\">Orc Traits<\/h4>\n<div class=\"tw\"><table><thead><tr><th>Creature Type<\/th><th>Size<\/th><th>Speed<\/th><\/tr><\/thead><tbody><tr><td class=\"first\">Humanoid<\/td><td>Medium (about 6–7 feet tall)<\/td><td>30 feet<\/td><\/tr><\/tbody><\/table><\/div>\n<p>As an Orc, you have these special traits.<\/p>\n<p><em><strong>Berserk.<\/strong><\/em> As a Bonus Action, you fly into a\nberserk rage for 1 minute. While it lasts, you gain the following\neffects:<\/p>\n<ul>\n<li>\n<p>You gain Temporary Hit Points equal to your level plus your\nProficiency Bonus.<\/p>\n<\/li>\n<li>\n<p>You have Advantage on attack rolls with melee weapons and Unarmed\nStrikes, and those attacks deal extra damage equal to your Proficiency\nBonus.<\/p>\n<\/li>\n<li>\n<p>Attack rolls against you have Advantage, and you have Disadvantage on\nDexterity saving throws.<\/p>\n<\/li>\n<\/ul>\n<p>Once you use this trait, you can't do so again until you finish a\nlong rest.<\/p>\n<p><em><strong>Darkvision.<\/strong><\/em> You have Darkvision with a\nrange of 60 feet.<\/p>\n<p><em><strong>Imposing.<\/strong><\/em> You gain Proficiency in\nIntimidation.<\/p>\n<p><em><strong>Orcish Smithing.<\/strong><\/em> You have proficiency with\nSmith's Tools.<\/p>\n<p><em><strong>Relentless Endurance.<\/strong><\/em> When you are reduced\nto 0 Hit Points but not killed outright, you can drop to 1 Hit Point\ninstead. Once you use this trait, you can't do so again until you finish\na long rest.<\/p>\n<h3 id=\"guide-peoples-of-tamriel--redguards\">Redguards<\/h3>\n<p><figure><img alt=\"Portrait of Redguards\" loading=\"lazy\" src=\"img/06929bea1ecafed8b74b058b14e29ebbe8a1a784.webp\"/><\/figure>Redguards are the finest natural warriors\nin Tamriel, and they know it.<\/p>\n<p><strong>Appearance.<\/strong> Dark-skinned, athletic and tough. They\ntolerate heat, poison and disease better than most.<\/p>\n<p><strong>History.<\/strong> Redguards came to Hammerfell, in Tamriel's\nwest, from a continent that has since sunk beneath the sea. Their\nwarriors cleared the land by the sword before the settlers arrived, and\nthe sword has been at the heart of their culture ever since.<\/p>\n<p><strong>Culture.<\/strong> The sword is close to sacred, and master\nswordsmen are honoured like saints. Society divides between\ntraditionalist Crowns and Empire-friendly Forebears. Many distrust magic\nand prefer steel.<\/p>\n<p>Redguards follow the Way of the Sword, set down in Frandar Hunding's\nBook of Circles, which treats swordsmanship as a spiritual discipline.\nThe Crowns keep the old Yokudan gods, such as Satakal and Tu'whacca; the\nForebears mostly worship the Nine. Necromancy is an abomination to\nnearly all Redguards, and many would rather trust a blade they can see\nthan a spell they can't.<\/p>\n<p><strong>Attitudes.<\/strong> Proud, independent and fiercely\nprotective of their freedom. They don't follow anyone they haven't\nchosen to follow.<\/p>\n<p><strong>How others see them.<\/strong> Formidable warriors and\nsought-after mercenaries. Bretons and Imperials respect them warily, and\nAltmer find them uncultured. Few races call them close friends.<\/p>\n<h4 id=\"guide-peoples-of-tamriel--redguard-traits\">Redguard Traits<\/h4>\n<div class=\"tw\"><table><thead><tr><th>Creature Type<\/th><th>Size<\/th><th>Speed<\/th><\/tr><\/thead><tbody><tr><td class=\"first\">Humanoid<\/td><td>Medium (about 5½–6½ feet tall)<\/td><td>30 feet<\/td><\/tr><\/tbody><\/table><\/div>\n<p>As a Redguard, you have these special traits.<\/p>\n<p><em><strong>Adrenaline Rush.<\/strong><\/em> As a bonus action, you\npush your body past its limits. For 1 minute your Speed increases by 10\nfeet, you have Advantage on Strength and Dexterity checks and saving\nthrows, and you gain Temporary Hit Points equal to your level. Once you\nuse this trait, you can't do so again until you finish a long rest.<\/p>\n<p><em><strong>Redguard Resilience.<\/strong><\/em> You have Resistance to\nPoison damage. You have Advantage on saving throws to avoid or end the\nPoisoned condition, and on saving throws against disease.<\/p>\n<p><em><strong>Way of the Sword.<\/strong><\/em> You have proficiency with\nbroadswords, claymores, longswords, rapiers, sabers, and shortswords.\nYou can also use the mastery property of one of these sword types, as if\nyou had the Weapon Mastery feature; if you already have the Weapon\nMastery feature, it's an extra weapon you've mastered. Whenever you\nfinish a long rest, you can change which sword you've chosen.<\/p>\n<h3 id=\"guide-peoples-of-tamriel--languages-of-tamriel\">Languages of Tamriel<\/h3>\n<p>Tamrielic, the language of the Empire, is spoken everywhere, but most\npeoples keep a tongue of their own.<\/p>\n<div class=\"tw\"><table><thead><tr><th>Language<\/th><th>Spoken by<\/th><th>On Vvardenfell<\/th><\/tr><\/thead><tbody><tr><td class=\"first\">Tamrielic<\/td><td>Everyone; most Imperials and Bretons speak nothing else<\/td><td>The common tongue of officials, traders and the Legion<\/td><\/tr><tr><td class=\"first\">Aldmeris<\/td><td>Altmer<\/td><td>Altmer mages, and old elven texts<\/td><\/tr><tr><td class=\"first\">Bosmeris<\/td><td>Bosmer<\/td><td>Bosmer hunters, scouts and traders<\/td><\/tr><tr><td class=\"first\">Daedric<\/td><td>Daedra, and the mortals who summon or worship them<\/td><td>Summoned creatures, Daedric shrines and the ruins around them<\/td><\/tr><tr><td class=\"first\">Dunmeris<\/td><td>Dunmer<\/td><td>Everywhere: the Great Houses, the Temple and Ashlander camps<\/td><\/tr><tr><td class=\"first\">Dwemeris<\/td><td>No one living; it belonged to the vanished Dwemer<\/td><td>Written on the walls and machines of Dwemer ruins<\/td><\/tr><tr><td class=\"first\">Jel<\/td><td>Argonians<\/td><td>Among Argonians, free and enslaved<\/td><\/tr><tr><td class=\"first\">Nordic<\/td><td>Nords<\/td><td>Nord sellswords, and the island of Solstheim to the north<\/td><\/tr><tr><td class=\"first\">Orcish<\/td><td>Orcs<\/td><td>Orc mercenaries and smiths<\/td><\/tr><tr><td class=\"first\">Ta'agra<\/td><td>Khajiit<\/td><td>Khajiit caravans, and among Khajiit slaves<\/td><\/tr><tr><td class=\"first\">Yoku<\/td><td>Redguards<\/td><td>Rarely; a few Redguard sellswords keep it<\/td><\/tr><\/tbody><\/table><\/div>\n<ul>\n<li>\n<p><strong>Choosing.<\/strong> You speak Tamrielic and two languages of\nyour choice from this table, except Dwemeris.<\/p>\n<\/li>\n<li>\n<p><strong>Dwemeris.<\/strong> Nobody alive speaks it, but scholars can\nlearn to read it. It can only be learned in play, in whatever way your\nDM decides.<\/p>\n<\/li>\n<li>\n<p><strong>Class languages.<\/strong> Thieves' Cant (rogues) and Druidic\n(druids) come from your class, not from this table.<\/p>\n<\/li>\n<\/ul>\n"},{"id":"guide-classes-on-vvardenfell","t":"Step Two: Classes on Vvardenfell","s":[{"id":"guide-classes-on-vvardenfell--every-class-has-a-place","t":"Every Class Has a Place","l":2},{"id":"guide-classes-on-vvardenfell--weapon-mastery","t":"Weapon Mastery","l":2}],"p":"Making Your Character","sub":"Choose Your Class","h":"\n\n\n<div class=\"epigraph\">\n<p><em>“Everyone on this island is something: a sword, a spell or a\ndebt. Decide which before someone decides for you.”<\/em><\/p>\n<\/div>\n<div class=\"attribution\">\n<p>— A Fighters Guild steward, Balmora<\/p>\n<\/div>\n<h3 id=\"guide-classes-on-vvardenfell--every-class-has-a-place\">Every Class Has a Place<\/h3>\n<p class=\"dropcap\">Every class in the 2024 <em>Player's Handbook<\/em>\nhas a place on Vvardenfell, and works exactly as written. This step says\nwhere your class fits on the island, and who is likely to want your\nservices once you land.<\/p>\n<div class=\"tw\"><table><thead><tr><th>Class<\/th><th>On Vvardenfell<\/th><th>Who'll want you<\/th><\/tr><\/thead><tbody><tr><td class=\"first\">Barbarian<\/td><td>Nords from Skyrim and Orcs from the mountains of Orsinium bring their fury with them. House Redoran respects it; everyone else keeps their distance.<\/td><td>The Fighters Guild, House Redoran<\/td><\/tr><tr><td class=\"first\">Bard<\/td><td>Imperial courtiers, Breton minstrels and Khajiit storytellers. On an island that runs on favours, a silver tongue is worth more than a sword.<\/td><td>House Hlaalu, the Thieves Guild<\/td><\/tr><tr><td class=\"first\">Cleric<\/td><td>A priest of the Imperial Cult, the Tribunal Temple or a Daedric shrine. You choose your god in Step Six.<\/td><td>The Temple, the Imperial Cult<\/td><\/tr><tr><td class=\"first\">Druid<\/td><td>Bosmer of the Green Pact and followers of Kyne. Vvardenfell's wilds are ash and giant fungus, and its spirits are strange.<\/td><td>The Mages Guild, which will want to study you; the Ashlanders, who might respect you<\/td><\/tr><tr><td class=\"first\">Fighter<\/td><td>Legion veterans, caravan guards and Redguard swords for hire. There is always work on Vvardenfell for someone who can fight.<\/td><td>The Fighters Guild, the Imperial Legion, House Redoran<\/td><\/tr><tr><td class=\"first\">Monk<\/td><td>Pilgrims, ascetics and students of the old unarmed schools. Vivec's own warriors, the Buoyant Armigers, prize that kind of discipline.<\/td><td>The Temple, the Morag Tong<\/td><\/tr><tr><td class=\"first\">Paladin<\/td><td>A holy knight of the Nine Divines, or the sworn servant of another power. The Temple's Ordinators dislike competition. You choose your god in Step Six.<\/td><td>The Imperial Cult, the Imperial Legion<\/td><\/tr><tr><td class=\"first\">Ranger<\/td><td>Bosmer hunters, Redguard trackers and Nord woodsmen. The island needs guides through country that wants you dead.<\/td><td>The Fighters Guild, the East Empire Company<\/td><\/tr><tr><td class=\"first\">Rogue<\/td><td>Thieves, spies and cutpurses. The Thieves Guild has followed the Empire to the island, and the Camonna Tong would like it gone.<\/td><td>The Thieves Guild, House Hlaalu<\/td><\/tr><tr><td class=\"first\">Sorcerer<\/td><td>Bretons with Direnni blood, Altmer born with a gift, or stranger heritage still. The Mages Guild is wary of untrained power; the Telvanni admire it.<\/td><td>The Mages Guild, House Telvanni<\/td><\/tr><tr><td class=\"first\">Warlock<\/td><td>You made a bargain with a Daedric Prince. Serving one of the Good Daedra is accepted; serving any other Prince is heresy. You choose your patron in Step Six.<\/td><td>Your patron's cult, if you can find it<\/td><\/tr><tr><td class=\"first\">Wizard<\/td><td>A scholar trained by the Mages Guild in Cyrodiil, or in the towers of the Summerset Isles. The Telvanni wizard-lords think Guild mages are amateurs.<\/td><td>The Mages Guild, House Telvanni<\/td><\/tr><\/tbody><\/table><\/div>\n\n\n\n<ul>\n<li>\n<p><strong>Faith suggests some subclasses.<\/strong> Clerics, paladins\nand warlocks choose a god or patron in <a class=\"xref\" href=\"#guide-your-faith\">Step Six<\/a>, and each one suggests domains,\noaths or patrons that suit it. They're suggestions, not limits.<\/p>\n<\/li>\n<li>\n<p><strong>Joining up.<\/strong> The factions in the table will notice\nyou, and some will approach you early on. Membership is earned in play,\nnot chosen now.<\/p>\n<\/li>\n<li>\n<p><strong>Spellcasters.<\/strong> The Mages Guild sells spells and\nscrolls (see <a class=\"xref\" href=\"#items-services-and-travel--buying-spells\">Buying Spells<\/a> in\n<em>Treasures of Morrowind<\/em>). Some birthsigns suit spellcasters\nbetter than others (<a class=\"xref\" href=\"#guide-birthsigns-of-tamriel\">Step\nFour<\/a>).<\/p>\n<\/li>\n<li>\n<p><strong>Your primary ability.<\/strong> Your class's primary ability\nshould get one of your best scores in <a class=\"xref\" href=\"#guide-ability-scores\">Step Five<\/a>.<\/p>\n<\/li>\n<\/ul>\n<h3 id=\"guide-classes-on-vvardenfell--weapon-mastery\">Weapon Mastery<\/h3>\n<p>Every weapon in <em>Treasures of Morrowind<\/em> has a mastery\nproperty, shown in the Mastery column of its <a class=\"xref\" href=\"#items-weapons\">weapon tables<\/a>. Mastery is a trick that a\ntrained warrior gets out of a weapon: a spear that throws a foe off\nbalance, a dagger quick enough for a second strike. Anyone can swing a\nweapon, but you can use its mastery property only if a feature lets\nyou.<\/p>\n<ul>\n<li>\n<p><strong>Who has it.<\/strong> Five classes start with Weapon Mastery\nat 1st level, as shown below. Anyone of 4th level or higher can take the\nWeapon Master feat to master one more kind of weapon. Other classes have\nno mastery unless they take the feat.<\/p>\n<\/li>\n<li>\n<p><strong>Proficiency.<\/strong> You must be proficient with a weapon to\nuse its mastery property.<\/p>\n<\/li>\n<li>\n<p><strong>Kinds of weapon.<\/strong> You master a kind of weapon, not\none item, so mastery of the broadsword works with every broadsword,\nwhatever it's made of. Choose by the names in <em>Treasures of\nMorrowind<\/em>: the Mastery column says what each one gives you.<\/p>\n<\/li>\n<li>\n<p><strong>Changing your mind.<\/strong> Whenever you finish a Long Rest,\nyou can change your choices. Barbarians and fighters change one choice\nper Long Rest.<\/p>\n<\/li>\n<\/ul>\n<div class=\"tw\"><table><thead><tr><th>Source<\/th><th>Kinds of weapon<\/th><th>Which weapons<\/th><\/tr><\/thead><tbody><tr><td class=\"first\">Barbarian<\/td><td>2 (3 at 4th level, 4 at 10th)<\/td><td>Simple or Martial melee weapons<\/td><\/tr><tr><td class=\"first\">Fighter<\/td><td>3 (4 at 4th level, 5 at 10th, 6 at 16th)<\/td><td>Any Simple or Martial weapons<\/td><\/tr><tr><td class=\"first\">Paladin<\/td><td>2<\/td><td>Any weapons you're proficient with<\/td><\/tr><tr><td class=\"first\">Ranger<\/td><td>2<\/td><td>Any weapons you're proficient with<\/td><\/tr><tr><td class=\"first\">Rogue<\/td><td>2<\/td><td>Any weapons you're proficient with<\/td><\/tr><tr><td class=\"first\">Weapon Master feat (4th level+)<\/td><td>1 more<\/td><td>Any weapon you're proficient with<\/td><\/tr><\/tbody><\/table><\/div>\n<p>The properties do the following when you attack with a weapon you\nhave mastered. \"Ability modifier\" means the one you used for the attack\nroll.<\/p>\n<div class=\"tw\"><table><thead><tr><th>Property<\/th><th>Effect<\/th><th>Weapons in Treasures<\/th><\/tr><\/thead><tbody><tr><td class=\"first\">Cleave<\/td><td>Once per turn, when you hit a creature with a melee attack, you can attack a second creature within 5 feet of the first and within your reach. Don't add your ability modifier to the second attack's damage unless it's negative.<\/td><td>Battle axe, halberd<\/td><\/tr><tr><td class=\"first\">Graze<\/td><td>When you miss, the target still takes damage equal to your ability modifier, of the weapon's damage type.<\/td><td>Broadsword, claymore, glaive, dai-katana<\/td><\/tr><tr><td class=\"first\">Nick<\/td><td>The extra attack from the Light property is part of your Attack action instead of a Bonus Action, which frees your Bonus Action. Once per turn.<\/td><td>Dagger, saber, tanto, wakizashi, throwing knife<\/td><\/tr><tr><td class=\"first\">Push<\/td><td>On a hit, you can push a Large or smaller creature up to 10 feet straight away from you.<\/td><td>Long spear, crossbow<\/td><\/tr><tr><td class=\"first\">Sap<\/td><td>On a hit, the target has Disadvantage on its next attack roll before the start of your next turn.<\/td><td>Mace, miner's pick, spear, longsword, spiked club, katana<\/td><\/tr><tr><td class=\"first\">Slow<\/td><td>On a hit that deals damage, the target's Speed drops by 10 feet until the start of your next turn. More hits don't slow it further.<\/td><td>Club, light crossbow, whip, long bow<\/td><\/tr><tr><td class=\"first\">Topple<\/td><td>On a hit, the target makes a Constitution saving throw (DC 8 + your ability modifier + your Proficiency Bonus) or falls Prone.<\/td><td>Staff, trident, war axe, warhammer<\/td><\/tr><tr><td class=\"first\">Vex<\/td><td>On a hit that deals damage, you have Advantage on your next attack roll against that creature before the end of your next turn.<\/td><td>Axe, short bow, rapier, shortsword, dart, throwing star<\/td><\/tr><\/tbody><\/table><\/div>\n"},{"id":"guide-backgrounds-of-tamriel","t":"Step Three: Backgrounds of Tamriel","s":[{"id":"guide-backgrounds-of-tamriel--choosing-a-background","t":"Choosing a Background","l":2},{"id":"guide-backgrounds-of-tamriel--backgrounds-from-the-players-handbook","t":"Backgrounds from the Player's Handbook","l":2},{"id":"guide-backgrounds-of-tamriel--acolyte","t":"Acolyte","l":3},{"id":"guide-backgrounds-of-tamriel--artisan","t":"Artisan","l":3},{"id":"guide-backgrounds-of-tamriel--charlatan","t":"Charlatan","l":3},{"id":"guide-backgrounds-of-tamriel--criminal","t":"Criminal","l":3},{"id":"guide-backgrounds-of-tamriel--entertainer","t":"Entertainer","l":3},{"id":"guide-backgrounds-of-tamriel--farmer","t":"Farmer","l":3},{"id":"guide-backgrounds-of-tamriel--guard","t":"Guard","l":3},{"id":"guide-backgrounds-of-tamriel--guide","t":"Guide","l":3},{"id":"guide-backgrounds-of-tamriel--hermit","t":"Hermit","l":3},{"id":"guide-backgrounds-of-tamriel--merchant","t":"Merchant","l":3},{"id":"guide-backgrounds-of-tamriel--noble","t":"Noble","l":3},{"id":"guide-backgrounds-of-tamriel--sage","t":"Sage","l":3},{"id":"guide-backgrounds-of-tamriel--sailor","t":"Sailor","l":3},{"id":"guide-backgrounds-of-tamriel--scribe","t":"Scribe","l":3},{"id":"guide-backgrounds-of-tamriel--soldier","t":"Soldier","l":3},{"id":"guide-backgrounds-of-tamriel--wayfarer","t":"Wayfarer","l":3},{"id":"guide-backgrounds-of-tamriel--backgrounds-of-morrowind","t":"Backgrounds of Morrowind","l":2},{"id":"guide-backgrounds-of-tamriel--ashlander-exile","t":"Ashlander Exile","l":3},{"id":"guide-backgrounds-of-tamriel--company-clerk","t":"Company Clerk","l":3},{"id":"guide-backgrounds-of-tamriel--ebony-miner","t":"Ebony Miner","l":3},{"id":"guide-backgrounds-of-tamriel--fighters-guild-journeyman","t":"Fighters Guild Journeyman","l":3},{"id":"guide-backgrounds-of-tamriel--freed-slave","t":"Freed Slave","l":3},{"id":"guide-backgrounds-of-tamriel--mages-guild-associate","t":"Mages Guild Associate","l":3},{"id":"guide-backgrounds-of-tamriel--nord-skald","t":"Nord Skald","l":3},{"id":"guide-backgrounds-of-tamriel--pilgrim","t":"Pilgrim","l":3},{"id":"guide-backgrounds-of-tamriel--silt-strider-caravaner","t":"Silt Strider Caravaner","l":3},{"id":"guide-backgrounds-of-tamriel--smuggler","t":"Smuggler","l":3}],"p":"Making Your Character","sub":"Who You Were Before the Voyage","h":"\n\n\n<div class=\"epigraph\">\n<p><em>“Nobody on this island cares who you were back home. They care\nwhat you can do, and who you owe.”<\/em><\/p>\n<\/div>\n<div class=\"attribution\">\n<p>— A Hlaalu trader, Balmora<\/p>\n<\/div>\n<h3 id=\"guide-backgrounds-of-tamriel--choosing-a-background\">Choosing a Background<\/h3>\n<p class=\"dropcap\">Your background is what you did before you boarded\nthe ship: the trade, the faith or the trouble that made you who you are.\nNone of you has set foot on Vvardenfell before. Your background happened\nsomewhere else: on the mainland of Morrowind, or elsewhere in Tamriel.\nChoose one of the sixteen backgrounds from the <em>Player's\nHandbook<\/em>, retooled below for this campaign, or one of the ten\nMorrowind backgrounds that follow them.<\/p>\n<p><strong>What a background gives you<\/strong><\/p>\n<ul>\n<li>\n<p><strong>Ability scores.<\/strong> Your background lists three\nabilities, which you raise in <a class=\"xref\" href=\"#guide-ability-scores\">Step\nFive<\/a>.<\/p>\n<\/li>\n<li>\n<p><strong>Proficiencies.<\/strong> Two skills and one tool.<\/p>\n<\/li>\n<li>\n<p><strong>Equipment.<\/strong> The package listed, or 50 gp to spend\ninstead.<\/p>\n<\/li>\n<li>\n<p><strong>A connection.<\/strong> A tie to the island you've never seen:\nsomeone there who knows your name, your family, your trade or your old\ncrew. Connections are story hooks, not rules: they give your DM a thread\nto pull, and you a reason to be known.<\/p>\n<\/li>\n<li>\n<p><strong>No Origin feat.<\/strong> Your birthsign takes its place (see\n<a class=\"xref\" href=\"#guide-birthsigns-of-tamriel\">Step Four<\/a>). You can still\ntake an Origin feat later, using the Ability Score Improvement\nfeature.<\/p>\n<\/li>\n<\/ul>\n<p><strong>Doubled proficiencies.<\/strong> If your background gives you\na skill or tool proficiency you already have from your race or\nbirthsign, choose a different skill or tool instead.<\/p>\n<p><strong>Making your own.<\/strong> With your DM's agreement, you can\nbuild a background of your own. Choose three abilities, two skills and\none tool that fit your story, take 50 gp for equipment, and agree a\nconnection with your DM.<\/p>\n<h3 id=\"guide-backgrounds-of-tamriel--backgrounds-from-the-players-handbook\">Backgrounds from the\nPlayer's Handbook<\/h3>\n<p>These are the sixteen backgrounds of the 2024 <em>Player's\nHandbook<\/em>. Their abilities, skills, tools and equipment are as\nwritten there, and are repeated below, except that none of them gives an\nOrigin feat. Each gains a connection to Vvardenfell instead.<\/p>\n<div class=\"tw\"><table><thead><tr><th>Background<\/th><th>Abilities<\/th><th>Skills<\/th><th>Tool<\/th><\/tr><\/thead><tbody><tr><td class=\"first\">Acolyte<\/td><td>Int, Wis, Cha<\/td><td>Insight, Religion<\/td><td>Calligrapher's Supplies<\/td><\/tr><tr><td class=\"first\">Artisan<\/td><td>Str, Dex, Int<\/td><td>Investigation, Persuasion<\/td><td>One type of Artisan's Tools<\/td><\/tr><tr><td class=\"first\">Charlatan<\/td><td>Dex, Con, Cha<\/td><td>Deception, Sleight of Hand<\/td><td>Forgery Kit<\/td><\/tr><tr><td class=\"first\">Criminal<\/td><td>Dex, Con, Int<\/td><td>Sleight of Hand, Stealth<\/td><td>Thieves' Tools<\/td><\/tr><tr><td class=\"first\">Entertainer<\/td><td>Str, Dex, Cha<\/td><td>Acrobatics, Performance<\/td><td>One musical instrument<\/td><\/tr><tr><td class=\"first\">Farmer<\/td><td>Str, Con, Wis<\/td><td>Animal Handling, Nature<\/td><td>Carpenter's Tools<\/td><\/tr><tr><td class=\"first\">Guard<\/td><td>Str, Int, Wis<\/td><td>Athletics, Perception<\/td><td>One gaming set<\/td><\/tr><tr><td class=\"first\">Guide<\/td><td>Dex, Con, Wis<\/td><td>Stealth, Survival<\/td><td>Cartographer's Tools<\/td><\/tr><tr><td class=\"first\">Hermit<\/td><td>Con, Wis, Cha<\/td><td>Medicine, Religion<\/td><td>Herbalism Kit<\/td><\/tr><tr><td class=\"first\">Merchant<\/td><td>Con, Int, Cha<\/td><td>Animal Handling, Persuasion<\/td><td>Navigator's Tools<\/td><\/tr><tr><td class=\"first\">Noble<\/td><td>Str, Int, Cha<\/td><td>History, Persuasion<\/td><td>One gaming set<\/td><\/tr><tr><td class=\"first\">Sage<\/td><td>Con, Int, Wis<\/td><td>Arcana, History<\/td><td>Calligrapher's Supplies<\/td><\/tr><tr><td class=\"first\">Sailor<\/td><td>Str, Dex, Wis<\/td><td>Acrobatics, Perception<\/td><td>Navigator's Tools<\/td><\/tr><tr><td class=\"first\">Scribe<\/td><td>Dex, Int, Wis<\/td><td>Investigation, Perception<\/td><td>Calligrapher's Supplies<\/td><\/tr><tr><td class=\"first\">Soldier<\/td><td>Str, Dex, Con<\/td><td>Athletics, Intimidation<\/td><td>One gaming set<\/td><\/tr><tr><td class=\"first\">Wayfarer<\/td><td>Dex, Wis, Cha<\/td><td>Insight, Stealth<\/td><td>Thieves' Tools<\/td><\/tr><\/tbody><\/table><\/div>\n<h4 id=\"guide-backgrounds-of-tamriel--acolyte\">Acolyte<\/h4>\n<p>You served a temple: a Tribunal shrine on the mainland, an Imperial\nCult chapel in Cyrodiil, or something less respectable.<\/p>\n<ul>\n<li>\n<p><strong>Equipment.<\/strong> Calligrapher's Supplies, a book of\nprayers, a holy symbol, 10 sheets of parchment, a robe and 8 gp; or 50\ngp.<\/p>\n<\/li>\n<li>\n<p><strong>Connection.<\/strong> The priests of your faith on Vvardenfell\nwill shelter you for a night and carry a message for you, as they would\nanywhere.<\/p>\n<\/li>\n<\/ul>\n<h4 id=\"guide-backgrounds-of-tamriel--artisan\">Artisan<\/h4>\n<p>You learned a trade, such as bonemold armour, Hlaalu silks,\nnetch-leather or Imperial glasswork.<\/p>\n<ul>\n<li>\n<p><strong>Equipment.<\/strong> The Artisan's Tools you chose, 2 pouches,\nTraveller's Clothes and 32 gp; or 50 gp.<\/p>\n<\/li>\n<li>\n<p><strong>Connection.<\/strong> Your old master wrote you a letter of\nintroduction to a fellow craftsman in Vivec, Balmora or Ebonheart.<\/p>\n<\/li>\n<\/ul>\n<h4 id=\"guide-backgrounds-of-tamriel--charlatan\">Charlatan<\/h4>\n<p>You've sold fake relics to pilgrims and painted stones to the\ngullible as soul gems.<\/p>\n<ul>\n<li>\n<p><strong>Equipment.<\/strong> A Forgery Kit, a costume, Fine Clothes\nand 15 gp; or 50 gp.<\/p>\n<\/li>\n<li>\n<p><strong>Connection.<\/strong> An old partner gave you the name of a\nforger in Vivec's Foreign Quarter, and told you to mention theirs.<\/p>\n<\/li>\n<\/ul>\n<h4 id=\"guide-backgrounds-of-tamriel--criminal\">Criminal<\/h4>\n<p>You've worked for a thieves' guild, the Camonna Tong on the mainland,\nor against both.<\/p>\n<ul>\n<li>\n<p><strong>Equipment.<\/strong> 2 daggers, Thieves' Tools, a crowbar, 2\npouches, Traveller's Clothes and 16 gp; or 50 gp.<\/p>\n<\/li>\n<li>\n<p><strong>Connection.<\/strong> Your old crew gave you the name of a\nfence on Vvardenfell, and of one thief there who owes them a favour.<\/p>\n<\/li>\n<\/ul>\n<h4 id=\"guide-backgrounds-of-tamriel--entertainer\">Entertainer<\/h4>\n<p>You've tumbled, sung or told stories in taverns and on street corners\nacross the Empire.<\/p>\n<ul>\n<li>\n<p><strong>Equipment.<\/strong> The musical instrument you chose, 2\ncostumes, a mirror, perfume, Traveller's Clothes and 11 gp; or 50\ngp.<\/p>\n<\/li>\n<li>\n<p><strong>Connection.<\/strong> A travelling troupe you once worked with\nis touring Vvardenfell, and will put you on the bill.<\/p>\n<\/li>\n<\/ul>\n<h4 id=\"guide-backgrounds-of-tamriel--farmer\">Farmer<\/h4>\n<p>You've worked saltrice paddies, herded guar or tended a kwama egg\nmine on the mainland.<\/p>\n<ul>\n<li>\n<p><strong>Equipment.<\/strong> A sickle, Carpenter's Tools, a healer's\nkit, an iron pot, a shovel, Traveller's Clothes and 30 gp; or 50 gp.<\/p>\n<\/li>\n<li>\n<p><strong>Connection.<\/strong> Farmers are the same everywhere: those\nalong Vvardenfell's roads will feed someone who talks like one of them,\nand tell you what's been prowling at night.<\/p>\n<\/li>\n<\/ul>\n<h4 id=\"guide-backgrounds-of-tamriel--guard\">Guard<\/h4>\n<p>You've stood watch for the Legion, a Great House or a merchant's\ncaravan.<\/p>\n<ul>\n<li>\n<p><strong>Equipment.<\/strong> A spear, a light crossbow, 20 bolts, the\ngaming set you chose, a hooded lantern, manacles, a quiver, Traveller's\nClothes and 12 gp; or 50 gp.<\/p>\n<\/li>\n<li>\n<p><strong>Connection.<\/strong> You carry a letter of recommendation\nfrom your old captain to a guard captain on Vvardenfell.<\/p>\n<\/li>\n<\/ul>\n<h4 id=\"guide-backgrounds-of-tamriel--guide\">Guide<\/h4>\n<p>You've led travellers through the swamps, hills and ash of mainland\nMorrowind, or the wilds of another province.<\/p>\n<ul>\n<li>\n<p><strong>Equipment.<\/strong> A shortbow, 20 arrows, Cartographer's\nTools, a bedroll, a quiver, a tent, Traveller's Clothes and 3 gp; or 50\ngp.<\/p>\n<\/li>\n<li>\n<p><strong>Connection.<\/strong> A guide on Vvardenfell will trade you\nlocal knowledge for news of the roads you know.<\/p>\n<\/li>\n<\/ul>\n<h4 id=\"guide-backgrounds-of-tamriel--hermit\">Hermit<\/h4>\n<p>You lived apart, in a hut on a lonely coast, a cave in the hills or\nthe shadow of a wizard's tower.<\/p>\n<ul>\n<li>\n<p><strong>Equipment.<\/strong> A quarterstaff, an Herbalism Kit, a\nbedroll, a book of philosophy, a lamp, 3 flasks of oil, Traveller's\nClothes and 16 gp; or 50 gp.<\/p>\n<\/li>\n<li>\n<p><strong>Connection.<\/strong> An Ashlander wise woman you met in the\nwilds told you to seek out her sister, who lives with a tribe on\nVvardenfell.<\/p>\n<\/li>\n<\/ul>\n<h4 id=\"guide-backgrounds-of-tamriel--merchant\">Merchant<\/h4>\n<p>You've bought and sold for a Hlaalu trading house, the East Empire\nCompany or yourself.<\/p>\n<ul>\n<li>\n<p><strong>Equipment.<\/strong> Navigator's Tools, 2 pouches, Traveller's\nClothes and 22 gp; or 50 gp.<\/p>\n<\/li>\n<li>\n<p><strong>Connection.<\/strong> Your house or company has a factor on\nVvardenfell who'll share the gossip about prices with you, and who's\nbeen buying what.<\/p>\n<\/li>\n<\/ul>\n<h4 id=\"guide-backgrounds-of-tamriel--noble\">Noble<\/h4>\n<p>You come from a minor house of Cyrodiil, a Hlaalu family on the rise\nor an old Redoran line from the mainland.<\/p>\n<ul>\n<li>\n<p><strong>Equipment.<\/strong> The gaming set you chose, Fine Clothes,\nperfume and 29 gp; or 50 gp.<\/p>\n<\/li>\n<li>\n<p><strong>Connection.<\/strong> One Great House councillor or Imperial\nofficial on Vvardenfell knows your family, for better or worse.<\/p>\n<\/li>\n<\/ul>\n<h4 id=\"guide-backgrounds-of-tamriel--sage\">Sage<\/h4>\n<p>You've studied in the Imperial Library, a Mages Guild hall or a\nTelvanni archive on the mainland.<\/p>\n<ul>\n<li>\n<p><strong>Equipment.<\/strong> A quarterstaff, Calligrapher's Supplies,\na book of history, 8 sheets of parchment, a robe and 8 gp; or 50 gp.<\/p>\n<\/li>\n<li>\n<p><strong>Connection.<\/strong> A scholar in Vivec or Balmora has\nwritten to you for years, and answers your questions, slowly.<\/p>\n<\/li>\n<\/ul>\n<h4 id=\"guide-backgrounds-of-tamriel--sailor\">Sailor<\/h4>\n<p>You've crewed Company ships, fishing boats or coastal ferries around\nTamriel.<\/p>\n<ul>\n<li>\n<p><strong>Equipment.<\/strong> A dagger, Navigator's Tools, a rope,\nTraveller's Clothes and 20 gp; or 50 gp.<\/p>\n<\/li>\n<li>\n<p><strong>Connection.<\/strong> The captains of the Inner Sea know your\nold ship by name, and you know which of them carry passengers without\nasking questions.<\/p>\n<\/li>\n<\/ul>\n<h4 id=\"guide-backgrounds-of-tamriel--scribe\">Scribe<\/h4>\n<p>You've copied scripture for the Temple, records for a Great House or\nforms for the Empire.<\/p>\n<ul>\n<li>\n<p><strong>Equipment.<\/strong> Calligrapher's Supplies, Fine Clothes, a\nlamp, 3 flasks of oil, 12 sheets of parchment and 23 gp; or 50 gp.<\/p>\n<\/li>\n<li>\n<p><strong>Connection.<\/strong> You know how Imperial paperwork works,\nand the name of a clerk in Vvardenfell's Census and Excise Office who\nowes your old office a favour.<\/p>\n<\/li>\n<\/ul>\n<h4 id=\"guide-backgrounds-of-tamriel--soldier\">Soldier<\/h4>\n<p>You've served in the Imperial Legion, a Great House's army or a\nmercenary company.<\/p>\n<ul>\n<li>\n<p><strong>Equipment.<\/strong> A spear, a shortbow, 20 arrows, the\ngaming set you chose, a healer's kit, a quiver, Traveller's Clothes and\n14 gp; or 50 gp.<\/p>\n<\/li>\n<li>\n<p><strong>Connection.<\/strong> In any Legion fort, Vvardenfell's\nincluded, you can find someone who served where you did.<\/p>\n<\/li>\n<\/ul>\n<h4 id=\"guide-backgrounds-of-tamriel--wayfarer\">Wayfarer<\/h4>\n<p>You grew up on the streets of Mournhold, the Imperial City or another\ncrowded city.<\/p>\n<ul>\n<li>\n<p><strong>Equipment.<\/strong> 2 daggers, Thieves' Tools, a gaming set\nof your choice, a bedroll, 2 pouches, Traveller's Clothes and 16 gp; or\n50 gp.<\/p>\n<\/li>\n<li>\n<p><strong>Connection.<\/strong> Street children are the same everywhere.\nOn Vvardenfell, they'll tell you what they've seen for a few coins, once\nthey see you know the game.<\/p>\n<\/li>\n<\/ul>\n<h3 id=\"guide-backgrounds-of-tamriel--backgrounds-of-morrowind\">Backgrounds of Morrowind<\/h3>\n<p>These backgrounds are new to this campaign. They work like any other,\nand each comes with its own equipment. Like every background here, they\ntook place off the island. Prices for the armourer's hammers, the mortar\nand pestle and the miner's pick are in <em>Treasures of\nMorrowind<\/em>.<\/p>\n<div class=\"tw\"><table><thead><tr><th>Background<\/th><th>Abilities<\/th><th>Skills<\/th><th>Tool<\/th><\/tr><\/thead><tbody><tr><td class=\"first\">Ashlander Exile<\/td><td>Str, Dex, Wis<\/td><td>Animal Handling, Survival<\/td><td>Leatherworker's Tools<\/td><\/tr><tr><td class=\"first\">Company Clerk<\/td><td>Int, Wis, Cha<\/td><td>Insight, Investigation<\/td><td>Calligrapher's Supplies<\/td><\/tr><tr><td class=\"first\">Ebony Miner<\/td><td>Str, Con, Wis<\/td><td>Athletics, Perception<\/td><td>Smith's Tools<\/td><\/tr><tr><td class=\"first\">Fighters Guild Journeyman<\/td><td>Str, Dex, Con<\/td><td>Athletics, Survival<\/td><td>Smith's Tools<\/td><\/tr><tr><td class=\"first\">Freed Slave<\/td><td>Str, Dex, Con<\/td><td>Athletics, Stealth<\/td><td>One type of Artisan's Tools<\/td><\/tr><tr><td class=\"first\">Mages Guild Associate<\/td><td>Int, Wis, Con<\/td><td>Arcana, Investigation<\/td><td>Alchemist's Supplies<\/td><\/tr><tr><td class=\"first\">Nord Skald<\/td><td>Str, Int, Cha<\/td><td>History, Performance<\/td><td>One musical instrument<\/td><\/tr><tr><td class=\"first\">Pilgrim<\/td><td>Con, Wis, Cha<\/td><td>Religion, Survival<\/td><td>Herbalism Kit<\/td><\/tr><tr><td class=\"first\">Silt Strider Caravaner<\/td><td>Con, Wis, Cha<\/td><td>Animal Handling, Persuasion<\/td><td>Cartographer's Tools<\/td><\/tr><tr><td class=\"first\">Smuggler<\/td><td>Str, Dex, Cha<\/td><td>Athletics, Deception<\/td><td>Navigator's Tools<\/td><\/tr><\/tbody><\/table><\/div>\n<h4 id=\"guide-backgrounds-of-tamriel--ashlander-exile\">Ashlander Exile<\/h4>\n<p>You left one of the Ashlander tribes that still wander the wild\ncountry of mainland Morrowind, or they made you leave. All your life\nyou've heard of the great tribes of Vvardenfell, who live in the shadow\nof Red Mountain.<\/p>\n<ul>\n<li>\n<p><strong>Equipment.<\/strong> Leatherworker's Tools, a spear,\nTraveller's Clothes, a bedroll, a tinderbox, a pouch and 40 gp; or 50\ngp.<\/p>\n<\/li>\n<li>\n<p><strong>Connection.<\/strong> Ashlanders share their customs across\nthe water. The four great tribes of Vvardenfell, the Urshilaku, the\nAhemmusa, the Zainab and the Erabenimsun, will hear you out as kin, if\nwarily.<\/p>\n<\/li>\n<\/ul>\n<h4 id=\"guide-backgrounds-of-tamriel--company-clerk\">Company Clerk<\/h4>\n<p>You've kept the East Empire Company's ledgers in a mainland port, and\nyou've seen how creative the Vvardenfell accounts get on paper.<\/p>\n<ul>\n<li>\n<p><strong>Equipment.<\/strong> Calligrapher's Supplies, a blank ledger\n(a book), Traveller's Clothes and 13 gp; or 50 gp.<\/p>\n<\/li>\n<li>\n<p><strong>Connection.<\/strong> Your name is on the Company's books, so\nits clerks in Ebonheart will treat you as one of their own, and show you\na manifest if you ask nicely.<\/p>\n<\/li>\n<\/ul>\n<h4 id=\"guide-backgrounds-of-tamriel--ebony-miner\">Ebony Miner<\/h4>\n<p>You've swung a pick in the ebony mines of mainland Morrowind or\nSkyrim, and learned to smelt and work what you dug out. Every miner\nyou've met talks about Vvardenfell's mines, the richest in Tamriel.<\/p>\n<ul>\n<li>\n<p><strong>Equipment.<\/strong> A miner's pick, an Apprentice's\narmourer's hammer, a hooded lantern, Traveller's Clothes and 36 gp; or\n50 gp.<\/p>\n<\/li>\n<li>\n<p><strong>Connection.<\/strong> You know the trade: which mine-owners\nare honest, who buys raw ore without asking questions, and the names of\nthe Vvardenfell mines every miner talks about.<\/p>\n<\/li>\n<\/ul>\n<h4 id=\"guide-backgrounds-of-tamriel--fighters-guild-journeyman\">Fighters Guild Journeyman<\/h4>\n<p>You've taken the Guild's contracts on the mainland: rats, bandits and\nthe occasional thing in a cave. You've learned to keep your own gear in\none piece.<\/p>\n<ul>\n<li>\n<p><strong>Equipment.<\/strong> A Journeyman's armourer's hammer, a\nhealer's kit, Traveller's Clothes, a bedroll, a rope and 26 gp; or 50\ngp.<\/p>\n<\/li>\n<li>\n<p><strong>Connection.<\/strong> Your Guild writ is good in any hall,\nEbonheart's included. They'll give you a bunk for the night and tell you\nwhich contracts pay.<\/p>\n<\/li>\n<\/ul>\n<h4 id=\"guide-backgrounds-of-tamriel--freed-slave\">Freed Slave<\/h4>\n<p>You were owned in Morrowind, perhaps bought in the slave markets of\nTear, and now you aren't. You kept the trade they forced on you, and\nnothing else. Most freed slaves are Argonians or Khajiit, and wise ones\ncarry papers that prove their freedom.<\/p>\n<ul>\n<li>\n<p><strong>Equipment.<\/strong> The Artisan's Tools you chose,\nTraveller's Clothes, a pouch and 32 gp; or 50 gp.<\/p>\n<\/li>\n<li>\n<p><strong>Connection.<\/strong> The Twin Lamps, the secret network that\nsmuggles slaves to freedom, helped you once. You know one of their\nsigns, and that they're at work on Vvardenfell too.<\/p>\n<\/li>\n<\/ul>\n<h4 id=\"guide-backgrounds-of-tamriel--mages-guild-associate\">Mages Guild Associate<\/h4>\n<p>You've studied at a Guild hall on the mainland or in Cyrodiil, mostly\nthe alchemy, which pays.<\/p>\n<ul>\n<li>\n<p><strong>Equipment.<\/strong> An Apprentice's mortar and pestle, a robe\nand 24 gp; or 50 gp.<\/p>\n<\/li>\n<li>\n<p><strong>Connection.<\/strong> Your mentor wrote you a letter of\nintroduction to the Guild on Vvardenfell, and any Guild hall will let\nyou use its library.<\/p>\n<\/li>\n<\/ul>\n<h4 id=\"guide-backgrounds-of-tamriel--nord-skald\">Nord Skald<\/h4>\n<p>You keep the sagas of your people, and you're making new ones whether\nanyone asked or not.<\/p>\n<ul>\n<li>\n<p><strong>Equipment.<\/strong> A drum, a book of sagas, Traveller's\nClothes and 17 gp; or 50 gp.<\/p>\n<\/li>\n<li>\n<p><strong>Connection.<\/strong> Nords everywhere know the old sagas you\nsing, and any Nord on the island will buy you a mead for a new one.<\/p>\n<\/li>\n<\/ul>\n<h4 id=\"guide-backgrounds-of-tamriel--pilgrim\">Pilgrim<\/h4>\n<p>You've served at Temple shrines on the mainland, and now you're\nmaking the pilgrimage you've dreamed of: the Seven Graces, whose shrines\nare all on Vvardenfell.<\/p>\n<ul>\n<li>\n<p><strong>Equipment.<\/strong> An Herbalism Kit, a Temple holy symbol, a\nrobe, a bedroll, a map of the shrines and 37 gp; or 50 gp.<\/p>\n<\/li>\n<li>\n<p><strong>Connection.<\/strong> Temple priests and shrine-keepers will\ngive a pilgrim a meal and a mat for the night, and remember your\nface.<\/p>\n<\/li>\n<\/ul>\n<h4 id=\"guide-backgrounds-of-tamriel--silt-strider-caravaner\">Silt Strider Caravaner<\/h4>\n<p>You've steered the great silt striders between the towns of mainland\nMorrowind, and talked your passengers out of their nerves.<\/p>\n<ul>\n<li>\n<p><strong>Equipment.<\/strong> Cartographer's Tools, Traveller's\nClothes, a rope, a bedroll and 31 gp; or 50 gp.<\/p>\n<\/li>\n<li>\n<p><strong>Connection.<\/strong> Caravaners are a close trade. The\nstrider ports on Vvardenfell will treat you as one of their own, and\ntell you who's been travelling where.<\/p>\n<\/li>\n<\/ul>\n<h4 id=\"guide-backgrounds-of-tamriel--smuggler\">Smuggler<\/h4>\n<p>You've rowed contraband into coves on the mainland where the Legion\ndoesn't look.<\/p>\n<ul>\n<li>\n<p><strong>Equipment.<\/strong> Navigator's Tools, a hooded lantern for\nsignalling, Traveller's Clothes, a rope and 17 gp; or 50 gp.<\/p>\n<\/li>\n<li>\n<p><strong>Connection.<\/strong> You know the signals smugglers use\naround the Inner Sea, and the Bitter Coast's crews know your old one by\nreputation.<\/p>\n<\/li>\n<\/ul>\n"},{"id":"guide-birthsigns-of-tamriel","t":"Step Four: Birthsigns of Tamriel","s":[{"id":"guide-birthsigns-of-tamriel--born-under-a-sign","t":"Born Under a Sign","l":2},{"id":"guide-birthsigns-of-tamriel--at-a-glance","t":"At a Glance","l":2},{"id":"guide-birthsigns-of-tamriel--the-guardians","t":"The Guardians","l":2},{"id":"guide-birthsigns-of-tamriel--the-warrior","t":"The Warrior","l":3},{"id":"guide-birthsigns-of-tamriel--the-mage","t":"The Mage","l":3},{"id":"guide-birthsigns-of-tamriel--the-thief","t":"The Thief","l":3},{"id":"guide-birthsigns-of-tamriel--the-warriors-charges","t":"The Warrior's Charges","l":2},{"id":"guide-birthsigns-of-tamriel--the-lady","t":"The Lady","l":3},{"id":"guide-birthsigns-of-tamriel--the-steed","t":"The Steed","l":3},{"id":"guide-birthsigns-of-tamriel--the-lord","t":"The Lord","l":3},{"id":"guide-birthsigns-of-tamriel--the-mages-charges","t":"The Mage's Charges","l":2},{"id":"guide-birthsigns-of-tamriel--the-apprentice","t":"The Apprentice","l":3},{"id":"guide-birthsigns-of-tamriel--the-atronach","t":"The Atronach","l":3},{"id":"guide-birthsigns-of-tamriel--the-ritual","t":"The Ritual","l":3},{"id":"guide-birthsigns-of-tamriel--the-thiefs-charges","t":"The Thief's Charges","l":2},{"id":"guide-birthsigns-of-tamriel--the-lover","t":"The Lover","l":3},{"id":"guide-birthsigns-of-tamriel--the-shadow","t":"The Shadow","l":3},{"id":"guide-birthsigns-of-tamriel--the-tower","t":"The Tower","l":3},{"id":"guide-birthsigns-of-tamriel--the-serpent","t":"The Serpent","l":2}],"p":"Making Your Character","h":"\n\n<div class=\"epigraph\">\n<p><em>“You do not choose your stars. You only choose whether to listen\nto them.”<\/em><\/p>\n<\/div>\n<div class=\"attribution\">\n<p>— A Mages Guild astrologer, Balmora<\/p>\n<\/div>\n<h3 id=\"guide-birthsigns-of-tamriel--born-under-a-sign\">Born Under a Sign<\/h3>\n<p class=\"dropcap\">Every person in Tamriel is born under one of\nthirteen constellations, and the sign leaves its mark. In this campaign,\nyour birthsign takes the place of the Origin feat you would normally\ngain at level 1.<\/p>\n<p><strong>The constellations.<\/strong> Three signs are the Guardians:\nthe Warrior, the Mage and the Thief. Each Guardian watches over three\ncharges, and each of the twelve rules one month of the year. The\nthirteenth, the Serpent, wanders the sky, has no month and answers to no\nGuardian.<\/p>\n<p><strong>Character creation rules<\/strong><\/p>\n<ul>\n<li>\n<p><strong>Choose one birthsign at level 1.<\/strong> It gives you the\nbenefits listed in its entry.<\/p>\n<\/li>\n<li>\n<p><strong>Backgrounds don't give an Origin feat.<\/strong> Take\neverything else from your background as normal. Your background and\nbirthsign are separate choices; pick any combination.<\/p>\n<\/li>\n<li>\n<p><strong>Origin feats aren't gone.<\/strong> You can still take one\nlater, using the Ability Score Improvement feature.<\/p>\n<\/li>\n<li>\n<p><strong>Spellcasting ability.<\/strong> When you choose your\nbirthsign, pick Intelligence, Wisdom or Charisma as its spellcasting\nability.<\/p>\n<\/li>\n<li>\n<p><strong>Birthsign save DC<\/strong> = 8 + your Proficiency Bonus + the\nmodifier of your birthsign's spellcasting ability.<\/p>\n<\/li>\n<li>\n<p><strong>Birthsign spells.<\/strong> When a birthsign gives you a\nspell, it is always prepared. You can cast it once without a spell slot,\nregaining that use when you finish a long rest. You can also cast it\nusing any spell slots you have.<\/p>\n<\/li>\n<\/ul>\n<p>In the setting, nobody chooses their stars. At the table, you do.<\/p>\n<h3 id=\"guide-birthsigns-of-tamriel--at-a-glance\">At a Glance<\/h3>\n<p>The signs are grouped by Guardian. Months are given with their\nnearest real-world equivalent.<\/p>\n<div class=\"tw\"><table><thead><tr><th>Sign<\/th><th>Month<\/th><th>Guardian<\/th><th>In brief<\/th><\/tr><\/thead><tbody><tr><td class=\"first\">The Warrior<\/td><td>Last Seed (August)<\/td><td>Guardian<\/td><td>Rerolls for attacks, Strength and Constitution<\/td><\/tr><tr><td class=\"first\">The Mage<\/td><td>Rain's Hand (April)<\/td><td>Guardian<\/td><td>Two cantrips; rerolls for your spells<\/td><\/tr><tr><td class=\"first\">The Thief<\/td><td>Evening Star (December)<\/td><td>Guardian<\/td><td>Luck points for Advantage or Disadvantage<\/td><\/tr><tr><td class=\"first\">The Lady<\/td><td>Heartfire (September)<\/td><td>Warrior<\/td><td>Persuasion, extra hit points and faster recovery<\/td><\/tr><tr><td class=\"first\">The Steed<\/td><td>Mid Year (June)<\/td><td>Warrior<\/td><td>Faster movement, Athletics and quick reactions<\/td><\/tr><tr><td class=\"first\">The Lord<\/td><td>First Seed (March)<\/td><td>Warrior<\/td><td>Self-healing; weakness to fire<\/td><\/tr><tr><td class=\"first\">The Apprentice<\/td><td>Sun's Height (July)<\/td><td>Mage<\/td><td>An extra spell slot; weakness to magic<\/td><\/tr><tr><td class=\"first\">The Atronach<\/td><td>Sun's Dusk (November)<\/td><td>Mage<\/td><td>Extra spell slots and spell absorption; slow recovery<\/td><\/tr><tr><td class=\"first\">The Ritual<\/td><td>Morning Star (January)<\/td><td>Mage<\/td><td>Healing and turning the undead<\/td><\/tr><tr><td class=\"first\">The Lover<\/td><td>Sun's Dawn (February)<\/td><td>Thief<\/td><td>A stunning touch and a graceful skill<\/td><\/tr><tr><td class=\"first\">The Shadow<\/td><td>Second Seed (May)<\/td><td>Thief<\/td><td>Brief invisibility<\/td><\/tr><tr><td class=\"first\">The Tower<\/td><td>Frostfall (October)<\/td><td>Thief<\/td><td>Opening locks and detecting magic<\/td><\/tr><tr><td class=\"first\">The Serpent<\/td><td>None<\/td><td>None<\/td><td>Poisonous touches that hurt you too; shrugging off ailments<\/td><\/tr><\/tbody><\/table><\/div>\n<h3 id=\"guide-birthsigns-of-tamriel--the-guardians\">The Guardians<\/h3>\n<p>The three Guardians are the strongest constellations in the sky, and\neach watches over three lesser signs.<\/p>\n<h4 id=\"guide-birthsigns-of-tamriel--the-warrior\">The Warrior<\/h4>\n<p><em>Month: Last Seed (August). Guardian of the Lady, the Steed and\nthe Lord.<\/em><\/p>\n<p>Those born under the Warrior are gifted with weapons of every kind.\nThey are also known for short tempers.<\/p>\n<p><em><strong>Warrior's Precision.<\/strong><\/em> When you miss with an\nattack roll using a weapon or an Unarmed Strike, or fail a Strength or\nConstitution check or saving throw, you can reroll the d20, and you must\nuse the new roll. You can do this a number of times equal to your\nProficiency Bonus, and you regain all uses when you finish a long\nrest.<\/p>\n<h4 id=\"guide-birthsigns-of-tamriel--the-mage\">The Mage<\/h4>\n<p><em>Month: Rain's Hand (April). Guardian of the Apprentice, the\nAtronach and the Ritual.<\/em><\/p>\n<p>Those born under the Mage have a natural talent for spells. They are\nalso known for arrogance and absent-mindedness.<\/p>\n<p><em><strong>Gift of the Mage.<\/strong><\/em> You learn two cantrips\nfrom the Wizard spell list. Whenever you gain a level, you can replace\none of them with another Wizard cantrip.<\/p>\n<p><em><strong>Mage's Mastery.<\/strong><\/em> When you miss with a spell\nattack roll, you can reroll the d20, and you must use the new roll. When\na creature succeeds on a saving throw against a spell you cast, you can\nforce it to reroll, and it must use the new roll. You can do either a\nnumber of times equal to your Proficiency Bonus, and you regain all uses\nwhen you finish a long rest.<\/p>\n<h4 id=\"guide-birthsigns-of-tamriel--the-thief\">The Thief<\/h4>\n<p><em>Month: Evening Star (December). Guardian of the Lover, the Shadow\nand the Tower.<\/em><\/p>\n<p>The Thief is the darkest of the Guardians. Those born under it are\nrarely thieves, but they take more risks than most people and are seldom\ncaught.<\/p>\n<p><em><strong>Thief's Luck.<\/strong><\/em> You have a number of Luck\nPoints equal to your Proficiency Bonus, and you regain all of them when\nyou finish a long rest. You can spend one in these ways:<\/p>\n<ul>\n<li>\n<p>When you make a Dexterity, Intelligence, Wisdom or Charisma check or\nsaving throw, you can give yourself advantage on the roll.<\/p>\n<\/li>\n<li>\n<p>When a creature makes an attack roll against you, you can spend a\nLuck Point to impose Disadvantage on that roll.<\/p>\n<\/li>\n<\/ul>\n<h3 id=\"guide-birthsigns-of-tamriel--the-warriors-charges\">The Warrior's Charges<\/h3>\n<p>The Warrior's charges are signs of strength, speed and endurance.<\/p>\n<h4 id=\"guide-birthsigns-of-tamriel--the-lady\">The Lady<\/h4>\n<p><em>Month: Heartfire (September). Charge of the Warrior.<\/em><\/p>\n<p>Those born under the Lady are kind, tolerant and hard to wear\ndown.<\/p>\n<p><em><strong>Lady's Favour.<\/strong><\/em> You have proficiency in\nPersuasion. If you already have it, choose another Charisma skill\ninstead.<\/p>\n<p><em><strong>Lady's Grace.<\/strong><\/em> Your Hit Point maximum\nincreases by 1, and it increases by 1 again each time you gain a level.\nWhenever you roll a Hit Die to regain Hit Points, you regain extra Hit\nPoints equal to your Proficiency Bonus. When you finish a short rest,\nyou remove 1 Exhaustion level.<\/p>\n<h4 id=\"guide-birthsigns-of-tamriel--the-steed\">The Steed<\/h4>\n<p><em>Month: Mid Year (June). Charge of the Warrior.<\/em><\/p>\n<p>Those born under the Steed are restless and impatient, always in a\nhurry to be somewhere else.<\/p>\n<p><em><strong>Fleet.<\/strong><\/em> You have advantage on Initiative\nrolls.<\/p>\n<p><em><strong>Steed's Stride.<\/strong><\/em> Your Speed increases by 10\nfeet.<\/p>\n<p><em><strong>Tireless.<\/strong><\/em> You have proficiency in\nAthletics. If you already have it, choose another Strength or Dexterity\nskill instead. When you take the Dash action, difficult terrain doesn't\nslow you down.<\/p>\n<h4 id=\"guide-birthsigns-of-tamriel--the-lord\">The Lord<\/h4>\n<p><em>Month: First Seed (March). Charge of the Warrior.<\/em><\/p>\n<p>Those born under the Lord are hardier and healthier than most, and\nslow to stay down. The same blood makes them burn easily.<\/p>\n<p><em><strong>Blood of the North.<\/strong><\/em> As a Bonus Action, you\ncan regain Hit Points equal to your level plus a number of d10s equal to\nhalf your Proficiency Bonus (rounded up). Once you use this trait, you\ncan't do so again until you finish a short or long rest.<\/p>\n<p><em><strong>Trollkin.<\/strong><\/em> You have Disadvantage on saving\nthrows against effects that deal Fire damage.<\/p>\n<h3 id=\"guide-birthsigns-of-tamriel--the-mages-charges\">The Mage's Charges<\/h3>\n<p>The Mage's charges are signs of power, and two of them come with a\nprice.<\/p>\n<p><strong>Extra spell slots.<\/strong> The Apprentice and the Atronach\ngive you extra spell slots. Each slot's level is half your Proficiency\nBonus, rounded up: level 1 at character levels 1–4, level 2 at levels\n5–12 and level 3 from level 13. It can't be higher than the\nhighest-level spell slot you already have. They're tracked separately\nfrom your class's spell slots.<\/p>\n<p>If you have neither the Spellcasting nor the Pact Magic feature, you\ncan still use these extra slots. For each extra slot, you gain one spell\nfrom the Wizard list (Apprentice sign) or the Sorcerer list (Atronach\nsign), of a level no higher than the slots' level. You can cast these\nspells only with the extra slots, using your Birthsign's spellcasting\nability, and the cap at your highest class slot doesn't apply. Whenever\nthe slots' level rises, you can replace one of these spells. If you gain\nthe Spellcasting or Pact Magic feature later, these spells stay with\nyou, are always prepared, and the normal rules take over.<\/p>\n<h4 id=\"guide-birthsigns-of-tamriel--the-apprentice\">The Apprentice<\/h4>\n<p><em>Month: Sun's Height (July). Charge of the Mage.<\/em><\/p>\n<p>Those born under the Apprentice have a special affinity for magic,\nand an equal vulnerability to it.<\/p>\n<p><em><strong>Apprentice's Wellspring.<\/strong><\/em> You have one extra\nspell slot, as described above. You regain it when you finish a long\nrest.<\/p>\n<p><em><strong>Arcane Frailty.<\/strong><\/em> When a spell deals damage\nto you, it deals extra damage equal to your Proficiency Bonus.<\/p>\n<h4 id=\"guide-birthsigns-of-tamriel--the-atronach\">The Atronach<\/h4>\n<p><em>Month: Sun's Dusk (November). Charge of the Mage.<\/em><\/p>\n<p>Those born under the Atronach are born spellcasters with vast\nreserves of power. They can't replenish that power naturally, so they\ndraw it from the spells cast at them.<\/p>\n<p><em><strong>Deep Reserve.<\/strong><\/em> You have two extra spell\nslots, as described above. You regain them when you finish a long rest,\nsubject to Stunted Magicka.<\/p>\n<p><em><strong>Spell Absorption.<\/strong><\/em> When you succeed on a\nsaving throw against a spell, or a spell attack roll against you misses,\nyou can take a Reaction to regain one expended spell slot. The slot's\nlevel can be no higher than half your Proficiency Bonus, rounded up.<\/p>\n<p><em><strong>Stunted Magicka.<\/strong><\/em> Whenever a short or long\nrest would restore all your expended spell slots, you instead regain\nonly half of them, rounded up. You choose which ones.<\/p>\n<h4 id=\"guide-birthsigns-of-tamriel--the-ritual\">The Ritual<\/h4>\n<p><em>Month: Morning Star (January). Charge of the Mage.<\/em><\/p>\n<p>Those born under the Ritual carry a spark of divine blessing. They\ncan heal the living and drive back the dead.<\/p>\n<p><em><strong>Mara's Gift.<\/strong><\/em> You learn <em>Cure\nWounds<\/em>. When you cast it without a spell slot, you cast it at a\nspell level equal to half your Proficiency Bonus, rounded up. Once you\nuse this trait, you can't do so again until you finish a long rest.<\/p>\n<p><em><strong>Blessed Word.<\/strong><\/em> As a Magic action, you can\ncall on the Divines. Each Undead within 30 feet of you that can see or\nhear you must make a Wisdom saving throw against your birthsign save DC.\nOn a failure, it has the Frightened condition for 1 minute; it repeats\nthe save at the end of each of its turns, ending the effect on a\nsuccess. Once you use this trait, you can't do so again until you finish\na long rest.<\/p>\n<h3 id=\"guide-birthsigns-of-tamriel--the-thiefs-charges\">The Thief's Charges<\/h3>\n<p>The Thief's charges are signs of grace, stealth and opportunity.<\/p>\n<h4 id=\"guide-birthsigns-of-tamriel--the-lover\">The Lover<\/h4>\n<p><em>Month: Sun's Dawn (February). Charge of the Thief.<\/em><\/p>\n<p>Those born under the Lover are graceful and passionate. Their touch\ncan stop a person in their tracks, at some cost to themselves.<\/p>\n<p><em><strong>Lover's Kiss.<\/strong><\/em> As a Magic action, you can\ntouch a creature within reach. It must make a Wisdom saving throw\nagainst your birthsign save DC. On a failure, it has the Incapacitated\ncondition and its Speed is 0 until the end of its next turn. Afterward,\nyou have Disadvantage on attack rolls until the end of your next turn.\nOnce you use this trait, you can't do so again until you finish a long\nrest.<\/p>\n<p><em><strong>Lover's Grace.<\/strong><\/em> You have proficiency in your\nchoice of Acrobatics or Performance.<\/p>\n<h4 id=\"guide-birthsigns-of-tamriel--the-shadow\">The Shadow<\/h4>\n<p><em>Month: Second Seed (May). Charge of the Thief.<\/em><\/p>\n<p>Those born under the Shadow can hide in plain sight, wrapping\nthemselves in darkness when they need to.<\/p>\n<p><em><strong>Moonshadow.<\/strong><\/em> As a Bonus Action, you can give\nyourself the Invisible condition until the end of your next turn. It\nends early if you make an attack roll, deal damage or cast a spell. Once\nyou use this trait, you can't do so again until you finish a short or\nlong rest.<\/p>\n<h4 id=\"guide-birthsigns-of-tamriel--the-tower\">The Tower<\/h4>\n<p><em>Month: Frostfall (October). Charge of the Thief.<\/em><\/p>\n<p>Those born under the Tower have a nose for gold and a way with locks.\nFew doors stay closed to them.<\/p>\n<p><em><strong>Tower Key.<\/strong><\/em> You have proficiency with\nThieves' Tools. You also learn <em>Knock<\/em>; when you cast it using\nthis trait, it makes no sound.<\/p>\n<p><em><strong>Beggar's Nose.<\/strong><\/em> You learn <em>Detect\nMagic<\/em>.<\/p>\n<h3 id=\"guide-birthsigns-of-tamriel--the-serpent\">The Serpent<\/h3>\n<p><em>Month: none. Guardian: none.<\/em><\/p>\n<p>The Serpent wanders the sky with no season and no master. Those born\nunder it are said to be both the most blessed and the most cursed of\nall. Its gift is poison, and it never comes free.<\/p>\n<p><em><strong>Star-Curse.<\/strong><\/em> As a Magic action, you can\ntouch a creature within reach. It must make a Constitution saving throw\nagainst your birthsign save DC. On a failure, it takes 3d6 Poison damage\nand has the Poisoned condition for 1 minute; it repeats the save at the\nend of each of its turns, ending the condition on a success. On a\nsuccess, it takes half as much damage and isn't Poisoned. This damage\nignores Resistance to Poison damage. You can use this trait a number of\ntimes equal to your Proficiency Bonus, and you regain all expended uses\nwhen you finish a long rest.<\/p>\n<p>The damage increases by 1d6 when you reach levels 5 (4d6), 11 (5d6)\nand 17 (6d6).<\/p>\n<p><em><strong>Shed Skin.<\/strong><\/em> As a Bonus Action, you can end\nthe Poisoned condition on yourself, along with one of these: the Charmed\ncondition, the Frightened condition, or one spell of level 3 or lower\nthat's affecting you. Once you use this trait, you can't do so again\nuntil you finish a long rest.<\/p>\n<p><em><strong>Serpent's Price.<\/strong><\/em> When you use Star-Curse,\nyou take Poison damage equal to your Proficiency Bonus. This damage\ncan't be reduced or prevented in any way.<\/p>\n"},{"id":"guide-ability-scores","t":"Step Five: Ability Scores","s":[{"id":"guide-ability-scores--your-six-scores","t":"Your Six Scores","l":2},{"id":"guide-ability-scores--point-buy-costs","t":"Point Buy Costs","l":3},{"id":"guide-ability-scores--putting-them-in-place","t":"Putting Them in Place","l":2}],"p":"Making Your Character","sub":"Choose a Method","h":"\n\n\n<div class=\"epigraph\">\n<p><em>“Some are born strong, some clever and some lucky. The lucky ones\nlive longest.”<\/em><\/p>\n<\/div>\n<div class=\"attribution\">\n<p>— A Khajiit dice-player, Ebonheart docks<\/p>\n<\/div>\n<h3 id=\"guide-ability-scores--your-six-scores\">Your Six Scores<\/h3>\n<p class=\"dropcap\">Each player chooses their own way to make their\nability scores. Pick one of the three methods below, put the numbers\nwhere you want them, then raise them with your background.<\/p>\n<div class=\"tw\"><table><thead><tr><th>Method<\/th><th>How it works<\/th><th>Best for<\/th><\/tr><\/thead><tbody><tr><td class=\"first\">Standard array<\/td><td>Use these six numbers: 15, 14, 13, 12, 10 and 8.<\/td><td>A quick, balanced character<\/td><\/tr><tr><td class=\"first\">Point buy<\/td><td>Every score starts at 8. Spend 27 points to raise them, using the costs below. No score can go above 15 this way.<\/td><td>Building exactly the character you want<\/td><\/tr><tr><td class=\"first\">Dice<\/td><td>Roll four six-sided dice and add up the highest three. Do it six times.<\/td><td>Taking your chances<\/td><\/tr><\/tbody><\/table><\/div>\n<h4 id=\"guide-ability-scores--point-buy-costs\">Point Buy Costs<\/h4>\n<div class=\"tw\"><table><thead><tr><th>Score<\/th><th>8<\/th><th>9<\/th><th>10<\/th><th>11<\/th><th>12<\/th><th>13<\/th><th>14<\/th><th>15<\/th><\/tr><\/thead><tbody><tr><td class=\"first\">Cost<\/td><td>0<\/td><td>1<\/td><td>2<\/td><td>3<\/td><td>4<\/td><td>5<\/td><td>7<\/td><td>9<\/td><\/tr><\/tbody><\/table><\/div>\n<h3 id=\"guide-ability-scores--putting-them-in-place\">Putting Them in Place<\/h3>\n<ul>\n<li>\n<p><strong>Assign your numbers.<\/strong> Put one number in each of your\nsix abilities: Strength, Dexterity, Constitution, Intelligence, Wisdom\nand Charisma. Give one of your highest to your class's primary ability,\nshown below.<\/p>\n<\/li>\n<li>\n<p><strong>Raise them with your background.<\/strong> Your background\nlists three abilities. Increase one of them by 2 and another by 1, or\nincrease all three by 1. None can go above 20.<\/p>\n<\/li>\n<li>\n<p><strong>Work out your modifiers.<\/strong> Each score gives a\nmodifier, shown below, which you add to nearly every roll that uses that\nability.<\/p>\n<\/li>\n<\/ul>\n<div class=\"tw\"><table><thead><tr><th>Class<\/th><th>Primary ability<\/th><\/tr><\/thead><tbody><tr><td>Barbarian<\/td><td>Strength<\/td><\/tr><tr><td>Bard<\/td><td>Charisma<\/td><\/tr><tr><td>Cleric<\/td><td>Wisdom<\/td><\/tr><tr><td>Druid<\/td><td>Wisdom<\/td><\/tr><tr><td>Fighter<\/td><td>Strength or Dexterity<\/td><\/tr><tr><td>Monk<\/td><td>Dexterity and Wisdom<\/td><\/tr><tr><td>Paladin<\/td><td>Strength and Charisma<\/td><\/tr><tr><td>Ranger<\/td><td>Dexterity and Wisdom<\/td><\/tr><tr><td>Rogue<\/td><td>Dexterity<\/td><\/tr><tr><td>Sorcerer<\/td><td>Charisma<\/td><\/tr><tr><td>Warlock<\/td><td>Charisma<\/td><\/tr><tr><td>Wizard<\/td><td>Intelligence<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"tw\"><table><thead><tr><th>Score<\/th><th>3<\/th><th>4–5<\/th><th>6–7<\/th><th>8–9<\/th><th>10–11<\/th><th>12–13<\/th><th>14–15<\/th><th>16–17<\/th><th>18–19<\/th><th>20<\/th><\/tr><\/thead><tbody><tr><td class=\"first\">Modifier<\/td><td>−4<\/td><td>−3<\/td><td>−2<\/td><td>−1<\/td><td>+0<\/td><td>+1<\/td><td>+2<\/td><td>+3<\/td><td>+4<\/td><td>+5<\/td><\/tr><\/tbody><\/table><\/div>\n"},{"id":"guide-your-faith","t":"Step Six: Your Faith","s":[{"id":"guide-your-faith--who-needs-a-god","t":"Who Needs a God","l":2},{"id":"guide-your-faith--faith-in-morrowind","t":"Faith in Morrowind","l":2},{"id":"guide-your-faith--three-paths-of-power","t":"Three Paths of Power","l":2},{"id":"guide-your-faith--choosing-a-god-or-patron","t":"Choosing a God or Patron","l":2},{"id":"guide-your-faith--quick-reference","t":"Quick Reference","l":2},{"id":"guide-your-faith--the-nine-divines-and-fringe-aedra","t":"The Nine Divines and Fringe Aedra","l":3},{"id":"guide-your-faith--the-tribunal-and-the-sixth-house","t":"The Tribunal and the Sixth House","l":3},{"id":"guide-your-faith--the-good-daedra-and-the-house-of-troubles","t":"The Good Daedra and the House of Troubles","l":3},{"id":"guide-your-faith--the-other-princes","t":"The Other Princes","l":3}],"p":"Making Your Character","sub":"Choosing a God or Patron","h":"\n\n\n<div class=\"epigraph\">\n<p><em>“In Morrowind, the gods answer. That is rather the\nproblem.”<\/em><\/p>\n<\/div>\n<div class=\"attribution\">\n<p>— A priest of the Imperial Cult, Ebonheart<\/p>\n<\/div>\n<h3 id=\"guide-your-faith--who-needs-a-god\">Who Needs a God<\/h3>\n<p class=\"dropcap\">Clerics, paladins and warlocks usually choose a god\nor patron in this step, and each one suggests the subclasses that suit\nit. They're suggestions, not limits: you can take any subclass. Everyone\nelse can choose a god, or none.<\/p>\n<p>This step covers how faith works on the island and how to choose. The\ngods themselves are described in <a class=\"xref\" href=\"#guide-the-gods-of-tamriel\">The Gods of Tamriel<\/a>, in Part\nThree.<\/p>\n<h3 id=\"guide-your-faith--faith-in-morrowind\">Faith in Morrowind<\/h3>\n<p>On Vvardenfell, religion is politics with incense. Your god decides\nwhich doors open for you and who comes looking for you.<\/p>\n<ul>\n<li>\n<p><strong>The Tribunal Temple<\/strong> is the state church of the\nDunmer. It worships ALMSIVI and honours the three Good Daedra as\nforerunners of the Tribunal. Its Ordinators enforce doctrine with a\nheavy hand.<\/p>\n<\/li>\n<li>\n<p><strong>The Imperial Cult<\/strong> worships the Nine Divines and\narrived with the Empire. It is tolerated, and strongest in Imperial\ntowns and Legion forts. Many Dunmer see it as foreign.<\/p>\n<\/li>\n<li>\n<p><strong>The Ashlanders<\/strong> are nomadic Dunmer who reject the\nTribunal as false gods. They honour their ancestors and the Good Daedra,\nespecially Azura, and await the Nerevarine.<\/p>\n<\/li>\n<li>\n<p><strong>Ancestor veneration<\/strong> runs through every Dunmer\nhousehold. Family tombs are sacred, and ancestral spirits are bound to\nguard them. Clerics of Arkay may find this awkward.<\/p>\n<\/li>\n<li>\n<p><strong>The House of Troubles<\/strong> is the Temple's name for\nMalacath, Mehrunes Dagon, Molag Bal and Sheogorath. The Temple teaches\nthat they exist to test the Dunmer. Their worshippers are hunted.<\/p>\n<\/li>\n<li>\n<p><strong>Other Daedric cults<\/strong> gather at ruined shrines in the\nwilds. The Temple treats them as heresy.<\/p>\n<\/li>\n<li>\n<p><strong>The Sixth House<\/strong> is the cult of Dagoth Ur, spreading\nthrough dreams and blight. Its members are killed on sight.<\/p>\n<\/li>\n<\/ul>\n<div class=\"tw\"><table><thead><tr><th>Your faith<\/th><th>Welcomed by<\/th><th>Trouble from<\/th><\/tr><\/thead><tbody><tr><td class=\"first\">Tribunal Temple<\/td><td>Dunmer towns, the Great Houses<\/td><td>Ashlanders, the Sixth House<\/td><\/tr><tr><td class=\"first\">Imperial Cult<\/td><td>Imperial towns, Legion forts<\/td><td>Temple traditionalists<\/td><\/tr><tr><td class=\"first\">Good Daedra<\/td><td>Ashlanders; the Temple, mostly<\/td><td>Imperial Cult zealots, Stendarr's Vigilants<\/td><\/tr><tr><td class=\"first\">House of Troubles<\/td><td>Your fellow cultists<\/td><td>Ordinators, and everyone else<\/td><\/tr><tr><td class=\"first\">Other Daedra<\/td><td>Your cult, if you can find it<\/td><td>Ordinators, the Imperial Cult<\/td><\/tr><tr><td class=\"first\">Sixth House<\/td><td>Dagoth Ur<\/td><td>Everyone, with good reason<\/td><\/tr><\/tbody><\/table><\/div>\n<h3 id=\"guide-your-faith--three-paths-of-power\">Three Paths of Power<\/h3>\n<p>One god can have three kinds of servant: the cleric worships, the\npaladin swears an oath, and the warlock signs a contract. Each path\ndraws power from a different place, and each loses it in a different\nway.<\/p>\n<div class=\"tw\"><table><thead><tr><th>Path<\/th><th>Relationship<\/th><th>Power comes from<\/th><th>Alignment follows<\/th><th>How you lose it<\/th><th>Usually belongs to<\/th><\/tr><\/thead><tbody><tr><td class=\"first\">Cleric<\/td><td>Faith<\/td><td>The god, through worship<\/td><td>The god<\/td><td>Displeasing the god<\/td><td>A temple, cult or shrine<\/td><\/tr><tr><td class=\"first\">Paladin<\/td><td>Oath<\/td><td>The oath itself; the god is the reason, not the source<\/td><td>The oath<\/td><td>Breaking the oath<\/td><td>A knightly order<\/td><\/tr><tr><td class=\"first\">Warlock<\/td><td>Contract<\/td><td>A patron who lends it in exchange for service<\/td><td>Whatever you like<\/td><td>Failing to pay the debt<\/td><td>Nobody, usually<\/td><\/tr><\/tbody><\/table><\/div>\n<p>A paladin whose god goes silent loses nothing. A paladin who breaks\ntheir oath loses everything.<\/p>\n<p>A warlock owes service, not worship, and is free to hate their\npatron. Most do, eventually.<\/p>\n<p>The Aedra do not make pacts. They used up too much of themselves\nmaking the world to lend power on credit. The Daedra make pacts\nconstantly, so most warlocks serve a Prince.<\/p>\n<h3 id=\"guide-your-faith--choosing-a-god-or-patron\">Choosing a God or Patron<\/h3>\n<p>Pick the relationship before you pick the god. Everythin
