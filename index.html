g else\nfollows from it.<\/p>\n<ol type=\"1\">\n<li>\n<p><strong>Choose your path.<\/strong> Faith, oath or contract. Your\nclass may already have decided this for you.<\/p>\n<\/li>\n<li>\n<p><strong>Choose your trouble.<\/strong> Your god decides who welcomes\nyou and who hunts you. Check the table in Faith in Morrowind.<\/p>\n<\/li>\n<li>\n<p><strong>Check your alignment.<\/strong> Clerics usually sit within one\nstep of their god's typical alignment. Paladins match their oath.\nWarlocks please themselves.<\/p>\n<\/li>\n<li>\n<p><strong>Choose your subclass.<\/strong> The Quick Reference lists the\ndomains, oaths and patrons that suit each god. Any other subclass is\nfine too.<\/p>\n<\/li>\n<li>\n<p><strong>Answer three questions.<\/strong><\/p>\n\n<ul>\n<li>\n<p>How did you come to this god?<\/p>\n<\/li>\n<li>\n<p>What does your god want from you?<\/p>\n<\/li>\n<li>\n<p>What would make you break with them?<\/p>\n<\/li>\n<\/ul><\/li>\n<li>\n<p><strong>Name one person in your faith.<\/strong> A superior, a mentor,\na rival or a handler. They are your first link to the world.<\/p>\n<\/li>\n<li>\n<p><strong>Tell the DM what you'd hate to lose.<\/strong> That is where\nthe story will go.<\/p>\n<\/li>\n<\/ol>\n<p>Serving two powers, such as a cleric and warlock multiclass, is\nallowed. It is rarely restful.<\/p>\n<h3 id=\"guide-your-faith--quick-reference\">Quick Reference<\/h3>\n<p>Use these tables to find the suggested cleric domains, paladin oaths\nand warlock patrons for each god. Subclasses from older books are\nallowed, and an asterisk (*) marks them. A dash means that path doesn't\nfit the god; talk to the DM if you want it anyway.<\/p>\n<h4 id=\"guide-your-faith--the-nine-divines-and-fringe-aedra\">The Nine Divines and Fringe\nAedra<\/h4>\n<div class=\"tw\"><table><thead><tr><th>God<\/th><th>Cleric domains<\/th><th>Paladin oaths<\/th><th>Warlock patrons<\/th><\/tr><\/thead><tbody><tr><td class=\"first\">Akatosh<\/td><td>Order*, Light<\/td><td>Devotion, Glory<\/td><td>—<\/td><\/tr><tr><td class=\"first\">Arkay<\/td><td>Grave*, Life<\/td><td>Devotion, Vengeance<\/td><td>—<\/td><\/tr><tr><td class=\"first\">Dibella<\/td><td>Life, Peace*<\/td><td>Devotion<\/td><td>—<\/td><\/tr><tr><td class=\"first\">Julianos<\/td><td>Knowledge*, Arcana*<\/td><td>Devotion, Crown*<\/td><td>—<\/td><\/tr><tr><td class=\"first\">Kynareth<\/td><td>Tempest*, Nature*<\/td><td>Ancients<\/td><td>—<\/td><\/tr><tr><td class=\"first\">Mara<\/td><td>Life, Peace*<\/td><td>Devotion<\/td><td>—<\/td><\/tr><tr><td class=\"first\">Stendarr<\/td><td>Life, War<\/td><td>Devotion, Vengeance<\/td><td>—<\/td><\/tr><tr><td class=\"first\">Zenithar<\/td><td>Forge*, Order*<\/td><td>Devotion<\/td><td>—<\/td><\/tr><tr><td class=\"first\">Talos<\/td><td>War, Order*<\/td><td>Glory, Crown*<\/td><td>—<\/td><\/tr><tr><td class=\"first\">Y'ffre<\/td><td>Nature*, Trickery<\/td><td>Ancients<\/td><td>—<\/td><\/tr><tr><td class=\"first\">Lorkhan<\/td><td>Trickery, War<\/td><td>Glory<\/td><td>—<\/td><\/tr><\/tbody><\/table><\/div>\n<h4 id=\"guide-your-faith--the-tribunal-and-the-sixth-house\">The Tribunal and the Sixth\nHouse<\/h4>\n<div class=\"tw\"><table><thead><tr><th>God<\/th><th>Cleric domains<\/th><th>Paladin oaths<\/th><th>Warlock patrons<\/th><\/tr><\/thead><tbody><tr><td class=\"first\">Almalexia<\/td><td>Life, Light<\/td><td>Devotion<\/td><td>—<\/td><\/tr><tr><td class=\"first\">Sotha Sil<\/td><td>Knowledge*, Forge*, Arcana*<\/td><td>Devotion<\/td><td>—<\/td><\/tr><tr><td class=\"first\">Vivec<\/td><td>War, Trickery<\/td><td>Glory, Vengeance<\/td><td>—<\/td><\/tr><tr><td class=\"first\">Dagoth Ur<\/td><td>—<\/td><td>—<\/td><td>Great Old One<\/td><\/tr><\/tbody><\/table><\/div>\n<h4 id=\"guide-your-faith--the-good-daedra-and-the-house-of-troubles\">The Good Daedra and\nthe House of Troubles<\/h4>\n<div class=\"tw\"><table><thead><tr><th>Prince<\/th><th>Group<\/th><th>Cleric domains<\/th><th>Paladin oaths<\/th><th>Warlock patrons<\/th><\/tr><\/thead><tbody><tr><td class=\"first\">Azura<\/td><td>Good Daedra<\/td><td>Twilight*, Light<\/td><td>Devotion<\/td><td>Archfey, Celestial<\/td><\/tr><tr><td class=\"first\">Boethiah<\/td><td>Good Daedra<\/td><td>Trickery, War<\/td><td>Conquest*<\/td><td>Fiend, Hexblade*<\/td><\/tr><tr><td class=\"first\">Mephala<\/td><td>Good Daedra<\/td><td>Trickery, Knowledge*<\/td><td>Vengeance<\/td><td>Archfey, Hexblade*<\/td><\/tr><tr><td class=\"first\">Malacath<\/td><td>House of Troubles<\/td><td>War, Forge*<\/td><td>Vengeance<\/td><td>Fiend<\/td><\/tr><tr><td class=\"first\">Mehrunes Dagon<\/td><td>House of Troubles<\/td><td>War, Tempest*<\/td><td>Conquest*<\/td><td>Fiend<\/td><\/tr><tr><td class=\"first\">Molag Bal<\/td><td>House of Troubles<\/td><td>Death*, Order*<\/td><td>Conquest*<\/td><td>Fiend, Undead*<\/td><\/tr><tr><td class=\"first\">Sheogorath<\/td><td>House of Troubles<\/td><td>Trickery<\/td><td>—<\/td><td>Great Old One, Archfey<\/td><\/tr><\/tbody><\/table><\/div>\n<h4 id=\"guide-your-faith--the-other-princes\">The Other Princes<\/h4>\n<div class=\"tw\"><table><thead><tr><th>Prince<\/th><th>Cleric domains<\/th><th>Paladin oaths<\/th><th>Warlock patrons<\/th><\/tr><\/thead><tbody><tr><td class=\"first\">Clavicus Vile<\/td><td>Trickery<\/td><td>—<\/td><td>Archfey<\/td><\/tr><tr><td class=\"first\">Hermaeus Mora<\/td><td>Knowledge*, Arcana*<\/td><td>—<\/td><td>Great Old One<\/td><\/tr><tr><td class=\"first\">Hircine<\/td><td>Nature*, War<\/td><td>Glory<\/td><td>Archfey<\/td><\/tr><tr><td class=\"first\">Meridia<\/td><td>Light, Life<\/td><td>Devotion, Vengeance<\/td><td>Celestial<\/td><\/tr><tr><td class=\"first\">Namira<\/td><td>Death*, Trickery<\/td><td>—<\/td><td>Great Old One<\/td><\/tr><tr><td class=\"first\">Nocturnal<\/td><td>Trickery, Twilight*<\/td><td>—<\/td><td>Archfey<\/td><\/tr><tr><td class=\"first\">Peryite<\/td><td>Order*, Death*<\/td><td>Crown*<\/td><td>Fiend<\/td><\/tr><tr><td class=\"first\">Sanguine<\/td><td>Trickery<\/td><td>—<\/td><td>Archfey<\/td><\/tr><tr><td class=\"first\">Vaermina<\/td><td>Trickery, Knowledge*<\/td><td>—<\/td><td>Great Old One<\/td><\/tr><tr><td class=\"first\">Jyggalag<\/td><td>Order*, Knowledge*<\/td><td>Crown*<\/td><td>Great Old One<\/td><\/tr><\/tbody><\/table><\/div>\n<p>The Hexblade* patron also suits anyone bound to a Daedric artifact\nweapon, whichever Prince made it.<\/p>\n"},{"id":"guide-starting-equipment","t":"Step Seven: Starting Equipment","s":[{"id":"guide-starting-equipment--what-you-bring","t":"What You Bring","l":2},{"id":"guide-starting-equipment--equipment-by-class","t":"Equipment by Class","l":2},{"id":"guide-starting-equipment--barbarian","t":"Barbarian","l":3},{"id":"guide-starting-equipment--bard","t":"Bard","l":3},{"id":"guide-starting-equipment--cleric","t":"Cleric","l":3},{"id":"guide-starting-equipment--druid","t":"Druid","l":3},{"id":"guide-starting-equipment--fighter","t":"Fighter","l":3},{"id":"guide-starting-equipment--monk","t":"Monk","l":3},{"id":"guide-starting-equipment--paladin","t":"Paladin","l":3},{"id":"guide-starting-equipment--ranger","t":"Ranger","l":3},{"id":"guide-starting-equipment--rogue","t":"Rogue","l":3},{"id":"guide-starting-equipment--sorcerer","t":"Sorcerer","l":3},{"id":"guide-starting-equipment--warlock","t":"Warlock","l":3},{"id":"guide-starting-equipment--wizard","t":"Wizard","l":3},{"id":"guide-starting-equipment--shopping-in-morrowind","t":"Shopping in Morrowind","l":2}],"p":"Making Your Character","sub":"Outfitting for the Voyage","h":"\n\n\n<div class=\"epigraph\">\n<p><em>“Pack light. Whatever you forgot, Vvardenfell sells, and whatever\nyou brought, Vvardenfell wants.”<\/em><\/p>\n<\/div>\n<div class=\"attribution\">\n<p>— A Company quartermaster, Ebonheart<\/p>\n<\/div>\n<h3 id=\"guide-starting-equipment--what-you-bring\">What You Bring<\/h3>\n<p class=\"dropcap\">At level 1, you get starting equipment from two\nplaces: your class, below, and your background (see <a class=\"xref\" href=\"#guide-backgrounds-of-tamriel\">Step Three<\/a>). Each gives you\na choice between a set package of gear and gold to spend instead.<\/p>\n<ul>\n<li>\n<p><strong>Gear from home.<\/strong> You're arriving from all over\nTamriel, so the <em>Player's Handbook<\/em> packages work as they stand.\nA Nord's leather armour was made in Skyrim, not cut from a netch, and an\nImperial's chain mail came out of a Cyrodiilic forge.<\/p>\n<\/li>\n<li>\n<p><strong>Morrowind-made gear.<\/strong> Characters from mainland\nMorrowind, or anyone who bought their kit there, can take the\nMorrowind-made package instead. It works exactly the same in play. Where\na Morrowind item's name differs from the <em>Player's Handbook<\/em>, the\n<em>Player's Handbook<\/em> name follows it in brackets.<\/p>\n<\/li>\n<li>\n<p><strong>Taking gold.<\/strong> If you take gold instead of a package,\nyou buy your gear at the prices in <em>Treasures of Morrowind<\/em>: <a class=\"xref\" href=\"#items-armour-and-clothing\">armour<\/a>, <a class=\"xref\" href=\"#items-weapons\">weapons<\/a> and <a class=\"xref\" href=\"#items-tools-and-equipment\">adventuring gear<\/a>. Its tables\nlist steel weapons; iron and chitin ones cost half as much, but wear out\nfaster under the optional Wear and Repair rule.<\/p>\n<\/li>\n<li>\n<p><strong>Training.<\/strong> You can carry any gear, but you need\ntraining to wear armour and proficiency to use weapons well, as\nnormal.<\/p>\n<\/li>\n<\/ul>\n<h3 id=\"guide-starting-equipment--equipment-by-class\">Equipment by Class<\/h3>\n<h4 id=\"guide-starting-equipment--barbarian\">Barbarian<\/h4>\n<ul>\n<li>\n<p><strong>From home.<\/strong> A greataxe, 4 handaxes, an Explorer's\nPack and 15 gp.<\/p>\n<\/li>\n<li>\n<p><strong>Morrowind-made.<\/strong> A steel battle axe [Greataxe], 4\nchitin axes [Handaxes], an Explorer's Pack and 15 gp.<\/p>\n<\/li>\n<li>\n<p><strong>Or gold.<\/strong> 75 gp.<\/p>\n<\/li>\n<\/ul>\n<h4 id=\"guide-starting-equipment--bard\">Bard<\/h4>\n<ul>\n<li>\n<p><strong>From home.<\/strong> Leather armour, 2 daggers, a musical\ninstrument of your choice, an Entertainer's Pack and 19 gp.<\/p>\n<\/li>\n<li>\n<p><strong>Morrowind-made.<\/strong> Netch leather [Leather Armor], 2\nchitin daggers, a musical instrument of your choice, an Entertainer's\nPack and 19 gp.<\/p>\n<\/li>\n<li>\n<p><strong>Or gold.<\/strong> 90 gp.<\/p>\n<\/li>\n<\/ul>\n<h4 id=\"guide-starting-equipment--cleric\">Cleric<\/h4>\n<ul>\n<li>\n<p><strong>From home.<\/strong> A chain shirt, a shield, a mace, a holy\nsymbol, a Priest's Pack and 7 gp.<\/p>\n<\/li>\n<li>\n<p><strong>Morrowind-made.<\/strong> A chain shirt, a chitin shield, a\nsteel mace, a holy symbol, a Priest's Pack and 7 gp. Morrowind makes\nnothing quite like a chain shirt, so even local clerics wear an imported\none.<\/p>\n<\/li>\n<li>\n<p><strong>Or gold.<\/strong> 110 gp.<\/p>\n<\/li>\n<\/ul>\n<h4 id=\"guide-starting-equipment--druid\">Druid<\/h4>\n<ul>\n<li>\n<p><strong>From home.<\/strong> Leather armour, a shield, a sickle, a\nquarterstaff as your Druidic Focus, an Explorer's Pack, an Herbalism Kit\nand 9 gp.<\/p>\n<\/li>\n<li>\n<p><strong>Morrowind-made.<\/strong> Netch leather [Leather Armor], a\nchitin shield, a sickle, a staff [Quarterstaff] as your Druidic Focus,\nan Explorer's Pack, an Herbalism Kit and 9 gp.<\/p>\n<\/li>\n<li>\n<p><strong>Or gold.<\/strong> 50 gp.<\/p>\n<\/li>\n<\/ul>\n<h4 id=\"guide-starting-equipment--fighter\">Fighter<\/h4>\n<ul>\n<li>\n<p><strong>From home (first choice).<\/strong> Chain mail, a greatsword,\na flail, 8 javelins, a Dungeoneer's Pack and 4 gp.<\/p>\n<\/li>\n<li>\n<p><strong>From home (second choice).<\/strong> Studded leather armour, a\nscimitar, a shortsword, a longbow, 20 arrows, a quiver, a Dungeoneer's\nPack and 11 gp.<\/p>\n<\/li>\n<li>\n<p><strong>Morrowind-made (first choice).<\/strong> Iron armour [Chain\nMail], a steel claymore [Greatsword], a flail, 8 javelins, a\nDungeoneer's Pack and 4 gp.<\/p>\n<\/li>\n<li>\n<p><strong>Morrowind-made (second choice).<\/strong> Chitin armour\n[Studded Leather Armor], a steel saber [Scimitar], a steel shortsword, a\nchitin long bow [Longbow], 20 chitin arrows, a quiver, a Dungeoneer's\nPack and 11 gp.<\/p>\n<\/li>\n<li>\n<p><strong>Or gold.<\/strong> 155 gp.<\/p>\n<\/li>\n<\/ul>\n<h4 id=\"guide-starting-equipment--monk\">Monk<\/h4>\n<ul>\n<li>\n<p><strong>From home.<\/strong> A spear, 5 daggers, the Artisan's Tools\nor musical instrument you chose for your tool proficiency, an Explorer's\nPack and 11 gp.<\/p>\n<\/li>\n<li>\n<p><strong>Morrowind-made.<\/strong> A chitin spear, 5 chitin daggers,\nthe Artisan's Tools or musical instrument you chose, an Explorer's Pack\nand 11 gp.<\/p>\n<\/li>\n<li>\n<p><strong>Or gold.<\/strong> 50 gp.<\/p>\n<\/li>\n<\/ul>\n<h4 id=\"guide-starting-equipment--paladin\">Paladin<\/h4>\n<ul>\n<li>\n<p><strong>From home.<\/strong> Chain mail, a shield, a longsword, 6\njavelins, a holy symbol, a Priest's Pack and 9 gp.<\/p>\n<\/li>\n<li>\n<p><strong>Morrowind-made.<\/strong> Iron armour [Chain Mail], an iron\nshield, a steel broadsword [Longsword], 6 javelins, a holy symbol, a\nPriest's Pack and 9 gp.<\/p>\n<\/li>\n<li>\n<p><strong>Or gold.<\/strong> 150 gp.<\/p>\n<\/li>\n<\/ul>\n<h4 id=\"guide-starting-equipment--ranger\">Ranger<\/h4>\n<ul>\n<li>\n<p><strong>From home.<\/strong> Studded leather armour, a scimitar, a\nshortsword, a longbow, 20 arrows, a quiver, a sprig of mistletoe as your\nDruidic Focus, an Explorer's Pack and 7 gp.<\/p>\n<\/li>\n<li>\n<p><strong>Morrowind-made.<\/strong> Chitin armour [Studded Leather\nArmor], a steel saber [Scimitar], a steel shortsword, a chitin long bow\n[Longbow], 20 chitin arrows, a quiver, a sprig of heather as your\nDruidic Focus, an Explorer's Pack and 7 gp.<\/p>\n<\/li>\n<li>\n<p><strong>Or gold.<\/strong> 150 gp.<\/p>\n<\/li>\n<\/ul>\n<h4 id=\"guide-starting-equipment--rogue\">Rogue<\/h4>\n<ul>\n<li>\n<p><strong>From home.<\/strong> Leather armour, 2 daggers, a shortsword,\na shortbow, 20 arrows, a quiver, Thieves' Tools, a Burglar's Pack and 8\ngp.<\/p>\n<\/li>\n<li>\n<p><strong>Morrowind-made.<\/strong> Netch leather [Leather Armor], 2\nchitin daggers, a steel shortsword, a chitin short bow [Shortbow], 20\nchitin arrows, a quiver, an Apprentice's lockpick and probe [Thieves'\nTools], a Burglar's Pack and 8 gp.<\/p>\n<\/li>\n<li>\n<p><strong>Or gold.<\/strong> 100 gp.<\/p>\n<\/li>\n<\/ul>\n<h4 id=\"guide-starting-equipment--sorcerer\">Sorcerer<\/h4>\n<ul>\n<li>\n<p><strong>From home.<\/strong> A spear, 2 daggers, a crystal as your\nArcane Focus, a Dungeoneer's Pack and 28 gp.<\/p>\n<\/li>\n<li>\n<p><strong>Morrowind-made.<\/strong> A chitin spear, 2 chitin daggers, a\ncrystal as your Arcane Focus, a Dungeoneer's Pack and 28 gp.<\/p>\n<\/li>\n<li>\n<p><strong>Or gold.<\/strong> 50 gp.<\/p>\n<\/li>\n<\/ul>\n<h4 id=\"guide-starting-equipment--warlock\">Warlock<\/h4>\n<ul>\n<li>\n<p><strong>From home.<\/strong> Leather armour, a sickle, 2 daggers, an\norb as your Arcane Focus, a book of occult lore, a Scholar's Pack and 15\ngp.<\/p>\n<\/li>\n<li>\n<p><strong>Morrowind-made.<\/strong> Netch leather [Leather Armor], a\nsickle, 2 chitin daggers, an orb as your Arcane Focus, a book of occult\nlore, a Scholar's Pack and 15 gp.<\/p>\n<\/li>\n<li>\n<p><strong>Or gold.<\/strong> 100 gp.<\/p>\n<\/li>\n<\/ul>\n<h4 id=\"guide-starting-equipment--wizard\">Wizard<\/h4>\n<ul>\n<li>\n<p><strong>From home.<\/strong> 2 daggers, a quarterstaff as your Arcane\nFocus, a robe, a spellbook, a Scholar's Pack and 5 gp.<\/p>\n<\/li>\n<li>\n<p><strong>Morrowind-made.<\/strong> 2 chitin daggers, a staff\n[Quarterstaff] as your Arcane Focus, a robe, a spellbook, a Scholar's\nPack and 5 gp.<\/p>\n<\/li>\n<li>\n<p><strong>Or gold.<\/strong> 55 gp.<\/p>\n<\/li>\n<\/ul>\n<h3 id=\"guide-starting-equipment--shopping-in-morrowind\">Shopping in Morrowind<\/h3>\n<p>If you take gold, or want to replace a piece of gear later, these are\nthe Morrowind names for the armour in the <em>Player's Handbook<\/em>.\nFor weapons, use the \"As\" column in <em>Treasures of Morrowind<\/em>'s <a class=\"xref\" href=\"#items-weapons\">weapon tables<\/a>, which names the <em>Player's\nHandbook<\/em> weapon each one counts as.<\/p>\n<div class=\"tw\"><table><thead><tr><th>Treasures of Morrowind<\/th><th>Player's Handbook<\/th><\/tr><\/thead><tbody><tr><td>Netch leather<\/td><td>Leather Armor<\/td><\/tr><tr><td>Chitin, Imperial studded leather<\/td><td>Studded Leather Armor<\/td><\/tr><tr><td>Bear<\/td><td>Hide Armor<\/td><\/tr><tr><td>Imperial chain<\/td><td>Scale Mail<\/td><\/tr><tr><td>Imperial dragonscale<\/td><td>Half Plate Armor<\/td><\/tr><tr><td>Iron<\/td><td>Chain Mail<\/td><\/tr><tr><td>Steel<\/td><td>Splint Armor<\/td><\/tr><tr><td>Imperial Templar<\/td><td>Plate Armor<\/td><\/tr><tr><td>Netch leather, chitin, iron or steel shield<\/td><td>Shield<\/td><\/tr><\/tbody><\/table><\/div>\n<ul>\n<li>\n<p><strong>No local equivalent.<\/strong> Vvardenfell's armourers don't\nsell chain shirts or breastplates. The nearest armour they do sell,\nNordic ringmail and bonemold, gives Disadvantage on Dexterity (Stealth)\nchecks where those don't, so characters who want one bring it from\nhome.<\/p>\n<\/li>\n<\/ul>\n"},{"id":"guide-finishing-touches","t":"Step Eight: Finishing Touches","s":[{"id":"guide-finishing-touches--how-vvardenfell-sees-you","t":"How Vvardenfell Sees You","l":2},{"id":"guide-finishing-touches--your-story","t":"Your Story","l":2},{"id":"guide-finishing-touches--why-are-you-going-to-vvardenfell","t":"Why Are You Going to Vvardenfell?","l":3},{"id":"guide-finishing-touches--ties-aboard-the-ship","t":"Ties Aboard the Ship","l":3},{"id":"guide-finishing-touches--before-the-first-session","t":"Before the First Session","l":3}],"p":"Making Your Character","sub":"Your Story Before Landfall","h":"\n\n\n<div class=\"epigraph\">\n<p><em>“Bring a reason. The island has plenty of its own.”<\/em><\/p>\n<\/div>\n<div class=\"attribution\">\n<p>— An East Empire Company purser<\/p>\n<\/div>\n<h3 id=\"guide-finishing-touches--how-vvardenfell-sees-you\">How Vvardenfell Sees You<\/h3>\n<p class=\"dropcap\">The island will judge you before you say a word.\nDecide how your character feels about that.<\/p>\n<ul>\n<li>\n<p><strong>Outlanders.<\/strong> A Dunmer is a local; everyone else is an\noutlander, and a Nord or an Imperial may meet open hostility. The table\nin <a class=\"xref\" href=\"#guide-peoples-of-tamriel\">Step One<\/a> shows how the\nisland treats each people.<\/p>\n<\/li>\n<li>\n<p><strong>Argonians and Khajiit.<\/strong> Slavery is legal in\nMorrowind. Free Argonians and Khajiit are wise to carry papers that\nprove it. Decide whether your character has them, and how they feel\nabout where they are going.<\/p>\n<\/li>\n<li>\n<p><strong>Your faith.<\/strong> Worshipping the Nine Divines is legal;\nworshipping most Daedra is heresy, and the Temple's Ordinators enforce\nthat (see <a class=\"xref\" href=\"#guide-your-faith\">Step Six<\/a>).<\/p>\n<\/li>\n<li>\n<p><strong>Factions.<\/strong> Great Houses, guilds, the Temple and\nothers will approach the party early on. Your character can have\nsympathies, but membership is better earned in play.<\/p>\n<\/li>\n<li>\n<p><strong>Prophecy is part of the setting, not your destiny.<\/strong>\nMorrowind's prophecies shape the world around you, but no player\ncharacter is the subject of one. This is a story about ordinary people\ncaught up in extraordinary events.<\/p>\n<\/li>\n<\/ul>\n<h3 id=\"guide-finishing-touches--your-story\">Your Story<\/h3>\n<p>Three things tie your character to the story: why you are going, who\nyou already know, and what you want. Decide them before the first\nsession, and share them with your DM.<\/p>\n<h4 id=\"guide-finishing-touches--why-are-you-going-to-vvardenfell\">Why Are You Going to\nVvardenfell?<\/h4>\n<p>Every character needs a reason to be on that ship. Choose one of\nthese, roll a d10, or invent your own. Your DM may tie it into the\nstory.<\/p>\n<div class=\"tw\"><table><thead><tr><th>d10<\/th><th>Your reason<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>You owe money, or worse, to someone in Cyrodiil, and Vvardenfell is as far as the ship would take you.<\/td><\/tr><tr><td>2<\/td><td>A relative settled on the island when it opened, and their letters have stopped.<\/td><\/tr><tr><td>3<\/td><td>A guild has posted you to its hall on Vvardenfell: the Fighters, the Mages or, unofficially, the Thieves.<\/td><\/tr><tr><td>4<\/td><td>You are on pilgrimage, to a Temple shrine or an Imperial Cult chapel.<\/td><\/tr><tr><td>5<\/td><td>You carry an East Empire Company contract and a letter of introduction.<\/td><\/tr><tr><td>6<\/td><td>You have heard about Dwemer ruins full of treasure and intend to find one.<\/td><\/tr><tr><td>7<\/td><td>You have just left the Legion, or been posted to its garrison on the island.<\/td><\/tr><tr><td>8<\/td><td>You are Dunmer, coming home after years away, and unsure what is left.<\/td><\/tr><tr><td>9<\/td><td>Your family or clan has exiled you, and this was the furthest place you could reach.<\/td><\/tr><tr><td>10<\/td><td>A scholar is paying you to record the island's tombs, beasts or customs.<\/td><\/tr><\/tbody><\/table><\/div>\n<h4 id=\"guide-finishing-touches--ties-aboard-the-ship\">Ties Aboard the Ship<\/h4>\n<p>After weeks at sea, the characters already know each other a little.\nDecide on at least one connection between your character and another\nplayer's. Here are some to start from:<\/p>\n<ul>\n<li>\n<p>You shared a cabin, and one of you snores.<\/p>\n<\/li>\n<li>\n<p>One of you saved the other's purse, or life, during a storm.<\/p>\n<\/li>\n<li>\n<p>You have played cards every night, and one of you owes the other\nmoney.<\/p>\n<\/li>\n<li>\n<p>You were both seasick for the first week, which is a bond of\nsorts.<\/p>\n<\/li>\n<li>\n<p>You don't trust each other, and you're curious why.<\/p>\n<\/li>\n<\/ul>\n<h4 id=\"guide-finishing-touches--before-the-first-session\">Before the First Session<\/h4>\n<p>Answer these questions, and bring your answers to the first session.\nYour DM will use them to decide who approaches you first.<\/p>\n<ol type=\"1\">\n<li>\n<p>What is your character's name, race and class?<\/p>\n<\/li>\n<li>\n<p>Why are you going to Vvardenfell, in one sentence?<\/p>\n<\/li>\n<li>\n<p>What, or who, are you leaving behind?<\/p>\n<\/li>\n<li>\n<p>Which god or patron do you follow, if any?<\/p>\n<\/li>\n<li>\n<p>Under which birthsign were you born?<\/p>\n<\/li>\n<li>\n<p>Who on the ship do you already know, and how?<\/p>\n<\/li>\n<li>\n<p>What do you want from Vvardenfell?<\/p>\n<\/li>\n<li>\n<p>What are you afraid of finding there?<\/p>\n<\/li>\n<\/ol>\n"},{"id":"guide-a-brief-history-of-tamriel","t":"A Brief History of Tamriel","s":[{"id":"guide-a-brief-history-of-tamriel--the-world","t":"The World","l":2},{"id":"guide-a-brief-history-of-tamriel--reckoning-time","t":"Reckoning Time","l":2},{"id":"guide-a-brief-history-of-tamriel--tamriel","t":"Tamriel","l":2},{"id":"guide-a-brief-history-of-tamriel--the-mer","t":"The Mer","l":3},{"id":"guide-a-brief-history-of-tamriel--the-men","t":"The Men","l":3},{"id":"guide-a-brief-history-of-tamriel--the-beastfolk","t":"The Beastfolk","l":3},{"id":"guide-a-brief-history-of-tamriel--the-empires","t":"The Empires","l":3},{"id":"guide-a-brief-history-of-tamriel--the-third-era","t":"The Third Era","l":3},{"id":"guide-a-brief-history-of-tamriel--morrowind","t":"Morrowind","l":2},{"id":"guide-a-brief-history-of-tamriel--the-exodus","t":"The Exodus","l":3},{"id":"guide-a-brief-history-of-tamriel--the-first-council","t":"The First Council","l":3},{"id":"guide-a-brief-history-of-tamriel--red-mountain","t":"Red Mountain","l":3},{"id":"guide-a-brief-history-of-tamriel--the-tribunals-age","t":"The Tribunal's Age","l":3},{"id":"guide-a-brief-history-of-tamriel--the-armistice","t":"The Armistice","l":3},{"id":"guide-a-brief-history-of-tamriel--morrowind-today","t":"Morrowind Today","l":3},{"id":"guide-a-brief-history-of-tamriel--vvardenfell","t":"Vvardenfell","l":2},{"id":"guide-a-brief-history-of-tamriel--the-vvardenfell-district","t":"The Vvardenfell District","l":3},{"id":"guide-a-brief-history-of-tamriel--powers-on-the-island","t":"Powers on the Island","l":3},{"id":"guide-a-brief-history-of-tamriel--red-mountain-and-the-blight","t":"Red Mountain and the Blight","l":3},{"id":"guide-a-brief-history-of-tamriel--the-nerevarine-prophecy","t":"The Nerevarine Prophecy","l":3},{"id":"guide-a-brief-history-of-tamriel--current-tensions","t":"Current Tensions","l":3}],"p":"The World","h":"\n\n<div class=\"epigraph\">\n<p><em>“Ash remembers what scholars forget.”<\/em><\/p>\n<\/div>\n<div class=\"attribution\">\n<p>— Ashlander saying<\/p>\n<\/div>\n<h3 id=\"guide-a-brief-history-of-tamriel--the-world\">The World<\/h3>\n<p class=\"dropcap\">The world is called Nirn, and Tamriel is its largest\ncontinent. Tamriel is divided into nine provinces, each the homeland of\none or two of the ten races.<\/p>\n<blockquote>\n<figure><img alt=\"\" loading=\"lazy\" src=\"img/4e5f4ffe1668c9a29078ac9935090919da4c8e9c.webp\"/><\/figure>\n<\/blockquote>\n<p><em>Tamriel and its nine provinces<\/em><\/p>\n<div class=\"tw\"><table><thead><tr><th>Province<\/th><th>Homeland of<\/th><th>Where it is<\/th><\/tr><\/thead><tbody><tr><td class=\"first\">Cyrodiil<\/td><td>Imperials<\/td><td>The centre; seat of the Empire and its capital, the Imperial City<\/td><\/tr><tr><td class=\"first\">Skyrim<\/td><td>Nords<\/td><td>The cold north<\/td><\/tr><tr><td class=\"first\">Morrowind<\/td><td>Dunmer<\/td><td>The north-east, including the island of Vvardenfell<\/td><\/tr><tr><td class=\"first\">Black Marsh<\/td><td>Argonians<\/td><td>The swampy south-east<\/td><\/tr><tr><td class=\"first\">Elsweyr<\/td><td>Khajiit<\/td><td>The south; deserts and jungle<\/td><\/tr><tr><td class=\"first\">Valenwood<\/td><td>Bosmer<\/td><td>The south-west; dense forest<\/td><\/tr><tr><td class=\"first\">Summerset Isles<\/td><td>Altmer<\/td><td>Islands off the south-west coast<\/td><\/tr><tr><td class=\"first\">Hammerfell<\/td><td>Redguards<\/td><td>The west; deserts and coast<\/td><\/tr><tr><td class=\"first\">High Rock<\/td><td>Bretons, and Orcs in the mountains<\/td><td>The north-west<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Other continents lie beyond the sea. Atmora, the frozen north, is the\nancient home of the Nords. Akavir lies to the east, home of the\ndragon-obsessed Akaviri. Yokuda, the Redguards' homeland to the west,\nsank beneath the ocean long ago.<\/p>\n<p><strong>The cosmos.<\/strong> The mortal world, called Mundus, sits\nbetween two realms. Above is Aetherius, the realm of the gods and the\nsource of all magic; the sun and stars are holes leading into it. Below\nis Oblivion, a sea of separate realms ruled by the Daedric Princes.<\/p>\n<p><strong>Gods.<\/strong> The Aedra are the gods who helped create\nMundus, and gave up much of their power to do it. The Daedra refused,\nkept their power, and rule Oblivion. <a class=\"xref\" href=\"#guide-the-gods-of-tamriel\"><em>The Gods of Tamriel<\/em><\/a>\ncovers both in detail.<\/p>\n<p><strong>Mer and Men.<\/strong> \"Mer\" means elves, and \"Men\" means\nhumans. Elven names for their peoples end in \"-mer\": Altmer, Bosmer,\nDunmer.<\/p>\n<h3 id=\"guide-a-brief-history-of-tamriel--reckoning-time\">Reckoning Time<\/h3>\n<p>The campaign begins in 3E 417, under Emperor Uriel VII, the elderly\nruler of the Septim dynasty. Ten years from now, the events of the game\n<em>Morrowind<\/em> will begin when a nameless prisoner is shipped to the\nport of Seyda Neen. None of you are that prisoner, and none of those\nevents have happened yet.<\/p>\n<p>Tamrielic history is counted in eras, each ending with an event that\nchanged the continent. Dates are written era first: 3E 417 means the\n417th year of the Third Era.<\/p>\n<div class=\"tw\"><table><thead><tr><th>Era<\/th><th>Span<\/th><th>Ends with<\/th><\/tr><\/thead><tbody><tr><td class=\"first\">Merethic Era<\/td><td>Before recorded history<\/td><td>The founding of the Camoran Dynasty, the first great royal line of the Bosmer<\/td><\/tr><tr><td class=\"first\">First Era (1E)<\/td><td>1E 0 – 1E 2920<\/td><td>The assassination of the last emperor of the Reman dynasty<\/td><\/tr><tr><td class=\"first\">Second Era (2E)<\/td><td>2E 0 – 2E 896<\/td><td>Tiber Septim's conquest and unification of Tamriel<\/td><\/tr><tr><td class=\"first\">Third Era (3E)<\/td><td>3E 0 – present<\/td><td>Not yet<\/td><\/tr><\/tbody><\/table><\/div>\n<h3 id=\"guide-a-brief-history-of-tamriel--tamriel\">Tamriel<\/h3>\n<p>Tamriel's history comes down to three groups of peoples: the elves\nwho arrived first, the humans who came after them, and the beastfolk who\nwere there all along. They have spent thousands of years fighting over\nwho owns the place.<\/p>\n<h4 id=\"guide-a-brief-history-of-tamriel--the-mer\">The Mer<\/h4>\n<p>In the Merethic Era, the Aldmer, the ancestral elves, sailed to\nTamriel from a homeland called Aldmeris. Aldmeris is now lost, and\nnobody agrees where it was. Over the centuries the Aldmer split into new\npeoples, each shaped by where they settled and what they chose to\nworship.<\/p>\n<ul>\n<li>\n<p><strong>Altmer<\/strong> stayed on the Summerset Isles and kept the\nold ways. They worship the Aedra as their divine ancestors.<\/p>\n<\/li>\n<li>\n<p><strong>Bosmer<\/strong> settled the forests of Valenwood. Their god\nY'ffre gave them the Green Pact, a sacred vow never to harm a living\nplant.<\/p>\n<\/li>\n<li>\n<p><strong>Chimer<\/strong>, meaning \"changed folk\", left Summerset to\nfollow the prophet Veloth and worship the Daedra. They settled in\nMorrowind and later became the Dunmer.<\/p>\n<\/li>\n<li>\n<p><strong>Dwemer<\/strong>, the \"deep elves\", built underground cities\nof brass, steam and clockwork, and rejected the gods altogether. They\nvanished overnight in the First Era; their ruins still dot Morrowind,\nfull of machines that still work.<\/p>\n<\/li>\n<li>\n<p><strong>Ayleids<\/strong>, the \"wild elves\", ruled Cyrodiil and\nenslaved the early humans who lived there. Their white-stone ruins\nremain.<\/p>\n<\/li>\n<li>\n<p><strong>Falmer<\/strong>, the snow elves, lived in Skyrim until the\nNords drove them out.<\/p>\n<\/li>\n<li>\n<p><strong>Orsimer<\/strong>, or Orcs, were once followers of the elven\ngod Trinimac. When the Daedric Prince Boethiah devoured Trinimac and\nremade him as Malacath, his followers were transformed with him.<\/p>\n<\/li>\n<\/ul>\n<h4 id=\"guide-a-brief-history-of-tamriel--the-men\">The Men<\/h4>\n<p>The Nedes were Tamriel's first humans, and many of them lived as\nAyleid slaves. Then Ysgramor led settlers across the sea from frozen\nAtmora, drove the Falmer out of Skyrim, and founded the Nords.<\/p>\n<p>In High Rock, Nedes interbred with the Direnni, a powerful Altmer\nclan, and became the Bretons. In Cyrodiil, the Ayleids' Nedic slaves\nbecame the Imperials. Much later, in the First Era, the Redguards\ncrossed the ocean from Yokuda and took Hammerfell by the sword.<\/p>\n<h4 id=\"guide-a-brief-history-of-tamriel--the-beastfolk\">The Beastfolk<\/h4>\n<p>Argonians and Khajiit didn't come from anywhere; they were already\nhere. Argonians are tied to the Hist, enormous sentient trees in Black\nMarsh whose sap shapes each hatchling. Khajiit take their form from the\nphases of the two moons on the night they are born.<\/p>\n<p>Being first has done them little good. Both peoples are widely\ndistrusted, and in Morrowind both can be legally enslaved.<\/p>\n<h4 id=\"guide-a-brief-history-of-tamriel--the-empires\">The Empires<\/h4>\n<p>In 1E 243, a Nedic slave named Alessia led a revolt that overthrew\nthe Ayleids. She became Saint Alessia, the first Empress of Men. The\ndragon god Akatosh gave her the Amulet of Kings as part of a holy\ncovenant.<\/p>\n<p>The Amulet matters to this day. While an emperor of Alessia's\nbloodline wears it and keeps the Dragonfires burning in the Imperial\nCity, the Daedra can't invade Mundus in force. It is the reason a living\nemperor is a matter of cosmic security, not just politics.<\/p>\n<p>Alessia's empire eventually collapsed. Reman Cyrodiil founded a\nsecond empire and threw back an invasion from Akavir. He took the\nsurviving Akaviri warriors into his service, and they became the\nemperor's bodyguards. Reman's dynasty ended in 1E 2920 with an\nassassination.<\/p>\n<p>After that, Akaviri chancellors called Potentates ruled for a few\ncenturies, until they too were assassinated. What followed was the\nInterregnum, meaning \"between reigns\": four hundred years of petty\nkingdoms at war and no emperor at all.<\/p>\n<p>In 2E 896, the general Tiber Septim conquered all of Tamriel, using\nNumidium, a giant brass war-golem built by the Dwemer. He founded the\nThird Empire, the one that rules today. After his death he became a god,\nworshipped as Talos, the ninth of the Nine Divines.<\/p>\n<h4 id=\"guide-a-brief-history-of-tamriel--the-third-era\">The Third Era<\/h4>\n<p>Tiber Septim's descendants, the Septim dynasty, have held the throne\never since, with a few interruptions.<\/p>\n<ul>\n<li>\n<p><strong>3E 121–127: the War of the Red Diamond.<\/strong> A civil war\nbetween rival Septim heirs, named after the dynasty's emblem.<\/p>\n<\/li>\n<li>\n<p><strong>3E 389–399: the Imperial Simulacrum.<\/strong> Jagar Tharn,\nthe Emperor's chief court wizard, trapped Uriel VII in Oblivion and\nruled for ten years wearing his face. A prisoner later remembered as the\nEternal Champion exposed him and freed the Emperor.<\/p>\n<\/li>\n<li>\n<p><strong>3E 417: the Warp in the West.<\/strong> This year, in the\nIliac Bay between High Rock and Hammerfell, rival kingdoms fought over a\nreawakened Numidium. Reality briefly broke, several outcomes happened at\nonce, and dozens of small kingdoms merged into a few. News of it is\nstill reaching Morrowind, and no two reports agree.<\/p>\n<\/li>\n<\/ul>\n<p>Today Uriel VII is old, the Empire is stable, and his Blades keep\nwatch. The Blades are the emperor's elite bodyguards and spies,\ndescended from Reman's Akaviri. By Tamrielic standards, this counts as\npeace.<\/p>\n<h3 id=\"guide-a-brief-history-of-tamriel--morrowind\">Morrowind<\/h3>\n<p>Morrowind is the Dunmer homeland, a harsh province of ash, fungus and\nvolcanoes in Tamriel's north-east. It was built on an exodus, a betrayal\nand a bargain, and its people still argue about all three.<\/p>\n<h4 id=\"guide-a-brief-history-of-tamriel--the-exodus\">The Exodus<\/h4>\n<p>The Chimer left Summerset under the prophet Veloth. They rejected the\nAltmer's Aedra and chose to worship three Daedric Princes instead:\nAzura, Boethiah and Mephala. The Dunmer still call these three the Good\nDaedra.<\/p>\n<p>In the east the Chimer found a hard land that the Dwemer already\nlived in. The two elven peoples despised each other for their gods, or\nlack of them.<\/p>\n<h4 id=\"guide-a-brief-history-of-tamriel--the-first-council\">The First Council<\/h4>\n<p>In the early First Era, the Nords of Skyrim conquered much of\nMorrowind. Indoril Nerevar, the greatest Chimer general, made an\nunlikely alliance with Dumac, king of the Dwemer. Together they drove\nthe Nords out, and their alliance became the First Council, ruling\nMorrowind jointly.<\/p>\n<h4 id=\"guide-a-brief-history-of-tamriel--red-mountain\">Red Mountain<\/h4>\n<p>Red Mountain is the volcano at the centre of Vvardenfell. Beneath it\nlies the Heart of Lorkhan, the still-beating heart of the god who\npersuaded the others to create Mundus. The other gods tore it out and\nflung it away as punishment, and it landed here.<\/p>\n<p>The Dwemer engineer Kagrenac discovered the Heart and built three\ntools to tap its power. His goal was to make a new god. Nerevar saw this\nas blasphemy and went to war, which ended at the Battle of Red Mountain\nin 1E 700. During the battle, the entire Dwemer race vanished from the\nworld in an instant. Nobody knows why.<\/p>\n<p>Nerevar died soon after. The Temple says it was his wounds; the\nAshlanders, the nomadic Dunmer tribes, say his own councillors murdered\nhim. Dagoth Ur, Nerevar's loyal retainer and the head of a sixth Great\nHouse, House Dagoth, was believed killed guarding the tools.<\/p>\n<p>Nerevar's three councillors, Almalexia, Sotha Sil and Vivec, then\nused Kagrenac's tools on the Heart and became living gods. They are the\nTribunal, also called ALMSIVI. Azura cursed the Chimer for the betrayal,\nturning their skin grey and their eyes red. The Chimer became the\nDunmer, the \"dark elves\".<\/p>\n<h4 id=\"guide-a-brief-history-of-tamriel--the-tribunals-age\">The Tribunal's Age<\/h4>\n<p>For thousands of years the Tribunal ruled Morrowind as gods who\nwalked among their people. They founded the Tribunal Temple and defended\nthe province against every invader. In 2E 572 they turned back another\ninvasion from Akavir, allying with the Nords and Argonians, Morrowind's\noldest enemies.<\/p>\n<p>In 2E 882, Dagoth Ur woke beneath Red Mountain, very much alive and\nfeeding on the Heart's power. The Tribunal raised the Ghostfence, a\nmagical barrier around the mountain, to keep him contained.<\/p>\n<h4 id=\"guide-a-brief-history-of-tamriel--the-armistice\">The Armistice<\/h4>\n<p>When Tiber Septim's legions reached Morrowind's border, Vivec chose\nto negotiate rather than fight. Under the Armistice, Morrowind joined\nthe Empire but kept its Temple, its Great Houses and its slaves. In\nexchange, Vivec handed over Numidium, the golem Septim then used to\nconquer the rest of Tamriel.<\/p>\n<h4 id=\"guide-a-brief-history-of-tamriel--morrowind-today\">Morrowind Today<\/h4>\n<p>King Athyn Llethan rules from the capital, Mournhold, on the\nmainland. In practice, real power belongs to the Temple and the Great\nHouses.<\/p>\n<p>The Great Houses are noble clans that work like rival political\nparties, each with its own lands, members and ideals. Anyone can join\none, outlanders included, if they prove useful.<\/p>\n<div class=\"tw\"><table><thead><tr><th>Great House<\/th><th>Known for<\/th><th>Holds land on Vvardenfell?<\/th><\/tr><\/thead><tbody><tr><td class=\"first\">Hlaalu<\/td><td>Merchants and dealmakers; friendly with the Empire<\/td><td>Yes<\/td><\/tr><tr><td class=\"first\">Redoran<\/td><td>Warriors bound by duty and honour; traditional<\/td><td>Yes<\/td><\/tr><tr><td class=\"first\">Telvanni<\/td><td>Reclusive wizard-lords who answer to no one<\/td><td>Yes<\/td><\/tr><tr><td class=\"first\">Indoril<\/td><td>Devout aristocrats, closely tied to the Temple<\/td><td>No<\/td><\/tr><tr><td class=\"first\">Dres<\/td><td>Plantation owners and the strongest defenders of slavery<\/td><td>No<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Imperial garrisons keep the peace and collect taxes. Slavery remains\nlegal; most slaves are Argonians and Khajiit. The Tribunal's power is\nfading, and the Temple insists it isn't.<\/p>\n<h3 id=\"guide-a-brief-history-of-tamriel--vvardenfell\">Vvardenfell<\/h3>\n<p>Vvardenfell is a large volcanic island off Morrowind's northern\ncoast, with Red Mountain at its heart. For centuries it was a Temple\npreserve: holy land, closed to anyone the Temple didn't approve. Three\nyears ago, in 3E 414, the Emperor opened it to settlement, and\noutlanders have been pouring in ever since. To the Dunmer, an outlander\nis anyone who isn't Dunmer.<\/p>\n<blockquote>\n<figure><img alt=\"\" loading=\"lazy\" src=\"img/b1fe3a75e2eb12c332fc8a7633f428c1282bd576.webp\"/><\/figure>\n<\/blockquote>\n<p><em>The island of Vvardenfell<\/em><\/p>\n<h4 id=\"guide-a-brief-history-of-tamriel--the-vvardenfell-district\">The Vvardenfell District<\/h4>\n<p>The island is now an Imperial district, governed for the Emperor by\nDuke Vedam Dren, an elderly Dunmer noble. He rules from Ebonheart, a\nfortress town across the bay from Vivec City. Colonists, miners,\nmerchants, adventurers and criminals arrive on every boat.<\/p>\n<p>Most newcomers land at Seyda Neen, a small swamp port where the\nImperial Census and Excise Office records every arrival. From there, the\nisland opens up.<\/p>\n<p><strong>Getting around.<\/strong> Silt striders are giant long-legged\ninsects; passengers ride inside their hollowed shells between the larger\ntowns. Boats work the coasts, and the Mages Guild will teleport you\nbetween its guildhalls for a fee.<\/p>\n<div class=\"tw\"><table><thead><tr><th>Region<\/th><th>What it's like<\/th><th>Notable places<\/th><\/tr><\/thead><tbody><tr><td class=\"first\">Ascadian Isles<\/td><td>Fertile farmland and plantations in the south<\/td><td>Vivec City, Ebonheart, Pelagiad, Suran<\/td><\/tr><tr><td class=\"first\">Bitter Coast<\/td><td>Fog-bound swamp in the south-west; smugglers' country<\/td><td>Seyda Neen, Hla Oad, Gnaar Mok<\/td><\/tr><tr><td class=\"first\">West Gash<\/td><td>Rugged hills along the west coast<\/td><td>Balmora, Caldera, Gnisis, Ald Velothi, Khuul<\/td><\/tr><tr><td class=\"first\">Ashlands<\/td><td>Grey ash wastes around the mountain<\/td><td>Ald'ruhn, Maar Gan, Urshilaku Camp<\/td><\/tr><tr><td class=\"first\">Red Mountain<\/td><td>The volcano, sealed behind the Ghostfence<\/td><td>Ghostgate<\/td><\/tr><tr><td class=\"first\">Molag Amur<\/td><td>Lava fields and broken rock in the south-east<\/td><td>Molag Mar, Erabenimsun Camp<\/td><\/tr><tr><td class=\"first\">Grazelands<\/td><td>Open grassland in the north-east<\/td><td>Vos, Tel Vos, Zainab Camp<\/td><\/tr><tr><td class=\"first\">Azura's Coast<\/td><td>Rocky islands and coves along the east<\/td><td>Sadrith Mora, Tel Aruhn, Tel Branora<\/td><\/tr><tr><td class=\"first\">Sheogorad<\/td><td>Windswept islets in the far north<\/td><td>Dagon Fel<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Key places<\/strong><\/p>\n<ul>\n<li>\n<p><strong>Vivec City:<\/strong> The Temple's holy city, built as huge\nstone districts standing in the sea. The god Vivec lives in its\npalace.<\/p>\n<\/li>\n<li>\n<p><strong>Ebonheart:<\/strong> The Duke's seat and the Imperial Legion's\nheadquarters on the island.<\/p>\n<\/li>\n<li>\n<p><strong>Balmora:<\/strong> A busy House Hlaalu trading town, and the\nclosest thing Vvardenfell has to a crossroads.<\/p>\n<\/li>\n<li>\n<p><strong>Ald'ruhn:<\/strong> House Redoran's stronghold, built inside\nthe empty shell of a gigantic crab.<\/p>\n<\/li>\n<li>\n<p><strong>Sadrith Mora:<\/strong> House Telvanni's seat, where wizards\nlive in towers grown from giant mushrooms.<\/p>\n<\/li>\n<li>\n<p><strong>Caldera:<\/strong> A new Imperial mining town, chartered by\nthe Empire and resented by the locals.<\/p>\n<\/li>\n<li>\n<p><strong>Ghostgate:<\/strong> The Temple fortress that guards the only\nroad through the Ghostfence.<\/p>\n<\/li>\n<\/ul>\n<h4 id=\"guide-a-brief-history-of-tamriel--powers-on-the-island\">Powers on the Island<\/h4>\n<p>Nobody rules Vvardenfell alone. Everyone is trying.<\/p>\n<div class=\"tw\"><table><thead><tr><th>Power<\/th><th>Seat<\/th><th>Who they are and what they want<\/th><\/tr><\/thead><tbody><tr><td class=\"first\">Duke Vedam Dren and the Legion<\/td><td>Ebonheart, and forts across the island<\/td><td>The Emperor's government and army; they want order, taxes and Imperial law<\/td><\/tr><tr><td class=\"first\">House Hlaalu<\/td><td>Balmora<\/td><td>Merchant house; they want profit, and the Empire's favour<\/td><\/tr><tr><td class=\"first\">House Redoran<\/td><td>Ald'ruhn<\/td><td>Warrior house; they want duty, honour and the old traditions kept<\/td><\/tr><tr><td class=\"first\">House Telvanni<\/td><td>Sadrith Mora<\/td><td>Wizard-lords; they want to practise magic without interference<\/td><\/tr><tr><td class=\"first\">Tribunal Temple<\/td><td>Vivec City<\/td><td>Morrowind's church; it wants orthodoxy, pilgrims and a working Ghostfence<\/td><\/tr><tr><td class=\"first\">Ashlanders<\/td><td>Four nomadic tribes in the wilds<\/td><td>Dunmer who reject the Houses and Temple; they want their land back, and the Nerevarine<\/td><\/tr><tr><td class=\"first\">Camonna Tong<\/td><td>Balmora<\/td><td>A Dunmer crime syndicate; it wants outlanders gone and the island's crime for itself<\/td><\/tr><tr><td class=\"first\">Sixth House<\/td><td>Red Mountain<\/td><td>Dagoth Ur's secret cult, named for his lost Great House; it wants him free<\/td><\/tr><\/tbody><\/table><\/div>\n<p>The Temple enforces its law through <strong>Ordinators<\/strong>,\nmasked holy warriors, and the <strong>Buoyant Armigers<\/strong>, Vivec's\npersonal knights. The Imperial guilds also operate in most towns: the\nFighters Guild for hire, the Mages Guild for magic, and the Thieves\nGuild for everything else.<\/p>\n<p>The <strong>Morag Tong<\/strong> are legal assassins, licensed by the\nTemple. A killing carried out under one of their official writs is\nlawful. Killing without a writ is plain murder.<\/p>\n<h4 id=\"guide-a-brief-history-of-tamriel--red-mountain-and-the-blight\">Red Mountain and the Blight<\/h4>\n<p>The Ghostfence circles Red Mountain. It is built from the bones and\nspirits of Dunmer ancestors and powered by the Tribunal's divine\nstrength. Temple warriors guard its only gate at Ghostgate.<\/p>\n<p>The fence holds Dagoth Ur in, but not his influence. Blight storms\nroll out of the mountain, carrying blight diseases that drive animals\nmad and kill people slowly. Some victims catch corprus instead: an\nincurable disease that twists flesh and mind, and makes its victims\nnearly impossible to kill.<\/p>\n<p>Dagoth Ur's followers call him the Sharmat. Across the island,\nordinary people dream of him, and some wake as his Sleepers: agents who\nserve the Sixth House while living ordinary lives.<\/p>\n<h4 id=\"guide-a-brief-history-of-tamriel--the-nerevarine-prophecy\">The Nerevarine Prophecy<\/h4>\n<p>The Ashlanders believe Nerevar will be reborn as the Nerevarine: an\noutlander of unknown parents, born on a fated day. He will unite the\ntribes, cast down the Tribunal as false gods, and drive out the\nforeigners.<\/p>\n<p>The Temple calls this heresy, because the prophecy accuses the\nTribunal of murdering Nerevar. Anyone who claims to be the Nerevarine is\narrested. Many have claimed it, and every one of them has failed.<\/p>\n<p>None of the player characters are the Nerevarine. On Vvardenfell, the\nprophecy is background noise, for now.<\/p>\n<h4 id=\"guide-a-brief-history-of-tamriel--current-tensions\">Current Tensions<\/h4>\n<ul>\n<li>\n<p><strong>The blight is worsening.<\/strong> Storms come more often, and\nmore people are dreaming of the Sharmat.<\/p>\n<\/li>\n<li>\n<p><strong>The Houses are competing.<\/strong> Hlaalu courts the Empire\nfor advantage. Redoran resents both Hlaalu and the Empire.<\/p>\n<\/li>\n<li>\n<p><strong>The Telvanni are expanding.<\/strong> Their wizards raise new\ntowers wherever they please and ignore any law but their own.<\/p>\n<\/li>\n<li>\n<p><strong>There's a crime war in Balmora.<\/strong> The Camonna Tong and\nthe Thieves Guild are fighting quietly for control.<\/p>\n<\/li>\n<li>\n<p><strong>Escaped slaves are on the run.<\/strong> The Twin Lamps, a\nsecret abolitionist network, smuggle slaves to freedom; slavers hunt\nthem.<\/p>\n<\/li>\n<li>\n<p><strong>Dwemer ruins are being looted.<\/strong> Treasure hunters\nflood the ruins, and nobody agrees who owns what's inside.<\/p>\n<\/li>\n<li>\n<p><strong>Resentment is rising.<\/strong> Outlanders keep arriving, and\nso does Dunmer anger at them.<\/p>\n<\/li>\n<\/ul>\n"},{"id":"guide-the-gods-of-tamriel","t":"The Gods of Tamriel","s":[{"id":"guide-the-gods-of-tamriel--gods-who-answer","t":"Gods Who Answer","l":2},{"id":"guide-the-gods-of-tamriel--the-divine-order","t":"The Divine Order","l":2},{"id":"guide-the-gods-of-tamriel--the-nine-divines","t":"The Nine Divines","l":2},{"id":"guide-the-gods-of-tamriel--fringe-aedra","t":"Fringe Aedra","l":2},{"id":"guide-the-gods-of-tamriel--the-tribunal","t":"The Tribunal","l":2},{"id":"guide-the-gods-of-tamriel--the-daedric-princes","t":"The Daedric Princes","l":2},{"id":"guide-the-gods-of-tamriel--the-good-daedra","t":"The Good Daedra","l":3},{"id":"guide-the-gods-of-tamriel--the-house-of-troubles","t":"The House of Troubles","l":3},{"id":"guide-the-gods-of-tamriel--the-rest","t":"The Rest","l":3},{"id":"guide-the-gods-of-tamriel--losing-favour-optional-rules","t":"Losing Favour (Optional Rules)","l":2}],"p":"The World","sub":"Divines, Tribunal and Princes","h":"\n\n\n<div class=\"epigraph\">\n<p><em>“Pray to the Nine, bow to the Three, and never name the Sixth\naloud.”<\/em><\/p>\n<\/div>\n<div class=\"attribution\">\n<p>— A pilgrim's warning, Vivec<\/p>\n<\/div>\n<h3 id=\"guide-the-gods-of-tamriel--gods-who-answer\">Gods Who Answer<\/h3>\n<p class=\"dropcap\">In Tamriel, the gods are not a matter of opinion.\nThey are real, they are close, and several of them want something from\nyou.<\/p>\n<p>This chapter explains where divine power comes from and who the gods\nare, and ends with optional rules for losing favour. To choose a god or\npatron for your character, see <a class=\"xref\" href=\"#guide-your-faith\">Step\nSix<\/a>.<\/p>\n<h3 id=\"guide-the-gods-of-tamriel--the-divine-order\">The Divine Order<\/h3>\n<p>Divine power in Tamriel comes from three sources. What separates them\nis what each one gave up, or refused to.<\/p>\n<div class=\"tw\"><table><thead><tr><th>Power<\/th><th>What they are<\/th><th>How they reach mortals<\/th><th>Natural fit<\/th><\/tr><\/thead><tbody><tr><td class=\"first\">Aedra<\/td><td>Gods who spent much of their power creating the mortal world, and are bound and diminished by it<\/td><td>Through prayer, temples and priesthoods; rarely in person<\/td><td>Cleric, paladin<\/td><\/tr><tr><td class=\"first\">Daedra<\/td><td>Princes of Oblivion who refused to help create the world, and stayed whole<\/td><td>Directly, through shrines, artifacts, quests and bargains<\/td><td>Warlock, cleric, paladin<\/td><\/tr><tr><td class=\"first\">Tribunal<\/td><td>Three mortal Chimer who became gods by tapping the Heart of Lorkhan<\/td><td>In person, through the Temple and its Ordinators<\/td><td>Cleric, paladin<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Daedra are not demons by default. Azura is kinder than some Divines.\nThey are simply unbound, and they keep their own counsel.<\/p>\n<p>The Tribunal's power is waning. They would prefer you didn't mention\nit.<\/p>\n<h3 id=\"guide-the-gods-of-tamriel--the-nine-divines\">The Nine Divines<\/h3>\n<p>The Nine are the Imperial Cult's pantheon: respectable, well funded,\nand a little foreign on Vvardenfell. Typical cleric alignments are given\nafter each entry.<\/p>\n<ul>\n<li>\n<p><strong>Akatosh<\/strong>, the Dragon God of Time. Chief of the Nine;\ngod of endurance and the legitimacy of rulers. Emperors claim his\nblessing. <em>Clerics: LG or LN.<\/em><\/p>\n<\/li>\n<li>\n<p><strong>Arkay<\/strong>, god of life and death. Birth, burial, the\nseasons, and the proper ending of things. His clerics hunt necromancers\nand the undead. <em>Clerics: LN or NG.<\/em><\/p>\n<\/li>\n<li>\n<p><strong>Dibella<\/strong>, goddess of beauty, art, love and\ninspiration. Her followers are artists, lovers and patrons. <em>Clerics:\nNG or CG.<\/em><\/p>\n<\/li>\n<li>\n<p><strong>Julianos<\/strong>, god of wisdom and logic, law, history,\nliterature and magic. Popular with scholars, judges and mages.\n<em>Clerics: LN or LG.<\/em><\/p>\n<\/li>\n<li>\n<p><strong>Kynareth<\/strong>, goddess of the heavens, sky, wind, rain\nand the natural world. Sailors and travellers pray to her. <em>Clerics:\nNG or N.<\/em><\/p>\n<\/li>\n<li>\n<p><strong>Mara<\/strong>, the mother goddess. Love, compassion, marriage\nand fertility are her domain. Her temples heal the sick and marry\ncouples. <em>Clerics: NG or LG.<\/em><\/p>\n<\/li>\n<li>\n<p><strong>Stendarr<\/strong>, god of mercy, charity, justice and\nrighteous might. His Vigilants hunt Daedra and their worshippers.\n<em>Clerics: LG; Vigilants drift towards LN.<\/em><\/p>\n<\/li>\n<li>\n<p><strong>Zenithar<\/strong>, god of work and commerce, trade, craft and\nhonest profit. Merchants and smiths favour him. <em>Clerics: LN or\nLG.<\/em><\/p>\n<\/li>\n<li>\n<p><strong>Talos<\/strong>, Tiber Septim made a god. War, statecraft and\nthe Empire are his domain. In 3E he is fully orthodox. <em>Clerics: LN\nor LG.<\/em><\/p>\n<\/li>\n<\/ul>\n<h3 id=\"guide-the-gods-of-tamriel--fringe-aedra\">Fringe Aedra<\/h3>\n<p>Every province keeps its own gods alongside or instead of the Nine.\nTwo are worth knowing on Vvardenfell.<\/p>\n<ul>\n<li>\n<p><strong>Y'ffre<\/strong>, the Bosmer god of the forest. Keeper of the\nGreen Pact and patron of storytellers. Rarely seen this far east.\n<em>Clerics: N or NG.<\/em><\/p>\n<\/li>\n<li>\n<p><strong>Lorkhan<\/strong>, the Missing God, called Shor by the Nords.\nHe talked the other gods into making the world and was killed for it.\nHis heart lies beneath Red Mountain. <em>Clerics: CN.<\/em><\/p>\n<\/li>\n<\/ul>\n<p>A cleric of a dead god is a perfectly good build. Expect the DM to\ntake an interest.<\/p>\n<p>Other regional gods, such as the Nordic or Redguard pantheons, are\navailable if you ask.<\/p>\n<h3 id=\"guide-the-gods-of-tamriel--the-tribunal\">The Tribunal<\/h3>\n<p>ALMSIVI are three living gods who rule Morrowind in person. Of all\nthe gods in this chapter, they are the most likely to check on their\nclerics.<\/p>\n<ul>\n<li>\n<p><strong>Almalexia<\/strong>, Mother Morrowind. Mercy, healing and the\nDunmer people are her domain. She rules from Mournhold, the capital of\nMorrowind. <em>Clerics: LG or LN.<\/em><\/p>\n<\/li>\n<li>\n<p><strong>Sotha Sil<\/strong>, the Clockwork God. He presides over\nmystery, magic and invention. Rarely seen, often theorised about.\n<em>Clerics: LN.<\/em><\/p>\n<\/li>\n<li>\n<p><strong>Vivec<\/strong>, the Warrior-Poet. He is the lord of mastery,\nprotection and contradiction. He rules from Vivec City and guards\nVvardenfell. <em>Clerics: LN or LG; Ordinators lean LN.<\/em><\/p>\n<\/li>\n<\/ul>\n<p><strong>Dagoth Ur is not a Tribunal god.<\/strong> He is their old\nrival, a would-be god sleeping in Red Mountain who never quite died.\nThrough the Sixth House he offers power in dreams, and he suits a\nwarlock with a Great Old One patron. Everyone will try to kill you, with\ngood reason.<\/p>\n<h3 id=\"guide-the-gods-of-tamriel--the-daedric-princes\">The Daedric Princes<\/h3>\n<p>There are seventeen Princes, counting the one who is currently\nmissing. On Vvardenfell, the Temple sorts them into three groups.<\/p>\n<h4 id=\"guide-the-gods-of-tamriel--the-good-daedra\">The Good Daedra<\/h4>\n<p>These three are honoured by the Temple and the Ashlanders alike.<\/p>\n<ul>\n<li>\n<p><strong>Azura<\/strong>, Queen of Dawn and Dusk. Twilight, prophecy\nand the moments in between. Patron of the Chimer exodus and the\nNerevarine prophecy. She protects her people fiercely, and cursed them\ngrey when they betrayed her. <em>Clerics: NG or CN.<\/em><\/p>\n<\/li>\n<li>\n<p><strong>Boethiah<\/strong>, Prince of Plots. Deceit, conspiracy,\nbetrayal and the overthrow of rulers. The prophet who led the Chimer\naway from the Altmer. <em>Clerics: CN or CE.<\/em><\/p>\n<\/li>\n<li>\n<p><strong>Mephala<\/strong>, the Webspinner. Secrets, lies, murder and\nsex. Patron of the Morag Tong, Morrowind's legal assassins. <em>Clerics:\nNE or N.<\/em><\/p>\n<\/li>\n<\/ul>\n<h4 id=\"guide-the-gods-of-tamriel--the-house-of-troubles\">The House of Troubles<\/h4>\n<p>The Temple teaches that these four exist to test the Dunmer. Their\nworshippers are hunted by Ordinators.<\/p>\n<ul>\n<li>\n<p><strong>Malacath<\/strong>, god of the shunned. Outcasts, sworn oaths\nand blood curses. Patron of the Orcs, and once the Aedra Trinimac until\nBoethiah ate him. <em>Clerics: LN or N.<\/em><\/p>\n<\/li>\n<li>\n<p><strong>Mehrunes Dagon<\/strong>, Prince of Destruction. Ruin,\nrevolution and ambition. <em>Clerics: CE.<\/em><\/p>\n<\/li>\n<li>\n<p><strong>Molag Bal<\/strong>, Prince of Domination. Corruption and the\nenslavement of mortal souls. Father of vampires. <em>Clerics:\nLE.<\/em><\/p>\n<\/li>\n<li>\n<p><strong>Sheogorath<\/strong>, the Mad God. Madness, in every sense.\n<em>Clerics: CN, in the truest sense.<\/em><\/p>\n<\/li>\n<\/ul>\n<h4 id=\"guide-the-gods-of-tamriel--the-rest\">The Rest<\/h4>\n<p>Worshipping any of these on Vvardenfell is heresy.<\/p>\n<ul>\n<li>\n<p><strong>Clavicus Vile<\/strong>, Prince of bargains. Wishes and pacts,\nalways with a catch. He travels with Barbas, his talking dog and better\nhalf. <em>Clerics: NE or CN.<\/em><\/p>\n<\/li>\n<li>\n<p><strong>Hermaeus Mora<\/strong>, Prince of knowledge. Memory and fate.\nHe wants to know everything, including you. <em>Clerics: N or\nNE.<\/em><\/p>\n<\/li>\n<li>\n<p><strong>Hircine<\/strong>, the Huntsman. The hunt, sport and\nlycanthropy. <em>Clerics: N or CN.<\/em><\/p>\n<\/li>\n<li>\n<p><strong>Meridia<\/strong>, Lady of Infinite Energies. Life and light;\ndestroyer of the undead. Righteous, and tiresome about it. <em>Clerics:\nLG or LN.<\/em><\/p>\n<\/li>\n<li>\n<p><strong>Namira<\/strong>, Prince of decay. Ancient darkness, spirits\nand revulsion; patron of beggars and outcasts. <em>Clerics: NE or\nCN.<\/em><\/p>\n<\/li>\n<li>\n<p><strong>Nocturnal<\/strong>, Prince of night. Shadow, luck and\nthieves. <em>Clerics: N or CN.<\/em><\/p>\n<\/li>\n<li>\n<p><strong>Peryite<\/strong>, the Taskmaster. Order in the lowest reaches\nof Oblivion, enforced by plague. <em>Clerics: LN or LE.<\/em><\/p>\n<\/li>\n<li>\n<p><strong>Sanguine<\/strong>, Prince of revelry. Debauchery and\nhedonism. <em>Clerics: CN.<\/em><\/p>\n<\/li>\n<li>\n<p><strong>Vaermina<\/strong>, Prince of dreams. Nightmares and evil\nomens. <em>Clerics: NE or CE.<\/em><\/p>\n<\/li>\n<li>\n<p><strong>Jyggalag<\/strong>, Prince of Order. Logic, order and\nprediction. In 3E 417 he is trapped in the form of Sheogorath, so his\nworship is obscure and lonely. <em>Clerics: LN or LE.<\/em><\/p>\n<\/li>\n<\/ul>\n<h3 id=\"guide-the-gods-of-tamriel--losing-favour-optional-rules\">Losing Favour (Optional\nRules)<\/h3>\n<p>Each path fails in its own way. These variant rules give that failure\nteeth without ending your character.<\/p>\n<p><strong>Clerics: displeasure.<\/strong> Acting against your god's\ntenets escalates through three stages.<\/p>\n<ol type=\"1\">\n<li>\n<p><strong>Omen.<\/strong> A cold shrine, a bad dream, a warning sign. No\nmechanical effect.<\/p>\n<\/li>\n<li>\n<p><strong>Silence.<\/strong> You can't use Channel Divinity until you\natone.<\/p>\n<\/li>\n<li>\n<p><strong>Abandonment.<\/strong> You also lose your domain spells until\nyou atone.<\/p>\n<\/li>\n<\/ol>\n<p>Atonement is a pilgrimage, a penance or a quest set by the DM. It\nreturns you to full favour.<\/p>\n<p><strong>Paladins: broken oaths.<\/strong> The same three stages apply,\nbut the trigger is breaking your oath, not angering your god. A wilful,\nunrepented breach leads to atonement or to the Oathbreaker*.<\/p>\n<p><strong>Warlocks: debts.<\/strong> Once per milestone, your patron may\ncall in a favour: a task, a theft, a delivery or a death. If you refuse,\nthe patron withholds one invocation until the debt is paid. Patrons\nrarely care how a job is done, only that it is.<\/p>\n<p><strong>Changing gods.<\/strong> Possible, never cheap.<\/p>\n<ul>\n<li>\n<p><strong>Clerics and paladins<\/strong> need a crisis of faith and a\nconversion; treat this as a subclass change at your next milestone.<\/p>\n<\/li>\n<li>\n<p><strong>Warlocks<\/strong> must break their contract first. The old\npatron will remember.<\/p>\n<\/li>\n<\/ul>\n"},{"id":"guide-glossary","t":"Glossary","s":[{"id":"guide-glossary--words-of-the-island","t":"Words of the Island","l":2},{"id":"guide-glossary--people-and-forms-of-address","t":"People and Forms of Address","l":2},{"id":"guide-glossary--faith-and-prophecy","t":"Faith and Prophecy","l":2},{"id":"guide-glossary--powers-and-factions","t":"Powers and Factions","l":2},{"id":"guide-glossary--places","t":"Places","l":2},{"id":"guide-glossary--daily-life","t":"Daily Life","l":2}],"p":"The World","sub":"Words You'll Hear on Vvardenfell","h":"\n\n\n<div class=\"epigraph\">\n<p><em>“Learn the word n'wah early. You will hear it often.”<\/em><\/p>\n<\/div>\n<div class=\"attribution\">\n<p>— Advice to new arrivals, Seyda Neen<\/p>\n<\/div>\n<h3 id=\"guide-glossary--words-of-the-island\">Words of the Island<\/h3>\n<p class=\"dropcap\">Vvardenfell has a vocabulary all its own. These are\nthe words you're most likely to hear in your first weeks on the island,\ngrouped by subject. Pronunciations are rough guides. Nobody will correct\nyou except the Dunmer, who will correct you about everything.<\/p>\n<h3 id=\"guide-glossary--people-and-forms-of-address\">People and Forms of Address<\/h3>\n<p><em><strong>Altmer<\/strong><\/em> <em>(ALT-mer).<\/em> The high elves\nof the Summerset Isles.<\/p>\n<p><em><strong>Argonians.<\/strong><\/em> The reptilian people of Black\nMarsh, who call themselves the Saxhleel, the People of the Root.<\/p>\n<p><em><strong>Bosmer<\/strong><\/em> <em>(BOZ-mer).<\/em> The wood elves\nof Valenwood.<\/p>\n<p><em><strong>Chimer.<\/strong><\/em> The ancestors of the Dunmer, before\nAzura's curse turned their skin grey and their eyes red.<\/p>\n<p><em><strong>Dunmer<\/strong><\/em> <em>(DUN-mer).<\/em> The dark elves,\nMorrowind's native people.<\/p>\n<p><em><strong>Dwemer<\/strong><\/em> <em>(DWEH-mer).<\/em> The \"deep\nelves\", called dwarves by outsiders, though they were never short. They\nvanished all at once, thousands of years ago, and left ruins full of\nworking machines.<\/p>\n<p><em><strong>Khajiit<\/strong><\/em> <em>(kah-JEET).<\/em> The cat-folk\nof Elsweyr.<\/p>\n<p><em><strong>Mer.<\/strong><\/em> Elves. The Altmer, Bosmer, Dunmer,\nOrsimer and the vanished Dwemer are all mer.<\/p>\n<p><em><strong>Men.<\/strong><\/em> The human races: Bretons, Imperials,\nNords and Redguards.<\/p>\n<p><em><strong>Orsimer<\/strong><\/em> <em>(OR-sih-mer).<\/em> The orcs'\nown name for themselves. It means \"Pariah Folk\".<\/p>\n<p><em><strong>Outlander.<\/strong><\/em> Anyone who isn't a Dunmer of\nMorrowind. It's polite enough, but it's never a compliment.<\/p>\n<p><em><strong>N'wah<\/strong><\/em> <em>(n-WAH).<\/em> An insult for\noutlanders, somewhere between \"foreigner\" and \"slave\".<\/p>\n<p><em><strong>S'wit<\/strong><\/em> <em>(SWIT).<\/em> An insult, roughly\n\"idiot\", used on outlanders and Dunmer alike.<\/p>\n<p><em><strong>Sera<\/strong><\/em> <em>(SEH-rah).<\/em> The polite way to\naddress anyone, like \"sir\" or \"madam\".<\/p>\n<p><em><strong>Muthsera<\/strong><\/em> <em>(MOOTH-seh-rah).<\/em> A more\nformal \"sera\", for someone you need to impress.<\/p>\n<p><em><strong>Serjo<\/strong><\/em> <em>(SER-joh).<\/em> The title of a\nlord or councillor of a Great House.<\/p>\n<h3 id=\"guide-glossary--faith-and-prophecy\">Faith and Prophecy<\/h3>\n<p><em><strong>Aedra<\/strong><\/em> <em>(AY-drah).<\/em> The gods who gave\nup much of their power to create the world. The Nine Divines are\nAedra.<\/p>\n<p><em><strong>Daedra<\/strong><\/em> <em>(DAY-drah).<\/em> Spirits of\nOblivion who refused to help create the world. The mightiest are the\nDaedric Princes. They aren't demons by default.<\/p>\n<p><em><strong>Almsivi<\/strong><\/em> <em>(alm-SEE-vee).<\/em> The\nTribunal named as one, from Almalexia, Sotha Sil and Vivec.<\/p>\n<p><em><strong>Tribunal.<\/strong><\/em> The three living gods of the\nDunmer, who rule Morrowind in person.<\/p>\n<p><em><strong>The Temple.<\/strong><\/em> The Tribunal Temple,\nMorrowind's state church.<\/p>\n<p><em><strong>Imperial Cult.<\/strong><\/em> The Empire's church of the\nNine Divines.<\/p>\n<p><em><strong>Nine Divines.<\/strong><\/em> The gods of the Empire: eight\nAedra, plus Talos, the first emperor Tiber Septim raised to godhood.<\/p>\n<p><em><strong>Good Daedra.<\/strong><\/em> Azura, Boethiah and Mephala,\nwhom the Temple honours as forerunners of the Tribunal.<\/p>\n<p><em><strong>House of Troubles.<\/strong><\/em> Malacath, Mehrunes\nDagon, Molag Bal and Sheogorath, the four Daedra the Temple says exist\nto test the Dunmer.<\/p>\n<p><em><strong>Ordinator<\/strong><\/em> <em>(OR-dih-nay-tor).<\/em> One of\nthe Temple's masked, armoured guards. They enforce doctrine and hunt\nheretics. Don't argue with one.<\/p>\n<p><em><strong>Buoyant Armigers<\/strong><\/em> <em>(AR-mih-jerz).<\/em>\nVivec's own order of knights, known for their poetry as much as their\nswordwork.<\/p>\n<p><em><strong>Ancestor veneration.<\/strong><\/em> The Dunmer custom of\nhonouring the family dead, whose spirits guard the family tomb. Robbing\na tomb is an insult to the whole family.<\/p>\n<p><em><strong>Nerevar<\/strong><\/em> <em>(NEH-reh-var).<\/em> Indoril\nNerevar, the Chimer general who allied his people with the Dwemer and\ndied after the Battle of Red Mountain.<\/p>\n<p><em><strong>Nerevarine<\/strong><\/em> <em>(neh-REH-vah-reen).<\/em>\nNerevar reborn, as Ashlander prophecy foretells. The Temple calls the\nprophecy heresy.<\/p>\n<p><em><strong>Sixth House.<\/strong><\/em> The cult of Dagoth Ur, once a\nGreat House of its own. It spreads through dreams, and its followers are\nkilled on sight.<\/p>\n<p><em><strong>Dagoth Ur<\/strong><\/em> <em>(DAH-goth OOR).<\/em> The\nwould-be god who sleeps beneath Red Mountain and leads the Sixth\nHouse.<\/p>\n<h3 id=\"guide-glossary--powers-and-factions\">Powers and Factions<\/h3>\n<p><em><strong>Great Houses.<\/strong><\/em> The Dunmer noble clans that\ngovern Morrowind. Three hold power on Vvardenfell: Hlaalu, Redoran and\nTelvanni.<\/p>\n<p><em><strong>Hlaalu<\/strong><\/em> <em>(HLAH-loo).<\/em> The Great House\nof merchants and dealmakers, and the friendliest to the Empire. Its seat\non the island is Balmora.<\/p>\n<p><em><strong>Redoran<\/strong><\/em> <em>(REH-doh-ran).<\/em> The Great\nHouse of warriors, bound by duty and honour. Its seat is Ald'ruhn.<\/p>\n<p><em><strong>Telvanni<\/strong><\/em> <em>(tel-VAH-nee).<\/em> The Great\nHouse of reclusive wizard-lords, who grow their towers from giant\nmushrooms. Its seat is Sadrith Mora.<\/p>\n<p><em><strong>Ashlanders.<\/strong><\/em> The nomadic Dunmer tribes of\nthe wastes, who reject the Temple and keep the old ways.<\/p>\n<p><em><strong>Imperial Legion.<\/strong><\/em> The Empire's army, with\nforts and garrisons across the island.<\/p>\n<p><em><strong>East Empire Company.<\/strong><\/em> The Imperial trading\ncompany that runs much of the island's trade.<\/p>\n<p><em><strong>Census and Excise.<\/strong><\/em> The Imperial office that\nregisters new arrivals and collects taxes.<\/p>\n<p><em><strong>The guilds.<\/strong><\/em> The Fighters Guild, the Mages\nGuild and, unofficially, the Thieves Guild. All three are Imperial\nimports with halls in the larger towns.<\/p>\n<p><em><strong>Blades.<\/strong><\/em> The emperor's elite bodyguards and\nspies.<\/p>\n<p><em><strong>Camonna Tong<\/strong><\/em> <em>(kah-MOH-nah TONG).<\/em> A\nDunmer crime syndicate that wants outlanders gone.<\/p>\n<p><em><strong>Morag Tong<\/strong><\/em> <em>(MOR-ag TONG).<\/em> A legal\nguild of assassins. A killing carried out under one of their writs is\nlawful.<\/p>\n<p><em><strong>Twin Lamps.<\/strong><\/em> A secret network that helps\nslaves escape.<\/p>\n<h3 id=\"guide-glossary--places\">Places<\/h3>\n<p><em><strong>Morrowind.<\/strong><\/em> The Dunmer homeland, now a\nprovince of the Empire.<\/p>\n<p><em><strong>Vvardenfell<\/strong><\/em> <em>(VAR-den-fell).<\/em> The\nisland at the heart of Morrowind, governed as an Imperial district.<\/p>\n<p><em><strong>Mournhold.<\/strong><\/em> The capital of Morrowind, on the\nmainland, and Almalexia's city.<\/p>\n<p><em><strong>Cyrodiil<\/strong><\/em> <em>(SEER-oh-deel).<\/em> The\nImperial heartland, at the centre of Tamriel.<\/p>\n<p><em><strong>Ebonheart.<\/strong><\/em> The Imperial port on the south\ncoast, and the seat of the island's government.<\/p>\n<p><em><strong>Vivec<\/strong><\/em> <em>(VIV-ek).<\/em> Both the\nwarrior-poet god and his holy city beside Ebonheart, built as huge stone\ndistricts called cantons.<\/p>\n<p><em><strong>Balmora<\/strong><\/em> <em>(bal-MOR-ah).<\/em> The largest\ntown in the west, and House Hlaalu's seat.<\/p>\n<p><em><strong>Ald'ruhn<\/strong><\/em> <em>(ALD-roon).<\/em> House\nRedoran's town in the Ashlands, built in and around the shell of a giant\ncrab.<\/p>\n<p><em><strong>Sadrith Mora<\/strong><\/em> <em>(SAD-rith MOR-ah).<\/em>\nHouse Telvanni's town on an island off the east coast.<\/p>\n<p><em><strong>Seyda Neen<\/strong><\/em> <em>(SAY-dah NEEN).<\/em> A small\nport on the Bitter Coast, where Census and Excise processes many\nnewcomers.<\/p>\n<p><em><strong>Red Mountain.<\/strong><\/em> The volcano at the island's\ncentre, and Dagoth Ur's lair.<\/p>\n<p><em><strong>Ashlands.<\/strong><\/em> The barren ash wastes around Red\nMountain.<\/p>\n<p><em><strong>Ghostfence.<\/strong><\/em> The Temple's magical barrier\naround Red Mountain, which keeps the worst of it in.<\/p>\n<p><em><strong>Blight.<\/strong><\/em> Diseases carried on ash storms from\nRed Mountain.<\/p>\n<p><em><strong>Corprus.<\/strong><\/em> An incurable disease from Dagoth\nUr that twists flesh and mind.<\/p>\n<p><em><strong>Oblivion.<\/strong><\/em> The realms of the Daedra.<\/p>\n<h3 id=\"guide-glossary--daily-life\">Daily Life<\/h3>\n<p><em><strong>Drake.<\/strong><\/em> A gold piece.<\/p>\n<p><em><strong>Silt strider.<\/strong><\/em> A giant insect that carries\npassengers between towns in a cabin built into its shell.<\/p>\n<p><em><strong>Guar<\/strong><\/em> <em>(GWAR).<\/em> A sturdy two-legged\nlizard, used as a pack animal.<\/p>\n<p><em><strong>Netch.<\/strong><\/em> Huge floating creatures, like\njellyfish of the air. Their hides make netch leather.<\/p>\n<p><em><strong>Kwama<\/strong><\/em> <em>(KWAH-mah).<\/em> Insect-like\ncreatures farmed in egg mines. Their eggs are a staple food, and their\nyoung are called scribs.<\/p>\n<p><em><strong>Cliff racer.<\/strong><\/em> A flying, screeching pest, and\nthe island's most hated animal.<\/p>\n<p><em><strong>Mazte<\/strong><\/em> <em>(MAHZ-tay).<\/em> A cheap Dunmer\nbeer.<\/p>\n<p><em><strong>Sujamma<\/strong><\/em> <em>(soo-JAH-mah).<\/em> A strong\nDunmer liquor.<\/p>\n<p><em><strong>Moon sugar and skooma.<\/strong><\/em> A Khajiiti spice,\nand the addictive drug refined from it. Both are illegal in\nMorrowind.<\/p>\n"}]},{"key":"items","title":"Treasures of Morrowind","short":"Treasures","sub":"Gear, magic, services, crafting and enchanting","chapters":[{"id":"items-using-this-book","t":"Using This Book","s":[{"id":"items-using-this-book--whats-inside","t":"What's Inside","l":2},{"id":"items-using-this-book--prices-and-rarity","t":"Prices and Rarity","l":2},{"id":"items-using-this-book--merchants-purses","t":"Merchants' Purses","l":2},{"id":"items-using-this-book--silver-and-better","t":"Silver and Better","l":2},{"id":"items-using-this-book--restricted-goods","t":"Restricted Goods","l":2}],"h":"\n\n<div class=\"epigraph\">\n<p><em>“Everything on Vvardenfell has a price, and it's usually higher\nthan you'd like.”<\/em><\/p>\n<\/div>\n<div class=\"attribution\">\n<p>— A pawnbroker in Balmora<\/p>\n<\/div>\n<h3 id=\"items-using-this-book--whats-inside\">What's Inside<\/h3>\n<p class=\"dropcap\">This book gathers the gear and treasures of\nMorrowind for a D&amp;D campaign using the 2024 rules: what people wear,\nwhat they fight with, the magic they carry, the relics of gods and\nPrinces, and the potions and ingredients that tie it all together. It's\narranged in chapters:<\/p>\n<ul>\n<li>\n<p><strong>Chapter One: Armour and Clothing.<\/strong> From netch leather\nto Daedric plate, and from homespun to Telvanni silk.<\/p>\n<\/li>\n<li>\n<p><strong>Chapter Two: Weapons.<\/strong> The blades, axes, bows and\nspears of the island, and the materials they're forged from.<\/p>\n<\/li>\n<li>\n<p><strong>Chapter Three: Tools and Equipment.<\/strong> Lockpicks,\nprobes, armourer's hammers, alchemy apparatus and the rest of an\nadventurer's kit.<\/p>\n<\/li>\n<li>\n<p><strong>Chapter Four: Services and Travel.<\/strong> What it costs to\ntravel, rest, heal, train and buy spells on Vvardenfell, and to break\nthe law.<\/p>\n<\/li>\n<li>\n<p><strong>Chapter Five: Magic Items.<\/strong> The enchanted rings,\namulets, weapons, armour and scrolls an adventurer can hope to find or\nbuy.<\/p>\n<\/li>\n<li>\n<p><strong>Chapter Six: Artefacts.<\/strong> The legendary relics of the\nDaedric Princes and the gods.<\/p>\n<\/li>\n<li>\n<p><strong>Chapter Seven: Potions.<\/strong> What the island's alchemists\nbrew and sell.<\/p>\n<\/li>\n<li>\n<p><strong>Chapter Eight: Ingredients.<\/strong> Everything a potion is\nmade from, including the drops listed in the <em>Bestiary of\nMorrowind<\/em>.<\/p>\n<\/li>\n<\/ul>\n<p><strong>New characters<\/strong> only need Chapters One to Three, and\nonly if they buy their own gear instead of taking a starting package\n(see <a class=\"xref\" href=\"#guide-starting-equipment\">Step Seven<\/a> of the\nPlayer's Guide). The rest of the book matters once you're on the island:\nservices, magic, potions and ingredients.<\/p>\n<p><strong>Making things.<\/strong> The rules for crafting gear, wear and\nrepair, brewing potions, soul gems and enchanting are in the House Rules\nof the <em>Player's Guide<\/em> (see <a class=\"xref\" href=\"#guide-house-rules--house-rules-at-a-glance\">House Rules at a Glance<\/a>).\nThis book has the prices and the goods.<\/p>\n<p>Most of this book is fine to share with players. Chapter Six is best\nkept for the Dungeon Master.<\/p>\n<h3 id=\"items-using-this-book--prices-and-rarity\">Prices and Rarity<\/h3>\n<ul>\n<li>\n<p><strong>Drakes.<\/strong> Prices are in gold pieces, which people on\nVvardenfell call drakes. They're scaled to D&amp;D rather than copied\nfrom the games, where a suit of Daedric armour costs more than a manor\nhouse.<\/p>\n<\/li>\n<li>\n<p><strong>Rarity.<\/strong> Ordinary gear is Common and sold in most\ntowns. Gear made from rare materials, such as glass, ebony and Daedric\nmetal, is better than anything ordinary. It isn't magical, but it's as\nhard to find as a magic item, so it has a rarity of its own.<\/p>\n<\/li>\n<li>\n<p><strong>Selling.<\/strong> Characters sell gear for half its price, as\nusual.<\/p>\n<\/li>\n<\/ul>\n<div class=\"tw\"><table><thead><tr><th>Rarity<\/th><th>Typical price<\/th><th>Where to find it<\/th><\/tr><\/thead><tbody><tr><td class=\"first\">Common<\/td><td>Up to 1,600 gp<\/td><td>Traders and smiths in most towns<\/td><\/tr><tr><td class=\"first\">Uncommon<\/td><td>500 to 1,500 gp<\/td><td>Specialist smiths in the great towns; old tombs and ruins<\/td><\/tr><tr><td class=\"first\">Rare<\/td><td>5,000 to 7,500 gp<\/td><td>A handful of master smiths; deep ruins and strongholds<\/td><\/tr><tr><td class=\"first\">Very Rare<\/td><td>40,000 gp and up<\/td><td>Almost never for sale<\/td><\/tr><\/tbody><\/table><\/div>\n<h3 id=\"items-using-this-book--merchants-purses\">Merchants' Purses<\/h3>\n<p>In the games, every trader has only so much gold on hand. This book\nborrows the rule: a trader can only buy goods up to the gold they have.\nSelling a suit of Daedric armour means finding someone rich enough to\nbuy it.<\/p>\n<div class=\"tw\"><table><thead><tr><th>Trader<\/th><th>Gold on hand<\/th><\/tr><\/thead><tbody><tr><td>Pedlar or small shop<\/td><td>100 gp<\/td><\/tr><tr><td>Town trader or smith<\/td><td>500 gp<\/td><\/tr><tr><td>Guild trader or wealthy merchant<\/td><td>2,000 gp<\/td><\/tr><tr><td>Great House or Telvanni dealer<\/td><td>5,000 gp<\/td><\/tr><\/tbody><\/table><\/div>\n<h3 id=\"items-using-this-book--silver-and-better\">Silver and Better<\/h3>\n<p>Some creatures can only be hurt by magic or silver: ghosts, spectres,\nbonelords and others in the <em>Bestiary of Morrowind<\/em>. Silver\nweapons count, and so do weapons made of glass, ebony, Daedric metal,\nadamantium and stalhrim. Chapter Two has the details.<\/p>\n<h3 id=\"items-using-this-book--restricted-goods\">Restricted Goods<\/h3>\n<p>Some goods can't be sold openly on Vvardenfell. Dwemer artefacts,\nincluding Dwemer armour and weapons, are restricted by Imperial law. Raw\nebony and raw glass can only be sold to or through the East Empire\nCompany (see Chapter Three). Moon sugar and skooma are banned outright.\nGuards confiscate them, and only fences and smugglers will buy them.<\/p>\n"},{"id":"items-armour-and-clothing","t":"Armour and Clothing","s":[{"id":"items-armour-and-clothing--armour-of-morrowind","t":"Armour of Morrowind","l":2},{"id":"items-armour-and-clothing--light-armour","t":"Light Armour","l":2},{"id":"items-armour-and-clothing--medium-armour","t":"Medium Armour","l":2},{"id":"items-armour-and-clothing--heavy-armour","t":"Heavy Armour","l":2},{"id":"items-armour-and-clothing--shields","t":"Shields","l":2},{"id":"items-armour-and-clothing--wear-and-repair","t":"Wear and Repair","l":2},{"id":"items-armour-and-clothing--clothing","t":"Clothing","l":2}],"h":"\n\n<div class=\"epigraph\">\n<p><em>“Bonemold for the Houses, chitin for the poor, and glass for\nanyone who wants to be robbed.”<\/em><\/p>\n<\/div>\n<div class=\"attribution\">\n<p>— An armourer in Balmora<\/p>\n<\/div>\n<h3 id=\"items-armour-and-clothing--armour-of-morrowind\">Armour of Morrowind<\/h3>\n<p class=\"dropcap\">Morrowind's armour comes from strange places: the\nhides of floating netch, the shells of giant insects, bone shaped and\nbonded with resin, and green volcanic glass. Each material has its own\nlook and its own reputation, and a Dunmer can usually tell where you\ncome from, and how much you're worth, from what you wear.<\/p>\n<p>All armour here uses the 2024 rules: Light, Medium and Heavy\ncategories, Armour Class, Strength requirements and Stealth\nDisadvantage.<\/p>\n<ul>\n<li>\n<p><strong>Suits, not pieces.<\/strong> In the games, armour comes in\npieces. Here, each entry is a full suit: cuirass, helm, pauldrons,\ngauntlets, greaves and boots. If a character mixes pieces, the cuirass\ndecides the suit's statistics, and the rest is for show.<\/p>\n<\/li>\n<li>\n<p><strong>Rare materials.<\/strong> Glass, ebony, Daedric metal and a\nfew others make armour better than any ordinary suit. It isn't magical,\nbut it has a rarity and a price to match, and it can still be\nenchanted.<\/p>\n<\/li>\n<li>\n<p><strong>Cold Weather.<\/strong> Armour with this property gives its\nwearer Advantage on saving throws against extreme cold.<\/p>\n<\/li>\n<li>\n<p><strong>Not for sale.<\/strong> Some armour is the uniform of a\nparticular order and can't be bought. It can be won, or taken, at the\nrisk of that order's anger.<\/p>\n<\/li>\n<\/ul>\n<h3 id=\"items-armour-and-clothing--light-armour\">Light Armour<\/h3>\n<p>Light armour is made from leather, hide, chitin and glass. It's what\nmost Dunmer travellers wear, and what anyone who values speed over\nprotection chooses. Add your Dexterity modifier to its AC.<\/p>\n<div class=\"tw\"><table><thead><tr><th>Armour<\/th><th>AC<\/th><th>Weight<\/th><th>Price<\/th><th>Rarity<\/th><th>Notes<\/th><\/tr><\/thead><tbody><tr><td class=\"first\">Netch leather<\/td><td>11 + Dex<\/td><td>10 lb<\/td><td>10 gp<\/td><td>Common<\/td><td>The everyday armour of Dunmer travellers<\/td><\/tr><tr><td class=\"first\">Nordic fur<\/td><td>11 + Dex<\/td><td>12 lb<\/td><td>10 gp<\/td><td>Common<\/td><td>Cold Weather<\/td><\/tr><tr><td class=\"first\">Nordic bearskin<\/td><td>11 + Dex<\/td><td>12 lb<\/td><td>15 gp<\/td><td>Common<\/td><td>Cold Weather<\/td><\/tr><tr><td class=\"first\">Boiled netch leather<\/td><td>12 + Dex<\/td><td>12 lb<\/td><td>30 gp<\/td><td>Common<\/td><td>Netch leather hardened in boiling oil<\/td><\/tr><tr><td class=\"first\">Chitin<\/td><td>12 + Dex<\/td><td>8 lb<\/td><td>40 gp<\/td><td>Common<\/td><td>The lightest armour on the island<\/td><\/tr><tr><td class=\"first\">Imperial studded leather<\/td><td>12 + Dex<\/td><td>13 lb<\/td><td>45 gp<\/td><td>Common<\/td><td>Imperial issue<\/td><\/tr><tr><td class=\"firs
