dv.\" means the armour gives Disadvantage on Dexterity (Stealth) checks. Armour · AC · Stealth · Weight · Price · Rarity · Notes. Bear · 12 · — · 15 lb · 15 gp · Common · Cold Weather; made on Solstheim. Nordic ringmail · 13 · Disadv. · 20 lb · 50 gp · Common · Nord mail. Imperial chain · 14 · Disadv. · 45 lb · 50 gp · Common · Imperial issue. Bonemold · 14 · Disadv. · 20 lb · 400 gp · Common · Worn by Great House guards. Bonemold, ornate · 14 · Disadv. · 20 lb · 450 gp · Common · The Armun-An and Gah-Julan styles. Imperial dragonscale · 15 · Disadv. · 40 lb · 750 gp · Common · Imperial scale armour. Orcish · 16 · Disadv. · 25 lb · 800 gp · Uncommon · Forged by Orc smiths. Dreugh · 15 · — · 25 lb · 1,000 gp · Uncommon · Made from dreugh shell; quiet. Adamantium · 16 · Disadv. · 25 lb · 1,200 gp · Uncommon · Critical Hits against you become normal hits. Indoril · 16 · Disadv. · 25 lb · Not sold · Uncommon · The armour of the Ordinators. Ice (stalhrim) · 16 · Disadv. · 25 lb · 5,000 gp · Rare · Resistance to Cold damage; Cold Weather. Royal Guard · 16 · Disadv. · 25 lb · Not sold · Rare · The armour of Mournhold's Royal Guard. Bonemold. Bonemold is Morrowind's own armour: bone shaped and bonded with resin into smooth, hard plates. The Great Houses outfit their guards in it, and a suit is a sign of respectability. The ornate Armun-An and Gah-Julan styles cost a little more. Orcish and dreugh. Orc smiths are among the best in Tamriel, and their armour is prized everywhere. Dreugh armour is cut from the shells of the sea monsters, which is why hunters risk the shallows for them. Apart from bear hide, it's the only medium armour quiet enough for sneaking. Adamantium. This rare, shining ore is mined beneath Mournhold, and armour made from it turns the worst blows. Indoril. Ordinators wear this armour, with its distinctive masked helm, as the uniform of the Temple's enforcers. Ordinators attack anyone who isn't one of their order seen wearing it, and they don't ask questions first. Ice. Ice armour is carved from stalhrim, an enchanted ice found in the barrows of Solstheim, which never melts. It shrugs off the worst cold, giving its wearer Resistance to Cold damage, and only a few smiths know how to work it."},{"i":"items-armour-and-clothing--heavy-armour","b":"items","ci":"items-armour-and-clothing","c":"Armour and Clothing","h":"Heavy Armour","t":"Heavy armour gives the most protection, at the cost of weight and noise. It doesn't add your Dexterity modifier to AC, it gives Disadvantage on Dexterity (Stealth) checks, and it has a Strength requirement. If your Strength is lower, your Speed drops by 10 feet. Armour · AC · Strength · Weight · Price · Rarity · Notes. Iron · 16 · 13 · 55 lb · 75 gp · Common · Cheap and common. Steel · 17 · 15 · 60 lb · 200 gp · Common · . Nordic iron · 17 · 15 · 65 lb · 200 gp · Common · Cold Weather. Imperial steel · 17 · 15 · 60 lb · 250 gp · Common · Imperial Legion issue. Nordic trollbone · 17 · 15 · 60 lb · 250 gp · Common · Cold Weather. Imperial Templar · 18 · 15 · 65 lb · 1,500 gp · Common · Worn by Imperial templar knights. Imperial silver · 18 · 15 · 65 lb · 1,600 gp · Common · Silver-plated steel. Duke's Guard silver · 18 · 15 · 65 lb · Not sold · Common · Worn by the Duke's guards in Ebonheart. Dwemer · 18 · 15 · 65 lb · 1,500 gp · Common · Salvaged from ruins; trade is restricted. Ebony · 19 · 15 · 70 lb · 6,000 gp · Rare · Black volcanic glass. Nordic mail · 19 · 15 · 65 lb · 6,000 gp · Rare · Cold Weather; made on Solstheim. Daedric · 20 · 17 · 80 lb · 40,000 gp · Very Rare · Ebony bound with the spirit of a Daedra. Her Hand's · 20 · 17 · 75 lb · Not sold · Very Rare · The armour of Almalexia's Hands. Iron and steel. Every smith on the island can make iron and steel plate, and the Imperial Legion wears its own steel. Nords from Skyrim and Solstheim favour heavy iron and trollbone armour, lined against the cold. Dwemer. Dwemer armour is salvaged from the ruins, not made, and it's built from the Dwemer's strange bronze-coloured metal. Selling it openly breaks Imperial law, so most of it changes hands quietly. Ebony. Ebony is a black volcanic glass, rarer and stronger than steel, and Vvardenfell's mines are the richest in Tamriel. Ebony armour is heavy, near-unbreakable and a mark of real wealth. Daedric. Daedric armour is ebony forged with the bound spirit of a Daedra. It's the heaviest armour there is, and the strongest, and very few smiths alive can make it. It's said a suit can only be finished under the right phase of the moons. Her Hand's. Almalexia's personal guards, Her Hands, wear this ornate armour in Mournhold. Anyone else found wearing it there will have a great deal of explaining to do."},{"i":"items-armour-and-clothing--shields","b":"items","ci":"items-armour-and-clothing","c":"Armour and Clothing","h":"Shields","t":"A shield adds to your AC while you hold it, as normal. Most shields on Vvardenfell are made of the same materials as armour. Shield · AC · Weight · Price · Rarity · Notes. Netch leather or chitin · +2 · 4 lb · 10 gp · Common · . Iron, steel or Nordic · +2 · 8 lb · 15 gp · Common · . Bonemold · +2 · 6 lb · 30 gp · Common · Great House guards carry their house's colours. Dwemer · +2 · 8 lb · 50 gp · Common · Trade is restricted. Orcish tower · +3 · 12 lb · 800 gp · Uncommon · . Dreugh · +3 · 8 lb · 800 gp · Uncommon · . Glass · +3 · 6 lb · 1,000 gp · Uncommon · . Ebony · +3 · 12 lb · 1,200 gp · Uncommon · . Daedric · +3 · 15 lb · 1,500 gp · Uncommon · . Daedric tower · +4 · 18 lb · 6,000 gp · Rare · Taken only from golden saints."},{"i":"items-armour-and-clothing--wear-and-repair","b":"items","ci":"items-armour-and-clothing","c":"Armour and Clothing","h":"Wear and Repair","t":"Gear can wear out and break under an optional rule. It's in the Player's Guide : see Wear and Repair ."},{"i":"items-armour-and-clothing--clothing","b":"items","ci":"items-armour-and-clothing","c":"Armour and Clothing","h":"Clothing","t":"Clothing comes in four grades, from a farmer's homespun to a Telvanni lord's robes. Better clothing costs more, and it can hold a stronger enchantment (see Enchanting in the Player's Guide ). Rings and amulets come in the same four grades, at the single-piece price. Grade · Example · Full outfit · Single piece · Holds enchantments up to. Common · Homespun shirt, trousers and shoes · 1 gp · 2 sp · Common. Expensive · Dyed linen, a good belt and boots · 15 gp · 3 gp · Uncommon. Extravagant · Silk and embroidery · 75 gp · 15 gp · Rare. Exquisite · Fine silk and gold thread · 300 gp · 60 gp · Very Rare. Dress the part. Under this optional rule, a character in extravagant or exquisite clothing has Advantage on their first Charisma check to impress a noble, a councillor or a wealthy merchant, but Disadvantage among Ashlanders, the poor and pilgrims."},{"i":"items-weapons","b":"items","ci":"items-weapons","c":"Weapons","h":"Weapons","t":"“A Daedric blade will outlive you, your children and whoever kills you for it.” — A weaponsmith in Vivec"},{"i":"items-weapons--weapons-of-morrowind","b":"items","ci":"items-weapons","c":"Weapons","h":"Weapons of Morrowind","t":"Vvardenfell is armed to the teeth. Pilgrims carry spears against kagouti, Ashlanders hunt with chitin bows, Redoran guards wear their broadswords openly in the street, and every tomb on the island holds something sharp. What a weapon is made of matters as much as its shape: a steel longsword is ordinary, a glass one is worth a house, and a Daedric one is worth killing for. All weapons here use the 2024 rules: Simple and Martial categories, properties and Weapon Mastery. Simple, Martial and Exotic. Most weapons are Simple or Martial, as normal. Exotic weapons are the Akaviri blades, which need special training to use well. Counts as. Many Morrowind weapons have different names from the Player's Handbook weapons. The \"As\" column names the Player's Handbook weapon each one counts as, for feats, class features and spells such as Shillelagh . A dash means the names are the same. Steel prices. The tables give prices for weapons made of steel. Other materials change the price, and the better ones give a bonus to attack and damage rolls (see Materials). Weapon skills. In the games, each weapon belongs to a skill, such as Short Blade or Spear. Here, proficiency follows the D&D categories, so a fighter is as good with a halberd as with a claymore."},{"i":"items-weapons--weapon-mastery","b":"items","ci":"items-weapons","c":"Weapons","h":"Weapon Mastery","t":"Every weapon in this chapter has a mastery property, shown in its Mastery column. Who can use mastery, and what each property does, is in Step Two of the Player's Guide , with the rest of character creation."},{"i":"items-weapons--simple-weapons","b":"items","ci":"items-weapons","c":"Weapons","h":"Simple Weapons","t":"Simple weapons are the tools of farmers, miners, pilgrims and anyone who can't afford a sword. Every class can use them. Weapon · As · Damage · Properties · Mastery · Weight · Price. Axe · Handaxe · 1d6 Slashing · Light, Thrown (20/60) · Vex · 2 lb · 5 gp. Club · — · 1d4 Bludgeoning · Light · Slow · 2 lb · 1 sp. Dagger · — · 1d4 Piercing · Finesse, Light, Thrown (20/60) · Nick · 1 lb · 2 gp. Mace · — · 1d6 Bludgeoning · — · Sap · 4 lb · 5 gp. Miner's pick · — · 1d8 Piercing · Two-Handed · Sap · 8 lb · 2 gp. Spear · — · 1d6 Piercing · Thrown (20/60), Versatile (1d8) · Sap · 3 lb · 1 gp. Staff · Quarterstaff · 1d6 Bludgeoning · Versatile (1d8) · Topple · 4 lb · 2 sp. Light crossbow · — · 1d8 Piercing · Ammunition (80/320; bolt), Loading, Two-Handed · Slow · 5 lb · 25 gp. Short bow · Shortbow · 1d6 Piercing · Ammunition (80/320; arrow), Two-Handed · Vex · 2 lb · 25 gp. Axes and miner's picks. The axe is a light, one-handed axe for chopping wood as much as heads. Miner's picks are tools first: every egg mine and ebony mine on the island has a rack of them, and miners know how to swing one. Staffs. A staff is the traditional weapon of mages, and the Mages Guild and the Telvanni carry them as a sign of their calling as much as for defence. Light crossbows. The hunters of Solstheim use a small crossbow for game. On Vvardenfell, these huntsman crossbows are rare and found mostly in Nord hands."},{"i":"items-weapons--martial-weapons","b":"items","ci":"items-weapons","c":"Weapons","h":"Martial Weapons","t":"Martial weapons need a soldier's training. They're the weapons of the Legion, the Great House guards and anyone who fights for a living. Weapon · As · Damage · Properties · Mastery · Weight · Price. Battle axe · Greataxe · 1d12 Slashing · Heavy, Two-Handed · Cleave · 7 lb · 30 gp. Broadsword · Longsword · 1d8 Slashing · Versatile (1d10) · Graze · 3 lb · 10 gp. Claymore · Greatsword · 2d6 Slashing · Heavy, Two-Handed · Graze · 6 lb · 50 gp. Glaive · — · 1d10 Slashing · Heavy, Reach, Two-Handed · Graze · 6 lb · 20 gp. Halberd · — · 1d10 Slashing · Heavy, Reach, Two-Handed · Cleave · 6 lb · 20 gp. Long spear · Pike · 1d10 Piercing · Heavy, Reach, Two-Handed · Push · 10 lb · 10 gp. Longsword · — · 1d8 Slashing · Versatile (1d10) · Sap · 3 lb · 15 gp. Rapier · — · 1d8 Piercing · Finesse · Vex · 2 lb · 25 gp. Saber · Scimitar · 1d6 Slashing · Finesse, Light · Nick · 3 lb · 25 gp. Shortsword · — · 1d6 Piercing · Finesse, Light · Vex · 2 lb · 10 gp. Spiked club · Morningstar · 1d8 Piercing · — · Sap · 4 lb · 15 gp. Trident · — · 1d8 Piercing · Thrown (20/60), Versatile (1d10) · Topple · 4 lb · 5 gp. War axe · Battleaxe · 1d8 Slashing · Versatile (1d10) · Topple · 4 lb · 10 gp. Warhammer · Maul · 2d6 Bludgeoning · Heavy, Two-Handed · Topple · 10 lb · 10 gp. Whip · — · 1d4 Slashing · Finesse, Reach · Slow · 3 lb · 2 gp. Crossbow · Heavy crossbow · 1d10 Piercing · Ammunition (100/400; bolt), Heavy, Loading, Two-Handed · Push · 18 lb · 50 gp. Long bow · Longbow · 1d8 Piercing · Ammunition (150/600; arrow), Heavy, Two-Handed · Slow · 2 lb · 50 gp. Broadswords and longswords. The broadsword is a wide, heavy blade made for chopping, and it's the sidearm of the Imperial Legion and the Redoran guard. The longsword is the classic knight's sword, as good at thrusting as cutting. They're both Versatile and differ only in their mastery. Glaives and tridents. A glaive is a long, curved blade on a pole, the weapon of guards who hold gates and bridges. Tridents are fishing spears first: the fishers of the Bitter Coast and Azura's Coast use them on slaughterfish, and they work as well on anything else. A trident can be made of any material a spear can. Rapiers. Breton and Imperial fencing masters brought the rapier to Vvardenfell, and it's fashionable among young Hlaalu nobles and Imperial officers. Its slim blade is too fine for iron, so rapiers come only in steel, silver, glass, ebony and Daedric metal. Whips. A whip's lash is netch leather, so its material is the barbs worked into it: chitin, iron, steel or silver. On Vvardenfell, the whip is a slaver's tool, and carrying one openly says so. Argonians and Khajiit will treat its owner accordingly. Warhammers. Morrowind's warhammers are huge two-handed hammers, so they use the maul's statistics, not the warhammer's from the Player's Handbook . Orcs favour them. Crossbows. The crossbows of Morrowind are powerful Imperial and Dwemer weapons, slow to load but hard-hitting. They use the heavy crossbow's statistics. Dwemer crossbows are salvaged from the ruins and their trade is restricted. Long bows. House Redoran's archers carry bonemold long bows, and Ashlander hunters prefer the short bow. A long bow is the better weapon for anyone strong enough to draw it."},{"i":"items-weapons--exotic-weapons","b":"items","ci":"items-weapons","c":"Weapons","h":"Exotic Weapons","t":"Exotic weapons are the Akaviri blades: the tanto, wakizashi, katana and dai-katana. Their design came to Tamriel with the Akaviri warriors who founded the Blades, and they're forged to a finer edge than any other sword in the Empire. They're rare on Vvardenfell, and made only in iron, steel and Daedric metal. Weapon · Untrained · Damage · Properties · Mastery · Weight · Price. Tanto · Dagger · 1d6 Piercing · Finesse, Light, Thrown (20/60) · Nick · 1 lb · 10 gp. Wakizashi · Saber · 1d8 Slashing · Finesse, Light · Nick · 2 lb · 30 gp. Katana · Longsword · 1d8 Slashing · Finesse, Versatile (1d10) · Sap · 3 lb · 50 gp. Dai-katana · Claymore · 2d6 Slashing · Finesse, Heavy, Two-Handed · Graze · 6 lb · 100 gp. Untrained. Without training, an Akaviri blade works exactly like the weapon in the Untrained column, and you need proficiency with that weapon to use it well. Training. A character proficient with the Untrained weapon can train to use an Akaviri blade's full statistics. Training takes 10 days and costs 250 gp, and it covers every Akaviri blade whose Untrained weapon you're proficient with. On Vvardenfell, the only teachers are the Blades, and they choose their students carefully. Weapon Mastery. A trained character can choose an Akaviri blade for Weapon Mastery, like any Martial weapon. Daisho. A trained character holding a katana in one hand and a tanto or wakizashi in the other can make the Light property's extra attack with the short blade after attacking with the katana, even though the katana isn't Light."},{"i":"items-weapons--materials","b":"items","ci":"items-weapons","c":"Weapons","h":"Materials","t":"Every weapon in this chapter can be made from more than iron and steel. A material doesn't change a weapon's damage or properties, but the better ones give a bonus to attack and damage rolls, like a +1, +2 or +3 weapon. Material · Bonus · Rarity · Price · Silver · Notes. Chitin · — · Common · Half · — · Half weight. Iron · — · Common · Half · — · Includes riekling weapons. Steel · — · Common · As listed · — · Includes Imperial, Nordic and huntsman weapons. Bonemold · — · Common · ×4 · — · Bows and ammunition only. Silver · — · Common · +100 gp · Yes · . Dreugh · +1 · Uncommon · 500 gp · — · Clubs and staffs only. Dwemer · +1 · Uncommon · 750 gp · — · Trade is restricted. Orcish · +1 · Uncommon · 800 gp · — · . Nordic silver · +1 · Uncommon · 1,000 gp · Yes · Made on Solstheim. Adamantium · +1 · Uncommon · 1,200 gp · Yes · Hits against objects are Critical Hits; doesn't wear on a 1. Glass · +2 · Rare · 5,000 gp · Yes · Half weight. Ebony · +2 · Rare · 6,000 gp · Yes · Twice the weight. Stalhrim · +2 · Rare · 7,500 gp · Yes · Can deal Cold damage instead. Daedric · +3 · Very Rare · 40,000 gp · Yes · Three times the weight. The prices for Uncommon and rarer materials are the same whatever the weapon: a glass dagger costs as much as a glass claymore. They're not magical, so Detect Magic doesn't find them, but they can still be enchanted (see Soul Gems and Enchanting in the Player's Guide ). A material's bonus doesn't add to a magic weapon's bonus: if a weapon has both, use the higher one. Chitin and iron. Chitin weapons, cut and shaped from insect shell, are light and cheap, and they're what most Ashlanders carry. Iron is the cheapest metal. Both wear out quickly: under the Wear and Repair rule, they take a penalty on an attack roll of 1 or 2. Silver. Silver weapons are steel with a silvered edge. They're no better in an ordinary fight, but they're the cheapest way to hurt a ghost. Dwemer and Orcish. Dwemer weapons are made of the same strange, bronze-coloured metal as Dwemer armour, and like it they're salvaged from the ruins rather than forged. Orcish weapons, mostly heavy axes and hammers, are the work of Orc smiths, and they're prized across Tamriel. Adamantium. Mined beneath Mournhold, adamantium is hard enough to cut stone, so any hit against an object is a Critical Hit. It's also the only Uncommon material that doesn't wear down when you roll a 1. Glass and ebony. Glass weapons are light, keen and green as a beetle's shell, and they're half the weight of steel. Ebony weapons are black, near-unbreakable and twice as heavy. Stalhrim. Carved from the enchanted ice of Solstheim's barrows, a stalhrim weapon is so cold it burns. Each time you hit, you can choose for it to deal Cold damage instead of its normal damage type. Daedric. Daedric weapons are ebony forged with the bound spirit of a Daedra, and they're the finest weapons there are. They're also three times the weight of steel. Wear. If you use the Wear and Repair rule, Uncommon weapons wear like Common ones, taking a penalty when you roll a 1. Adamantium, Rare and Very Rare weapons don't: only creatures that damage gear, such as the hunger, can wear them down."},{"i":"items-weapons--silver-and-better","b":"items","ci":"items-weapons","c":"Weapons","h":"Silver and Better","t":"Some creatures in the Bestiary of Morrowind can only be hurt, or only be hurt properly, by weapons that are magical or made of silver: Spirit Form. Ancestor ghosts, dwarven spectres and bonelords take no damage from other weapons. Daedric Hide. Scamps take half damage from other weapons. Regeneration. Damage from silver stops a werewolf regenerating. Weapons made of any material marked \"Yes\" in the Silver column count as silver for all of these. Magic weapons count too, whatever they're made of, and so does a weapon under a spell such as Magic Weapon ."},{"i":"items-weapons--whats-made-from-what","b":"items","ci":"items-weapons","c":"Weapons","h":"What's Made from What","t":"Not every weapon comes in every material. This table lists the ones that exist, but nothing stops a smith making an ebony katana if the DM allows it. Material · Found as. Chitin · Daggers, shortswords, clubs, war axes, spears, tridents, whips, short bows, arrows and throwing stars. Iron · Most blades, axes, clubs, maces, warhammers, spears, glaives and tridents, plus whips, arrows, bolts and throwing knives. Steel · Almost every weapon in this chapter. Silver · Daggers, shortswords, longswords, rapiers, claymores, staffs, war axes, spears, glaives, tridents, whips, arrows, bolts, darts and throwing stars. Bonemold · Long bows, arrows and bolts. Dreugh · Clubs and staffs. Dwemer · Shortswords, claymores, maces, warhammers, war axes, battle axes, spears, tridents, glaives, halberds and crossbows. Orcish · Battle axes, warhammers and bolts. Nordic silver · Daggers, shortswords, longswords, claymores, maces, axes and battle axes. Adamantium · Shortswords, claymores, maces, axes, spears, tridents and glaives. Glass · Daggers, longswords, rapiers, claymores, staffs, war axes, glaives, halberds, arrows, throwing knives and throwing stars. Ebony · Shortswords, broadswords, longswords, rapiers, maces, staffs, war axes, spears, tridents, glaives, arrows, darts and throwing stars. Stalhrim · Daggers, longswords, maces and war axes. Daedric · Almost every weapon, including all four Akaviri blades, glaives, tridents, rapiers, long bows, arrows and darts."},{"i":"items-weapons--ammunition-and-throwing-weapons","b":"items","ci":"items-weapons","c":"Weapons","h":"Ammunition and Throwing Weapons","t":""},{"i":"items-weapons--arrows-and-bolts","b":"items","ci":"items-weapons","c":"Weapons","h":"Arrows and Bolts","t":"Bows fire arrows and crossbows fire bolts. Morrowind has no slings, and no firearms exist anywhere in Tamriel. Ammunition · Bonus · Rarity · Price (10) · Notes. Corkbulb · — · Common · 1 sp · Practice ammunition that deals only 1 Bludgeoning damage. Chitin or iron · — · Common · 3 sp · . Steel · — · Common · 5 sp · . Bonemold · — · Common · 2 gp · . Silver · — · Common · 25 gp · Counts as silver. Orcish · +1 · Uncommon · 100 gp · Bolts only. Glass · +2 · Rare · 500 gp · Arrows only; counts as silver. Ebony · +2 · Rare · 600 gp · Arrows only; counts as silver. Daedric · +3 · Very Rare · 2,500 gp · Arrows only; counts as silver. Ten arrows weigh half a pound, and ten bolts three-quarters of a pound. Bow and ammunition. When you fire ammunition from a bow or crossbow that also has a bonus, use the higher bonus. They don't add together, so a steel arrow fired from a Daedric long bow gets +3, and so does a Daedric arrow. What counts. For Silver and Better, it's what hits the target that matters: the arrow or bolt, not the bow. Breaking. Ammunition made of Uncommon or rarer materials is destroyed when it hits. After a fight, you can recover half of the pieces that missed, as normal."},{"i":"items-weapons--throwing-weapons","b":"items","ci":"items-weapons","c":"Weapons","h":"Throwing Weapons","t":"Darts, throwing knives and throwing stars are small, balanced weapons made to be thrown in quick succession. The Morag Tong and the Dark Brotherhood favour them, and so do the island's thieves. Weapon · Category · Damage · Properties · Mastery · Weight · Price. Dart · Simple · 1d4 Piercing · Finesse, Thrown (20/60) · Vex · 1/4 lb · 5 cp. Throwing knife · Simple · 1d4 Piercing · Finesse, Light, Thrown (30/90) · Nick · 1/2 lb · 5 sp. Throwing star · Martial · 1d4 Slashing · Finesse, Light, Thrown (20/60) · Vex · 1/4 lb · 1 gp. Ranged weapons. All three are Ranged weapons. Used in melee, they count as improvised weapons. Light and Nick. Throwing knives and stars have the Light property, so after you throw one with the Attack action, you can throw another as a Bonus Action. With the throwing knife's Nick mastery, the second throw is part of the Attack action instead. Materials. Chitin and iron throwing weapons cost half price, and silver ones cost 5 gp each. A throwing weapon made of an Uncommon or rarer material costs as much as ten arrows of that material, and it's destroyed when it hits."},{"i":"items-weapons--weapons-from-elsewhere","b":"items","ci":"items-weapons","c":"Weapons","h":"Weapons from Elsewhere","t":"The Player's Handbook 's flail, sling and blowgun aren't made on Vvardenfell. A traveller from elsewhere in the Empire might carry one, and a good smith could copy it."},{"i":"items-tools-and-equipment","b":"items","ci":"items-tools-and-equipment","c":"Tools and Equipment","h":"Tools and Equipment","t":"“A good pick gets you through the door. A good probe means you live to walk through it.” — A fence in Balmora"},{"i":"items-tools-and-equipment--tools-of-the-trade","b":"items","ci":"items-tools-and-equipment","c":"Tools and Equipment","h":"Tools of the Trade","t":"Vvardenfell runs on tools. The Thieves Guild's picks open the strongrooms of Balmora, the island's smiths keep the Legion's armour in fighting shape, and every alchemist from Ald'ruhn to Vivec keeps a mortar and pestle on the bench. In the games, these tools come in grades, from cheap apprentice's sets to the work of secret masters, and the better the tool, the better the result. Grades. Lockpicks, probes, armourer's hammers and alchemy apparatus come in five grades. Better grades give a bonus to ability checks made with the tool: +1 for Journeyman's, +2 for Master's, +3 for Grandmaster's and +4 for Secret Master's. Proficiency. These tools count as the Player's Handbook tools they replace: lockpicks and probes are Thieves' Tools, and alchemy apparatus is Alchemist's Supplies. If you're proficient with the Player's Handbook tool, you're proficient with its Morrowind version. Armourer's hammers are the exception: they're a tool of their own, for repairs only, and using one takes proficiency with Smith's Tools. Wearing out. In the games, tools break after a number of uses. Here, lockpicks and probes break when a check with them fails badly, and armourer's hammers wear out after a set number of repairs. Everything else. Every other tool in the Player's Handbook is sold on Vvardenfell at its usual price."},{"i":"items-tools-and-equipment--lockpicks-and-probes","b":"items","ci":"items-tools-and-equipment","c":"Tools and Equipment","h":"Lockpicks and Probes","t":"Thieves on Vvardenfell carry two kinds of tool: lockpicks for locks, and probes for the magical traps that guard so many doors and chests. Together, they count as Thieves' Tools. Grade · Bonus · Rarity · Lockpick · Probe · Notes. Bent · −2 · Common · — · Not sold · Probes only; found in ruins and on dead thieves. Apprentice's · +0 · Common · 5 gp · 5 gp · . Journeyman's · +1 · Common · 25 gp · 25 gp · . Master's · +2 · Common · 100 gp · 100 gp · Sold by the Thieves Guild and a few traders. Grandmaster's · +3 · Uncommon · 500 gp · 500 gp · Rarely sold. Secret Master's · +4 · Rare · Not sold · Not sold · Found only. Using them. Picking a lock or disarming a trap takes the Utilize action and a Dexterity check, adding your Proficiency Bonus if you're proficient with Thieves' Tools and the tool's bonus. Right tool for the job. You need a lockpick to pick a lock and a probe to disarm a trap. Breaking. If you fail a check by 5 or more, the lockpick or probe breaks. Serious thieves carry spares. The Skeleton Key. The greatest lockpick of all is a Daedric artefact, described in Chapter Six."},{"i":"items-tools-and-equipment--locks","b":"items","ci":"items-tools-and-equipment","c":"Tools and Equipment","h":"Locks","t":"Locks on Vvardenfell range from a latch on a farmer's chest to the vaults of the Great Houses. Some doors can't be picked at all and open only with their key. Lock · DC · Found on. Simple · 10 · Crates, barrels and the doors of the poor. Average · 15 · Most chests and house doors. Good · 20 · Merchants' strongrooms, guild halls and old tombs. Superior · 25 · Great House vaults and Dwemer ruins. Masterwork · 30 · The vaults of the Temple and the Telvanni. The Knock spell, which the Dunmer call Open, opens any lock. Picking a lock in sight of a guard is a crime."},{"i":"items-tools-and-equipment--traps","b":"items","ci":"items-tools-and-equipment","c":"Tools and Equipment","h":"Traps","t":"Most traps on Vvardenfell are spells bound to a door or a container. When someone opens it without first disarming the trap, the spell is released on them. Trap · Disarm DC · Save DC · Effect. Minor · 12 · 12 · 11 (2d10) Fire, Cold, Lightning or Poison damage. Dangerous · 15 · 15 · 22 (4d10) damage of one of those types, or the Paralyzed condition for 1 minute. Deadly · 20 · 18 · 55 (10d10) damage of one of those types. Finding traps. Spotting a trap takes a Wisdom (Perception) or Intelligence (Investigation) check against its Disarm DC. Detect Magic reveals one automatically. Disarming. Disarming a trap takes a probe and a Dexterity check against its Disarm DC. Failing by 5 or more sets it off. Saving throws. A creature caught by a trap makes a Dexterity save against damage, taking half on a success, or a Constitution save against paralysis, which it repeats at the end of each of its turns. Dispelling. Dispel Magic ends a trap. Treat a Minor trap as a level 1 spell, a Dangerous one as level 3 and a Deadly one as level 5."},{"i":"items-tools-and-equipment--armourers-hammers","b":"items","ci":"items-tools-and-equipment","c":"Tools and Equipment","h":"Armourer's Hammers","t":"An armourer's hammer isn't a set of Smith's Tools: it's a field tool for repairs, and can't make anything. A character proficient with Smith's Tools can use one to repair their own gear under the Wear and Repair rule in the Player's Guide . Hammer · Repairs per Long Rest · Uses · Repairs · Price. Apprentice's · 1 · 1 · Common gear · 5 gp. Journeyman's · 1 · 3 · Common gear · 15 gp. Master's · 2 · 3 · Common and Uncommon gear · 50 gp. Grandmaster's · 2 · 5 · Any gear · 150 gp. Sirollus Saccus's · 3 · 10 · Any gear · 500 gp. Repairs. During a Long Rest, you can remove up to the number of penalty points shown from your gear, spread across as many items as you like. Each point uses up one use, and when they run out, the hammer is worn out. Sirollus Saccus. The finest hammers on the island, sold only at his smithy in Ebonheart."},{"i":"items-tools-and-equipment--alchemy-apparatus","b":"items","ci":"items-tools-and-equipment","c":"Tools and Equipment","h":"Alchemy Apparatus","t":"An alchemist's apparatus has four pieces, each in five grades, and you can mix grades in one set. A set of Apprentice's apparatus is the Player's Handbook 's Alchemist's Supplies, weighing 8 pounds. Master's and better weigh half as much. Grade · Bonus · Rarity · Mortar and pestle · Alembic · Calcinator · Retort. Apprentice's · +0 · Common · 25 gp · 10 gp · 5 gp · 10 gp. Journeyman's · +1 · Common · 100 gp · 40 gp · 20 gp · 40 gp. Master's · +2 · Common · 500 gp · 200 gp · 100 gp · 200 gp. Grandmaster's · +3 · Uncommon · 1,000 gp · 1,000 gp · 1,000 gp · 500 gp. Secret Master's · +4 · Rare · Not sold · Not sold · Not sold · Not sold. Mortar and pestle. The only piece you need to brew a potion. Its bonus applies to the check to brew. Retort. Makes a potion one grade better. Calcinator. Makes a poison one grade better. Alembic. Saves a brew that would have spoiled. Grade limits. A piece's grade limits how good a brew it can make: Bargain for Apprentice's, Standard for Journeyman's, Quality for Master's and Exclusive for Grandmaster's or Secret Master's. Proficiency. A character proficient with either Alchemist's Supplies or an Herbalism Kit is proficient with alchemy apparatus. Brewing Potions in the Player's Guide explains how to brew potions and how much each piece helps."},{"i":"items-tools-and-equipment--lights","b":"items","ci":"items-tools-and-equipment","c":"Tools and Equipment","h":"Lights","t":"Dunmer towns glow with paper lanterns, and the island's tombs and caves are as dark as anywhere in Tamriel. Light · Bright light · Dim light · Burns for · Weight · Price. Candle · 5 ft · 5 ft more · 1 hour · — · 1 cp. Torch · 20 ft · 20 ft more · 1 hour · 1 lb · 1 cp. Paper lantern · 15 ft · 30 ft more · 6 hours per flask of oil · 1 lb · 5 sp. Travel lantern · 30 ft · 30 ft more · 6 hours per flask of oil · 2 lb · 5 gp. Bug lamp · 10 ft · 10 ft more · Never burns out · 1 lb · 25 gp. Paper lanterns. The everyday Dunmer lamp. It uses the lamp's statistics from the Player's Handbook . Travel lanterns. Imperial iron lanterns with a hood. They use the hooded lantern's statistics, so you can lower the hood to cut the light to Dim Light in a 5-foot radius. Bug lamps. Telvanni lamps of glass and chitin, lit by glowing insects that live for years. They're sold mostly in Sadrith Mora. Oil. A flask of lamp oil costs 1 sp."},{"i":"items-tools-and-equipment--adventuring-gear","b":"items","ci":"items-tools-and-equipment","c":"Tools and Equipment","h":"Adventuring Gear","t":"Everything in the Player's Handbook 's adventuring gear is sold on Vvardenfell at its usual price. These are the island's own items. Item · Weight · Price · Notes. Bedroll · 7 lb · 1 gp · Netch leather over a straw mat. Map of Vvardenfell · — · 5 gp · Counts as a Map for the whole island. Town guide · — · 5 sp · A pamphlet such as Guide to Balmora; counts as a Map of that town. Pilgrim's pack · 15 lb · 5 gp · A bedroll, a waterskin, 5 days of rations and a copy of The Pilgrim's Path. Rations (1 day) · 2 lb · 5 sp · Saltrice, dried scuttle and ash yam. Pilgrims. Temple pilgrims walk between the island's shrines, and the pilgrim's pack is what most of them carry. The Pilgrim's Path lists the shrines and the prayers to say at each one."},{"i":"items-tools-and-equipment--books","b":"items","ci":"items-tools-and-equipment","c":"Tools and Equipment","h":"Books","t":"Books are cheap on Vvardenfell, and the island is full of them: histories, sermons, adventure stories and some very bad poetry. A common book costs 5 gp, and a rare one can fetch 50 gp or more from a collector. Jobasha's Rare Books in Vivec's Foreign Quarter has the best stock on the island. Skill books. Some books teach as much as any trainer. In the games, they're the books that raise a skill when you read them, such as The Black Arrow , A Game at Dinner , The Buying Game and Chance's Folly . Reading. The first time a character reads a skill book, which takes about an hour, they gain Heroic Inspiration. Limits. Each book works only once for each reader, and a character can benefit from only one skill book per Long Rest. Price. A skill book costs 50 gp. A bookseller has 1d4 of them in stock at a time."},{"i":"items-tools-and-equipment--trade-goods","b":"items","ci":"items-tools-and-equipment","c":"Tools and Equipment","h":"Trade Goods","t":"Vvardenfell's wealth comes out of the ground, and the Empire means to keep it. By Imperial charter, the East Empire Company has the sole right to trade raw ebony and raw glass, along with flin and Dwemer artefacts. Goods · Weight · Price · Notes. Raw ebony · 5 lb · 50 gp · Company goods; mined around Caldera. Raw glass · 2 lb · 50 gp · Company goods; dug from caves in the Ashlands and the Molag Amur. Raw adamantium · 5 lb · 25 gp · Mined beneath Mournhold. Dwemer scrap metal · 10 lb · 25 gp · Trade is restricted. Dwemer coin · — · 5 gp · Collectors pay well; trade is restricted. Supplying a smith. A smith making glass, ebony or adamantium gear needs the raw material. Bring raw material worth half the item's price and the smith charges only the other half, with no wait. Otherwise, the smith charges the full price and the work waits for a shipment, which takes 1d4 weeks. A smith making Daedric gear also needs a Daedra heart. Company goods. Raw ebony and raw glass can't legally be sold to just anyone. A character who finds or mines some has three choices: Sell to the Company. The East Empire Company's factors in Ebonheart buy raw ebony and glass at the usual half price, no questions asked. Get a licence. The Company grants trading licences to people it trusts, and House Hlaalu, which runs the licensed mine at Caldera, can vouch for its friends. A licence is earned with a favour, not bought, and lets its holder sell to any trader. Sell on the quiet. Smugglers, fences and the Camonna Tong buy without a licence, but selling to anyone else without one counts as trading restricted goods. Handing your own ore to a smith to work isn't a sale, so the Company doesn't object."},{"i":"items-tools-and-equipment--crafting-gear","b":"items","ci":"items-tools-and-equipment","c":"Tools and Equipment","h":"Crafting Gear","t":"Characters with Smith's, Leatherworker's or Woodcarver's Tools can make the weapons, armour and shields in this book. The rules are in the Player's Guide : see Crafting Weapons and Armour ."},{"i":"items-services-and-travel","b":"items","ci":"items-services-and-travel","c":"Services and Travel","h":"Services and Travel","t":"“The strider is slow, the boat is wet and the guild guide is dear. Walk, if you've a death wish.” — A caravaner in Seyda Neen"},{"i":"items-services-and-travel--getting-around","b":"items","ci":"items-services-and-travel","c":"Services and Travel","h":"Getting Around","t":"Vvardenfell has no roads worth the name outside the Ascadian Isles, and no horses. Travellers ride silt striders, giant insects that carry passengers in a shell on their backs, or take boats around the coast. The Mages Guild teleports those who can afford it. Fares. Silt striders and boats charge 1 gp per hour of the journey for each passenger, including followers and pack animals. The Ebonheart ferry charges double to Molag Mar, for the danger of the Molag Amur coast. Time. The routes give each journey's time in hours. On foot, allow three times as long."},{"i":"items-services-and-travel--silt-striders-and-boats","b":"items","ci":"items-services-and-travel","c":"Services and Travel","h":"Silt Striders and Boats","t":"Silt striders serve the west and south of the island. Boats link the coastal towns, the Telvanni east and the northern ports, where striders don't go. Journey times are in hours. Port · By silt strider · By boat. Ald'ruhn · Maar Gan (2), Balmora (4), Gnisis (4), Khuul (5) · —. Balmora · Seyda Neen (3), Ald'ruhn (4), Suran (4), Vivec (4) · —. Dagon Fel · — · Tel Mora (5), Khuul (8), Tel Aruhn (9), Sadrith Mora (10). Ebonheart · — · Vivec (1), Hla Oad (5), Molag Mar (5), Gnaar Mok (9). Gnaar Mok · — · Hla Oad (4), Khuul (7), Ebonheart (9). Gnisis · Khuul (3), Ald'ruhn (4), Maar Gan (4), Seyda Neen (11) · —. Hla Oad · — · Gnaar Mok (4), Ebonheart (5), Vivec (5), Molag Mar (10). Khuul · Gnisis (3), Maar Gan (3), Ald'ruhn (5) · Fort Frostmoth (6), Gnaar Mok (7), Dagon Fel (8). Maar Gan · Ald'ruhn (2), Khuul (3), Gnisis (4) · —. Molag Mar · Suran (3), Vivec (4) · Tel Branora (2), Vivec (4), Ebonheart (5), Hla Oad (10). Sadrith Mora · — · Tel Mora (5), Vos (5), Tel Branora (8), Dagon Fel (10). Seyda Neen · Vivec (2), Balmora (3), Suran (4), Gnisis (11) · —. Suran · Vivec (1), Molag Mar (3), Balmora (4), Seyda Neen (4) · —. Tel Aruhn · — · Tel Mora (4), Vos (4), Dagon Fel (9). Tel Branora · — · Molag Mar (2), Vivec (5), Sadrith Mora (8). Tel Mora · — · Vos (1), Tel Aruhn (4), Dagon Fel (5), Sadrith Mora (5). Vivec · Suran (1), Seyda Neen (2), Balmora (4), Molag Mar (4) · Ebonheart (1), Molag Mar (4), Hla Oad (5), Tel Branora (5). Vos · — · Tel Mora (1), Tel Aruhn (4), Sadrith Mora (5). Solstheim. A Khajiit captain in Khuul sails to Fort Frostmoth, the Imperial Legion's outpost on Solstheim, the cold island to the north."},{"i":"items-services-and-travel--other-ways-to-travel","b":"items","ci":"items-services-and-travel","c":"Services and Travel","h":"Other Ways to Travel","t":"Guild guides. Each of the Mages Guild's six halls has a guide who teleports travellers to any of the other five, instantly, for 20 gp a person, or 10 gp for Guild members. The guides are Erranil in Ald'ruhn, Masalinie Merian in Balmora, Emelia Duronia in Caldera, Ilvari Sendas in Ebonheart, Iniel at Wolverine Hall in Sadrith Mora and Flacassia Fauseius in Vivec's Foreign Quarter. A guide can refuse a customer they dislike, and senior Telvanni often are refused. Gondolas. Gondoliers pole passengers along the canals between Vivec's cantons for 2 cp a trip. Propylon chambers. Ten ruined Dunmer strongholds hold propylon chambers, ancient teleporters that link each stronghold to its two neighbours in a ring around the island: Andasreth, Berandas, Falasmaryon, Falensarano, Hlormaren, Indoranyon, Marandus, Rotheran, Telasero and Valenvaryon. Each chamber needs the index of the stronghold you're travelling to, and the indices are scattered across the island. Folms Mirel of the Mages Guild in Caldera studies them. Intervention. Scrolls of Almsivi Intervention carry their reader to the nearest Temple, and scrolls of Divine Intervention to the nearest Imperial Cult shrine (see Chapter Five). The Temples stand in Ald'ruhn, Balmora, Gnisis, Molag Mar and Vivec. The Imperial Cult has shrines in the Legion forts: Buckmoth near Ald'ruhn, Moonmoth near Balmora, Hawkmoth in Ebonheart, Fort Darius in Gnisis, Fort Pelagiad, Wolverine Hall in Sadrith Mora and Fort Frostmoth on Solstheim. Telvanni towers. Telvanni towers have no stairs, because their wizards levitate. Visitors need a Levitate spell, scroll or potion, or someone willing to lift them. Mournhold. Morrowind's capital lies on the mainland, and there's no regular passage from Vvardenfell. The royal court keeps a mage in Ebonheart who teleports the Queen's guests to the Royal Palace, and brings them back. On foot. There are no horses on Vvardenfell. Travellers who walk load their gear on a pack guar, which costs 25 gp and 5 cp a day in feed, and uses the guar's statistics in the Bestiary of Morrowind ."},{"i":"items-services-and-travel--inns-and-taverns","b":"items","ci":"items-services-and-travel","c":"Services and Travel","h":"Inns and Taverns","t":"Every town has somewhere to drink, and most have somewhere to sleep. The Dunmer call a tavern a cornerclub. A night's lodging costs 7 cp if it's squalid, 1 sp if it's poor, 5 sp if it's modest, 8 sp if it's comfortable, 2 gp if it's wealthy and 4 gp if it's aristocratic. Inn · Town · Lodging · Notes. Arrille's Tradehouse · Seyda Neen · Modest · Where new arrivals stop first. Eight Plates · Balmora · Wealthy · Hlaalu merchants dine here. South Wall Cornerclub · Balmora · Poor · A Thieves Guild haunt. Council Club · Balmora · Modest · The Camonna Tong's; outlanders unwelcome. Halfway Tavern · Pelagiad · Comfortable · On the road from Vivec to Balmora. Shenk's Shovel · Caldera · Poor · Where the ebony miners drink. Black Shalk Cornerclub · Vivec · Modest · In the Foreign Quarter. Gateway Inn · Sadrith Mora · Modest · Few Telvanni will house outlanders. Six Fishes · Ebonheart · Comfortable · Legion officers and Company clerks."},{"i":"items-services-and-travel--food-and-drink","b":"items","ci":"items-services-and-travel","c":"Services and Travel","h":"Food and Drink","t":"Item · Price · Notes. Poor meal · 2 cp · Saltrice porridge and scuttle. Modest meal · 1 sp · A kwama egg omelette, baked ash yam and scrib jelly. Fine meal · 5 sp · Grilled kagouti, crab meat stew and marshmerrow sweets. Trama root tea · 1 cp · A bitter, calming tea. Mazte (mug) · 4 cp · Cheap saltrice beer, the common drink of the island. Shein (bottle) · 2 sp · Bitter, sour comberry wine. Greef (bottle) · 5 sp · Comberry brandy. Sujamma (bottle) · 1 gp · A potent, bitter liquor. Flin (bottle) · 10 gp · Whiskey from Cyrodiil, imported by the East Empire Company. Cyrodiilic brandy (bottle) · 25 gp · The finest imported spirit. Sujamma. For an hour after a cup of sujamma, you have Advantage on Strength checks and Disadvantage on Intelligence checks. A second cup within the hour gives you the Poisoned condition until the hour is up."},{"i":"items-services-and-travel--healing-and-spellcasting","b":"items","ci":"items-services-and-travel","c":"Services and Travel","h":"Healing and Spellcasting","t":"The Temple heals the sick in every town where it has a shrine, and the Imperial Cult does the same in the Legion forts. Both ask for a donation, and members of either faith pay half. Service · Price · Where. Healing (Cure Wounds) · 10 gp · Temples and Imperial Cult shrines. Cure common disease · 25 gp · Temples and Imperial Cult shrines. Cure poison · 25 gp · Temples and Imperial Cult shrines. Cure Blight disease · 50 gp · Temple shrines only. Remove Curse · 150 gp · Temples and Imperial Cult shrines. Greater Restoration · 1,000 gp · The High Fane in Vivec only. Other spells. For any other spell, find someone who can cast it, usually at the Mages Guild or the Temple. Spells of level 6 or higher aren't for sale, though a Telvanni wizard might cast one for a favour. Add the cost of any costly material component to these prices. Spell level · 1 · 2 · 3 · 4 · 5. Price · 50 gp · 150 gp · 300 gp · 1,000 gp · 2,000 gp. Raising the dead. In the games, nobody on Vvardenfell can bring back the dead. The Temple teaches that the faithful dead join their ancestors, and necromancy is a crime. Whether anyone can raise the dead in your campaign is the DM's decision. If someone can, they're the high priests of the Imperial Cult, they charge 5,000 gp or more and they don't do it for strangers."},{"i":"items-services-and-travel--buying-spells","b":"items","ci":"items-services-and-travel","c":"Services and Travel","h":"Buying Spells","t":"In the games, spell merchants sell spells to anyone who can pay. In the 2024 rules, spellcasters learn spells as they gain levels, so spell merchants work a little differently. Wizards. Mages Guild halls keep spell libraries. A wizard can copy any spell of level 3 or lower from one, paying a fee of 50 gp per spell level on top of the normal cost of copying it, or half that for Guild members. Higher-level spells are kept for senior members, or bought from the Telvanni at whatever price they name. Bards, rangers, sorcerers and warlocks. A spell merchant can coach these casters to replace one spell they know with another of the same level from their class's spell list. It takes a day and costs 50 gp per spell level. Other casters. Clerics, druids and paladins already choose from their full spell lists each day, and don't need a spell merchant."},{"i":"items-services-and-travel--training","b":"items","ci":"items-services-and-travel","c":"Services and Travel","h":"Training","t":"Trainers teach anything for a price. Training takes 8 hours a day, and you can't adventure on those days, though they needn't be in a row. Training · Time · Cost · Teachers. A tool proficiency · 20 days · 200 gp · The guild that uses the tool, or a master craftsman. A language · 30 days · 300 gp · Scholars of the Mages Guild and the Temple. Akaviri blades · 10 days · 250 gp · The Blades only (see Chapter Two). Guild members pay half for training with their own guild."},{"i":"items-services-and-travel--crime-and-fines","b":"items","ci":"items-services-and-travel","c":"Services and Travel","h":"Crime and Fines","t":"Guards enforce Imperial law and the law of each town's Great House. In Telvanni towns, the law is mostly whatever a Telvanni wizard says it is. A crime nobody sees isn't a crime, but a witness puts a bounty on the criminal's head. Crime · Bounty. Trespassing · 5 gp. Pickpocketing · 25 gp. Theft · The value of the goods. Assault · 40 gp. Carrying restricted goods · The value of the goods. Murder · 1,000 gp. Arrest. A guard who spots a wanted criminal demands the bounty or a trip to jail, and confiscates stolen and restricted goods either way. Once a bounty reaches 5,000 gp, guards attack on sight instead. Jail. One night for each 100 gp of bounty, with a minimum of one. Serving it clears the bounty. The Thieves Guild. Members can clear a bounty through the Guild for half its value."},{"i":"items-magic-items","b":"items","ci":"items-magic-items","c":"Magic Items","h":"Magic Items","t":"“Every ring on Vvardenfell does something. The trick is finding out what before you put it on.” — An enchanter in Sadrith Mora"},{"i":"items-magic-items--enchanted-goods","b":"items","ci":"items-magic-items","c":"Magic Items","h":"Enchanted Goods","t":"Almost every magic item on Vvardenfell is made by a mortal enchanter, who binds a spell into an object using the power of a trapped soul. Enchanters name their work after the spell they bind, so a ring of the Hand of Heaven carries the levitation spell Uth's Hand of Heaven. In the games, enchantments come in four kinds, and this chapter uses the same four. Constant effect. The enchantment works whenever you wear or carry the item. Powerful ones need Attunement. Cast when used. The item holds charges, and you spend them to cast its spell. It never regains them on its own: only a filled soul gem can recharge it (see Soul Gems in the Player's Guide ). Cast when strikes. A weapon that can release its spell into whatever it hits, spending charges when you choose to. Like cast when used items, it only recharges from a soul gem. Cast once. Scrolls, which anyone who can read can use, once. Most of these items cost 50 to 100 gp if they're Common, 500 to 1,000 gp if they're Uncommon and 5,000 to 6,000 gp if they're Rare. Very Rare items are almost never for sale. The Mages Guild, the Telvanni and a few independent enchanters sell magic items, and they buy them at half price, as long as they have the gold (see Merchants' Purses). Named items. Famous one-of-a-kind items, such as the Ring of Phynaster and the Boots of Blinding Speed, are in Chapter Six."},{"i":"items-magic-items--constant-effect-items","b":"items","ci":"items-magic-items","c":"Magic Items","h":"Constant Effect Items","t":"These enchantments are found on rings, amulets, belts, boots and robes, and some of them on armour and shields too. Item · Effect · Rarity · Attune · Price. Brightball amulet · Sheds Bright Light in a 20-foot radius and Dim Light for 20 feet more; speak a word to turn it on or off · Common · — · 50 gp. Feather belt · Doubles your carrying capacity · Common · — · 100 gp. Glowing Eye ring · Darkvision out to 60 feet, or 60 feet more if you already have it · Uncommon · — · 500 gp. Mist slippers · You can walk on liquid as if it were solid ground · Uncommon · — · 500 gp. Airy Bubble amulet · You can breathe water · Uncommon · — · 500 gp. Fins belt · A Swim Speed equal to your Speed · Uncommon · — · 500 gp. Hoptoad boots · Your jump distances triple, and you take half damage from falling · Uncommon · Yes · 800 gp. Eye-Maze amulet · Your outline shimmers and blurs: Advantage on Dexterity (Stealth) checks · Uncommon · Yes · 800 gp. Barrier ring · +1 bonus to AC · Uncommon · Yes · 1,000 gp. Flameguard, Frostguard, Shockguard or Poisonguard ring · Resistance to Fire, Cold, Lightning or Poison damage · Rare · Yes · 5,000 gp. Fiery Ward, Icy Mask or Stormward robe · Resistance to Cold, Fire or Lightning damage, and a creature that hits you with a melee attack takes 1d6 Fire, Cold or Lightning damage · Rare · Yes · 5,000 gp. Spellmire ring · Advantage on saving throws against spells · Rare · Yes · 6,000 gp. Greater barrier ring · +2 bonus to AC · Rare · Yes · 6,000 gp."},{"i":"items-magic-items--fortify-enchantments","b":"items","ci":"items-magic-items","c":"Magic Items","h":"Fortify Enchantments","t":"Fortify enchantments make their wearer stronger, quicker or sharper. Each sets one ability score to 19, which does nothing if the score is already 19 or higher. They all need Attunement. Item · Effect · Rarity · Price. Savage Might belt · Strength 19 · Uncommon · 1,000 gp. Vigor amulet · Constitution 19 · Uncommon · 1,000 gp. Insight amulet · Intelligence 19 · Uncommon · 1,000 gp. Oathfast ring · Wisdom 19 · Uncommon · 1,000 gp. Heartwise amulet · Charisma 19 · Uncommon · 1,000 gp. Dawn Sprite ring · Dexterity 19 · Rare · 5,000 gp. Celerity boots · Your Speed increases by 10 feet (no score change) · Uncommon · 800 gp."},{"i":"items-magic-items--cast-when-used-items","b":"items","ci":"items-magic-items","c":"Magic Items","h":"Cast When Used Items","t":"Using one of these items takes a Magic action. Its spell costs 1 charge per spell level, like a spell slot: at least the spell's own level, and more to cast it at a higher level. A Healing ring with 3 charges can cast Cure Wounds three times at level 1, or once at level 3. Effects that aren't spells cost the charges shown. These items never regain charges on their own; a filled soul gem recharges them (see Soul Gems in the Player's Guide ). Spells cast from them use a save DC of 13 and an attack bonus of +5, or DC 15 and +7 for Rare items. Item · Effect · Charges · Rarity · Attune · Price. Healing ring · Cast Cure Wounds on yourself · 3 · Uncommon · — · 500 gp. Hand of Heaven ring · Cast Levitate on yourself · 3 · Uncommon · — · 600 gp. Unhinging ring · Cast Knock · 3 · Uncommon · — · 600 gp. Scorcher, Winter Guest or Chastening ring · Release a burst of Fire, Cold or Lightning (1 charge; see below) · 3 · Uncommon · — · 600 gp. Vivication amulet · Cast Lesser Restoration on yourself · 3 · Uncommon · — · 800 gp. Bound blade ring · Conjure a bound weapon (1 charge; see below) · 3 · Uncommon · Yes · 1,000 gp. Messenger ring · Summon a scamp (3 charges; see below) · 3 · Uncommon · Yes · 1,000 gp. Almsivi or Divine amulet · Almsivi or Divine Intervention (3 charges; see Scrolls) · 3 · Uncommon · Yes · 1,000 gp. Averted Eyes ring · Cast Invisibility on yourself · 4 · Rare · Yes · 5,000 gp. Elemental Burst amulet · A blast of Fire, Cold or Lightning (1 charge; see Scrolls) · 4 · Rare · Yes · 5,000 gp. Leaguestep amulet · Mark a place (1 charge), or return to it (4 charges; see Scrolls) · 4 · Rare · Yes · 6,000 gp. Atronach ring · Summon a flame or frost atronach (4 charges; see below) · 4 · Rare · Yes · 6,000 gp. Bursts. Scorcher rings deal Fire damage, Winter Guest rings Cold and Chastening rings Lightning. Each creature within 5 feet of you makes a Dexterity saving throw, taking 3d6 damage of the ring's type on a failure or half as much on a success. Bound weapons. A Daedric weapon of your choice, from any melee weapon in Chapter Two, appears in your hand for 1 minute or until you let go of it. It's only a shadow of a true Daedric weapon, so it has a +1 bonus to attack and damage rolls instead of +3, but it counts as silver. Conjuring it takes a Bonus Action instead of a Magic action. Summoning. The creature appears in an unoccupied space within 30 feet of you and uses its stat block from the Bestiary of Morrowind . It's friendly to you and your allies, obeys your commands and acts immediately after you on your turn. It vanishes after 1 minute, or when it drops to 0 Hit Points."},{"i":"items-magic-items--enchanted-weapons","b":"items","ci":"items-magic-items","c":"Magic Items","h":"Enchanted Weapons","t":"Enchanted weapons on Vvardenfell are named for their element and their shape: a Steel Flameblade is a steel dagger or shortsword that bursts into fire, and a Silver Sparkaxe is a silver war axe that crackles with lightning. Element · Damage. Flame · Fire. Shard · Cold. Spark · Lightning. Viper · Poison. The second half of the name gives the weapon's shape: -blade for daggers and shortswords, -sword for longswords and broadswords, -axe, -mace, -mauler for warhammers, -slayer for claymores, -cleaver for battle axes, -skewer for spears, -scythe for halberds and -star for throwing stars. Each charge in one of these weapons holds one die of damage of its element: a d6, or a d8 for a cruel weapon and a d10 for a dire one. When you hit with it, you can spend charges, up to the most per hit shown below, deciding after the attack roll; the target takes one extra die of the weapon's element for each, like a smite. A weapon holds twice as many charges as it can spend at once, so a dire weapon's 10 charges are two hits of 5d10, or more smaller ones. The weapon never regains charges on its own: only a filled soul gem can recharge it (see Soul Gems in the Player's Guide ). Grade · Soul · Example · Charges · Most per hit · Rarity · Price. -bite · Petty · Firebite Dagger · 2 · 1d6 · Common · 100 gp. -fang · Lesser · Shockfang War Axe · 4 · 2d6 · Common · 250 gp. Plain · Common · Steel Viperblade · 6 · 3d6 · Uncommon · 500 gp. Wild · Common · Wild Sparkblade · 6 · 3d6, wild · Uncommon · 400 gp. Cruel · Greater · Cruel Flameblade · 8 · 4d8 · Rare · 5,000 gp. Dire · Grand · Dire Shardblade · 10 · 5d10 · Very Rare · Not sold. Price. Add the enchantment's price to the price of the weapon and its material. -bite and -fang weapons. A fang is the stronger bite. Firebite and Firefang weapons deal Fire damage, Shockbite and Shockfang weapons Lightning, and Spiderbite and Spiderfang weapons Poison. Wild. A wild weapon is a near miss, bound by an enchanter who almost failed (see Enchanting in the Player's Guide ), and any grade can come out wild. It's cheaper because it's unreliable: when you spend charges, roll a d6. On a 1, they're wasted. On a 6, the extra damage is doubled. Arrows, bolts and stars. Flamearrows, Shardbolts, Sparkstars and the rest hold 2 charges, which both go off when they hit: 2d6 extra damage of their element. They're Uncommon and cost 50 gp each, and they're destroyed when they hit, like other ammunition."},{"i":"items-magic-items--scrolls","b":"items","ci":"items-magic-items","c":"Magic Items","h":"Scrolls","t":"On Vvardenfell, scrolls aren't written by spellcasters for spellcasters. They're inscribed so that anyone who can read can use one (see Inscribing Scrolls in the Player's Guide ). The named scrolls below can't be inscribed, only found or bought. Reading a scroll takes a Magic action, and the scroll crumbles to dust afterwards. Saving throws and attacks use DC 13 and +5 for Common and Uncommon scrolls, DC 15 and +7 for Rare ones and DC 17 and +9 for Very Rare ones. Concentration. If the effect needs Concentration, the reader must concentrate on it, as for a spell. Prices match the cost of having the same spell cast (see Chapter Four)."},{"i":"items-magic-items--healing-and-protection","b":"items","ci":"items-magic-items","c":"Magic Items","h":"Healing and Protection","t":"Scroll · Effect · Rarity · Price. Daydene's Panacea · Cures one common disease · Common · 25 gp. The First or Second Barrier · +1 bonus to your AC for 1 minute · Common · 25 gp. Daerir's Miracle · Cures one Blight disease · Common · 50 gp. Healing · As Cure Wounds, on yourself · Common · 50 gp. The Third to Sixth Barrier · +2 bonus to your AC for 1 minute · Uncommon · 150 gp. Salen's Vivication · As Lesser Restoration, on yourself · Uncommon · 150 gp. Tranasa's Spellmire · Advantage on saving throws against spells for 1 minute · Uncommon · 150 gp. Warrior's Blessing · Regain 2d8 Hit Points, and add 1d4 to your attack rolls for 1 minute · Uncommon · 150 gp. Corrupt Arcanix · As Dispel Magic · Uncommon · 300 gp. Purity of Body · Cures every disease, Blight included, and you regain 4d8 Hit Points · Uncommon · 300 gp. The Ninth Barrier · +3 bonus to your AC, and Resistance to Fire, Cold and Lightning damage, for 1 minute · Rare · 1,000 gp."},{"i":"items-magic-items--movement-senses-and-stealth","b":"items","ci":"items-magic-items","c":"Magic Items","h":"Movement, Senses and Stealth","t":"Scroll · Effect · Rarity · Price. Ulm Juiceda's Feather · Doubles your carrying capacity for 1 hour · Common · 25 gp. Celerity · As Longstrider, on yourself · Common · 50 gp. Icarian Flight · See below · Common · 50 gp. The Gambler's Prayer · Once in the next hour, reroll a d20 Test you've just made · Common · 50 gp. The Mage's Eye · As Detect Magic · Common · 50 gp. Tinur's Hoptoad · As Jump and Feather Fall, on yourself · Common · 50 gp. Breva's Averted Eyes · As Invisibility, on yourself · Uncommon · 150 gp. Golnara's Eye-Maze · As Pass without Trace, on yourself only · Uncommon · 150 gp. Lliros' Glowing Eye · As Darkvision, on yourself · Uncommon · 150 gp. Ondusi's Unhinging · As Knock · Uncommon · 150 gp. Savage Might, The Dawn Sprite, Insight, The Oathfast or Heartwise · As Enhance Ability, on yourself, for Strength, Dexterity, Intelligence, Wisdom or Charisma · Uncommon · 150 gp. Uth's Hand of Heaven · As Levitate, on yourself · Uncommon · 150 gp. Daynar's Airy Bubble · As Water Breathing · Uncommon · 300 gp. Selyn's Mist Slippers · As Water Walk · Uncommon · 300 gp. Windform · As Invisibility and Levitate, on yourself · Uncommon · 300 gp. Icarian Flight. For 1 round, you can leap up to 1,000 feet in any direction as part of your move. You land at the end of your turn and take falling damage for the height you fell from, unless something slows your fall. The scroll's inventor, the Bosmer wizard Tarhiel, tested it over Seyda Neen. He didn't use a second spell."},{"i":"items-magic-items--attack-and-control","b":"items","ci":"items-magic-items","c":"Magic Items","h":"Attack and Control","t":"Scroll · Effect · Rarity · Price. Didala's Knack · As Charm Person · Common · 50 gp. Fphyggi's Gem-Feeder · Soul Trap one creature (see the Player's Guide) · Common · 50 gp. Taldam's Scorcher, Drathis' Winter Guest or Inas' Chastening · A burst of Fire, Cold or Lightning, as the rings above · Common · 50 gp. Sertises' Porphyry · As Hold Person · Uncommon · 150 gp. Tevil's Peace · As Calm Emotions · Uncommon · 150 gp. Elemental Burst: Fire, Frost or Shock · See below · Uncommon · 300 gp. Psychic Prison · As Hold Person, and Soul Trap the target · Uncommon · 300 gp. Lord Mhas' Vengeance · See below · Rare · 1,000 gp. Greater Domination · As Dominate Person · Rare · 2,000 gp. Elemental Burst. A sphere of fire, frost or lightning explodes at a point you choose within 150 feet. Each creature in a 15-foot radius makes a DC 13 Dexterity saving throw, taking 8d6 Fire, Cold or Lightning damage on a failure or half as much on a success. Lord Mhas' Vengeance. For 1 minute, you're clad in bound Daedric armour, which gives you AC 20, and you hold a bound battle axe with a +1 bonus. You don't need proficiency with either, and both vanish when the minute ends."},{"i":"items-magic-items--summoning-and-travel","b":"items","ci":"items-magic-items","c":"Magic Items","h":"Summoning and Travel","t":"Scroll · Effect · Rarity · Price. Mark · See below · Common · 50 gp. Summon Skeleton · Summon a skeleton · Common · 50 gp. Almsivi Intervention · See below · Uncommon · 150 gp. Divine Intervention · See below · Uncommon · 150 gp. Messenger Scroll · Summon a scamp · Uncommon · 150 gp. Leaguestep · See below · Rare · 1,000 gp. Summon Flame or Frost Atronach · Summon a flame or frost atronach · Rare · 2,000 gp. Milyn Faram's Scroll · Summon a daedroth · Very Rare · Not sold. Summon Golden Saint · Summon a golden saint · Very Rare · Not sold. Almsivi and Divine Intervention. You vanish and reappear at the nearest Tribunal Temple (Almsivi) or Imperial Cult shrine (Divine), as listed in Chapter Four. Willing creatures touching you don't come with you. Neither works in the depths of Red Mountain or anywhere the gods' sight doesn't reach. Mark and Leaguestep. A scroll of Mark sets your mark where you stand, replacing any mark you had. A scroll of Leaguestep teleports you, and only you, to your mark, as long as it's on the same plane. Summons. Summoned creatures work as described for summoning items, and stay for 1 minute."},{"i":"items-magic-items--magic-items-from-elsewhere","b":"items","ci":"items-magic-items","c":"Magic Items","h":"Magic Items from Elsewhere","t":"Every magic item in the Dungeon Master's Guide can turn up on Vvardenfell, in an old tomb, a Dwemer ruin or an Imperial officer's baggage. Most fit the island better with a local name: a Ring of Free Action might be a Ring of Salen's Vivication, and a Cloak of Elvenkind a Golnara's Eye-Maze cloak. The Dungeon Master's Guide 's spell scrolls work as normal too, though only the Mages Guild sells them."},{"i":"items-potions","b":"items","ci":"items-potions","c":"Potions","h":"Potions","t":"“Every potion is a guess until somebody drinks it.” — An alchemist in Ald'ruhn"},{"i":"items-potions--potions-of-morrowind","b":"items","ci":"items-potions","c":"Potions","h":"Potions of Morrowind","t":"Every town on Vvardenfell has an alchemist, and most adventurers carry more potions than food. In the games, potions come in grades, from a spoiled brew that does as much harm as good to an exclusive potion worth a month's wages. This chapter uses the same grades. Drinking. Drinking a potion, or giving one to another creature, takes a Bonus Action, as in the 2024 rules. Grades. A potion's grade sets how strong it is, how long it lasts and what it costs. Effects. Every potion has one alchemical effect, described in this chapter. Chapter Eight lists the two effects of each ingredient, and which ingredients make each potion. One at a time. Drinking a second potion with the same effect while the first still lasts doesn't add to it. Use the better of the two."},{"i":"items-potions--potion-grades","b":"items","ci":"items-potions","c":"Potions","h":"Potion Grades","t":"Grade · Rarity · Price · Dice · Lasts · Save DC. Spoiled · Common · 5 gp · 1d4 + 1 · 1 minute · 10. Cheap · Common · 20 gp · 1d4 + 1 · 1 minute · 11. Bargain · Common · 50 gp · 2d4 + 2 · 10 minutes · 12. Standard · Uncommon · 150 gp · 4d4 + 4 · 1 hour · 13. Quality · Rare · 500 gp · 8d4 + 8 · 4 hours · 15. Exclusive · Very Rare · 2,000 gp · 10d4 + 20 · 8 hours · 17. Dice are for effects that heal, harm or grant Temporary Hit Points. A Bargain Restore Health potion is the Player's Handbook 's Potion of Healing, and the higher grades match its greater, superior and supreme potions. Lasts is how long an effect with a duration lasts. Potions never need Concentration. Save DC is for harmful effects. Spoiled potions work as Cheap ones, but each has a harmful side effect too, which the DM chooses from the harmful effects table."},{"i":"items-potions--helpful-effects","b":"items","ci":"items-potions","c":"Potions","h":"Helpful Effects","t":"Any helpful effect can be bought as a potion at an alchemist, at the price for its grade, unless the table says otherwise. Potions of Cheap to Standard grade are sold in most towns. Quality and Exclusive potions are found only in the great towns, at the Mages Guild and in the Telvanni towers. One of several. Fortify Body, Fortify Mind and Resistance each cover several abilities or damage types. The alchemist chooses one when brewing, and the bottle carries Morrowind's name for it: a Fortify Body potion brewed for Strength is a Fortify Strength potion, and a Resistance potion brewed against fire is Resist Fire. Ability names. Morrowind's attributes become D&D abilities: Strength is Strength, Agility is Dexterity, Endurance is Constitution, Intelligence is Intelligence, Willpower is Wisdom and Personality is Charisma."},{"i":"items-potions--restoring-and-fortifying","b":"items","ci":"items-potions","c":"Potions","h":"Restoring and Fortifying","t":"Effect · In a potion. Restore Health · Regain Hit Points equal to the grade's dice. Restore Fatigue · Gain Temporary Hit Points equal to the grade's dice. While the potion lasts, you can't gain Exhaustion levels from travel, heat, cold or going without sleep. A Quality or Exclusive potion also removes 1 Exhaustion level. Restore Magicka · Regain one expended spell slot: level 1 for Cheap and Bargain, level 2 for Standard, level 3 for Quality, level 5 for Exclusive. Costs twice the usual price. Fortify Magicka · +1 bonus to your spell save DC and spell attack rolls, or +2 for Quality and Exclusive. Fortify Body · Advantage on ability checks with Strength, Dexterity or Constitution (Fortify Strength, Agility or Endurance). At Standard grade or better, also on that ability's saving throws. Fortify Mind · Advantage on ability checks with Intelligence, Wisdom or Charisma (Fortify Intelligence, Willpower or Personality). At Standard grade or better, also on that ability's saving throws. Fortify Speed · Your Speed increases by 10 feet, or 20 feet for Quality and Exclusive. Fortify Luck · Once while it lasts, you can reroll a d20 Test you've just made."},{"i":"items-potions--resistances-and-cures","b":"items","ci":"items-potions","c":"Potions","h":"Resistances and Cures","t":"Resistance. Resistance to Fire, Cold, Lightning or Poison damage (Resist Fire, Frost, Shock or Poison). Resist Magic. Advantage on saving throws against spells. Resist Disease. Advantage on saving throws against common and Blight diseases. Cure. Ends one common disease, the Poisoned and Paralyzed conditions, and any Drain effect on you. Costs 25 gp. Cure Blight Disease. Ends one Blight disease. Costs 75 gp. Dispel. As Dispel Magic , on yourself."},{"i":"items-potions--movement-and-senses","b":"items","ci":"items-potions","c":"Potions","h":"Movement and Senses","t":"Effect · In a potion. Feather · Your carrying capacity doubles, your jump distances triple and you take no damage from falling. Levitate · As Levitate, on yourself. Water Breathing · You can breathe water, and you have a Swim Speed equal to your Speed. Water Walking · You can walk on liquid as if it were solid ground. Night Eye · Darkvision out to 60 feet. Invisibility · You have the Invisible condition until you attack, cast a spell or the potion ends. Detect · You sense Beasts, magic items and keys within 60 feet, and know where they are. Sold, not brewed. Alchemists also sell two potions that no ingredient on the island can make: Chameleon, which gives Advantage on Dexterity (Stealth) checks, and Sanctuary, which gives Advantage on Dexterity saving throws."},{"i":"items-potions--harmful-effects","b":"items","ci":"items-potions","c":"Potions","h":"Harmful Effects","t":"Harmful effects turn up in poisons and as the side effects of spoiled potions. A creature subjected to one makes a Constitution saving throw against the potion's save DC. On a success, it takes half damage from a damaging effect and ignores any other. Harmful effects last 1 minute, whatever the grade, unless the table says otherwise. Effect · In a poison. Poison · Poison damage equal to the grade's dice. Frost Damage · Cold damage equal to the grade's dice. Paralyze · The Paralyzed condition. Repeat the save at the end of each of your turns, ending the effect on a success. Drain Fatigue · Gain 1 Exhaustion level. Drain Magicka · Lose one unexpended spell slot, of the level Restore Magicka would restore. Drain Body · Disadvantage on ability checks and saving throws with Strength, Dexterity or Constitution, chosen when it's brewed. Drain Mind · Disadvantage on ability checks and saving throws with Intelligence, Wisdom or Charisma, chosen when it's brewed. Burden · Your Speed decreases by 10 feet."},{"i":"items-potions--special-brews","b":"items","ci":"items-potions","c":"Potions","h":"Special Brews","t":"Brew · Effect · Price. Potion of Fool's Luck · Almsivi Intervention, as the scroll in Chapter Five · 150 gp. Mark potion · Sets your mark, as the scroll of Mark in Chapter Five · 50 gp. Recall potion · Teleports you to your mark, as the scroll of Leaguestep in Chapter Five · 1,000 gp. Telvanni Bug Musk · A perfume. Advantage on Charisma (Persuasion) checks for 1 hour · 50 gp. Drinks such as mazte, sujamma and flin are in Chapter Four."},{"i":"items-potions--contraband","b":"items","ci":"items-potions","c":"Potions","h":"Contraband","t":"Moon sugar and skooma are banned on Vvardenfell, and carrying either counts as carrying restricted goods (see Chapter Four). Moon sugar is a crystal smuggled in from Elsweyr, where the Khajiit treat it as sacred. Skooma is moon sugar refined into a drug. Skooma. For 1 hour after taking skooma, your Speed increases by 10 feet and you have Advantage on Dexterity checks, but Disadvantage on Intelligence and Wisdom checks. When it wears off, you gain 1 Exhaustion level. Each time you take it, make a DC 12 Wisdom saving throw. On a failure, you crave more, and you have Disadvantage on Wisdom checks until you take more or finish three Long Rests without any. Smugglers sell it for about 100 gp a dose."},{"i":"items-potions--brewing","b":"items","ci":"items-potions","c":"Potions","h":"Brewing","t":"Anyone with alchemy apparatus and the right ingredients can brew their own potions and poisons. The rules are in the Player's Guide : see Brewing Potions . Selling your potions. Alchemists buy potions at half price, like any other goods, but few will take more than three of the same potion at a time."},{"i":"items-ingredients","b":"items","ci":"items-ingredients","c":"Ingredients","h":"Ingredients","t":"“If it grows, crawls or bleeds on Vvardenfell, somebody has tried to brew it.” — A Mages Guild apprentice in Ald'ruhn"},{"i":"items-ingredients--alchemys-raw-materials","b":"items","ci":"items-ingredients","c":"Ingredients","h":"Alchemy's Raw Materials","t":"Everything on Vvardenfell goes into a potion sooner or later: flowers from the Ascadian Isles, fungus from the Bitter Coast, salts from slain atronachs and the hearts of Daedra. This chapter lists every ingredient in the games, with its price and its two effects. Two effects. Every ingredient has two alchemical effects, except bread and small kwama eggs, which have one. Everyone on the island knows what an ingredient does. Chapter Seven explains each effect, and Brewing Potions in the Player's Guide explains how to brew with them. Brewing by Effect. Any two ingredients that share an effect make a potion, or a poison, with that effect. The table at the end of this chapter lists the ingredients for each effect, cheapest first. Eating them raw. As a Bonus Action, you can eat an ingredient for its first effect, at Cheap grade. That's how most people on the island take their hackle-lo. Prices are what an alchemist charges, and they match the drops in the Bestiary of Morrowind . Alchemists buy at half price. Harvesting creatures is described in the Player's Guide (see Harvesting ). Gathering plants is described below."},{"i":"items-ingredients--gathering-plants","b":"items","ci":"items-ingredients","c":"Ingredients","h":"Gathering Plants","t":"A character can spend an hour foraging in one region. They make a DC 10 Wisdom (Survival) check, with Advantage if they're proficient with an Herbalism Kit. On a success, they gather 1d4 portions of one plant that grows there, plus 1d4 more for every 5 points by which they beat the DC. The DM picks the plant, or the forager can choose one they're looking for and accept a DC of 15. Region · Plants. Bitter Coast · Ampoule pod, bungler's bane, coda flower, hypha facia, luminous russula, marshmerrow, muck, spore pod, violet coprinus. Ascadian Isles · Ash yam, black anther, comberry, heather, marshmerrow, saltrice, stoneflower petals, willow anther. West Gash · Chokeweed, comberry, corkbulb root, heather, roobrush, stoneflower petals. Grazelands · Gold kanet, heather, wickwheat. Ashlands and Molag Amur · Bittergreen petals, chokeweed, fire petal, red lichen, scathecraw, trama root. Azura's Coast and Sheogorad · Bittergreen petals, hackle-lo leaf, kresh fiber. Red Mountain · Fire petal. Caves · Black lichen, green lichen, luminous russula, violet coprinus. Solstheim · Belladonna berries, holly berries, wolfsbane petals. Mournhold · The planters of Mournhold's gardens hold golden sedge, horn lily, lloramor spines, meadow rye, nirthfly stalks, noble sedge, scrib cabbage, sweetpulp and timsa-come-by. Picking them is theft."},{"i":"items-ingredients--creature-parts","b":"items","ci":"items-ingredients","c":"Ingredients","h":"Creature Parts","t":""},{"i":"items-ingredients--beasts-and-kwama","b":"items","ci":"items-ingredients","c":"Ingredients","h":"Beasts and Kwama","t":"Ingredient · Price · Effects · From. Alit hide · 5 gp · Resistance; Detect · Alits. Crab meat · 1 gp · Restore Fatigue; Fortify Luck · Mudcrabs. Dreugh wax · 100 gp · Fortify Body; Drain Mind · Dreugh. Guar hide · 5 gp · Drain Fatigue; Fortify Luck · Guar. Hound meat · 2 gp · Restore Fatigue; Resist Magic · Nix-hounds. Kagouti hide · 2 gp · Fortify Speed; Resist Disease · Kagouti. Kwama cuttle · 2 gp · Resistance; Water Breathing · Kwama. Netch leather · 1 gp · Fortify Body; Fortify Mind · Netch. Racer plumes · 20 gp · Drain Mind; Levitate · Cliff racers. Rat meat · 1 gp · Drain Magicka; Paralyze · Rats. Scales · 2 gp · Water Walking; Water Breathing · Slaughterfish. Scrib jelly · 10 gp · Cure; Cure Blight Disease · Scribs. Shalk resin · 50 gp · Fortify Speed; Restore Fatigue · Shalks."},{"i":"items-ingredients--daedra-undead-and-constructs","b":"items","ci":"items-ingredients","c":"Ingredients","h":"Daedra, Undead and Constructs","t":"Ingredient · Price · Effects · From. Ash salts · 25 gp · Drain Body; Cure Blight Disease · Ash creatures. Bonemeal · 2 gp · Fortify Body; Drain Fatigue · Skeletons and tomb urns. Corprus weepings · 50 gp · Restore Health; Fortify Luck · Corprus creatures. Daedra skin · 200 gp · Fortify Body; Paralyze · Some Daedra; rarely sold. Daedra's heart · 200 gp · Restore Magicka; Night Eye · Most Daedra. Ectoplasm · 10 gp · Detect; Poison · Ghosts and spectres. Fire salts · 100 gp · Poison; Resistance · Flame atronachs. Frost salts · 75 gp · Restore Magicka; Resistance · Frost atronachs. Ghoul heart · 150 gp · Paralyze; Cure · Ash ghouls. Scamp skin · 10 gp · Drain Magicka; Cure · Scamps. Scrap metal · 20 gp · Resistance; Fortify Mind · Dwemer constructs and ruins. Vampire dust · 500 gp · Fortify Body; Resist Magic · Vampires. Void salts · 100 gp · Restore Magicka; Resist Magic · Storm atronachs and winged twilights."},{"i":"items-ingredients--plants","b":"items","ci":"items-ingredients","c":"Ingredients","h":"Plants","t":""},{"i":"items-ingredients--ampoule-pod-to-heather","b":"items","ci":"items-ingredients","c":"Ingredients","h":"Ampoule Pod to Heather","t":"Ingredient · Price · Effects. Ampoule pod · 2 gp · Water Walking; Paralyze. Ash yam · 1 gp · Fortify Body; Resist Disease. Bittergreen petals · 5 gp · Fortify Mind; Invisibility. Black anther · 2 gp · Resistance; Night Eye. Black lichen · 2 gp · Drain Body; Resistance. Bungler's bane · 1 gp · Burden; Dispel. Chokeweed · 1 gp · Restore Fatigue; Cure. Coda flower · 23 gp · Levitate; Poison. Comberry · 2 gp · Drain Fatigue; Restore Magicka. Corkbulb root · 5 gp · Cure; Restore Health. Fire petal · 2 gp · Resistance; Resist Magic. Gold kanet · 5 gp · Poison; Burden. Green lichen · 1 gp · Fortify Mind; Cure. Hackle-lo leaf · 30 gp · Restore Fatigue; Water Breathing. Heather · 1 gp · Fortify Mind; Feather."},{"i":"items-ingredients--hypha-facia-to-willow-anther","b":"items","ci":"items-ingredients","c":"Ingredients","h":"Hypha Facia to Willow Anther","t":"Ingredient · Price · Effects. Hypha facia · 1 gp · Drain Body; Detect. Kresh fiber · 1 gp · Fortify Luck; Fortify Mind. Luminous russula · 1 gp · Water Breathing; Poison. Marshmerrow · 1 gp · Restore Health; Detect. Muck · 1 gp · Drain Mind; Detect. Red lichen · 25 gp · Night Eye; Cure. Roobrush · 1 gp · Fortify Body; Cure. Saltrice · 1 gp · Restore Fatigue; Restore Health. Scathecraw · 2 gp · Drain Body; Cure. Spore pod · 1 gp · Drain Fatigue; Paralyze. Stoneflower petals · 1 gp · Fortify Body; Fortify Magicka. Trama root · 10 gp · Fortify Mind; Levitate. Violet coprinus · 1 gp · Water Walking; Poison. Wickwheat · 1 gp · Restore Health; Fortify Mind. Willow anther · 10 gp · Resistance; Cure."},{"i":"items-ingredients--minerals-food-and-other-goods","b":"items","ci":"items-ingredients","c":"Ingredients","h":"Minerals, Food and Other Goods","t":""},{"i":"items-ingredients--minerals-and-gems","b":"items","ci":"items-ingredients","c":"Ingredients","h":"Minerals and Gems","t":"Ingredient · Price · Effects · Found. Diamond · 250 gp · Invisibility; Resist Magic · Dwemer ruins and caves. Emerald · 150 gp · Fortify Magicka; Restore Health · Dwemer ruins. Moon sugar · 50 gp · Fortify Speed; Dispel · Smugglers' caves; contraband. Pearl · 100 gp · Water Breathing; Resist Disease · Kollops on the sea floor. Raw adamantium · 25 gp · Burden; Restore Magicka · Mines beneath Mournhold; see Chapter Three. Raw ebony · 50 gp · Resistance; Fortify Speed · Ebony mines; see Chapter Three. Raw glass · 50 gp · Drain Mind; Resistance · Glass mines; see Chapter Three. Raw stalhrim · 300 gp · Frost Damage; Paralyze · Solstheim's barrows; needs a stalhrim pick. Ruby · 200 gp · Poison; Feather · Dwemer ruins."},{"i":"items-ingredients--food-and-other-goods","b":"items","ci":"items-ingredients","c":"Ingredients","h":"Food and Other Goods","t":"Ingredient · Price · Effects · Found. Bloat · 5 gp · Drain Magicka; Fortify Mind · Alchemists. Bread
