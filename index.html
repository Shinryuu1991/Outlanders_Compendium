<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>The Outlanders' Compendium</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Almendra:ital,wght@0,400;0,700;1,400&family=Almendra+SC&family=Cinzel+Decorative:wght@700&family=Fondamento:ital@0;1&display=swap">
<style>
/* Layout: a bound book on a desk. Sidebar of books and chapters on the left, one chapter at a time on parchment. */
:root {
  --paper: #F4EAD5; --paper-2: #EBDDBF; --paper-3: #FBF5E8;
  --ink: #2B1B0E; --ink-2: #6A5440; --rule: #D5C19A;
  --red: #6B1D10; --brown: #5A2E12; --gold: #8C6A2F;
  --wash: #E5D2AC; --stripe: rgba(140, 106, 47, 0.07);
  --read-bg: #EFE2C4; --note-bg: #E9E4DC; --sb-bg: #F8EFDC; --mark: #F0D27A;
  --f-display: "Cinzel Decorative", "Almendra", Georgia, serif;
  --f-head: "Almendra", Georgia, "Times New Roman", serif;
  --f-sc: "Almendra SC", "Almendra", Georgia, serif;
  --f-body: "Fondamento", Georgia, "Times New Roman", serif;
  --fs: 17px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #17110C; --paper-2: #1F1710; --paper-3: #241B13;
  --ink: #E9DCC2; --ink-2: #B5A07F; --rule: #4A3826;
  --red: #E48D72; --brown: #E3C08B; --gold: #C9A25A;
  --wash: #34261A; --stripe: rgba(201, 162, 90, 0.06);
  --read-bg: #2A1F14; --note-bg: #26211C; --sb-bg: #1E160F; --mark: #7A5B1E; color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #17110C; --paper-2: #1F1710; --paper-3: #241B13;
  --ink: #E9DCC2; --ink-2: #B5A07F; --rule: #4A3826;
  --red: #E48D72; --brown: #E3C08B; --gold: #C9A25A;
  --wash: #34261A; --stripe: rgba(201, 162, 90, 0.06);
  --read-bg: #2A1F14; --note-bg: #26211C; --sb-bg: #1E160F; --mark: #7A5B1E; color-scheme: dark; }

html { font-size: var(--fs); }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 1rem; line-height: 1.55; }
a { color: var(--red); }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 3px; }
button { font: inherit; color: inherit; }

.app { display: grid; grid-template-columns: 19rem minmax(0, 1fr); min-height: 100vh; }
.side { box-sizing: border-box; position: sticky; top: 0; height: 100vh; height: 100dvh; overflow-y: auto; background: var(--paper-2);
  border-right: 1px solid var(--rule); display: flex; flex-direction: column; gap: 0.9rem;
  padding: 1.1rem 1rem 1.2rem max(1rem, env(safe-area-inset-left, 0px)); }
.brand { font-family: var(--f-display); color: var(--red); font-size: 1.12rem; line-height: 1.2; text-decoration: none; text-wrap: balance; }
.brand small { display: block; font-family: var(--f-head); font-style: italic; color: var(--ink-2); font-size: 0.78rem; margin-top: 0.2rem; }
.search { display: flex; flex-direction: column; gap: 0.5rem; }
.search input { width: 100%; box-sizing: border-box; padding: 0.55rem 0.7rem; border: 1px solid var(--gold); border-radius: 6px;
  background: var(--paper-3); color: var(--ink); font-family: var(--f-body); font-size: 0.95rem; }
.search input::placeholder { color: var(--ink-2); }
.chips { display: flex; flex-wrap: wrap; gap: 0.3rem; }
.chip { border: 1px solid var(--rule); background: transparent; border-radius: 999px; padding: 0.1rem 0.55rem; font-family: var(--f-sc);
  font-size: 0.74rem; color: var(--ink-2); cursor: pointer; letter-spacing: 0.02em; }
.chip[aria-pressed="true"] { background: var(--brown); border-color: var(--brown); color: var(--paper); }
nav.books { display: flex; flex-direction: column; gap: 0.15rem; }
nav.books details summary { list-style: none; cursor: pointer; font-family: var(--f-head); color: var(--brown); font-size: 0.98rem;
  padding: 0.3rem 0.2rem; border-radius: 4px; display: flex; gap: 0.4rem; align-items: baseline; }
nav.books details summary::-webkit-details-marker { display: none; }
nav.books details summary::before { content: "▸"; color: var(--gold); font-size: 0.75rem; transition: transform 0.15s; }
nav.books details[open] summary::before { transform: rotate(90deg); }
nav.books ol { list-style: none; margin: 0 0 0.4rem; padding: 0 0 0 0.9rem; }
nav.books li a { display: block; text-decoration: none; color: var(--ink); font-size: 0.9rem; padding: 0.16rem 0.4rem; border-radius: 4px; line-height: 1.3; }
nav.books li a:hover { background: var(--stripe); }
nav.books li.cur > a { background: var(--wash); color: var(--red); }
nav.books ol.secs { padding-left: 0.7rem; border-left: 1px solid var(--rule); margin: 0.15rem 0 0.3rem 0.5rem; }
nav.books ol.secs a { font-size: 0.82rem; color: var(--ink-2); }
nav.books ol.secs li.l3 a { padding-left: 1rem; font-size: 0.78rem; }
.tools { margin-top: auto; display: flex; gap: 0.4rem; flex-wrap: wrap; padding-top: 0.6rem; border-top: 1px solid var(--rule); }
.tools button { border: 1px solid var(--rule); background: var(--paper-3); border-radius: 6px; padding: 0.25rem 0.6rem; cursor: pointer;
  font-family: var(--f-sc); font-size: 0.78rem; color: var(--brown); }

main { min-width: 0; padding-block: 1.6rem 4rem; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.page { max-width: 46rem; margin: 0 auto; }
.crumb { font-family: var(--f-sc); font-size: 0.8rem; color: var(--gold); letter-spacing: 0.03em; display: flex; flex-wrap: wrap; gap: 0.35rem; }
.crumb a { color: var(--gold); text-decoration: none; }
h1.ch { font-family: var(--f-head); color: var(--brown); font-weight: 400; font-size: 2.1rem; line-height: 1.15; margin: 0.25rem 0 1rem;
  padding-bottom: 0.35rem; border-bottom: 2px solid var(--gold); text-wrap: balance; }
.page h2, .page h3, .page h4, .page h5 { font-family: var(--f-head); font-weight: 400; text-wrap: balance; scroll-margin-top: 1rem; }
.page h3 { color: var(--brown); font-size: 1.5rem; margin: 2rem 0 0.6rem; padding-bottom: 0.2rem; border-bottom: 1px solid var(--gold); }
.page h4 { color: var(--red); font-size: 1.22rem; margin: 1.5rem 0 0.4rem; }
.page h5 { color: var(--brown); font-size: 1.05rem; margin: 1.2rem 0 0.3rem; }
.page h2 { color: var(--brown); font-size: 1.6rem; margin: 1.8rem 0 0.6rem; padding-bottom: 0.2rem; border-bottom: 1px solid var(--gold); }
.page p { margin: 0 0 0.75rem; }
.page ul, .page ol { padding-left: 1.3rem; margin: 0 0 0.9rem; }
.page li { margin-bottom: 0.3rem; }
.page li::marker { color: var(--gold); }
.page li p { margin: 0; }
.page strong { color: var(--brown); }
.page figure { margin: 1rem 0; text-align: center; }
.page figure img { max-width: 100%; height: auto; border-radius: 4px; }
p.dropcap::first-letter { font-family: var(--f-head); color: var(--red); float: left; font-size: 3.1em; line-height: 0.85; padding: 0.08em 0.12em 0 0; }
.tw { overflow-x: auto; margin: 0.6rem 0 1.1rem; border: 1px solid var(--rule); border-radius: 6px; }
.tw table { border-collapse: collapse; width: 100%; font-size: 0.9rem; line-height: 1.35; }
.tw th { background: var(--wash); font-family: var(--f-sc); font-weight: 400; color: var(--brown); text-align: left; padding: 0.45rem 0.6rem; letter-spacing: 0.02em; white-space: nowrap; }
.tw td { padding: 0.4rem 0.6rem; border-top: 1px solid var(--rule); vertical-align: top; font-variant-numeric: tabular-nums; }
.tw tbody tr:nth-child(even) td { background: var(--stripe); }
.tw td.first { font-family: var(--f-head); color: var(--brown); }
.tw td p { margin: 0; }
.read-aloud { background: var(--read-bg); border-left: 4px solid var(--gold); padding: 0.7rem 1rem; margin: 0.9rem 0; border-radius: 0 6px 6px 0; font-style: italic; }
.dm-note, .note { background: var(--note-bg); border-left: 4px solid var(--red); padding: 0.6rem 0.9rem; margin: 0.9rem 0; border-radius: 0 6px 6px 0; font-size: 0.95rem; }
.read-aloud p:last-child, .dm-note p:last-child, .note p:last-child { margin-bottom: 0; }
.epigraph { text-align: center; font-style: italic; color: var(--ink-2); margin: 0.4rem 2rem 0; }
.attribution { text-align: center; color: var(--gold); font-family: var(--f-sc); font-size: 0.85rem; margin-bottom: 1.2rem; }
.statblock { background: var(--sb-bg); border-top: 3px solid var(--red); border-bottom: 3px solid var(--red); padding: 0.7rem 1rem 0.8rem; margin: 1rem 0 1.4rem;
  font-size: 0.93rem; line-height: 1.45; }
.statblock p { margin: 0 0 0.3rem; }
.statblock .sb-name { font-family: var(--f-sc); color: var(--red); font-size: 1.35rem; line-height: 1.1; word-spacing: 0.12em; }
.statblock .sb-type { color: var(--ink-2); margin-bottom: 0.5rem; }
.statblock .sb-sec { font-family: var(--f-sc); color: var(--red); font-size: 1.05rem; border-bottom: 1px solid var(--red); margin: 0.6rem 0 0.35rem; }
.abil { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 0.3rem; margin: 0.5rem 0 0.6rem; }
.ab { background: var(--paper); border: 1px solid var(--rule); border-radius: 5px; text-align: center; padding: 0.25rem 0.1rem; display: flex; flex-direction: column; line-height: 1.15; }
.ab .an { font-family: var(--f-sc); color: var(--red); font-size: 0.78rem; }
.ab b { font-family: var(--f-head); font-size: 1.05rem; color: var(--ink); }
.ab .am { font-variant-numeric: tabular-nums; }
.ab .as { font-size: 0.7rem; color: var(--ink-2); }
mark, mark.hit { background: var(--mark); color: inherit; border-radius: 2px; padding: 0 0.05em; }
.pager { display: flex; justify-content: space-between; gap: 1rem; margin-top: 3rem; padding-top: 1rem; border-top: 1px solid var(--gold); flex-wrap: wrap; }
.pager a { text-decoration: none; display: flex; flex-direction: column; max-width: 48%; }
.pager a small { font-family: var(--f-sc); color: var(--gold); font-size: 0.75rem; }
.pager a span { font-family: var(--f-head); color: var(--brown); font-size: 1.05rem; }
.pager a.next { text-align: right; margin-left: auto; }

nav.books li.part { font-family: var(--f-sc); color: var(--gold); font-size: 0.72rem; letter-spacing: 0.05em; margin: 0.55rem 0 0.1rem 0.4rem; }
nav.books .sn, .path .sn { display: inline-flex; align-items: center; justify-content: center; min-width: 1.25rem; height: 1.25rem; border-radius: 999px;
  border: 1px solid var(--gold); color: var(--red); font-family: var(--f-sc); font-size: 0.72rem; margin-right: 0.4rem; flex: none; }
nav.books li a { display: flex; align-items: baseline; }
h1.ch small { display: block; font-family: var(--f-head); font-style: italic; font-size: 1.05rem; color: var(--ink-2); margin-top: 0.3rem; }
a.xref { color: var(--red); text-decoration: underline dotted; text-underline-offset: 3px; }
.pager a.next.step { background: var(--paper-3); border: 1px solid var(--gold); border-radius: 8px; padding: 0.5rem 0.8rem; }
.path { background: var(--paper-3); border: 1px solid var(--gold); border-radius: 8px; padding: 0.8rem 1rem 0.9rem; margin: 0 0 1.4rem; }
.path h2 { font-family: var(--f-head); font-weight: 400; color: var(--red); font-size: 1.2rem; margin: 0 0 0.5rem; }
.path ol { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 0.4rem; }
.path li a { display: inline-flex; align-items: center; text-decoration: none; color: var(--ink); border: 1px solid var(--rule); border-radius: 999px;
  padding: 0.2rem 0.7rem 0.2rem 0.3rem; font-size: 0.9rem; background: var(--paper); }
.path li a:hover { border-color: var(--gold); color: var(--red); }
.pathtool { margin: 0.7rem 0 0; font-family: var(--f-head); }
/* Outlander's Papers, the character builder, as the last section */
.page.wide { max-width: none; }
main:has(.page.wide) { padding-block: 0.75rem; }
iframe.papers { display: block; box-sizing: border-box; width: 100%; height: 80vh; border: 1px solid var(--rule); border-radius: 8px; background: var(--paper); }
.pathtool a { color: var(--red); }

/* Encounters: the DM's quick-reference page (DM edition only) */
.enc-link { display: none; }
.enc-on .enc-link { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; text-decoration: none; font-family: var(--f-head);
  color: var(--red); font-size: 1rem; border: 1px solid var(--gold); background: var(--paper-3); border-radius: 6px; padding: 0.35rem 0.65rem; }
.enc-link:hover, .enc-link.cur { background: var(--wash); }
.enc-link .badge { font-family: var(--f-sc); font-size: 0.74rem; color: var(--paper); background: var(--red); border-radius: 999px; min-width: 1.35rem;
  text-align: center; padding: 0.05rem 0.4rem; }
.enc-link .badge:empty { display: none; }
.statblock { position: relative; }
.sb-add { position: absolute; top: 0.55rem; right: 0.6rem; border: 1px solid var(--gold); background: var(--paper-3); color: var(--brown); border-radius: 6px;
  padding: 0.12rem 0.55rem; font-family: var(--f-sc); font-size: 0.78rem; cursor: pointer; letter-spacing: 0.02em; }
.sb-add:hover { border-color: var(--red); color: var(--red); }
.statblock:has(> .sb-add) .sb-name { padding-right: 7.2rem; }
.toast { position: fixed; left: 50%; bottom: calc(1rem + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60; background: var(--brown);
  color: var(--paper); padding: 0.55rem 0.95rem; border-radius: 8px; font-size: 0.92rem; max-width: calc(100vw - 32px); box-shadow: 0 6px 20px rgba(0,0,0,0.25); }
.toast a { color: var(--paper); font-family: var(--f-sc); margin-left: 0.6rem; white-space: nowrap; }
.page.encw { max-width: 80rem; }
.enc-tabs { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0 0 1rem; }
.enc-tab { border: 1px solid var(--rule); background: var(--paper-3); border-radius: 999px; padding: 0.25rem 0.75rem; cursor: pointer; font-family: var(--f-head);
  color: var(--brown); font-size: 0.95rem; }
.enc-tab .n { font-family: var(--f-sc); font-size: 0.75rem; color: var(--ink-2); margin-left: 0.2rem; }
.enc-tab[aria-pressed="true"] { background: var(--brown); border-color: var(--brown); color: var(--paper); }
.enc-tab[aria-pressed="true"] .n { color: var(--paper-2); }
.enc-tab.new { border-style: dashed; color: var(--red); }
.enc-top { display: flex; flex-wrap: wrap; gap: 0.6rem 1rem; align-items: end; margin-bottom: 0.6rem; }
.enc-name { flex: 1 1 16rem; min-width: 0; }
.enc-name input { width: 100%; box-sizing: border-box; font-family: var(--f-head); font-size: 1.55rem; color: var(--brown); background: transparent; border: 0;
  border-bottom: 2px solid var(--gold); padding: 0.1rem 0; }
.enc-name input:focus { outline: none; border-bottom-color: var(--red); }
.enc-tools { display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: center; }
.enc-tools .q { font-size: 0.92rem; color: var(--red); }
.btn { border: 1px solid var(--rule); background: var(--paper-3); color: var(--brown); border-radius: 6px; padding: 0.25rem 0.65rem; cursor: pointer;
  font-family: var(--f-sc); font-size: 0.82rem; letter-spacing: 0.02em; }
.btn:hover:not(:disabled) { border-color: var(--gold); }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn.danger { color: var(--red); }
.btn.go { background: var(--red); border-color: var(--red); color: var(--paper); }
.enc-sum { display: flex; flex-wrap: wrap; gap: 0.3rem 1rem; align-items: center; background: var(--paper-3); border: 1px solid var(--rule); border-radius: 8px;
  padding: 0.5rem 0.8rem; margin: 0 0 0.8rem; font-size: 0.93rem; }
.enc-sum b { font-family: var(--f-head); color: var(--brown); font-weight: 400; font-size: 1.05rem; }
.enc-sum .diff { font-family: var(--f-sc); color: var(--red); }
.enc-sum label { display: inline-flex; align-items: center; gap: 0.3rem; color: var(--ink-2); }
.enc-sum input { width: 3.2rem; padding: 0.15rem 0.3rem; border: 1px solid var(--rule); border-radius: 5px; background: var(--paper); color: var(--ink); font: inherit; }
.enc-add { position: relative; margin: 0 0 0.4rem; max-width: 30rem; }
.enc-add input { width: 100%; box-sizing: border-box; padding: 0.5rem 0.7rem; border: 1px solid var(--gold); border-radius: 6px; background: var(--paper-3);
  color: var(--ink); font-family: var(--f-body); font-size: 0.95rem; }
.page .enc-found { list-style: none; margin: 0.3rem 0 0; padding: 0; display: flex; flex-direction: column; gap: 0.15rem; }
.enc-found button { width: 100%; text-align: left; border: 1px solid var(--rule); background: var(--paper); border-radius: 6px; padding: 0.35rem 0.6rem; cursor: pointer;
  font-family: var(--f-head); color: var(--red); font-size: 1rem; display: flex; justify-content: space-between; gap: 0.6rem; }
.enc-found button small { font-family: var(--f-sc); color: var(--gold); font-size: 0.74rem; white-space: nowrap; }
.enc-found button:hover, .enc-found button:focus-visible { border-color: var(--gold); background: var(--paper-3); }
.enc-hint { color: var(--ink-2); font-size: 0.85rem; margin: 0 0 0.9rem; }
.enc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 23rem), 1fr)); gap: 1rem; align-items: start; }
.enc-card { border: 1px solid var(--rule); border-radius: 8px; background: var(--paper-3); padding: 0.6rem 0.75rem 0.2rem; min-width: 0; }
.enc-head { display: flex; align-items: center; gap: 0.45rem; flex-wrap: wrap; }
.enc-head h2 { flex: 1 1 auto; margin: 0; padding: 0; border: 0; font-family: var(--f-sc); color: var(--red); font-size: 1.25rem; line-height: 1.15; word-spacing: 0.12em; }
.cnt { display: inline-flex; align-items: center; border: 1px solid var(--rule); border-radius: 6px; background: var(--paper); overflow: hidden; }
.cnt button { border: 0; background: transparent; width: 1.9rem; height: 1.75rem; cursor: pointer; color: var(--brown); font-size: 1.05rem; }
.cnt button:disabled { opacity: 0.35; cursor: default; }
.cnt span { min-width: 2rem; text-align: center; font-family: var(--f-sc); color: var(--brown); font-variant-numeric: tabular-nums; }
.enc-meta { margin: 0.25rem 0 0.4rem; font-size: 0.86rem; color: var(--ink-2); }
.enc-meta a { color: var(--red); }
.page .hp-list { list-style: none; margin: 0 0 0.35rem; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(8.6rem, 1fr)); gap: 0.35rem; }
.page .hp-list li, .page .enc-found li { margin: 0; }
.hp { display: flex; align-items: center; gap: 0.3rem; border: 1px solid var(--rule); border-radius: 6px; padding: 0.2rem 0.4rem; background: var(--paper);
  font-variant-numeric: tabular-nums; }
.hp .lab { font-family: var(--f-sc); color: var(--gold); font-size: 0.78rem; min-width: 1rem; }
.hp input { width: 3.3rem; box-sizing: border-box; padding: 0.1rem 0.25rem; border: 1px solid var(--rule); border-radius: 4px; background: var(--paper-3);
  color: var(--ink); font: inherit; font-size: 1rem; text-align: right; }
.hp .of { color: var(--ink-2); font-size: 0.85rem; }
.hp .st { font-family: var(--f-sc); font-size: 0.72rem; color: var(--red); margin-left: auto; }
.hp.bloodied { border-color: var(--gold); }
.hp.down { opacity: 0.6; background: transparent; }
.hp.down .lab, .hp.down .of { text-decoration: line-through; }
.great { display: inline-flex; align-items: center; gap: 0.3rem; font-family: var(--f-sc); font-size: 0.8rem; color: var(--brown); cursor: pointer;
  border: 1px solid var(--rule); border-radius: 6px; padding: 0.15rem 0.5rem; background: var(--paper); }
.great input { accent-color: var(--red); margin: 0; }
.enc-card.is-great .great { border-color: var(--red); color: var(--red); }
.maxhp { display: inline-flex; align-items: center; gap: 0.3rem; font-size: 0.82rem; color: var(--ink-2); margin: 0 0 0.3rem; }
.maxhp input { width: 3.6rem; padding: 0.1rem 0.25rem; border: 1px solid var(--rule); border-radius: 4px; background: var(--paper); color: var(--ink); font: inherit; }
.enc-card .statblock { margin: 0.4rem -0.75rem 0; border-radius: 0 0 8px 8px; border-bottom: 0; }
.enc-empty { color: var(--ink-2); font-style: italic; }
.enc-foot { color: var(--ink-2); font-size: 0.8rem; margin-top: 1.4rem; }

/* Home */
.hero { text-align: center; margin: 0.5rem 0 1.6rem; }
.hero h1 { font-family: var(--f-display); color: var(--red); font-size: clamp(1.7rem, 4.6vw, 2.6rem); line-height: 1.15; margin: 0; text-wrap: balance; }
.hero .sub { font-family: var(--f-head); font-style: italic; color: var(--brown); margin: 0.3rem 0 0.8rem; font-size: 1.05rem; }
.hero .how { color: var(--ink-2); font-size: 0.92rem; max-width: 36rem; margin: 0 auto; }

<script type="application/json" id="data">{"books":[{"key":"guide","title":"Player's Guide to Vvardenfell","short":"Player's Guide","sub":"House rules, peoples, birthsigns, faiths and backgrounds","chapters":[{"id":"guide-into-morrowind","t":"Into Morrowind","s":[{"id":"guide-into-morrowind--how-to-use-this-guide","t":"How to Use This Guide","l":2},{"id":"guide-into-morrowind--the-voyage","t":"The Voyage","l":2},{"id":"guide-into-morrowind--ebonheart","t":"Ebonheart","l":2}],"p":"Arriving","sub":"Beginning Your Journey","h":"\n\n\n<div class=\"epigraph\">\n<p><em>“Every ship to Vvardenfell carries two cargoes: what's in the\nhold, and who's on deck.”<\/em><\/p>\n<\/div>\n<div class=\"attribution\">\n<p>— A saying among East Empire Company sailors<\/p>\n<\/div>\n<h3 id=\"guide-into-morrowind--how-to-use-this-guide\">How to Use This Guide<\/h3>\n<p class=\"dropcap\">This guide is for players. It covers the island of\nVvardenfell in 3E 417, the peoples who live there, the gods they answer\nto, and the house rules this campaign uses. You don't need to have\nplayed any of the Elder Scrolls games. Everything you need to make a\ncharacter is here, and you'll learn the rest in play.<\/p>\n<p>The guide is in three parts.<\/p>\n<ul>\n<li>\n<p><strong>Part One: Arriving.<\/strong> Where the story starts, and the\nhouse rules this campaign plays by, including cover, hiding and\nharvesting.<\/p>\n<\/li>\n<li>\n<p><strong>Part Two: Making Your Character.<\/strong> Eight steps, in\norder, from choosing your people to the questions to answer before the\nfirst session. Begin at <a class=\"xref\" href=\"#guide-making-your-character\">Start\nHere<\/a>.<\/p>\n<\/li>\n<li>\n<p><strong>Part Three: The World.<\/strong> Tamriel's history, its gods,\nand a glossary of the words you'll hear on the island. None of it is\nrequired before play; read it when you're curious.<\/p>\n<\/li>\n<\/ul>\n<p>You'll also need the 2024 <em>Player's Handbook<\/em> for classes,\nspells and the core rules, and <em>Treasures of Morrowind<\/em> for gear,\nprices and services. This guide changes only what's listed under <a class=\"xref\" href=\"#guide-house-rules--house-rules-at-a-glance\">House Rules at a\nGlance<\/a>.<\/p>\n<h3 id=\"guide-into-morrowind--the-voyage\">The Voyage<\/h3>\n<p>The campaign begins aboard the <em>Saint Alessia's Grace<\/em>, an\nEast Empire Company cargo ship that also carries passengers between the\nmainland and Vvardenfell. It is 3E 417, in the reign of Emperor Uriel\nVII, and the voyage is almost over.<\/p>\n<p>You have been at sea for weeks, sharing cramped quarters with\nsailors, merchants and other travellers. This morning the crew are in\nhigh spirits, singing and drinking, because landfall is less than an\nhour away. Through the haze ahead rise the walls of Ebonheart. Beyond\nthem, across the bay, stand the great stone districts of Vivec, and far\ninland, under a grey smudge of ash, is Red Mountain.<\/p>\n<h3 id=\"guide-into-morrowind--ebonheart\">Ebonheart<\/h3>\n<p>Ebonheart is where most outlanders first set foot on Vvardenfell. It\nis Imperial in every sense, and for many newcomers it is the last\nfamiliar place before the real Morrowind begins.<\/p>\n<ul>\n<li>\n<p><strong>Who rules it.<\/strong> Duke Vedam Dren governs the whole\nisland for the Emperor from Castle Ebonheart.<\/p>\n<\/li>\n<li>\n<p><strong>Who guards it.<\/strong> The Imperial Legion keeps a garrison\nhere. Imperial law applies, and drawing steel in the street is taken\nvery seriously.<\/p>\n<\/li>\n<li>\n<p><strong>Who trades there.<\/strong> The East Empire Company runs much\nof the island's trade from Ebonheart's docks and warehouses.<\/p>\n<\/li>\n<li>\n<p><strong>What's nearby.<\/strong> Vivec City, the Temple's holy city,\nlies a short walk along the shore.<\/p>\n<\/li>\n<\/ul>\n<p>Ebonheart and Vivec sit on the island's south coast. Everywhere else\nis a silt strider ride, a boat trip or a long walk away.<\/p>\n<blockquote>\n<figure><img alt=\"\" loading=\"lazy\" src=\"img/b1fe3a75e2eb12c332fc8a7633f428c1282bd576.webp\"/><\/figure>\n<\/blockquote>\n<p><em>The island of Vvardenfell<\/em><\/p>\n"},{"id":"guide-house-rules","t":"House Rules","s":[{"id":"guide-house-rules--house-rules-at-a-glance","t":"House Rules at a Glance","l":2},{"id":"guide-house-rules--cover-sight-and-hiding","t":"Cover, Sight and Hiding","l":2},{"id":"guide-house-rules--cover","t":"Cover","l":3},{"id":"guide-house-rules--seeing","t":"Seeing","l":3},{"id":"guide-house-rules--hiding","t":"Hiding","l":3},{"id":"guide-house-rules--crowds","t":"Crowds","l":3},{"id":"guide-house-rules--harvesting","t":"Harvesting","l":2},{"id":"guide-house-rules--disease-and-the-blight","t":"Disease and the Blight","l":2},{"id":"guide-house-rules--brewing-potions","t":"Brewing Potions","l":2},{"id":"guide-house-rules--apparatus","t":"Apparatus","l":3},{"id":"guide-house-rules--spoiled-potions-and-poisons","t":"Spoiled Potions and Poisons","l":3},{"id":"guide-house-rules--soul-gems-and-enchanting","t":"Soul Gems and Enchanting","l":2},{"id":"guide-house-rules--trapped-souls","t":"Trapped Souls","l":3},{"id":"guide-house-rules--soul-gems","t":"Soul Gems","l":3},{"id":"guide-house-rules--soul-trap","t":"Soul Trap","l":3},{"id":"guide-house-rules--enchanting","t":"Enchanting","l":3},{"id":"guide-house-rules--commissioning-an-enchanter","t":"Commissioning an Enchanter","l":3},{"id":"guide-house-rules--inscribing-scrolls","t":"Inscribing Scrolls","l":3},{"id":"guide-house-rules--crafting-weapons-and-armour","t":"Crafting Weapons and Armour","l":2},{"id":"guide-house-rules--special-materials","t":"Special Materials","l":3},{"id":"guide-house-rules--wear-and-repair","t":"Wear and Repair","l":2}],"p":"Arriving","sub":"How This Campaign Plays","h":"\n\n\n<div class=\"epigraph\">\n<p><em>“The Empire's law is written down. Morrowind's is remembered.\nLearn both.”<\/em><\/p>\n<\/div>\n<div class=\"attribution\">\n<p>— A Legion sergeant, Ebonheart<\/p>\n<\/div>\n<h3 id=\"guide-house-rules--house-rules-at-a-glance\">House Rules at a Glance<\/h3>\n<p class=\"dropcap\">These are the changes to the 2024 rules, and where\neach one is written out in full. Everything else works as the\n<em>Player's Handbook<\/em> says.<\/p>\n<div class=\"tw\"><table><thead><tr><th>Rule<\/th><th>In this campaign<\/th><th>Where<\/th><\/tr><\/thead><tbody><tr><td class=\"first\">Peoples<\/td><td>The ten races of Tamriel replace species, each with its own traits.<\/td><td><a class=\"xref\" href=\"#guide-peoples-of-tamriel\">Step One<\/a><\/td><\/tr><tr><td class=\"first\">Languages<\/td><td>Everyone speaks Tamrielic, the common tongue, and knows two more languages.<\/td><td><a class=\"xref\" href=\"#guide-peoples-of-tamriel\">Step One<\/a><\/td><\/tr><tr><td class=\"first\">Backgrounds<\/td><td>The <em>Player's Handbook<\/em> backgrounds without their Origin feats, plus ten Morrowind backgrounds, each with a connection to the island.<\/td><td><a class=\"xref\" href=\"#guide-backgrounds-of-tamriel\">Step Three<\/a><\/td><\/tr><tr><td class=\"first\">Birthsigns<\/td><td>Your birthsign replaces your background's Origin feat. Any combination of background and birthsign works.<\/td><td><a class=\"xref\" href=\"#guide-birthsigns-of-tamriel\">Step Four<\/a><\/td><\/tr><tr><td class=\"first\">Ability scores<\/td><td>Each player chooses their method: the standard array, point buy or dice.<\/td><td><a class=\"xref\" href=\"#guide-ability-scores\">Step Five<\/a><\/td><\/tr><tr><td class=\"first\">Weapon Mastery<\/td><td>Works as written, using the weapons in <em>Treasures of Morrowind<\/em>.<\/td><td><a class=\"xref\" href=\"#guide-classes-on-vvardenfell--weapon-mastery\">Step Two<\/a><\/td><\/tr><tr><td class=\"first\">Gods and patrons<\/td><td>Clerics, paladins and warlocks serve a named god or patron. Some subclasses from older books are allowed.<\/td><td><a class=\"xref\" href=\"#guide-your-faith\">Step Six<\/a><\/td><\/tr><tr><td class=\"first\">Losing favour<\/td><td>Optional rules for characters who break faith with their god. Your DM decides whether to use them.<\/td><td><a class=\"xref\" href=\"#guide-the-gods-of-tamriel--losing-favour-optional-rules\">The Gods of Tamriel<\/a><\/td><\/tr><tr><td class=\"first\">Starting equipment<\/td><td>Class packages as in the <em>Player's Handbook<\/em>, or Morrowind-made versions that work the same. Gold buys at <em>Treasures<\/em> prices.<\/td><td><a class=\"xref\" href=\"#guide-starting-equipment\">Step Seven<\/a><\/td><\/tr><tr><td class=\"first\">Money<\/td><td>Gold pieces work as normal. On Vvardenfell, people call them drakes.<\/td><td><a class=\"xref\" href=\"#items-using-this-book--prices-and-rarity\">Treasures<\/a><\/td><\/tr><tr><td class=\"first\">Wear and repair<\/td><td>Optional: weapons, armour and shields wear out, and need repairing.<\/td><td><a class=\"xref\" href=\"#guide-house-rules--wear-and-repair\">Below<\/a><\/td><\/tr><tr><td class=\"first\">Crafting<\/td><td>Characters with the right tools can make their own weapons, armour and shields.<\/td><td><a class=\"xref\" href=\"#guide-house-rules--crafting-weapons-and-armour\">Below<\/a><\/td><\/tr><tr><td class=\"first\">Enchanting<\/td><td>Soul gems, the Soul Trap spell, and making magic items of your own.<\/td><td><a class=\"xref\" href=\"#guide-house-rules--soul-gems-and-enchanting\">Below<\/a><\/td><\/tr><tr><td class=\"first\">Scrolls<\/td><td>Anyone who can read can use a scroll, and some characters can write them.<\/td><td><a class=\"xref\" href=\"#guide-house-rules--inscribing-scrolls\">Below<\/a><\/td><\/tr><tr><td class=\"first\">Potions<\/td><td>Brewing potions and poisons from pairs of ingredients, with alchemy apparatus.<\/td><td><a class=\"xref\" href=\"#guide-house-rules--brewing-potions\">Below<\/a><\/td><\/tr><tr><td class=\"first\">Travel, training and crime<\/td><td>Silt striders and boats, trainers, and the fines for breaking the law.<\/td><td><a class=\"xref\" href=\"#items-services-and-travel\">Treasures<\/a><\/td><\/tr><tr><td class=\"first\">Weather<\/td><td>Fog, rain, storms, ash storms and Blight storms all affect play.<\/td><td><a class=\"xref\" href=\"#reckoning-weather\">The Reckoning of Days<\/a><\/td><\/tr><tr><td class=\"first\">Cover, sight and hiding<\/td><td>The 2024 rules you'll need most, with crowds added.<\/td><td><a class=\"xref\" href=\"#guide-house-rules--cover-sight-and-hiding\">Below<\/a><\/td><\/tr><tr><td class=\"first\">Harvesting<\/td><td>Taking ingredients and trophies from the creatures you kill.<\/td><td><a class=\"xref\" href=\"#guide-house-rules--harvesting\">Below<\/a><\/td><\/tr><tr><td class=\"first\">Disease and the Blight<\/td><td>How diseases are caught, how they wear you down, and how they're cured.<\/td><td><a class=\"xref\" href=\"#guide-house-rules--disease-and-the-blight\">Below<\/a><\/td><\/tr><\/tbody><\/table><\/div>\n\n\n\n<h3 id=\"guide-house-rules--cover-sight-and-hiding\">Cover, Sight and Hiding<\/h3>\n<p>Fights on Vvardenfell happen among market stalls and crowds in town,\nand in the dark below ground. These are the 2024 rules you'll need most\noften, in one place.<\/p>\n<h4 id=\"guide-house-rules--cover\">Cover<\/h4>\n<div class=\"tw\"><table><thead><tr><th>Cover<\/th><th>Effect<\/th><th>Examples<\/th><\/tr><\/thead><tbody><tr><td class=\"first\">Half<\/td><td>+2 to AC and Dexterity saving throws<\/td><td>Low wall, market stall, large furniture, another creature, thin tree<\/td><\/tr><tr><td class=\"first\">Three-quarters<\/td><td>+5 to AC and Dexterity saving throws<\/td><td>Arrow slit, stacked crates, thick tree trunk<\/td><\/tr><tr><td class=\"first\">Total<\/td><td>Can't be targeted directly by an attack or a spell<\/td><td>Solid wall, closed door, a statue's plinth<\/td><\/tr><\/tbody><\/table><\/div>\n<ul>\n<li>\n<p><strong>Cover doesn't stack.<\/strong> If several things are in the\nway, use the best one.<\/p>\n<\/li>\n<li>\n<p><strong>Areas get round it.<\/strong> A spell with an area of effect\ncan still reach a creature behind Total Cover, if the area spreads\naround the obstacle.<\/p>\n<\/li>\n<\/ul>\n<h4 id=\"guide-house-rules--seeing\">Seeing<\/h4>\n<div class=\"tw\"><table><thead><tr><th>Area<\/th><th>Effect<\/th><th>Examples<\/th><\/tr><\/thead><tbody><tr><td class=\"first\">Lightly Obscured<\/td><td>Disadvantage on Wisdom (Perception) checks to see things in it<\/td><td>Dim light, patchy fog, moderate foliage, drifting ash<\/td><\/tr><tr><td class=\"first\">Heavily Obscured<\/td><td>Anyone trying to see something in it is effectively Blinded<\/td><td>Darkness, thick fog, dense foliage, a Blight storm<\/td><\/tr><\/tbody><\/table><\/div>\n<ul>\n<li>\n<p><strong>Darkvision.<\/strong> Within its range, dim light counts as\nbright light, and darkness as dim light. Most elves, the Khajiit and the\nOrcs have it, so a dark tomb is only Lightly Obscured for them. Humans\nneed a torch.<\/p>\n<\/li>\n<\/ul>\n<h4 id=\"guide-house-rules--hiding\">Hiding<\/h4>\n<ul>\n<li>\n<p><strong>When you can hide.<\/strong> A creature can take the Hide\naction while it's Heavily Obscured or behind Three-Quarters or Total\nCover, and out of every enemy's line of sight.<\/p>\n<\/li>\n<li>\n<p><strong>The check.<\/strong> It makes a DC 15 Dexterity (Stealth)\ncheck. On a success, it has the Invisible condition. The check's total\nbecomes the DC for others to find it with a Wisdom (Perception)\ncheck.<\/p>\n<\/li>\n<li>\n<p><strong>When it ends.<\/strong> It stops being hidden when it makes a\nsound louder than a whisper, an enemy finds it, it makes an attack roll,\nor it casts a spell with a Verbal component.<\/p>\n<\/li>\n<\/ul>\n<h4 id=\"guide-house-rules--crowds\">Crowds<\/h4>\n<p>Markets, docks and plazas are rarely empty. When a fight breaks out\namong bystanders, the DM marks the crowd on the battle map as a few\nzones.<\/p>\n<ul>\n<li>\n<p><strong>Terrain.<\/strong> A crowd is difficult terrain.<\/p>\n<\/li>\n<li>\n<p><strong>Cover.<\/strong> A creature in a crowd, or behind one, has\nHalf Cover. That isn't enough to hide, unless a creature has a trait\nthat says so, like a cutpurse who can melt into the crowd.<\/p>\n<\/li>\n<li>\n<p><strong>The crowd runs.<\/strong> At the start of each round after the\nfirst, each zone shrinks by one square as people flee. By the third\nround there's little left to hide in.<\/p>\n<\/li>\n<li>\n<p><strong>Bystanders get hurt.<\/strong> Area spells catch them too, and\nhurting them is a crime (see <a class=\"xref\" href=\"#items-services-and-travel--crime-and-fines\">Crime\nand Fines<\/a> in <em>Treasures of Morrowind<\/em>).<\/p>\n<\/li>\n<\/ul>\n<h3 id=\"guide-house-rules--harvesting\">Harvesting<\/h3>\n<p>When a creature dies, you can harvest the ingredients and trophies\nits body holds: hides, shells, salts, hearts and the like. Your DM tells\nyou what's there.<\/p>\n<ul>\n<li>\n<p><strong>Time.<\/strong> Ten minutes for a Medium or smaller creature,\n30 minutes for a Large one, and an hour for anything bigger.<\/p>\n<\/li>\n<li>\n<p><strong>Skill.<\/strong> Survival for beasts and kwama. Arcana for\nDaedra, undead, ash creatures and vampires. Investigation for\nconstructs.<\/p>\n<\/li>\n<li>\n<p><strong>DC.<\/strong> 10 for a creature of challenge rating 0 to 2, 13\nfor 3 to 6, 15 for 7 to 12, and 18 for 13 and up.<\/p>\n<\/li>\n<li>\n<p><strong>Result.<\/strong> On a success, you get everything the body\nholds. On a failure, you get half, rounded down. If you fail by 5 or\nmore, the remains are ruined.<\/p>\n<\/li>\n<li>\n<p><strong>Value.<\/strong> Ingredients are priced in <em>Treasures of\nMorrowind<\/em> at what an alchemist or trader charges, and most will buy\nat half that. Hides, shells and resin also count towards the materials\nfor <a class=\"xref\" href=\"#guide-house-rules--crafting-weapons-and-armour\">crafting<\/a>.<\/p>\n<\/li>\n<li>\n<p><strong>Daedra.<\/strong> When a Daedra's body is destroyed, its\nspirit returns to Oblivion, but some of its substance stays behind:\nhearts, skins and salts.<\/p>\n<\/li>\n<\/ul>\n<h3 id=\"guide-house-rules--disease-and-the-blight\">Disease and the Blight<\/h3>\n<p>Vvardenfell's beasts carry disease, and the ash storms off Red\nMountain carry worse. There are two kinds: common diseases and Blight\ndiseases. Each one gives its own penalty while you have it, and your DM\nwill tell you what yours does.<\/p>\n<ul>\n<li>\n<p><strong>Bites and blows.<\/strong> When a diseased or blighted\ncreature hits you, you might have to make a Constitution saving throw.\nOn a failure, you catch its disease.<\/p>\n<\/li>\n<li>\n<p><strong>Blight storms.<\/strong> Each hour you spend in a Blight storm\nwithout shelter, make a DC 13 Constitution saving throw. On a failure,\nyou catch a Blight disease.<\/p>\n<\/li>\n<li>\n<p><strong>Resisting.<\/strong> Anything that gives Advantage on saving\nthrows against disease, such as the Argonian and Redguard traits or a\nResist Disease potion, applies to all of these saves.<\/p>\n<\/li>\n<\/ul>\n<div class=\"tw\"><table><thead><tr><th><\/th><th>Common disease<\/th><th>Blight disease<\/th><\/tr><\/thead><tbody><tr><td class=\"first\">Saving throw at the end of each long rest<\/td><td>DC 12 Constitution<\/td><td>DC 15 Constitution<\/td><\/tr><tr><td class=\"first\">On a failure<\/td><td>You gain 1 Exhaustion level, to a maximum of 2 from the disease<\/td><td>You gain 1 Exhaustion level, to a maximum of 3 from the disease<\/td><\/tr><tr><td class=\"first\">On a success<\/td><td>The disease ends<\/td><td>Nothing changes; only a cure ends it<\/td><\/tr><tr><td class=\"first\">Cures<\/td><td>Lesser Restoration, a Cure potion, or a Temple or Imperial Cult healer (25 gp)<\/td><td>Greater Restoration, a Cure Blight Disease potion, or a Temple healer (50 gp); the Imperial Cult can't cure the Blight<\/td><\/tr><\/tbody><\/table><\/div>\n<ul>\n<li>\n<p><strong>Exhaustion.<\/strong> While you have a disease, finishing a\nlong rest doesn't remove the Exhaustion it gave you. Once you're cured,\nyou lose it normally, one level per long rest.<\/p>\n<\/li>\n<li>\n<p><strong>Prices.<\/strong> Potions and healers are listed in <a class=\"xref\" href=\"#items-services-and-travel\">Treasures of Morrowind<\/a>.<\/p>\n<\/li>\n<li>\n<p><strong>Corprus.<\/strong> The Divine Disease can't be caught from\ncorprus beasts, and no cure is known. If it ever touches your character,\nyour DM will handle it as part of the story.<\/p>\n<\/li>\n<\/ul>\n<h3 id=\"guide-house-rules--brewing-potions\">Brewing Potions<\/h3>\n<p>Characters who carry alchemy apparatus and gather ingredients can\nbrew their own potions and poisons. Each ingredient's two effects are in\n<a class=\"xref\" href=\"#items-ingredients\">Ingredients<\/a>, what each effect and\ngrade does is in <a class=\"xref\" href=\"#items-potions--potion-grades\">Potions<\/a>, and the\napparatus is in <a class=\"xref\" href=\"#items-tools-and-equipment--alchemy-apparatus\">Alchemy\nApparatus<\/a>, all in <em>Treasures of Morrowind<\/em>.<\/p>\n<ul>\n<li>\n<p><strong>Ingredients.<\/strong> Choose two ingredients that share an\neffect: any two from the same row of <a class=\"xref\" href=\"#items-ingredients--brewing-by-effect\">Brewing by Effect<\/a>. The brew has\nthat effect. No two ingredients share both their effects, so every pair\nmakes exactly one brew.<\/p>\n<\/li>\n<li>\n<p><strong>Potion or poison.<\/strong> A brew with a helpful effect is a\npotion. A brew with a harmful effect is a poison.<\/p>\n<\/li>\n<li>\n<p><strong>One of several.<\/strong> Fortify Body, Fortify Mind, Drain\nBody, Drain Mind and Resistance each cover several abilities or damage\ntypes. Choose one when you brew. The bottle carries Morrowind's name: a\nFortify Body potion brewed for Strength is a Fortify Strength\npotion.<\/p>\n<\/li>\n<li>\n<p><strong>Time.<\/strong> Each brew takes 10 minutes. You can brew a\nnumber of times each day equal to your Proficiency Bonus.<\/p>\n<\/li>\n<li>\n<p><strong>The check.<\/strong> Make an Intelligence check, adding your\nmortar and pestle's bonus, and your Proficiency Bonus if you're\nproficient with Alchemist's Supplies or an Herbalism Kit. The total sets\nthe grade.<\/p>\n<\/li>\n<\/ul>\n<div class=\"tw\"><table><thead><tr><th>Check total<\/th><th>Result<\/th><\/tr><\/thead><tbody><tr><td>9 or lower<\/td><td>Spoiled. A potion works at Cheap grade but also has a harmful side effect, which the DM chooses. A poison is ruined<\/td><\/tr><tr><td>10 to 14<\/td><td>Cheap<\/td><\/tr><tr><td>15 to 19<\/td><td>Bargain<\/td><\/tr><tr><td>20 to 24<\/td><td>Standard<\/td><\/tr><tr><td>25 to 29<\/td><td>Quality<\/td><\/tr><tr><td>30 or higher<\/td><td>Exclusive<\/td><\/tr><\/tbody><\/table><\/div>\n<h4 id=\"guide-house-rules--apparatus\">Apparatus<\/h4>\n<p>Each piece of apparatus has a grade, which limits how good a brew it\ncan make.<\/p>\n<div class=\"tw\"><table><thead><tr><th>Apparatus<\/th><th>Best brew<\/th><\/tr><\/thead><tbody><tr><td>Apprentice's<\/td><td>Bargain<\/td><\/tr><tr><td>Journeyman's<\/td><td>Standard<\/td><\/tr><tr><td>Master's<\/td><td>Quality<\/td><\/tr><tr><td>Grandmaster's or Secret Master's<\/td><td>Exclusive<\/td><\/tr><\/tbody><\/table><\/div>\n<ul>\n<li>\n<p><strong>Mortar and pestle.<\/strong> You need one to brew, and no brew\ncan be better than its limit.<\/p>\n<\/li>\n<li>\n<p><strong>Retort.<\/strong> A potion is one grade better, up to the\nlimit of both the retort and your mortar and pestle.<\/p>\n<\/li>\n<li>\n<p><strong>Calcinator.<\/strong> A poison is one grade better, with the\nsame limits.<\/p>\n<\/li>\n<li>\n<p><strong>Alembic.<\/strong> A brew that would have spoiled comes out as\na Cheap potion or poison, with no side effect. With a Master's or better\nalembic, it comes out as Bargain. A brew the alembic saves can't be\nimproved by a retort or calcinator.<\/p>\n<\/li>\n<\/ul>\n<p><strong>Example.<\/strong> With an Apprentice's mortar and pestle and\nretort, a check of 12 makes a Cheap potion, which the retort raises to\nBargain. A check of 17 makes a Bargain potion, which is as good as\nApprentice's apparatus gets. To brew Standard potions, you need a\nJourneyman's mortar and pestle.<\/p>\n<h4 id=\"guide-house-rules--spoiled-potions-and-poisons\">Spoiled Potions and Poisons<\/h4>\n<p>A spoiled potion affects whoever drinks it with its side effect as\nwell. An alchemist can label it honestly, or not.<\/p>\n<p>As a Bonus Action, you can coat a weapon or up to three pieces of\nammunition with a poison. The poison lasts for 1 minute, or until the\ncoated weapon or ammunition hits a creature, which is then subjected to\nthe poison's effect. The Morag Tong are the island's masters of the\nart.<\/p>\n<h3 id=\"guide-house-rules--soul-gems-and-enchanting\">Soul Gems and Enchanting<\/h3>\n<h4 id=\"guide-house-rules--trapped-souls\">Trapped Souls<\/h4>\n<p>Every enchantment on Vvardenfell is powered by a soul. Enchanters\ntrap the souls of creatures in soul gems, crystals that hold a soul for\never, and then spend that soul to bind a spell into an object. The Mages\nGuild sells empty gems in every hall, and its members trap souls as\ncasually as a hunter sets snares.<\/p>\n<ul>\n<li>\n<p><strong>Creatures only.<\/strong> In the games, only creatures can be\nsoul-trapped, so any creature whose type isn't Humanoid can be. The\nsouls of people can't. Necromancers whisper about black soul gems that\ncan hold a person's soul. If they exist, they're Very Rare, illegal, and\nthe Temple would burn anyone found with one.<\/p>\n<\/li>\n<li>\n<p><strong>Daedra.<\/strong> Daedra are the enchanter's favourite prey:\ntheir souls are strong, and nobody mourns them.<\/p>\n<\/li>\n<li>\n<p><strong>One soul, one gem.<\/strong> A gem holds a single soul. Once\nthe soul is spent, the gem crumbles.<\/p>\n<\/li>\n<li>\n<p><strong>Azura's Star.<\/strong> Legend tells of a soul gem that is\nnever used up: one of the Daedric artefacts.<\/p>\n<\/li>\n<\/ul>\n<h4 id=\"guide-house-rules--soul-gems\">Soul Gems<\/h4>\n<p>A soul gem can hold the soul of a creature whose challenge rating is\nno higher than the gem allows. A bigger gem can hold a smaller soul, but\nit's a waste of a good gem.<\/p>\n<div class=\"tw\"><table><thead><tr><th>Soul gem<\/th><th>Holds a soul of<\/th><th>For example<\/th><th>Empty<\/th><th>Filled<\/th><th>Recharges<\/th><\/tr><\/thead><tbody><tr><td class=\"first\">Petty<\/td><td>CR 1/2 or lower<\/td><td>Rats, mudcrabs, cliff racers<\/td><td>10 gp<\/td><td>25 gp<\/td><td>1 charge<\/td><\/tr><tr><td class=\"first\">Lesser<\/td><td>CR 1 or 2<\/td><td>Scamps, alits, kagouti<\/td><td>25 gp<\/td><td>75 gp<\/td><td>2 charges<\/td><\/tr><tr><td class=\"first\">Common<\/td><td>CR 3 to 5<\/td><td>Clannfear, dremora, flame atronachs<\/td><td>100 gp<\/td><td>250 gp<\/td><td>3 charges<\/td><\/tr><tr><td class=\"first\">Greater<\/td><td>CR 6 to 9<\/td><td>Daedroths, winged twilights<\/td><td>500 gp<\/td><td>1,000 gp<\/td><td>4 charges<\/td><\/tr><tr><td class=\"first\">Grand<\/td><td>CR 10 or higher<\/td><td>Dremora lords, golden saints<\/td><td>Not sold<\/td><td>5,000 gp<\/td><td>5 charges<\/td><\/tr><\/tbody><\/table><\/div>\n<ul>\n<li>\n<p><strong>Buying and selling.<\/strong> The Mages Guild and many traders\nsell Petty to Greater gems; Grand gems are never sold empty, and turn up\nonly in ruins, Telvanni towers and rich enchanters' hands. Filled gems\nsell for half their filled price, and enchanters are always buying.<\/p>\n<\/li>\n<li>\n<p><strong>Recharging.<\/strong> Cast when used items and enchanted\nweapons never recharge on their own. As a Magic action, you can touch a\nfilled soul gem to one: the gem crumbles and the item regains the\ncharges shown, up to its maximum. Enchanters sell filled gems at the\nprices above.<\/p>\n<\/li>\n<\/ul>\n<h4 id=\"guide-house-rules--soul-trap\">Soul Trap<\/h4>\n<p>Souls are caught with the Soul Trap spell, which the Mages Guild\nteaches its members; in this campaign it's on the sorcerer, warlock and\nwizard spell lists. Scrolls such as <em>Fphyggi's Gem-Feeder<\/em> work\nthe same way.<\/p>\n<p><em><strong>Soul Trap.<\/strong><\/em> <em>Level 1 Necromancy\n(Sorcerer, Warlock, Wizard).<\/em> <strong>Casting Time:<\/strong> Bonus\nAction. <strong>Range:<\/strong> 60 feet. <strong>Components:<\/strong> V,\nS, M (an empty soul gem, which isn't used up).\n<strong>Duration:<\/strong> 1 minute.<\/p>\n<p>One creature you can see within range must succeed on a Charisma\nsaving throw against your spell save DC or have the Soul-Bound condition\nuntil the spell ends. Humanoids can't be affected by this spell.<\/p>\n<p><strong>Soul-Bound.<\/strong> A Soul-Bound creature's soul is marked.\nIf it dies while Soul-Bound, its soul flies into the smallest empty soul\ngem the caster carries that can hold it, which begins to glow; if\nthere's none, the soul is lost. The condition has no other effect.<\/p>\n<h4 id=\"guide-house-rules--enchanting\">Enchanting<\/h4>\n<p>Characters can make their own magic items, or pay an enchanter to\nmake them.<\/p>\n<div class=\"tw\"><table><thead><tr><th>Item rarity<\/th><th>Soul gem<\/th><th>Base item<\/th><th>Cost<\/th><th>DC<\/th><\/tr><\/thead><tbody><tr><td class=\"first\">Common<\/td><td>Petty<\/td><td>Any clothing, jewellery, weapon or armour<\/td><td>50 gp<\/td><td>10<\/td><\/tr><tr><td class=\"first\">Uncommon<\/td><td>Common<\/td><td>Expensive or better clothing or jewellery; any weapon or armour<\/td><td>250 gp<\/td><td>15<\/td><\/tr><tr><td class=\"first\">Rare<\/td><td>Greater<\/td><td>Extravagant or better clothing or jewellery; weapons and armour of an Uncommon or rarer material<\/td><td>2,500 gp<\/td><td>20<\/td><\/tr><tr><td class=\"first\">Very Rare<\/td><td>Grand<\/td><td>Exquisite clothing or jewellery; weapons and armour of a Rare or rarer material<\/td><td>20,000 gp<\/td><td>25<\/td><\/tr><\/tbody><\/table><\/div>\n<ul>\n<li>\n<p><strong>Choose the item.<\/strong> Pick an item from <a class=\"xref\" href=\"#items-magic-items\">Magic Items<\/a> in <em>Treasures of\nMorrowind<\/em>, or design one with the DM using it as a guide. Its\nrarity sets everything else in the table.<\/p>\n<\/li>\n<li>\n<p><strong>The base item.<\/strong> Better items hold stronger\nenchantments: see <a class=\"xref\" href=\"#items-armour-and-clothing\">Armour and\nClothing<\/a> for clothing and jewellery grades, and <a class=\"xref\" href=\"#items-weapons\">Weapons<\/a> for materials, in <em>Treasures of\nMorrowind<\/em>.<\/p>\n<\/li>\n<li>\n<p><strong>The soul.<\/strong> You need a filled soul gem of at least the\nsize shown. Constant effect enchantments need a gem one size larger. A\nVery Rare constant effect needs a Grand soul gem holding the soul of a\ncreature of CR 12 or higher, such as a golden saint.<\/p>\n<\/li>\n<li>\n<p><strong>The spell.<\/strong> You must know the effect you're binding:\ncast a spell that produces it, use up a scroll of it, or study an item\nthat has it, which isn't harmed. For an enchanted weapon, any spell or\ncantrip that deals the element's damage will do, such as <em>Fire\nBolt<\/em> for fire.<\/p>\n<\/li>\n<li>\n<p><strong>Cost and time.<\/strong> The cost covers reagents, inks and\nthe work of preparing the base item. Enchanting an item takes one Long\nRest.<\/p>\n<\/li>\n<li>\n<p><strong>The check.<\/strong> When the Long Rest ends, make an\nIntelligence (Arcana) check against the DC shown. On a success, the item\nis finished. If you fail by 4 or less while enchanting a weapon, it\ncomes out wild (see <a class=\"xref\" href=\"#items-magic-items--enchanted-weapons\">Enchanted\nWeapons<\/a> in <em>Treasures of Morrowind<\/em>). On any other failure,\nthe soul and half the gold are wasted, but the base item survives and\nyou can try again.<\/p>\n<\/li>\n<li>\n<p><strong>Charges.<\/strong> A soul's size sets its level, from 1 for\nPetty to 5 for Grand. A cast when used item holds that many charges, and\nits spell can't be of a higher level. An enchanted weapon spends up to\nthat many per hit and holds twice as many, and its grade and damage die\nfollow the soul (see <a class=\"xref\" href=\"#items-magic-items--enchanted-weapons\">Enchanted\nWeapons<\/a>). You can't bind a soul of a higher level than your highest\nspell slot: a wizard binds a Lesser soul at 3rd level, and a Grand one\nat 9th.<\/p>\n<\/li>\n<li>\n<p><strong>Materials and magic.<\/strong> A material's bonus doesn't add\nto a magic bonus (see <a class=\"xref\" href=\"#items-weapons--materials\">Materials<\/a> in\n<em>Treasures of Morrowind<\/em>): a glass sword enchanted with fire\nstays +2.<\/p>\n<\/li>\n<\/ul>\n<h4 id=\"guide-house-rules--commissioning-an-enchanter\">Commissioning an Enchanter<\/h4>\n<p>Enchanters at every Mages Guild hall, and the Telvanni enchanters of\nSadrith Mora, make items to order. They charge the item's full price\nfrom <em>Treasures of Morrowind<\/em>, take a day and never fail.\nBringing your own filled soul gem takes its filled price off the bill.\nFew enchanters will make a Very Rare item for anyone they don't know\nwell.<\/p>\n<h4 id=\"guide-house-rules--inscribing-scrolls\">Inscribing Scrolls<\/h4>\n<p>Scrolls are the one magic item that needs no soul: the spell is\nwritten into the paper, so anyone who can read can release it (see <a class=\"xref\" href=\"#items-magic-items--scrolls\">Scrolls<\/a> in <em>Treasures of\nMorrowind<\/em>).<\/p>\n<ul>\n<li>\n<p><strong>What you need.<\/strong> Proficiency with Calligrapher's\nSupplies, a set of Calligrapher's Supplies, and a sheet of paper or\nparchment for each scroll.<\/p>\n<\/li>\n<li>\n<p><strong>The spell.<\/strong> You must know the spell (have it prepared\nor always prepared) or use a Mages Guild hall's library. Each hall keeps\nits own catalogue, and from a library you can't inscribe a spell above\nyour highest-level spell slot.<\/p>\n<\/li>\n<li>\n<p><strong>The cost.<\/strong> A spell you know uses up a spell slot of\nits level, as if you'd cast it. Cantrips need none, and a racial or\nbirthsign spell can use its free casting instead. A library spell costs\nthe Guild's fee instead: 50 gp per scroll, or 25 gp for members. Either\nway, a costly material component is used up, and inscribing takes about\nan hour.<\/p>\n<\/li>\n<li>\n<p><strong>The finished scroll.<\/strong> Anyone who can read can use it.\nIts save DC and attack bonus are set by the spell's level: DC 13/+5 up\nto level 3, DC 15/+7 at 4–5, DC 17/+9 at 6–8 and DC 19/+11 at 9.<\/p>\n<\/li>\n<\/ul>\n<h3 id=\"guide-house-rules--crafting-weapons-and-armour\">Crafting Weapons and Armour<\/h3>\n<p>Characters with the right tools can make their own weapons, armour\nand shields. These rules replace the <em>Player's Handbook<\/em>'s\ncrafting rules for the weapons, armour and shields in <em>Treasures of\nMorrowind<\/em>.<\/p>\n<div class=\"tw\"><table><thead><tr><th>Tool<\/th><th>Makes<\/th><\/tr><\/thead><tbody><tr><td>Smith's Tools<\/td><td>Weapons, armour and shields of metal, glass, ebony, stalhrim or Daedric; bonemold, dreugh and trollbone armour; bonemold and dreugh shields<\/td><\/tr><tr><td>Leatherworker's Tools<\/td><td>Leather, fur, hide, scale and chitin armour: netch leather, Nordic fur and bearskin, wolf, bear, Imperial studded leather, newtscale and chitin; netch leather and chitin shields; quivers<\/td><\/tr><tr><td>Woodcarver's Tools<\/td><td>Weapons of wood, chitin, bonemold or dreugh shell: bows, crossbows, arrows, bolts, clubs, staffs and every chitin weapon<\/td><\/tr><\/tbody><\/table><\/div>\n<ul>\n<li>\n<p><strong>Proficiency and tools.<\/strong> You need proficiency with the\ntool that makes the item, and the tool itself. An armourer's hammer\ncan't make anything.<\/p>\n<\/li>\n<li>\n<p><strong>A workshop.<\/strong> Smithing needs a forge, and any smith\nwill rent you theirs for 1 gp a day. Leatherwork and woodcarving can be\ndone anywhere.<\/p>\n<\/li>\n<li>\n<p><strong>Materials.<\/strong> Materials cost half the item's price. Raw\nebony, glass and adamantium count towards it at their prices in <a class=\"xref\" href=\"#items-tools-and-equipment--trade-goods\">Trade Goods<\/a>, and so do hides, shells\nand resin harvested from creatures, at their value in the <em>Bestiary\nof Morrowind<\/em>.<\/p>\n<\/li>\n<li>\n<p><strong>Time.<\/strong> The work takes one day per 50 gp of the item's\nprice, rounded up, or one day per 100 gp for Rare items, so Rare gear\ntakes 50 to 75 days. Very Rare gear takes 100 days. A helper proficient\nwith the same tool halves the time. On the road, a Long Rest counts as\nhalf a day of leatherwork or woodcarving.<\/p>\n<\/li>\n<li>\n<p><strong>The check.<\/strong> When the work is done, make a check with\nthe tool: Strength for Smith's Tools, Dexterity for the others. The DC\nis 10 for a Common item, 15 for Uncommon, 20 for Rare and 25 for Very\nRare. On a success, the item is finished.<\/p>\n<\/li>\n<li>\n<p><strong>Near misses.<\/strong> If you fail by 4 or less, the item is\nfinished but flawed: it starts with a −1 penalty under the <a class=\"xref\" href=\"#guide-house-rules--wear-and-repair\">Wear and Repair<\/a> rule, which can be\nrepaired as normal.<\/p>\n<\/li>\n<li>\n<p><strong>Failure.<\/strong> If you fail by 5 or more, half the\nmaterials are wasted, and you have to start again.<\/p>\n<\/li>\n<\/ul>\n<h4 id=\"guide-house-rules--special-materials\">Special Materials<\/h4>\n<ul>\n<li>\n<p><strong>Masters only.<\/strong> Proficiency is enough for Common and\nUncommon gear. Rare and Very Rare gear, such as glass, ebony, stalhrim\nand Daedric, also needs a master to teach you how to work it. That takes\na favour or a quest, not gold, and the DM decides who on the island\nknows how.<\/p>\n<\/li>\n<li>\n<p><strong>Bonemold.<\/strong> Bonemold is bone glued and moulded with\nshalk resin, not forged. A suit of bonemold armour needs four shalk\nresins, which cover its materials, and anything smaller needs one.<\/p>\n<\/li>\n<li>\n<p><strong>Daedric.<\/strong> Daedric gear needs a Daedra heart as well\nas ebony.<\/p>\n<\/li>\n<li>\n<p><strong>Can't be made.<\/strong> Dwemer gear is salvaged, not forged:\nno one living knows how the Dwemer worked their metal. The armour of an\norder, such as Indoril, Royal Guard, Her Hand's, Duke's Guard silver and\nDark Brotherhood, is made only for its members, and Daedric tower\nshields come only from golden saints.<\/p>\n<\/li>\n<\/ul>\n<h3 id=\"guide-house-rules--wear-and-repair\">Wear and Repair<\/h3>\n<p>In the games, gear wears down with use. This optional rule brings\nthat into play; your DM decides whether to use it.<\/p>\n<ul>\n<li>\n<p><strong>Wear.<\/strong> When a creature scores a Critical Hit against\nyou, your armour or your shield (your choice) takes a −1 penalty to the\nAC it grants. Natural armour, such as an Argonian's Scaled Hide, doesn't\nwear. When you roll a 1 on an attack roll, your weapon takes a −1\npenalty to its attack and damage rolls. Some creatures, such as the\nhunger, damage gear too.<\/p>\n<\/li>\n<li>\n<p><strong>Broken.<\/strong> Armour and weapons break at −3, and a shield\nbreaks when its bonus reaches +0. A broken item is useless until it's\nrepaired.<\/p>\n<\/li>\n<li>\n<p><strong>Repair.<\/strong> A smith repairs each point of penalty for a\nquarter of the item's price. A character proficient with Smith's Tools\ncan do their own repairs with an armourer's hammer (see <a class=\"xref\" href=\"#items-tools-and-equipment--armourers-hammers\">Armourer's Hammers<\/a> in\n<em>Treasures of Morrowind<\/em>).<\/p>\n<\/li>\n<li>\n<p><strong>Rare materials.<\/strong> Uncommon and rarer armour and\nshields only take a penalty from a Critical Hit on a 20 that also beats\nyour AC by 5 or more.<\/p>\n<\/li>\n<\/ul>\n"},{"id":"guide-making-your-character","t":"Making Your Character","s":[{"id":"guide-making-your-character--eight-steps","t":"Eight Steps","l":2},{"id":"guide-making-your-character--before-you-start","t":"Before You Start","l":2}],"p":"Making Your Character","sub":"Start Here","h":"\n\n\n<div class=\"epigraph\">\n<p><em>“Know who you are before you step off the boat, or the island\nwill decide for you.”<\/em><\/p>\n<\/div>\n<div class=\"attribution\">\n<p>— A ferryman on the Ebonheart docks<\/p>\n<\/div>\n<h3 id=\"guide-making-your-character--eight-steps\">Eight Steps<\/h3>\n<p class=\"dropcap\">Make your character by following these steps in\norder. Each step is a chapter of its own, and ends with a link to the\nnext. Build with the 2024 <em>Player's Handbook<\/em>; the steps tell you\nwhere this campaign does things differently.<\/p>\n<div class=\"tw\"><table><thead><tr><th>Step<\/th><th>You choose<\/th><th>What it gives you<\/th><\/tr><\/thead><tbody><tr><td class=\"first\">1. <a class=\"xref\" href=\"#guide-peoples-of-tamriel\">Your people<\/a><\/td><td>One of the ten races of Tamriel<\/td><td>Your traits, size, speed and languages<\/td><\/tr><tr><td class=\"first\">2. <a class=\"xref\" href=\"#guide-classes-on-vvardenfell\">Your class<\/a><\/td><td>A class from the <em>Player's Handbook<\/em><\/td><td>Your class features, and your place on Vvardenfell<\/td><\/tr><tr><td class=\"first\">3. <a class=\"xref\" href=\"#guide-backgrounds-of-tamriel\">Your background<\/a><\/td><td>What you did before the voyage<\/td><td>Three abilities to raise, two skills, a tool, gear and a connection<\/td><\/tr><tr><td class=\"first\">4. <a class=\"xref\" href=\"#guide-birthsigns-of-tamriel\">Your birthsign<\/a><\/td><td>The sign you were born under<\/td><td>The benefit that replaces your Origin feat<\/td><\/tr><tr><td class=\"first\">5. <a class=\"xref\" href=\"#guide-ability-scores\">Your ability scores<\/a><\/td><td>The standard array, point buy or dice<\/td><td>Your six scores, raised by your background<\/td><\/tr><tr><td class=\"first\">6. <a class=\"xref\" href=\"#guide-your-faith\">Your faith<\/a><\/td><td>A god or patron, or none<\/td><td>Your domain, oath or patron, if your class needs one<\/td><\/tr><tr><td class=\"first\">7. <a class=\"xref\" href=\"#guide-starting-equipment\">Your equipment<\/a><\/td><td>Your class's and background's gear, or gold<\/td><td>Everything you carry off the ship<\/td><\/tr><tr><td class=\"first\">8. <a class=\"xref\" href=\"#guide-finishing-touches\">Finishing touches<\/a><\/td><td>Your reason, your ties and your answers<\/td><td>Hooks for your DM, and a place in the story<\/td><\/tr><\/tbody><\/table><\/div>\n<h3 id=\"guide-making-your-character--before-you-start\">Before You Start<\/h3>\n<ul>\n<li>\n<p><strong>Start at level 1.<\/strong> Every character begins at 1st\nlevel.<\/p>\n<\/li>\n<li>\n<p><strong>Nobody has been to Vvardenfell.<\/strong> Your character can\ncome from anywhere in Tamriel, mainland Morrowind included, but not from\nthe island itself.<\/p>\n<\/li>\n<li>\n<p><strong>What you need.<\/strong> The 2024 <em>Player's Handbook<\/em>\nfor your class and spells, this guide, and <em>Treasures of\nMorrowind<\/em> for prices if you buy your own gear.<\/p>\n<\/li>\n<li>\n<p><strong>What's different.<\/strong> <a class=\"xref\" href=\"#guide-house-rules--house-rules-at-a-glance\">House Rules at a Glance<\/a>\nlists everything this campaign changes, and where to read about it.<\/p>\n<\/li>\n<\/ul>\n"},{"id":"guide-peoples-of-tamriel","t":"Step One: Peoples of Tamriel","s":[{"id":"guide-peoples-of-tamriel--the-ten-races","t":"The Ten Races","l":2},{"id":"guide-peoples-of-tamriel--altmer-high-elves","t":"Altmer (High Elves)","l":2},{"id":"guide-peoples-of-tamriel--altmer-traits","t":"Altmer Traits","l":3},{"id":"guide-peoples-of-tamriel--argonians","t":"Argonians","l":2},{"id":"guide-peoples-of-tamriel--argonian-traits","t":"Argonian Traits","l":3},{"id":"guide-peoples-of-tamriel--bosmer-wood-elves","t":"Bosmer (Wood Elves)","l":2},{"id":"guide-peoples-of-tamriel--bosmer-traits","t":"Bosmer Traits","l":3},{"id":"guide-peoples-of-tamriel--bretons","t":"Bretons","l":2},{"id":"guide-peoples-of-tamriel--breton-traits","t":"Breton Traits","l":3},{"id":"guide-peoples-of-tamriel--dunmer-dark-elves","t":"Dunmer (Dark Elves)","l":2},{"id":"guide-peoples-of-tamriel--dunmer-traits","t":"Dunmer Traits","l":3},{"id":"guide-peoples-of-tamriel--imperials","t":"Imperials","l":2},{"id":"guide-peoples-of-tamriel--imperial-traits","t":"Imperial Traits","l":3},{"id":"guide-peoples-of-tamriel--khajiit","t":"Khajiit","l":2},{"id":"guide-peoples-of-tamriel--khajiit-traits","t":"Khajiit Traits","l":3},{"id":"guide-peoples-of-tamriel--nords","t":"Nords","l":2},{"id":"guide-peoples-of-tamriel--nord-traits","t":"Nord Traits","l":3},{"id":"guide-peoples-of-tamriel--orsimer-orcs","t":"Orsimer (Orcs)","l":2},{"id":"guide-peoples-of-tamriel--orc-traits","t":"Orc Traits","l":3},{"id":"guide-peoples-of-tamriel--redguards","t":"Redguards","l":2},{"id":"guide-peoples-of-tamriel--redguard-traits","t":"Redguard Traits","l":3},{"id":"guide-peoples-of-tamriel--languages-of-tamriel","t":"Languages of Tamriel","l":2}],"p":"Making Your Character","sub":"A Player's Guide to the Ten Races","h":"\n\n\n<div class=\"epigraph\">\n<p><em>“Every outlander believes Vvardenfell will change them. The\nisland tends to agree.”<\/em><\/p>\n<\/div>\n<div class=\"attribution\">\n<p>— A Census and Excise clerk, Seyda Neen<\/p>\n<\/div>\n<h3 id=\"guide-peoples-of-tamriel--the-ten-races\">The Ten Races<\/h3>\n<p class=\"dropcap\">Tamriel's peoples fall into three kinds: Men,\ndescended from settlers out of Atmora and Yokuda; Mer, the elves\ndescended from the ancient Aldmer; and Beastfolk, native to the\ncontinent. Each race carries old grudges, and on Vvardenfell most of\nthem are on show.<\/p>\n<p>To the Dunmer, every outsider is an outlander. The ruder word is\n<em>n'wah<\/em>.<\/p>\n<div class=\"tw\"><table><thead><tr><th>Race<\/th><th>Kind<\/th><th>Homeland<\/th><th>Standing on Vvardenfell<\/th><\/tr><\/thead><tbody><tr><td class=\"first\">Altmer (High Elves)<\/td><td>Mer<\/td><td>Summerset Isles<\/td><td>Respected as mages, resented as snobs<\/td><\/tr><tr><td class=\"first\">Argonians<\/td><td>Beastfolk<\/td><td>Black Marsh<\/td><td>Often enslaved; slavery is legal here<\/td><\/tr><tr><td class=\"first\">Bosmer (Wood Elves)<\/td><td>Mer<\/td><td>Valenwood<\/td><td>Tolerated, and watched in markets<\/td><\/tr><tr><td class=\"first\">Bretons<\/td><td>Men<\/td><td>High Rock<\/td><td>Common in the guilds; mildly trusted<\/td><\/tr><tr><td class=\"first\">Dunmer (Dark Elves)<\/td><td>Mer<\/td><td>Morrowind<\/td><td>Home turf, unless you're an Ashlander<\/td><\/tr><tr><td class=\"first\">Imperials<\/td><td>Men<\/td><td>Cyrodiil<\/td><td>The occupiers, addressed politely<\/td><\/tr><tr><td class=\"first\">Khajiit<\/td><td>Beastfolk<\/td><td>Elsweyr<\/td><td>Often enslaved; suspected of skooma trading<\/td><\/tr><tr><td class=\"first\">Nords<\/td><td>Men<\/td><td>Skyrim<\/td><td>Old enemies, still remembered<\/td><\/tr><tr><td class=\"first\">Orsimer (Orcs)<\/td><td>Mer<\/td><td>Orsinium<\/td><td>Hired as mercenaries, rarely trusted further<\/td><\/tr><tr><td class=\"first\">Redguards<\/td><td>Men<\/td><td>Hammerfell<\/td><td>Respected as warriors; few close friends<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Assumes 3E 417, the reign of Emperor Uriel VII.<\/p>\n<p><strong>Playing these races.<\/strong> Each entry ends with that\nrace's traits, written for the 2024 rules. A few rules apply to every\nrace.<\/p>\n<ul>\n<li>\n<p><strong>Ability scores.<\/strong> Your race doesn't change your\nability scores. Your background does, in <a class=\"xref\" href=\"#guide-ability-scores\">Step Five<\/a>.<\/p>\n<\/li>\n<li>\n<p><strong>Languages.<\/strong> Everyone speaks Tamrielic, the common\ntongue. Choose two more from <a class=\"xref\" href=\"#guide-peoples-of-tamriel--languages-of-tamriel\">Languages of Tamriel<\/a>, at the\nend of this chapter. Dunmeris is the most useful one on Vvardenfell.<\/p>\n<\/li>\n<li>\n<p><strong>Racial spells.<\/strong> You can cast a cantrip from a racial\ntrait at will. Any other racial spell is always prepared; you can cast\nit once without a spell slot, regaining that use when you finish a long\nrest. You can also cast it using any spell slots you have.<\/p>\n<\/li>\n<li>\n<p><strong>Spellcasting ability.<\/strong> When you choose your race,\npick Intelligence, Wisdom or Charisma as the spellcasting ability for\nyour racial spells.<\/p>\n<\/li>\n<\/ul>\n<h3 id=\"guide-peoples-of-tamriel--altmer-high-elves\">Altmer (High Elves)<\/h3>\n<p><figure><img alt=\"Portrait of Altmer (High Elves)\" loading=\"lazy\" src=\"img/db144e856d350e734fa4210f89bf962d73e0ec54.webp\"/><\/figure>The Altmer believe they are the\nmost civilised people in Tamriel, and they are happy to explain why.<\/p>\n<p><strong>Appearance.<\/strong> Tall and slender, with golden skin, long\nfaces and pointed ears. They carry themselves as though someone\nimportant is always watching.<\/p>\n<p><strong>History.<\/strong> The Altmer are the oldest elves in Tamriel;\nevery other kind of elf, the Dunmer included, is a cousin who broke away\nfrom them. They have ruled the Summerset Isles, off Tamriel's south-west\ncoast, since long before humans arrived.<\/p>\n<p><strong>Culture.<\/strong> Society is strictly ordered by rank and\nlineage. Magic, scholarship and ritual run through daily life, and they\nhonour the Aedra as their divine ancestors, calling Akatosh by his elven\nname, Auri-El. Marriages are arranged with an eye to bloodlines.<\/p>\n<p>Almost everything has a proper form, from greeting a guest to pouring\nwine, and getting it wrong is a social failure. The Altmer prize\npatience, long memory and the mastery of one art over centuries. The\nPsijic Order, an ancient and secretive brotherhood of mages, keeps its\nmonastery on the isle of Artaeum, and even other Altmer speak of it\ncarefully.<\/p>\n<p><strong>Attitudes.<\/strong> Formal, reserved and certain of their own\nsuperiority. They regard Men as short-lived and crude, and Beastfolk as\nbarely worth discussing.<\/p>\n<p><strong>How others see them.<\/strong> Gifted mages and insufferable\nsnobs. Mages Guild members value their learning; almost nobody enjoys\ntheir company. The Dunmer remember that their ancestors left Summerset\nto escape Altmer rule.<\/p>\n<h4 id=\"guide-peoples-of-tamriel--altmer-traits\">Altmer Traits<\/h4>\n<div class=\"tw\"><table><thead><tr><th>Creature Type<\/th><th>Size<\/th><th>Speed<\/th><\/tr><\/thead><tbody><tr><td class=\"first\">Humanoid<\/td><td>Medium (about 5½–6½ feet tall)<\/td><td>30 feet<\/td><\/tr><\/tbody><\/table><\/div>\n<p>As an Altmer, you have these special traits.<\/p>\n<p><em><strong>Altmeri Spellcraft.<\/strong><\/em> You know the\n<em>Prestidigitation<\/em> cantrip. Whenever you finish a long rest, you\ncan swap it for another Wizard cantrip. You also learn one level one\nspell from the following: <em>Shield<\/em>, <em>Find Familiar<\/em>,\n<em>Magic Missile<\/em>, <em>Colour Spray<\/em> or <em>Cure Wounds<\/em>.\nYou learn <em>Detect Magic<\/em> at level 3 and <em>Misty Step<\/em> at\nlevel 5.<\/p>\n<p><em><strong>Darkvision.<\/strong><\/em> You have Darkvision with a\nrange of 60 feet.<\/p>\n<p><em><strong>Highborn.<\/strong><\/em> Once per long rest, when you\nfinish a short rest, choose one:<\/p>\n<ul>\n<li>\n<p>You regain one expended spell slot. The slot's level can be no higher\nthan half your Proficiency Bonus, rounded up.<\/p>\n<\/li>\n<li>\n<p>You regain the use of one spell from Altmeri Spellcraft.<\/p>\n<\/li>\n<\/ul>\n<p><em><strong>Keen Senses.<\/strong><\/em> You have proficiency in your\nchoice of Insight, Perception or Survival.<\/p>\n<p><em><strong>Trance.<\/strong><\/em> You don't need to sleep, and magic\ncan't put you to sleep. You can finish a long rest in 4 hours of\nmeditation, staying conscious throughout.<\/p>\n<h3 id=\"guide-peoples-of-tamriel--argonians\">Argonians<\/h3>\n<p><figure><img alt=\"Portrait of Argonians\" loading=\"lazy\" src=\"img/429092a5322b86b4e3cedf8838e751644b320475.webp\"/><\/figure>Argonians are patient, unreadable, and\nvery good at outlasting the people who underestimate them.<\/p>\n<p><strong>Appearance.<\/strong> Reptilian, with scales, tails and frills\nor horns that vary from tribe to tribe. They breathe water as easily as\nair.<\/p>\n<p><strong>History.<\/strong> Argonians come from Black Marsh, a vast\nswamp south of Morrowind whose diseases kill most outsiders. For\ncenturies Dunmer slavers raided it for workers, and Argonians have not\nforgotten.<\/p>\n<p><strong>Culture.<\/strong> Life centres on the Hist, ancient sentient\ntrees whose sap shapes each hatchling. Names are earned and often\nchanged, and their language is Jel. Tribes keep to themselves, and a\nsense of self comes second to the clutch.<\/p>\n<p>Argonians call themselves the Saxhleel, the People of the Root. Jel\nis said to have no words for past or future, and many Argonians live\nfirmly in the present: patient, adaptable and unbothered by what can't\nbe changed. Hatchlings born under the sign of the Shadow are said to be\ntaken away and trained as assassins, though no Argonian will confirm\nit.<\/p>\n<p><strong>Attitudes.<\/strong> Pragmatic and calm, with a long view of\neverything. Most hold a deep, quiet hatred for Dunmer slavers.<\/p>\n<p><strong>How others see them.<\/strong> Alien and hard to trust. To\nmany Dunmer they are property. Imperials see them as useful but strange,\nand most other races simply avoid them.<\/p>\n<h4 id=\"guide-peoples-of-tamriel--argonian-traits\">Argonian Traits<\/h4>\n<div class=\"tw\"><table><thead><tr><th>Creature Type<\/th><th>Size<\/th><th>Speed<\/th><\/tr><\/thead><tbody><tr><td class=\"first\">Humanoid<\/td><td>Medium (about 5–6 feet tall)<\/td><td>30 feet; Swim Speed 30 feet<\/td><\/tr><\/tbody><\/table><\/div>\n<p>As an Argonian, you have these special traits.<\/p>\n<p><em><strong>Amphibious.<\/strong><\/em> You can breathe both air and\nwater.<\/p>\n<p><em><strong>Bite.<\/strong><\/em> Your fanged jaws are a natural weapon\nyou can use for Unarmed Strikes. A hit deals Piercing damage equal to\n1d6 plus your Strength modifier, instead of the normal Bludgeoning\ndamage.<\/p>\n<p><em><strong>Hist Resilience.<\/strong><\/em> You have Resistance to\nPoison damage. You have Advantage on saving throws to avoid or end the\nPoisoned condition, and on saving throws against disease.<\/p>\n<p><em><strong>Marsh Instincts.<\/strong><\/em> You have proficiency in\ntwo of these skills: Animal Handling, Medicine, Nature, Perception,\nStealth or Survival.<\/p>\n<p><em><strong>Scaled Hide.<\/strong><\/em> While you aren't wearing\narmor, your base Armor Class is 13 plus your Dexterity modifier. You can\nuse this instead of worn armour if it gives you a higher AC. A Shield\nworks as normal.<\/p>\n<h3 id=\"guide-peoples-of-tamriel--bosmer-wood-elves\">Bosmer (Wood Elves)<\/h3>\n<p><figure><img alt=\"Portrait of Bosmer (Wood Elves)\" loading=\"lazy\" src=\"img/3be8224b6000fddad6e62f0b9765420ab88a3cc6.webp\"/><\/figure>The Bosmer are cheerful, quick\nand hard to pin down, bound by a pact that forbids them to harm a single\nleaf.<\/p>\n<p><strong>Appearance.<\/strong> Short and lithe, with brown or ochre\nskin and sharp features. They move quietly without trying.<\/p>\n<p><strong>History.<\/strong> The Bosmer are elves who settled the\nforests of Valenwood, in Tamriel's south-west. There their god Y'ffre\nbound them to the Green Pact, a promise never to harm the forest.<\/p>\n<p><strong>Culture.<\/strong> The Green Pact forbids harming the forest's\nplants, so their diet is meat, and some say it includes fallen enemies.\nTheir great cities are living trees that wander through the forest.\nStorytelling and archery are prized above most things.<\/p>\n<p>Because they may not eat plants, Bosmer drink rotmeth, brewed from\nfermented meat, and jagga, made from fermented pig's milk. Their priests\nof Y'ffre, called Spinners, keep the stories that hold the world in\nshape. In desperate need, the Bosmer can call the Wild Hunt, a ritual\nthat turns them into a stampede of beasts and nightmares. It is rarely\ncalled, and nobody who has seen it wants to see it again.<\/p>\n<p><strong>Attitudes.<\/strong> Playful, irreverent and restless. They\nrarely take rules seriously unless the rules come from Y'ffre.<\/p>\n<p><strong>How others see them.<\/strong> Superb archers, scouts and\nthieves. Their charm puts people at ease, and the Green Pact's rumoured\ndiet makes them uneasy again. Merchants keep a close eye on their\nstock.<\/p>\n<h4 id=\"guide-peoples-of-tamriel--bosmer-traits\">Bosmer Traits<\/h4>\n<div class=\"tw\"><table><thead><tr><th>Creature Type<\/th><th>Size<\/th><th>Speed<\/th><\/tr><\/thead><tbody><tr><td class=\"first\">Humanoid<\/td><td>Medium (about 4½–5½ feet tall)<\/td><td>35 feet<\/td><\/tr><\/tbody><\/table><\/div>\n<p>As a Bosmer, you have these special traits.<\/p>\n<p><em><strong>Beast Tongue.<\/strong><\/em> At level 3, you learn\n<em>Speak with Animals<\/em>.<\/p>\n<p><em><strong>Bosmer Archery.<\/strong><\/em> You have proficiency with\nLongbows and Shortbows.<\/p>\n<p><em><strong>Darkvision.<\/strong><\/em> You have Darkvision with a\nrange of 60 feet.<\/p>\n<p><em><strong>Fey Ancestry.<\/strong><\/em> You have Advantage on saving\nthrows to avoid or end the Charmed condition.<\/p>\n<p><em><strong>Keen Senses.<\/strong><\/em> You have proficiency in your\nchoice of Insight, Perception or Survival.<\/p>\n<p><em><strong>Trance.<\/strong><\/em> You don't need to sleep, and magic\ncan't put you to sleep. You can finish a long rest in 4 hours of\nmeditation, staying conscious throughout.<\/p>\n<p><em><strong>Woodland Magic.<\/strong><\/em> You know the\n<em>Druidcraft<\/em> cantrip. At level 5, you learn <em>Pass without\nTrace<\/em>.<\/p>\n<h3 id=\"guide-peoples-of-tamriel--bretons\">Bretons<\/h3>\n<p><figure><img alt=\"Portrait of Bretons\" loading=\"lazy\" src=\"img/bb1b5b138487edd6bf241eac82ea7a6311549407.webp\"/><\/figure>Bretons are Men with a little elf in them,\nand a lot of politics.<\/p>\n<p><strong>Appearance.<\/strong> Human, usually fair-skinned and of\nslight to medium build. Some show a faint elven sharpness in the\nface.<\/p>\n<p><strong>History.<\/strong> Bretons come from High Rock, in Tamriel's\nnorth-west, where early humans and elves lived side by side and their\nbloodlines mixed. That elven blood is why Bretons take to magic so\neasily.<\/p>\n<p><strong>Culture.<\/strong> High Rock is a patchwork of petty kingdoms,\nduchies and baronies, all scheming against each other. Chivalry, courtly\nintrigue and magic sit side by side. Bretons have a natural gift for\nspellcraft and an unusual resistance to hostile magic.<\/p>\n<p>Membership of a knightly order is a mark of status, and a Breton\nnoble without one usually has an excuse ready. Marriages, feuds and\nalliances shift with every generation, so most Bretons learn early to\nread a room and keep their options open. Magic is respected rather than\nfeared, and many families send at least one child to study with the\nMages Guild.<\/p>\n<p><strong>Attitudes.<\/strong> Clever, cultured and ambitious, with an\neye for advantage. Loyalty tends to run to family and faction first.<\/p>\n<p><strong>How others see them.<\/strong> Nords and Redguards think them\nsoft and scheming. Mages respect their talent. On Vvardenfell they blend\nin well in the guilds, and are trusted about as far as anyone else.<\/p>\n<h4 id=\"guide-peoples-of-tamriel--breton-traits\">Breton Traits<\/h4>\n<div class=\"tw\"><table><thead><tr><th>Creature Type<\/th><th>Size<\/th><th>Speed<\/th><\/tr><\/thead><tbody><tr><td class=\"first\">Humanoid<\/td><td>Medium (about 5–6 feet tall)<\/td><td>30 feet<\/td><\/tr><\/tbody><\/table><\/div>\n<p>As a Breton, you have these special traits.<\/p>\n<p><em><strong>Darkvision.<\/strong><\/em> You have Darkvision with a\nrange of 60 feet.<\/p>\n<p><em><strong>Dragonskin.<\/strong><\/em> When you take damage from a\nspell, you can take a Reaction to halve that damage, absorbing some of\nthe spell's energy. You also regain one expended level 1 spell slot, if\nyou have one. Once you use
