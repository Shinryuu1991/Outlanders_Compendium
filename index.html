ark below ground. These are the 2024 rules you'll need most often, in one place."},{"i":"guide-house-rules--cover","b":"guide","ci":"guide-house-rules","c":"House Rules","h":"Cover","t":"Cover · Effect · Examples. Half · +2 to AC and Dexterity saving throws · Low wall, market stall, large furniture, another creature, thin tree. Three-quarters · +5 to AC and Dexterity saving throws · Arrow slit, stacked crates, thick tree trunk. Total · Can't be targeted directly by an attack or a spell · Solid wall, closed door, a statue's plinth. Cover doesn't stack. If several things are in the way, use the best one. Areas get round it. A spell with an area of effect can still reach a creature behind Total Cover, if the area spreads around the obstacle."},{"i":"guide-house-rules--seeing","b":"guide","ci":"guide-house-rules","c":"House Rules","h":"Seeing","t":"Area · Effect · Examples. Lightly Obscured · Disadvantage on Wisdom (Perception) checks to see things in it · Dim light, patchy fog, moderate foliage, drifting ash. Heavily Obscured · Anyone trying to see something in it is effectively Blinded · Darkness, thick fog, dense foliage, a Blight storm. Darkvision. Within its range, dim light counts as bright light, and darkness as dim light. Most elves, the Khajiit and the Orcs have it, so a dark tomb is only Lightly Obscured for them. Humans need a torch."},{"i":"guide-house-rules--hiding","b":"guide","ci":"guide-house-rules","c":"House Rules","h":"Hiding","t":"When you can hide. A creature can take the Hide action while it's Heavily Obscured or behind Three-Quarters or Total Cover, and out of every enemy's line of sight. The check. It makes a DC 15 Dexterity (Stealth) check. On a success, it has the Invisible condition. The check's total becomes the DC for others to find it with a Wisdom (Perception) check. When it ends. It stops being hidden when it makes a sound louder than a whisper, an enemy finds it, it makes an attack roll, or it casts a spell with a Verbal component."},{"i":"guide-house-rules--crowds","b":"guide","ci":"guide-house-rules","c":"House Rules","h":"Crowds","t":"Markets, docks and plazas are rarely empty. When a fight breaks out among bystanders, the DM marks the crowd on the battle map as a few zones. Terrain. A crowd is difficult terrain. Cover. A creature in a crowd, or behind one, has Half Cover. That isn't enough to hide, unless a creature has a trait that says so, like a cutpurse who can melt into the crowd. The crowd runs. At the start of each round after the first, each zone shrinks by one square as people flee. By the third round there's little left to hide in. Bystanders get hurt. Area spells catch them too, and hurting them is a crime (see Crime and Fines in Treasures of Morrowind )."},{"i":"guide-house-rules--harvesting","b":"guide","ci":"guide-house-rules","c":"House Rules","h":"Harvesting","t":"When a creature dies, you can harvest the ingredients and trophies its body holds: hides, shells, salts, hearts and the like. Your DM tells you what's there. Time. Ten minutes for a Medium or smaller creature, 30 minutes for a Large one, and an hour for anything bigger. Skill. Survival for beasts and kwama. Arcana for Daedra, undead, ash creatures and vampires. Investigation for constructs. DC. 10 for a creature of challenge rating 0 to 2, 13 for 3 to 6, 15 for 7 to 12, and 18 for 13 and up. Result. On a success, you get everything the body holds. On a failure, you get half, rounded down. If you fail by 5 or more, the remains are ruined. Value. Ingredients are priced in Treasures of Morrowind at what an alchemist or trader charges, and most will buy at half that. Hides, shells and resin also count towards the materials for crafting . Daedra. When a Daedra's body is destroyed, its spirit returns to Oblivion, but some of its substance stays behind: hearts, skins and salts."},{"i":"guide-house-rules--disease-and-the-blight","b":"guide","ci":"guide-house-rules","c":"House Rules","h":"Disease and the Blight","t":"Vvardenfell's beasts carry disease, and the ash storms off Red Mountain carry worse. There are two kinds: common diseases and Blight diseases. Each one gives its own penalty while you have it, and your DM will tell you what yours does. Bites and blows. When a diseased or blighted creature hits you, you might have to make a Constitution saving throw. On a failure, you catch its disease. Blight storms. Each hour you spend in a Blight storm without shelter, make a DC 13 Constitution saving throw. On a failure, you catch a Blight disease. Resisting. Anything that gives Advantage on saving throws against disease, such as the Argonian and Redguard traits or a Resist Disease potion, applies to all of these saves. · Common disease · Blight disease. Saving throw at the end of each long rest · DC 12 Constitution · DC 15 Constitution. On a failure · You gain 1 Exhaustion level, to a maximum of 2 from the disease · You gain 1 Exhaustion level, to a maximum of 3 from the disease. On a success · The disease ends · Nothing changes; only a cure ends it. Cures · Lesser Restoration, a Cure potion, or a Temple or Imperial Cult healer (25 gp) · Greater Restoration, a Cure Blight Disease potion, or a Temple healer (50 gp); the Imperial Cult can't cure the Blight. Exhaustion. While you have a disease, finishing a long rest doesn't remove the Exhaustion it gave you. Once you're cured, you lose it normally, one level per long rest. Prices. Potions and healers are listed in Treasures of Morrowind . Corprus. The Divine Disease can't be caught from corprus beasts, and no cure is known. If it ever touches your character, your DM will handle it as part of the story."},{"i":"guide-house-rules--brewing-potions","b":"guide","ci":"guide-house-rules","c":"House Rules","h":"Brewing Potions","t":"Characters who carry alchemy apparatus and gather ingredients can brew their own potions and poisons. Each ingredient's two effects are in Ingredients , what each effect and grade does is in Potions , and the apparatus is in Alchemy Apparatus , all in Treasures of Morrowind . Ingredients. Choose two ingredients that share an effect: any two from the same row of Brewing by Effect . The brew has that effect. No two ingredients share both their effects, so every pair makes exactly one brew. Potion or poison. A brew with a helpful effect is a potion. A brew with a harmful effect is a poison. One of several. Fortify Body, Fortify Mind, Drain Body, Drain Mind and Resistance each cover several abilities or damage types. Choose one when you brew. The bottle carries Morrowind's name: a Fortify Body potion brewed for Strength is a Fortify Strength potion. Time. Each brew takes 10 minutes. You can brew a number of times each day equal to your Proficiency Bonus. The check. Make an Intelligence check, adding your mortar and pestle's bonus, and your Proficiency Bonus if you're proficient with Alchemist's Supplies or an Herbalism Kit. The total sets the grade. Check total · Result. 9 or lower · Spoiled. A potion works at Cheap grade but also has a harmful side effect, which the DM chooses. A poison is ruined. 10 to 14 · Cheap. 15 to 19 · Bargain. 20 to 24 · Standard. 25 to 29 · Quality. 30 or higher · Exclusive."},{"i":"guide-house-rules--apparatus","b":"guide","ci":"guide-house-rules","c":"House Rules","h":"Apparatus","t":"Each piece of apparatus has a grade, which limits how good a brew it can make. Apparatus · Best brew. Apprentice's · Bargain. Journeyman's · Standard. Master's · Quality. Grandmaster's or Secret Master's · Exclusive. Mortar and pestle. You need one to brew, and no brew can be better than its limit. Retort. A potion is one grade better, up to the limit of both the retort and your mortar and pestle. Calcinator. A poison is one grade better, with the same limits. Alembic. A brew that would have spoiled comes out as a Cheap potion or poison, with no side effect. With a Master's or better alembic, it comes out as Bargain. A brew the alembic saves can't be improved by a retort or calcinator. Example. With an Apprentice's mortar and pestle and retort, a check of 12 makes a Cheap potion, which the retort raises to Bargain. A check of 17 makes a Bargain potion, which is as good as Apprentice's apparatus gets. To brew Standard potions, you need a Journeyman's mortar and pestle."},{"i":"guide-house-rules--spoiled-potions-and-poisons","b":"guide","ci":"guide-house-rules","c":"House Rules","h":"Spoiled Potions and Poisons","t":"A spoiled potion affects whoever drinks it with its side effect as well. An alchemist can label it honestly, or not. As a Bonus Action, you can coat a weapon or up to three pieces of ammunition with a poison. The poison lasts for 1 minute, or until the coated weapon or ammunition hits a creature, which is then subjected to the poison's effect. The Morag Tong are the island's masters of the art."},{"i":"guide-house-rules--soul-gems-and-enchanting","b":"guide","ci":"guide-house-rules","c":"House Rules","h":"Soul Gems and Enchanting","t":""},{"i":"guide-house-rules--trapped-souls","b":"guide","ci":"guide-house-rules","c":"House Rules","h":"Trapped Souls","t":"Every enchantment on Vvardenfell is powered by a soul. Enchanters trap the souls of creatures in soul gems, crystals that hold a soul for ever, and then spend that soul to bind a spell into an object. The Mages Guild sells empty gems in every hall, and its members trap souls as casually as a hunter sets snares. Creatures only. In the games, only creatures can be soul-trapped, so any creature whose type isn't Humanoid can be. The souls of people can't. Necromancers whisper about black soul gems that can hold a person's soul. If they exist, they're Very Rare, illegal, and the Temple would burn anyone found with one. Daedra. Daedra are the enchanter's favourite prey: their souls are strong, and nobody mourns them. One soul, one gem. A gem holds a single soul. Once the soul is spent, the gem crumbles. Azura's Star. Legend tells of a soul gem that is never used up: one of the Daedric artefacts."},{"i":"guide-house-rules--soul-gems","b":"guide","ci":"guide-house-rules","c":"House Rules","h":"Soul Gems","t":"A soul gem can hold the soul of a creature whose challenge rating is no higher than the gem allows. A bigger gem can hold a smaller soul, but it's a waste of a good gem. Soul gem · Holds a soul of · For example · Empty · Filled · Recharges. Petty · CR 1/2 or lower · Rats, mudcrabs, cliff racers · 10 gp · 25 gp · 1 charge. Lesser · CR 1 or 2 · Scamps, alits, kagouti · 25 gp · 75 gp · 2 charges. Common · CR 3 to 5 · Clannfear, dremora, flame atronachs · 100 gp · 250 gp · 3 charges. Greater · CR 6 to 9 · Daedroths, winged twilights · 500 gp · 1,000 gp · 4 charges. Grand · CR 10 or higher · Dremora lords, golden saints · Not sold · 5,000 gp · 5 charges. Buying and selling. The Mages Guild and many traders sell Petty to Greater gems; Grand gems are never sold empty, and turn up only in ruins, Telvanni towers and rich enchanters' hands. Filled gems sell for half their filled price, and enchanters are always buying. Recharging. Cast when used items and enchanted weapons never recharge on their own. As a Magic action, you can touch a filled soul gem to one: the gem crumbles and the item regains the charges shown, up to its maximum. Enchanters sell filled gems at the prices above."},{"i":"guide-house-rules--soul-trap","b":"guide","ci":"guide-house-rules","c":"House Rules","h":"Soul Trap","t":"Souls are caught with the Soul Trap spell, which the Mages Guild teaches its members; in this campaign it's on the sorcerer, warlock and wizard spell lists. Scrolls such as Fphyggi's Gem-Feeder work the same way. Soul Trap. Level 1 Necromancy (Sorcerer, Warlock, Wizard). Casting Time: Bonus Action. Range: 60 feet. Components: V, S, M (an empty soul gem, which isn't used up). Duration: 1 minute. One creature you can see within range must succeed on a Charisma saving throw against your spell save DC or have the Soul-Bound condition until the spell ends. Humanoids can't be affected by this spell. Soul-Bound. A Soul-Bound creature's soul is marked. If it dies while Soul-Bound, its soul flies into the smallest empty soul gem the caster carries that can hold it, which begins to glow; if there's none, the soul is lost. The condition has no other effect."},{"i":"guide-house-rules--enchanting","b":"guide","ci":"guide-house-rules","c":"House Rules","h":"Enchanting","t":"Characters can make their own magic items, or pay an enchanter to make them. Item rarity · Soul gem · Base item · Cost · DC. Common · Petty · Any clothing, jewellery, weapon or armour · 50 gp · 10. Uncommon · Common · Expensive or better clothing or jewellery; any weapon or armour · 250 gp · 15. Rare · Greater · Extravagant or better clothing or jewellery; weapons and armour of an Uncommon or rarer material · 2,500 gp · 20. Very Rare · Grand · Exquisite clothing or jewellery; weapons and armour of a Rare or rarer material · 20,000 gp · 25. Choose the item. Pick an item from Magic Items in Treasures of Morrowind , or design one with the DM using it as a guide. Its rarity sets everything else in the table. The base item. Better items hold stronger enchantments: see Armour and Clothing for clothing and jewellery grades, and Weapons for materials, in Treasures of Morrowind . The soul. You need a filled soul gem of at least the size shown. Constant effect enchantments need a gem one size larger. A Very Rare constant effect needs a Grand soul gem holding the soul of a creature of CR 12 or higher, such as a golden saint. The spell. You must know the effect you're binding: cast a spell that produces it, use up a scroll of it, or study an item that has it, which isn't harmed. For an enchanted weapon, any spell or cantrip that deals the element's damage will do, such as Fire Bolt for fire. Cost and time. The cost covers reagents, inks and the work of preparing the base item. Enchanting an item takes one Long Rest. The check. When the Long Rest ends, make an Intelligence (Arcana) check against the DC shown. On a success, the item is finished. If you fail by 4 or less while enchanting a weapon, it comes out wild (see Enchanted Weapons in Treasures of Morrowind ). On any other failure, the soul and half the gold are wasted, but the base item survives and you can try again. Charges. A soul's size sets its level, from 1 for Petty to 5 for Grand. A cast when used item holds that many charges, and its spell can't be of a higher level. An enchanted weapon spends up to that many per hit and holds twice as many, and its grade and damage die follow the soul (see Enchanted Weapons ). You can't bind a soul of a higher level than your highest spell slot: a wizard binds a Lesser soul at 3rd level, and a Grand one at 9th. Materials and magic. A material's bonus doesn't add to a magic bonus (see Materials in Treasures of Morrowind ): a glass sword enchanted with fire stays +2."},{"i":"guide-house-rules--commissioning-an-enchanter","b":"guide","ci":"guide-house-rules","c":"House Rules","h":"Commissioning an Enchanter","t":"Enchanters at every Mages Guild hall, and the Telvanni enchanters of Sadrith Mora, make items to order. They charge the item's full price from Treasures of Morrowind , take a day and never fail. Bringing your own filled soul gem takes its filled price off the bill. Few enchanters will make a Very Rare item for anyone they don't know well."},{"i":"guide-house-rules--inscribing-scrolls","b":"guide","ci":"guide-house-rules","c":"House Rules","h":"Inscribing Scrolls","t":"Scrolls are the one magic item that needs no soul: the spell is written into the paper, so anyone who can read can release it (see Scrolls in Treasures of Morrowind ). What you need. Proficiency with Calligrapher's Supplies, a set of Calligrapher's Supplies, and a sheet of paper or parchment for each scroll. The spell. You must know the spell (have it prepared or always prepared) or use a Mages Guild hall's library. Each hall keeps its own catalogue, and from a library you can't inscribe a spell above your highest-level spell slot. The cost. A spell you know uses up a spell slot of its level, as if you'd cast it. Cantrips need none, and a racial or birthsign spell can use its free casting instead. A library spell costs the Guild's fee instead: 50 gp per scroll, or 25 gp for members. Either way, a costly material component is used up, and inscribing takes about an hour. The finished scroll. Anyone who can read can use it. Its save DC and attack bonus are set by the spell's level: DC 13/+5 up to level 3, DC 15/+7 at 4–5, DC 17/+9 at 6–8 and DC 19/+11 at 9."},{"i":"guide-house-rules--crafting-weapons-and-armour","b":"guide","ci":"guide-house-rules","c":"House Rules","h":"Crafting Weapons and Armour","t":"Characters with the right tools can make their own weapons, armour and shields. These rules replace the Player's Handbook 's crafting rules for the weapons, armour and shields in Treasures of Morrowind . Tool · Makes. Smith's Tools · Weapons, armour and shields of metal, glass, ebony, stalhrim or Daedric; bonemold, dreugh and trollbone armour; bonemold and dreugh shields. Leatherworker's Tools · Leather, fur, hide, scale and chitin armour: netch leather, Nordic fur and bearskin, wolf, bear, Imperial studded leather, newtscale and chitin; netch leather and chitin shields; quivers. Woodcarver's Tools · Weapons of wood, chitin, bonemold or dreugh shell: bows, crossbows, arrows, bolts, clubs, staffs and every chitin weapon. Proficiency and tools. You need proficiency with the tool that makes the item, and the tool itself. An armourer's hammer can't make anything. A workshop. Smithing needs a forge, and any smith will rent you theirs for 1 gp a day. Leatherwork and woodcarving can be done anywhere. Materials. Materials cost half the item's price. Raw ebony, glass and adamantium count towards it at their prices in Trade Goods , and so do hides, shells and resin harvested from creatures, at their value in the Bestiary of Morrowind . Time. The work takes one day per 50 gp of the item's price, rounded up, or one day per 100 gp for Rare items, so Rare gear takes 50 to 75 days. Very Rare gear takes 100 days. A helper proficient with the same tool halves the time. On the road, a Long Rest counts as half a day of leatherwork or woodcarving. The check. When the work is done, make a check with the tool: Strength for Smith's Tools, Dexterity for the others. The DC is 10 for a Common item, 15 for Uncommon, 20 for Rare and 25 for Very Rare. On a success, the item is finished. Near misses. If you fail by 4 or less, the item is finished but flawed: it starts with a −1 penalty under the Wear and Repair rule, which can be repaired as normal. Failure. If you fail by 5 or more, half the materials are wasted, and you have to start again."},{"i":"guide-house-rules--special-materials","b":"guide","ci":"guide-house-rules","c":"House Rules","h":"Special Materials","t":"Masters only. Proficiency is enough for Common and Uncommon gear. Rare and Very Rare gear, such as glass, ebony, stalhrim and Daedric, also needs a master to teach you how to work it. That takes a favour or a quest, not gold, and the DM decides who on the island knows how. Bonemold. Bonemold is bone glued and moulded with shalk resin, not forged. A suit of bonemold armour needs four shalk resins, which cover its materials, and anything smaller needs one. Daedric. Daedric gear needs a Daedra heart as well as ebony. Can't be made. Dwemer gear is salvaged, not forged: no one living knows how the Dwemer worked their metal. The armour of an order, such as Indoril, Royal Guard, Her Hand's, Duke's Guard silver and Dark Brotherhood, is made only for its members, and Daedric tower shields come only from golden saints."},{"i":"guide-house-rules--wear-and-repair","b":"guide","ci":"guide-house-rules","c":"House Rules","h":"Wear and Repair","t":"In the games, gear wears down with use. This optional rule brings that into play; your DM decides whether to use it. Wear. When a creature scores a Critical Hit against you, your armour or your shield (your choice) takes a −1 penalty to the AC it grants. Natural armour, such as an Argonian's Scaled Hide, doesn't wear. When you roll a 1 on an attack roll, your weapon takes a −1 penalty to its attack and damage rolls. Some creatures, such as the hunger, damage gear too. Broken. Armour and weapons break at −3, and a shield breaks when its bonus reaches +0. A broken item is useless until it's repaired. Repair. A smith repairs each point of penalty for a quarter of the item's price. A character proficient with Smith's Tools can do their own repairs with an armourer's hammer (see Armourer's Hammers in Treasures of Morrowind ). Rare materials. Uncommon and rarer armour and shields only take a penalty from a Critical Hit on a 20 that also beats your AC by 5 or more."},{"i":"guide-making-your-character","b":"guide","ci":"guide-making-your-character","c":"Making Your Character","h":"Making Your Character","t":"“Know who you are before you step off the boat, or the island will decide for you.” — A ferryman on the Ebonheart docks"},{"i":"guide-making-your-character--eight-steps","b":"guide","ci":"guide-making-your-character","c":"Making Your Character","h":"Eight Steps","t":"Make your character by following these steps in order. Each step is a chapter of its own, and ends with a link to the next. Build with the 2024 Player's Handbook ; the steps tell you where this campaign does things differently. Step · You choose · What it gives you. 1. Your people · One of the ten races of Tamriel · Your traits, size, speed and languages. 2. Your class · A class from the Player's Handbook · Your class features, and your place on Vvardenfell. 3. Your background · What you did before the voyage · Three abilities to raise, two skills, a tool, gear and a connection. 4. Your birthsign · The sign you were born under · The benefit that replaces your Origin feat. 5. Your ability scores · The standard array, point buy or dice · Your six scores, raised by your background. 6. Your faith · A god or patron, or none · Your domain, oath or patron, if your class needs one. 7. Your equipment · Your class's and background's gear, or gold · Everything you carry off the ship. 8. Finishing touches · Your reason, your ties and your answers · Hooks for your DM, and a place in the story."},{"i":"guide-making-your-character--before-you-start","b":"guide","ci":"guide-making-your-character","c":"Making Your Character","h":"Before You Start","t":"Start at level 1. Every character begins at 1st level. Nobody has been to Vvardenfell. Your character can come from anywhere in Tamriel, mainland Morrowind included, but not from the island itself. What you need. The 2024 Player's Handbook for your class and spells, this guide, and Treasures of Morrowind for prices if you buy your own gear. What's different. House Rules at a Glance lists everything this campaign changes, and where to read about it."},{"i":"guide-peoples-of-tamriel","b":"guide","ci":"guide-peoples-of-tamriel","c":"Step One: Peoples of Tamriel","h":"Step One: Peoples of Tamriel","t":"“Every outlander believes Vvardenfell will change them. The island tends to agree.” — A Census and Excise clerk, Seyda Neen"},{"i":"guide-peoples-of-tamriel--the-ten-races","b":"guide","ci":"guide-peoples-of-tamriel","c":"Step One: Peoples of Tamriel","h":"The Ten Races","t":"Tamriel's peoples fall into three kinds: Men, descended from settlers out of Atmora and Yokuda; Mer, the elves descended from the ancient Aldmer; and Beastfolk, native to the continent. Each race carries old grudges, and on Vvardenfell most of them are on show. To the Dunmer, every outsider is an outlander. The ruder word is n'wah . Race · Kind · Homeland · Standing on Vvardenfell. Altmer (High Elves) · Mer · Summerset Isles · Respected as mages, resented as snobs. Argonians · Beastfolk · Black Marsh · Often enslaved; slavery is legal here. Bosmer (Wood Elves) · Mer · Valenwood · Tolerated, and watched in markets. Bretons · Men · High Rock · Common in the guilds; mildly trusted. Dunmer (Dark Elves) · Mer · Morrowind · Home turf, unless you're an Ashlander. Imperials · Men · Cyrodiil · The occupiers, addressed politely. Khajiit · Beastfolk · Elsweyr · Often enslaved; suspected of skooma trading. Nords · Men · Skyrim · Old enemies, still remembered. Orsimer (Orcs) · Mer · Orsinium · Hired as mercenaries, rarely trusted further. Redguards · Men · Hammerfell · Respected as warriors; few close friends. Assumes 3E 417, the reign of Emperor Uriel VII. Playing these races. Each entry ends with that race's traits, written for the 2024 rules. A few rules apply to every race. Ability scores. Your race doesn't change your ability scores. Your background does, in Step Five . Languages. Everyone speaks Tamrielic, the common tongue. Choose two more from Languages of Tamriel , at the end of this chapter. Dunmeris is the most useful one on Vvardenfell. Racial spells. You can cast a cantrip from a racial trait at will. Any other racial spell is always prepared; you can cast it once without a spell slot, regaining that use when you finish a long rest. You can also cast it using any spell slots you have. Spellcasting ability. When you choose your race, pick Intelligence, Wisdom or Charisma as the spellcasting ability for your racial spells."},{"i":"guide-peoples-of-tamriel--altmer-high-elves","b":"guide","ci":"guide-peoples-of-tamriel","c":"Step One: Peoples of Tamriel","h":"Altmer (High Elves)","t":"The Altmer believe they are the most civilised people in Tamriel, and they are happy to explain why. Appearance. Tall and slender, with golden skin, long faces and pointed ears. They carry themselves as though someone important is always watching. History. The Altmer are the oldest elves in Tamriel; every other kind of elf, the Dunmer included, is a cousin who broke away from them. They have ruled the Summerset Isles, off Tamriel's south-west coast, since long before humans arrived. Culture. Society is strictly ordered by rank and lineage. Magic, scholarship and ritual run through daily life, and they honour the Aedra as their divine ancestors, calling Akatosh by his elven name, Auri-El. Marriages are arranged with an eye to bloodlines. Almost everything has a proper form, from greeting a guest to pouring wine, and getting it wrong is a social failure. The Altmer prize patience, long memory and the mastery of one art over centuries. The Psijic Order, an ancient and secretive brotherhood of mages, keeps its monastery on the isle of Artaeum, and even other Altmer speak of it carefully. Attitudes. Formal, reserved and certain of their own superiority. They regard Men as short-lived and crude, and Beastfolk as barely worth discussing. How others see them. Gifted mages and insufferable snobs. Mages Guild members value their learning; almost nobody enjoys their company. The Dunmer remember that their ancestors left Summerset to escape Altmer rule."},{"i":"guide-peoples-of-tamriel--altmer-traits","b":"guide","ci":"guide-peoples-of-tamriel","c":"Step One: Peoples of Tamriel","h":"Altmer Traits","t":"Creature Type · Size · Speed. Humanoid · Medium (about 5½–6½ feet tall) · 30 feet. As an Altmer, you have these special traits. Altmeri Spellcraft. You know the Prestidigitation cantrip. Whenever you finish a long rest, you can swap it for another Wizard cantrip. You also learn one level one spell from the following: Shield , Find Familiar , Magic Missile , Colour Spray or Cure Wounds . You learn Detect Magic at level 3 and Misty Step at level 5. Darkvision. You have Darkvision with a range of 60 feet. Highborn. Once per long rest, when you finish a short rest, choose one: You regain one expended spell slot. The slot's level can be no higher than half your Proficiency Bonus, rounded up. You regain the use of one spell from Altmeri Spellcraft. Keen Senses. You have proficiency in your choice of Insight, Perception or Survival. Trance. You don't need to sleep, and magic can't put you to sleep. You can finish a long rest in 4 hours of meditation, staying conscious throughout."},{"i":"guide-peoples-of-tamriel--argonians","b":"guide","ci":"guide-peoples-of-tamriel","c":"Step One: Peoples of Tamriel","h":"Argonians","t":"Argonians are patient, unreadable, and very good at outlasting the people who underestimate them. Appearance. Reptilian, with scales, tails and frills or horns that vary from tribe to tribe. They breathe water as easily as air. History. Argonians come from Black Marsh, a vast swamp south of Morrowind whose diseases kill most outsiders. For centuries Dunmer slavers raided it for workers, and Argonians have not forgotten. Culture. Life centres on the Hist, ancient sentient trees whose sap shapes each hatchling. Names are earned and often changed, and their language is Jel. Tribes keep to themselves, and a sense of self comes second to the clutch. Argonians call themselves the Saxhleel, the People of the Root. Jel is said to have no words for past or future, and many Argonians live firmly in the present: patient, adaptable and unbothered by what can't be changed. Hatchlings born under the sign of the Shadow are said to be taken away and trained as assassins, though no Argonian will confirm it. Attitudes. Pragmatic and calm, with a long view of everything. Most hold a deep, quiet hatred for Dunmer slavers. How others see them. Alien and hard to trust. To many Dunmer they are property. Imperials see them as useful but strange, and most other races simply avoid them."},{"i":"guide-peoples-of-tamriel--argonian-traits","b":"guide","ci":"guide-peoples-of-tamriel","c":"Step One: Peoples of Tamriel","h":"Argonian Traits","t":"Creature Type · Size · Speed. Humanoid · Medium (about 5–6 feet tall) · 30 feet; Swim Speed 30 feet. As an Argonian, you have these special traits. Amphibious. You can breathe both air and water. Bite. Your fanged jaws are a natural weapon you can use for Unarmed Strikes. A hit deals Piercing damage equal to 1d6 plus your Strength modifier, instead of the normal Bludgeoning damage. Hist Resilience. You have Resistance to Poison damage. You have Advantage on saving throws to avoid or end the Poisoned condition, and on saving throws against disease. Marsh Instincts. You have proficiency in two of these skills: Animal Handling, Medicine, Nature, Perception, Stealth or Survival. Scaled Hide. While you aren't wearing armor, your base Armor Class is 13 plus your Dexterity modifier. You can use this instead of worn armour if it gives you a higher AC. A Shield works as normal."},{"i":"guide-peoples-of-tamriel--bosmer-wood-elves","b":"guide","ci":"guide-peoples-of-tamriel","c":"Step One: Peoples of Tamriel","h":"Bosmer (Wood Elves)","t":"The Bosmer are cheerful, quick and hard to pin down, bound by a pact that forbids them to harm a single leaf. Appearance. Short and lithe, with brown or ochre skin and sharp features. They move quietly without trying. History. The Bosmer are elves who settled the forests of Valenwood, in Tamriel's south-west. There their god Y'ffre bound them to the Green Pact, a promise never to harm the forest. Culture. The Green Pact forbids harming the forest's plants, so their diet is meat, and some say it includes fallen enemies. Their great cities are living trees that wander through the forest. Storytelling and archery are prized above most things. Because they may not eat plants, Bosmer drink rotmeth, brewed from fermented meat, and jagga, made from fermented pig's milk. Their priests of Y'ffre, called Spinners, keep the stories that hold the world in shape. In desperate need, the Bosmer can call the Wild Hunt, a ritual that turns them into a stampede of beasts and nightmares. It is rarely called, and nobody who has seen it wants to see it again. Attitudes. Playful, irreverent and restless. They rarely take rules seriously unless the rules come from Y'ffre. How others see them. Superb archers, scouts and thieves. Their charm puts people at ease, and the Green Pact's rumoured diet makes them uneasy again. Merchants keep a close eye on their stock."},{"i":"guide-peoples-of-tamriel--bosmer-traits","b":"guide","ci":"guide-peoples-of-tamriel","c":"Step One: Peoples of Tamriel","h":"Bosmer Traits","t":"Creature Type · Size · Speed. Humanoid · Medium (about 4½–5½ feet tall) · 35 feet. As a Bosmer, you have these special traits. Beast Tongue. At level 3, you learn Speak with Animals . Bosmer Archery. You have proficiency with Longbows and Shortbows. Darkvision. You have Darkvision with a range of 60 feet. Fey Ancestry. You have Advantage on saving throws to avoid or end the Charmed condition. Keen Senses. You have proficiency in your choice of Insight, Perception or Survival. Trance. You don't need to sleep, and magic can't put you to sleep. You can finish a long rest in 4 hours of meditation, staying conscious throughout. Woodland Magic. You know the Druidcraft cantrip. At level 5, you learn Pass without Trace ."},{"i":"guide-peoples-of-tamriel--bretons","b":"guide","ci":"guide-peoples-of-tamriel","c":"Step One: Peoples of Tamriel","h":"Bretons","t":"Bretons are Men with a little elf in them, and a lot of politics. Appearance. Human, usually fair-skinned and of slight to medium build. Some show a faint elven sharpness in the face. History. Bretons come from High Rock, in Tamriel's north-west, where early humans and elves lived side by side and their bloodlines mixed. That elven blood is why Bretons take to magic so easily. Culture. High Rock is a patchwork of petty kingdoms, duchies and baronies, all scheming against each other. Chivalry, courtly intrigue and magic sit side by side. Bretons have a natural gift for spellcraft and an unusual resistance to hostile magic. Membership of a knightly order is a mark of status, and a Breton noble without one usually has an excuse ready. Marriages, feuds and alliances shift with every generation, so most Bretons learn early to read a room and keep their options open. Magic is respected rather than feared, and many families send at least one child to study with the Mages Guild. Attitudes. Clever, cultured and ambitious, with an eye for advantage. Loyalty tends to run to family and faction first. How others see them. Nords and Redguards think them soft and scheming. Mages respect their talent. On Vvardenfell they blend in well in the guilds, and are trusted about as far as anyone else."},{"i":"guide-peoples-of-tamriel--breton-traits","b":"guide","ci":"guide-peoples-of-tamriel","c":"Step One: Peoples of Tamriel","h":"Breton Traits","t":"Creature Type · Size · Speed. Humanoid · Medium (about 5–6 feet tall) · 30 feet. As a Breton, you have these special traits. Darkvision. You have Darkvision with a range of 60 feet. Dragonskin. When you take damage from a spell, you can take a Reaction to halve that damage, absorbing some of the spell's energy. You also regain one expended level 1 spell slot, if you have one. Once you use this trait, you can't do so again until you finish a long rest. Higher Education. You have proficiency in two skills of your choice. Resist Magicka. You have Advantage on saving throws against spells and cantrips that deal damage."},{"i":"guide-peoples-of-tamriel--dunmer-dark-elves","b":"guide","ci":"guide-peoples-of-tamriel","c":"Step One: Peoples of Tamriel","h":"Dunmer (Dark Elves)","t":"The Dunmer are proud, insular and cursed, and this is their island. Appearance. Ashen grey skin and red eyes, on a lean elven frame. Ashlanders often wear tattoos and ash-coloured clothing. History. The Dunmer were once golden-skinned elves who left the Summerset Isles to worship the Daedra in Morrowind. After an ancient betrayal, the goddess Azura cursed them with grey skin and red eyes, and they have been the Dunmer ever since. Culture. Power belongs to the Great Houses; on Vvardenfell these are Hlaalu, Redoran and Telvanni. The Tribunal Temple and ancestor veneration shape daily life. The nomadic Ashlanders reject both the Houses and the Temple. Families keep the ashes of their dead in household shrines and great tombs, and bind ancestral spirits to guard them; robbing a tomb is a crime against an entire family line. Dunmer eat saltrice, kwama eggs and scrib jelly, and they build according to their House: Redoran homes from the shells of giant beasts, Telvanni towers from living mushrooms, and Hlaalu halls in an Imperial style. Insults matter. Call a Dunmer s'wit and expect a fight, and know that outlanders remain n'wah until they prove otherwise. Attitudes. Proud, suspicious of outsiders, and quick to take offence. Duty to house and family comes before everything. How others see them. Dour, arrogant and cruel, especially to Argonians and Khajiit. Skilled warriors and mages who are hard to like. Nords and Argonians hold the oldest grudges."},{"i":"guide-peoples-of-tamriel--dunmer-traits","b":"guide","ci":"guide-peoples-of-tamriel","c":"Step One: Peoples of Tamriel","h":"Dunmer Traits","t":"Creature Type · Size · Speed. Humanoid · Medium (about 5–6 feet tall) · 30 feet. As a Dunmer, you have these special traits. Ancestor Guardian. At level 5, you learn Sanctuary . When you cast it without a spell slot using this trait, you must target yourself. The ward appears as the spirit of an ancestor. Ancestral Teachings. You have proficiency in your choice of Arcana, Athletics, Persuasion, Religion or Survival. Ashen Blood. You have Resistance to Fire damage. You know the Fire Bolt cantrip, and at level 3 you learn Hellish Rebuke . Ashen Presence. You know the Thaumaturgy cantrip. Darkvision. You have Darkvision with a range of 60 feet. Dunmer Versatility. You have proficiency with shortswords, daggers and longbows."},{"i":"guide-peoples-of-tamriel--imperials","b":"guide","ci":"guide-peoples-of-tamriel","c":"Step One: Peoples of Tamriel","h":"Imperials","t":"Imperials run the Empire, and they would like you to fill out the correct form about it. Appearance. Human, of medium build, with skin from fair to olive. They dress well when they can afford to. History. Imperials come from Cyrodiil, the heartland of Tamriel. Their ancestors threw off their elven masters to found the first human empire, and today their Emperor rules all of Tamriel, Morrowind included. Culture. Law, trade, bureaucracy and the Legion hold the Empire together. Western Colovians lean martial and blunt; eastern Nibenese lean mercantile, magical and ornate. The Imperial Cult of the Nine Divines is the official faith. Colovians, from the western highlands, value plain speech, hard work and service in the Legion. Nibenese, from the rich eastern valley, love ceremony, colourful dress, commerce and magic. Both share a deep confidence in Imperial law, and both expect to be treated as citizens wherever they go. Attitudes. Confident, practical and sure the Empire brings order. Most see other cultures as interesting provinces rather than equals. How others see them. Administrators, merchants and soldiers. Nords and Redguards respect the Legion; Altmer find Imperials tolerable for Men. Most Dunmer see them as occupiers, and say so carefully."},{"i":"guide-peoples-of-tamriel--imperial-traits","b":"guide","ci":"guide-peoples-of-tamriel","c":"Step One: Peoples of Tamriel","h":"Imperial Traits","t":"Creature Type · Size · Speed. Humanoid · Medium (about 5–6 feet tall) · 30 feet. As an Imperial, you have these special traits. Legion Discipline. You have Advantage on saving throws to avoid or end the Frightened condition. Legion Training. You have proficiency with shields, broadswords and spears. Shield Wall. When a creature you can see hits you, or an ally within 5 feet of you, with an attack while you are holding a shield, you can take a Reaction to add your Proficiency Bonus to the target's AC against that attack, potentially causing a miss. You can use this trait a number of times equal to your Proficiency Bonus, and you regain all expended uses when you finish a long rest. Voice of the Emperor. You have proficiency in Persuasion."},{"i":"guide-peoples-of-tamriel--khajiit","b":"guide","ci":"guide-peoples-of-tamriel","c":"Step One: Peoples of Tamriel","h":"Khajiit","t":"Khajiit are agile, sharp-witted and ruled by the moons. They are also blamed for most of the skooma on Vvardenfell, which is only partly fair. Appearance. Feline, with fur, tails and claws. The phases of the moons at birth decide a Khajiit's form, which ranges from nearly human to great war-cats. Those seen on Vvardenfell are mostly the upright, human-sized kind. History. Khajiit come from Elsweyr, a land of deserts and jungles south of Cyrodiil. In Morrowind they are often enslaved, as Argonians are. Culture. Faith centres on the Riddle'Thar and the two moons. Moon sugar is sacred to them, and refined into skooma it is a dangerous, highly profitable drug. Many Khajiit speak of themselves in the third person. A Khajiit's form depends on the phases of the moons at birth. The Ohmes look almost like elves, the Suthay-raht seen on Vvardenfell walk upright, and the Senche are war-cats big enough to ride. Names carry titles: prefixes such as Ri', Ra', Do' and J' mark rank, age or deeds, and they change over a Khajiit's life. The Riddle'Thar teaches that the dance of the moons, which Khajiit call Jone and Jode, sets the order of the world. Attitudes. Playful, wry and loyal to clan and kin. They tend to treat laws as suggestions written by other people. How others see them. Thieves, smugglers and skooma dealers, which is unfair to most and accurate about a few. They are welcome as acrobats and traders, but rarely as neighbours."},{"i":"guide-peoples-of-tamriel--khajiit-traits","b":"guide","ci":"guide-peoples-of-tamriel","c":"Step One: Peoples of Tamriel","h":"Khajiit Traits","t":"Creature Type · Size · Speed. Humanoid · Medium (about 5–6 feet tall) · 30 feet; Climb Speed 30 feet. As a Khajiit, you have these special traits. Claws. Your claws are natural weapons you can use for Unarmed Strikes. A hit deals Slashing damage equal to 1d6 plus your Strength modifier, instead of the normal Bludgeoning damage. Eye of Night. You have Darkvision with a range of 120 feet. Feline Agility. When you move on your turn in combat, you can double your Speed until the end of that turn. Once you do, you can't do so again until you spend one of your turns moving 0 feet. Feline Talent. You have proficiency in Perception and Stealth."},{"i":"guide-peoples-of-tamriel--nords","b":"guide","ci":"guide-peoples-of-tamriel","c":"Step One: Peoples of Tamriel","h":"Nords","t":"Nords are tall, tough, loud and honest, often more honest than the situation needs. Appearance. Big-boned and fair, with blond, red or brown hair. They shrug off cold that would kill other races. History. Nords sailed to Skyrim, in Tamriel's cold north, from a frozen continent across the sea. Their early armies invaded Morrowind and were driven out, and Nords and Dunmer have been enemies ever since. Culture. Clan, courage and a good death matter most; the brave expect to feast in Sovngarde. Skalds keep history in song, and mead keeps the skalds going. Many distrust magic, especially elven magic. Nords honour Kyne (Kynareth to the Imperials), goddess of storms, and Shor, who is Lorkhan by another name, alongside the other Divines, and many treat Talos as one of their own heroes. Disputes are settled openly and often loudly. A Nord's word, once given, is expected to hold, and an oathbreaker is despised more than an honest enemy. Attitudes. Direct, warlike and fiercely loyal. They respect strength and plain speech, and despise sneaks. How others see them. Brave but barbaric to Altmer and Bretons, reliable soldiers to Imperials. The Dunmer have not forgotten the invasions. In some places on Vvardenfell, a Nord walks into most rooms already at a disadvantage."},{"i":"guide-peoples-of-tamriel--nord-traits","b":"guide","ci":"guide-peoples-of-tamriel","c":"Step One: Peoples of Tamriel","h":"Nord Traits","t":"Creature Type · Size · Speed. Humanoid · Medium (about 6–7 feet tall) · 30 feet. As a Nord, you have these special traits. Battle Cry. When you take the Attack action, you can replace one of your attacks with a wordless roar. Each creature of your choice within 30 feet of you that can hear you must make a Wisdom saving throw (DC 8 + your Constitution modifier + your Proficiency Bonus). On a failure, a creature has the Frightened condition for 1 minute. It repeats the save at the end of each of its turns, ending the effect on itself on a success. Once you use this trait, you can't do so again until you finish a long rest. Imposing. You gain Proficiency in Intimidation. Nord Hardiness. You have Resistance to Cold and Lightning damage. Savage Attacks. When you score a Critical Hit with a melee weapon, roll one of the weapon's damage dice one more time and add it to the Critical Hit's extra damage."},{"i":"guide-peoples-of-tamriel--orsimer-orcs","b":"guide","ci":"guide-peoples-of-tamriel","c":"Step One: Peoples of Tamriel","h":"Orsimer (Orcs)","t":"Orcs are Mer who were cast out, and they have built a culture around never being cast out again. Appearance. Broad, heavily muscled and green-grey, with tusks and heavy brows. They are built for work and war. History. Orcs were once elves, transformed along with their god when he became the Daedric Prince Malacath, and other peoples have treated them as outcasts ever since. Their homeland is Orsinium, a mountain kingdom between High Rock and Hammerfell. Culture. Clans live in strongholds under a chief, guided by the Code of Malacath. Oaths are sacred, grudges are kept, and smithing is an art. Orcish armour is some of the best in Tamriel. A chief rules by strength and can be challenged for the title. Wise women keep each stronghold's lore and healing. Under the Code, a wrong is paid for in blood or in gold, and nothing is forgiven for free. Orcish smiths work orichalcum, and armour from a good stronghold forge is worth a small fortune. Attitudes. Proud, blunt and deeply loyal. They expect contempt from outsiders and respect from anyone who has earned it. How others see them. Many still see them as brutes or beasts. The Legion and every mercenary company value them as fighters. Bretons, their old neighbours and enemies, trust them least."},{"i":"guide-peoples-of-tamriel--orc-traits","b":"guide","ci":"guide-peoples-of-tamriel","c":"Step One: Peoples of Tamriel","h":"Orc Traits","t":"Creature Type · Size · Speed. Humanoid · Medium (about 6–7 feet tall) · 30 feet. As an Orc, you have these special traits. Berserk. As a Bonus Action, you fly into a berserk rage for 1 minute. While it lasts, you gain the following effects: You gain Temporary Hit Points equal to your level plus your Proficiency Bonus. You have Advantage on attack rolls with melee weapons and Unarmed Strikes, and those attacks deal extra damage equal to your Proficiency Bonus. Attack rolls against you have Advantage, and you have Disadvantage on Dexterity saving throws. Once you use this trait, you can't do so again until you finish a long rest. Darkvision. You have Darkvision with a range of 60 feet. Imposing. You gain Proficiency in Intimidation. Orcish Smithing. You have proficiency with Smith's Tools. Relentless Endurance. When you are reduced to 0 Hit Points but not killed outright, you can drop to 1 Hit Point instead. Once you use this trait, you can't do so again until you finish a long rest."},{"i":"guide-peoples-of-tamriel--redguards","b":"guide","ci":"guide-peoples-of-tamriel","c":"Step One: Peoples of Tamriel","h":"Redguards","t":"Redguards are the finest natural warriors in Tamriel, and they know it. Appearance. Dark-skinned, athletic and tough. They tolerate heat, poison and disease better than most. History. Redguards came to Hammerfell, in Tamriel's west, from a continent that has since sunk beneath the sea. Their warriors cleared the land by the sword before the settlers arrived, and the sword has been at the heart of their culture ever since. Culture. The sword is close to sacred, and master swordsmen are honoured like saints. Society divides between traditionalist Crowns and Empire-friendly Forebears. Many distrust magic and prefer steel. Redguards follow the Way of the Sword, set down in Frandar Hunding's Book of Circles, which treats swordsmanship as a spiritual discipline. The Crowns keep the old Yokudan gods, such as Satakal and Tu'whacca; the Forebears mostly worship the Nine. Necromancy is an abomination to nearly all Redguards, and many would rather trust a blade they can see than a spell they can't. Attitudes. Proud, independent and fiercely protective of their freedom. They don't follow anyone they haven't chosen to follow. How others see them. Formidable warriors and sought-after mercenaries. Bretons and Imperials respect them warily, and Altmer find them uncultured. Few races call them close friends."},{"i":"guide-peoples-of-tamriel--redguard-traits","b":"guide","ci":"guide-peoples-of-tamriel","c":"Step One: Peoples of Tamriel","h":"Redguard Traits","t":"Creature Type · Size · Speed. Humanoid · Medium (about 5½–6½ feet tall) · 30 feet. As a Redguard, you have these special traits. Adrenaline Rush. As a bonus action, you push your body past its limits. For 1 minute your Speed increases by 10 feet, you have Advantage on Strength and Dexterity checks and saving throws, and you gain Temporary Hit Points equal to your level. Once you use this trait, you can't do so again until you finish a long rest. Redguard Resilience. You have Resistance to Poison damage. You have Advantage on saving throws to avoid or end the Poisoned condition, and on saving throws against disease. Way of the Sword. You have proficiency with broadswords, claymores, longswords, rapiers, sabers, and shortswords. You can also use the mastery property of one of these sword types, as if you had the Weapon Mastery feature; if you already have the Weapon Mastery feature, it's an extra weapon you've mastered. Whenever you finish a long rest, you can change which sword you've chosen."},{"i":"guide-peoples-of-tamriel--languages-of-tamriel","b":"guide","ci":"guide-peoples-of-tamriel","c":"Step One: Peoples of Tamriel","h":"Languages of Tamriel","t":"Tamrielic, the language of the Empire, is spoken everywhere, but most peoples keep a tongue of their own. Language · Spoken by · On Vvardenfell. Tamrielic · Everyone; most Imperials and Bretons speak nothing else · The common tongue of officials, traders and the Legion. Aldmeris · Altmer · Altmer mages, and old elven texts. Bosmeris · Bosmer · Bosmer hunters, scouts and traders. Daedric · Daedra, and the mortals who summon or worship them · Summoned creatures, Daedric shrines and the ruins around them. Dunmeris · Dunmer · Everywhere: the Great Houses, the Temple and Ashlander camps. Dwemeris · No one living; it belonged to the vanished Dwemer · Written on the walls and machines of Dwemer ruins. Jel · Argonians · Among Argonians, free and enslaved. Nordic · Nords · Nord sellswords, and the island of Solstheim to the north. Orcish · Orcs · Orc mercenaries and smiths. Ta'agra · Khajiit · Khajiit caravans, and among Khajiit slaves. Yoku · Redguards · Rarely; a few Redguard sellswords keep it. Choosing. You speak Tamrielic and two languages of your choice from this table, except Dwemeris. Dwemeris. Nobody alive speaks it, but scholars can learn to read it. It can only be learned in play, in whatever way your DM decides. Class languages. Thieves' Cant (rogues) and Druidic (druids) come from your class, not from this table."},{"i":"guide-classes-on-vvardenfell","b":"guide","ci":"guide-classes-on-vvardenfell","c":"Step Two: Classes on Vvardenfell","h":"Step Two: Classes on Vvardenfell","t":"“Everyone on this island is something: a sword, a spell or a debt. Decide which before someone decides for you.” — A Fighters Guild steward, Balmora"},{"i":"guide-classes-on-vvardenfell--every-class-has-a-place","b":"guide","ci":"guide-classes-on-vvardenfell","c":"Step Two: Classes on Vvardenfell","h":"Every Class Has a Place","t":"Every class in the 2024 Player's Handbook has a place on Vvardenfell, and works exactly as written. This step says where your class fits on the island, and who is likely to want your services once you land. Class · On Vvardenfell · Who'll want you. Barbarian · Nords from Skyrim and Orcs from the mountains of Orsinium bring their fury with them. House Redoran respects it; everyone else keeps their distance. · The Fighters Guild, House Redoran. Bard · Imperial courtiers, Breton minstrels and Khajiit storytellers. On an island that runs on favours, a silver tongue is worth more than a sword. · House Hlaalu, the Thieves Guild. Cleric · A priest of the Imperial Cult, the Tribunal Temple or a Daedric shrine. You choose your god in Step Six. · The Temple, the Imperial Cult. Druid · Bosmer of the Green Pact and followers of Kyne. Vvardenfell's wilds are ash and giant fungus, and its spirits are strange. · The Mages Guild, which will want to study you; the Ashlanders, who might respect you. Fighter · Legion veterans, caravan guards and Redguard swords for hire. There is always work on Vvardenfell for someone who can fight. · The Fighters Guild, the Imperial Legion, House Redoran. Monk · Pilgrims, ascetics and students of the old unarmed schools. Vivec's own warriors, the Buoyant Armigers, prize that kind of discipline. · The Temple, the Morag Tong. Paladin · A holy knight of the Nine Divines, or the sworn servant of another power. The Temple's Ordinators dislike competition. You choose your god in Step Six. · The Imperial Cult, the Imperial Legion. Ranger · Bosmer hunters, Redguard trackers and Nord woodsmen. The island needs guides through country that wants you dead. · The Fighters Guild, the East Empire Company. Rogue · Thieves, spies and cutpurses. The Thieves Guild has followed the Empire to the island, and the Camonna Tong would like it gone. · The Thieves Guild, House Hlaalu. Sorcerer · Bretons with Direnni blood, Altmer born with a gift, or stranger heritage still. The Mages Guild is wary of untrained power; the Telvanni admire it. · The Mages Guild, House Telvanni. Warlock · You made a bargain with a Daedric Prince. Serving one of the Good Daedra is accepted; serving any other Prince is heresy. You choose your patron in Step Six. · Your patron's cult, if you can find it. Wizard · A scholar trained by the Mages Guild in Cyrodiil, or in the towers of the Summerset Isles. The Telvanni wizard-lords think Guild mages are amateurs. · The Mages Guild, House Telvanni. Faith suggests some subclasses. Clerics, paladins and warlocks choose a god or patron in Step Six , and each one suggests domains, oaths or patrons that suit it. They're suggestions, not limits. Joining up. The factions in the table will notice you, and some will approach you early on. Membership is earned in play, not chosen now. Spellcasters. The Mages Guild sells spells and scrolls (see Buying Spells in Treasures of Morrowind ). Some birthsigns suit spellcasters better than others ( Step Four ). Your primary ability. Your class's primary ability should get one of your best scores in Step Five ."},{"i":"guide-classes-on-vvardenfell--weapon-mastery","b":"guide","ci":"guide-classes-on-vvardenfell","c":"Step Two: Classes on Vvardenfell","h":"Weapon Mastery","t":"Every weapon in Treasures of Morrowind has a mastery property, shown in the Mastery column of its weapon tables . Mastery is a trick that a trained warrior gets out of a weapon: a spear that throws a foe off balance, a dagger quick enough for a second strike. Anyone can swing a weapon, but you can use its mastery property only if a feature lets you. Who has it. Five classes start with Weapon Mastery at 1st level, as shown below. Anyone of 4th level or higher can take the Weapon Master feat to master one more kind of weapon. Other classes have no mastery unless they take the feat. Proficiency. You must be proficient with a weapon to use its mastery property. Kinds of weapon. You master a kind of weapon, not one item, so mastery of the broadsword works with every broadsword, whatever it's made of. Choose by the names in Treasures of Morrowind : the Mastery column says what each one gives you. Changing your mind. Whenever you finish a Long Rest, you can change your choices. Barbarians and fighters change one choice per Long Rest. Source · Kinds of weapon · Which weapons. Barbarian · 2 (3 at 4th level, 4 at 10th) · Simple or Martial melee weapons. Fighter · 3 (4 at 4th level, 5 at 10th, 6 at 16th) · Any Simple or Martial weapons. Paladin · 2 · Any weapons you're proficient with. Ranger · 2 · Any weapons you're proficient with. Rogue · 2 · Any weapons you're proficient with. Weapon Master feat (4th level+) · 1 more · Any weapon you're proficient with. The properties do the following when you attack with a weapon you have mastered. \"Ability modifier\" means the one you used for the attack roll. Property · Effect · Weapons in Treasures. Cleave · Once per turn, when you hit a creature with a melee attack, you can attack a second creature within 5 feet of the first and within your reach. Don't add your ability modifier to the second attack's damage unless it's negative. · Battle axe, halberd. Graze · When you miss, the target still takes damage equal to your ability modifier, of the weapon's damage type. · Broadsword, claymore, glaive, dai-katana. Nick · The extra attack from the Light property is part of your Attack action instead of a Bonus Action, which frees your Bonus Action. Once per turn. · Dagger, saber, tanto, wakizashi, throwing knife. Push · On a hit, you can push a Large or smaller creature up to 10 feet straight away from you. · Long spear, crossbow. Sap · On a hit, the target has Disadvantage on its next attack roll before the start of your next turn. · Mace, miner's pick, spear, longsword, spiked club, katana. Slow · On a hit that deals damage, the target's Speed drops by 10 feet until the start of your next turn. More hits don't slow it further. · Club, light crossbow, whip, long bow. Topple · On a hit, the target makes a Constitution saving throw (DC 8 + your ability modifier + your Proficiency Bonus) or falls Prone. · Staff, trident, war axe, warhammer. Vex · On a hit that deals damage, you have Advantage on your next attack roll against that creature before the end of your next turn. · Axe, short bow, rapier, shortsword, dart, throwing star."},{"i":"guide-backgrounds-of-tamriel","b":"guide","ci":"guide-backgrounds-of-tamriel","c":"Step Three: Backgrounds of Tamriel","h":"Step Three: Backgrounds of Tamriel","t":"“Nobody on this island cares who you were back home. They care what you can do, and who you owe.” — A Hlaalu trader, Balmora"},{"i":"guide-backgrounds-of-tamriel--choosing-a-background","b":"guide","ci":"guide-backgrounds-of-tamriel","c":"Step Three: Backgrounds of Tamriel","h":"Choosing a Background","t":"Your background is what you did before you boarded the ship: the trade, the faith or the trouble that made you who you are. None of you has set foot on Vvardenfell before. Your background happened somewhere else: on the mainland of Morrowind, or elsewhere in Tamriel. Choose one of the sixteen backgrounds from the Player's Handbook , retooled below for this campaign, or one of the ten Morrowind backgrounds that follow them. What a background gives you Ability scores. Your background lists three abilities, which you raise in Step Five . Proficiencies. Two skills and one tool. Equipment. The package listed, or 50 gp to spend instead. A connection. A tie to the island you've never seen: someone there who knows your name, your family, your trade or your old crew. Connections are story hooks, not rules: they give your DM a thread to pull, and you a reason to be known. No Origin feat. Your birthsign takes its place (see Step Four ). You can still take an Origin feat later, using the Ability Score Improvement feature. Doubled proficiencies. If your background gives you a skill or tool proficiency you already have from your race or birthsign, choose a different skill or tool instead. Making your own. With your DM's agreement, you can build a background of your own. Choose three abilities, two skills and one tool that fit your story, take 50 gp for equipment, and agree a connection with your DM."},{"i":"guide-backgrounds-of-tamriel--backgrounds-from-the-players-handbook","b":"guide","ci":"guide-backgrounds-of-tamriel","c":"Step Three: Backgrounds of Tamriel","h":"Backgrounds from the Player's Handbook","t":"These are the sixteen backgrounds of the 2024 Player's Handbook . Their abilities, skills, tools and equipment are as written there, and are repeated below, except that none of them gives an Origin feat. Each gains a connection to Vvardenfell instead. Background · Abilities · Skills · Tool. Acolyte · Int, Wis, Cha · Insight, Religion · Calligrapher's Supplies. Artisan · Str, Dex, Int · Investigation, Persuasion · One type of Artisan's Tools. Charlatan · Dex, Con, Cha · Deception, Sleight of Hand · Forgery Kit. Criminal · Dex, Con, Int · Sleight of Hand, Stealth · Thieves' Tools. Entertainer · Str, Dex, Cha · Acrobatics, Performance · One musical instrument. Farmer · Str, Con, Wis · Animal Handling, Nature · Carpenter's Tools. Guard · Str, Int, Wis · Athletics, Perception · One gaming set. Guide · Dex, Con, Wis · Stealth, Survival · Cartographer's Tools. Hermit · Con, Wis, Cha · Medicine, Religion · Herbalism Kit. Merchant · Con, Int, Cha · Animal Handling, Persuasion · Navigator's Tools. Noble · Str, Int, Cha · History, Persuasion · One gaming set. Sage · Con, Int, Wis · Arcana, History · Calligrapher's Supplies. Sailor · Str, Dex, Wis · Acrobatics, Perception · Navigator's Tools. Scribe · Dex, Int, Wis · Investigation, Perception · Calligrapher's Supplies. Soldier · Str, Dex, Con · Athletics, Intimidation · One gaming set. Wayfarer · Dex, Wis, Cha · Insight, Stealth · Thieves' Tools."},{"i":"guide-backgrounds-of-tamriel--acolyte","b":"guide","ci":"guide-backgrounds-of-tamriel","c":"Step Three: Backgrounds of Tamriel","h":"Acolyte","t":"You served a temple: a Tribunal shrine on the mainland, an Imperial Cult chapel in Cyrodiil, or something less respectable. Equipment. Calligrapher's Supplies, a book of prayers, a holy symbol, 10 sheets of parchment, a robe and 8 gp; or 50 gp. Connection. The priests of your faith on Vvardenfell will shelter you for a night and carry a message for you, as they would anywhere."},{"i":"guide-backgrounds-of-tamriel--artisan","b":"guide","ci":"guide-backgrounds-of-tamriel","c":"Step Three: Backgrounds of Tamriel","h":"Artisan","t":"You learned a trade, such as bonemold armour, Hlaalu silks, netch-leather or Imperial glasswork. Equipment. The Artisan's Tools you chose, 2 pouches, Traveller's Clothes and 32 gp; or 50 gp. Connection. Your old master wrote you a letter of introduction to a fellow craftsman in Vivec, Balmora or Ebonheart."},{"i":"guide-backgrounds-of-tamriel--charlatan","b":"guide","ci":"guide-backgrounds-of-tamriel","c":"Step Three: Backgrounds of Tamriel","h":"Charlatan","t":"You've sold fake relics to pilgrims and painted stones to the gullible as soul gems. Equipment. A Forgery Kit, a costume, Fine Clothes and 15 gp; or 50 gp. Connection. An old partner gave you the name of a forger in Vivec's Foreign Quarter, and told you to mention theirs."},{"i":"guide-backgrounds-of-tamriel--criminal","b":"guide","ci":"guide-backgrounds-of-tamriel","c":"Step Three: Backgrounds of Tamriel","h":"Criminal","t":"You've worked for a thieves' guild, the Camonna Tong on the mainland, or against both. Equipment. 2 daggers, Thieves' Tools, a crowbar, 2 pouches, Traveller's Clothes and 16 gp; or 50 gp. Connection. Your old crew gave you the name of a fence on Vvardenfell, and of one thief there who owes them a favour."},{"i":"guide-backgrounds-of-tamriel--entertainer","b":"guide","ci":"guide-backgrounds-of-tamriel","c":"Step Three: Backgrounds of Tamriel","h":"Entertainer","t":"You've tumbled, sung or told stories in taverns and on street corners across the Empire. Equipment. The musical instrument you chose, 2 costumes, a mirror, perfume, Traveller's Clothes and 11 gp; or 50 gp. Connection. A travelling troupe you once worked with is touring Vvardenfell, and will put you on the bill."},{"i":"guide-backgrounds-of-tamriel--farmer","b":"guide","ci":"guide-backgrounds-of-tamriel","c":"Step Three: Backgrounds of Tamriel","h":"Farmer","t":"You've worked saltrice paddies, herded guar or tended a kwama egg mine on the mainland. Equipment. A sickle, Carpenter's Tools, a healer's kit, an iron pot, a shovel, Traveller's Clothes and 30 gp; or 50 gp. Connection. Farmers are the same everywhere: those along Vvardenfell's roads will feed someone who talks like one of them, and tell you what's been prowling at night."},{"i":"guide-backgrounds-of-tamriel--guard","b":"guide","ci":"guide-backgrounds-of-tamriel","c":"Step Three: Backgrounds of Tamriel","h":"Guard","t":"You've stood watch for the Legion, a Great House or a merchant's caravan. Equipment. A spear, a light crossbow, 20 bolts, the gaming set you chose, a hooded lantern, manacles, a quiver, Traveller's Clothes and 12 gp; or 50 gp. Connection. You carry a letter of recommendation from your old captain to a guard captain on Vvardenfell."},{"i":"guide-backgrounds-of-tamriel--guide","b":"guide","ci":"guide-backgrounds-of-tamriel","c":"Step Three: Backgrounds of Tamriel","h":"Guide","t":"You've led travellers through the swamps, hills and ash of mainland Morrowind, or the wilds of another province. Equipment. A shortbow, 20 arrows, Cartographer's Tools, a bedroll, a quiver, a tent, Traveller's Clothes and 3 gp; or 50 gp. Connection. A guide on Vvardenfell will trade you local knowledge for news of the roads you know."},{"i":"guide-backgrounds-of-tamriel--hermit","b":"guide","ci":"guide-backgrounds-of-tamriel","c":"Step Three: Backgrounds of Tamriel","h":"Hermit","t":"You lived apart, in a hut on a lonely coast, a cave in the hills or the shadow of a wizard's tower. Equipment. A quarterstaff, an Herbalism Kit, a bedroll, a book of philosophy, a lamp, 3 flasks of oil, Traveller's Clothes and 16 gp; or 50 gp. Connection. An Ashlander wise woman you met in the wilds told you to seek out her sister, who lives with a tribe on Vvardenfell."},{"i":"guide-backgrounds-of-tamriel--merchant","b":"guide","ci":"guide-backgrounds-of-tamriel","c":"Step Three: Backgrounds of Tamriel","h":"Merchant","t":"You've bought and sold for a Hlaalu trading house, the East Empire Company or yourself. Equipment. Navigator's Tools, 2 pouches, Traveller's Clothes and 22 gp; or 50 gp. Connection. Your house or company has a factor on Vvardenfell who'll share the gossip about prices with you, and who's been buying what."},{"i":"guide-backgrounds-of-tamriel--noble","b":"guide","ci":"guide-backgrounds-of-tamriel","c":"Step Three: Backgrounds of Tamriel","h":"Noble","t":"You come from a minor house of Cyrodiil, a Hlaalu family on the rise or an old Redoran line from the mainland. Equipment. The gaming set you chose, Fine Clothes, perfume and 29 gp; or 50 gp. Connection. One Great House councillor or Imperial official on Vvardenfell knows your family, for better or worse."},{"i":"guide-backgrounds-of-tamriel--sage","b":"guide","ci":"guide-backgrounds-of-tamriel","c":"Step Three: Backgrounds of Tamriel","h":"Sage","t":"You've studied in the Imperial Library, a Mages Guild hall or a Telvanni archive on the mainland. Equipment. A quarterstaff, Calligrapher's Supplies, a book of history, 8 sheets of parchment, a robe and 8 gp; or 50 gp. Connection. A scholar in Vivec or Balmora has written to you for years, and answers your questions, slowly."},{"i":"guide-backgrounds-of-tamriel--sailor","b":"guide","ci":"guide-backgrounds-of-tamriel","c":"Step Three: Backgrounds of Tamriel","h":"Sailor","t":"You've crewed Company ships, fishing boats or coastal ferries around Tamriel. Equipment. A dagger, Navigator's Tools, a rope, Traveller's Clothes and 20 gp; or 50 gp. Connection. The captains of the Inner Sea know your old ship by name, and you know which of them carry passengers without asking questions."},{"i":"guide-backgrounds-of-tamriel--scribe","b":"guide","ci":"guide-backgrounds-of-tamriel","c":"Step Three: Backgrounds of Tamriel","h":"Scribe","t":"You've copied scripture for the Temple, records for a Great House or forms for the Empire. Equipment. Calligrapher's Supplies, Fine Clothes, a lamp, 3 flasks of oil, 12 sheets of parchment and 23 gp; or 50 gp. Connection. You know how Imperial paperwork works, and the name of a clerk in Vvardenfell's Census and Excise Office who owes your old office a favour."},{"i":"guide-backgrounds-of-tamriel--soldier","b":"guide","ci":"guide-backgrounds-of-tamriel","c":"Step Three: Backgrounds of Tamriel","h":"Soldier","t":"You've served in the Imperial Legion, a Great House's army or a mercenary company. Equipment. A spear, a shortbow, 20 arrows, the gaming set you chose, a healer's kit, a quiver, Traveller's Clothes and 14 gp; or 50 gp. Connection. In any Legion fort, Vvardenfell's included, you can find someone who served where you did."},{"i":"guide-backgrounds-of-tamriel--wayfarer","b":"guide","ci":"guide-backgrounds-of-tamriel","c":"Step Three: Backgrounds of Tamriel","h":"Wayfarer","t":"You grew up on the streets of Mournhold, the Imperial City or another crowded city. Equipment. 2 daggers, Thieves' Tools, a gaming set of your choice, a bedroll, 2 pouches, Traveller's Clothes and 16 gp; or 50 gp. Connection. Street children are the same everywhere. On Vvardenfell, they'll tell you what they've seen for a few coins, once they see you know the game."},{"i":"guide-backgrounds-of-tamriel--backgrounds-of-morrowind","b":"guide","ci":"guide-backgrounds-of-tamriel","c":"Step Three: Backgrounds of Tamriel","h":"Backgrounds of Morrowind","t":"These backgrounds are new to this campaign. They work like any other, and each comes with its own equipment. Like every background here, they took place off the island. Prices for the armourer's hammers, the mortar and pestle and the miner's pick are in Treasures of Morrowind . Background · Abilities · Skills · Tool. Ashlander Exile · Str, Dex, Wis · Animal Handling, Survival · Leatherworker's Tools. Company Clerk · Int, Wis, Cha · Insight, Investigation · Calligrapher's Supplies. Ebony Miner · Str, Con, Wis · Athletics, Perception · Smith's Tools. Fighters Guild Journeyman · Str, Dex, Con · Athletics, Survival · Smith's Tools. Freed Slave · Str, Dex, Con · Athletics, Stealth · One type of Artisan's Tools. Mages Guild Associate · Int, Wis, Con · Arcana, Investigation · Alchemist's Supplies. Nord Skald · Str, Int, Cha · History, Performance · One musical instrument. Pilgrim · Con, Wis, Cha · Religion, Survival · Herbalism Kit. Silt Strider Caravaner · Con, Wis, Cha · Animal Handling, Persuasion · Cartographer's Tools. Smuggler · Str, Dex, Cha · Athletics, Deception · Navigator's Tools."},{"i":"guide-backgrounds-of-tamriel--ashlander-exile","b":"guide","ci":"guide-backgrounds-of-tamriel","c":"Step Three: Backgrounds of Tamriel","h":"Ashlander Exile","t":"You left one of the Ashlander tribes that still wander the wild country of mainland Morrowind, or they made you leave. All your life you've heard of the great tribes of Vvardenfell, who live in the shadow of Red Mountain. Equipment. Leatherworker's Tools, a spear, Traveller's Clothes, a bedroll, a tinderbox, a pouch and 40 gp; or 50 gp. Connection. Ashlanders share their customs across the water. The four great tribes of Vvardenfell, the Urshilaku, the Ahemmusa, the Zainab and the Erabenimsun, will hear you out as kin, if warily."},{"i":"guide-backgrounds-of-tamriel--company-clerk","b":"guide","ci":"guide-backgrounds-of-tamriel","c":"Step Three: Backgrounds of Tamriel","h":"Company Clerk","t":"You've kept the East Empire Company's ledgers in a mainland port, and you've seen how creative the Vvardenfell accounts get on paper. Equipment. Calligrapher's Supplies, a blank ledger (a book), Traveller's Clothes and 13 gp; or 50 gp. Connection. Your name is on the Company's books, so its clerks in Ebonheart will treat you as one of their own, and show you a manifest if you ask nicely."},{"i":"guide-backgrounds-of-tamriel--ebony-miner","b":"guide","ci":"guide-backgrounds-of-tamriel","c":"Step Three: Backgrounds of Tamriel","h":"Ebony Miner","t":"You've swung a pick in the ebony mines of mainland Morrowind or Skyrim, and learned to smelt and work what you dug out. Every miner you've met talks about Vvardenfell's mines, the richest in Tamriel. Equipment. A miner's pick, an Apprentice's armourer's hammer, a hooded lantern, Traveller's Clothes and 36 gp; or 50 gp. Connection. You know the trade: which mine-owners are honest, who buys raw ore without asking questions, and the names of the Vvardenfell mines every miner talks about."},{"i":"guide-backgrounds-of-tamriel--fighters-guild-journeyman","b":"guide","ci":"guide-backgrounds-of-tamriel","c":"Step Three: Backgrounds of Tamriel","h":"Fighters Guild Journeyman","t":"You've taken the Guild's contracts on the mainland: rats, bandits and the occasional thing in a cave. You've learned to keep your own gear in one piece. Equipment. A Journeyman's armourer's hammer, a healer's kit, Traveller's Clothes, a bedroll, a rope and 26 gp; or 50 gp. Connection. Your Guild writ is good in any hall, Ebonheart's included. They'll give you a bunk for the night and tell you which contracts pay."},{"i":"guide-backgrounds-of-tamriel--freed-slave","b":"guide","ci":"guide-backgrounds-of-tamriel","c":"Step Three: Backgrounds of Tamriel","h":"Freed Slave","t":"You were owned in Morrowind, perhaps bought in the slave markets of Tear, and now you aren't. You kept the trade they forced on you, and nothing else. Most freed slaves are Argonians or Khajiit, and wise ones carry papers that prove their freedom. Equipment. The Artisan's Tools you chose, Traveller's Clothes, a pouch and 32 gp; or 50 gp. Connection. The Twin Lamps, the secret network that smuggles slaves to freedom, helped you once. You know one of their signs, and that they're at work on Vvardenfell too."},{"i":"guide-backgrounds-of-tamriel--mages-guild-associate","b":"guide","ci":"guide-backgrounds-of-tamriel","c":"Step Three: Backgrounds of Tamriel","h":"Mages Guild Associate","t":"You've studied at a Guild hall on the mainland or in Cyrodiil, mostly the alchemy, which pays. Equipment. An Apprentice's mortar and pestle, a robe and 24 gp; or 50 gp. Connection. Your mentor wrote you a letter of introduction to the Guild on Vvardenfell, and any Guild hall will let you use its library."},{"i":"guide-backgrounds-of-tamriel--nord-skald","b":"guide","ci":"guide-backgrounds-of-tamriel","c":"Step Three: Backgrounds of Tamriel","h":"Nord Skald","t":"You keep the sagas of your people, and you're making new ones whether anyone asked or not. Equipment. A drum, a book of sagas, Traveller's Clothes and 17 gp; or 50 gp. Connection. Nords everywhere know the old sagas you sing, and any Nord on the island will buy you a mead for a new one."},{"i":"guide-backgrounds-of-tamriel--pilgrim","b":"guide","ci":"guide-backgrounds-of-tamriel","c":"Step Three: Backgrounds of Tamriel","h":"Pilgrim","t":"You've served at Temple shrines on the mainland, and now you're making the pilgrimage you've dreamed of: the Seven Graces, whose shrines are all on Vvardenfell. Equipment. An Herbalism Kit, a Temple holy symbol, a robe, a bedroll, a map of the shrines and 37 gp; or 50 gp. Connection. Temple priests and shrine-keepers will give a pilgrim a meal and a mat for the night, and remember your face."},{"i":"guide-backgrounds-of-tamriel--silt-strider-caravaner","b":"guide","ci":"guide-backgrounds-of-tamriel","c":"Step Three: Backgrounds of Tamriel","h":"Silt Strider Caravaner","t":"You've steered the great silt striders between the towns of mainland Morrowind, and talked your passengers out of their nerves. Equipment. Cartographer's Tools, Traveller's Clothes, a rope, a bedroll and 31 gp; or 50 gp. Connection. Caravaners are a close trade. The strider ports on Vvardenfell will treat you as one of their own, and tell you who's been travelling where."},{"i":"guide-backgrounds-of-tamriel--smuggler","b":"guide","ci":"guide-backgrounds-of-tamriel","c":"Step Three: Backgrounds of Tamriel","h":"Smuggler","t":"You've rowed contraband into coves on the mainland where the Legion doesn't look. Equipment. Navigator's Tools, a hooded lantern for signalling, Traveller's Clothes, a rope and 17 gp; or 50 gp. Connection. You know the signals smugglers use around the Inner Sea, and the Bitter Coast's crews know your old one by reputation."},{"i":"guide-birthsigns-of-tamriel","b":"guide","ci":"guide-birthsigns-of-tamriel","c":"Step Four: Birthsigns of Tamriel","h":"Step Four: Birthsigns of Tamriel","t":"“You do not choose your stars. You only choose whether to listen to them.” — A Mages Guild astrologer, Balmora"},{"i":"guide-birthsigns-of-tamriel--born-under-a-sign","b":"guide","ci":"guide-birthsigns-of-tamriel","c":"Step Four: Birthsigns of Tamriel","h":"Born Under a Sign","t":"Every person in Tamriel is born under one of thirteen constellations, and the sign leaves its mark. In this campaign, your birthsign takes the place of the Origin feat you would normally gain at level 1. The constellations. Three signs are the Guardians: the Warrior, the Mage and the Thief. Each Guardian watches over three charges, and each of the twelve rules one month of the year. The thirteenth, the Serpent, wanders the sky, has no month and answers to no Guardian. Character creation rules Choose one birthsign at level 1. It gives you the benefits listed in its entry. Backgrounds don't give an Origin feat. Take everything else from your background as normal. Your background and birthsign are separate choices; pick any combination. Origin feats aren't gone. You can still take one later, using the Ability Score Improvement feature. Spellcasting ability. When you choose your birthsign, pick Intelligence, Wisdom or Charisma as its spellcasting ability. Birthsign save DC = 8 + your Proficiency Bonus + the modifier of your birthsign's spellcasting ability. Birthsign spells. When a birthsign gives you a spell, it is always prepared. You can cast it once without a spell slot, regaining that use when you finish a long rest. You can also cast it using any spell slots you have. In the setting, nobody chooses their stars. At the table, you do."},{"i":"guide-birthsigns-of-tamriel--at-a-glance","b":"guide","ci":"guide-birthsigns-of-tamriel","c":"Step Four: Birthsigns of Tamriel","h":"At a Glance","t":"The signs are grouped by Guardian. Months are given with their nearest real-world equivalent. Sign · Month · Guardian · In brief. The Warrior · Last Seed (August) · Guardian · Rerolls for attacks, Strength and Constitution. The Mage · Rain's Hand (April) · Guardian · Two cantrips; rerolls for your spells. The Thief · Evening Star (December) · Guardian · Luck points for Advantage or Disadvantage. The Lady · Heartfire (September) · Warrior · Persuasion, extra hit points and faster recovery. The Steed · Mid Year (June) · Warrior · Faster movement, Athletics and quick reactions. The Lord · First Seed (March) · Warrior · Self-healing; weakness to fire. The Apprentice · Sun's Height (July) · Mage · An extra spell slot; weakness to magic. The Atronach · Sun's Dusk (November) · Mage · Extra spell slots and spell absorption; slow recovery. The Ritual · Morning Star (January) · Mage · Healing and turning the undead. The Lover · Sun's Dawn (February) · Thief · A stunning touch and a graceful skill. The Shadow · Second Seed (May) · Thief · Brief invisibility. The Tower · Frostfall (October) · Thief · Opening locks and detecting magic. The Serpent · None · None · Poisonous touches that hurt you too; shrugging off ailments."},{"i":"guide-birthsigns-of-tamriel--the-gu
