· 1 gp · Restore Fatigue · Everywhere. Gravedust · 1 gp · Drain Mind; Cure · Tombs and alchemists. Kwama egg, large · 2 gp · Restore Fatigue; Paralyze · Egg mines. Kwama egg, small · 1 gp · Restore Fatigue · Egg mines. Resin · 10 gp · Restore Health; Resist Disease · Alchemists. Scrib jerky · 5 gp · Restore Fatigue; Burden · Houses and traders. Scuttle · 10 gp · Restore Fatigue; Feather · Houses and traders. Sload soap · 50 gp · Fortify Body; Resistance · Alchemists."},{"i":"items-ingredients--mournhold-and-solstheim","b":"items","ci":"items-ingredients","c":"Ingredients","h":"Mournhold and Solstheim","t":""},{"i":"items-ingredients--mournhold","b":"items","ci":"items-ingredients","c":"Ingredients","h":"Mournhold","t":"Ingredient · Price · Effects · From. Durzog meat · 7 gp · Fortify Body; Drain Magicka · Durzogs. Golden sedge flowers · 1 gp · Fortify Body; Water Breathing · Planters. Horn lily bulb · 1 gp · Poison; Fortify Body · Planters. Lloramor spines · 1 gp · Invisibility; Poison · Planters. Meadow rye · 1 gp · Fortify Speed; Poison · Planters. Nirthfly stalks · 1 gp · Fortify Speed; Burden · Planters. Noble sedge flowers · 1 gp · Poison; Drain Body · Planters. Scrib cabbage · 1 gp · Drain Mind; Poison · Planters. Sweetpulp · 1 gp · Levitate; Restore Health · Planters. Timsa-come-by flowers · 1 gp · Dispel; Drain Magicka · Planters."},{"i":"items-ingredients--solstheim","b":"items","ci":"items-ingredients","c":"Ingredients","h":"Solstheim","t":"Ingredient · Price · Effects · From. Bear pelt · 2 gp · Drain Fatigue; Resist Disease · Bears. Belladonna berries · 5 gp · Resist Magic; Fortify Magicka · Bushes, especially near barrows. Bristleback leather · 2 gp · Drain Body; Frost Damage · Tusked bristlebacks. Grahl eyeball · 15 gp · Night Eye; Fortify Body · Grahls. Gravetar · 5 gp · Resistance; Restore Fatigue · Draugr. Heartwood · 200 gp · Restore Magicka; Fortify Body · Spriggans, now and then. Holly berries · 5 gp · Resistance; Frost Damage · Bushes. Horker tusk · 5 gp · Fortify Magicka; Detect · Horkers. Wolf, snow wolf or snow bear pelt · 2 gp · Fortify Speed; Night Eye · Wolves and snow bears. Wolfsbane petals · 5 gp · Invisibility; Drain Magicka · Hvitkald Peak."},{"i":"items-ingredients--brewing-by-effect","b":"items","ci":"items-ingredients","c":"Ingredients","h":"Brewing by Effect","t":"Any two ingredients in the same row make a potion, or a poison, with that effect: see Brewing Potions in the Player's Guide . No two ingredients share both their effects, so every pair makes exactly one brew. Ingredients are listed cheapest first."},{"i":"items-ingredients--potions","b":"items","ci":"items-ingredients","c":"Ingredients","h":"Potions","t":"Effect · Ingredients. Restore Health · marshmerrow, saltrice, sweetpulp, wickwheat, corkbulb root, resin, corprus weepings, emerald. Restore Fatigue · bread, chokeweed, crab meat, saltrice, small kwama egg, hound meat, large kwama egg, gravetar, scrib jerky, scuttle, hackle-lo leaf, shalk resin. Restore Magicka · comberry, raw adamantium, frost salts, void salts, daedra's heart, heartwood. Fortify Magicka · stoneflower petals, belladonna berries, horker tusk, emerald. Fortify Body · ash yam, golden sedge flowers, horn lily bulb, netch leather, roobrush, stoneflower petals, bonemeal, durzog meat, grahl eyeball, sload soap, dreugh wax, daedra skin, heartwood, vampire dust. Fortify Mind · green lichen, heather, kresh fiber, netch leather, wickwheat, bittergreen petals, bloat, trama root, scrap metal. Fortify Speed · meadow rye, nirthfly stalks, kagouti hide, wolf or snow bear pelt, moon sugar, raw ebony, shalk resin. Fortify Luck · crab meat, kresh fiber, guar hide, corprus weepings. Resistance · black anther, black lichen, fire petal, kwama cuttle, alit hide, gravetar, holly berries, willow anther, scrap metal, raw ebony, raw glass, sload soap, frost salts, fire salts. Resist Magic · fire petal, hound meat, belladonna berries, void salts, diamond, vampire dust. Resist Disease · ash yam, bear pelt, kagouti hide, resin, pearl. Cure · chokeweed, gravedust, green lichen, roobrush, scathecraw, corkbulb root, scamp skin, scrib jelly, willow anther, red lichen, ghoul heart. Cure Blight Disease · scrib jelly, ash salts. Water Breathing · golden sedge flowers, luminous russula, kwama cuttle, scales, hackle-lo leaf, pearl. Water Walking · violet coprinus, ampoule pod, scales. Levitate · sweetpulp, trama root, racer plumes, coda flower. Feather · heather, scuttle, ruby. Night Eye · black anther, wolf or snow bear pelt, grahl eyeball, red lichen, daedra's heart. Invisibility · lloramor spines, bittergreen petals, wolfsbane petals, diamond. Detect · hypha facia, marshmerrow, muck, alit hide, horker tusk, ectoplasm. Dispel · bungler's bane, timsa-come-by flowers, moon sugar."},{"i":"items-ingredients--poisons","b":"items","ci":"items-ingredients","c":"Ingredients","h":"Poisons","t":"Effect · Ingredients. Poison · horn lily bulb, lloramor spines, luminous russula, meadow rye, noble sedge flowers, scrib cabbage, violet coprinus, gold kanet, ectoplasm, coda flower, fire salts, ruby. Frost Damage · bristleback leather, holly berries, raw stalhrim. Paralyze · rat meat, spore pod, ampoule pod, large kwama egg, ghoul heart, daedra skin, raw stalhrim. Drain Fatigue · spore pod, bear pelt, bonemeal, comberry, guar hide. Drain Magicka · rat meat, timsa-come-by flowers, bloat, wolfsbane petals, durzog meat, scamp skin. Drain Body · hypha facia, noble sedge flowers, black lichen, bristleback leather, scathecraw, ash salts. Drain Mind · gravedust, muck, scrib cabbage, racer plumes, raw glass, dreugh wax. Burden · bungler's bane, nirthfly stalks, gold kanet, scrib jerky, raw adamantium."},{"i":"materials-weapon-materials","b":"materials","ci":"materials-weapon-materials","c":"Weapon Materials","h":"Weapon Materials","t":"A material never changes a weapon's damage or properties. The better ones add a bonus to attack and damage rolls, like a +1, +2 or +3 weapon. Material · Bonus · Rarity · Price · Silver · What it does. Chitin · — · Common · Half · — · Half weight. Wears out fast. Iron · — · Common · Half · — · Wears out fast. Includes riekling weapons. Steel · — · Common · As listed · — · The standard: Imperial, Nordic and huntsman weapons. Bonemold · — · Common · ×4 · — · Bows and ammunition only. Silver · — · Common · +100 gp · Yes · Silvered steel: the cheapest way to hurt a ghost. Dreugh · +1 · Uncommon · 500 gp · — · Clubs and staffs only. Dwemer · +1 · Uncommon · 750 gp · — · Salvaged from ruins; trade is restricted. Orcish · +1 · Uncommon · 800 gp · — · Mostly heavy axes and hammers. Nordic silver · +1 · Uncommon · 1,000 gp · Yes · Made on Solstheim. Adamantium · +1 · Uncommon · 1,200 gp · Yes · Hits on objects are Critical Hits; no wear on a 1. Glass · +2 · Rare · 5,000 gp · Yes · Half weight. Ebony · +2 · Rare · 6,000 gp · Yes · Twice the weight. Stalhrim · +2 · Rare · 7,500 gp · Yes · Hits can deal Cold damage instead. Daedric · +3 · Very Rare · 40,000 gp · Yes · Three times the weight. Prices. Common materials change the weapon's listed price. Uncommon and rarer ones cost the same whatever the weapon: a glass dagger costs as much as a glass claymore. Not magical. Detect Magic doesn't find rare materials, but they can still be enchanted. A material's bonus doesn't add to a magic weapon's bonus: use the higher one. Silver. Marked Yes means it counts as silver: ghosts, dwarven spectres and bonelords take no damage from anything else, scamps take half, and silver stops a werewolf regenerating. Magic weapons count too."},{"i":"materials-wear-and-repair-optional-rule","b":"materials","ci":"materials-wear-and-repair-optional-rule","c":"Wear and Repair (Optional Rule)","h":"Wear and Repair (Optional Rule)","t":"Material · Weapon wears on · Armour or shield wears on. Chitin and iron · An attack roll of 1 or 2 · Any Critical Hit against you. Other Common materials · An attack roll of 1 · Any Critical Hit against you. Uncommon, except adamantium · An attack roll of 1 · A Critical Hit on a 20 that beats your AC by 5+. Adamantium · Never from your own rolls · Never (Critical Hits on it become normal hits). Rare and Very Rare · Never from your own rolls · A Critical Hit on a 20 that beats your AC by 5+. Penalties. Each wear is −1: to a weapon's attack and damage rolls, or to the AC armour or a shield grants. On a Critical Hit, you choose whether your armour or your shield takes it. Natural armour doesn't wear. Broken and repaired. Armour and weapons break at −3; a shield breaks when its bonus reaches +0. A smith repairs each point for a quarter of the item's price, or you can do it yourself with an armourer's hammer if you're proficient with Smith's Tools."},{"i":"materials-armour-materials","b":"materials","ci":"materials-armour-materials","c":"Armour Materials","h":"Armour Materials","t":"Each entry is a full suit. Rare materials aren't magical, but they can be enchanted. Cold Weather armour gives Advantage on saving throws against extreme cold."},{"i":"materials-armour-materials--light-armour","b":"materials","ci":"materials-armour-materials","c":"Armour Materials","h":"Light Armour","t":"Add your Dexterity modifier to the AC shown. No Strength requirement, and no Disadvantage on Stealth. Armour · AC · Price · Rarity · Notes. Netch leather [Leather Armor] · 11 + Dex · 10 gp · Common · The everyday armour of Dunmer travellers. Nordic fur · 11 + Dex · 10 gp · Common · Cold Weather. Nordic bearskin · 11 + Dex · 15 gp · Common · Cold Weather. Boiled netch leather · 12 + Dex · 30 gp · Common · Netch leather hardened in boiling oil. Chitin [Studded Leather Armor] · 12 + Dex · 40 gp · Common · The lightest armour on the island. Imperial studded leather [Studded Leather Armor] · 12 + Dex · 45 gp · Common · Imperial issue. Imperial newtscale · 12 + Dex · 60 gp · Common · Fine Imperial scale. Wolf · 12 + Dex · 50 gp · Common · Cold Weather; made on Solstheim. Dark Brotherhood · 13 + Dex · Not sold · Uncommon · Advantage on Stealth checks in Dim Light or Darkness. Glass · 14 + Dex · 5,000 gp · Rare · Green volcanic glass; light and beautiful."},{"i":"materials-armour-materials--medium-armour","b":"materials","ci":"materials-armour-materials","c":"Armour Materials","h":"Medium Armour","t":"Add your Dexterity modifier, to a maximum of +2. No Strength requirement. Armour · AC · Stealth · Price · Rarity · Notes. Bear [Hide Armor] · 12 · — · 15 gp · Common · Cold Weather; made on Solstheim. Nordic ringmail · 13 · Disadv. · 50 gp · Common · Nord mail. Imperial chain [Scale Mail] · 14 · Disadv. · 50 gp · Common · Imperial issue. Bonemold · 14 · Disadv. · 400 gp · Common · Worn by Great House guards. Bonemold, ornate · 14 · Disadv. · 450 gp · Common · The Armun-An and Gah-Julan styles. Imperial dragonscale [Half Plate Armor] · 15 · Disadv. · 750 gp · Common · Imperial scale. Dreugh · 15 · — · 1,000 gp · Uncommon · Sea-monster shell; quiet enough to sneak in. Orcish · 16 · Disadv. · 800 gp · Uncommon · Forged by Orc smiths. Adamantium · 16 · Disadv. · 1,200 gp · Uncommon · Critical Hits against you become normal hits. Indoril · 16 · Disadv. · Not sold · Uncommon · Ordinators attack anyone else seen wearing it. Ice (stalhrim) · 16 · Disadv. · 5,000 gp · Rare · Resistance to Cold damage; Cold Weather. Royal Guard · 16 · Disadv. · Not sold · Rare · Mournhold's Royal Guard."},{"i":"materials-armour-materials--heavy-armour","b":"materials","ci":"materials-armour-materials","c":"Armour Materials","h":"Heavy Armour","t":"No Dexterity bonus. Always Disadvantage on Stealth. If your Strength is below the requirement, your Speed drops by 10 feet. Armour · AC · Strength · Price · Rarity · Notes. Iron [Chain Mail] · 16 · 13 · 75 gp · Common · Cheap and common. Steel [Splint Armor] · 17 · 15 · 200 gp · Common · . Nordic iron · 17 · 15 · 200 gp · Common · Cold Weather. Imperial steel · 17 · 15 · 250 gp · Common · Imperial Legion issue. Nordic trollbone · 17 · 15 · 250 gp · Common · Cold Weather. Imperial Templar [Plate Armor] · 18 · 15 · 1,500 gp · Common · Imperial templar knights. Imperial silver · 18 · 15 · 1,600 gp · Common · Silver-plated steel. Duke's Guard silver · 18 · 15 · Not sold · Common · The Duke's guards in Ebonheart. Dwemer · 18 · 15 · 1,500 gp · Common · Salvaged from ruins; trade is restricted. Ebony · 19 · 15 · 6,000 gp · Rare · Black volcanic glass; near-unbreakable. Nordic mail · 19 · 15 · 6,000 gp · Rare · Cold Weather; made on Solstheim. Daedric · 20 · 17 · 40,000 gp · Very Rare · Ebony bound with a Daedra's spirit. Her Hand's · 20 · 17 · Not sold · Very Rare · Almalexia's Hands, in Mournhold."},{"i":"materials-shields","b":"materials","ci":"materials-shields","c":"Shields","h":"Shields","t":"Shield · AC · Price · Rarity · Notes. Netch leather or chitin [Shield] · +2 · 10 gp · Common · . Iron, steel or Nordic [Shield] · +2 · 15 gp · Common · . Bonemold · +2 · 30 gp · Common · Great House guards carry their house's colours. Dwemer · +2 · 50 gp · Common · Trade is restricted. Orcish tower · +3 · 800 gp · Uncommon · . Dreugh · +3 · 800 gp · Uncommon · . Glass · +3 · 1,000 gp · Uncommon · . Ebony · +3 · 1,200 gp · Uncommon · . Daedric · +3 · 1,500 gp · Uncommon · . Daedric tower · +4 · 6,000 gp · Rare · Taken only from golden saints."},{"i":"materials-whats-made-from-what","b":"materials","ci":"materials-whats-made-from-what","c":"What's Made from What","h":"What's Made from What","t":"Not every weapon comes in every material. Anything else needs a smith willing to try, and the DM's permission. Material · Found as. Chitin · Daggers, shortswords, clubs, war axes, spears, tridents, whips, short bows, arrows and throwing stars. Iron · Most blades, axes, clubs, maces, warhammers, spears, glaives and tridents, plus whips, arrows, bolts and throwing knives. Steel · Almost every weapon. Silver · Daggers, shortswords, longswords, rapiers, claymores, staffs, war axes, spears, glaives, tridents, whips, arrows, bolts, darts and throwing stars. Bonemold · Long bows, arrows and bolts. Dreugh · Clubs and staffs. Dwemer · Shortswords, claymores, maces, warhammers, war axes, battle axes, spears, tridents, glaives, halberds and crossbows. Orcish · Battle axes, warhammers and bolts. Nordic silver · Daggers, shortswords, longswords, claymores, maces, axes and battle axes. Adamantium · Shortswords, claymores, maces, axes, spears, tridents and glaives. Glass · Daggers, longswords, rapiers, claymores, staffs, war axes, glaives, halberds, arrows, throwing knives and throwing stars. Ebony · Shortswords, broadswords, longswords, rapiers, maces, staffs, war axes, spears, tridents, glaives, arrows, darts and throwing stars. Stalhrim · Daggers, longswords, maces and war axes. Daedric · Almost every weapon, including all four Akaviri blades, glaives, tridents, rapiers, long bows, arrows and darts."},{"i":"reckoning-the-calendar","b":"reckoning","ci":"reckoning-the-calendar","c":"The Calendar","h":"The Calendar","t":"Tamriel's months match ours, and its seasons follow the northern hemisphere. Month · Like · Days · Month · Like · Days. Morning Star · January, winter · 31 · Sun's Height · July, summer · 31. Sun's Dawn · February, winter · 28 · Last Seed · August, summer · 31. First Seed · March, spring · 31 · Hearthfire · September, autumn · 30. Rain's Hand · April, spring · 30 · Frostfall · October, autumn · 31. Second Seed · May, spring · 31 · Sun's Dusk · November, autumn · 30. Midyear · June, summer · 30 · Evening Star · December, winter · 31. Weekdays. Sundas, Morndas, Tirdas, Middas, Turdas, Fredas and Loredas, like Sunday to Saturday. No source fixes them for 3E 417, so this tracker starts the year on a Sundas."},{"i":"reckoning-festivals-and-holy-days","b":"reckoning","ci":"reckoning-festivals-and-holy-days","c":"Festivals and Holy Days","h":"Festivals and Holy Days","t":"These holidays are kept across Tamriel, and outlanders have brought them to Vvardenfell. Prices are from Treasures of Morrowind . Date · Festival · What happens. 27 Last Seed · Harvest's End · Taverns pour free drinks, and visitors are welcome to join in.. 3 Hearthfire · Tales and Tallows · The dead are said to walk. The Mages Guild sells magic items at half price.. 13 Frostfall · Witches Festival · Costumes and mockery of ghosts and spirits. The Mages Guild does a brisk trade.. 30 Frostfall · Emperor's Day · Once a great carnival, now largely neglected.. 20 Sun's Dusk · Warriors Festival · Weapons sell at half price, and amateur fighters flock to the towns.. 15 Evening Star · North Winds Prayer · Thanks for the harvest and a mild winter. Temple services are half price.. 25 Evening Star · Saturalia · A Breton festival of gifts, parties and parades.. 30 Evening Star · Old Life Festival · The last day of the year, for remembering the dead. The ale flows.. 1 Morning Star · New Life Festival · The new year. Free ale in the taverns, and new taxes announced.. 15 Morning Star · South Winds Prayer · Prayers for the planting. Temples heal a worthy few for free.. 16 Sun's Dawn · Heart's Day · A day for lovers. Inns give visitors a free room.. 7 First Seed · First Planting · A day of fresh starts. Temples run free clinics.. 28 Rain's Hand · Jester's Day · Pranks everywhere, and the Thieves Guild watches for pickpockets.. 7 Second Seed · Second Planting · As First Planting, and the year's last free clinics.. 16 Midyear · Mid Year Celebration · Temple blessings at half price.. 10 Sun's Height · Merchants Festival · Shops sell at half price, except the Mages Guild.. 20 Sun's Height · Sun's Rest · Every shop closes. Temples and taverns stay open.. The Festival of Forbearance. The Temple and House Indoril keep a festival of several days in honour of Almalexia. No source gives its date, so pick one."},{"i":"reckoning-festivals-and-holy-days--daedric-summoning-days","b":"reckoning","ci":"reckoning-festivals-and-holy-days","c":"Festivals and Holy Days","h":"Daedric Summoning Days","t":"On these days, a Daedric Prince is said to answer those who call, and its shrines and cultists are at their busiest. The dates come from the Iliac Bay, so the Dunmer may keep them differently. Prince · Day · Notes. Azura · 21 First Seed · One of the Dunmer's three Good Daedra. Boethiah · 2 Sun's Dusk · One of the Good Daedra. Mephala · 13 Frostfall · One of the Good Daedra. Also the Witches Festival. Malacath · 8 Frostfall · One of the House of Troubles. Sheogorath · 2 Sun's Dawn · One of the House of Troubles. Mehrunes Dagon · 20 Sun's Dusk · One of the House of Troubles. Also the Warriors Festival. Molag Bal · Unknown · One of the House of Troubles. No date survives, so pick one.."},{"i":"reckoning-festivals-and-holy-days--the-year-ahead","b":"reckoning","ci":"reckoning-festivals-and-holy-days","c":"Festivals and Holy Days","h":"The Year Ahead","t":"The campaign begins on Middas, 16 Last Seed, 3E 417: ten years to the day before the events of Morrowind ."},{"i":"reckoning-weather","b":"reckoning","ci":"reckoning-weather","c":"Weather","h":"Weather","t":"Roll a d20 each Morning for the region the party is in. The weather holds for the day, unless you decide it turns. These tables follow each region's character in the games, not their exact odds. Region · Clear · Cloudy · Fog · Rain · Storm · Ash storm · Blight storm. Ascadian Isles Ebonheart, Vivec, Suran · 1–8 · 9–13 · 14 · 15–18 · 19–20 · — · —. Bitter Coast Seyda Neen, Hla Oad, Gnaar Mok · 1–4 · 5–8 · 9–13 · 14–18 · 19–20 · — · —. West Gash Balmora, Caldera, Gnisis · 1–8 · 9–13 · 14 · 15–17 · 18 · 19–20 · —. Grazelands Vos, Tel Vos · 1–10 · 11–15 · 16 · 17–19 · 20 · — · —. Azura's Coast Sadrith Mora, Tel Branora · 1–5 · 6–10 · 11 · 12–16 · 17–20 · — · —. Sheogorad Dagon Fel · 1–3 · 4–9 · 10–11 · 12–16 · 17–20 · — · —. Molag Amur Molag Mar · 1–6 · 7–10 · — · 11 · — · 12–19 · 20. Ashlands Ald'ruhn, Maar Gan · 1–5 · 6–9 · — · 10 · — · 11–19 · 20. Red Mountain inside the Ghostfence · 1–2 · 3–5 · — · — · — · 6–14 · 15–20."},{"i":"reckoning-weather--what-the-weather-does","b":"reckoning","ci":"reckoning-weather","c":"Weather","h":"What the Weather Does","t":"Weather · Effect. Clear or cloudy · No effect.. Fog · The area is Lightly Obscured.. Rain · The area is Lightly Obscured, and unsheltered torches and campfires go out.. Storm · As rain, and the wind gives Disadvantage on ranged weapon attack rolls and on Wisdom (Perception) checks that rely on hearing. Boats stay in port.. Ash storm · The area is Lightly Obscured, and Heavily Obscured beyond 30 feet. Travel takes twice as long. Each hour a creature spends in it without a cloth over its face, it makes a DC 10 Constitution saving throw, gaining 1 Exhaustion level on a failure.. Blight storm · The area is Heavily Obscured beyond 15 feet, and a blighted beast often comes with it. Travel takes twice as long. Each hour a creature spends in it without shelter, it makes a DC 13 Constitution saving throw, contracting a Blight disease on a failure (see Disease and the Blight in the Player's Guide ).."}]}</script>
<script>
(() => {
  const DATA = JSON.parse(document.getElementById("data").textContent);
  const PAPERS = /*PAPERS*/"<!doctype html>\n<html lang=\"en-GB\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<meta name=\"robots\" content=\"noindex, nofollow\">\n<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}<\/style>\n<title>Outlander's Papers<\/title>\n<meta name=\"claude:viewport-fit-sides\" content=\"cover\">\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Almendra:ital,wght@0,400;0,700;1,400&family=Almendra+SC&family=Cinzel+Decorative:wght@700&family=Fondamento:ital@0;1&display=swap\">\n<style>\n/* Layout: release papers from the Census and Excise Office. Choices on the left, in the guide's order; the finished sheet on the right. */\n:root {\n  --paper: #F4EAD5; --paper-2: #EBDDBF; --paper-3: #FBF5E8;\n  --ink: #2B1B0E; --ink-2: #6A5440; --rule: #D5C19A;\n  --red: #6B1D10; --brown: #5A2E12; --gold: #8C6A2F;\n  --wash: #E5D2AC; --stripe: rgba(140, 106, 47, 0.07); --warn: #9A3412; --ok: #3F6212;\n  --f-display: \"Cinzel Decorative\", \"Almendra\", Georgia, serif;\n  --f-head: \"Almendra\", Georgia, \"Times New Roman\", serif;\n  --f-sc: \"Almendra SC\", \"Almendra\", Georgia, serif;\n  --f-body: \"Fondamento\", Georgia, \"Times New Roman\", serif;\n}\n@media (prefers-color-scheme: dark) { :root:not([data-theme=\"light\"]) {\n  --paper: #17110C; --paper-2: #1F1710; --paper-3: #241B13; --ink: #E9DCC2; --ink-2: #B5A07F; --rule: #4A3826;\n  --red: #E48D72; --brown: #E3C08B; --gold: #C9A25A; --wash: #34261A; --stripe: rgba(201, 162, 90, 0.06); --warn: #F0A27A; --ok: #A3C46B; color-scheme: dark; } }\n:root[data-theme=\"dark\"] {\n  --paper: #17110C; --paper-2: #1F1710; --paper-3: #241B13; --ink: #E9DCC2; --ink-2: #B5A07F; --rule: #4A3826;\n  --red: #E48D72; --brown: #E3C08B; --gold: #C9A25A; --wash: #34261A; --stripe: rgba(201, 162, 90, 0.06); --warn: #F0A27A; --ok: #A3C46B; color-scheme: dark; }\n\nbody { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.5; }\na { color: var(--red); }\n:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 3px; }\nbutton, input, select, textarea { font: inherit; color: inherit; }\n.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }\n\nheader.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--paper-2); border-bottom: 1px solid var(--rule); }\nbody::before { content: \"\"; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--paper-2); }\nheader.bar .in { display: flex; flex-wrap: wrap; gap: 0.5rem 0.8rem; align-items: center; padding-block: 0.55rem; max-width: 92rem; margin: 0 auto; }\n.brand { font-family: var(--f-display); color: var(--red); font-size: 1.15rem; line-height: 1.1; margin-right: auto; text-decoration: none; }\n.brand small { display: block; font-family: var(--f-head); font-style: italic; color: var(--ink-2); font-size: 0.75rem; }\n.bar select { max-width: 12rem; }\n.btn { border: 1px solid var(--gold); background: var(--paper-3); border-radius: 6px; padding: 0.28rem 0.7rem; cursor: pointer; font-family: var(--f-sc); font-size: 0.82rem; color: var(--brown); }\n.btn:hover { background: var(--wash); }\n.btn.primary { background: var(--brown); color: var(--paper); border-color: var(--brown); }\n.btn.danger { color: var(--warn); border-color: var(--warn); }\n.toast { font-family: var(--f-sc); font-size: 0.8rem; color: var(--ok); min-width: 4rem; }\n.bar .tabs { display: none; }\n\nmain.grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 1.5rem; max-width: 92rem; margin: 0 auto; padding-block: 1.2rem 4rem; }\n.col { min-width: 0; }\n.sheetcol { position: sticky; top: 4.5rem; align-self: start; max-height: calc(100vh - 5.5rem); overflow-y: auto; padding-right: 0.2rem; }\n\n/* Builder steps */\ndetails.step { background: var(--paper-3); border: 1px solid var(--rule); border-radius: 10px; margin-bottom: 0.8rem; }\ndetails.step > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 0.7rem; padding: 0.7rem 1rem; }\ndetails.step > summary::-webkit-details-marker { display: none; }\n.sn { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 1.8rem; height: 1.8rem; border-radius: 999px; border: 1.5px solid var(--gold);\n  color: var(--red); font-family: var(--f-sc); font-size: 0.9rem; }\n.step.done .sn { background: var(--gold); color: var(--paper); }\n.st { font-family: var(--f-head); color: var(--brown); font-size: 1.2rem; flex: 1; min-width: 0; }\n.st small { display: block; font-family: var(--f-body); font-size: 0.82rem; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }\n.body { padding: 0 1rem 1rem; display: flex; flex-direction: column; gap: 0.8rem; }\n.guide { font-family: var(--f-sc); font-size: 0.78rem; }\n.row { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 13rem), 1fr)); gap: 0.6rem 0.8rem; }\nlabel.f { display: flex; flex-direction: column; gap: 0.2rem; font-family: var(--f-sc); font-size: 0.8rem; color: var(--gold); letter-spacing: 0.02em; min-width: 0; }\nselect, input[type=text], input[type=number], textarea { background: var(--paper); border: 1px solid var(--rule); border-radius: 6px; padding: 0.35rem 0.5rem;\n  font-family: var(--f-body); font-size: 0.95rem; color: var(--ink); min-width: 0; width: 100%; box-sizing: border-box; letter-spacing: 0; }\ntextarea { min-height: 3.2rem; resize: vertical; }\nselect:focus, input:focus, textarea:focus { border-color: var(--gold); outline: none; box-shadow: 0 0 0 2px color-mix(in srgb, var(--gold) 35%, transparent); }\n.note { font-size: 0.88rem; color: var(--ink-2); }\n.warn { font-size: 0.86rem; color: var(--warn); }\n.card { border-left: 3px solid var(--gold); background: var(--paper); padding: 0.5rem 0.8rem; border-radius: 0 6px 6px 0; font-size: 0.92rem; }\n.card p { margin: 0 0 0.35rem; } .card p:last-child { margin: 0; } .card ul { margin: 0.2rem 0 0.4rem; padding-left: 1.2rem; }\n.card b { color: var(--brown); }\n.traits { display: flex; flex-direction: column; gap: 0.3rem; }\n.traits details { font-size: 0.9rem; } .traits summary { cursor: pointer; font-family: var(--f-head); color: var(--brown); }\n.traits details > div { padding: 0.2rem 0 0.3rem 1rem; } .traits p { margin: 0 0 0.3rem; } .traits ul { margin: 0 0 0.3rem; padding-left: 1.2rem; }\n.seg { display: inline-flex; border: 1px solid var(--gold); border-radius: 8px; overflow: hidden; flex-wrap: wrap; }\n.seg button { border: 0; background: transparent; padding: 0.3rem 0.8rem; cursor: pointer; font-family: var(--f-sc); font-size: 0.85rem; color: var(--brown); }\n.seg button[aria-pressed=\"true\"] { background: var(--brown); color: var(--paper); }\n.scores { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 0.4rem; }\n.sc { border: 1px solid var(--rule); border-radius: 8px; padding: 0.4rem 0.3rem; text-align: center; background: var(--paper); display: flex; flex-direction: column; gap: 0.2rem; align-items: stretch; min-width: 0; }\n.sc .ab { font-family: var(--f-sc); color: var(--red); font-size: 0.85rem; }\n.sc .pb { display: flex; align-items: center; justify-content: center; gap: 0.25rem; }\n.sc .pb button { width: 1.6rem; height: 1.6rem; border-radius: 999px; border: 1px solid var(--gold); background: var(--paper-3); cursor: pointer; color: var(--brown); padding: 0; line-height: 1; }\n.sc .v { font-family: var(--f-head); font-size: 1.3rem; }\n.sc .fin { font-size: 0.78rem; color: var(--ink-2); }\n.rolls { display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: center; }\n.rolls input { width: 3.6rem; text-align: center; }\n.pill { display: inline-block; border: 1px solid var(--rule); border-radius: 999px; padding: 0 0.55rem; font-size: 0.82rem; margin: 0.1rem 0.15rem 0.1rem 0; background: var(--paper); }\n.chk { display: flex; gap: 0.4rem; align-items: center; font-size: 0.92rem; }\n\n/* The sheet */\n.sheet { background: var(--paper-3); border: 1px solid var(--gold); border-radius: 10px; padding: 1rem 1.1rem 1.2rem; }\n.sheet h2 { font-family: var(--f-display); color: var(--red); font-size: 1.45rem; margin: 0; line-height: 1.15; text-wrap: balance; overflow-wrap: anywhere; }\n.sheet .who { font-family: var(--f-head); font-style: italic; color: var(--ink-2); margin: 0.15rem 0 0.7rem; }\n.sheet h3 { font-family: var(--f-sc); color: var(--red); font-weight: 400; font-size: 0.95rem; letter-spacing: 0.04em; border-bottom: 1px solid var(--gold); margin: 1rem 0 0.45rem; padding-bottom: 0.15rem; }\n.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(5.2rem, 1fr)); gap: 0.4rem; }\n.stat { border: 1px solid var(--rule); border-radius: 8px; text-align: center; padding: 0.35rem 0.2rem; background: var(--paper); }\n.stat b { display: block; font-family: var(--f-head); font-size: 1.35rem; color: var(--ink); font-weight: 400; line-height: 1.1; font-variant-numeric: tabular-nums; }\n.stat span { font-family: var(--f-sc); font-size: 0.7rem; color: var(--gold); letter-spacing: 0.03em; }\n.abil { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 0.35rem; }\n.ab6 { border: 1px solid var(--rule); border-radius: 8px; text-align: center; padding: 0.3rem 0.1rem; background: var(--paper); }\n.ab6 .n { font-family: var(--f-sc); color: var(--red); font-size: 0.75rem; }\n.ab6 .m { font-family: var(--f-head); font-size: 1.35rem; line-height: 1.05; }\n.ab6 .s { font-size: 0.78rem; color: var(--ink-2); }\n.ab6 .sv { font-size: 0.72rem; color: var(--ink-2); border-top: 1px dotted var(--rule); margin-top: 0.2rem; padding-top: 0.1rem; }\n.ab6 .sv.p { color: var(--red); }\n.two { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); gap: 1rem; }\n.skills { list-style: none; margin: 0; padding: 0; font-size: 0.88rem; columns: 1; }\n.skills li { display: flex; gap: 0.45rem; align-items: baseline; padding: 0.05rem 0; border-bottom: 1px dotted var(--rule); }\n.skills .dot { width: 0.6rem; height: 0.6rem; border-radius: 999px; border: 1px solid var(--gold); flex: none; transform: translateY(0.05rem); }\n.skills .dot.p { background: var(--gold); } .skills .dot.e { background: var(--red); border-color: var(--red); }\n.skills .b { font-variant-numeric: tabular-nums; min-width: 2rem; text-align: right; font-family: var(--f-head); }\n.skills .a { font-family: var(--f-sc); font-size: 0.7rem; color: var(--ink-2); margin-left: auto; }\n.kv { font-size: 0.9rem; margin: 0 0 0.35rem; } .kv b { font-family: var(--f-sc); font-weight: 400; color: var(--gold); font-size: 0.78rem; letter-spacing: 0.03em; margin-right: 0.3rem; }\ntable.atk { width: 100%; border-collapse: collapse; font-size: 0.88rem; }\ntable.atk th { font-family: var(--f-sc); font-weight: 400; color: var(--brown); text-align: left; background: var(--wash); padding: 0.25rem 0.4rem; }\ntable.atk td { padding: 0.25rem 0.4rem; border-top: 1px solid var(--rule); vertical-align: top; font-variant-numeric: tabular-nums; }\n.feat { font-size: 0.88rem; margin: 0 0 0.3rem; } .feat b { font-family: var(--f-head); color: var(--brown); font-weight: 400; }\n.sheet .src { font-family: var(--f-sc); font-size: 0.68rem; color: var(--ink-2); }\n\n/* Sheet layout follows the 2024 character sheet: who you are and how tough you are across the top, abilities with their\n   saves and skills on the left, fighting gear and features on the right; spells and story on page two. */\n.sheet { container-type: inline-size; padding: 0.8rem; }\n.cs-pg { display: grid; gap: 0.55rem; }\n.cs-p1 { grid-template-areas: \"who\" \"tough\" \"left\" \"right\"; }\n.cs-p2 { grid-template-areas: \"spells\" \"beneath\"; margin-top: 0.9rem; padding-top: 0.7rem; border-top: 2px dashed var(--rule); }\n@container (min-width: 600px) {\n  .cs-p1 { grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); grid-template-areas: \"who tough\" \"left right\"; }\n  .cs-p2 { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); grid-template-areas: \"spells beneath\"; }\n  .cs-feat2 { columns: 2; column-gap: 1rem; }\n}\n.cs-who { grid-area: who; } .cs-tough { grid-area: tough; } .cs-left { grid-area: left; } .cs-right { grid-area: right; }\n.cs-spells { grid-area: spells; } .cs-beneath { grid-area: beneath; }\n.cs-left, .cs-right, .cs-spells, .cs-beneath { display: flex; flex-direction: column; gap: 0.55rem; min-width: 0; }\n.cs-box { border: 1px solid var(--rule); border-radius: 8px; background: var(--paper); padding: 0.4rem 0.55rem 0.5rem; min-width: 0; }\n.cs-h { display: block; font-family: var(--f-sc); color: var(--red); font-size: 0.74rem; letter-spacing: 0.05em; text-align: center; border-bottom: 1px solid var(--rule); margin: -0.05rem -0.2rem 0.35rem; padding-bottom: 0.15rem; }\n.cs-l { display: block; font-family: var(--f-sc); font-size: 0.62rem; color: var(--gold); letter-spacing: 0.04em; line-height: 1.2; }\n.cs-v { font-family: var(--f-head); font-size: 0.95rem; color: var(--ink); min-height: 1.2em; overflow-wrap: anywhere; }\n.cs-who h2 { margin-bottom: 0.1rem; }\n.cs-idgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.3rem 0.5rem; margin-top: 0.35rem; }\n.cs-idgrid > div { border-bottom: 1px solid var(--rule); padding-bottom: 0.1rem; }\n/* armour class on the left; hit points across the top; hit dice and death saves beneath */\n.cs-tough { display: grid; grid-template-columns: 4.8rem minmax(0, 1fr) minmax(0, 1fr); grid-template-areas: \"ac hp hp\" \"ac hd ds\"; gap: 0.4rem; align-items: stretch; }\n.cs-tough .cs-ac { grid-area: ac; ont-size: 0.6rem; letter-spacing: 0.08em; color: var(--ink-2); min-height: 0.8rem; }\n.cs-slots .off { opacity: 0.4; }\n.cs-lines { min-height: 3.4rem; background: repeating-linear-gradient(to bottom, transparent 0 1.25rem, var(--rule) 1.25rem calc(1.25rem + 1px)); }\n.cs-meter { height: 0.45rem; border: 1px solid var(--rule); border-radius: 999px; overflow: hidden; margin: 0.1rem 0 0.45rem; background: var(--paper-3); }\n.cs-meter span { display: block; height: 100%; background: var(--gold); }\n.cs-meter.over span { background: var(--warn); }\nul.carry { list-style: none; margin: 0.4rem 0 0; padding: 0; font-size: 0.86rem; }\nul.carry li { display: flex; justify-content: space-between; gap: 0.6rem; border-bottom: 1px dotted var(--rule); padding: 0.05rem 0; }\n.warnc { color: var(--warn); }\n.cs-coins { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0.25rem; text-align: center; }\n.cs-coins div { border: 1px solid var(--rule); border-radius: 6px; }\n.cs-pagehead { font-family: var(--f-sc); font-size: 0.7rem; color: var(--ink-2); letter-spacing: 0.06em; text-align: right; margin: 0 0 -0.2rem; }\n.empty { color: var(--ink-2); font-style: italic; font-size: 0.9rem; }\ndialog { border: 1px solid var(--gold); border-radius: 10px; background: var(--paper-3); color: var(--ink); max-width: min(34rem, 92vw); }\ndialog::backdrop { background: rgba(20, 12, 6, 0.5); }\ndialog textarea { min-height: 8rem; font-family: ui-monospace, monospace; font-size: 0.8rem; }\n.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }\n\n@media (max-width: 860px) {\n  main.grid { grid-template-columns: minmax(0, 1fr); }\n  .sheetcol { position: static; max-height: none; overflow: visible; }\n  .bar .tabs { display: inline-flex; }\n  main.grid[data-tab=\"build\"] .sheetcol, main.grid[data-tab=\"sheet\"] .buildcol { display: none; }\n}\n/* two columns, but a narrow sheet (also inside the compendium on smaller laptops) */\n@media (min-width: 861px) and (max-width: 1020px) {\n  .abil { grid-template-columns: repeat(3, minmax(0, 1fr)); }\n  .two { grid-template-columns: minmax(0, 1fr); }\n}\n@media (max-width: 560px) {\n  .scores, .abil { grid-template-columns: repeat(3, minmax(0, 1fr)); }\n  .two { grid-template-columns: minmax(0, 1fr); }\n  .brand { font-size: 1rem; }\n  header.bar { position: static; }\n  .brand small { display: none; }\n}\n@media print {\n  header.bar, .buildcol, body::before { display: none !important; }\n  main.grid { display: block; padding: 0; }\n  .sheetcol { position: static; max-height: none; overflow: visible; display: block !important; }  /* paper is narrower than the two-column breakpoint, so the Build/Sheet tab rule would hide it */\n  .sheet { border: 0; padding: 0; background: none; }\n  .cs-p2 { break-before: page; border-top: 0; margin-top: 0; }\n  .cs-box, .ab6 { break-inside: avoid; }\n  body { background: #fff; color: #000; }\n}\n<\/style>\n\n\n<\/head>\n<body>\n<header class=\"bar\"><div class=\"in wrap\">\n  <a class=\"brand\" href=\"#\">Outlander's Papers<small>Character builder for the Vvardenfell campaign · 3E 417<\/small><\/a>\n  <label class=\"sr\" for=\"who\">Character<\/label>\n  <select id=\"who\"><\/select>\n  <button class=\"btn\" type=\"button\" id=\"newBtn\">New<\/button>\n  <button class=\"btn primary\" type=\"button\" id=\"lvlBtn\">Level up<\/button>\n  <button class=\"btn\" type=\"button\" id=\"copyBtn\">Copy sheet<\/button>\n  <button class=\"btn\" type=\"button\" id=\"codeBtn\">Save code<\/button>\n  <button class=\"btn\" type=\"button\" id=\"loadBtn\">Load code<\/button>\n  <button class=\"btn\" type=\"button\" id=\"printBtn\" hidden>Print<\/button>\n  <button class=\"btn danger\" type=\"button\" id=\"delBtn\">Delete<\/button>\n  <span class=\"toast\" id=\"toast\" role=\"status\"><\/span>\n  <div class=\"tabs seg\" role=\"tablist\"><button type=\"button\" data-tab=\"build\" aria-pressed=\"true\">Build<\/button><button type=\"button\" data-tab=\"sheet\" aria-pressed=\"false\">Sheet<\/button><\/div>\n<\/div><\/header>\n\n<main class=\"grid wrap\" id=\"grid\" data-tab=\"build\">\n  <div class=\"col buildcol\" id=\"build\"><\/div>\n  <div class=\"col sheetcol\"><div class=\"sheet\" id=\"sheet\"><\/div><\/div>\n<\/main>\n\n<dialog id=\"dlg\"><form method=\"dialog\" id=\"dlgForm\">\n  <p id=\"dlgText\" style=\"margin-top:0\"><\/p>\n  <textarea id=\"dlgArea\" aria-label=\"Save code\"><\/textarea>\n  <p style=\"display:flex;gap:.5rem;justify-content:flex-end;margin-bottom:0\"><button class=\"btn\" value=\"cancel\" type=\"submit\">Close<\/button><button class=\"btn primary\" id=\"dlgOk\" value=\"ok\" type=\"submit\">Load<\/button><\/p>\n<\/form><\/dialog>\n\n<script type=\"application/json\" id=\"data\">{\n\"skills\": [\n{\n\"name\": \"Acrobatics\",\n\"ab\": \"Dex\"\n},\n{\n\"name\": \"Animal Handling\",\n\"ab\": \"Wis\"\n},\n{\n\"name\": \"Arcana\",\n\"ab\": \"Int\"\n},\n{\n\"name\": \"Athletics\",\n\"ab\": \"Str\"\n},\n{\n\"name\": \"Deception\",\n\"ab\": \"Cha\"\n},\n{\n\"name\": \"History\",\n\"ab\": \"Int\"\n},\n{\n\"name\": \"Insight\",\n\"ab\": \"Wis\"\n},\n{\n\"name\": \"Intimidation\",\n\"ab\": \"Cha\"\n},\n{\n\"name\": \"Investigation\",\n\"ab\": \"Int\"\n},\n{\n\"name\": \"Medicine\",\n\"ab\": \"Wis\"\n},\n{\n\"name\": \"Nature\",\n\"ab\": \"Int\"\n},\n{\n\"name\": \"Perception\",\n\"ab\": \"Wis\"\n},\n{\n\"name\": \"Performance\",\n\"ab\": \"Cha\"\n},\n{\n\"name\": \"Persuasion\",\n\"ab\": \"Cha\"\n},\n{\n\"name\": \"Religion\",\n\"ab\": \"Int\"\n},\n{\n\"name\": \"Sleight of Hand\",\n\"ab\": \"Dex\"\n},\n{\n\"name\": \"Stealth\",\n\"ab\": \"Dex\"\n},\n{\n\"name\": \"Survival\",\n\"ab\": \"Wis\"\n}\n],\n\"races\": [\n{\n\"name\": \"Altmer (High Elves)\",\n\"intro\": \"The Altmer believe they are the most civilised people in Tamriel, and they are happy to explain why.\",\n\"standing\": \"Respected as mages, resented as snobs\",\n\"homeland\": \"Summerset Isles\",\n\"sizeText\": \"Medium (about 5½–6½ feet tall)\",\n\"traits\": [\n{\n\"name\": \"Altmeri Spellcraft\",\n\"text\": \"<p>You know the <i>Prestidigitation<\\/i> cantrip. Whenever you finish a long rest, you can swap it for another Wizard cantrip. You also learn one level one spell from the following: <i>Shield<\\/i>, <i>Find Familiar<\\/i>, <i>Magic Missile<\\/i>, <i>Colour Spray<\\/i> or <i>Cure Wounds<\\/i>. You learn <i>Detect Magic<\\/i> at level 3 and <i>Misty Step<\\/i> at level 5.<\\/p>\"\n},\n{\n\"name\": \"Darkvision\",\n\"text\": \"<p>You have Darkvision with a range of 60 feet.<\\/p>\"\n},\n{\n\"name\": \"Highborn\",\n\"text\": \"<p>Once per long rest, when you finish a short rest, choose one:<\\/p><ul><li>You regain one expended spell slot. The slot's level can be no higher than half your Proficiency Bonus, rounded up.<\\/li><li>You regain the use of one spell from Altmeri Spellcraft.<\\/li><\\/ul>\"\n},\n{\n\"name\": \"Keen Senses\",\n\"text\": \"<p>You have proficiency in your choice of Insight, Perception or Survival.<\\/p>\"\n},\n{\n\"name\": \"Trance\",\n\"text\": \"<p>You don't need to sleep, and magic can't put you to sleep. You can finish a long rest in 4 hours of meditation, staying conscious throughout.<\\/p>\"\n}\n],\n\"id\": \"altmer\",\n\"short\": \"Altmer\",\n\"speed\": 30,\n\"darkvision\": 60,\n\"spellAbility\": true,\n\"skills\": {\n\"choose\": [\n{\n\"n\": 1,\n\"from\": [\n\"Insight\",\n\"Perception\",\n\"Survival\"\n],\n\"label\": \"Keen Senses\"\n}\n]\n},\n\"spells\": {\n\"cantrips\": [\n\"Prestidigitation\"\n],\n\"choose\": [\n{\n\"n\": 1,\n\"level\": 1,\n\"from\": [\n\"Shield\",\n\"Find Familiar\",\n\"Magic Missile\",\n\"Colour Spray\",\n\"Cure Wounds\"\n],\n\"label\": \"Altmeri Spellcraft\"\n}\n],\n\"later\": [\n[\n\"Detect Magic\",\n3\n],\n[\n\"Misty Step\",\n5\n]\n]\n}\n},\n{\n\"name\": \"Argonians\",\n\"intro\": \"Argonians are patient, unreadable, and very good at outlasting the people who underestimate them.\",\n\"standing\": \"Often enslaved; slavery is legal here\",\n\"homeland\": \"Black Marsh\",\n\"sizeText\": \"Medium (about 5–6 feet tall)\",\n\"traits\": [\n{\n\"name\": \"Amphibious\",\n\"text\": \"<p>You can breathe both air and water.<\\/p>\"\n},\n{\n\"name\": \"Bite\",\n\"text\": \"<p>Your fanged jaws are a natural weapon you can use for Unarmed Strikes. A hit deals Piercing damage equal to 1d6 plus your Strength modifier, instead of the normal Bludgeoning damage.<\\/p>\"\n},\n{\n\"name\": \"Hist Resilience\",\n\"text\": \"<p>You have Resistance to Poison damage. You have Advantage on saving throws to avoid or end the Poisoned condition, and on saving throws against disease.<\\/p>\"\n},\n{\n\"name\": \"Marsh Instincts\",\n\"text\": \"<p>You have proficiency in two of these skills: Animal Handling, Medicine, Nature, Perception, Stealth or Survival.<\\/p>\"\n},\n{\n\"name\": \"Scaled Hide\",\n\"text\": \"<p>While you aren't wearing armor, your base Armor Class is 13 plus your Dexterity modifier. You can use this instead of worn armour if it gives you a higher AC. A Shield works as normal.<\\/p>\"\n}\n],\n\"id\": \"argonian\",\n\"short\": \"Argonian\",\n\"speed\": 30,\n\"swim\": 30,\n\"resist\": [\n\"Poison\"\n],\n\"adv\": [\n\"saves against the Poisoned condition and disease\"\n],\n\"natArmor\": 13,\n\"unarmed\": [\n\"1d6\",\n\"Piercing\",\n\"Bite\"\n],\n\"skills\": {\n\"choose\": [\n{\n\"n\": 2,\n\"from\": [\n\"Animal Handling\",\n\"Medicine\",\n\"Nature\",\n\"Perception\",\n\"Stealth\",\n\"Survival\"\n],\n\"label\": \"Marsh Instincts\"\n}\n]\n}\n},\n{\n\"name\": \"Bosmer (Wood Elves)\",\n\"intro\": \"The Bosmer are cheerful, quick and hard to pin down, bound by a pact that forbids them to harm a single leaf.\",\n\"standing\": \"Tolerated, and watched in markets\",\n\"homeland\": \"Valenwood\",\n\"sizeText\": \"Medium (about 4½–5½ feet tall)\",\n\"traits\": [\n{\n\"name\": \"Beast Tongue\",\n\"text\": \"<p>At level 3, you learn <i>Speak with Animals<\\/i>.<\\/p>\"\n},\n{\n\"name\": \"Bosmer Archery\",\n\"text\": \"<p>You have proficiency with Longbows and Shortbows.<\\/p>\"\n},\n{\n\"name\": \"Darkvision\",\n\"text\": \"<p>You have Darkvision with a range of 60 feet.<\\/p>\"\n},\n{\n\"name\": \"Fey Ancestry\",\n\"text\": \"<p>You have Advantage on saving throws to avoid or end the Charmed condition.<\\/p>\"\n},\n{\n\"name\": \"Keen Senses\",\n\"text\": \"<p>You have proficiency in your choice of Insight, Perception or Survival.<\\/p>\"\n},\n{\n\"name\": \"Trance\",\n\"text\": \"<p>You don't need to sleep, and magic can't put you to sleep. You can finish a long rest in 4 hours of meditation, staying conscious throughout.<\\/p>\"\n},\n{\n\"name\": \"Woodland Magic\",\n\"text\": \"<p>You know the <i>Druidcraft<\\/i> cantrip. At level 5, you learn <i>Pass without Trace<\\/i>.<\\/p>\"\n}\n],\n\"id\": \"bosmer\",\n\"short\": \"Bosmer\",\n\"speed\": 35,\n\"darkvision\": 60,\n\"spellAbility\": true,\n\"adv\": [\n\"saves against the Charmed condition\"\n],\n\"weapons\": [\n\"Long bow\",\n\"Short bow\"\n],\n\"skills\": {\n\"choose\": [\n{\n\"n\": 1,\n\"from\": [\n\"Insight\",\n\"Perception\",\n\"Survival\"\n],\n\"label\": \"Keen Senses\"\n}\n]\n},\n\"spells\": {\n\"cantrips\": [\n\"Druidcraft\"\n],\n\"later\": [\n[\n\"Speak with Animals\",\n3\n],\n[\n\"Pass without Trace\",\n5\n]\n]\n}\n},\n{\n\"name\": \"Bretons\",\n\"intro\": \"Bretons are Men with a little elf in them, and a lot of politics.\",\n\"standing\": \"Common in the guilds; mildly trusted\",\n\"homeland\": \"High Rock\",\n\"sizeText\": \"Medium (about 5–6 feet tall)\",\n\"traits\": [\n{\n\"name\": \"Darkvision\",\n\"text\": \"<p>You have Darkvision with a range of 60 feet.<\\/p>\"\n},\n{\n\"name\": \"Dragonskin\",\n\"text\": \"<p>When you take damage from a spell, you can take a Reaction to halve that damage, absorbing some of the spell's energy. You also regain one expended level 1 spell slot, if you have one. Once you use this trait, you can't do so again until you finish a long rest.<\\/p>\"\n},\n{\n\"name\": \"Higher Education\",\n\"text\": \"<p>You have proficiency in two skills of your choice.<\\/p>\"\n},\n{\n\"name\": \"Resist Magicka\",\n\"text\": \"<p>You have Advantage on saving throws against spells and cantrips that deal damage.<\\/p>\"\n}\n],\n\"id\": \"breton\",\n\"short\": \"Breton\",\n\"speed\": 30,\n\"darkvision\": 60,\n\"adv\": [\n\"saves against spells and cantrips that deal damage\"\n],\n\"skills\": {\n\"choose\": [\n{\n\"n\": 2,\n\"from\": [\n\"Acrobatics\",\n\"Animal Handling\",\n\"Arcana\",\n\"Athletics\",\n\"Deception\",\n\"History\",\n\"Insight\",\n\"Intimidation\",\n\"Investigation\",\n\"Medicine\",\n\"Nature\",\n\"Perception\",\n\"Performance\",\n\"Persuasion\",\n\"Religion\",\n\"Sleight of Hand\",\n\"Stealth\",\n\"Survival\"\n],\n\"label\": \"Higher Education\"\n}\n]\n}\n},\n{\n\"name\": \"Dunmer (Dark Elves)\",\n\"intro\": \"The Dunmer are proud, insular and cursed, and this is their island.\",\n\"standing\": \"Home turf, unless you're an Ashlander\",\n\"homeland\": \"Morrowind\",\n\"sizeText\": \"Medium (about 5–6 feet tall)\",\n\"traits\": [\n{\n\"name\": \"Ancestor Guardian\",\n\"text\": \"<p>At level 5, you learn <i>Sanctuary<\\/i>. When you cast it without a spell slot using this trait, you must target yourself. The ward appears as the spirit of an ancestor.<\\/p>\"\n},\n{\n\"name\": \"Ancestral Teachings\",\n\"text\": \"<p>You have proficiency in your choice of Arcana, Athletics, Persuasion, Religion or Survival.<\\/p>\"\n},\n{\n\"name\": \"Ashen Blood\",\n\"text\": \"<p>You have Resistance to Fire damage. You know the <i>Fire Bolt<\\/i> cantrip, and at level 3 you learn <i>Hellish Rebuke<\\/i>.<\\/p>\"\n},\n{\n\"name\": \"Ashen Presence\",\n\"text\": \"<p>You know the <i>Thaumaturgy<\\/i> cantrip.<\\/p>\"\n},\n{\n\"name\": \"Darkvision\",\n\"text\": \"<p>You have Darkvision with a range of 60 feet.<\\/p>\"\n},\n{\n\"name\": \"Dunmer Versatility\",\n\"text\": \"<p>You have proficiency with shortswords, daggers and longbows.<\\/p>\"\n}\n],\n\"id\": \"dunmer\",\n\"short\": \"Dunmer\",\n\"speed\": 30,\n\"darkvision\": 60,\n\"spellAbility\": true,\n\"resist\": [\n\"Fire\"\n],\n\"weapons\": [\n\"Shortsword\",\n\"Dagger\",\n\"Long bow\"\n],\n\"skills\": {\n\"choose\": [\n{\n\"n\": 1,\n\"from\": [\n\"Arcana\",\n\"Athletics\",\n\"Persuasion\",\n\"Religion\",\n\"Survival\"\n],\n\"label\": \"Ancestral Teachings\"\n}\n]\n},\n\"spells\": {\n\"cantrips\": [\n\"Fire Bolt\",\n\"Thaumaturgy\"\n],\n\"later\": [\n[\n\"Hellish Rebuke\",\n3\n],\n[\n\"Sanctuary\",\n5\n]\n]\n}\n},\n{\n\"name\": \"Imperials\",\n\"intro\": \"Imperials run the Empire, and they would like you to fill out the correct form about it.\",\n\"standing\": \"The occupiers, addressed politely\",\n\"homeland\": \"Cyrodiil\",\n\"sizeText\": \"Medium (about 5–6 feet tall)\",\n\"traits\": [\n{\n\"name\": \"Legion Discipline\",\n\"text\": \"<p>You have Advantage on saving throws to avoid or end the Frightened condition.<\\/p>\"\n},\n{\n\"name\": \"Legion Training\",\n\"text\": \"<p>You have proficiency with shields, broadswords and spears.<\\/p>\"\n},\n{\n\"name\": \"Shield Wall\",\n\"text\": \"<p>When a creature you can see hits you, or an ally within 5 feet of you, with an attack while you are holding a shield, you can take a Reaction to add your Proficiency Bonus to the target's AC against that attack, potentially causing a miss. You can use this trait a number of times equal to your Proficiency Bonus, and you regain all expended uses when you finish a long rest.<\\/p>\"\n},\n{\n\"name\": \"Voice of the Emperor\",\n\"text\": \"<p>You have proficiency in Persuasion.<\\/p>\"\n}\n],\n\"id\": \"imperial\",\n\"short\": \"Imperial\",\n\"speed\": 30,\n\"adv\": [\n\"saves against the Frightened condition\"\n],\n\"armor\": [\n\"Shields\"\n],\n\"weapons\": [\n\"Broadsword\",\n\"Spear\"\n],\n\"skills\": {\n\"fixed\": [\n\"Persuasion\"\n]\n}\n},\n{\n\"name\": \"Khajiit\",\n\"intro\": \"Khajiit are agile, sharp-witted and ruled by the moons. They are also blamed for most of the skooma on Vvardenfell, which is only partly fair.\",\n\"standing\": \"Often enslaved; suspected of skooma trading\",\n\"homeland\": \"Elsweyr\",\n\"sizeText\": \"Medium (about 5–6 feet tall)\",\n\"traits\": [\n{\n\"name\": \"Claws\",\n\"text\": \"<p>Your claws are natural weapons you can use for Unarmed Strikes. A hit deals Slashing damage equal to 1d6 plus your Strength modifier, instead of the normal Bludgeoning damage.<\\/p>\"\n},\n{\n\"name\": \"Eye of Night\",\n\"text\": \"<p>You have Darkvision with a range of 120 feet.<\\/p>\"\n},\n{\n\"name\": \"Feline Agility\",\n\"text\": \"<p>When you move on your turn in combat, you can double your Speed until the end of that turn. Once you do, you can't do so again until you spend one of your turns moving 0 feet.<\\/p>\"\n},\n{\n\"name\": \"Feline Talent\",\n\"text\": \"<p>You have proficiency in Perception and Stealth.<\\/p>\"\n}\n],\n\"id\": \"khajiit\",\n\"short\": \"Khajiit\",\n\"speed\": 30,\n\"climb\": 30,\n\"darkvision\": 120,\n\"unarmed\": [\n\"1d6\",\n\"Slashing\",\n\"Claws\"\n],\n\"skills\": {\n\"fixed\": [\n\"Perception\",\n\"Stealth\"\n]\n}\n},\n{\n\"name\": \"Nords\",\n\"intro\": \"Nords are tall, tough, loud and honest, often more honest than the situation needs.\",\n\"standing\": \"Old enemies, still remembered\",\n\"homeland\": \"Skyrim\",\n\"sizeText\": \"Medium (about 6–7 feet tall)\",\n\"traits\": [\n{\n\"name\": \"Battle Cry\",\n\"text\": \"<p>When you take the Attack action, you can replace one of your attacks with a wordless roar. Each creature of your choice within 30 feet of you that can hear you must make a Wisdom saving throw (DC 8 + your Constitution modifier + your Proficiency Bonus). On a failure, a creature has the Frightened condition for 1 minute. It repeats the save at the end of each of its turns, ending the effect on itself on a success. Once you use this trait, you can't do so again until you finish a long rest.<\\/p>\"\n},\n{\n\"name\": \"Imposing\",\n\"text\": \"<p>You gain Proficiency in Intimidation.<\\/p>\"\n},\n{\n\"name\": \"Nord Hardiness\",\n\"text\": \"<p>You have Resistance to Cold and Lightning damage.<\\/p>\"\n},\n{\n\"name\": \"Savage Attacks\",\n\"text\": \"<p>When you score a Critical Hit with a melee weapon, roll one of the weapon's damage dice one more time and add it to the Critical Hit's extra damage.<\\/p>\"\n}\n],\n\"id\": \"nord\",\n\"short\": \"Nord\",\n\"speed\": 30,\n\"resist\": [\n\"Cold\",\n\"Lightning\"\n],\n\"skills\": {\n\"fixed\": [\n\"Intimidation\"\n]\n}\n},\n{\n\"name\": \"Orsimer (Orcs)\",\n\"intro\": \"Orcs are Mer who were cast out, and they have built a culture around never being cast out again.\",\n\"standing\": \"Hired as mercenaries, rarely trusted further\",\n\"homeland\": \"Orsinium\",\n\"sizeText\": \"Medium (about 6–7 feet tall)\",\n\"traits\": [\n{\n\"name\": \"Berserk\",\n\"text\": \"<p>As a Bonus Action, you fly into a berserk rage for 1 minute. While it lasts, you gain the following effects:<\\/p><ul><li>You gain Temporary Hit Points equal to your level plus your Proficiency Bonus.<\\/li><li>You have Advantage on attack rolls with melee weapons and Unarmed Strikes, and those attacks deal extra damage equal to your Proficiency Bonus.<\\/li><li>Attack rolls against you have Advantage, and you have Disadvantage on Dexterity saving throws.<\\/li><\\/ul><p>Once you use this trait, you can't do so again until you finish a long rest.<\\/p>\"\n},\n{\n\"name\": \"Darkvision\",\n\"text\": \"<p>You have Darkvision with a range of 60 feet.<\\/p>\"\n},\n{\n\"name\": \"Imposing\",\n\"text\": \"<p>You gain Proficiency in Intimidation.<\\/p>\"\n},\n{\n\"name\": \"Orcish Smithing\",\n\"text\": \"<p>You have proficiency with Smith's Tools.<\\/p>\"\n},\n{\n\"name\": \"Relentless Endurance\",\n\"text\": \"<p>When you are reduced to 0 Hit Points but not killed outright, you can drop to 1 Hit Point instead. Once you use this trait, you can't do so again until you finish a long rest.<\\/p>\"\n}\n],\n\"id\": \"orc\",\n\"short\": \"Orc\",\n\"speed\": 30,\n\"darkvision\": 60,\n\"tools\": [\n\"Smith's Tools\"\n],\n\"skills\": {\n\"fixed\": [\n\"Intimidation\"\n]\n}\n},\n{\n\"name\": \"Redguards\",\n\"intro\": \"Redguards are the finest natural warriors in Tamriel, and they know it.\",\n\"standing\": \"Respected as warriors; few close friends\",\n\"homeland\": \"Hammerfell\",\n\"sizeText\": \"Medium (about 5½–6½ feet tall)\",\n\"traits\": [\n{\n\"name\": \"Adrenaline Rush\",\n\"text\": \"<p>As a bonus action, you push your body past its limits. For 1 minute your Speed increases by 10 feet, you have Advantage on Strength and Dexterity checks and saving throws, and you gain Temporary Hit Points equal to your level. Once you use this trait, you can't do so again until you finish a long rest.<\\/p>\"\n},\n{\n\"name\": \"Redguard Resilience\",\n\"text\": \"<p>You have Resistance to Poison damage. You have Advantage on saving throws to avoid or end the Poisoned condition, and on saving throws against disease.<\\/p>\"\n},\n{\n\"name\": \"Way of the Sword\",\n\"text\": \"<p>You have proficiency with broadswords, claymores, longswords, rapiers, sabers, and shortswords. You can also use the mastery property of one of these sword types, as if you had the Weapon Mastery feature; if you already have the Weapon Mastery feature, it's an extra weapon you've mastered. Whenever you finish a long rest, you can change which sword you've chosen.<\\/p>\"\n}\n],\n\"id\": \"redguard\",\n\"short\": \"Redguard\",\n\"speed\": 30,\n\"resist\": [\n\"Poison\"\n],\n\"adv\": [\n\"saves against the Poisoned condition and disease\"\n],\n\"weapons\": [\n\"Broadsword\",\n\"Claymore\",\n\"Longsword\",\n\"Rapier\",\n\"Saber\",\n\"Shortsword\"\n],\n\"swordMastery\": [\n\"Broadsword\",\n\"Claymore\",\n\"Longsword\",\n\"Rapier\",\n\"Saber\",\n\"Shortsword\"\n]\n}\n],\n\"classes\": [\n{\n\"id\": \"barbarian\",\n\"name\": \"Barbarian\",\n\"hitDie\": 12,\n\"primary\": \"Strength\",\n\"saves\": [\n\"Str\",\n\"Con\"\n],\n\"skillChoices\": {\n\"n\": 2,\n\"from\": [\n\"Animal Handling\",\n\"Athletics\",\n\"Intimidation\",\n\"Nature\",\n\"Perception\",\n\"Survival\"\n]\n},\n\"armor\": [\n\"Light\",\n\"Medium\",\n\"Shields\"\n],\n\"weapons\": [\n\"Simple\",\n\"Martial\"\n],\n\"tools\": [],\n\"features\": [\n[\n\"Rage\",\n\"Enter a rage twice per Long Rest: Resistance to Bludgeoning, Piercing and Slashing damage, +2 damage on Strength attacks.\"\n],\n[\n\"Unarmored Defense\",\n\"Without armour, your AC is 10 + Dexterity + Constitution. A shield still works.\"\n],\n[\n\"Weapon Mastery\",\n\"Use the mastery properties of 2 kinds of Simple or Martial melee weapons.\"\n]\n],\n\"cast\": null,\n\"mastery\": 2,\n\"unarmored\": \"Con\",\n\"onVvardenfell\": \"Nords from Skyrim and Orcs from the mountains of Orsinium bring their fury with them. House Redoran respects it; everyone else keeps their distance.\",\n\"wanted\": \"The Fighters Guild, House Redoran\",\n\"prog\": {\n\"features\": {\n\"2\": [\n[\n\"Danger Sense\",\n\"Advantage on Dexterity saving throws unless you're Incapacitated.\"\n],\n[\n\"Reckless Attack\",\n\"Advantage on Strength attacks this turn; attacks against you have Advantage until your next turn.\"\n]\n],\n\"3\": [\n[\n\"Barbarian Subclass\",\n\"Choose your subclass. Its level 3 features are in the book it comes from.\"\n],\n[\n\"Primal Knowledge\",\n\"One more skill from the Barbarian list; while raging, some skill checks can use Strength.\"\n]\n],\n\"4\": [\n[\n\"Ability Score Improvement\",\n\"Raise your ability scores, or take a feat.\"\n]\n],\n\"5\": [\n[\n\"Extra Attack\",\n\"Attack twice, instead of once, when you take the Attack action.\"\n],\n[\n\"Fast Movement\",\n\"+10 feet of Speed while you aren't wearing Heavy armour.\"\n]\n]\n},\n\"counters\": {\n\"Rages\": [\n2,\n2,\n3,\n3,\n3\n],\n\"Rage damage\": [\n\"+2\",\n\"+2\",\n\"+2\",\n\"+2\",\n\"+2\"\n]\n},\n\"mastery\": [\n2,\n2,\n2,\n3,\n3\n],\n\"extraAttack\": 5,\n\"fastMovement\": 5\n}\n},\n{\n\"id\": \"bard\",\n\"name\": \"Bard\",\n\"hitDie\": 8,\n\"primary\": \"Charisma\",\n\"saves\": [\n\"Dex\",\n\"Cha\"\n],\n\"skillChoices\": {\n\"n\": 3,\n\"from\": [\n\"Acrobatics\",\n\"Animal Handling\",\n\"Arcana\",\n\"Athletics\",\n\"Deception\",\n\"History\",\n\"Insight\",\n\"Intimidation\",\n\"Investigation\",\n\"Medicine\",\n\"Nature\",\n\"Perception\",\n\"Performance\",\n\"Persuasion\",\n\"Religion\",\n\"Sleight of Hand\",\n\"Stealth\",\n\"Survival\"\n]\n},\n\"armor\": [\n\"Light\"\n],\n\"weapons\": [\n\"Simple\"\n],\n\"tools\": [\n{\n\"choose\": 3,\n\"of\": \"instrument\"\n}\n],\n\"features\": [\n[\n\"Bardic Inspiration\",\n\"As a Bonus Action, give an ally a d6 to add to a d20 roll, a number of times equal to your Charisma modifier per Long Rest.\"\n],\n[\n\"Spellcasting\",\n\"You cast Bard spells using Charisma.\"\n]\n],\n\"cast\": {\n\"ability\": \"Cha\",\n\"cantrips\": 2,\n\"prepared\": 4,\n\"slots\": 2,\n\"list\": \"Bard\"\n},\n\"onVvardenfell\": \"Imperial courtiers, Breton minstrels and Khajiit storytellers. On an island that runs on favours, a silver tongue is worth more than a sword.\",\n\"wanted\": \"House Hlaalu, the Thieves Guild\",\n\"prog\": {\n\"features\": {\n\"2\": [\n[\n\"Expertise\",\n\"Expertise in two skills you're proficient in.\"\n],\n[\n\"Jack of All Trades\",\n\"Add half your Proficiency Bonus to ability checks with skills you aren't proficient in.\"\n]\n],\n\"3\": [\n[\n\"Bard Subclass\",\n\"Choose your subclass. Its level 3 features are in the book it comes from.\"\n]\n],\n\"4\": [\n[\n\"Ability Score Improvement\",\n\"Raise your ability scores, or take a feat.\"\n]\n],\n\"5\": [\n[\n\"Font of Inspiration\",\n\"Regain all Bardic Inspiration on a Short or Long Rest; spend a spell slot to regain one use.\"\n]\n]\n},\n\"counters\": {\n\"Bardic Inspiration\": [\n\"d6\",\n\"d6\",\n\"d6\",\n\"d6\",\n\"d8\"\n]\n},\n\"expertise\": [\n0,\n2,\n2,\n2,\n2\n],\n\"jack\": 2,\n\"cantrips\": [\n2,\n2,\n2,\n3,\n3\n],\n\"prepared\": [\n4,\n5,\n6,\n7,\n9\n],\n\"slots\": \"full\",\n\"slotTable\": [\n[\n2\n],\n[\n3\n],\n[\n4,\n2\n],\n[\n4,\n3\n],\n[\n4,\n3,\n2\n]\n]\n}\n},\n{\n\"id\": \"cleric\",\n\"name\": \"Cleric\",\n\"hitDie\": 8,\n\"primary\": \"Wisdom\",\n\"saves\": [\n\"Wis\",\n\"Cha\"\n],\n\"skillChoices\": {\n\"n\": 2,\n\"from\": [\n\"History\",\n\"Insight\",\n\"Medicine\",\n\"Persuasion\",\n\"Religion\"\n]\n},\n\"armor\": [\n\"Light\",\n\"Medium\",\n\"Shields\"\n],\n\"weapons\": [\n\"Simple\"\n],\n\"tools\": [],\n\"features\": [\n[\n\"Spellcasting\",\n\"You cast Cleric spells using Wisdom, and use a holy symbol as your focus.\"\n],\n[\n\"Divine Order\",\n\"Choose Protector (Martial weapons and Heavy armour) or Thaumaturge (an extra cantrip, and Wisdom added to Arcana and Religion).\"\n]\n],\n\"cast\": {\n\"ability\": \"Wis\",\n\"cantrips\": 3,\n\"prepared\": 4,\n\"slots\": 2,\n\"list\": \"Cleric\"\n},\n\"order\": \"divine\",\n\"faith\": \"domains\",\n\"onVvardenfell\": \"A priest of the Imperial Cult, the Tribunal Temple or a Daedric shrine. You choose your god in Step Six.\",\n\"wanted\": \"The Temple, the Imperial Cult\",\n\"prog\": {\n\"features\": {\n\"2\": [\n[\n\"Channel Divinity\",\n\"Divine Spark (heal or harm) and Turn Undead; 2 uses, regained on a Short or Long Rest.\"\n]\n],\n\"3\": [\n[\n\"Cleric Subclass\",\n\"Choose your subclass. Its level 3 features are in the book it comes from.\"\n]\n],\n\"4\": [\n[\n\"Ability Score Improvement\",\n\"Raise your ability scores, or take a feat.\"\n]\n],\n\"5\": [\n[\n\"Sear Undead\",\n\"Turn Undead also deals Radiant damage to the undead it affects.\"\n]\n]\n},\n\"counters\": {\n\"Channel Divinity\": [\n0,\n2,\n2,\n2,\n2\n]\n},\n\"cantrips\": [\n3,\n3,\n3,\n4,\n4\n],\n\"prepared\": [\n4,\n5,\n6,\n7,\n9\n],\n\"slots\": \"full\",\n\"slotTable\": [\n[\n2\n],\n[\n3\n],\n[\n4,\n2\n],\n[\n4,\n3\n],\n[\n4,\n3,\n2\n]\n]\n}\n},\n{\n\"id\": \"druid\",\n\"name\": \"Druid\",\n\"hitDie\": 8,\n\"primary\": \"Wisdom\",\n\"saves\": [\n\"Int\",\n\"Wis\"\n],\n\"skillChoices\": {\n\"n\": 2,\n\"from\": [\n
