    }
    if (C.method === "pointbuy") {
      const spent = AB.reduce((t, a) => t + COST[C.points[a] || 8], 0);
      b5 += `<p class="${spent > 27 ? "warn" : "note"}">Points spent: <b>${spent}</b> of 27. Scores run from 8 to 15.</p>`;
    }
    const usedIdx = Object.values(C.assign).filter((v) => v !== "" && v != null).map(String);
    b5 += `<div class="scores">${AB.map((a) => {
      let ctrl;
      if (C.method === "pointbuy") ctrl = `<div class="pb"><button type="button" data-pt="${a}" data-d="-1" aria-label="Lower ${ABN[a]}">−</button><span class="v">${C.points[a] || 8}</span><button type="button" data-pt="${a}" data-d="1" aria-label="Raise ${ABN[a]}">+</button></div>`;
      else ctrl = `<select data-bind="assign.${a}" aria-label="${ABN[a]}">${opt("", "—", C.assign[a] === "" || C.assign[a] == null)}${pool.map((v, i) => isNaN(v) ? "" : opt(String(i), String(v), String(C.assign[a]) === String(i), usedIdx.includes(String(i)) && String(C.assign[a]) !== String(i))).join("")}</select>`;
      return `<div class="sc"><span class="ab">${a}</span>${ctrl}<span class="fin">${S.fin[a] == null ? "—" : `${S.fin[a]} (${sgn(S.m[a])})`}${S.inc[a] ? ` <span title="from your background">+${S.inc[a]}</span>` : ""}${S.lvInc[a] ? ` <span title="from Ability Score Improvements and feats">+${S.lvInc[a]}</span>` : ""}</span></div>`;
    }).join("")}</div>`;
    if (bg) {
      b5 += `<div class="seg" role="group" aria-label="Background increase">${[["21", "+2 and +1"], ["111", "+1 to all three"]].map(([v, l]) => `<button type="button" data-asi="${v}" aria-pressed="${C.asiMode === v}">${l}</button>`).join("")}</div>`;
      if (C.asiMode === "21") b5 += `<div class="row">${field("+2 to", sel("asi2", bg.abilities.map((a) => ({ v: a, l: ABN[a], dis: a === C.asi1 })), C.asi2, "Choose…"))}${field("+1 to", sel("asi1", bg.abilities.map((a) => ({ v: a, l: ABN[a], dis: a === C.asi2 })), C.asi1, "Choose…"))}</div>`;
      else b5 += `<p class="note">+1 to ${bg.abilities.map((a) => ABN[a]).join(", ")}.</p>`;
    } else b5 += `<p class="note">Choose a background in Step 3 to add its ability increases.</p>`;
    if (cls) b5 += `<p class="note">${esc(cls.name)}: give one of your best scores to ${esc(cls.primary)}.</p>`;
    const d5 = AB.every((a) => S.base[a] != null) && bg && (C.asiMode === "111" || (C.asi2 && C.asi1)) && (C.method !== "pointbuy" || AB.reduce((t, a) => t + COST[C.points[a] || 8], 0) <= 27);
    parts.push(step(5, "Ability Scores", { standard: "Standard array", pointbuy: "Point buy", dice: "Dice" }[C.method], d5, guideLink("guide-ability-scores", "Step Five in the guide") + b5));

    // 6. Equipment
    let b7 = "";
    if (cls) {
      const opts = D.equipment[cls.name] || [];
      b7 += field(`${cls.name} equipment`, sel("classEquip", opts.map((o, i) => ({ v: String(i), l: o.label })), String(C.classEquip)));
      const o = opts[C.classEquip];
      if (o) b7 += `<p class="note">${o.text ? o.text : `${o.gold} gp to spend at <i>Treasures of Morrowind</i> prices.`}</p>`;
    } else b7 += `<p class="note">Choose a class in Step 2 to see its equipment.</p>`;
    if (bg) {
      b7 += field(`${bg.name} equipment`, sel("bgEquip", [{ v: "package", l: "The background's package" }, { v: "gold", l: `${bg.altGold} gp instead` }], C.bgEquip));
      if (C.bgEquip === "package") b7 += `<p class="note">${bg.equipment}</p>`;
    }
    const armOpts = ["light", "medium", "heavy"].flatMap((cat) => ["Player's Handbook", "Treasures"].map((src) => ({ group: `${cat[0].toUpperCase() + cat.slice(1)} armour · ${src === "Treasures" ? "Morrowind-made" : "from home"}`,
      items: D.armour.filter((a) => a.cat === cat && a.src === src).map((a) => ({ v: a.name, l: `${a.name} · AC ${a.base}${cat === "light" ? " + Dex" : cat === "medium" ? " + Dex (max 2)" : ""}${armourProf(a, X.P) ? "" : " · untrained"}` })) })));
    b7 += `<div class="row">${field("Armour you wear", sel("armour", armOpts, C.armour, "No armour"))}${field("Shield", sel("shield", [{ v: "Shield", l: "Shield (from home) · +2" }, ...D.shields.map((s) => ({ v: s.name, l: `${s.name} · +${s.bonus}` }))], C.shield, "No shield"))}</div>`;
    const wOpts = ["Simple", "Martial"].map((cat) => ({ group: `${cat} weapons`, items: D.weapons.filter((w) => w.cat === cat).map((w) => ({ v: w.name, l: `${w.name}${w.as ? ` [${w.as}]` : ""}${weaponProf(w, X.P) ? "" : " · untrained"}` })) }));
    b7 += field("Weapons you carry", `<div class="row">${[0, 1, 2, 3].map((i) => sel(`weapons.${i}`, wOpts, C.weapons[i], "—")).join("")}</div>`);
    b7 += `<p class="note">Choosing a gear package fills in your armour and weapons; change them freely. Names in brackets are the <i>Player's Handbook</i> weapon each one counts as.</p>`;
    parts.push(step(6, "Equipment", cls ? (D.equipment[cls.name] || [])[C.classEquip]?.label || "" : "What you carry off the ship", !!cls && !!bg, guideLink("guide-starting-equipment", "Step Seven in the guide") + b7));

    // Levels 2 and up: one card each, asking only that level's choices
    for (let n = 2; cls && n <= LV(); n++) parts.push(levelCard(n, X));

    // Faith (guide Step Six) and Finishing Touches (Step Eight) stay in the guide, not on the papers
    const gl = guideText;
    parts.push(`<p class="note">Your faith and your story aren't on these papers. Work through ${gl("guide-your-faith", "Step Six")} and ${gl("guide-finishing-touches", "Step Eight")} in the guide, and share them with your DM.</p>`);

    const active = document.activeElement?.dataset?.bind;
    $("#build").innerHTML = parts.join("");
    if (active) { const el = $(`[data-bind="${CSS.escape(active)}"]`); if (el) el.focus({ preventScroll: true }); }
  }

  function slotsText(cls) {
    const pr = cls?.prog || {};
    if (pr.slots === "pact") { const n = at(pr.pact.count, LV()); return `${n} Pact Magic slot${n > 1 ? "s" : ""} (level ${at(pr.pact.level, LV())})`; }
    const row = slotRow(cls) || [];
    return row.map((k, i) => `${k} level ${i + 1}`).join(", ") + ` spell slot${row.reduce((a, b) => a + b, 0) > 1 ? "s" : ""}`;
  }

  function levelCard(n, X) {
    const cls = X.cls, pr = cls.prog, d = lvData(n), feats = pr.features[n] || [], bind = (k) => `lv.${n}.${k}`;
    const changes = Object.entries(pr.counters || {}).filter(([, v]) => at(v, n) !== at(v, n - 1) && at(v, n)).map(([k, v]) => `${k}: ${at(v, n)}`);
    const grow = [];
    const prev = (fn) => { const keep = C.level; C.level = n - 1; const r = fn(); C.level = keep; return r; };
    if (cls.cast) {
      const nowL = (() => { const keep = C.level; C.level = n; const r = [castCantrips(cls), castPrepared(cls), castSpellbook(cls), maxSpellLevel(cls), slotsText(cls)]; C.level = keep; return r; })();
      const was = prev(() => [castCantrips(cls), castPrepared(cls), castSpellbook(cls), maxSpellLevel(cls)]);
      if (nowL[0] > was[0]) grow.push(`+${nowL[0] - was[0]} cantrip`);
      if (nowL[1] > was[1]) grow.push(`+${nowL[1] - was[1]} prepared spell${nowL[1] - was[1] > 1 ? "s" : ""}`);
      if (nowL[2] > was[2]) grow.push(`+${nowL[2] - was[2]} spellbook spells`);
      if (nowL[3] > was[3]) grow.push(`level ${nowL[3]} spells`);
      grow.push(nowL[4]);
    }
    const mN = at(pr.mastery, n), mP = at(pr.mastery, n - 1); if (mN > mP) grow.push(`+${mN - mP} Weapon Mastery`);
    const iN = at(pr.invocations, n), iP = at(pr.invocations, n - 1); if (iN > iP) grow.push(`+${iN - iP} Eldritch Invocation${iN - iP > 1 ? "s" : ""}`);
    if (pbOf(n) > pbOf(n - 1)) grow.unshift(`Proficiency Bonus +${pbOf(n)}`);
    let b = `<div class="card">${feats.map(([f, txt]) => `<p><b>${esc(f)}.</b> ${esc(txt)}</p>`).join("") || "<p>No new class features at this level.</p>"}
      ${changes.length ? `<p><b>Now:</b> ${esc(changes.join(" · "))}</p>` : ""}${grow.length ? `<p><b>Also:</b> ${esc(grow.join(" · "))}${grow.some((g) => /spell|cantrip|Mastery|Invocation/.test(g)) ? ". Choose new spells, masteries and invocations in Step 2." : ""}</p>` : ""}</div>`;
    // hit points
    const avg = cls.hitDie / 2 + 1;
    b += field(`Hit points: d${cls.hitDie} + Constitution`, `<div class="row">${sel(bind("hpMode"), [{ v: "avg", l: `Take the average (${avg})` }, { v: "roll", l: `Roll a d${cls.hitDie}` }], d.hpMode || "avg")}${d.hpMode === "roll"
      ? `<div class="row" style="grid-template-columns:minmax(0,1fr) auto"><input type="number" min="1" max="${cls.hitDie}" data-bind="${bind("hpRoll")}" value="${esc(d.hpRoll ?? "")}" placeholder="Your roll" aria-label="Your roll"><button class="btn" type="button" data-hproll="${n}">Roll</button></div>` : ""}</div>`);
    let done = d.hpMode !== "roll" || +d.hpRoll > 0;
    // subclass
    if (n === 3) {
      const subs = D.subclasses[cls.name] || [];
      b += field(`${cls.name} subclass`, sel("subclass", [{ group: "2024 Player's Handbook", items: subs.filter((s) => !s.old).map((s) => ({ v: s.name, l: s.name })) },
        { group: "Older books (*)", items: subs.filter((s) => s.old).map((s) => ({ v: s.name, l: `${s.name} *` })) }], C.subclass, "Choose a subclass…"));
      const sm = D.subclassMech[C.subclass];
      b += `<p class="note">${sm ? `On your sheet: ${esc(sm.note)} ` : ""}Read your subclass's features in its book. An older-book subclass (*) also starts at level 3 here.${["Cleric", "Paladin", "Warlock"].includes(cls.name) ? " Your god's suggestions are in the guide, but any subclass is fine." : ""}</p>`;
      done = done && !!C.subclass;
    }
    // Ability Score Improvement or a feat
    if ([4, 8, 12, 16].includes(n)) {
      const byCat = (cat) => D.feats.filter((f) => f.cat === cat).map((f) => ({ v: f.name, l: f.pre ? `${f.name} (needs ${f.pre})` : f.name }));
      const opts = [{ v: "asi", l: "Ability Score Improvement" }, { group: "Origin feats", items: byCat("Origin") }, { group: "General feats (+1 to an ability)", items: byCat("General") }];
      if (hasStyleFeature(cls)) opts.push({ group: "Fighting Style feats", items: byCat("Fighting Style") });
      b += field("Ability Score Improvement, or a feat", sel(bind("asi"), opts, d.asi, "Choose…"));
      const abOpt = (list) => list.map((a) => ({ v: a, l: ABN[a] }));
      if (d.asi === "asi") {
        b += `<div class="row">${field("How", sel(bind("asiMode"), [{ v: "2", l: "+2 to one ability" }, { v: "11", l: "+1 to two abilities" }], d.asiMode || "2"))}${field(d.asiMode === "11" ? "First ability" : "Ability", sel(bind("a1"), abOpt(AB), d.a1, "Choose…"))}${d.asiMode === "11" ? field("Second ability", sel(bind("a2"), AB.map((a) => ({ v: a, l: ABN[a], dis: a === d.a1 })), d.a2, "Choose…")) : ""}</div><p class="note">No score can go above 20.</p>`;
        done = done && !!d.a1 && (d.asiMode !== "11" || !!d.a2);
      } else if (d.asi) {
        const f = D.feats.find((x) => x.name === d.asi);
        if (f && f.ab && f.ab.length) { b += field(`${f.name}: +1 to`, sel(bind("featAb"), abOpt(f.ab === "any" ? AB : f.ab), d.featAb, "Choose an ability…")); done = done && !!d.featAb; }
        const fm = D.featMech[d.asi];
        b += `<p class="note">${fm ? "Its main effect is on your sheet. " : ""}Read the feat in the <i>Player's Handbook</i> and add anything else it gives you by hand.</p>`;
      } else done = false;
    }
    // class picks at this level
    const exNow = at(pr.expertise, n) || 0, exPrev = at(pr.expertise, n - 1) || 0;
    if (exNow > exPrev) {
      const profd = Object.keys(X.sk.src).filter((s) => !pr.scholar || pr.scholar.includes(s));
      b += field(pr.scholar ? "Scholar: Expertise in one of these skills you're proficient in" : `Expertise (${exNow - exPrev} skill${exNow - exPrev > 1 ? "s" : ""} you're proficient in)`,
        `<div class="row">${Array.from({ length: exNow - exPrev }, (_, k) => { const i = exPrev + k; return sel(`expertise.${i}`, profd.map((s) => ({ v: s, l: s, dis: C.expertise.includes(s) && C.expertise[i] !== s })), C.expertise[i], "Choose a skill…"); }).join("")}</div>`);
      if (pr.scholar && !profd.length) b += `<p class="warn">You aren't proficient in any of Scholar's skills yet.</p>`;
      done = done && C.expertise.slice(exPrev, exNow).filter(Boolean).length >= exNow - exPrev;
    }
    if (pr.style === n) { b += field("Fighting Style", sel("style", D.fightingStyles, C.style, "Choose a Fighting Style…")); done = done && !!C.style; }
    if (pr.deftLangs && n === 2) {
      const known = X.P.langs;
      b += field("Deft Explorer: two more languages", `<div class="row">${[0, 1].map((i) => sel(`deftLangs.${i}`, D.languages.map((l) => ({ v: l, l, dis: (known.includes(l) && C.deftLangs[i] !== l) })), C.deftLangs[i], "Choose a language…")).join("")}</div>`);
      done = done && C.deftLangs.filter(Boolean).length >= 2;
    }
    if (pr.metamagic && n === 2) {
      b += field("Metamagic (choose two)", `<div class="row">${[0, 1].map((i) => sel(`metamagic.${i}`, D.metamagic.map((x) => ({ v: x, l: x, dis: C.metamagic.includes(x) && C.metamagic[i] !== x })), C.metamagic[i], "Choose…")).join("")}</div>`);
      done = done && C.metamagic.filter(Boolean).length >= 2;
    }
    if (cls.id === "barbarian" && n === 3) {
      const have = Object.keys(X.sk.src).filter((s) => X.sk.src[s] !== "Primal Knowledge");
      b += field("Primal Knowledge: one more Barbarian skill", sel("primal", cls.skillChoices.from.map((s) => ({ v: s, l: s, dis: have.includes(s) })), C.primal, "Choose a skill…"));
      done = done && !!C.primal;
    }
    const sub = n === 3 && C.subclass ? C.subclass : n === 4 && d.asi ? (d.asi === "asi" ? "Ability Score Improvement" : d.asi) : feats.filter((f) => !/Subclass|Ability Score/.test(f[0])).map((f) => f[0]).slice(0, 2).join(", ") || "Hit points";
    return step(`L${n}`, `Level ${n}`, sub, done, b);
  }

  // ---------- the sheet ----------
  function renderSheet() {
    const X = derive(), { race, cls, sign, S } = X, bg = byId(D.backgrounds, C.bg), L = LV();
    const box = (title, body, cls2 = "") => `<div class="cs-box ${cls2}">${title ? `<span class="cs-h">${esc(title)}</span>` : ""}${body}</div>`;
    const lv = (label, value) => `<div><span class="cs-l">${esc(label)}</span><div class="cs-v">${value ? esc(String(value)) : "&nbsp;"}</div></div>`;
    const stat = (label, value, tip = "", small = false) => `<div class="stat" title="${esc(tip)}"><b${small ? ' class="cs-txt"' : ""}>${esc(String(value))}</b><span>${esc(label)}</span></div>`;
    const blank = (label) => `<div><span class="cs-l">${esc(label)}</span><div class="cs-blank"></div></div>`;
    const empty = C.race || C.cls ? "" : `<div class="who">Work through the six steps, and your papers fill in here.</div>`;

    // ---- page 1, top left: who you are ----
    let who = `<h2>${esc(C.name || "Unnamed outlander")}</h2>${empty}<div class="cs-idgrid">${lv("Background", bg?.name)}${lv("Class", cls?.name)}${lv("Species", race?.short)}${lv("Subclass", L >= 3 ? C.subclass : "")}${lv("Level", cls ? L : "")}${lv("Birthsign", sign?.name)}</div>`;
    // ---- top right: how tough you are ----
    const shield = `<svg viewBox="0 0 60 70" preserveAspectRatio="none" aria-hidden="true"><path d="M30 2 L57 10 V33 C57 51 45 62 30 68 C15 62 3 51 3 33 V10 Z" fill="var(--paper)" stroke="var(--gold)" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg>`;
    let tough = `<div class="cs-ac stat" title="${esc(X.ac.how)}">${shield}<div><b>${X.ac.ac}</b><span>AC</span></div></div>`;
    tough += box("Hit Points", `<div class="cs-trio"><div><span class="cs-l">Current</span><div class="cs-blank"></div></div><div><span class="cs-l">Temp</span><div class="cs-blank"></div></div><div class="stat" title="${esc(cls ? `d${cls.hitDie} + Con per level${sign?.hpPerLevel ? " + Lady's Grace" : ""}` : "")}"><span class="sr">Hit points</span><span class="cs-l">Max</span><b class="cs-num">${X.hp ?? "—"}</b></div></div>`, "cs-hp");
    tough += box("Hit Dice", `<div class="cs-duo"><div><span class="cs-l">Spent</span><div class="cs-blank"></div></div><div><span class="cs-l">Max</span><div class="cs-num">${cls ? `${L}d${cls.hitDie}` : "—"}</div></div></div>`, "cs-hd");
    tough += box("Death Saves", `<div class="cs-ds"><span class="cs-l">Successes</span><span><i></i><i></i><i></i></span></div><div class="cs-ds"><span class="cs-l">Failures</span><span><i></i><i></i><i></i></span></div>`, "cs-dsv");

    // ---- left: abilities, each with its saving throw and skills ----
    const abBlock = (a) => {
      const sv = X.saves.find((s) => s.a === a), sk = X.skills.filter((s) => s.ab === a);
      const row = (s) => `<li title="${esc(s.from ? "From " + s.from : "")}"><span class="dot${s.e ? " e" : s.p ? " p" : ""}"></span><span class="b">${sgn(s.b)}</span><span>${esc(s.name)}</span></li>`;
      return `<div class="ab6"><span class="n">${ABN[a]}</span><div class="ms"><span class="m">${S.fin[a] == null ? "—" : sgn(S.m[a])}</span><span class="s">${S.fin[a] ?? "–"}</span></div>
        <ul class="skills"><li class="sv${sv.p ? " p" : ""}"><span class="dot${sv.p ? " p" : ""}"></span><span class="b">${sgn(sv.b)}</span><span>Saving Throw</span></li>${sk.map(row).join("")}</ul></div>`;
    };
    const armTrain = ["Light", "Medium", "Heavy", "Shields"].map((a) => `<span><i class="${X.P.armor.has(a) ? "on" : ""}"></i>${a}</span>`).join("");
    let left = `<div class="cs-abil"><div class="cs-abcol"><div class="cs-box cs-pb"><span class="cs-num">${sgn(PB)}</span><span class="cs-l">Proficiency Bonus</span><span class="sr">${sgn(PB)}</span></div>${["Str", "Dex", "Con"].map(abBlock).join("")}
      <div class="cs-box cs-insp"><i></i><span class="cs-l">Heroic Inspiration</span></div></div><div class="cs-abcol">${["Int", "Wis", "Cha"].map(abBlock).join("")}</div></div>`;
    left += box("Equipment Training & Proficiencies", `<span class="cs-l">Armour training</span><div class="cs-train">${armTrain}</div>
      <p class="kv"><b>Weapons</b>${esc([...X.P.weapons].join(", ") || "None")}</p><p class="kv"><b>Tools</b>${esc(X.P.tools.map((x) => x.t).join(", ") || "None")}</p>`);

    // ---- right: fighting gear, then what makes you special ----
    let right = `<div class="cs-quad">${stat("Initiative", sgn(X.init), sign?.initAdv ? "with Advantage" : "")}${stat("Speed", `${X.speed} ft`)}${stat("Size", race ? race.sizeText.split(" ")[0] : "—", race?.sizeText || "")}${stat("Passive Perception", 10 + X.per.b)}</div>`;
    if (X.warnings.length) right += X.warnings.map((w) => `<p class="warn">${esc(w)}</p>`).join("");
    right += box(`Weapons & Damage Cantrips${X.extraAttack ? " · two attacks" : ""}`, `<table class="atk"><thead><tr><th>Name</th><th>Atk / DC</th><th>Damage &amp; Type</th><th>Notes</th></tr></thead><tbody>${X.attacks.map((a) => `<tr><td>${esc(a.name)}</td><td>${sgn(a.hit)}</td><td>${esc(a.dmg)}</td><td>${esc(a.notes)}</td></tr>`).join("")}</tbody></table>`);
    // class features
    const cf = [];
    if (cls) {
      cf.push(...cls.features.map(([n]) => [n, `${cls.name} 1`]));
      for (let n = 2; n <= L; n++) (cls.prog.features[n] || []).filter(([f]) => !/Subclass$|^Ability Score Improvement$/.test(f)).forEach(([f]) => cf.push([f, `${cls.name} ${n}`]));
      if (L >= 3 && C.subclass) cf.push([`${C.subclass}${D.subclasses[cls.name]?.find((s) => s.name === C.subclass)?.old ? " *" : ""}`, D.subclassMech[C.subclass]?.note || "subclass · features in its book"]);
      if (cls.id === "barbarian" && L >= 3 && C.primal) cf.push([`Primal Knowledge: ${C.primal}`, "Barbarian 3"]);
      if (cls.prog.metamagic && L >= 2 && C.metamagic.filter(Boolean).length) cf.push([`Metamagic: ${C.metamagic.filter(Boolean).join(", ")}`, "Sorcerer 2"]);
    }
    if (C.order) cf.push([{ protector: "Divine Order: Protector", thaumaturge: "Divine Order: Thaumaturge", magician: "Primal Order: Magician", warden: "Primal Order: Warden" }[C.order], cls?.name]);
    const invs = C.invocations.slice(0, at(cls?.prog?.invocations, L) || 0).filter(Boolean);
    if (invs.length) cf.push([`Invocations: ${invs.join(", ")}`, "Warlock"]);
    const mast = [...C.mastery.slice(0, at(cls?.prog?.mastery, L) || cls?.mastery || 0).filter(Boolean)];
    if (mast.length) cf.push([`Weapon Mastery: ${mast.join(", ")}`, cls?.name]);
    if (X.exp.filter(Boolean).length) cf.push([`Expertise: ${X.exp.filter(Boolean).join(", ")}`, cls?.name]);
    const counters = cls ? Object.entries(cls.prog.counters || {}).map(([k, v]) => [k, at(v, L)]).filter(([, v]) => v) : [];
    if (cls?.id === "bard") counters.push(["Bardic Inspiration uses", Math.max(1, S.m.Cha)]);
    const featLine = ([n, f]) => `<p class="feat"><b>${esc(n)}</b> <span class="src">${esc(f || "")}</span></p>`;
    right += box("Class Features", (counters.length ? `<p class="kv">${counters.map(([k, v]) => `<b>${esc(k)}</b>${esc(String(v))}`).join(" · ")}</p>` : "")
      + (cf.length ? `<div class="cs-feat2">${cf.map(featLine).join("")}</div>` : `<p class="empty">Choose a class in Step 2.</p>`));
    // species traits (with the Morrowind extras) and feats (the birthsign stands in for the Origin feat)
    const st = [];
    if (race) {
      if (X.darkvision) st.push([`Darkvision ${X.darkvision} ft`, ""]);
      if (race.resist?.length) st.push([`Resistance: ${race.resist.join(", ")} damage`, ""]);
      if (race.adv?.length) st.push([`Advantage on ${race.adv.join("; ")}`, ""]);
      if (C.sword) st.push([`Way of the Sword mastery: ${C.sword}`, ""]);
      st.push(...race.traits.filter((x) => !(X.darkvision && x.name === "Darkvision")).map((x) => [x.name, ""]));
      if (race.id === "nord") st.push([`Battle Cry DC ${8 + PB + S.m.Con}`, ""]);
    }
    const ft = [];
    if (sign) {
      ft.push(...sign.traits.map((x) => [x.name, sign.name]));
      if (sign.id === "lord") ft.push(["Weakness: Disadvantage on saves against Fire damage effects", sign.name]);
      if (sign.id === "apprentice") ft.push(["Weakness: spells deal +2 damage to you", sign.name]);
      if (/save DC/.test(sign.traits.map((x) => x.text).join(" ")) && !(sign.spells || sign.cantripChoice || sign.extraSlots)) ft.push([`Birthsign save DC ${X.signSp.dc}`, ABN[C.signAbility]]);
    }
    if (C.style) ft.push([`Fighting Style: ${C.style}`, cls?.name]);
    asiLevels().forEach((n) => { const d = lvData(n); if (!d.asi) return;
      ft.push([d.asi === "asi" ? `Ability Score Improvement: ${d.asiMode === "11" ? [d.a1, d.a2].filter(Boolean).map((a) => `+1 ${a}`).join(", ") : d.a1 ? `+2 ${d.a1}` : ""}` : `${d.asi}${d.featAb ? ` (+1 ${d.featAb})` : ""}`, `level ${n}`]); });
    right += `<div class="cs-pair">${box(race ? `Species Traits · ${race.short}` : "Species Traits", st.length ? st.map(featLine).join("") : `<p class="empty">Choose your people in Step 1.</p>`)}${box("Feats & Birthsign", ft.length ? ft.map(featLine).join("") : `<p class="empty">Your birthsign takes the place of an Origin feat.</p>`)}</div>`;

    let h = `<section class="cs-pg cs-p1"><div class="cs-who">${who}</div><div class="cs-tough">${tough}</div><div class="cs-left">${left}</div><div class="cs-right">${right}</div></section>`;

    // ---- page 2, left: spells and spellcasting ----
    const rows = [];  // [level, name, source, notes]
    let head = "";
    if (cls?.cast) {
      const c = cls.cast, al = alwaysNow(cls), lvlOf = spellLevel;
      head = `<div class="cs-quad">${stat("Spellcasting Ability", ABN[c.ability], "", true)}${stat("Spellcasting Modifier", sgn(S.m[c.ability]))}${stat("Spell Save DC", X.spell.dc)}${stat("Spell Attack Bonus", sgn(X.spell.atk))}</div>`;
      const pr = cls.prog || {}, slots = pr.slots === "pact" ? null : slotRow(cls) || [];
      const pact = pr.slots === "pact" ? { n: at(pr.pact.count, L), l: at(pr.pact.level, L) } : null;
      head += box(pact ? "Pact Magic Slots" : "Spell Slots", `<div class="cs-slots">${Array.from({ length: 9 }, (_, i) => { const n = pact ? (pact.l === i + 1 ? pact.n : 0) : slots[i] || 0;
        return `<div class="${n ? "" : "off"}"><span class="cs-l">Level ${i + 1}</span><div class="cs-num">${n || "–"}</div><div class="ex">${"☐".repeat(n)}</div></div>`; }).join("")}</div>`);
      castCantrips(cls) && Array.from({ length: castCantrips(cls) }, (_, i) => rows.push(["C", C.cantrips[i] || "", cls.name, ""]));
      al.forEach((s) => rows.push([lvlOf(s), s, cls.name, "always prepared"]));
      Array.from({ length: castPrepared(cls) }, (_, i) => rows.push([C.prepared[i] ? lvlOf(C.prepared[i]) : "", C.prepared[i] || "", cls.name, ""]));
    }
    if (race?.spells) {
      race.spells.cantrips.forEach((s) => rows.push(["C", s, race.short, `${ABN[C.raceAbility]} · DC ${X.raceSp.dc}`]));
      if (C.raceSpell) rows.push([1, C.raceSpell, race.short, "once per Long Rest without a slot"]);
      (race.spells.later || []).forEach(([s, l]) => rows.push([l <= L ? spellLevel(s) : "", s, race.short, l <= L ? "once per Long Rest without a slot" : `from level ${l}`]));
    }
    if (sign) {
      (sign.spells || []).forEach(([s, l]) => rows.push([l, s, sign.name, sign.freeAtHalfPb ? `free once per Long Rest, cast at level ${Math.ceil(PB / 2)}` : "birthsign"]));
      C.signCantrips.filter(Boolean).forEach((s) => rows.push(["C", s, sign.name, `${ABN[C.signAbility]} · DC ${X.signSp.dc}`]));
      C.signSpells.filter(Boolean).forEach((s) => rows.push([1, s, sign.name, `${ABN[C.signAbility]} · DC ${X.signSp.dc}`]));
      if (sign.extraSlots) rows.push(["", `${sign.extraSlots} extra level 1 slot${sign.extraSlots > 1 ? "s" : ""}`, sign.name, ""]);
    }
    let spells = head;
    spells += box("Cantrips & Prepared Spells", rows.length ? `<table class="atk"><thead><tr><th>Lvl</th><th>Name</th><th>From</th><th>Notes</th></tr></thead><tbody>${rows.map(([l, n, f, note]) =>
      `<tr><td>${esc(String(l))}</td><td>${n ? esc(spellLabel(n)) : `<span class="empty">blank</span>`}</td><td>${esc(f)}</td><td>${esc(note)}</td></tr>`).join("")}</tbody></table>` : `<p class="empty">No spells yet. Spellcasting classes, some peoples and some birthsigns give them.</p><div class="cs-lines"></div>`);
    if (cls?.cast && castSpellbook(cls)) spells += box("Spellbook", `<p class="kv">${Array.from({ length: castSpellbook(cls) }, (_, i) => C.spellbook[i] ? esc(spellLabel(C.spellbook[i])) : `<span class="empty">blank</span>`).join(", ")}</p>`);

    // ---- page 2, right: who you are beneath the stats ----
    const eq = []; let gold = 0;
    if (cls) { const o = (D.equipment[cls.name] || [])[C.classEquip]; if (o) { if (o.text) eq.push(o.text); gold += o.gold; } }
    if (bg) { if (C.bgEquip === "package") { eq.push(bg.equipment); gold += bg.gold; } else gold += bg.altGold; }
    let beneath = box("Appearance", `<div class="cs-lines"></div>`);
    beneath += box("Alignment", `<div class="cs-blank"></div>`);
    beneath += box("Languages", `<p class="kv">${esc(X.P.langs.join(", "))}</p>`);
    beneath += box("Equipment", `${eq.map((e) => `<p class="feat">${e.replace(/ and \d+ gp$/, "").replace(/,? and \d+ gp/, "")}</p>`).join("") || `<p class="empty">Choose gear in Step 6.</p>`}
      <span class="cs-l">Magic item attunement</span><div class="cs-blank"></div><div class="cs-blank"></div><div class="cs-blank"></div>`);
    beneath += box("Coins", `<div class="cs-coins">${["CP", "SP", "EP", "GP", "PP"].map((k) => `<div><span class="cs-l">${k}</span><div class="cs-num">${k === "GP" && gold ? gold : "&nbsp;"}</div></div>`).join("")}</div>`);
    h += `<section class="cs-pg cs-p2"><div class="cs-spells"><p class="cs-pagehead">Page two</p>${spells}</div><div class="cs-beneath">${beneath}</div></section>`;
    $("#sheet").innerHTML = h;
  }

  function sheetText() {
    const X = derive(), { race, cls, sign, S } = X, bg = byId(D.backgrounds, C.bg);
    const L = [];
    L.push(`${C.name || "Unnamed outlander"}: ${[race?.short, cls ? `${cls.name} ${LV()}${LV() >= 3 && C.subclass ? ` (${C.subclass})` : ""}` : "", bg?.name, sign?.name].filter(Boolean).join(", ")}`);
    L.push(`AC ${X.ac.ac} (${X.ac.how}) | HP ${X.hp ?? "-"} | Speed ${X.speed} ft | Initiative ${sgn(X.init)} | Proficiency ${sgn(PB)} | Passive Perception ${10 + X.per.b}${X.darkvision ? ` | Darkvision ${X.darkvision} ft` : ""}`);
    L.push(AB.map((a) => `${a} ${S.fin[a] ?? "-"} (${sgn(S.m[a])})`).join("  "));
    L.push("Saves: " + X.saves.filter((s) => s.p).map((s) => `${s.a} ${sgn(s.b)}`).join(", "));
    L.push("Skills: " + X.skills.filter((s) => s.p).map((s) => `${s.name} ${sgn(s.b)}${s.e ? " (expertise)" : ""}`).join(", "));
    L.push(`Armour: ${[...X.P.armor].join(", ") || "None"} | Weapons: ${[...X.P.weapons].join(", ")} | Tools: ${X.P.tools.map((t) => t.t).join(", ") || "None"}`);
    L.push(`Languages: ${X.P.langs.join(", ")}`);
    L.push("Attacks: " + X.attacks.map((a) => `${a.name} ${sgn(a.hit)} (${a.dmg})`).join("; "));
    if (cls?.cast) L.push(`Spells (${cls.name}, DC ${X.spell.dc}, attack ${sgn(X.spell.atk)}, ${slotsText(cls)}): cantrips ${C.cantrips.filter(Boolean).join(", ") || "-"}; prepared ${C.prepared.filter(Boolean).join(", ") || "-"}${cls.cast.spellbook ? `; spellbook ${C.spellbook.filter(Boolean).join(", ") || "-"}` : ""}`);
    if (race?.spells) L.push(`${race.short} spells: ${[...race.spells.cantrips, C.raceSpell].filter(Boolean).join(", ")} (DC ${X.raceSp.dc})`);
    if (sign) L.push(`${sign.name}: ${sign.traits.map((t) => t.name).join(", ")}`);
    return L.join("\n");
  }

  // ---------- package parsing: armour and weapons from the chosen gear ----------
  const WEAPON_WORDS = [["greataxe", "Battle axe"], ["battle axe", "Battle axe"], ["handaxe", "Axe"], ["chitin axe", "Axe"], ["greatsword", "Claymore"], ["claymore", "Claymore"],
    ["scimitar", "Saber"], ["saber", "Saber"], ["shortsword", "Shortsword"], ["longsword", "Longsword"], ["broadsword", "Broadsword"], ["longbow", "Long bow"], ["long bow", "Long bow"],
    ["shortbow", "Short bow"], ["short bow", "Short bow"], ["quarterstaff", "Staff"], ["staff", "Staff"], ["dagger", "Dagger"], ["mace", "Mace"], ["sickle", "Sickle"], ["flail", "Flail"],
    ["javelin", "Javelin"], ["spear", "Spear"]];
  function applyPackage() {
    const cls = byId(D.classes, C.cls); if (!cls) return;
    const o = (D.equipment[cls.name] || [])[C.classEquip]; if (!o) return;
    const t = (o.text || "").toLowerCase().replace(/\[[^\]]*\]/g, "");
    C.armour = /netch leather/.test(t) ? "Netch leather" : /chitin armour/.test(t) ? "Chitin" : /iron armour/.test(t) ? "Iron" : /studded leather/.test(t) ? "Studded leather"
      : /chain shirt/.test(t) ? "Chain shirt" : /chain mail/.test(t) ? "Chain mail" : /leather armour/.test(t) ? "Leather" : "";
    C.shield = /chitin shield/.test(t) ? "Netch leather or chitin" : /iron shield/.test(t) ? "Iron, steel or Nordic" : /\bshield\b/.test(t) ? "Shield" : "";
    const found = [];
    WEAPON_WORDS.forEach(([w, n]) => { const i = t.indexOf(w); if (i >= 0 && !found.some((f) => f.n === n) && !(w === "staff" && t.includes("quarterstaff"))) found.push({ n, i }); });
    found.sort((a, b) => a.i - b.i);
    C.weapons = [0, 1, 2, 3].map((i) => found[i]?.n || "");
  }

  // ---------- events ----------
  const getPath = (o, p) => p.split(".").reduce((a, k) => (a == null ? a : a[k]), o);
  function setPath(o, p, v) {
    const ks = p.split("."); let a = o;
    ks.slice(0, -1).forEach((k, i) => { if (a[k] == null) a[k] = /^\d+$/.test(ks[i + 1]) ? [] : {}; a = a[k]; });
    a[ks.at(-1)] = v;
  }
  const RESETS = { race: () => { C.raceSkills = []; C.raceSpell = ""; C.sword = ""; },
    cls: () => { C.clsSkills = []; C.order = ""; C.style = ""; C.expertise = []; C.clsTools = []; C.mastery = []; C.cantrips = []; C.prepared = []; C.spellbook = []; C.invocation = ""; C.invocations = []; C.subclass = ""; C.classEquip = 0;
      C.lv = []; C.primal = ""; C.deftLangs = []; C.metamagic = []; applyPackage(); },
    level: () => { C.level = Math.min(MAX_LEVEL, Math.max(1, +C.level || 1)); for (let n = 2; n <= C.level; n++) openSteps.add(`L${n}`); },
    bg: () => { C.bgTool = ""; C.bgDup = {}; C.bgToolDup = ""; C.asi2 = ""; C.asi1 = ""; },
    sign: () => { C.signDup = ""; C.signChoice = ""; C.signCantrips = []; C.signSpells = []; },
    classEquip: () => applyPackage() };
  const build = $("#build");
  build.addEventListener("change", (e) => {
    const b = e.target.dataset.bind; if (!b) return;
    let v = e.target.value;
    if (b === "classEquip") v = +v;
    setPath(C, b, v);
    if (RESETS[b]) RESETS[b]();
    refresh(true);
  });
  build.addEventListener("input", (e) => {
    const b = e.target.dataset.bind; if (!b || e.target.tagName === "SELECT") return;
    setPath(C, b, e.target.value);
    refresh(b.startsWith("rolls"));
  });
  build.addEventListener("click", (e) => {
    const t = e.target.closest("button"); if (!t) return;
    if (t.dataset.method) { C.method = t.dataset.method; refresh(true); }
    if (t.dataset.asi) { C.asiMode = t.dataset.asi; refresh(true); }
    if (t.dataset.pt) { const a = t.dataset.pt, v = Math.min(15, Math.max(8, (C.points[a] || 8) + +t.dataset.d)); C.points[a] = v; refresh(true); }
    if (t.dataset.hproll) { const cls = byId(D.classes, C.cls), n = +t.dataset.hproll; if (cls) { setPath(C, `lv.${n}.hpRoll`, 1 + Math.floor(Math.random() * cls.hitDie)); refresh(true); } }
    if (t.id === "rollBtn") {
      const d6 = () => 1 + Math.floor(Math.random() * 6);
      C.rolls = Array.from({ length: 6 }, () => { const r = [d6(), d6(), d6(), d6()].sort((x, y) => y - x); return r[0] + r[1] + r[2]; });
      C.assign = {}; refresh(true);
    }
  });
  build.addEventListener("toggle", (e) => {
    const d = e.target; if (!d.dataset?.step) return;
    d.open ? openSteps.add(d.dataset.step) : openSteps.delete(d.dataset.step);
    store.set("op-open", JSON.stringify([...openSteps]));
  }, true);

  // Clear picks that a later choice has made impossible, so the player chooses again.
  function sanitize() {
    const race = byId(D.races, C.race), bg = byId(D.backgrounds, C.bg), cls = byId(D.classes, C.cls), sign = byId(D.signs, C.sign);
    const nm = (s) => s.toLowerCase().replace(/\bcolor\b/, "colour").replace(/[^a-z]/g, "");
    const fit = (arr, list, blocked = []) => { const seen = new Set(blocked); return arr.map((s) => { const m = s && list.find((x) => nm(x) === nm(s)); if (!m || seen.has(m)) return ""; seen.add(m); return m; }); };
    C.level = LV();
    if (C.invocation && !C.invocations.filter(Boolean).length) { C.invocations = [C.invocation]; C.invocation = ""; }  // older saves had one typed invocation
    if (cls?.cast) {
      const levelled = flatNames(castable(cls.cast.list, maxSpellLevel(cls), alwaysNow(cls)));
      C.cantrips = fit(C.cantrips, spellList(cls.cast.list, "cantrips"), race?.spells?.cantrips || []);
      C.spellbook = fit(C.spellbook, levelled);
      C.prepared = fit(C.prepared, castSpellbook(cls) ? C.spellbook.slice(0, castSpellbook(cls)).filter(Boolean) : levelled, [C.raceSpell, ...(sign?.spells || []).map((s) => s[0])].filter(Boolean));
    }
    if (C.subclass && cls && !(D.subclasses[cls.name] || []).some((s) => s.name === C.subclass)) C.subclass = "";
    (C.lv || []).forEach((d) => { if (!d) return; const f = D.feats.find((x) => x.name === d.asi);
      if (d.asi && d.asi !== "asi" && (!f || (f.cat === "Fighting Style" && !hasStyleFeature(cls)))) { d.asi = ""; d.featAb = ""; }
      if (f && d.featAb && f.ab !== "any" && !(f.ab || []).includes(d.featAb)) d.featAb = "";
      if (d.a2 && d.a2 === d.a1) d.a2 = ""; });
    C.metamagic = C.metamagic.map((x, i) => (x && C.metamagic.indexOf(x) !== i ? "" : x));
    if (sign?.cantripChoice) C.signCantrips = fit(C.signCantrips, spellList(sign.cantripChoice.list, "cantrips"), [...(race?.spells?.cantrips || []), ...C.cantrips.filter(Boolean)]);
    if (sign?.extraSlots && !cls?.cast) C.signSpells = fit(C.signSpells, spellList(sign.noncasterList, "1"), [C.raceSpell, ...(sign.spells || []).map((s) => s[0])].filter(Boolean));
    const early = new Set([...(race?.skills?.fixed || []), ...C.raceSkills.filter(Boolean)]);
    (bg?.skills || []).forEach((s) => early.add(early.has(s) ? C.bgDup[s] : s));
    C.clsSkills = C.clsSkills.map((s) => (s && (early.has(s) || !cls?.skillChoices.from.includes(s)) ? "" : s));
    C.langs = C.langs.map((l) => (l && !D.languages.includes(l) ? "" : l));  // e.g. Dwemeris, now learned in play
    if (C.langExtra && !D.languages.includes(C.langExtra)) C.langExtra = "";
    const sk = skillState().src;
    if (C.primal && Object.entries(sk).some(([s, from]) => s === C.primal && from !== "Primal Knowledge")) C.primal = "";
    C.expertise = C.expertise.map((s) => (s && !sk[s] ? "" : s));
    const P = prof();
    C.mastery = C.mastery.map((w) => { const x = D.weapons.find((y) => y.name === w); return w && (!x || !weaponProf(x, P)) ? "" : w; });
  }
  function refresh(rebuild) { if (rebuild) sanitize(); if (rebuild) renderBuild(); renderSheet(); renderWho(); save(); }
  function renderWho() {
    $("#who").innerHTML = chars.map((c) => opt(c.id, c.name || "Unnamed outlander", c.id === C.id)).join("");
  }
  $("#who").addEventListener("change", (e) => { C = chars.find((c) => c.id === e.target.value) || C; refresh(true); });
  $("#newBtn").addEventListener("click", () => { C = blank(); chars.push(C); refresh(true); window.scrollTo(0, 0); });
  $("#lvlBtn").addEventListener("click", () => {
    if (!C.cls) return toast("Choose a class first");
    if (LV() >= MAX_LEVEL) return toast(`Levels above ${MAX_LEVEL} aren't in the builder yet`);
    C.level = LV() + 1; openSteps.add(`L${C.level}`); store.set("op-open", JSON.stringify([...openSteps])); refresh(true);
    const card = $(`[data-step="L${C.level}"]`); if (card) card.scrollIntoView({ block: "start", behavior: "smooth" });
    toast(`Level ${C.level}`);
  });
  let delArmed = false;
  $("#delBtn").addEventListener("click", (e) => {
    if (!delArmed) { delArmed = true; e.target.textContent = "Delete? Tap again"; setTimeout(() => { delArmed = false; e.target.textContent = "Delete"; }, 3500); return; }
    delArmed = false; e.target.textContent = "Delete";
    chars = chars.filter((c) => c !== C); if (!chars.length) chars = [blank()]; C = chars[0]; refresh(true); toast("Deleted");
  });
  const toast = (m) => { const t = $("#toast"); t.textContent = m; clearTimeout(toast.t); toast.t = setTimeout(() => (t.textContent = ""), 2500); };
  async function copy(text, done) {
    try { await navigator.clipboard.writeText(text); toast(done); }
    catch (e) { openDialog("Copy this text:", text, false); }
  }
  $("#copyBtn").addEventListener("click", () => copy(sheetText(), "Sheet copied"));
  $("#codeBtn").addEventListener("click", () => {
    const code = "OP1:" + btoa(unescape(encodeURIComponent(JSON.stringify(C))));
    openDialog("This code holds your whole character. Keep it somewhere safe, or send it to your DM. Paste it into Load code on any device to bring the character back.", code, false);
    copy(code, "Code copied");
  });
  $("#loadBtn").addEventListener("click", () => openDialog("Paste a save code here.", "", true));
  const dlg = $("#dlg");
  function openDialog(text, value, loading) {
    $("#dlgText").textContent = text; $("#dlgArea").value = value; $("#dlgOk").hidden = !loading;
    if (typeof dlg.showModal === "function") dlg.showModal(); else dlg.setAttribute("open", "");
    if (!loading) $("#dlgArea").select();
  }
  $("#dlgForm").addEventListener("submit", (e) => {
    const v = e.submitter?.value;
    if (v === "ok") {
      try {
        const raw = $("#dlgArea").value.trim().replace(/^OP1:/, "");
        const c = Object.assign(blank(), JSON.parse(decodeURIComponent(escape(atob(raw)))));
        c.id = "c" + Date.now().toString(36); chars.push(c); C = c; refresh(true); toast("Character loaded");
      } catch (err) { e.preventDefault(); $("#dlgText").textContent = "That code didn't work. Check you copied all of it, starting with OP1:"; return; }
    }
    dlg.close?.(); dlg.removeAttribute("open");
  });
  if (CONFIG.print) { $("#printBtn").hidden = false; $("#printBtn").addEventListener("click", () => window.print()); }
  document.querySelectorAll(".tabs button").forEach((b) => b.addEventListener("click", () => {
    $("#grid").dataset.tab = b.dataset.tab;
    document.querySelectorAll(".tabs button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    window.scrollTo(0, 0);
  }));

  refresh(true);
})();
</script>

</body>
</html>
