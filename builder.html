<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Outlander's Papers</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Almendra:ital,wght@0,400;0,700;1,400&family=Almendra+SC&family=Cinzel+Decorative:wght@700&family=Fondamento:ital@0;1&display=swap">
<style>
/* Layout: release papers from the Census and Excise Office. Choices on the left, in the guide's order; the finished sheet on the right. */
:root {
  --paper: #F4EAD5; --paper-2: #EBDDBF; --paper-3: #FBF5E8;
  --ink: #2B1B0E; --ink-2: #6A5440; --rule: #D5C19A;
  --red: #6B1D10; --brown: #5A2E12; --gold: #8C6A2F;
  --wash: #E5D2AC; --stripe: rgba(140, 106, 47, 0.07); --warn: #9A3412; --ok: #3F6212;
  --f-display: "Cinzel Decorative", "Almendra", Georgia, serif;
  --f-head: "Almendra", Georgia, "Times New Roman", serif;
  --f-sc: "Almendra SC", "Almendra", Georgia, serif;
  --f-body: "Fondamento", Georgia, "Times New Roman", serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #17110C; --paper-2: #1F1710; --paper-3: #241B13; --ink: #E9DCC2; --ink-2: #B5A07F; --rule: #4A3826;
  --red: #E48D72; --brown: #E3C08B; --gold: #C9A25A; --wash: #34261A; --stripe: rgba(201, 162, 90, 0.06); --warn: #F0A27A; --ok: #A3C46B; color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #17110C; --paper-2: #1F1710; --paper-3: #241B13; --ink: #E9DCC2; --ink-2: #B5A07F; --rule: #4A3826;
  --red: #E48D72; --brown: #E3C08B; --gold: #C9A25A; --wash: #34261A; --stripe: rgba(201, 162, 90, 0.06); --warn: #F0A27A; --ok: #A3C46B; color-scheme: dark; }

body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.5; }
a { color: var(--red); }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 3px; }
button, input, select, textarea { font: inherit; color: inherit; }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

header.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--paper-2); border-bottom: 1px solid var(--rule); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--paper-2); }
header.bar .in { display: flex; flex-wrap: wrap; gap: 0.5rem 0.8rem; align-items: center; padding-block: 0.55rem; max-width: 92rem; margin: 0 auto; }
.brand { font-family: var(--f-display); color: var(--red); font-size: 1.15rem; line-height: 1.1; margin-right: auto; text-decoration: none; }
.brand small { display: block; font-family: var(--f-head); font-style: italic; color: var(--ink-2); font-size: 0.75rem; }
.bar select { max-width: 12rem; }
.btn { border: 1px solid var(--gold); background: var(--paper-3); border-radius: 6px; padding: 0.28rem 0.7rem; cursor: pointer; font-family: var(--f-sc); font-size: 0.82rem; color: var(--brown); }
.btn:hover { background: var(--wash); }
.btn.primary { background: var(--brown); color: var(--paper); border-color: var(--brown); }
.btn.danger { color: var(--warn); border-color: var(--warn); }
.toast { font-family: var(--f-sc); font-size: 0.8rem; color: var(--ok); min-width: 4rem; }
.bar .tabs { display: none; }

main.grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 1.5rem; max-width: 92rem; margin: 0 auto; padding-block: 1.2rem 4rem; }
.col { min-width: 0; }
.sheetcol { position: sticky; top: 4.5rem; align-self: start; max-height: calc(100vh - 5.5rem); overflow-y: auto; padding-right: 0.2rem; }

/* Builder steps */
details.step { background: var(--paper-3); border: 1px solid var(--rule); border-radius: 10px; margin-bottom: 0.8rem; }
details.step > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 0.7rem; padding: 0.7rem 1rem; }
details.step > summary::-webkit-details-marker { display: none; }
.sn { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 1.8rem; height: 1.8rem; border-radius: 999px; border: 1.5px solid var(--gold);
  color: var(--red); font-family: var(--f-sc); font-size: 0.9rem; }
.step.done .sn { background: var(--gold); color: var(--paper); }
.st { font-family: var(--f-head); color: var(--brown); font-size: 1.2rem; flex: 1; min-width: 0; }
.st small { display: block; font-family: var(--f-body); font-size: 0.82rem; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.body { padding: 0 1rem 1rem; display: flex; flex-direction: column; gap: 0.8rem; }
.guide { font-family: var(--f-sc); font-size: 0.78rem; }
.row { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 13rem), 1fr)); gap: 0.6rem 0.8rem; }
label.f { display: flex; flex-direction: column; gap: 0.2rem; font-family: var(--f-sc); font-size: 0.8rem; color: var(--gold); letter-spacing: 0.02em; min-width: 0; }
select, input[type=text], input[type=number], textarea { background: var(--paper); border: 1px solid var(--rule); border-radius: 6px; padding: 0.35rem 0.5rem;
  font-family: var(--f-body); font-size: 0.95rem; color: var(--ink); min-width: 0; width: 100%; box-sizing: border-box; letter-spacing: 0; }
textarea { min-height: 3.2rem; resize: vertical; }
select:focus, input:focus, textarea:focus { border-color: var(--gold); outline: none; box-shadow: 0 0 0 2px color-mix(in srgb, var(--gold) 35%, transparent); }
.note { font-size: 0.88rem; color: var(--ink-2); }
.warn { font-size: 0.86rem; color: var(--warn); }
.card { border-left: 3px solid var(--gold); background: var(--paper); padding: 0.5rem 0.8rem; border-radius: 0 6px 6px 0; font-size: 0.92rem; }
.card p { margin: 0 0 0.35rem; } .card p:last-child { margin: 0; } .card ul { margin: 0.2rem 0 0.4rem; padding-left: 1.2rem; }
.card b { color: var(--brown); }
.traits { display: flex; flex-direction: column; gap: 0.3rem; }
.traits details { font-size: 0.9rem; } .traits summary { cursor: pointer; font-family: var(--f-head); color: var(--brown); }
.traits details > div { padding: 0.2rem 0 0.3rem 1rem; } .traits p { margin: 0 0 0.3rem; } .traits ul { margin: 0 0 0.3rem; padding-left: 1.2rem; }
.seg { display: inline-flex; border: 1px solid var(--gold); border-radius: 8px; overflow: hidden; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 0.3rem 0.8rem; cursor: pointer; font-family: var(--f-sc); font-size: 0.85rem; color: var(--brown); }
.seg button[aria-pressed="true"] { background: var(--brown); color: var(--paper); }
.scores { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 0.4rem; }
.sc { border: 1px solid var(--rule); border-radius: 8px; padding: 0.4rem 0.3rem; text-align: center; background: var(--paper); display: flex; flex-direction: column; gap: 0.2rem; align-items: stretch; min-width: 0; }
.sc .ab { font-family: var(--f-sc); color: var(--red); font-size: 0.85rem; }
.sc .pb { display: flex; align-items: center; justify-content: center; gap: 0.25rem; }
.sc .pb button { width: 1.6rem; height: 1.6rem; border-radius: 999px; border: 1px solid var(--gold); background: var(--paper-3); cursor: pointer; color: var(--brown); padding: 0; line-height: 1; }
.sc .v { font-family: var(--f-head); font-size: 1.3rem; }
.sc .fin { font-size: 0.78rem; color: var(--ink-2); }
.rolls { display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: center; }
.rolls input { width: 3.6rem; text-align: center; }
.pill { display: inline-block; border: 1px solid var(--rule); border-radius: 999px; padding: 0 0.55rem; font-size: 0.82rem; margin: 0.1rem 0.15rem 0.1rem 0; background: var(--paper); }
.chk { display: flex; gap: 0.4rem; align-items: center; font-size: 0.92rem; }

/* The sheet */
.sheet { background: var(--paper-3); border: 1px solid var(--gold); border-radius: 10px; padding: 1rem 1.1rem 1.2rem; }
.sheet h2 { font-family: var(--f-display); color: var(--red); font-size: 1.45rem; margin: 0; line-height: 1.15; text-wrap: balance; overflow-wrap: anywhere; }
.sheet .who { font-family: var(--f-head); font-style: italic; color: var(--ink-2); margin: 0.15rem 0 0.7rem; }
.sheet h3 { font-family: var(--f-sc); color: var(--red); font-weight: 400; font-size: 0.95rem; letter-spacing: 0.04em; border-bottom: 1px solid var(--gold); margin: 1rem 0 0.45rem; padding-bottom: 0.15rem; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(5.2rem, 1fr)); gap: 0.4rem; }
.stat { border: 1px solid var(--rule); border-radius: 8px; text-align: center; padding: 0.35rem 0.2rem; background: var(--paper); }
.stat b { display: block; font-family: var(--f-head); font-size: 1.35rem; color: var(--ink); font-weight: 400; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat span { font-family: var(--f-sc); font-size: 0.7rem; color: var(--gold); letter-spacing: 0.03em; }
.abil { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 0.35rem; }
.ab6 { border: 1px solid var(--rule); border-radius: 8px; text-align: center; padding: 0.3rem 0.1rem; background: var(--paper); }
.ab6 .n { font-family: var(--f-sc); color: var(--red); font-size: 0.75rem; }
.ab6 .m { font-family: var(--f-head); font-size: 1.35rem; line-height: 1.05; }
.ab6 .s { font-size: 0.78rem; color: var(--ink-2); }
.ab6 .sv { font-size: 0.72rem; color: var(--ink-2); border-top: 1px dotted var(--rule); margin-top: 0.2rem; padding-top: 0.1rem; }
.ab6 .sv.p { color: var(--red); }
.two { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); gap: 1rem; }
.skills { list-style: none; margin: 0; padding: 0; font-size: 0.88rem; columns: 1; }
.skills li { display: flex; gap: 0.45rem; align-items: baseline; padding: 0.05rem 0; border-bottom: 1px dotted var(--rule); }
.skills .dot { width: 0.6rem; height: 0.6rem; border-radius: 999px; border: 1px solid var(--gold); flex: none; transform: translateY(0.05rem); }
.skills .dot.p { background: var(--gold); } .skills .dot.e { background: var(--red); border-color: var(--red); }
.skills .b { font-variant-numeric: tabular-nums; min-width: 2rem; text-align: right; font-family: var(--f-head); }
.skills .a { font-family: var(--f-sc); font-size: 0.7rem; color: var(--ink-2); margin-left: auto; }
.kv { font-size: 0.9rem; margin: 0 0 0.35rem; } .kv b { font-family: var(--f-sc); font-weight: 400; color: var(--gold); font-size: 0.78rem; letter-spacing: 0.03em; margin-right: 0.3rem; }
table.atk { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
table.atk th { font-family: var(--f-sc); font-weight: 400; color: var(--brown); text-align: left; background: var(--wash); padding: 0.25rem 0.4rem; }
table.atk td { padding: 0.25rem 0.4rem; border-top: 1px solid var(--rule); vertical-align: top; font-variant-numeric: tabular-nums; }
.feat { font-size: 0.88rem; margin: 0 0 0.3rem; } .feat b { font-family: var(--f-head); color: var(--brown); font-weight: 400; }
.sheet .src { font-family: var(--f-sc); font-size: 0.68rem; color: var(--ink-2); }

/* Sheet layout follows the 2024 character sheet: who you are and how tough you are across the top, abilities with their
   saves and skills on the left, fighting gear and features on the right; spells and story on page two. */
.sheet { container-type: inline-size; padding: 0.8rem; }
.cs-pg { display: grid; gap: 0.55rem; }
.cs-p1 { grid-template-areas: "who" "tough" "left" "right"; }
.cs-p2 { grid-template-areas: "spells" "beneath"; margin-top: 0.9rem; padding-top: 0.7rem; border-top: 2px dashed var(--rule); }
@container (min-width: 600px) {
  .cs-p1 { grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); grid-template-areas: "who tough" "left right"; }
  .cs-p2 { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); grid-template-areas: "spells beneath"; }
  .cs-feat2 { columns: 2; column-gap: 1rem; }
}
.cs-who { grid-area: who; } .cs-tough { grid-area: tough; } .cs-left { grid-area: left; } .cs-right { grid-area: right; }
.cs-spells { grid-area: spells; } .cs-beneath { grid-area: beneath; }
.cs-left, .cs-right, .cs-spells, .cs-beneath { display: flex; flex-direction: column; gap: 0.55rem; min-width: 0; }
.cs-box { border: 1px solid var(--rule); border-radius: 8px; background: var(--paper); padding: 0.4rem 0.55rem 0.5rem; min-width: 0; }
.cs-h { display: block; font-family: var(--f-sc); color: var(--red); font-size: 0.74rem; letter-spacing: 0.05em; text-align: center; border-bottom: 1px solid var(--rule); margin: -0.05rem -0.2rem 0.35rem; padding-bottom: 0.15rem; }
.cs-l { display: block; font-family: var(--f-sc); font-size: 0.62rem; color: var(--gold); letter-spacing: 0.04em; line-height: 1.2; }
.cs-v { font-family: var(--f-head); font-size: 0.95rem; color: var(--ink); min-height: 1.2em; overflow-wrap: anywhere; }
.cs-who h2 { margin-bottom: 0.1rem; }
.cs-idgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.3rem 0.5rem; margin-top: 0.35rem; }
.cs-idgrid > div { border-bottom: 1px solid var(--rule); padding-bottom: 0.1rem; }
/* armour class on the left; hit points across the top; hit dice and death saves beneath */
.cs-tough { display: grid; grid-template-columns: 4.8rem minmax(0, 1fr) minmax(0, 1fr); grid-template-areas: "ac hp hp" "ac hd ds"; gap: 0.4rem; align-items: stretch; }
.cs-tough .cs-ac { grid-area: ac; } .cs-tough .cs-hp { grid-area: hp; } .cs-tough .cs-hd { grid-area: hd; } .cs-tough .cs-dsv { grid-area: ds; }
@container (max-width: 420px) { .cs-idgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.stat b.cs-txt { font-size: 1rem; padding-top: 0.3rem; }
.cs-ac { position: relative; display: grid; place-items: center; min-height: 5rem; }
.cs-ac svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.cs-ac div { position: relative; text-align: center; padding-bottom: 0.5rem; }
.cs-ac b { display: block; font-family: var(--f-head); font-size: 1.6rem; font-weight: 400; line-height: 1; }
.cs-trio { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.25rem; text-align: center; }
.cs-duo { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.25rem; text-align: center; }
.cs-num { font-family: var(--f-head); font-size: 1.35rem; line-height: 1.15; font-variant-numeric: tabular-nums; min-height: 1.5rem; }
.cs-blank { border-bottom: 1px solid var(--rule); min-height: 1.5rem; }
.cs-ds { font-size: 0.78rem; display: flex; justify-content: space-between; gap: 0.3rem; align-items: center; flex-wrap: nowrap; }
.cs-ds > span:last-child { white-space: nowrap; }
.cs-ds i { display: inline-block; width: 0.65rem; height: 0.65rem; border: 1px solid var(--gold); border-radius: 999px; margin-left: 0.15rem; }
.cs-abil { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.45rem; align-items: start; }
.cs-abcol { display: flex; flex-direction: column; gap: 0.45rem; min-width: 0; }
.cs-pb { display: flex; align-items: center; gap: 0.5rem; }
.cs-pb .cs-num { border: 1.5px solid var(--gold); border-radius: 999px; width: 2.6rem; height: 2.6rem; display: grid; place-items: center; flex: none; }
.ab6 { text-align: left; padding: 0.35rem 0.45rem 0.4rem; background: var(--paper); border: 1px solid var(--rule); border-radius: 8px; }
.ab6 .n { display: block; text-align: center; font-family: var(--f-sc); color: var(--red); font-size: 0.74rem; letter-spacing: 0.05em; }
.ab6 .ms { display: flex; justify-content: center; align-items: end; gap: 0.35rem; margin: 0.1rem 0 0.25rem; }
.ab6 .m { font-family: var(--f-head); font-size: 1.55rem; line-height: 1; border: 1.5px solid var(--gold); border-radius: 8px; min-width: 2.7rem; text-align: center; padding: 0.15rem 0.2rem; }
.ab6 .s { font-size: 0.8rem; color: var(--ink-2); border: 1px solid var(--rule); border-radius: 999px; min-width: 1.9rem; text-align: center; padding: 0 0.2rem; }
.ab6 .skills { font-size: 0.78rem; }
.ab6 .skills li { gap: 0.35rem; }
.ab6 .skills li.sv { border-bottom: 1px solid var(--gold); font-family: var(--f-sc); font-size: 0.74rem; }
.ab6 .skills .b { min-width: 1.6rem; }
.cs-insp { display: flex; align-items: center; gap: 0.45rem; }
.cs-insp i { display: inline-block; width: 1.1rem; height: 1.1rem; border: 1.5px solid var(--gold); border-radius: 3px; }
.cs-train { font-size: 0.8rem; display: flex; flex-wrap: wrap; gap: 0.15rem 0.6rem; margin-bottom: 0.2rem; }
.cs-train i { display: inline-block; width: 0.7rem; height: 0.7rem; border: 1px solid var(--gold); border-radius: 2px; margin-right: 0.2rem; vertical-align: -0.05rem; }
.cs-train i.on { background: var(--gold); }
.cs-quad { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0.4rem; text-align: center; }
.cs-pair { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 9.5rem), 1fr)); gap: 0.55rem; }
.cs-box .feat { font-size: 0.82rem; margin: 0 0 0.2rem; break-inside: avoid; }
.cs-box .kv { font-size: 0.82rem; margin: 0 0 0.25rem; }
.cs-box table.atk { font-size: 0.82rem; }
.cs-box table.atk th { font-size: 0.72rem; }
.cs-slots { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 0.2rem; text-align: center; }
.cs-slots div { border: 1px solid var(--rule); border-radius: 6px; padding: 0.1rem 0; }
.cs-slots .cs-num { font-size: 1rem; min-height: 0; }
.cs-slots .ex { font-size: 0.6rem; letter-spacing: 0.08em; color: var(--ink-2); min-height: 0.8rem; }
.cs-slots .off { opacity: 0.4; }
.cs-lines { min-height: 3.4rem; background: repeating-linear-gradient(to bottom, transparent 0 1.25rem, var(--rule) 1.25rem calc(1.25rem + 1px)); }
.cs-coins { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0.25rem; text-align: center; }
.cs-coins div { border: 1px solid var(--rule); border-radius: 6px; }
.cs-pagehead { font-family: var(--f-sc); font-size: 0.7rem; color: var(--ink-2); letter-spacing: 0.06em; text-align: right; margin: 0 0 -0.2rem; }
.empty { color: var(--ink-2); font-style: italic; font-size: 0.9rem; }
dialog { border: 1px solid var(--gold); border-radius: 10px; background: var(--paper-3); color: var(--ink); max-width: min(34rem, 92vw); }
dialog::backdrop { background: rgba(20, 12, 6, 0.5); }
dialog textarea { min-height: 8rem; font-family: ui-monospace, monospace; font-size: 0.8rem; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

@media (max-width: 860px) {
  main.grid { grid-template-columns: minmax(0, 1fr); }
  .sheetcol { position: static; max-height: none; overflow: visible; }
  .bar .tabs { display: inline-flex; }
  main.grid[data-tab="build"] .sheetcol, main.grid[data-tab="sheet"] .buildcol { display: none; }
}
/* two columns, but a narrow sheet (also inside the compendium on smaller laptops) */
@media (min-width: 861px) and (max-width: 1020px) {
  .abil { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .two { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 560px) {
  .scores, .abil { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .two { grid-template-columns: minmax(0, 1fr); }
  .brand { font-size: 1rem; }
  header.bar { position: static; }
  .brand small { display: none; }
}
@media print {
  header.bar, .buildcol, body::before { display: none !important; }
  main.grid { display: block; padding: 0; }
  .sheetcol { position: static; max-height: none; overflow: visible; display: block !important; }  /* paper is narrower than the two-column breakpoint, so the Build/Sheet tab rule would hide it */
  .sheet { border: 0; padding: 0; background: none; }
  .cs-p2 { break-before: page; border-top: 0; margin-top: 0; }
  .cs-box, .ab6 { break-inside: avoid; }
  body { background: #fff; color: #000; }
}
</style>


</head>
<body>
<header class="bar"><div class="in wrap">
  <a class="brand" href="#">Outlander's Papers<small>Character builder for the Vvardenfell campaign · 3E 417</small></a>
  <label class="sr" for="who">Character</label>
  <select id="who"></select>
  <button class="btn" type="button" id="newBtn">New</button>
  <button class="btn primary" type="button" id="lvlBtn">Level up</button>
  <button class="btn" type="button" id="copyBtn">Copy sheet</button>
  <button class="btn" type="button" id="codeBtn">Save code</button>
  <button class="btn" type="button" id="loadBtn">Load code</button>

"name": "The Lover",
"month": "Sun's Dawn (February)",
"guardian": "Thief",
"brief": "A stunning touch and a graceful skill",
"flavour": "Those born under the Lover are graceful and passionate. Their touch can stop a person in their tracks, at some cost to themselves.",
"traits": [
{
"name": "Lover's Kiss",
"text": "<p>As a Magic action, you can touch a creature within reach. It must make a Wisdom saving throw against your birthsign save DC. On a failure, it has the Incapacitated condition and its Speed is 0 until the end of its next turn. Afterward, you have Disadvantage on attack rolls until the end of your next turn. Once you use this trait, you can't do so again until you finish a long rest.<\/p>"
},
{
"name": "Lover's Grace",
"text": "<p>You have proficiency in your choice of Acrobatics or Performance.<\/p>"
}
],

{
"id": "shadow",
"name": "The Shadow",
"month": "Second Seed (May)",
"guardian": "Thief",
"brief": "Brief invisibility",
"flavour": "Those born under the Shadow can hide in plain sight, wrapping themselves in darkness when they need to.",
"traits": [
{
"name": "Moonshadow",
"text": "<p>As a Bonus Action, you can give yourself the Invisible condition until the end of your next turn. It ends early if you make an attack roll, deal damage or cast a spell. Once you use this trait, you can't do so again until you finish a short or long rest.<\/p>"
}
]
},
{

"month": "Frostfall (October)",
"guardian": "Thief",
"brief": "Opening locks and detecting magic",
"flavour": "Those born under the Tower have a nose for gold and a way with locks. Few doors stay closed to them.",

{
"id": "serpent",
"name": "The Serpent",
"month": "None",
"guardian": "None",
"brief": "Poisonous touches that hurt you too; shrugging off ailments",
"flavour": "The Serpent wanders the sky with no season and no master. Those born under it are said to be both the most blessed and the most cursed of all. Its gift is poison, and it never comes free.",
"traits": [
{
"name": "Star-Curse",
"text": "<p>As a Magic action, you can touch a creature within reach. It must make a Constitution saving throw against your birthsign save DC. On a failure, it takes 3d6 Poison damage and has the Poisoned condition for 1 minute; it repeats the save at the end of each of its turns, ending the condition on a success. On a success, it takes half as much damage and isn't Poisoned. This damage ignores Resistance to Poison damage. You can use this trait a number of times equal to your Proficiency Bonus, and you regain all expended uses when you finish a long rest.<\/p><p>The damage increases by 1d6 when you reach levels 5 (4d6), 11 (5d6) and 17 (6d6).<\/p>"
},
{
"name": "Shed Skin",
"text": "<p>As a Bonus Action, you can end the Poisoned condition on yourself, along with one of these: the Charmed condition, the Frightened condition, or one spell of level 3 or lower that's affecting you. Once you use this trait, you can't do so again until you finish a long rest.<\/p>"
},
{
"name": "Serpent's Price",
"text": "<p>When you use Star-Curse, you take Poison damage equal to your Proficiency Bonus. This damage can't be reduced or prevented in any way.<\/p>"
}
]
}

<script>

  const HOST = (() => { try { return window.parent !== window && typeof window.parent.compendiumGo === "function" ? window.parent : null; } catch (e) { return null; } })();

    const root = HOST.document.documentElement;

    syncTheme(); new MutationObserver(syncTheme).observe(root, { attributes: true, attributeFilter: ["data-theme"] });
    document.addEventListener("click", (e) => { const a = e.target.closest("a[data-guide]"); if (a) { e.preventDefault(); HOST.compendiumGo(a.dataset.guide); } });
  }

  const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
  const AB = ["Str", "Dex", "Con", "Int", "Wis", "Cha"];
  const ABN = { Str: "Strength", Dex: "Dexterity", Con: "Constitution", Int: "Intelligence", Wis: "Wisdom", Cha: "Charisma" };
  const STANDARD = [15, 14, 13, 12, 10, 8];
  const COST = { 8: 0, 9: 1, 10: 2, 11: 3, 12: 4, 13: 5, 14: 7, 15: 9 };
  let PB = 2;  // set from the character's level at the start of each calculation
  const MAX_LEVEL = 5;
  const SKILL_AB = Object.fromEntries(D.skills.map((s) => [s.name, s.ab]));
  const ALL_SKILLS = D.skills.map((s) => s.name);
  const byId = (list, id) => list.find((x) => x.id === id);
  const mod = (s) => Math.floor((s - 10) / 2);
  const sgn = (n) => (n >= 0 ? "+" : "−") + Math.abs(n);
  const OTHER_TOOLS = ["Disguise Kit", "Forgery Kit", "Herbalism Kit", "Navigator's Tools", "Poisoner's Kit", "Thieves' Tools"];
  const ANY_TOOL = [...D.tools.artisan, ...D.tools.instrument, ...D.tools.gaming, ...OTHER_TOOLS];

  // ---------- characters ----------
  const blank = () => ({ id: "c" + Date.now().toString(36), name: "", race: "", raceSkills: [], raceSpell: "", raceAbility: "Int", sword: "",
    cls: "", clsSkills: [], order: "", style: "", expertise: [], invocation: "", clsTools: [], mastery: [], cantrips: [], prepared: [], spellbook: [],
    bg: "", bgTool: "", bgDup: {}, bgToolDup: "", asiMode: "21", asi2: "", asi1: "",
    sign: "", signDup: "", signChoice: "", signAbility: "Int", signCantrips: [], signSpells: [],
    method: "standard", assign: {}, points: { Str: 8, Dex: 8, Con: 8, Int: 8, Wis: 8, Cha: 8 }, rolls: [], langs: ["", ""], langExtra: "",
    level: 1, lv: [], primal: "", deftLangs: [], metamagic: [], invocations: [],
    god: "", subclass: "", alignment: "", classEquip: 0, bgEquip: "package", armour: "", shield: "", weapons: ["", "", "", ""],
    story: { age: "", appearance: "", reason: "", reasonText: "", tie: "", answers: [] } });
  let chars = [];
  try { chars = JSON.parse(store.get("op-chars") || "[]"); } catch (e) { chars = []; }
  if (!Array.isArray(chars) || !chars.length) chars = [blank()];
  chars = chars.map((c) => Object.assign(blank(), c));  // older saves get the newer fields
  let C = chars.find((c) => c.id === store.get("op-current")) || chars[0];
  const save = () => { store.set("op-chars", JSON.stringify(chars)); store.set("op-current", C.id); };

  // ---------- levels ----------
  const LV = () => Math.min(MAX_LEVEL, Math.max(1, +C.level || 1));
  const pbOf = (l) => 2 + Math.floor((l - 1) / 4);
  const at = (arr, l) => (Array.isArray(arr) ? arr[Math.min(arr.length, l) - 1] : arr);
  const lvData = (n) => (C.lv && C.lv[n]) || {};
  const asiLevels = () => [4, 8, 12, 16, 19].filter((n) => n <= LV());
  const featAt = (n) => { const d = lvData(n); return d.asi && d.asi !== "asi" ? D.feats.find((f) => f.name === d.asi) || null : null; };
  const featsTaken = () => asiLevels().map((n) => ({ n, f: featAt(n), d: lvData(n) })).filter((x) => x.f);
  const featMechs = () => featsTaken().map((x) => ({ ...x, m: D.featMech[x.f.name] || {} }));
  const subMech = () => (LV() >= 3 && D.subclassMech[C.subclass]) || {};
  const hasFeat = (name) => featsTaken().some((x) => x.f.name === name);
  const alwaysNow = (cls) => [...(cls?.cast?.always || []), ...Object.entries(cls?.prog?.always || {}).filter(([l]) => +l <= LV()).flatMap(([, s]) => s)];
  const slotRow = (cls) => { const pr = cls?.prog || {}; return pr.slots === "pact" ? null : (pr.slotTable ? at(pr.slotTable, LV()) : [cls?.cast?.slots || 0]); };
  const maxSpellLevel = (cls) => { const pr = cls?.prog || {}; return pr.slots === "pact" ? at(pr.pact.level, LV()) : (slotRow(cls) || [1]).length; };
  const hasStyleFeature = (cls) => !!cls && (cls.style || (cls.prog?.style && LV() >= cls.prog.style));

  // ---------- rules ----------
  function scores() {
    const base = {};
    if (C.method === "pointbuy") AB.forEach((a) => (base[a] = C.points[a] || 8));
    else {
      const pool = C.method === "dice" ? C.rolls.map(Number) : STANDARD;
      AB.forEach((a) => { const i = C.assign[a]; base[a] = i === "" || i == null || pool[i] == null || isNaN(pool[i]) ? null : pool[i]; });
    }
    const bg = byId(D.backgrounds, C.bg), inc = {};
    if (bg) {
      if (C.asiMode === "111") bg.abilities.forEach((a) => (inc[a] = 1));
      else { if (C.asi2) inc[C.asi2] = 2; if (C.asi1 && C.asi1 !== C.asi2) inc[C.asi1] = (inc[C.asi1] || 0) + 1; }
    }
    const lvInc = {};  // Ability Score Improvements and feats from levels 4, 8...
    asiLevels().forEach((n) => { const d = lvData(n); if (!d.asi) return;
      if (d.asi === "asi") { if (d.asiMode === "11") [d.a1, d.a2].forEach((a) => { if (a) lvInc[a] = (lvInc[a] || 0) + 1; }); else if (d.a1) lvInc[d.a1] = (lvInc[d.a1] || 0) + 2; }
      else if (d.featAb) lvInc[d.featAb] = (lvInc[d.featAb] || 0) + 1; });
    const fin = {};
    AB.forEach((a) => (fin[a] = base[a] == null ? null : Math.min(20, base[a] + (inc[a] || 0) + (lvInc[a] || 0))));
    return { base, inc, lvInc, fin, m: Object.fromEntries(AB.map((a) => [a, fin[a] == null ? 0 : mod(fin[a])])) };
  }

  // Skills, in order of precedence: people, background, class choices, birthsign.
  function skillState() {
    const race = byId(D.races, C.race), cls = byId(D.classes, C.cls), bg = byId(D.backgrounds, C.bg), sign = byId(D.signs, C.sign);
    const src = {}; const add = (s, from) => { if (s && !src[s]) src[s] = from; };
    (race?.skills?.fixed || []).forEach((s) => add(s, race.short));
    C.raceSkills.forEach((s) => add(s, race?.short));
    const bgDups = [];
    (bg?.skills || []).forEach((s) => { if (src[s]) { bgDups.push(s); add(C.bgDup[s], bg.name); } else add(s, bg.name); });
    C.clsSkills.forEach((s) => add(s, cls?.name));
    if (cls?.id === "barbarian" && LV() >= 3) add(C.primal, "Primal Knowledge");
    let signDup = null;
    (sign?.skills?.fixed || []).forEach((s) => { if (src[s]) { signDup = s; add(C.signDup, sign.name); } else add(s, sign.name); });
    if (sign?.skills?.choose) add(C.signChoice, sign.name);
    return { src, bgDups, signDup };
  }

  function prof() {
    const race = byId(D.races, C.race), cls = byId(D.classes, C.cls), bg = byId(D.backgrounds, C.bg), sign = byId(D.signs, C.sign);
    const armor = new Set([...(cls?.armor || []), ...(race?.armor || [])]);
    const weapons = new Set(cls?.weapons || []);
    if (C.order === "protector") { armor.add("Heavy"); weapons.add("Martial"); }
    if (C.order === "warden") { armor.add("Medium"); weapons.add("Martial"); }
    const sm = subMech(); (sm.armor || []).forEach((a) => armor.add(a)); (sm.weapons || []).forEach((w) => weapons.add(w));
    featMechs().forEach(({ m }) => { (m.armor || []).forEach((a) => armor.add(a)); (m.weapons || []).forEach((w) => weapons.add(w)); });
    // race weapons the class already covers (a dagger for anyone, a shortsword for a rogue) aren't listed twice
    (race?.weapons || []).forEach((n) => { const w = D.weapons.find((x) => x.name === n); if (!w || !weaponProf(w, { weapons })) weapons.add(n); });
    const tools = [];
    const addT = (t, from) => { if (t && !tools.find((x) => x.t === t)) tools.push({ t, from }); };
    (race?.tools || []).forEach((t) => addT(t, race.short));
    (sign?.tools || []).forEach((t) => addT(t, sign.name));
    (cls?.tools || []).forEach((t) => { if (typeof t === "string") addT(t, cls.name); });
    C.clsTools.forEach((t) => addT(t, cls?.name));
    const bgTool = bg ? (bg.tool || C.bgTool) : "";
    let bgToolDup = false;
    if (bgTool) { if (tools.find((x) => x.t === bgTool)) { bgToolDup = true; addT(C.bgToolDup, bg.name); } else addT(bgTool, bg.name); }
    const langs = ["Tamrielic", ...C.langs.filter(Boolean)];
    if (cls?.id === "druid") langs.push("Druidic");
    if (cls?.extraLanguage) { langs.push("Thieves' Cant"); if (C.langExtra) langs.push(C.langExtra); }
    if (cls?.prog?.deftLangs && LV() >= 2) C.deftLangs.filter(Boolean).forEach((l) => langs.push(l));
    return { armor, weapons, tools, bgTool, bgToolDup, langs };
  }
  const weaponProf = (w, P) => {
    if (P.weapons.has(w.cat)) return true;
    if (P.weapons.has(w.name)) return true;
    if (w.cat === "Martial" && P.weapons.has("Martial (Light)") && /Light/.test(w.props)) return true;
    if (w.cat === "Martial" && P.weapons.has("Martial (Finesse or Light)") && /Finesse|Light/.test(w.props)) return true;
    return false;
  };
  const armourProf = (a, P) => P.armor.has(a.cat[0].toUpperCase() + a.cat.slice(1));

  function derive() {
    PB = pbOf(LV());
    const S = scores(), sk = skillState(), P = prof();
    const race = byId(D.races, C.race), cls = byId(D.classes, C.cls), sign = byId(D.signs, C.sign);
    const m = S.m, pr = cls?.prog || {}, L = LV(), sm = subMech();
    const exp = C.expertise.slice(0, at(pr.expertise, L) || 0);
    const jack = pr.jack && L >= pr.jack;
    const skills = ALL_SKILLS.map((name) => {
      const ab = SKILL_AB[name], p = !!sk.src[name], e = p && exp.includes(name);
      let b = m[ab] + (p ? PB : 0) + (e ? PB : 0) + (!p && jack ? Math.floor(PB / 2) : 0);
      const orderBonus = (C.order === "thaumaturge" && (name === "Arcana" || name === "Religion")) || (C.order === "magician" && (name === "Arcana" || name === "Nature"));
      if (orderBonus) b += Math.max(1, m.Wis);
      return { name, ab, p, e, b, from: sk.src[name] };
    });
    const resilient = featsTaken().filter((x) => x.f.name === "Resilient").map((x) => x.d.featAb).filter(Boolean);
    const saves = AB.map((a) => { const p = !!cls?.saves.includes(a) || resilient.includes(a); return { a, p, b: m[a] + (p ? PB : 0) }; });
    // Armour Class
    const arm = D.armour.find((a) => a.name === C.armour), sh = C.shield === "Shield" ? { name: "Shield", bonus: 2 } : D.shields.find((s) => s.name === C.shield);
    const opts = [];
    const shieldB = sh ? sh.bonus : 0;
    const defense = C.style === "Defense" || hasFeat("Defense");
    if (arm) {
      const dex = arm.cat === "light" ? m.Dex : arm.cat === "medium" ? Math.min(2, m.Dex) : 0;
      opts.push({ ac: arm.base + dex + shieldB + (defense ? 1 : 0), how: `${arm.name}${sh ? " and shield" : ""}${defense ? ", Defense" : ""}` });
    } else {
      opts.push({ ac: 10 + m.Dex + shieldB, how: sh ? "No armour, shield" : "No armour" });
      if (cls?.unarmored === "Con") opts.push({ ac: 10 + m.Dex + m.Con + shieldB, how: "Unarmored Defense" + (sh ? " and shield" : "") });
      if (cls?.unarmored === "Wis" && !sh) opts.push({ ac: 10 + m.Dex + m.Wis, how: "Unarmored Defense" });
      if (race?.natArmor) opts.push({ ac: race.natArmor + m.Dex + shieldB, how: "Scaled Hide" + (sh ? " and shield" : "") });
      if (sm.unarmoredAC && (!sh || sm.unarmoredNoShieldOK)) opts.push({ ac: 10 + m.Dex + m[sm.unarmoredAC] + (sh ? shieldB : 0), how: C.subclass + (sh ? " and shield" : "") });
    }
    const best = opts.sort((x, y) => y.ac - x.ac)[0];
    const warnings = [];
    if (arm && !armourProf(arm, P)) warnings.push(`You aren't trained in ${arm.cat} armour: Disadvantage on Strength and Dexterity rolls, and no spellcasting while wearing it.`);
    if (sh && !P.armor.has("Shields")) warnings.push("You aren't trained with shields, so a shield gives you no AC.");
    if (sh && !P.armor.has("Shields")) best.ac -= shieldB;
    let speed = (race?.speed || 30) + (sign?.speed || 0) + featMechs().reduce((s, x) => s + (x.m.speed || 0), 0);
    if (pr.unarmoredMovement && L >= pr.unarmoredMovement && !arm && !sh) speed += 10;
    if (pr.fastMovement && L >= pr.fastMovement && arm?.cat !== "heavy") speed += 10;
    if (arm && arm.str && S.fin.Str != null && S.fin.Str < arm.str) { speed -= 10; warnings.push(`Your Strength is below ${arm.str}, so ${arm.name} armour slows you by 10 feet.`); }
    let hp = null;
    if (cls) {  // level 1: the full hit die; later levels: the average or the player's roll, plus Constitution
      hp = cls.hitDie + m.Con + (sign?.hpPerLevel || 0);
      for (let n = 2; n <= L; n++) { const d = lvData(n), r = d.hpMode === "roll" && +d.hpRoll ? Math.min(cls.hitDie, Math.max(1, +d.hpRoll)) : cls.hitDie / 2 + 1; hp += Math.max(1, r + m.Con) + (sign?.hpPerLevel || 0); }

    const darkvision = sm.darkvision ? (race?.darkvision || 0) + sm.darkvision : race?.darkvision || 0;
    const per = skills.find((s) => s.name === "Perception");
    // Attacks
    const attacks = [];
    const strM = m.Str, dexM = m.Dex;
    const maDie = cls?.martialArts ? at(pr.martialDie, L) || cls.martialArts : null;  // monks use it for monk weapons when it's bigger
    const sides = (d) => +String(d).split("d")[1] || 0;
    C.weapons.filter(Boolean).forEach((wn) => {
      const w = D.weapons.find((x) => x.name === wn); if (!w) return;
      const ranged = /Ammunition/.test(w.props) || ["Dart", "Throwing knife", "Throwing star"].includes(w.name);

        notes: [w.props !== "—" ? w.props : "", C.mastery.slice(0, at(pr.mastery, L) || cls?.mastery || 0).includes(w.name) || C.sword === w.name ? `Mastery: ${w.mastery}` : "", sm.crit ? `crit on ${sm.crit}–20` : "", p ? "" : "not proficient"].filter(Boolean).join("; ") });

      dmg: ua || ma ? `${ma && (!ua || ma >= ua[0]) ? ma : ua[0]} ${sgn(uaM)} ${ua ? ua[1] : "Bludgeoning"}` : `${Math.max(1, 1 + strM)} Bludgeoning`, notes: "" });

    const spell = castAb ? { ab: castAb, dc: 8 + PB + m[castAb], atk: PB + m[castAb] } : null;
    const raceSp = race?.spellAbility ? { ab: C.raceAbility, dc: 8 + PB + m[C.raceAbility], atk: PB + m[C.raceAbility] } : null;
    const signSp = sign ? { ab: C.signAbility, dc: 8 + PB + m[C.signAbility], atk: PB + m[C.signAbility] } : null;

  }

  // ---------- builder UI ----------
  const opt = (v, label, sel, dis) => `<option value="${esc(v)}"${sel ? " selected" : ""}${dis ? " disabled" : ""}>${esc(label ?? v)}</option>`;

  const flatNames = (opts) => opts.flatMap((o) => (typeof o === "string" ? [o] : o.items));
  const spellPick = (key, n, opts, ph, blocked = []) => { const mk = (s, i) => ({ v: s, l: spellLabel(s), dis: blocked.includes(s) || (C[key].includes(s) && C[key][i] !== s) });
    return `<div class="row">${Array.from({ length: n }, (_, i) => sel(`${key}.${i}`, opts.map((o) => (typeof o === "string" ? mk(o, i) : { group: o.group, items: o.items.map((s) => mk(s, i)) })), C[key][i], ph)).join("")}</div>`; };

  const openSteps = new Set(JSON.parse(store.get("op-open") || '["1"]'));

  }

  function renderBuild() {

      if (bg.toolChoice) b3 += field("Your tool", sel("bgTool", D.tools[bg.toolChoice], C.bgTool, "Choose…"));
      X.sk.bgDups.forEach((s) => { const pre = taken([C.bgDup[s]]); b3 += field(`You already have ${s}: choose a different skill`, sel(`bgDup.${s}`, ALL_SKILLS.map((x) => ({ v: x, l: x, dis: pre.includes(x) })), C.bgDup[s], "Choose a skill…")); });
      if (X.P.bgToolDup) b3 += field(`You already have ${X.P.bgTool}: choose a different tool`, sel("bgToolDup", ANY_TOOL.map((t) => ({ v: t, l: t, dis: X.P.tools.some((x) => x.t === t && t !== C.bgToolDup) })), C.bgToolDup, "Choose a tool…"));

        b4 += field(`Gift of the Mage: ${ch.n} ${ch.list} cantrips`, spellPick("signCantrips", ch.n, spellList(ch.list, "cantrips"), "Choose a cantrip…", [...(race?.spells?.cantrips || []), ...C.cantrips.filter(Boolean)])); }

      && (!(sign.extraSlots && !cls?.cast) || C.signSpells.filter(Boolean).length >= sign.extraSlots);
    parts.push(step(4, "Your Birthsign", sign ? sign.name : "The sign you were born under", d4, guideLink("guide-birthsigns-of-tamriel", "Step Four in the guide") + b4));

    // 5. Ability scores
    const S = X.S;
    let b5 = `<div class="seg" role="group" aria-label="Method">${[["standard", "Standard array"], ["pointbuy", "Point buy"], ["dice", "Dice"]].map(([v, l]) => `<button type="button" data-method="${v}" aria-pressed="${C.method === v}">${l}</button>`).join("")}</div>`;
    let pool = null;
    if (C.method === "standard") { pool = STANDARD; b5 += `<p class="note">Put 15, 14, 13, 12, 10 and 8 in your six abilities, one each.</p>`; }
    if (C.method === "dice") {
      pool = C.rolls.map(Number);
      b5 += `<div class="rolls"><button class="btn primary" type="button" id="rollBtn">Roll 4d6 six times</button>${Array.from({ length: 6 }, (_, i) => `<input type="number" min="3" max="18" data-bind="rolls.${i}" value="${esc(C.rolls[i] ?? "")}" aria-label="Roll ${i + 1}">`).join("")}</div>
